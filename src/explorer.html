<!DOCTYPE html>
<!-- Served at / by every midwimble node. Self-contained: no fonts, scripts or
     images from anywhere else, so it works on a machine with no internet.
     Chain data is untrusted: everything is rendered as text, never as HTML. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>midwimble explorer</title>
<style>
  /* Light is the default: a white card on a grey page, one accent, no glow.
     The dark theme is the same sheet with the tokens swapped. */
  :root, [data-theme="light"] {
    --bg: #f4f4f5; --panel: #ffffff; --panel2: #fafafa; --panel3: #f4f4f5;
    --text: #18181b; --muted: #71717a;
    --green: #15803d; --purple: #4338ca; --lilac: #4338ca; --amber: #b45309; --fire: #b91c1c;
    --line: #e4e4e7; --line2: #d4d4d8;
    --max: 1200px; --r: 8px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [data-theme="dark"] {
    --bg: #0b0b0d; --panel: #141417; --panel2: #1b1b20; --panel3: #232329;
    --text: #f4f4f5; --muted: #a1a1aa;
    --green: #4ade80; --purple: #818cf8; --lilac: #a5b4fc; --amber: #fbbf24; --fire: #f87171;
    --line: #27272a; --line2: #3f3f46;
    --max: 1200px; --r: 8px;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--line2) transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased; }
  a { color: var(--lilac); text-decoration: none; }
  a:hover { text-decoration: underline; }
  b, strong { font-weight: 600; }

  /* ---------- top bar ---------- */
  header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar-top { max-width: var(--max); margin: 0 auto; padding: 0 20px; display: flex;
    gap: 28px; align-items: center; height: 58px; }
  .brand { display: flex; align-items: baseline; gap: 7px; color: var(--text); }
  .brand:hover { text-decoration: none; }
  .brand img { width: 24px; height: 24px; border-radius: 50%; align-self: center; }
  .brand b { font: 700 15px var(--sans); letter-spacing: .14em; text-transform: uppercase; }
  .brand span { color: var(--muted); font-size: 13px; letter-spacing: .02em; }
  nav { display: flex; align-items: center; gap: 0; font-size: 14.5px; }
  .bar-top nav a { padding: 19px 0; margin-right: 26px; color: var(--muted); border-bottom: 2px solid transparent; }
  .bar-top nav a:hover { color: var(--text); text-decoration: none; }
  .bar-top nav a.on { color: var(--text); border-bottom-color: var(--text); }
  .bar-top nav .sep { display: none; }
  .bar-status { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--muted);
    font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar-status i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  .theme-toggle { background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--muted);
    cursor: pointer; padding: 4px 8px; font-size: 13px; line-height: 1.2; }
  .theme-toggle:hover { color: var(--text); border-color: var(--line2); }
  .hamburger { display: none; background: none; border: 1px solid var(--line); border-radius: 6px;
    color: var(--text); cursor: pointer; padding: 4px 8px; font-size: 15px; line-height: 1.2; }
  #flash { max-width: var(--max); margin: 0 auto; padding: 8px 20px 0; color: var(--fire); font-size: 13px; }
  #flash:empty { display: none; }

  /* the search is a strip of its own: full width, like every other explorer */
  .bar-search { border-bottom: 1px solid var(--line); background: var(--panel); }
  .bar-search form { max-width: var(--max); margin: 0 auto; padding: 12px 20px; display: flex; }
  .bar-search input { flex: 1; min-width: 0; background: var(--panel); color: var(--text);
    border: 1px solid var(--line2); border-radius: 6px 0 0 6px; padding: 0 14px; height: 44px;
    font: 400 15px var(--sans); outline: none; }
  .bar-search input::placeholder { color: var(--muted); }
  .bar-search input:focus { border-color: var(--text); }
  .bar-search button { background: var(--text); color: var(--panel); border: 0; border-radius: 0 6px 6px 0;
    padding: 0 26px; font: 500 15px var(--sans); cursor: pointer; }
  .bar-search button:hover { opacity: .85; }
  @media (max-width: 860px) {
    .bar-top { gap: 12px; height: 52px; }
    .hamburger { display: inline-flex; margin-left: auto; }
    .bar-status { display: none; }
    .bar-top nav { display: none; }
    .bar-top.nav-open nav { display: flex; flex-direction: column; align-items: stretch;
      position: absolute; left: 0; right: 0; top: 52px; background: var(--panel);
      border-bottom: 1px solid var(--line); padding: 4px 20px 10px; }
    .bar-top.nav-open nav a { padding: 11px 0; margin: 0; border-bottom: 1px solid var(--line); font-size: 15px; }
    .bar-top.nav-open nav a:last-child { border-bottom: 0; }
    .bar-search form { padding: 10px 12px; }
    .bar-search input { height: 40px; font-size: 14px; }
    .bar-search button { padding: 0 16px; font-size: 14px; }
  }

  /* ---------- layout ---------- */
  main { padding: 24px 20px 56px; display: grid; gap: 16px; max-width: var(--max); margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  section > h2 { margin: 0; padding: 13px 18px; font: 600 15px var(--sans); color: var(--text);
    letter-spacing: 0; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  h2 .aside { color: var(--muted); font-weight: 400; font-size: 13px; letter-spacing: 0; }
  h2 .aside a { color: var(--muted); }
  h2 .aside a:hover { color: var(--text); text-decoration: none; }
  .crumb { display: flex; gap: 6px; align-items: center; padding: 0 0 6px;
    font-size: 13px; color: var(--muted); }
  .crumb a { color: var(--muted); }
  .crumb a:hover { color: var(--text); text-decoration: none; }
  .crumb .csep { opacity: .5; }
  .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .title h1 { margin: 0; font: 700 26px/1.25 var(--sans); letter-spacing: -.022em; }
  .title .dim { font-size: 15px; }
  .title .pager { margin-left: auto; display: flex; gap: 8px; }
  .btn { border: 1px solid var(--line2); border-radius: 6px; padding: 4px 12px; font-size: 13px; color: var(--text); }
  .btn:hover { border-color: var(--text); text-decoration: none; }
  .btn.off { color: var(--muted); opacity: .5; pointer-events: none; }

  /* ---------- kpis ---------- */
  /* one strip: the divider colour shows through a 1px grid gap, so a wrap
     never leaves a cell without a rule between it and its neighbours */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1px;
    background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  .kpi { background: var(--panel); padding: 15px 18px; }
  .kpis.four { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .kpi:hover { background: var(--panel2); }
  .kpi .label { color: var(--muted); font: 500 11px var(--sans); letter-spacing: .09em; text-transform: uppercase; }
  .kpi .value { font: 700 26px/1.2 var(--sans); letter-spacing: -.025em; margin-top: 4px;
    overflow-wrap: normal; white-space: nowrap; }
  .kpi .value.sm { font-size: 19px; letter-spacing: -.01em; }
  .kpi .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .kpi.hero-kpi { background: var(--panel2); }
  .kpi .value .unit { color: var(--muted); font-size: 14px; letter-spacing: 0; font-weight: 500; }
  @media (min-width: 900px) { .kpis.four { grid-template-columns: repeat(4, minmax(0,1fr)); } }
  @media (max-width: 900px) { .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); } }
  @media (max-width: 760px) { .kpi .value { font-size: 21px; } }

  /* ---------- dashboard: content column plus a rail ---------- */
  .dash { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
  .dash > * { min-width: 0; }
  .rail { display: grid; gap: 16px; }
  .rail-slot { display: grid; gap: 16px; }
  .rail-slot:empty { display: none; }
  @media (max-width: 980px) { .dash { grid-template-columns: 1fr; } }

  /* ---------- feed rows: a block or a kernel on one line ---------- */
  .feed { display: block; }
  .feed .frow { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px;
    align-items: center; padding: 13px 18px; border-bottom: 1px solid var(--line); color: inherit; }
  .feed .frow:last-child { border-bottom: 0; }
  .feed .frow:hover { background: var(--panel2); text-decoration: none; }
  .feed .ic { width: 32px; height: 32px; border-radius: 6px; background: var(--panel3); color: var(--muted);
    display: grid; place-items: center; font-size: 14px; }
  .feed .l1 { display: flex; gap: 8px; align-items: baseline; }
  .feed .l1 b { font: 600 15px var(--sans); }
  .feed .l1 span { color: var(--muted); font-size: 13px; }
  .feed .l2 { color: var(--muted); font-size: 13px; margin-top: 1px; display: flex; gap: 6px;
    align-items: center; flex-wrap: wrap; }
  .feed .r { font: 500 14px var(--sans); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .feed .r span { display: block; color: var(--muted); font-size: 12px; font-weight: 400; }

  /* compact key/value rows */
  .rows { padding: 0; }
  .rows .row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
    padding: 10px 18px; border-bottom: 1px solid var(--line); }
  .rows .row:last-child { border-bottom: 0; }
  .rows .rk { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .rows .rv { font: 500 14px var(--sans); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .rows .rv.hot { color: var(--amber); }

  /* ---------- generic cell grid (detail pages) ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); }
  .grid.four { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 900px) { .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .cell { padding: 14px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .k { color: var(--muted); font: 500 11px var(--sans); letter-spacing: .09em; text-transform: uppercase; }
  .cell .v { font-size: 18px; font-weight: 600; margin-top: 4px; overflow-wrap: anywhere; letter-spacing: -.015em; }
  .cell .v.small { font-size: 14px; font-weight: 500; letter-spacing: 0; }
  .cell .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

  /* ---------- bars, meters ---------- */
  .meter { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .meter span { display: block; height: 100%; background: var(--text); }
  .meter.hot span { background: var(--fire); }
  .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; display: flex; min-width: 44px; }
  .bar i { display: block; height: 100%; background: var(--text); }

  /* ---------- definition lists ---------- */
  dl { margin: 0; display: grid; grid-template-columns: minmax(150px, 230px) 1fr; }
  dt, dd { margin: 0; padding: 11px 18px; border-bottom: 1px solid var(--line); }
  dt { color: var(--muted); font: 400 14px var(--sans); }
  dd { overflow-wrap: anywhere; font-size: 14px; }
  dl > :nth-last-child(-n+2) { border-bottom: 0; }
  .hash { user-select: all; font: 400 13px var(--mono); }
  @media (max-width: 640px) { dl { grid-template-columns: 1fr; }
    dt { padding-bottom: 0; border-bottom: 0; } dd { padding-top: 2px; } }

  /* ---------- tables ---------- */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 11px 18px; color: var(--muted); font: 500 11px var(--sans);
    letter-spacing: .07em; text-transform: uppercase; border-bottom: 1px solid var(--line);
    white-space: nowrap; background: var(--panel); }
  td { padding: 12px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 14px;
    font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--panel2); }
  tbody tr.click { cursor: pointer; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .dim { color: var(--muted); }
  .mono { font-family: var(--mono); font-size: 13px; }

  /* ---------- tags ---------- */
  .tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font: 500 11.5px var(--sans);
    background: var(--panel3); color: var(--text); margin-right: 4px; }
  .tag.merged { background: var(--panel3); color: var(--muted); }
  .tag.ok { color: var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); }
  .tag.warn { color: var(--amber); background: color-mix(in srgb, var(--amber) 12%, transparent); }
  .tag.fire { color: var(--fire); background: color-mix(in srgb, var(--fire) 10%, transparent); }
  .callout { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    padding: 13px 18px; font-size: 14px; line-height: 1.6; color: var(--muted); }
  .callout b { color: var(--text); font-weight: 600; }
  .callout a { color: var(--text); text-decoration: underline; }
  .empty, .note { color: var(--muted); padding: 16px 18px; font-size: 14px; }
  .note { font-size: 13px; border-top: 1px solid var(--line); line-height: 1.6; }
  .note a { color: var(--text); text-decoration: underline; }

  /* ---------- charts ---------- */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .charts.two { grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); }
  .chart { padding: 14px 18px 16px; border-right: 1px solid var(--line); }
  .chart svg { width: 100%; height: 120px; display: block; margin-top: 8px; }
  .chart.tall svg { height: 168px; }
  .diagram { padding: 16px 18px 18px; }
  .diagram svg { width: 100%; display: block; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
  .viz { padding: 10px 18px 14px; }
  .viz svg { width: 100%; display: block; }

  svg a { cursor: pointer; }
  svg a:hover rect, svg a:hover circle, svg a:hover path { opacity: 1; }

  /* ---------- heatmap ---------- */
  .heat { display: grid; grid-template-columns: minmax(110px, auto) 1fr minmax(84px, auto); align-items: center; gap: 2px 12px; padding: 14px 18px 16px; }
  .heat svg { width: 100%; height: 12px; display: block; }
  .heat .lab { font-size: 13px; white-space: nowrap; }
  .heat .cnt { font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .heat .hd { color: var(--muted); font: 500 11px var(--sans); letter-spacing: .09em; text-transform: uppercase; }

  /* ---------- facts ---------- */
  .facts { display: grid; grid-template-columns: minmax(130px, auto) 1fr; gap: 1px 16px; padding: 8px 18px 16px; }
  .facts .who { color: var(--muted); font: 500 12px var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 9px 0; white-space: nowrap; }
  .facts .pills { padding: 7px 0; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .facts .yes, .facts .no { border-radius: 4px; padding: 1px 8px; font-size: 13px; }
  .facts .yes { color: var(--green); background: color-mix(in srgb, var(--green) 10%, transparent); }
  .facts .no { color: var(--muted); background: var(--panel3); }
  .facts .no::before { content: "× "; opacity: .6; }
  .facts .yes::before { content: "✓ "; opacity: .7; }

  /* ---------- flow strip ---------- */
  .flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; padding: 18px; }
  .flow .step { flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: var(--panel2); }
  .flow .arrow { align-self: center; padding: 0 10px; color: var(--muted); font-size: 16px; }

  /* ---------- burn ---------- */
  .banner { padding: 18px 18px 14px; font: 600 20px/1.45 var(--sans); border-bottom: 1px solid var(--line); }
  .banner b { color: var(--text); font-weight: 700; }
  .banner .sub { display: block; margin-top: 4px; font: 400 13px/1.6 var(--sans); color: var(--muted); }
  .banner .why { display: inline-block; margin-top: 6px; font: 400 13px/1.6 var(--sans); }
  .toggle { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .toggle button { background: var(--panel); color: var(--muted); border: 1px solid var(--line2); border-radius: 6px;
    padding: 3px 10px; font: 500 12.5px var(--sans); cursor: pointer; }
  .toggle button:hover { color: var(--text); }
  .toggle button.on { color: var(--panel); background: var(--text); border-color: var(--text); }
  .flame { display: inline-block; vertical-align: middle; width: 78px; height: 5px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .flame span { display: block; height: 100%; background: linear-gradient(90deg, var(--amber), var(--fire)); }
  .rank { font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hot { color: var(--amber); }
  .tagline { color: var(--muted); font-size: 12px; }
  th.sort { cursor: pointer; user-select: none; }
  th.sort:hover { color: var(--text); }

  /* ---------- tx rows ---------- */
  .txrow { border-bottom: 1px solid var(--line); }
  .txrow summary { padding: 13px 18px; cursor: pointer; display: grid; gap: 12px; align-items: center;
    grid-template-columns: minmax(120px, auto) 1fr auto; list-style: none; }
  .txrow summary::-webkit-details-marker { display: none; }
  .txrow summary:hover { background: var(--panel2); }
  .txrow .body { padding: 2px 18px 14px; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); padding: 0 10px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    padding: 12px 12px; font: 500 14px var(--sans); cursor: pointer; margin-bottom: -1px; white-space: nowrap; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--text); }

  footer { padding: 20px; color: var(--muted); font-size: 13px; text-align: center; }
  footer a { color: var(--muted); text-decoration: underline; }
  @media (max-width: 640px) {
    main { padding: 18px 12px 40px; gap: 12px; }
    .title h1 { font-size: 22px; }
    .kpi .value { font-size: 20px; }
    .tag.fire .word { display: none; }
    .flame { width: 54px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar-top">
    <a class="brand" href="#/"><img src="/logo.svg" alt=""><b>Midwimble</b><span>Explorer</span></a>
    <button id="hamburger" class="hamburger" aria-label="Menu" aria-expanded="false">&#9776;</button>
    <nav id="mainnav">
      <a href="#/">overview</a><a href="#/blocks">blocks</a><a href="#/bonds">bonds</a><a href="#/burn">burn</a>
      <a href="#/mempool">mempool</a><a href="#/privacy">privacy</a><a href="#/network">network</a>
      <a href="#/anchors">anchors</a><a href="#/relay">relay</a><a href="#/api">api</a>
    </nav>
    <div class="bar-status"><i></i>block <b id="tipHeight">&mdash;</b></div>
    <button id="themeToggle" class="theme-toggle" title="Switch theme">&#9728;</button>
  </div>
  <div id="flash"></div>
</header>
<div class="bar-search">
  <form id="search" autocomplete="off">
    <input id="q" placeholder="Search by height, block hash, commitment, kernel or bond" spellcheck="false">
    <button type="submit">Search</button>
  </form>
</div>
<main id="view"><div class="empty">loading…</div></main>
<footer>
  Served by this node from its own copy of the chain · JSON: <a href="/state">/state</a>,
  /explorer/{blocks, block/…, output/…, kernel/…, bonds, bond/…, burn, search/…}
</footer>
<script>
"use strict";
const COIN = 1e8;
const THEME_COL = {
  dark: { in: "#818cf8", out: "#2dd4bf", kern: "#52525b", faint: "rgba(255,255,255,.14)", amber: "#fbbf24", fire: "#f87171", green: "#4ade80", purple: "#818cf8", muted: "#a1a1aa", text: "#f4f4f5", bg: "#0b0b0d" },
  light: { in: "#4f46e5", out: "#0d9488", kern: "#a1a1aa", faint: "rgba(0,0,0,.12)", amber: "#b45309", fire: "#b91c1c", green: "#15803d", purple: "#4f46e5", muted: "#71717a", text: "#18181b", bg: "#f4f4f5" },
};
function themeColors() { return THEME_COL[document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark']; }
function toggleTheme() {
  const el = document.documentElement;
  const next = el.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  el.setAttribute('data-theme', next);
  localStorage.setItem('explorer-theme', next);
  document.getElementById('themeToggle').textContent = next === 'light' ? '\u2600' : '\u263E';
  route();
}
const view = document.getElementById("view");

// ---------- small helpers: every value goes in as text --------------------
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;

const short = (x, n = 10) => x ? String(x).slice(0, n) + "\u2026" : "\u2014";

// ---------- charts --------------------------------------------------------
const SVG = "http://www.w3.org/2000/svg";
function svg(tagName, attrs, ...kids) {
  const n = document.createElementNS(SVG, tagName);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
  kids.forEach(k => n.appendChild(k));
  return n;
}
function svgLink(href, kid, title) {
  const a = svg("a", { href });
  if (title) kid.appendChild(svg("title")).textContent = title;
  a.appendChild(kid);
  return a;
}
function barChart(values, { colour = null, log = false, label = String, href = null } = {}) {
  const W = 600, H = 120, f = log ? (v => Math.log10(1 + v)) : (v => v);
  const max = Math.max(...values.map(f), 1e-9), bw = W / Math.max(values.length, 1);
  const w = Math.min(18, Math.max(0.8, bw * 0.72));
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  values.forEach((v, i) => {
    if (!v) return;
    const bh = Math.max(1, (f(v) / max) * (H - 4));
    const r = svg("rect", { x: i * bw + (bw - w) / 2, y: H - bh, width: w, height: bh, fill: colour || themeColors().in, opacity: .85 });
    s.appendChild(href ? svgLink(href(i), r, label(v, i)) : (r.appendChild(svg("title")).textContent = label(v, i), r));
  });
  return s;
}
// A 0..1 series as a filled area, for shares that only make sense against

function shareChart(values, colour, label = String) {
  const W = 600, H = 120, n = Math.max(values.length - 1, 1);
  const pts = values.map((v, i) => `${(i / n) * W},${H - 6 - Math.max(0, Math.min(1, v)) * (H - 12)}`);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" },
    svg("polygon", { points: `0,${H} ` + pts.join(" ") + ` ${W},${H}`, fill: colour, opacity: .16 }),
    svg("polyline", { points: pts.join(" "), fill: "none", stroke: colour, "stroke-width": 2, "vector-effect": "non-scaling-stroke" }));
  values.forEach((v, i) => {
    const t = svg("rect", { x: (i / n) * W - 1, y: 0, width: 2, height: H, fill: "transparent" });
    t.appendChild(svg("title")).textContent = label(v, i);

}



// A slim ribbon: one bar per block, height by transactions. The same pulse as
// the block table, without spending a screenful to say it.
function activityRibbon(blocks) {
  const b = blocks.slice().sort((p, q) => p.height - q.height);
  if (!b.length) return h("div", { class: "empty" }, "no blocks yet");
  const W = 1200, H = 46, n = b.length, bw = W / n;
  const max = Math.max(1, ...b.map(x => x.kernels || 0));
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", style: "height:46px" });
  b.forEach((x, i) => {
    const k = x.kernels || 0;
    const bh = Math.max(2, (k / max) * (H - 6));
    const a = svgLink("#/block/" + x.height, svg("rect", {
      x: i * bw, y: H - bh, width: Math.max(bw - 0.7, 0.5), height: bh, rx: 1,
      fill: x.full_weight === false ? themeColors().fire : themeColors().text,
      opacity: (x.full_weight === false ? 0.9 : 0.16 + 0.62 * (k / max)).toFixed(2),
    }), "block " + x.height + " \u00b7 " + k + " tx \u00b7 " + utc(x.timestamp));
    s.appendChild(a);
  });

}

// Minted vs withheld as one ring: the missing wedge is the burn.
function donut(minted, withheld, label) {
  const total = minted + withheld;
  if (!total) return h("div", { class: "empty" }, "nothing minted yet");
  const W = 196, R = 72, cx = W / 2, cy = W / 2, sw = 24;
  const circ = 2 * Math.PI * (R - sw / 2);
  const frac = withheld / total;
  const s = svg("svg", { viewBox: `0 0 ${W} ${W}`, role: "img", style: "width:196px;height:196px;margin:6px auto 0" });
  const ring = (colour, dash, offset, op) => svg("circle", { cx, cy, r: R - sw / 2, fill: "none", stroke: colour, "stroke-width": sw,
    "stroke-dasharray": dash + " " + (circ - dash), "stroke-dashoffset": offset, transform: `rotate(-90 ${cx} ${cy})`, opacity: op || 1 });
  s.appendChild(ring(themeColors().faint, circ, 0, 1));
  if (frac > 0) s.appendChild(ring(themeColors().fire, circ * frac, -circ * (1 - frac), .95));
  const p = svg("text", { x: cx, y: cy - 2, fill: themeColors().text, "font-size": 26, "font-weight": 700, "text-anchor": "middle" });
  p.textContent = pct(frac, 1);

  const t = svg("text", { x: cx, y: cy + 18, fill: themeColors().muted, "font-size": 10, "text-anchor": "middle" });
  t.textContent = label || "of the schedule withheld";
  s.appendChild(t);
  return s;

// ---------- diagrams ------------------------------------------------------
const COL = () => themeColors();
const slot = (i, n, from, to) => from + ((i + 0.5) * (to - from)) / Math.max(n, 1);

// Ages colour an input by how long its output sat before this block spent
// it: a cooling ramp, not a warning one.
function ageBands() { const c = themeColors(); return [[10, c.in, "\u226410 blocks"], [100, c.kern, "\u2264100"], [1000, "#c4b5fd", "\u22641k"], [Infinity, "#e9e4ff", ">1k"]]; }
const ageColour = a => a == null ? "#4a4458" : (ageBands().find(([hi]) => a <= hi) || ageBands()[3])[1];

// A block is one aggregated transaction: its inputs and kernels are
// flattened and sorted, so nothing says which input funded which output.
// The diagram draws that as the complete set of possibilities, because the
// absence of those edges IS the privacy property.
function anatomyDiagram(b) {
  const ins = b.inputs || [];
  const groups = (b.output_groups || []).map((g, gi) => ({ ...g, gi, coinbase: false }));
  if (b.coinbase) groups.unshift({ gi: -1, coinbase: true, outputs: b.coinbase.outputs.length,
    range_proof_bytes: b.coinbase.range_proof_bytes, commitments: b.coinbase.outputs.map(o => o.commitment) });
  const outs = [];
  groups.forEach(g => (g.commitments || []).forEach(c => outs.push({ g, c })));
  const kerns = (b.kernels || []).concat(b.coinbase ? [b.coinbase.kernel] : []);
  if (!ins.length && !outs.length) return h("div", { class: "empty" }, "nothing to draw: this block carries no transactions");

  const CAPN = 28;
  const si = ins.slice(0, CAPN), so = outs.slice(0, CAPN), sk = kerns.slice(0, CAPN);
  const W = 760, pad = 26;
  const H = Math.max(180, 2 * pad + Math.max(si.length, so.length, sk.length) * 20);
  const xIn = 100, xKern = W / 2 - 30, xOut = W - 200;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const yi = i => slot(i, si.length, pad, H - pad);
  const yo = i => slot(i, so.length, pad, H - pad);
  const yk = i => slot(i, sk.length, pad + 6, H - pad - 6);

  const edges = si.length * so.length;
  if (edges && edges <= 420) {
    si.forEach((_, i) => so.forEach((_, j) => s.appendChild(svg("line", {
      x1: xIn + 7, y1: yi(i), x2: xOut - 7, y2: yo(j),
      stroke: COL().faint, "stroke-width": 0.4, opacity: Math.max(0.05, 1.6 / Math.sqrt(edges)),
    }))));
  } else if (edges) {
    s.appendChild(svg("path", { d: `M${xIn + 7},${yi(0)} L${xOut - 7},${yo(0)} L${xOut - 7},${yo(so.length - 1)} L${xIn + 7},${yi(si.length - 1)} Z`,
      fill: COL().faint, opacity: .07 }));
  }

  sk.forEach((k, i) => {
    const y = yk(i);
    s.appendChild(svg("rect", { x: xKern - 30, y: y - 8, width: 60, height: 16, rx: 8, fill: themeColors().bg, opacity: .92 }));
    const d = svg("path", { d: `M${xKern - 7},${y} L${xKern},${y - 6} L${xKern + 7},${y} L${xKern},${y + 6} Z`, fill: COL().kern, opacity: .9 });
    d.appendChild(svg("title")).textContent =
      (k.fee ? "fee " + coins(k.fee) : "no fee") + "\n" + k.excess + "\nproves a transaction balanced \u2014 not which one";
    s.appendChild(d);
  });

  si.forEach((inp, i) => {
    const age = inp.created_height != null ? b.height - inp.created_height : null;
    const r = svg("rect", { x: xIn - 7, y: yi(i) - 6, width: 14, height: 12, rx: 3, fill: ageColour(age), opacity: .9 });
    r.appendChild(svg("title")).textContent = inp.commitment +
      (age != null ? "\ncreated in block " + inp.created_height + " \u2014 " + age + " blocks earlier" : "\ncreating block not indexed");
    s.appendChild(r);
  });

  // Outputs, boxed by the transaction that made them. Hovering a box lifts
  // its members and dims the rest.
  const allOut = [];
  groups.forEach(g => {
    const mine = so.map((o, i) => [o, i]).filter(([o]) => o.g === g).map(([, i]) => i);
    if (!mine.length) return;
    const top = yo(mine[0]) - 11, bot = yo(mine[mine.length - 1]) + 11;
    const stroke = g.coinbase ? COL().amber : COL().out;
    const box = svg("rect", { x: xOut - 13, y: top, width: 176, height: bot - top, rx: 7,
      fill: stroke, "fill-opacity": .06, stroke, "stroke-opacity": .35, "stroke-width": 1 });
    s.appendChild(box);
    const t = svg("text", { x: xOut + 18, y: (top + bot) / 2 + 4, fill: stroke, "font-size": 10, opacity: .9 });
    t.textContent = (g.coinbase ? "coinbase" : "tx") + " \u00b7 " + g.outputs + " out \u00b7 " + g.range_proof_bytes + "B";
    s.appendChild(t);
    const mates = mine.map(i => {
      const o = so[i];
      const r = svg("rect", { x: xOut - 7, y: yo(i) - 6, width: 14, height: 12, rx: 3,
        fill: g.coinbase ? COL().amber : COL().out, opacity: .9 });
      r.appendChild(svg("title")).textContent = o.c + (g.coinbase ? "\ncoinbase output, value public" : "\ncreated with " + (g.outputs - 1) + " sibling" + (g.outputs === 2 ? "" : "s"));
      s.appendChild(r);
      allOut.push(r);
      return r;
    });
    if (g.outputs > 1) {
      const lift = on => allOut.forEach(r => r.setAttribute("opacity", mates.includes(r) ? (on ? 1 : .9) : (on ? .2 : .9)));
      [box, t].forEach(e => { e.addEventListener("mouseenter", () => lift(true)); e.addEventListener("mouseleave", () => lift(false)); });
      box.setAttribute("style", "cursor: help");
    }
  });

  const label = (x, y, txt, fill, anchor) => {
    const t = svg("text", { x, y, fill, "font-size": 11, "text-anchor": anchor || "start" });
    t.textContent = txt;
    return t;
  };
  s.appendChild(label(xIn, 16, ins.length + " inputs", COL().in, "middle"));
  s.appendChild(label(xKern, 16, kerns.length + " kernels", COL().kern, "middle"));
  const funded = (b.outputs || []).length;
  s.appendChild(label(xOut + 10, 16, funded + " outputs" + (b.coinbase ? " + coinbase" : ""), COL().out, "middle"));
  s.appendChild(label(xKern, H - 6, "a kernel proves a transaction balanced, never which one", themeColors().muted, "middle"));
  if (ins.length > CAPN) s.appendChild(label(xIn, H - 6, "+" + (ins.length - CAPN) + " more", themeColors().muted, "middle"));

  return h("div", { class: "diagram" }, s,
    h("div", { class: "legend" },
      h("span", null, h("i", { style: "background:" + COL().out }), "output \u00b7 boxed with its transaction's siblings"),
      h("span", null, h("i", { style: "background:" + COL().amber }), "coinbase \u00b7 value public"),
      h("span", null, h("i", { style: "background:" + COL().kern }), "kernel"),
      ...ageBands().map(([, c, t]) => h("span", null, h("i", { style: "background:" + c }), "input " + t))));
}

// Where this block's coins came from and went: an output knows its creating
// block and its spending block, and nothing in between.
function spendArcs(b) {
  const back = new Map(), fwd = new Map();
  (b.inputs || []).forEach(i => i.created_height != null && back.set(i.created_height, (back.get(i.created_height) || 0) + 1));
  (b.outputs || []).concat((b.coinbase && b.coinbase.outputs) || [])
    .forEach(o => o.spent_height != null && fwd.set(o.spent_height, (fwd.get(o.spent_height) || 0) + 1));
  if (!back.size && !fwd.size) return h("div", { class: "empty" }, "no spends to or from this block yet");

  const dists = [...back.keys(), ...fwd.keys()].map(x => Math.abs(x - b.height));
  const span = Math.log10(1 + Math.max(1, ...dists));
  const W = 680, H = 190, mid = H / 2, half = W / 2 - 30;
  const xOf = hh => {
    const d = hh - b.height;
    return W / 2 + (Math.sign(d) * Math.log10(1 + Math.abs(d)) / (span || 1)) * half;
  };
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  s.appendChild(svg("line", { x1: 14, y1: mid, x2: W - 14, y2: mid, stroke: themeColors().faint.replace(".5", ".25"), "stroke-width": 1 }));
  const arc = (hh, n, up, colour) => {
    const x = xOf(hh), lift = (up ? -1 : 1) * (mid - 18);
    const d = `M${x},${mid} Q${(x + W / 2) / 2},${mid + lift} ${W / 2},${mid}`;
    const p = svg("path", { d, fill: "none", stroke: colour, "stroke-width": Math.min(4, 0.8 + Math.log2(1 + n)), opacity: .55 });
    const tip = n + (n === 1 ? " output" : " outputs") + (up ? " created in block " : " spent in block ") + hh +
      " (" + Math.abs(hh - b.height) + " blocks " + (up ? "earlier" : "later") + ")";
    const hit = svg("path", { d, fill: "none", stroke: "transparent", "stroke-width": 14 });
    const a = svgLink("#/block/" + hh, hit, tip);
    a.appendChild(p);
    s.appendChild(a);
    s.appendChild(svgLink("#/block/" + hh, svg("circle", { cx: x, cy: mid, r: 2.5, fill: colour, opacity: .8 })));
  };
  [...back.entries()].forEach(([hh, n]) => arc(hh, n, true, COL().in));
  [...fwd.entries()].forEach(([hh, n]) => arc(hh, n, false, COL().out));
  s.appendChild(svg("circle", { cx: W / 2, cy: mid, r: 4.5, fill: themeColors().text }));
  const txt = (x, y, t, fill, anchor) => {
    const e = svg("text", { x, y, fill, "font-size": 11, "text-anchor": anchor });
    e.textContent = t;
    return e;
  };
  s.appendChild(txt(W / 2, mid - 10, "block " + num(b.height), themeColors().text, "middle"));
  s.appendChild(txt(14, 14, "spent here, created earlier \u2191", COL().in, "start"));
  s.appendChild(txt(14, H - 6, "created here, spent later \u2193", COL().out, "start"));
  s.appendChild(txt(W - 14, mid + 16, "later \u2192", themeColors().muted, "end"));
  s.appendChild(txt(14, mid + 16, "\u2190 earlier", themeColors().muted, "start"));
  return h("div", { class: "diagram" }, s, h("div", { class: "legend" },
    h("span", null, "distance is logarithmic, so a coinbase spent thousands of blocks later stays on the chart"),
    h("span", null, "thickness is how many outputs share that block")));
}

// The ages of the outputs this block spent.
function ageHistogram(b) {
  const ages = (b.inputs || []).map(i => i.created_height != null ? b.height - i.created_height : null).filter(x => x != null);
  if (!ages.length) return null;
  const buckets = [[1, 1, "same"], [2, 10, "2\u201310"], [11, 100, "11\u2013100"], [101, 1000, "101\u20131k"],
                   [1001, 10000, "1k\u201310k"], [10001, Infinity, "10k+"]];
  const counts = buckets.map(([lo, hi]) => ages.filter(a => a >= lo && a <= hi).length);
  const W = 680, H = 96, max = Math.max(1, ...counts), bw = W / counts.length;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}` });
  counts.forEach((c, i) => {
    const bh = (c / max) * (H - 34);
    if (c) {
      const r = svg("rect", { x: i * bw + bw * 0.3, y: H - 22 - bh, width: bw * 0.4, height: Math.max(2, bh), rx: 3, fill: COL().in, opacity: .85 });
      r.appendChild(svg("title")).textContent = c + " spent after " + buckets[i][2] + " blocks";
      s.appendChild(r);
      const v = svg("text", { x: i * bw + bw / 2, y: H - 26 - bh, fill: themeColors().text, "font-size": 11, "text-anchor": "middle" });
      v.textContent = c;
      s.appendChild(v);
    }
    const t = svg("text", { x: i * bw + bw / 2, y: H - 6, fill: themeColors().muted, "font-size": 10, "text-anchor": "middle" });
    t.textContent = buckets[i][2];
    s.appendChild(t);
  });
  return h("div", { class: "diagram" }, s,
    h("div", { class: "legend" }, h("span", null, "blocks between an output being created and this block spending it")));
}

// Who learns what, as pills rather than paragraphs.
function facts(rows) {
  const grid = h("div", { class: "facts" });
  rows.forEach(([who, knows, blind]) => {
    grid.appendChild(h("div", { class: "who" }, who));
    grid.appendChild(h("div", { class: "pills" },
      knows.map(k => h("span", { class: "yes" }, k)),
      blind.map(k => h("span", { class: "no" }, k))));
  });
  return grid;
}

// Dandelion++: a transaction walks a private stem, one peer at a time, then
// fluffs out to everyone.
function dandelionDiagram(d) {
  const C = themeColors();
  const W = 760, H = 230, y = 118, x0 = 58, xF = 568;
  const hops = Math.max(1, Math.min(5, Math.round(d.expected_hops)));
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const dot = (cx, cy, r, fill, op) => svg("circle", { cx, cy, r, fill, opacity: op == null ? 1 : op });
  const txt = (x, yy, t, fill, anchor, size) => {
    const e = svg("text", { x, y: yy, fill, "font-size": size || 11, "text-anchor": anchor || "middle" });
    e.textContent = t;
    return e;
  };
  const step = (xF - x0) / (hops + 1);
  s.appendChild(svg("line", { x1: x0, y1: y, x2: xF, y2: y, stroke: C.purple, "stroke-width": 2, opacity: .45 }));
  const fan = 11;
  for (let i = 0; i < fan; i++) {
    const a = -1.15 + (i / (fan - 1)) * 2.3, len = 74 + (i % 3) * 16;
    const ex = xF + Math.cos(a) * len, ey = y + Math.sin(a) * len;
    s.appendChild(svg("line", { x1: xF, y1: y, x2: ex, y2: ey, stroke: C.out, "stroke-width": 1, opacity: .3 }));
    s.appendChild(dot(ex, ey, 3.5, C.out, .75));
  }
  const burst = dot(xF, y, 6, "none", 1);
  burst.setAttribute("stroke", C.out);
  burst.appendChild(svg("animate", { attributeName: "r", values: "6;64", dur: "1.6s", begin: "2.4s;burst.end+2.4s", id: "burst", repeatCount: "1" }));
  burst.appendChild(svg("animate", { attributeName: "opacity", values: ".9;0", dur: "1.6s", begin: "2.4s;burst.end+2.4s", repeatCount: "1" }));
  s.appendChild(burst);

  const base = d.fluff_percent + "% chance of fluffing at each hop \u00b7 about " + d.expected_hops.toFixed(1) + " hops \u00b7 " + d.stem_timeout_secs + "s embargo";
  const caption = txt(W / 2, H - 10, base, C.muted, "middle", 11);
  const tells = (cx, what, colour) => {
    const hit = svg("circle", { cx, cy: y, r: 22, fill: "transparent", style: "cursor: help" });
    hit.addEventListener("mouseenter", () => { caption.textContent = what; caption.setAttribute("fill", colour); });
    hit.addEventListener("mouseleave", () => { caption.textContent = base; caption.setAttribute("fill", C.muted); });
    s.appendChild(hit);
  };
  for (let i = 0; i <= hops; i++) {
    const cx = x0 + step * i;
    s.appendChild(dot(cx, y, i === 0 ? 9 : 6, i === 0 ? C.text : C.purple, i === 0 ? 1 : .85));
    s.appendChild(txt(cx, y - (i === 0 ? 20 : 18), i === 0 ? "you" : "hop " + i, i === 0 ? C.text : C.muted, "middle", i === 0 ? 11 : 10));
    tells(cx, i === 0 ? "you hold it \u00b7 nobody else has seen it yet"
      : i === 1 ? "knows your address, and that you sent it \u2014 not that you wrote it"
      : "knows only the hop before it \u00b7 " + i + " nodes from you now", i === 0 ? C.text : C.kern);
  }
  s.appendChild(dot(xF, y, 9, C.out));
  s.appendChild(txt(xF, y - 22, "fluff", C.out));
  tells(xF, "broadcasts to everyone \u00b7 what they see is a node that probably did not write it", C.out);
  const car = dot(0, 0, 4.5, C.amber);
  car.appendChild(svg("animateMotion", { dur: "2.4s", repeatCount: "indefinite", path: `M${x0},${y} L${xF},${y}` }));
  s.appendChild(car);
  s.appendChild(txt(W / 2, 30, "stem \u00b7 one peer at a time, nobody else sees it", C.kern));
  s.appendChild(txt(x0, H - 34, "your node", C.muted, "start", 10));
  s.appendChild(txt(xF + 86, H - 34, "the whole network", C.muted, "end", 10));
  s.appendChild(caption);
  return h("div", { class: "diagram" }, s);
}

// This node's peers: direction is the line, transport is the dot.
function peerMap(n) {
  const C = themeColors();
  const peers = n.peers || [];
  if (!peers.length) return h("div", { class: "empty" }, "no peers connected");
  const W = 760, H = 330, cx = W / 2, cy = H / 2, R = 128;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const COLOURS = { tcp: C.purple, quic: C.kern, webrtc: C.out, other: C.muted };
  peers.forEach((p, i) => {
    const a = (i / peers.length) * Math.PI * 2 - Math.PI / 2;
    const rr = R + (p.outbound ? 0 : 42);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    s.appendChild(svg("line", { x1: cx, y1: cy, x2: x, y2: y,
      stroke: p.outbound ? C.out : C.purple, "stroke-width": p.outbound ? 1.4 : 0.8,
      opacity: p.outbound ? .4 : .22, "stroke-dasharray": p.outbound ? null : "3 4" }));
    const c = svg("circle", { cx: x, cy: y, r: p.outbound ? 6 : 4.5,
      fill: COLOURS[p.transport] || COLOURS.other, opacity: p.outbound ? .95 : .6 });
    c.appendChild(svg("title")).textContent =
      p.id + "\n" + (p.outbound ? "outbound \u2014 this node dialled it" : "inbound \u2014 it dialled this node") +
      "\n" + p.transport + " \u00b7 " + p.addr;
    s.appendChild(c);
  });
  s.appendChild(svg("circle", { cx, cy, r: 11, fill: C.text }));
  s.appendChild(svg("circle", { cx, cy, r: 11, fill: "none", stroke: C.text, "stroke-width": 1, opacity: .5 },
    svg("animate", { attributeName: "r", values: "11;34", dur: "3s", repeatCount: "indefinite" }),
    svg("animate", { attributeName: "opacity", values: ".5;0", dur: "3s", repeatCount: "indefinite" })));
  const lab = svg("text", { x: cx, y: cy + 30, fill: C.text, "font-size": 11, "text-anchor": "middle" });
  lab.textContent = "this node";
  s.appendChild(lab);
  return h("div", { class: "diagram" }, s, h("div", { class: "legend" },
    h("span", null, h("i", { style: "background:" + COLOURS.tcp }), "tcp"),
    h("span", null, h("i", { style: "background:" + COLOURS.quic }), "quic"),
    h("span", null, h("i", { style: "background:" + COLOURS.webrtc }), "webrtc"),
    h("span", null, "solid line, larger dot \u2014 outbound"),
    h("span", null, "dashed line \u2014 inbound"),
    h("span", null, "addresses are shown without their host")));
}

// Newest kernels, read from the tip blocks' details. Kept to a handful: this is
// a rail, and the mempool page is where the full list belongs.
async function kernelsPanel(blocks) {

async function overview() {
  const [s, recent, bonds, burn] = await Promise.all([
    get("/state"), get("/explorer/blocks?count=120"), get("/explorer/bonds"),
    get("/explorer/burn").catch(() => null),
  ]);
  const blocks = recent.blocks;
  const timed = blocks.filter(b => b.interval != null).slice().reverse();
  const intervals = timed.map(b => b.interval);
  const avg = intervals.length ? intervals.reduce((a, b) => a + b, 0) / intervals.length : null;
  const bits = blocks.length ? blocks[0].difficulty_bits : 0;
  const hashrate = avg ? Math.pow(2, bits) / Math.max(avg, 1) : null;
  const supplyPct = s.supply / s.max_supply;

  const supplyTile = kpi("circulating supply", coinShort(s.supply),
    (supplyPct < 0.0001 ? "<0.01%" : pct(supplyPct)) + " of " + coinShort(s.max_supply));

  const kpis = h("div", { class: "kpis four" },
    kpi("latest block", num(s.height), "this node's tip"),
    kpi("last block", ago(s.timestamp), utcShort(s.timestamp)),
    supplyTile,
    kpi("block reward", coinShort(s.block_reward), "era " + s.era),
    kpi("difficulty", bits.toFixed(2) + " bits", "expected attempts a block"),
    kpi("network rate", hashrate ? rate(hashrate) : "\u2014", "hashes a second", { small: true }),
    kpi("mempool", num(s.mempool_count) + " tx", num(s.mempool_weight) + " weight"),
    kpi("bonds in use", num(bonds.window.in_use),
      "of " + num(bonds.window.eligible) + " eligible \u00b7 cap " + num(bonds.window.cap)));

  // Everything else lives in the rail, in the dense key/value shape a block
  // explorer reader expects, so the fold belongs to the block feed.
  const row = (k, v, cls) => h("div", { class: "row" },
    h("span", { class: "rk" }, k), h("span", { class: "rv" + (cls ? " " + cls : "") }, v));
  const newBlockRow = row("new blocks", "0");
  newBlocksEl = newBlockRow.querySelector(".rv");

  // "How long until I find a block at my hashrate" is the question a new
  // miner actually has, so the rail carries the calculator inline.
  const calcRow = (() => {
    const input = h("input", { type: "number", min: "1", value: "1000000",
      style: "width:84px;background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:4px;padding:1px 4px;font:400 13px var(--sans);text-align:right" });
    const wait = hr => {
      const secs = Math.round(Math.pow(2, bits) / (hr || 1));
      return bits ? (secs < 1 ? "<1s" : dur(secs)) : "\u2014";
    };
    const out = h("span", null, wait(1e6));
    input.addEventListener("input", () => { out.textContent = wait(Number(input.value)); });
    return h("div", { class: "row" },
      h("span", { class: "rk" }, "expected time"),
      h("span", { class: "rv" }, out, " \u00b7 ", input, " att/s"));
  })();

  const networkRail = section("Network", null, h("div", { class: "rows" },
    row("avg block time", avg ? dur(Math.round(avg)) : "\u2014"),
    row("peers", String(s.peers.length)),
    row("utxos", num(s.utxos)),
    row("kernels", num(s.kernels)),
    row("this node", (s.mining ? "mining" : "relay") + " \u00b7 " + (s.syncing ? "syncing" : "in sync")),
    calcRow,
    newBlockRow));

  const burnStrip = burn && burn.active && burn.burned > 0
    ? h("div", { class: "callout" }, h("b", null, coinShort(burn.burned)), " burned so far \u00b7 effective max supply ",
        h("b", null, coinShort(burn.effective_max_supply)), " \u00b7 ", h("a", { href: "#/burn" }, "why \u2192"))
    : null;

  const kernelsSlot = h("div", { class: "rail-slot" });
  const rail = h("div", { class: "rail" }, kernelsSlot, networkRail);
  const latest = section("Latest blocks", h("a", { href: "#/blocks" }, "all blocks \u2192"), blockFeed(blocks.slice(0, 12)));
  view.replaceChildren(
    h("div", { class: "title" },
      h("h1", null, "Midwimble explorer"),
      h("span", { class: "dim" }, "Blocks, coins and bonds, live from this node.")),
    kpis,
    burnStrip,
    h("div", { class: "dash" }, latest, rail),
    section("Mining bonds", h("a", { href: "#/bonds" }, "details \u2192"), bondTable(bonds, 6)));
  // The kernel rail needs per-block detail, so it fills in after the first
  // paint rather than holding the whole page hostage.
  kernelsPanel(blocks).then(sec => { if (sec && kernelsSlot.isConnected) kernelsSlot.replaceChildren(sec); }).catch(() => {});
  schedule(overview, 10000);
  if (!sseConn) {
    newSinceLoad = 0;
    try {
      sseConn = new EventSource("/explorer/events");
      sseConn.addEventListener("block", () => {
        newSinceLoad++;
        refreshTip();
        if (newBlocksEl && newBlocksEl.isConnected) newBlocksEl.textContent = String(newSinceLoad);
      });
      sseConn.onerror = () => { if (sseConn) { sseConn.close(); sseConn = null; } };
    } catch (_) { sseConn = null; }
  }
}

// How settled a block is: its confirmations, and how many counted in full.
function burialText(x) {
  const n = x.confirmations, f = x.full_weight_confirmations;
  const text = num(n) + " confirmation" + (n === 1 ? "" : "s");
  if (x.finalized) return text + " \u00b7 finalized";
  if (f == null) return text;
  return f === n ? text + " \u00b7 all full weight" : text + " \u00b7 " + num(f) + " at full weight";
}
function burialNote(x) {
  if (x.finalized) return "below the finalized checkpoint: no reorganisation can replace it";
  const f = x.full_weight_confirmations;
  if (f == null) return "deeper than any reorganisation this node will make";
  if (f === 0) return "no full-weight block yet: one could replace it";
  return "replacing it takes a branch heavier than " + num(f) + " full-weight block" + (f === 1 ? "" : "s");
}

// ---------- transaction graph ---------------------------------------------
// The chain records two edges per coin and nothing else: the block that
// created an output, and the block that spent it. That is enough to walk a
// graph of blocks - not of addresses, which do not exist here. At every hop
// the exact coin is unknown, only the set, so each node says how many coins
// pass through it.
const traceCache = new Map();
async function blockAt(h) {
  if (!traceCache.has(h)) {
    traceCache.set(h, await get("/explorer/block/" + h));
    // Bounded: a long-lived tab would otherwise keep every block it ever saw.
    while (traceCache.size > 120) traceCache.delete(traceCache.keys().next().value);
  }
  return traceCache.get(h);
}

async function buildTrace(startHeight, depth = 3, perLevel = 7) {
  const nodes = new Map();   // height -> {h, depth, count, role}
  const edges = [];
  const touch = (h, d, role, n) => {
    let node = nodes.get(h);
    if (!node) { node = { h, depth: d, count: 0, role }; nodes.set(h, node); }
    node.count += n;
    if (node.role !== role) node.role = node.role === "centre" ? "centre" : "both";
    return node;
  };
  const edge = (from, to, count) => {
    const found = edges.find(x => x.from === from && x.to === to);
    if (found) found.count += count;
    else edges.push({ from, to, count });
  };
  // One level of the walk, fetched together: a depth-3 trace is ~40 blocks
  // and a serial walk makes the page look hung.
  const level = hh => Promise.all(hh.map(h => blockAt(h).catch(() => null)));
  const nextLevel = (blocks, pick) => {
    const counts = new Map();
    for (const b of blocks) {
      if (!b) continue;
      const seen = new Map();
      for (const [h, c] of pick(b)) seen.set(h, (seen.get(h) || 0) + c);
      for (const [h, c] of seen) counts.set(h, (counts.get(h) || 0) + c);
    }
    return [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, perLevel);
  };

  touch(startHeight, 0, "centre", 1);
  // backwards: which blocks funded this one
  let frontier = [startHeight];
  for (let d = 1; d <= depth; d++) {
    const blocks = await level(frontier);
    const parents = nextLevel(blocks, b => b.inputs.filter(i => i.created_height != null).map(i => [i.created_height, 1]));
    if (!parents.length) break;
    for (const [h, c] of parents) touch(h, -d, "ancestor", c);
    for (const b of blocks) {
      if (!b) continue;
      for (const i of b.inputs) if (i.created_height != null && nodes.has(i.created_height)) edge(i.created_height, b.height, 1);
    }
    frontier = parents.map(([h]) => h);
  }
  // forwards: where this block's coins went
  frontier = [startHeight];
  for (let d = 1; d <= depth; d++) {
    const blocks = await level(frontier);
    const children = nextLevel(blocks, b =>
      (b.outputs || []).concat((b.coinbase && b.coinbase.outputs) || [])
        .filter(o => o.spent_height != null).map(o => [o.spent_height, 1]));
    if (!children.length) break;
    for (const [h, c] of children) touch(h, d, "descendant", c);
    for (const b of blocks) {
      if (!b) continue;
      for (const o of (b.outputs || []).concat((b.coinbase && b.coinbase.outputs) || []))
        if (o.spent_height != null && nodes.has(o.spent_height)) edge(b.height, o.spent_height, 1);
    }
    frontier = children.map(([h]) => h);
  }
  return { nodes: [...nodes.values()], edges };
}

function traceDiagram(t) {
  const nodes = t.nodes;
  const byHeight = new Map(nodes.map(n => [n.h, n]));
  // Only draw an edge whose two ends were laid out: a node fetched across a
  // reorg can report a height that is no longer in the graph.
  const edges = t.edges.filter(e => byHeight.has(e.from) && byHeight.has(e.to));
  if (nodes.length < 2) return h("div", { class: "empty" }, "this block has no recorded neighbours yet");
  const depths = [...new Set(nodes.map(n => n.depth))].sort((a, b) => a - b);
  const cols = new Map(depths.map(d => [d, nodes.filter(n => n.depth === d).sort((a, b) => b.count - a.count)]));
  const W = 980, pad = 30, colW = (W - pad * 2) / Math.max(depths.length - 1, 1);
  const maxCount = Math.max(...nodes.map(n => n.count), 1);
  const rOf = n => 5 + Math.sqrt(n.count / maxCount) * 20;
  // lay out: each column needs enough vertical room for its bubbles
  const yOf = new Map();
  let H = 260;
  depths.forEach(d => {
    const col = cols.get(d);
    const gap = 16;
    const heights = col.reduce((a, n) => a + rOf(n) * 2 + gap, 0);
    H = Math.max(H, heights + 80);
  });
  depths.forEach(d => {
    const col = cols.get(d);
    const total = col.reduce((a, n) => a + rOf(n) * 2 + 16, 0);
    let y = (H - total) / 2 + 8;
    col.forEach(n => { const r = rOf(n); yOf.set(n.h, y + r); y += r * 2 + 16; });
  });
  const xOf = d => pad + depths.indexOf(d) * colW;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const colourOf = n => n.role === "ancestor" ? themeColors().in : n.role === "descendant" ? themeColors().out
    : n.role === "centre" ? themeColors().text : themeColors().kern;
  const maxEdge = Math.max(...edges.map(e => e.count), 1);
  edges.forEach(e => {
    const a = byHeight.get(e.from), b = byHeight.get(e.to);
    const x1 = xOf(a.depth) + rOf(a);
    const x2 = xOf(b.depth) - rOf(b);
    const y1 = yOf.get(e.from), y2 = yOf.get(e.to);
    const mx = (x1 + x2) / 2;
    const p = svg("path", { d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`, fill: "none",
      stroke: themeColors().faint, "stroke-width": Math.min(3.5, .5 + Math.log2(1 + e.count)), opacity: .55 });
    p.appendChild(svg("title")).textContent = e.count + " coin" + (e.count === 1 ? "" : "s") + " created in " + e.from + " spent in " + e.to;
    s.appendChild(p);
  });
  nodes.forEach(n => {
    const cx = xOf(n.depth), cy = yOf.get(n.h), r = rOf(n);
    const c = svg("circle", { cx, cy, r, fill: colourOf(n), opacity: n.role === "centre" ? .95 : .35,
      stroke: colourOf(n), "stroke-width": n.role === "centre" ? 2 : 1.2 });
    s.appendChild(svgLink("#/block/" + n.h, c, "block " + n.h + "\n" + n.count + " coins pass through"));
    if (r > 13 || n.role === "centre") {
      const t = svg("text", { x: cx, y: cy + 3, fill: themeColors().text, "font-size": 9.5, "text-anchor": "middle", "font-weight": 600 });
      t.textContent = num(n.h);
      s.appendChild(t);
    }
    if (n.count > 1) {
      const cap = svg("text", { x: cx, y: cy + r + 12, fill: themeColors().muted, "font-size": 9, "text-anchor": "middle" });
      cap.textContent = n.count + " coins";
      s.appendChild(cap);
    }
  });
  const lbl = (d, text) => {
    const e = svg("text", { x: xOf(d), y: 18, fill: themeColors().muted, "font-size": 10, "text-anchor": "middle" });
    e.textContent = text;
    s.appendChild(e);
  };
  const first = depths[0], last = depths[depths.length - 1];
  lbl(first, "funded by");
  lbl(0, "this block");
  lbl(last, "spent later");
  return h("div", { class: "diagram" }, s, h("div", { class: "legend" },
    h("span", null, h("i", { style: "background:" + themeColors().in }), "ancestor block"),
    h("span", null, h("i", { style: "background:" + themeColors().text }), "this block"),
    h("span", null, h("i", { style: "background:" + themeColors().out }), "descendant block"),
    h("span", null, "area \u00b7 coins passing through \u00b7 the figure is that count")));
}

          h("span", { class: t.withheld ? "hot" : "dim" }, (t.withheld / COIN).toLocaleString(undefined, { maximumFractionDigits: 2 })),
          h("span", null, flame(f), "  ", h("span", { class: f ? "hot" : "dim" }, pct(f))),
          mintedPct(t),
          pct(ratio(t.blocks, net.blocks)),
          b.streak ? h("span", { class: "hot", title: "longest run " + num(b.longest_streak) }, "\ud83d\udd25 " + num(b.streak)) : h("span", { class: "dim" }, "\u2014"),
        ];
      }), [2, 4, 5, 6]),
      h("div", { class: "note" }, "Top " + top.length + " of " + ranked.length + ", ranked by MDW never minted; the column adds up to the network's " +
        (net.withheld / COIN).toLocaleString(undefined, { maximumFractionDigits: 2 }) + " MDW for the period."));
  };
  draw();
  return section("Burn leaderboard", aside, body);
}

function burnTotals(r) {
  const all = r.periods.all;
  const minted = all.minted, withheld = all.withheld;
  return h("div", { class: "grid" },
    (() => { const c = stat("minted since the switch", coins(minted), "of " + coins(minted + withheld) + " scheduled"); return c; })(),
    stat("withheld", h("span", { class: "hot" }, coins(withheld)), pct(ratio(withheld, minted + withheld)) + " of issuance"),
    stat("over-cap blocks", num(all.tapered), "of " + num(all.blocks) + " since the switch"),
    stat("consensus check", r.complete ? (r.consensus.matches ? h("span", { style: "color:var(--green)" }, "\u2713 adds up") : h("span", { class: "hot" }, "\u26a0 mismatch")) : h("span", { class: "dim" }, "partial"),
      r.complete ? "coinbases = schedule \u2212 supply" : "block records from " + num(r.indexed_from), true));
}

function stackChart(buckets, label) {
  const W = 600, H = 170, max = Math.max(1, ...buckets.map(b => b.minted + b.withheld));
  const bw = W / Math.max(buckets.length, 1);
  const w = Math.min(34, bw * 0.66);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  buckets.forEach((b, i) => {
    const mh = (b.minted / max) * (H - 4), wh = (b.withheld / max) * (H - 4);
    const x = i * bw + (bw - w) / 2;
    const g = svg("g");
    g.appendChild(svg("rect", { x, y: H - mh, width: w, height: Math.max(0, mh), fill: themeColors().green, opacity: .7 }));
    if (wh > 0) g.appendChild(svg("rect", { x, y: H - mh - wh, width: w, height: wh, fill: themeColors().fire, opacity: .95 }));
    g.appendChild(svg("title")).textContent = label(b);
    s.appendChild(g);
  });
  return s;
}

function burnChart(r) {
  const body = h("div"), aside = h("span");
  const draw = () => {
    aside.replaceChildren(toggle([["days", "per day"], ["kblocks", "per 1,000 blocks"]], burnSeries, k => { burnSeries = k; draw(); }));
    const buckets = r.series[burnSeries];
    if (!buckets.length) { body.replaceChildren(h("div", { class: "empty" }, "nothing to chart before the mainnet switch")); return; }
    const name = b => burnSeries === "days" ? utcDay(b.day) + " UTC" : "blocks " + num(b.from) + "\u2013" + num(b.from + 999);
    body.replaceChildren(
      h("div", { class: "chart tall" }, h("div", { class: "k" }, "MDW a " + (burnSeries === "days" ? "day" : "1,000 blocks")),
        stackChart(buckets, b => name(b) + "\nminted " + coins(b.minted) + " \u00b7 withheld " + coins(b.withheld) + " (" + pct(ratio(b.withheld, b.scheduled)) + " of schedule)")),
      h("div", { class: "legend", style: "padding: 0 18px 12px" },
        h("span", null, h("i", { style: "background:" + themeColors().green }), "minted"),
        h("span", null, h("i", { style: "background:" + themeColors().fire }), "withheld, never minted")));
  };
  draw();
  return section("Minted and withheld", aside, body);
}

// The bond page's share of the same report.
function bondBurn(burn) {
  if (!burn) return null;
  const more = h("a", { href: "#/burn" }, "leaderboard \u2192");
  if (!burn.active) return section("Burn", more, h("div", { class: "empty" }, "The over-cap taper starts at the mainnet switch, " + utc(burn.switch) + "."));
  const b = burn.bond;
  if (!b || !b.all.blocks) return section("Burn", more, h("div", { class: "empty" }, "This bond has signed no block since the switch."));
  const { all, day, week } = b, w = burn.window, f = ratio(all.withheld, all.scheduled) || 0;
  const burned = cell("burned since the switch", coinShort(all.withheld));
  burned.appendChild(meter(f, true));
  const period = (k, t) => t.blocks
    ? stat(k, coinShort(t.withheld), pct(ratio(t.minted, t.scheduled)) + " of the subsidy minted")
    : stat(k, h("span", { class: "dim" }, "\u2014"), "no blocks");
  return section("Burn", more, h("div", { class: "grid" },
    burned,
    stat("rank", all.rank != null ? "#" + num(all.rank) + " of " + num(burn.ranked) : "\u2014", null),
    stat("full subsidy minted", mintedPct(all)),
    period("last 24h", day),
    period("last 7 days", week),
    stat("burn streak", num(b.streak), "longest " + num(b.longest_streak), true)));
}

// ---------- privacy --------------------------------------------------------
async function privacyPage() {
  const r = await get("/explorer/blocks?count=200");
  const b = r.blocks.slice().reverse();
  const outs = b.map(x => x.body_outputs != null ? x.body_outputs : x.outputs);
  const txs = b.map(x => x.kernels);
  const linked = b.map(x => x.linked_outputs || 0);
  const pairs = b.map((x, i) => x.inputs * outs[i]);
  const mix = b.map((x, i) => txs[i] ? (x.inputs + outs[i]) / txs[i] : 0);
  const carried = b.map((x, i) => i).filter(i => outs[i] > 0);
  const share = carried.map(i => linked[i] / outs[i]);
  const sum = a => a.reduce((p, c) => p + c, 0);
  const busy = b.filter((_, i) => txs[i] > 0).length;
  const totOut = sum(outs), totLinked = sum(linked), totTx = sum(txs);
  const meanPairs = busy ? sum(pairs) / busy : 0;
  const meanMix = busy ? sum(mix.filter((_, i) => txs[i] > 0)) / busy : 0;

  view.replaceChildren(
    h("div", { class: "title" }, h("h1", null, "Privacy"),
      h("span", { class: "dim" }, "what the chain does and does not reveal, over its last " + num(b.length) + " blocks")),
    h("div", { class: "kpis" },
      kpi("blocks", num(b.length), "examined"),
      kpi("with a transaction", num(busy), "the rest were empty"),
      kpi("transactions", num(totTx), "one kernel, one transaction"),
      kpi("pairings a block", busy ? num(Math.round(meanPairs)) : "\u2014", "assignments left consistent"),
      kpi("public siblings", totOut ? pct(totLinked / totOut) : "\u2014", "outputs that share a proof"),
      kpi("aggregation", busy ? meanMix.toFixed(2) : "\u2014", "in+out per transaction")),
    section("Measured", "refreshes every 20s",
      h("div", { class: "charts two" },
        h("div", { class: "chart" }, h("div", { class: "k" }, "pairings a block permits \u00b7 log scale"),
          barChart(pairs, { log: true, colour: themeColors().in, label: (v, i) => v + " pairings in block " + b[i].height })),
        h("div", { class: "chart" }, h("div", { class: "k" }, "share of outputs with a public sibling"),
          carried.length ? shareChart(share, themeColors().amber, (v, k) => pct(v) + " of " + outs[carried[k]] + " outputs in block " + b[carried[k]].height)
            : h("div", { class: "empty" }, "no transactions in this span")),
        h("div", { class: "chart" }, h("div", { class: "k" }, "transactions a block"),
          barChart(txs, { colour: themeColors().out, label: (v, i) => v + " in block " + b[i].height })),
        h("div", { class: "chart" }, h("div", { class: "k" }, "inputs + outputs per transaction"),
          barChart(mix, { colour: themeColors().kern, label: (v, i) => v.toFixed(2) + " in block " + b[i].height })))),
    h("div", { class: "note", style: "border-top:0" },
      "No amount, address or sender is read: the chain records none. These measure how much aggregation hides."));
  schedule(privacyPage, 20000);
}

function apiValue(v) {
  if (v == null) return h("span", { class: "dim" }, "\u2014");
  if (typeof v === "string") return v;
  if (typeof v === "number" || typeof v === "boolean") return String(v);
  if (Array.isArray(v)) return v.map(x => apiValue(x)).join(", ");
  return h("span", null, Object.entries(v).map(([k, x], i) => [i ? " \u00b7 " : null, h("span", { class: "dim" }, k + ": "), apiValue(x)]));
}

// ---------- routing, refresh, search ---------------------------------------
let timer = null, generation = 0, sseConn = null, newSinceLoad = 0, newBlocksEl = null;
function schedule(fn, ms) {
  const mine = generation;
  clearTimeout(timer);
  timer = setTimeout(() => { if (mine === generation) fn().catch(() => {}); }, ms);
}
const routes = [
  [/^#?\/?$/, overview],
  [/^#\/blocks(?:\/(\d+))?$/, blocksPage],
  [/^#\/block\/(\d+|[0-9a-fA-F]{64})$/, blockPage],
  [/^#\/output\/([0-9a-fA-F]{64})$/, outputPage],
  [/^#\/kernel\/([0-9a-fA-F]{64})$/, kernelPage],
  [/^#\/bonds$/, bondsPage],
  [/^#\/burn$/, burnPage],
  [/^#\/privacy$/, privacyPage],
  [/^#\/network$/, networkPage],
  [/^#\/mempool$/, mempoolPage],
  [/^#\/bond\/([0-9a-fA-F]{64})$/, bondPage],
  [/^#\/trace\/(\d+|[0-9a-fA-F]{64})$/, tracePage],
  [/^#\/api$/, apiPage],
  [/^#\/anchors$/, anchorsPage],
  [/^#\/relay$/, relayPage],
];
const NAV_SECTION = { block: "blocks", output: "blocks", kernel: "blocks", bond: "bonds" };
function markNav(hash) {
  const head = hash.replace(/^#?\/?/, "").split("/")[0];
  const section = NAV_SECTION[head] || head;
  for (const a of document.querySelectorAll(".bar-top nav a")) {
    const target = (a.getAttribute("href") || "").replace(/^#\/?/, "");
    a.classList.toggle("on", target === section);
  }
}
async function route() {
  generation++;
  clearTimeout(timer);
  if (sseConn) { sseConn.close(); sseConn = null; }
  const hash = location.hash || "#/";
  markNav(hash);
  if (hash.replace(/^#?\/?/, "").split("/")[0] !== "block") blockTab = "overview";
  const found = routes.find(([re]) => re.test(hash));
  window.scrollTo(0, 0);
  if (!found) { view.replaceChildren(section("Not found", null, h("div", { class: "empty" }, "No page at " + hash + "."))); return; }
  try { await found[1](hash.match(found[0])); }
  catch (e) { view.replaceChildren(section("Nothing here", null, h("div", { class: "empty" }, e.message))); }
}
document.getElementById("search").addEventListener("submit", async ev => {
  ev.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  try {
    const r = await get("/explorer/search/" + encodeURIComponent(q));
    document.getElementById("q").value = "";
    location.hash = "#/" + r.kind + "/" + r.id;
  } catch (e) { flash(e.message); }
});
// The bar keeps the tip in view on every page, the way an explorer should.
async function refreshTip() {
  try {
    const r = await get("/explorer/blocks?count=1");
    const el = document.getElementById("tipHeight");
    if (el && r && r.tip != null) el.textContent = num(r.tip);
  } catch (_) {}
}
refreshTip();
setInterval(refreshTip, 30000);
document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);

const barTop = document.querySelector('.bar-top');
const hamburger = document.getElementById('hamburger');
function setNav(open) {
  barTop.classList.toggle('nav-open', open);
  hamburger.setAttribute('aria-expanded', open ? 'true' : 'false');
}
hamburger?.addEventListener('click', () => setNav(!barTop.classList.contains('nav-open')));
document.getElementById('mainnav')?.addEventListener('click', e => { if (e.target.closest('a')) setNav(false); });
window.addEventListener('hashchange', () => setNav(false));
window.addEventListener("hashchange", route);
(function initTheme() {
  const saved = localStorage.getItem('explorer-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = saved === 'light' ? '\u2600' : '\u263E';
})();
route();
</script>
