<!DOCTYPE html>
<!-- Served at / by every midwimble node. Self-contained: no fonts, scripts or
     images from anywhere else, so it works on a machine with no internet.
     Chain data is untrusted: everything is rendered as text, never as HTML. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>midwimble explorer</title>
<style>
  :root, [data-theme="dark"] {
    --bg: #060609; --panel: #0d0c13; --panel2: #14121d; --panel3: #1a1726;
    --text: #f2f1f6; --muted: #938fa6;
    --green: #00ff41; --purple: #8b5cf6; --lilac: #a78bfa; --amber: #f5c451; --fire: #ff8a3d;
    --line: rgba(167, 139, 250, .16); --line2: rgba(167, 139, 250, .30);
    --max: 1240px; --r: 14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  [data-theme="light"] {
    --bg: #f7f6fb; --panel: #ffffff; --panel2: #f2f0f8; --panel3: #e9e5f4;
    --text: #16162a; --muted: #6b6899;
    --green: #059669; --purple: #7c3aed; --lilac: #6d28d9; --amber: #b45309; --fire: #c2410c;
    --line: rgba(124, 58, 237, .14); --line2: rgba(124, 58, 237, .28);
    --max: 1240px; --r: 14px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scrollbar-color: var(--line2) transparent; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.55 var(--sans);
    transition: background .2s, color .2s; -webkit-font-smoothing: antialiased; }
  a { color: var(--lilac); text-decoration: none; }
  a:hover { text-decoration: underline; }
  b, strong { font-weight: 650; }

  /* ---------- top bar ---------- */
  header { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line);
    background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); }
  .bar-top { max-width: var(--max); margin: 0 auto; padding: 10px 18px; display: flex;
    gap: 18px; align-items: center; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 9px; color: var(--text); }
  .brand:hover { text-decoration: none; }
  .brand img { width: 26px; height: 26px; border-radius: 50%; }
  .brand b { font: 650 13px var(--sans); letter-spacing: .2em; text-transform: uppercase; }
  nav { display: flex; align-items: center; gap: 1px; font-size: 13px; }
  .bar-top nav a { padding: 5px 10px; border-radius: 8px; color: var(--muted); transition: .15s; }
  .bar-top nav a:hover { color: var(--text); background: var(--panel2); text-decoration: none; }
  .bar-top nav a.on { color: var(--text); background: var(--panel3); box-shadow: inset 0 -2px 0 var(--lilac); }
  .bar-top nav .sep { width: 1px; height: 16px; background: var(--line); margin: 0 6px; }
  form { flex: 1; display: flex; min-width: 220px; }
  form input { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 9px 0 0 9px; padding: 7px 12px; font: 500 12px var(--mono); outline: none; }
  form input:focus { border-color: var(--lilac); }
  form button { background: var(--purple); color: #fff; border: 0; border-radius: 0 9px 9px 0;
    padding: 0 14px; font: 600 12px var(--sans); cursor: pointer; }
  form button:hover { filter: brightness(1.1); }
  .theme-toggle { background: none; border: 1px solid var(--line); border-radius: 9px; color: var(--muted);
    cursor: pointer; padding: 5px 9px; font-size: 14px; line-height: 1; }
  .theme-toggle:hover { color: var(--text); border-color: var(--lilac); }
  .hamburger { display: none; background: none; border: 1px solid var(--line); border-radius: 9px;
    color: var(--text); cursor: pointer; padding: 5px 9px; font-size: 15px; line-height: 1; }
  #flash { max-width: var(--max); margin: 0 auto; padding: 0 18px; color: var(--amber); font-size: 12px; min-height: 0; }
  @media (max-width: 900px) {
    .hamburger { display: inline-flex; margin-left: auto; }
    .bar-top nav { display: none; }
    .bar-top.nav-open nav { display: flex; flex-direction: column; align-items: stretch;
      width: 100%; order: 10; padding: 6px 0; border-top: 1px solid var(--line); }
    .bar-top.nav-open nav a { padding: 9px 12px; font-size: 15px; }
    .bar-top nav .sep { display: none; }
    .bar-top form { order: 6; flex-basis: 100%; }
    .brand { margin-right: 0; }
    .theme-toggle { order: 2; }
  }

  /* ---------- layout ---------- */
  main { padding: 20px 18px 40px; display: grid; gap: 14px; max-width: var(--max); margin: 0 auto; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    overflow: hidden; }
  section > h2 { margin: 0; padding: 11px 18px; font: 700 10.5px var(--sans); letter-spacing: .2em;
    text-transform: uppercase; color: var(--lilac); border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; gap: 12px; align-items: center; }
  h2 .aside { color: var(--muted); letter-spacing: .04em; text-transform: none; font-weight: 500; font-size: 12px; }
  h2 .aside a { color: var(--lilac); }
  .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 2px 2px 0; }
  .title h1 { margin: 0; font: 650 21px var(--sans); letter-spacing: -.01em; }
  .title .dim { font-size: 13px; }
  .title .pager { margin-left: auto; display: flex; gap: 8px; }
  .btn { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 12px; color: var(--text); }
  .btn:hover { border-color: var(--lilac); text-decoration: none; }
  .btn.off { color: var(--muted); opacity: .4; pointer-events: none; }

  /* ---------- kpis ---------- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 10px; }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; }
  .kpi .label { color: var(--muted); font: 650 10px var(--sans); letter-spacing: .12em; text-transform: uppercase; }
  .kpi .value { font: 650 20px var(--mono); letter-spacing: -.03em; margin-top: 3px; overflow-wrap: normal; white-space: nowrap; }
  .kpi .value.sm { font-size: 15px; letter-spacing: -.01em; }
  .kpi .sub { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
  .kpi.hero-kpi { background: linear-gradient(160deg, var(--panel3), var(--panel)); border-color: var(--line2); }
  .kpi .value .unit { color: var(--muted); font-size: 12px; letter-spacing: 0; }

  /* ---------- generic cell grid (detail pages) ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); }
  .cell { padding: 13px 18px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .k { color: var(--muted); font: 650 10px var(--sans); letter-spacing: .14em; text-transform: uppercase; }
  .cell .v { font-size: 17px; margin-top: 2px; word-break: break-all; letter-spacing: -.02em; }
  .cell .v.small { font-size: 13px; letter-spacing: 0; }
  .cell .sub { color: var(--muted); font-size: 11.5px; margin-top: 2px; }

  /* ---------- bars, meters ---------- */
  .meter { height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; margin-top: 7px; }
  .meter span { display: block; height: 100%; background: linear-gradient(90deg, var(--purple), var(--green)); }
  .meter.hot span { background: linear-gradient(90deg, var(--purple), var(--fire)); }
  .bar { height: 6px; border-radius: 3px; background: var(--panel3); overflow: hidden; display: flex; min-width: 44px; }
  .bar i { display: block; height: 100%; }

  /* ---------- definition lists ---------- */
  dl { margin: 0; display: grid; grid-template-columns: minmax(140px, 210px) 1fr; }
  dt, dd { margin: 0; padding: 8px 18px; border-bottom: 1px solid var(--line); }
  dt { color: var(--muted); font: 650 10px var(--sans); letter-spacing: .12em; text-transform: uppercase; padding-top: 10px; }
  dd { word-break: break-all; font-size: 14px; }
  dl > :nth-last-child(-n+2) { border-bottom: 0; }
  .hash { user-select: all; font: 500 12.5px var(--mono); }

  /* ---------- tables ---------- */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 18px; color: var(--muted); font: 650 10px var(--sans);
    letter-spacing: .13em; text-transform: uppercase; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 8px 18px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 13.5px; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: var(--panel2); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .dim { color: var(--muted); }

  /* ---------- tags ---------- */
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font: 600 10.5px var(--mono);
    letter-spacing: .04em; border: 1px solid var(--line); margin-right: 4px; color: var(--muted); }
  .tag.merged { color: var(--lilac); border-color: var(--line2); }
  .tag.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 35%, transparent); }
  .tag.warn { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
  .tag.fire { color: var(--fire); border-color: color-mix(in srgb, var(--fire) 45%, transparent); }
  .empty, .note { color: var(--muted); padding: 12px 18px; }
  .note { font-size: 11.5px; border-top: 1px solid var(--line); line-height: 1.6; }
  .note a { color: var(--lilac); }

  /* ---------- charts ---------- */
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .charts.two { grid-template-columns: repeat(auto-fit, minmax(430px, 1fr)); }
  .chart { padding: 12px 18px 14px; border-right: 1px solid var(--line); }
  .chart svg { width: 100%; height: 120px; display: block; margin-top: 8px; }
  .chart.tall svg { height: 168px; }
  .diagram { padding: 14px 18px 16px; }
  .diagram svg { width: 100%; display: block; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 11px; letter-spacing: .03em; margin-top: 9px; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: 0; }
  .viz { padding: 6px 18px 14px; }

  /* ---------- block train ---------- */
  .train { display: flex; gap: 8px; overflow-x: auto; padding: 12px 18px 14px; scrollbar-width: thin; }
  .train a { flex: 0 0 132px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; color: var(--text); transition: transform .16s, border-color .16s; }
  .train a:hover { transform: translateY(-2px); border-color: var(--lilac); text-decoration: none; }
  .train a.fresh { animation: slidein .5s ease-out; border-color: color-mix(in srgb, var(--green) 55%, transparent); }
  @keyframes slidein { from { opacity: 0; transform: translateX(-22px); } }
  .train .hh { font: 650 15px var(--mono); color: var(--lilac); }
  .train .sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .train a.light { border-style: dashed; border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
  .train a.light .hh, .train .sub.light { color: var(--amber); }
  svg a { cursor: pointer; }
  svg a:hover rect, svg a:hover circle, svg a:hover path { opacity: 1; }

  /* ---------- heatmap ---------- */
  .heat { display: grid; grid-template-columns: minmax(110px, auto) 1fr minmax(84px, auto); align-items: center; gap: 2px 12px; padding: 12px 18px 14px; }
  .heat svg { width: 100%; height: 12px; display: block; }
  .heat .lab { font-size: 12px; white-space: nowrap; }
  .heat .cnt { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .heat .hd { color: var(--muted); font: 650 10px var(--mono); letter-spacing: .13em; text-transform: uppercase; }

  /* ---------- facts ---------- */
  .facts { display: grid; grid-template-columns: minmax(130px, auto) 1fr; gap: 1px 16px; padding: 6px 18px 14px; }
  .facts .who { color: var(--muted); font: 650 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 8px 0; white-space: nowrap; }
  .facts .pills { padding: 6px 0; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .facts .yes, .facts .no { border-radius: 999px; padding: 1px 9px; font-size: 11.5px; border: 1px solid transparent; }
  .facts .yes { color: var(--green); border-color: color-mix(in srgb, var(--green) 30%, transparent); background: color-mix(in srgb, var(--green) 6%, transparent); }
  .facts .no { color: var(--muted); border-color: var(--line); opacity: .8; }
  .facts .no::before { content: "\00d7 "; opacity: .6; }
  .facts .yes::before { content: "\2713 "; opacity: .7; }

  /* ---------- flow strip ---------- */
  .flow { display: flex; align-items: stretch; gap: 0; flex-wrap: wrap; padding: 16px 18px; }
  .flow .step { flex: 1; min-width: 180px; border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; background: var(--panel2); }
  .flow .arrow { align-self: center; padding: 0 10px; color: var(--muted); font-size: 16px; }

  /* ---------- burn ---------- */
  .banner { padding: 16px 18px 12px; font: 600 18px/1.5 var(--sans); border-bottom: 1px solid var(--line); }
  .banner b { color: var(--amber); font-weight: 700; }
  .banner .sub { display: block; margin-top: 3px; font: 500 11.5px/1.6 var(--mono); color: var(--muted); }
  .banner .why { display: inline-block; margin-top: 5px; font: 500 11.5px/1.6 var(--mono); }
  .toggle { display: inline-flex; gap: 5px; flex-wrap: wrap; }
  .toggle button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px;
    padding: 1px 10px; font: 600 10.5px var(--mono); letter-spacing: .04em; cursor: pointer; }
  .toggle button:hover { color: var(--text); }
  .toggle button.on { color: var(--text); border-color: var(--lilac); background: color-mix(in srgb, var(--lilac) 12%, transparent); }
  .flame { display: inline-block; vertical-align: middle; width: 78px; height: 5px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--fire) 12%, transparent); }
  .flame span { display: block; height: 100%; background: linear-gradient(90deg, var(--amber), var(--fire), #ff4d4d); }
  .rank { font-weight: 700; color: var(--lilac); font-variant-numeric: tabular-nums; }
  .hot { color: var(--amber); }
  .tagline { color: var(--muted); font-size: 11px; }
  th.sort { cursor: pointer; user-select: none; }
  th.sort:hover { color: var(--text); }

  /* ---------- tx rows ---------- */
  .txrow { border-bottom: 1px solid var(--line); }
  .txrow summary { padding: 9px 18px; cursor: pointer; display: grid; gap: 12px; align-items: center;
    grid-template-columns: minmax(120px, auto) 1fr auto; list-style: none; }
  .txrow summary::-webkit-details-marker { display: none; }
  .txrow summary:hover { background: var(--panel2); }
  .txrow .body { padding: 2px 18px 12px; }

  /* ---------- hero ---------- */
  .hero { padding: 34px 18px 24px; text-align: center; }
  .hero h1 { font: 700 27px var(--sans); margin: 0 0 4px; letter-spacing: -.02em; }
  .hero p { color: var(--muted); margin: 0 0 18px; font-size: 13.5px; }
  .hero form { max-width: 620px; margin: 0 auto; display: flex; min-width: 0; }
  .hero form input { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line2);
    border-radius: 11px 0 0 11px; padding: 13px 16px; font: 500 14px var(--sans); outline: none; }
  .hero form input::placeholder { color: var(--muted); opacity: .85; }
  .hero form input:focus { border-color: var(--lilac); }
  .hero form button { background: var(--purple); color: #fff; border: 0; border-radius: 0 11px 11px 0;
    padding: 0 20px; font: 600 14px var(--sans); cursor: pointer; }
  .hero form button:hover { filter: brightness(1.08); }
  .hero .quick { margin-top: 12px; font-size: 11.5px; color: var(--muted); display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 14px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted);
    padding: 10px 14px; font: 650 12.5px var(--sans); cursor: pointer; margin-bottom: -1px; white-space: nowrap; }
  .tabs button:hover { color: var(--text); }
  .tabs button.on { color: var(--text); border-bottom-color: var(--lilac); }

  footer { padding: 16px 18px 30px; color: var(--muted); font-size: 10.5px; text-align: center; letter-spacing: .04em; }
  footer a { color: var(--muted); }
  @media (max-width: 640px) {
    .hero { padding: 22px 12px 18px; }
    .hero h1 { font-size: 22px; }
    dl { grid-template-columns: 1fr; }
    dt { border-bottom: 0; padding-bottom: 0; }
    .tag.fire .word { display: none; }
    .flame { width: 54px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar-top">
    <a class="brand" href="#/"><img src="/logo.svg" alt=""><b>Midwimble</b></a>
    <button id="hamburger" class="hamburger" aria-label="Menu" aria-expanded="false">&#9776;</button>
    <nav id="mainnav">
      <a href="#/">overview</a><a href="#/blocks">blocks</a><a href="#/bonds">bonds</a><a href="#/burn">burn</a>
      <span class="sep"></span>
      <a href="#/mempool">mempool</a><a href="#/privacy">privacy</a><a href="#/network">network</a>
      <span class="sep"></span>
      <a href="#/anchors">anchors</a><a href="#/relay">relay</a><a href="#/api">api</a>
    </nav>
    <button id="themeToggle" class="theme-toggle" title="Switch theme">&#9774;</button>
    <form id="search" autocomplete="off">
      <input id="q" placeholder="height, block hash, output commitment, kernel or bond id" spellcheck="false">
      <button>find</button>
    </form>
  </div>
  <div id="flash"></div>
</header>
<main id="view"><div class="empty">loading…</div></main>
<footer>
  Served by this node from its own copy of the chain · JSON: <a href="/state">/state</a>,
  /explorer/{blocks, block/…, output/…, kernel/…, bonds, bond/…, burn, search/…}
</footer>
<script>
"use strict";
const COIN = 1e8;
const THEME_COL = {
  dark: { in: "#8b5cf6", out: "#00ff41", kern: "#a78bfa", faint: "rgba(167,139,250,.5)", amber: "#f5c451", fire: "#ff8a3d", green: "#00ff41", purple: "#8b5cf6", muted: "#938fa6", text: "#f2f1f6", bg: "#060609" },
  light: { in: "#7c3aed", out: "#059669", kern: "#6d28d9", faint: "rgba(124,58,237,.35)", amber: "#b45309", fire: "#c2410c", green: "#059669", purple: "#7c3aed", muted: "#6b6899", text: "#16162a", bg: "#f7f6fb" },
};
function themeColors() { return THEME_COL[document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark']; }
function toggleTheme() {
  const el = document.documentElement;
  const next = el.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  el.setAttribute('data-theme', next);
  localStorage.setItem('explorer-theme', next);
  document.getElementById('themeToggle').textContent = next === 'light' ? '\u2600' : '\u263E';
  route();
}
const view = document.getElementById("view");

// ---------- small helpers: every value goes in as text --------------------
function h(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    n.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const short = (x, n = 10) => x ? String(x).slice(0, n) + "\u2026" : "\u2014";
const num = x => Number(x).toLocaleString();
function coins(units) {
  const whole = Math.floor(units / COIN), frac = String(Math.abs(units % COIN)).padStart(8, "0");
  return whole.toLocaleString() + "." + frac;
}
// Bond values are quoted in midstate's units, not midwimble's: a gMDS is
// 2^30 MDS, and the bond minimums are set in gMDS.
const GMDS = 1073741824;
function gmds(units) {
  const u = Number(units);
  if (u < GMDS) return u.toLocaleString() + " MDS";
  const n = u / GMDS;
  return (Number.isInteger(n) ? n.toLocaleString() : n.toLocaleString(undefined, { maximumFractionDigits: 6 })) + " gMDS";
}
// Headline figures: whole coins, trimmed decimals. The exact 8dp form is
// for tables and amounts, where the trailing digits matter.
function coinShort(units) {
  const whole = units / COIN;
  if (Math.abs(whole) >= 1000) return Math.round(whole).toLocaleString() + " MDW";
  return whole.toLocaleString(undefined, { maximumFractionDigits: 4 }) + " MDW";
}
function dur(s) {
  if (s == null) return "\u2014";
  const a = Math.abs(s), sign = s < 0 ? "-" : "";
  if (a < 120) return sign + a + "s";
  if (a < 7200) return sign + Math.round(a / 60) + "m";
  if (a < 172800) return sign + (a / 3600).toFixed(1) + "h";
  return sign + (a / 86400).toFixed(1) + "d";
}
const ago = ts => dur(Math.max(0, Math.floor(Date.now() / 1000) - ts)) + " ago";
const utc = ts => new Date(ts * 1000).toISOString().replace("T", " ").replace(".000Z", " UTC");
const utcDay = ts => new Date(ts * 1000).toISOString().slice(0, 10);
const pct = (x, d = 1) => x == null || !isFinite(x) ? "\u2014" : (x * 100).toFixed(d) + "%";
const ratio = (a, b) => b ? a / b : null;
const mdw = units => coinShort(units);
function rate(perSec) {
  const units = ["", "k", "M", "G", "T"];
  let i = 0;
  while (perSec >= 1000 && i < units.length - 1) { perSec /= 1000; i++; }
  return perSec.toFixed(perSec < 10 ? 2 : 1) + " " + units[i] + " att/s";
}
const link = (kind, id, text) => h("a", { href: "#/" + kind + "/" + id, title: String(id) }, text ?? short(String(id)));
const full = x => h("span", { class: "hash" }, x);
const tag = (cls, text) => h("span", { class: "tag " + cls }, text);
const section = (title, aside, ...body) => h("section", null,
  h("h2", null, title, aside ? h("span", { class: "aside" }, aside) : null), ...body);
function cell(k, v, small) { return h("div", { class: "cell" }, h("div", { class: "k" }, k), h("div", { class: "v" + (small ? " small" : "") }, v)); }
function stat(k, v, sub) { const c = cell(k, v); if (sub) c.appendChild(h("div", { class: "sub" }, sub)); return c; }
// A KPI tile: label, one big figure, one line of context.
function kpi(label, value, sub, opts = {}) {
  return h("div", { class: "kpi" + (opts.accent ? " hero-kpi" : "") },
    h("div", { class: "label" }, label),
    h("div", { class: "value" + (opts.small ? " sm" : "") }, value),
    sub ? h("div", { class: "sub" }, sub) : null);
}
function meter(fraction, hot) {
  const span = h("span");
  span.style.width = Math.min(100, Math.max(0.6, fraction * 100)) + "%";
  return h("div", { class: "meter" + (hot ? " hot" : "") }, span);
}
// Two-part bar: inputs vs outputs vs kernels, scaled to the busiest block.
function spark(inp, out, kern, max, w = 200) {
  const bar = h("div", { class: "bar", style: `width:${w}px` });
  const cap = Math.max(max || (inp + out + kern), 1);
  const seg = (n, colour) => n ? h("i", { style: `width:${(n / cap) * 100}%;background:${colour};opacity:.88` }) : null;
  if (inp) bar.appendChild(seg(inp, themeColors().in));
  if (out) bar.appendChild(seg(out, themeColors().out));
  if (kern) bar.appendChild(seg(kern, themeColors().kern));
  bar.title = inp + " in \u00b7 " + out + " out \u00b7 " + kern + " kernel" + (kern === 1 ? "" : "s");
  return bar;
}
const dl = rows => h("dl", null, rows.filter(Boolean).map(([k, v]) => [h("dt", null, k), h("dd", null, v)]));
const table = (heads, rows, numeric = []) => h("div", { class: "scroll" }, h("table", null,
  h("thead", null, h("tr", null, heads.map((x, i) => h("th", { class: numeric.includes(i) ? "num" : null }, x)))),
  h("tbody", null, rows.map(r => h("tr", null, r.map((c, i) => h("td", { class: numeric.includes(i) ? "num" : null }, c)))))));

async function get(path) {
  const r = await fetch(path);
  let body = null;
  try { body = await r.json(); } catch (_) {}
  if (!r.ok) throw new Error((body && body.error) || (path + " \u2192 " + r.status));
  return body;
}
function flash(text) {
  const f = document.getElementById("flash");
  f.textContent = text;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => (f.textContent = ""), 4000);
}

// ---------- charts --------------------------------------------------------
const SVG = "http://www.w3.org/2000/svg";
function svg(tagName, attrs, ...kids) {
  const n = document.createElementNS(SVG, tagName);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, v);
  kids.forEach(k => n.appendChild(k));
  return n;
}
function svgLink(href, kid, title) {
  const a = svg("a", { href });
  if (title) kid.appendChild(svg("title")).textContent = title;
  a.appendChild(kid);
  return a;
}
function intervalChart(values, target, href) {
  const W = 600, H = 120, max = Math.max(target * 3, ...values, 1);
  const bw = W / Math.max(values.length, 1);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  values.forEach((v, i) => {
    const bh = Math.max(1, (Math.min(v, max) / max) * (H - 4));
    const r = svg("rect", { x: i * bw + 1, y: H - bh, width: Math.max(1, bw - 2), height: bh,
      fill: v > target * 2.5 ? themeColors().amber : themeColors().in, opacity: .85 });
    s.appendChild(href ? svgLink(href(i), r, v + "s") : (r.appendChild(svg("title")).textContent = v + "s", r));
  });
  const y = H - (target / max) * (H - 4);
  s.appendChild(svg("line", { x1: 0, x2: W, y1: y, y2: y, stroke: themeColors().out, "stroke-dasharray": "4 4", "stroke-width": 1 }));
  return s;
}
function lineChart(values, colour) {
  const W = 600, H = 120, lo = Math.min(...values), hi = Math.max(...values), span = (hi - lo) || 1;
  const pts = values.map((v, i) => `${(i / Math.max(values.length - 1, 1)) * W},${H - 6 - ((v - lo) / span) * (H - 12)}`);
  return svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" },
    svg("polyline", { points: pts.join(" "), fill: "none", stroke: colour || themeColors().kern, "stroke-width": 2, "vector-effect": "non-scaling-stroke" }));
}
function barChart(values, { colour = null, log = false, label = String, href = null } = {}) {
  const W = 600, H = 120, f = log ? (v => Math.log10(1 + v)) : (v => v);
  const max = Math.max(...values.map(f), 1e-9), bw = W / Math.max(values.length, 1);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  values.forEach((v, i) => {
    if (!v) return;
    const bh = Math.max(1, (f(v) / max) * (H - 4));
    const r = svg("rect", { x: i * bw, y: H - bh, width: Math.max(0.8, bw - 0.5), height: bh, fill: colour || themeColors().in, opacity: .8 });
    s.appendChild(href ? svgLink(href(i), r, label(v, i)) : (r.appendChild(svg("title")).textContent = label(v, i), r));
  });
  return s;
}
// A 0..1 series as a filled area, for shares that only make sense against
// their own ceiling.
function shareChart(values, colour, label = String) {
  const W = 600, H = 120, n = Math.max(values.length - 1, 1);
  const pts = values.map((v, i) => `${(i / n) * W},${H - 6 - Math.max(0, Math.min(1, v)) * (H - 12)}`);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" },
    svg("polygon", { points: `0,${H} ` + pts.join(" ") + ` ${W},${H}`, fill: colour, opacity: .16 }),
    svg("polyline", { points: pts.join(" "), fill: "none", stroke: colour, "stroke-width": 2, "vector-effect": "non-scaling-stroke" }));
  values.forEach((v, i) => {
    const t = svg("rect", { x: (i / n) * W - 1, y: 0, width: 2, height: H, fill: "transparent" });
    t.appendChild(svg("title")).textContent = label(v, i);
    s.appendChild(t);
  });
  return s;
}

// Blocks as bubbles: time across, transactions up, area is bytes. The shape
// of a chain's day is readable at a glance, which a table cannot do.
function activityBubbles(blocks) {
  const W = 900, H = 240, pad = 26;
  const pts = blocks.slice().sort((a, b) => a.height - b.height);
  if (!pts.length) return h("div", { class: "empty" }, "no blocks yet");
  const kernMax = Math.max(1, ...pts.map(b => b.kernels || 0));
  const sizeMax = Math.max(1, ...pts.map(b => b.size || 1));
  const x = i => pad + (i / Math.max(pts.length - 1, 1)) * (W - pad * 2);
  const y = k => H - pad - (k / kernMax) * (H - pad * 2);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  // gridlines at 0, half, full transactions
  [0, .5, 1].forEach(f => {
    const yy = H - pad - f * (H - pad * 2);
    s.appendChild(svg("line", { x1: pad, x2: W - pad, y1: yy, y2: yy, stroke: themeColors().muted, "stroke-width": .5, opacity: .18 }));
    const t = svg("text", { x: pad - 6, y: yy + 3, fill: themeColors().muted, "font-size": 9, "text-anchor": "end" });
    t.textContent = Math.round(kernMax * f);
    s.appendChild(t);
  });
  pts.forEach((b, i) => {
    const r = 3 + Math.sqrt((b.size || 1) / sizeMax) * 13;
    const c = svg("circle", { cx: x(i), cy: y(b.kernels || 0), r, fill: b.merged ? themeColors().in : themeColors().out,
      opacity: b.full_weight === false ? .28 : .55, stroke: b.full_weight === false ? themeColors().amber : "none", "stroke-width": b.full_weight === false ? 1 : 0 });
    s.appendChild(svgLink("#/block/" + b.height, c,
      "block " + b.height + "\n" + (b.kernels || 0) + " transactions \u00b7 " + num(b.size) + " B\n" + utc(b.timestamp) +
      (b.merged ? "\nmerge-mined" : "") + (b.full_weight === false ? "\nover cap: adds 1/1024 of its work" : "")));
  });
  return h("div", { class: "viz" }, s, h("div", { class: "legend" },
    h("span", null, h("i", { style: "background:" + themeColors().out }), "native"),
    h("span", null, h("i", { style: "background:" + themeColors().in }), "merge-mined"),
    h("span", null, "bubble area \u00b7 block bytes"),
    h("span", null, "height \u00b7 transactions"),
    h("span", null, h("i", { style: "background:transparent;border:1px solid " + themeColors().amber }), "over cap")));
}

// Bonds as packed bubbles: area is blocks signed in the window, colour is
// headroom against the per-bond cap. A bond at its cap is the shape of the
// whole rule in one picture.
function bondBubbles(bonds, cap, size) {
  const items = bonds.slice().sort((a, b) => (b.window_signed || 0) - (a.window_signed || 0));
  if (!items.length) return h("div", { class: "empty" }, "no bonds registered");
  const W = 900, pad = 14, top = 16, rowH = 100;
  const maxV = Math.max(1, ...items.map(b => b.window_signed || 0));
  const rOf = b => 11 + Math.sqrt((b.window_signed || 0) / maxV) * 33;
  // Lay out first, then size the box: a wrapped row must not be clipped.
  let x = pad, row = 0;
  const placed = items.map(b => {
    const r = rOf(b);
    if (x + r * 2 > W - pad && x > pad) { x = pad; row++; }
    const p = { b, r, cx: x + r, cy: top + row * rowH + r };
    x += r * 2 + 10;
    return p;
  });
  const H = Math.max(...placed.map(p => p.cy + p.r)) + 16;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  placed.forEach(({ b, r, cx, cy }) => {
    const over = b.window_signed > cap;
    const fill = over ? themeColors().fire : b.eligible_now === false ? themeColors().muted : themeColors().out;
    const c = svg("circle", { cx, cy, r, fill, opacity: over ? .42 : .26, stroke: fill, "stroke-width": over ? 2 : 1 });
    s.appendChild(svgLink("#/bond/" + b.bond_id, c,
      short(b.bond_id, 16) + "\n" + num(b.window_signed) + " of " + num(cap) + " blocks in the window" +
      (b.value != null ? "\n" + gmds(b.value) : "") + "\n" + (b.eligible_now ? "eligible" : "not eligible") +
      (over ? "\nover cap" : "")));
    if (r > 19) {
      const t = svg("text", { x: cx, y: cy + 3, fill: themeColors().text, "font-size": 10, "text-anchor": "middle", opacity: .85 });
      t.textContent = b.window_signed;
      s.appendChild(t);
    }
  });
  return h("div", { class: "viz" }, s, h("div", { class: "legend" },
    h("span", null, h("i", { style: "background:" + themeColors().out }), "under cap"),
    h("span", null, h("i", { style: "background:" + themeColors().fire }), "over cap"),
    h("span", null, h("i", { style: "background:" + themeColors().muted }), "not eligible"),
    h("span", null, "area \u00b7 blocks signed in the last " + num(size || 1440) + " \u00b7 cap " + num(cap))));
}

// Minted vs withheld as one ring: the missing wedge is the burn.
function donut(minted, withheld, label) {
  const total = minted + withheld;
  if (!total) return h("div", { class: "empty" }, "nothing minted yet");
  const W = 220, R = 82, cx = W / 2, cy = W / 2, sw = 26;
  const circ = 2 * Math.PI * (R - sw / 2);
  const frac = withheld / total;
  const s = svg("svg", { viewBox: `0 0 ${W} ${W}`, role: "img", style: "width:220px;height:220px;margin:0 auto" });
  const ring = (colour, dash, offset, op) => svg("circle", { cx, cy, r: R - sw / 2, fill: "none", stroke: colour, "stroke-width": sw,
    "stroke-dasharray": dash + " " + (circ - dash), "stroke-dashoffset": offset, transform: `rotate(-90 ${cx} ${cy})`, opacity: op || 1 });
  s.appendChild(ring(themeColors().green, circ, 0, .22));
  if (frac > 0) s.appendChild(ring(themeColors().fire, circ * frac, -circ * (1 - frac), .95));
  const p = svg("text", { x: cx, y: cy - 2, fill: themeColors().fire, "font-size": 26, "font-weight": 700, "text-anchor": "middle" });
  p.textContent = pct(frac, 1);
  s.appendChild(p);
  const t = svg("text", { x: cx, y: cy + 18, fill: themeColors().muted, "font-size": 10, "text-anchor": "middle" });
  t.textContent = label || "of the schedule withheld";
  s.appendChild(t);
  return s;
}

// ---------- diagrams ------------------------------------------------------
const COL = () => themeColors();
const slot = (i, n, from, to) => from + ((i + 0.5) * (to - from)) / Math.max(n, 1);

// Ages colour an input by how long its output sat before this block spent
// it: a cooling ramp, not a warning one.
function ageBands() { const c = themeColors(); return [[10, c.in, "\u226410 blocks"], [100, c.kern, "\u2264100"], [1000, "#c4b5fd", "\u22641k"], [Infinity, "#e9e4ff", ">1k"]]; }
const ageColour = a => a == null ? "#4a4458" : (ageBands().find(([hi]) => a <= hi) || ageBands()[3])[1];

// A block is one aggregated transaction: its inputs and kernels are
// flattened and sorted, so nothing says which input funded which output.
// The diagram draws that as the complete set of possibilities, because the
// absence of those edges IS the privacy property.
function anatomyDiagram(b) {
  const ins = b.inputs || [];
  const groups = (b.output_groups || []).map((g, gi) => ({ ...g, gi, coinbase: false }));
  if (b.coinbase) groups.unshift({ gi: -1, coinbase: true, outputs: b.coinbase.outputs.length,
    range_proof_bytes: b.coinbase.range_proof_bytes, commitments: b.coinbase.outputs.map(o => o.commitment) });
  const outs = [];
  groups.forEach(g => (g.commitments || []).forEach(c => outs.push({ g, c })));
  const kerns = (b.kernels || []).concat(b.coinbase ? [b.coinbase.kernel] : []);
  if (!ins.length && !outs.length) return h("div", { class: "empty" }, "nothing to draw: this block carries no transactions");

  const CAPN = 28;
  const si = ins.slice(0, CAPN), so = outs.slice(0, CAPN), sk = kerns.slice(0, CAPN);
  const W = 760, pad = 26;
  const H = Math.max(180, 2 * pad + Math.max(si.length, so.length, sk.length) * 20);
  const xIn = 100, xKern = W / 2 - 30, xOut = W - 200;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const yi = i => slot(i, si.length, pad, H - pad);
  const yo = i => slot(i, so.length, pad, H - pad);
  const yk = i => slot(i, sk.length, pad + 6, H - pad - 6);

  const edges = si.length * so.length;
  if (edges && edges <= 420) {
    si.forEach((_, i) => so.forEach((_, j) => s.appendChild(svg("line", {
      x1: xIn + 7, y1: yi(i), x2: xOut - 7, y2: yo(j),
      stroke: COL().faint, "stroke-width": 0.4, opacity: Math.max(0.05, 1.6 / Math.sqrt(edges)),
    }))));
  } else if (edges) {
    s.appendChild(svg("path", { d: `M${xIn + 7},${yi(0)} L${xOut - 7},${yo(0)} L${xOut - 7},${yo(so.length - 1)} L${xIn + 7},${yi(si.length - 1)} Z`,
      fill: COL().faint, opacity: .07 }));
  }

  sk.forEach((k, i) => {
    const y = yk(i);
    s.appendChild(svg("rect", { x: xKern - 30, y: y - 8, width: 60, height: 16, rx: 8, fill: themeColors().bg, opacity: .92 }));
    const d = svg("path", { d: `M${xKern - 7},${y} L${xKern},${y - 6} L${xKern + 7},${y} L${xKern},${y + 6} Z`, fill: COL().kern, opacity: .9 });
    d.appendChild(svg("title")).textContent =
      (k.fee ? "fee " + coins(k.fee) : "no fee") + "\n" + k.excess + "\nproves a transaction balanced \u2014 not which one";
    s.appendChild(d);
  });

  si.forEach((inp, i) => {
    const age = inp.created_height != null ? b.height - inp.created_height : null;
    const r = svg("rect", { x: xIn - 7, y: yi(i) - 6, width: 14, height: 12, rx: 3, fill: ageColour(age), opacity: .9 });
    r.appendChild(svg("title")).textContent = inp.commitment +
      (age != null ? "\ncreated in block " + inp.created_height + " \u2014 " + age + " blocks earlier" : "\ncreating block not indexed");
    s.appendChild(r);
  });

  // Outputs, boxed by the transaction that made them. Hovering a box lifts
  // its members and dims the rest.
  const allOut = [];
  groups.forEach(g => {
    const mine = so.map((o, i) => [o, i]).filter(([o]) => o.g === g).map(([, i]) => i);
    if (!mine.length) return;
    const top = yo(mine[0]) - 11, bot = yo(mine[mine.length - 1]) + 11;
    const stroke = g.coinbase ? COL().amber : COL().out;
    const box = svg("rect", { x: xOut - 13, y: top, width: 176, height: bot - top, rx: 7,
      fill: stroke, "fill-opacity": .06, stroke, "stroke-opacity": .35, "stroke-width": 1 });
    s.appendChild(box);
    const t = svg("text", { x: xOut + 18, y: (top + bot) / 2 + 4, fill: stroke, "font-size": 10, opacity: .9 });
    t.textContent = (g.coinbase ? "coinbase" : "tx") + " \u00b7 " + g.outputs + " out \u00b7 " + g.range_proof_bytes + "B";
    s.appendChild(t);
    const mates = mine.map(i => {
      const o = so[i];
      const r = svg("rect", { x: xOut - 7, y: yo(i) - 6, width: 14, height: 12, rx: 3,
        fill: g.coinbase ? COL().amber : COL().out, opacity: .9 });
      r.appendChild(svg("title")).textContent = o.c + (g.coinbase ? "\ncoinbase output, value public" : "\ncreated with " + (g.outputs - 1) + " sibling" + (g.outputs === 2 ? "" : "s"));
      s.appendChild(r);
      allOut.push(r);
      return r;
    });
    if (g.outputs > 1) {
      const lift = on => allOut.forEach(r => r.setAttribute("opacity", mates.includes(r) ? (on ? 1 : .9) : (on ? .2 : .9)));
      [box, t].forEach(e => { e.addEventListener("mouseenter", () => lift(true)); e.addEventListener("mouseleave", () => lift(false)); });
      box.setAttribute("style", "cursor: help");
    }
  });

  const label = (x, y, txt, fill, anchor) => {
    const t = svg("text", { x, y, fill, "font-size": 11, "text-anchor": anchor || "start" });
    t.textContent = txt;
    return t;
  };
  s.appendChild(label(xIn, 16, ins.length + " inputs", COL().in, "middle"));
  s.appendChild(label(xKern, 16, kerns.length + " kernels", COL().kern, "middle"));
  const funded = (b.outputs || []).length;
  s.appendChild(label(xOut + 10, 16, funded + " outputs" + (b.coinbase ? " + coinbase" : ""), COL().out, "middle"));
  s.appendChild(label(xKern, H - 6, "a kernel proves a transaction balanced, never which one", themeColors().muted, "middle"));
  if (ins.length > CAPN) s.appendChild(label(xIn, H - 6, "+" + (ins.length - CAPN) + " more", themeColors().muted, "middle"));

  return h("div", { class: "diagram" }, s,
    h("div", { class: "legend" },
      h("span", null, h("i", { style: "background:" + COL().out }), "output \u00b7 boxed with its transaction's siblings"),
      h("span", null, h("i", { style: "background:" + COL().amber }), "coinbase \u00b7 value public"),
      h("span", null, h("i", { style: "background:" + COL().kern }), "kernel"),
      ...ageBands().map(([, c, t]) => h("span", null, h("i", { style: "background:" + c }), "input " + t))));
}

// Where this block's coins came from and went: an output knows its creating
// block and its spending block, and nothing in between.
function spendArcs(b) {
  const back = new Map(), fwd = new Map();
  (b.inputs || []).forEach(i => i.created_height != null && back.set(i.created_height, (back.get(i.created_height) || 0) + 1));
  (b.outputs || []).concat((b.coinbase && b.coinbase.outputs) || [])
    .forEach(o => o.spent_height != null && fwd.set(o.spent_height, (fwd.get(o.spent_height) || 0) + 1));
  if (!back.size && !fwd.size) return h("div", { class: "empty" }, "no spends to or from this block yet");

  const dists = [...back.keys(), ...fwd.keys()].map(x => Math.abs(x - b.height));
  const span = Math.log10(1 + Math.max(1, ...dists));
  const W = 680, H = 190, mid = H / 2, half = W / 2 - 30;
  const xOf = hh => {
    const d = hh - b.height;
    return W / 2 + (Math.sign(d) * Math.log10(1 + Math.abs(d)) / (span || 1)) * half;
  };
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  s.appendChild(svg("line", { x1: 14, y1: mid, x2: W - 14, y2: mid, stroke: themeColors().faint.replace(".5", ".25"), "stroke-width": 1 }));
  const arc = (hh, n, up, colour) => {
    const x = xOf(hh), lift = (up ? -1 : 1) * (mid - 18);
    const d = `M${x},${mid} Q${(x + W / 2) / 2},${mid + lift} ${W / 2},${mid}`;
    const p = svg("path", { d, fill: "none", stroke: colour, "stroke-width": Math.min(4, 0.8 + Math.log2(1 + n)), opacity: .55 });
    const tip = n + (n === 1 ? " output" : " outputs") + (up ? " created in block " : " spent in block ") + hh +
      " (" + Math.abs(hh - b.height) + " blocks " + (up ? "earlier" : "later") + ")";
    const hit = svg("path", { d, fill: "none", stroke: "transparent", "stroke-width": 14 });
    const a = svgLink("#/block/" + hh, hit, tip);
    a.appendChild(p);
    s.appendChild(a);
    s.appendChild(svgLink("#/block/" + hh, svg("circle", { cx: x, cy: mid, r: 2.5, fill: colour, opacity: .8 })));
  };
  [...back.entries()].forEach(([hh, n]) => arc(hh, n, true, COL().in));
  [...fwd.entries()].forEach(([hh, n]) => arc(hh, n, false, COL().out));
  s.appendChild(svg("circle", { cx: W / 2, cy: mid, r: 4.5, fill: themeColors().text }));
  const txt = (x, y, t, fill, anchor) => {
    const e = svg("text", { x, y, fill, "font-size": 11, "text-anchor": anchor });
    e.textContent = t;
    return e;
  };
  s.appendChild(txt(W / 2, mid - 10, "block " + num(b.height), themeColors().text, "middle"));
  s.appendChild(txt(14, 14, "spent here, created earlier \u2191", COL().in, "start"));
  s.appendChild(txt(14, H - 6, "created here, spent later \u2193", COL().out, "start"));
  s.appendChild(txt(W - 14, mid + 16, "later \u2192", themeColors().muted, "end"));
  s.appendChild(txt(14, mid + 16, "\u2190 earlier", themeColors().muted, "start"));
  return h("div", { class: "diagram" }, s, h("div", { class: "legend" },
    h("span", null, "distance is logarithmic, so a coinbase spent thousands of blocks later stays on the chart"),
    h("span", null, "thickness is how many outputs share that block")));
}

// The ages of the outputs this block spent.
function ageHistogram(b) {
  const ages = (b.inputs || []).map(i => i.created_height != null ? b.height - i.created_height : null).filter(x => x != null);
  if (!ages.length) return null;
  const buckets = [[1, 1, "same"], [2, 10, "2\u201310"], [11, 100, "11\u2013100"], [101, 1000, "101\u20131k"],
                   [1001, 10000, "1k\u201310k"], [10001, Infinity, "10k+"]];
  const counts = buckets.map(([lo, hi]) => ages.filter(a => a >= lo && a <= hi).length);
  const W = 680, H = 96, max = Math.max(1, ...counts), bw = W / counts.length;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}` });
  counts.forEach((c, i) => {
    const bh = (c / max) * (H - 34);
    if (c) {
      const r = svg("rect", { x: i * bw + bw * 0.3, y: H - 22 - bh, width: bw * 0.4, height: Math.max(2, bh), rx: 3, fill: COL().in, opacity: .85 });
      r.appendChild(svg("title")).textContent = c + " spent after " + buckets[i][2] + " blocks";
      s.appendChild(r);
      const v = svg("text", { x: i * bw + bw / 2, y: H - 26 - bh, fill: themeColors().text, "font-size": 11, "text-anchor": "middle" });
      v.textContent = c;
      s.appendChild(v);
    }
    const t = svg("text", { x: i * bw + bw / 2, y: H - 6, fill: themeColors().muted, "font-size": 10, "text-anchor": "middle" });
    t.textContent = buckets[i][2];
    s.appendChild(t);
  });
  return h("div", { class: "diagram" }, s,
    h("div", { class: "legend" }, h("span", null, "blocks between an output being created and this block spending it")));
}

// Who learns what, as pills rather than paragraphs.

// Dandelion++: a transaction walks a private stem, one peer at a time, then
// fluffs out to everyone.
function dandelionDiagram(d) {
  const C = themeColors();
  const W = 760, H = 230, y = 118, x0 = 58, xF = 568;
  const hops = Math.max(1, Math.min(5, Math.round(d.expected_hops)));
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const dot = (cx, cy, r, fill, op) => svg("circle", { cx, cy, r, fill, opacity: op == null ? 1 : op });
  const txt = (x, yy, t, fill, anchor, size) => {
    const e = svg("text", { x, y: yy, fill, "font-size": size || 11, "text-anchor": anchor || "middle" });
    e.textContent = t;
    return e;
  };
  const step = (xF - x0) / (hops + 1);
  s.appendChild(svg("line", { x1: x0, y1: y, x2: xF, y2: y, stroke: C.purple, "stroke-width": 2, opacity: .45 }));
  const fan = 11;
  for (let i = 0; i < fan; i++) {
    const a = -1.15 + (i / (fan - 1)) * 2.3, len = 74 + (i % 3) * 16;
    const ex = xF + Math.cos(a) * len, ey = y + Math.sin(a) * len;
    s.appendChild(svg("line", { x1: xF, y1: y, x2: ex, y2: ey, stroke: C.out, "stroke-width": 1, opacity: .3 }));
    s.appendChild(dot(ex, ey, 3.5, C.out, .75));
  }
  const burst = dot(xF, y, 6, "none", 1);
  burst.setAttribute("stroke", C.out);
  burst.appendChild(svg("animate", { attributeName: "r", values: "6;64", dur: "1.6s", begin: "2.4s;burst.end+2.4s", id: "burst", repeatCount: "1" }));
  burst.appendChild(svg("animate", { attributeName: "opacity", values: ".9;0", dur: "1.6s", begin: "2.4s;burst.end+2.4s", repeatCount: "1" }));
  s.appendChild(burst);

  const base = d.fluff_percent + "% chance of fluffing at each hop \u00b7 about " + d.expected_hops.toFixed(1) + " hops \u00b7 " + d.stem_timeout_secs + "s embargo";
  const caption = txt(W / 2, H - 10, base, C.muted, "middle", 11);
  const tells = (cx, what, colour) => {
    const hit = svg("circle", { cx, cy: y, r: 22, fill: "transparent", style: "cursor: help" });
    hit.addEventListener("mouseenter", () => { caption.textContent = what; caption.setAttribute("fill", colour); });
    hit.addEventListener("mouseleave", () => { caption.textContent = base; caption.setAttribute("fill", C.muted); });
    s.appendChild(hit);
  };
  for (let i = 0; i <= hops; i++) {
    const cx = x0 + step * i;
    s.appendChild(dot(cx, y, i === 0 ? 9 : 6, i === 0 ? C.text : C.purple, i === 0 ? 1 : .85));
    s.appendChild(txt(cx, y - (i === 0 ? 20 : 18), i === 0 ? "you" : "hop " + i, i === 0 ? C.text : C.muted, "middle", i === 0 ? 11 : 10));
    tells(cx, i === 0 ? "you hold it \u00b7 nobody else has seen it yet"
      : i === 1 ? "knows your address, and that you sent it \u2014 not that you wrote it"
      : "knows only the hop before it \u00b7 " + i + " nodes from you now", i === 0 ? C.text : C.kern);
  }
  s.appendChild(dot(xF, y, 9, C.out));
  s.appendChild(txt(xF, y - 22, "fluff", C.out));
  tells(xF, "broadcasts to everyone \u00b7 what they see is a node that probably did not write it", C.out);
  const car = dot(0, 0, 4.5, C.amber);
  car.appendChild(svg("animateMotion", { dur: "2.4s", repeatCount: "indefinite", path: `M${x0},${y} L${xF},${y}` }));
  s.appendChild(car);
  s.appendChild(txt(W / 2, 30, "stem \u00b7 one peer at a time, nobody else sees it", C.kern));
  s.appendChild(txt(x0, H - 34, "your node", C.muted, "start", 10));
  s.appendChild(txt(xF + 86, H - 34, "the whole network", C.muted, "end", 10));
  s.appendChild(caption);
  return h("div", { class: "diagram" }, s);
}

// This node's peers: direction is the line, transport is the dot.
function peerMap(n) {
  const C = themeColors();
  const peers = n.peers || [];
  if (!peers.length) return h("div", { class: "empty" }, "no peers connected");
  const W = 760, H = 330, cx = W / 2, cy = H / 2, R = 128;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  const COLOURS = { tcp: C.purple, quic: C.kern, webrtc: C.out, other: C.muted };
  peers.forEach((p, i) => {
    const a = (i / peers.length) * Math.PI * 2 - Math.PI / 2;
    const rr = R + (p.outbound ? 0 : 42);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
    s.appendChild(svg("line", { x1: cx, y1: cy, x2: x, y2: y,
      stroke: p.outbound ? C.out : C.purple, "stroke-width": p.outbound ? 1.4 : 0.8,
      opacity: p.outbound ? .4 : .22, "stroke-dasharray": p.outbound ? null : "3 4" }));
    const c = svg("circle", { cx: x, cy: y, r: p.outbound ? 6 : 4.5,
      fill: COLOURS[p.transport] || COLOURS.other, opacity: p.outbound ? .95 : .6 });
    c.appendChild(svg("title")).textContent =
      p.id + "\n" + (p.outbound ? "outbound \u2014 this node dialled it" : "inbound \u2014 it dialled this node") +
      "\n" + p.transport + " \u00b7 " + p.addr;
    s.appendChild(c);
  });
  s.appendChild(svg("circle", { cx, cy, r: 11, fill: C.text }));
  s.appendChild(svg("circle", { cx, cy, r: 11, fill: "none", stroke: C.text, "stroke-width": 1, opacity: .5 },
    svg("animate", { attributeName: "r", values: "11;34", dur: "3s", repeatCount: "indefinite" }),
    svg("animate", { attributeName: "opacity", values: ".5;0", dur: "3s", repeatCount: "indefinite" })));
  const lab = svg("text", { x: cx, y: cy + 30, fill: C.text, "font-size": 11, "text-anchor": "middle" });
  lab.textContent = "this node";
  s.appendChild(lab);
  return h("div", { class: "diagram" }, s, h("div", { class: "legend" },
    h("span", null, h("i", { style: "background:" + COLOURS.tcp }), "tcp"),
    h("span", null, h("i", { style: "background:" + COLOURS.quic }), "quic"),
    h("span", null, h("i", { style: "background:" + COLOURS.webrtc }), "webrtc"),
    h("span", null, "solid line, larger dot \u2014 outbound"),
    h("span", null, "dashed line \u2014 inbound"),
    h("span", null, "addresses are shown without their host")));
}

// Who signed when, across the fork-choice window: one tick per block.
function signerHeatmap(r) {
  const w = r.window;
  if (w.from == null || !r.bonds.length) return null;
  const size = Math.max(1, w.size), W = 1000;
  const rows = r.bonds.filter(b => (b.window_blocks || []).length)
    .sort((a, b) => (b.window_signed || 0) - (a.window_signed || 0)).slice(0, 14);
  if (!rows.length) return h("div", { class: "empty" }, "no bond has signed inside the window yet");
  const grid = h("div", { class: "heat" },
    h("div", { class: "hd" }, "bond"),
    h("div", { class: "hd" }, "window \u00b7 " + num(w.from) + " \u2192 " + num(w.tip)),
    h("div", { class: "hd", style: "text-align:right" }, "signed / cap"));
  rows.forEach(b => {
    const over = b.window_signed > w.cap;
    const s = svg("svg", { viewBox: `0 0 ${W} 13`, preserveAspectRatio: "none" });
    s.appendChild(svg("rect", { x: 0, y: 0, width: W, height: 13, rx: 2, fill: themeColors().faint.replace(".5", ".07") }));
    (b.window_blocks || []).forEach(hh => {
      const x = ((hh - w.from) / size) * W;
      const t = svg("rect", { x: Math.max(0, Math.min(W - 2, x)), y: 1, width: 2, height: 11, fill: over ? themeColors().amber : COL().out, opacity: .85 });
      s.appendChild(svgLink("#/block/" + hh, t, "block " + hh));
    });
    grid.appendChild(h("div", { class: "lab" }, link("bond", b.bond_id, short(b.bond_id, 12))));
    grid.appendChild(s);
    grid.appendChild(h("div", { class: "cnt", style: over ? "color: var(--amber)" : null }, num(b.window_signed) + " / " + num(w.cap)));
  });
  return h("div", null, grid, h("div", { class: "note" },
    "One tick per block signed" + (rows.length < r.bonds.filter(b => (b.window_blocks || []).length).length ? ", top " + rows.length + " bonds by blocks signed" : "") + ". " + (w.cap_among === "in_use"
      ? "Amber is past its cap: its next block would be invalid."
      : "Amber is over cap: those blocks add 1/1024 of their work.")));
}

const LIGHT_NOTE = "over cap: adds 1/1024 of its work to fork choice, so a full-weight block on the block below it would orphan it";
const overCap = () => h("span", { class: "tag warn", title: LIGHT_NOTE }, "over cap");
function blockRows(blocks) {
  return blocks.map(b => [
    link("block", b.height, num(b.height)),
    h("span", { class: "dim", title: utc(b.timestamp) }, ago(b.timestamp)),
    b.interval != null ? dur(b.interval) : h("span", { class: "dim" }, "\u2014"),
    spark(b.inputs, b.outputs, b.kernels),
    h("span", { class: "dim" }, `${b.inputs} / ${b.outputs} / ${b.kernels}`),
    b.fees ? coins(b.fees) : h("span", { class: "dim" }, "0"),
    b.miner ? link("bond", b.miner) : h("span", { class: "dim" }, "unsigned"),
    h("span", null,
      tag(b.merged ? "merged" : "native", b.merged ? "merged" : "native"),
      b.full_weight === false ? overCap() : null,
      b.registrations ? tag("ok", "+" + b.registrations) : null),
  ]);
}
const BLOCK_HEADS = ["height", "age", "interval", "shape", "in / out / kern", "fees", "signed by", "work"];
const blockTable = blocks => blocks.length ? table(BLOCK_HEADS, blockRows(blocks), [4, 5]) : h("div", { class: "empty" }, "no blocks yet");

// The newest blocks as a strip you can click straight into. The strip is kept
// across refreshes, not rebuilt, so scroll position and hovers survive.
let trainEl = null, trainTop = null, trainTopHash = null;
const TRAIN_CARDS = 14;
function blockTrain(blocks) {
  const keep = trainEl ? trainEl.scrollLeft : 0;
  let rebuilt = false;
  const card = b => {
    const age = h("div", { class: "sub" }, ago(b.timestamp));
    const light = b.full_weight === false;
    const el = h("a", { href: "#/block/" + b.height, class: light ? "light" : null, title: light ? LIGHT_NOTE : null },
      h("div", { class: "hh" }, num(b.height)),
      age,
      h("div", { class: "sub" }, (b.kernels || 0) + " tx \u00b7 " + num(b.size) + " B"),
      light ? h("div", { class: "sub light" }, "over cap") : h("div", { class: "sub" }, b.merged ? "merge-mined" : "native"));
    el._ts = b.timestamp; el._age = age;
    return el;
  };
  const rebuild = () => {
    trainEl = h("div", { class: "train" });
    blocks.slice(0, TRAIN_CARDS).forEach(b => trainEl.appendChild(card(b)));
    rebuilt = true;
  };
  if (!blocks.length) return trainEl || (trainEl = h("div", { class: "train" }));
  const top = blocks[0];
  if (!trainEl || trainTop == null) rebuild();
  else if (top.height < trainTop || (top.height === trainTop && top.hash !== trainTopHash)) rebuild();
  else {
    blocks.filter(b => b.height > trainTop).sort((a, b) => a.height - b.height).forEach(b => {
      const el = card(b);
      el.classList.add("fresh");
      trainEl.insertBefore(el, trainEl.firstChild);
      setTimeout(() => el.classList.remove("fresh"), 600);
    });
    while (trainEl.children.length > TRAIN_CARDS) trainEl.removeChild(trainEl.lastChild);
  }
  for (const el of trainEl.children) if (el._age) el._age.textContent = ago(el._ts);
  trainTop = top.height; trainTopHash = top.hash;
  const scroll = rebuilt ? 0 : keep;
  if (scroll) { const el = trainEl; requestAnimationFrame(() => { el.scrollLeft = scroll; }); }
  return trainEl;
}

async function overview() {
  const [s, recent, bonds, burn] = await Promise.all([
    get("/state"), get("/explorer/blocks?count=120"), get("/explorer/bonds"),
    get("/explorer/burn").catch(() => null),
  ]);
  const blocks = recent.blocks;
  const timed = blocks.filter(b => b.interval != null).slice().reverse();
  const intervals = timed.map(b => b.interval);
  const avg = intervals.length ? intervals.reduce((a, b) => a + b, 0) / intervals.length : null;
  const bits = blocks.length ? blocks[0].difficulty_bits : 0;
  const hashrate = avg ? Math.pow(2, bits) / Math.max(avg, 1) : null;
  const supplyPct = s.supply / s.max_supply;

  const supplyTile = kpi("supply", coinShort(s.supply),
    (supplyPct < 0.0001 ? "<0.01%" : pct(supplyPct)) + " of " + coinShort(s.max_supply), { accent: true });
  supplyTile.appendChild(meter(supplyPct));

  // "How long until I find a block at my hashrate" is the question a new
  // miner actually has, so the tile carries the calculator.
  const calcTile = (() => {
    const input = h("input", { type: "number", min: "1", value: "1000000",
      style: "width:92px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font:500 11px var(--mono);text-align:right" });
    const wait = hr => {
      const secs = Math.round(Math.pow(2, bits) / (hr || 1));
      return bits ? (secs < 1 ? "<1s" : dur(secs)) : "\u2014";
    };
    const out = h("span", { style: "color:var(--amber)" }, wait(1e6));
    input.addEventListener("input", () => { out.textContent = wait(Number(input.value)); });
    return kpi("expected time", out, h("span", null, "at ", input, " att/s"));
  })();

  const newTile = kpi("new blocks", "0", "since this page loaded");
  newBlocksEl = newTile.querySelector(".value");

  const kpis = h("div", { class: "kpis" },
    kpi("height", num(s.height), "chain tip"),
    kpi("last block", ago(s.timestamp), utc(s.timestamp)),
    supplyTile,
    kpi("block reward", coinShort(s.block_reward), "per block", { accent: true, small: true }),
    kpi("era \u00b7 next halving", `${s.era} \u00b7 ${s.next_halving_height ? num(s.next_halving_height) : "none"}`, s.next_halving_height ? "at that height" : "no halving left", { small: true }),
    kpi("difficulty", bits.toFixed(2) + " bits", "expected attempts a block"),
    kpi("network rate", hashrate ? rate(hashrate) : "\u2014", "over the last " + intervals.length + " blocks", { small: true }),
    calcTile,
    kpi("avg block time", avg ? dur(Math.round(avg)) : "\u2014", avg ? "last " + intervals.length + " blocks" : null),
    kpi("mempool", s.mempool_count + " tx", num(s.mempool_weight) + " weight waiting", { small: true }),
    kpi("utxos / kernels", num(s.utxos) + " / " + num(s.kernels), "unspent outputs \u00b7 proofs", { small: true }),
    kpi("peers", String(s.peers.length), "connected nodes"),
    newTile,
    kpi("this node", s.mining ? "mining" : "not mining", s.syncing ? "syncing" : "in sync", { small: true }));

  const activity = section("Chain activity", "last " + blocks.length + " blocks \u00b7 refreshes every 10s",
    activityBubbles(blocks),
    h("div", { class: "charts" },
      h("div", { class: "chart" }, h("div", { class: "k" }, "block interval \u00b7 dashed = 60s"), intervalChart(intervals, 60, i => "#/block/" + timed[i].height)),
      h("div", { class: "chart" }, h("div", { class: "k" }, "difficulty \u00b7 bits"), lineChart(blocks.map(b => b.difficulty_bits).reverse()))));

  const run = s.orphaning;
  const runNote = run && h("div", { class: "note" },
    h("span", { class: "hot" }, num(run.replaces) + " over-cap block" + (run.replaces === 1 ? "" : "s") + " at the tip. "),
    "Together they add less to fork choice than one full-weight block on ",
    link("block", run.height - 1, "block " + num(run.height - 1)), ".");

  const burnStrip = burn && burn.active && burn.burned > 0
    ? h("div", { class: "note" }, h("b", { style: "color:var(--amber)" }, coinShort(burn.burned)), " burned so far \u00b7 effective max supply ",
        h("b", null, coinShort(burn.effective_max_supply)), " \u00b7 ", h("a", { href: "#/burn" }, "why \u2192"))
    : null;

  const hero = heroSearch();
  const wasTyping = !!(document.activeElement && document.activeElement.closest && document.activeElement.closest(".hero"));
  view.replaceChildren(hero, kpis, burnStrip, activity,
    section("Latest blocks", h("a", { href: "#/blocks" }, "all blocks \u2192"), blockTrain(blocks), blockTable(blocks.slice(0, 15)), runNote),
    section("Mining bonds", h("a", { href: "#/bonds" }, "details \u2192"),
      bondBubbles(bonds.bonds, bonds.window.cap, bonds.window.size), bondTable(bonds, 8)));
  if (wasTyping) {
    const el = hero.querySelector("input");
    el.focus();
    el.setSelectionRange(el.value.length, el.value.length);
  }
  schedule(overview, 10000);
  if (!sseConn) {
    newSinceLoad = 0;
    try {
      sseConn = new EventSource("/explorer/events");
      sseConn.addEventListener("block", () => {
        newSinceLoad++;
        if (newBlocksEl && newBlocksEl.isConnected) newBlocksEl.textContent = String(newSinceLoad);
      });
      sseConn.onerror = () => { if (sseConn) { sseConn.close(); sseConn = null; } };
    } catch (_) { sseConn = null; }
  }
}

// How settled a block is: its confirmations, and how many counted in full.
function burialText(x) {
  const n = x.confirmations, f = x.full_weight_confirmations;
  const text = num(n) + " confirmation" + (n === 1 ? "" : "s");
  if (x.finalized) return text + " \u00b7 finalized";
  return f == null ? text : text + " \u00b7 " + num(f) + " at full weight";
}
function burialNote(x) {
  if (x.finalized) return "below the finalized checkpoint: no reorganisation can replace it";
  const f = x.full_weight_confirmations;
  if (f == null) return "deeper than any reorganisation this node will make";
  if (f === 0) return "no full-weight block yet: one could replace it";
  return "replacing it takes a branch heavier than " + num(f) + " full-weight block" + (f === 1 ? "" : "s");
}

function bondTable(r, limit) {
  const w = r.window;
  if (!r.bonds.length) return h("div", { class: "empty" }, "no bonds registered");
  const rows = (limit ? r.bonds.slice().sort((a, b) => (b.window_signed || 0) - (a.window_signed || 0)) : r.bonds).slice(0, limit || r.bonds.length);
  const list = rows.map(b => {
    const share = b.window_signed / Math.max(w.cap, 1);
    const over = w.cap_among === "in_use" ? b.window_signed > w.cap : (w.tapering && b.window_signed > w.cap);
    return [
      link("bond", b.bond_id, short(b.bond_id, 14)),
      b.value != null ? gmds(b.value) : "\u2014",
      b.eligible_now ? h("span", { style: "color: var(--green)" }, "yes") : h("span", { style: "color: var(--amber)" }, "no"),
      h("div", { style: "min-width: 150px" }, num(b.window_signed) + " / " + num(w.cap), meter(share, over)),
      num(b.blocks_signed),
    ];
  });
  return h("div", null,
    table(["bond", "value", "eligible", "signed / cap " + num(w.cap), "total blocks"], list, [1, 4]),
    h("div", { class: "note" },
      "Cap = \u2308" + num(w.size) + " \u00f7 " + num(w.cap_among === "in_use" ? w.in_use : w.eligible) + " " +
      (w.cap_among === "in_use" ? "bonds in use\u2309" : "eligible bonds\u2309") + " = " + num(w.cap) + " blocks per window \u00b7 " +
      h("a", { href: "#/bonds" }, "how it works \u2192")));
}

function stackChart(buckets, label) {
  const W = 600, H = 170, max = Math.max(1, ...buckets.map(b => b.minted + b.withheld));
  const bw = W / Math.max(buckets.length, 14), gap = Math.min(8, bw * 0.18);
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });
  buckets.forEach((b, i) => {
    const mh = (b.minted / max) * (H - 4), wh = (b.withheld / max) * (H - 4);
    const x = i * bw + gap / 2, w = Math.max(1, bw - gap);
    const g = svg("g");
    g.appendChild(svg("rect", { x, y: H - mh, width: w, height: Math.max(0, mh), fill: themeColors().green, opacity: .7 }));
    if (wh > 0) g.appendChild(svg("rect", { x, y: H - mh - wh, width: w, height: wh, fill: themeColors().fire, opacity: .95 }));
    g.appendChild(svg("title")).textContent = label(b);
    s.appendChild(g);
  });
  return s;
}

        h("span", null, h("i", { style: "background:" + themeColors().fire }), "withheld, never minted")));
  };

}

// The bond page's share of the same report.
function bondBurn(burn) {
  if (!burn) return null;
  const more = h("a", { href: "#/burn" }, "leaderboard \u2192");
  if (!burn.active) return section("Burn", more, h("div", { class: "empty" }, "The over-cap taper starts at the mainnet switch, " + utc(burn.switch) + "."));
  const b = burn.bond;
  if (!b || !b.all.blocks) return section("Burn", more, h("div", { class: "empty" }, "This bond has signed no block since the switch."));
  const { all, day, week } = b, w = burn.window, f = ratio(all.withheld, all.scheduled) || 0;
  const burned = cell("burned since the switch", coinShort(all.withheld));
  burned.appendChild(meter(f, true));
  const period = (k, t) => t.blocks
    ? stat(k, coinShort(t.withheld), pct(ratio(t.minted, t.scheduled)) + " of the subsidy minted")
    : stat(k, h("span", { class: "dim" }, "\u2014"), "no blocks");
  return section("Burn", more, h("div", { class: "grid" },
    burned,
    stat("rank", all.rank != null ? "#" + num(all.rank) + " of " + num(burn.ranked) : "\u2014", null),
    stat("full subsidy minted", mintedPct(all)),
    period("last 24h", day),
    period("last 7 days", week),
    stat("burn streak", num(b.streak), "longest " + num(b.longest_streak), true)));
}

// ---------- privacy --------------------------------------------------------
async function privacyPage() {
  const r = await get("/explorer/blocks?count=200");
  const b = r.blocks.slice().reverse();
  const outs = b.map(x => x.body_outputs != null ? x.body_outputs : x.outputs);
  const txs = b.map(x => x.kernels);
  const linked = b.map(x => x.linked_outputs || 0);
  const pairs = b.map((x, i) => x.inputs * outs[i]);
  const mix = b.map((x, i) => txs[i] ? (x.inputs + outs[i]) / txs[i] : 0);
  const carried = b.map((x, i) => i).filter(i => outs[i] > 0);
  const share = carried.map(i => linked[i] / outs[i]);
  const sum = a => a.reduce((p, c) => p + c, 0);
  const busy = b.filter((_, i) => txs[i] > 0).length;
  const totOut = sum(outs), totLinked = sum(linked), totTx = sum(txs);
  const meanPairs = busy ? sum(pairs) / busy : 0;
  const meanMix = busy ? sum(mix.filter((_, i) => txs[i] > 0)) / busy : 0;

  view.replaceChildren(
    h("div", { class: "title" }, h("h1", null, "Privacy"),
      h("span", { class: "dim" }, "what the chain does and does not reveal, over its last " + num(b.length) + " blocks")),
    h("div", { class: "kpis" },
      kpi("blocks", num(b.length), "examined"),
      kpi("with a transaction", num(busy), "the rest were empty"),
      kpi("transactions", num(totTx), "one kernel, one transaction"),
      kpi("pairings a block", busy ? num(Math.round(meanPairs)) : "\u2014", "assignments left consistent"),
      kpi("public siblings", totOut ? pct(totLinked / totOut) : "\u2014", "outputs that share a proof"),
      kpi("aggregation", busy ? meanMix.toFixed(2) : "\u2014", "in+out per transaction")),
    section("Measured", "refreshes every 20s",
      h("div", { class: "charts two" },
        h("div", { class: "chart" }, h("div", { class: "k" }, "pairings a block permits \u00b7 log scale"),
          barChart(pairs, { log: true, colour: themeColors().in, label: (v, i) => v + " pairings in block " + b[i].height })),
        h("div", { class: "chart" }, h("div", { class: "k" }, "share of outputs with a public sibling"),
          carried.length ? shareChart(share, themeColors().amber, (v, k) => pct(v) + " of " + outs[carried[k]] + " outputs in block " + b[carried[k]].height)
            : h("div", { class: "empty" }, "no transactions in this span")),
        h("div", { class: "chart" }, h("div", { class: "k" }, "transactions a block"),
          barChart(txs, { colour: themeColors().out, label: (v, i) => v + " in block " + b[i].height })),
        h("div", { class: "chart" }, h("div", { class: "k" }, "inputs + outputs per transaction"),
          barChart(mix, { colour: themeColors().kern, label: (v, i) => v.toFixed(2) + " in block " + b[i].height })))),
    h("div", { class: "note", style: "border-top:0" },
      "No amount, address or sender is read: the chain records none. These measure how much aggregation hides."));
  schedule(privacyPage, 20000);
}

async function mempoolPage() {

  const txs = m.transactions || [];
  const rateOf = t => t.fee_rate || 0;

  txs.forEach(t => {
    const row = h("details", { class: "txrow" });
    row.appendChild(h("summary", null,
      h("span", { class: "hash" }, short(t.hash, 16)),
      h("span", { class: "dim" }, t.inputs + " in \u00b7 " + t.outputs + " out \u00b7 " + t.kernels + " kernel" + (t.kernels === 1 ? "" : "s")),
      h("span", null, coins(t.fee), h("span", { class: "dim" }, "  " + num(Math.round(rateOf(t))) + " units/wt"))));
    const body = h("div", { class: "body" });
    body.appendChild(dl([
      ["spends", t.spends.length
        ? h("div", null, t.spends.map((c, i) => [i ? " \u00b7 " : null, link("output", c, short(c, 14))]))
        : h("span", { class: "dim" }, "nothing \u2014 new coins only")],
      ...t.groups.map((g, gi) => ["creates" + (t.groups.length > 1 ? " (group " + (gi + 1) + ")" : ""),
        h("div", null,
          g.commitments.map((c, i) => [i ? " \u00b7 " : null, link("output", c, short(c, 14))]),
          h("div", { class: "dim" }, g.commitments.length + " output" + (g.commitments.length === 1 ? "" : "s") + " under one " + num(g.range_proof_bytes) + "-byte proof"))]),
      ["weight", num(t.weight)],
    ]));
    row.appendChild(body);
    list.appendChild(row);
  });

  view.replaceChildren(
    h("div", { class: "title" }, h("h1", null, "Mempool"), h("span", { class: "dim" }, "transactions waiting, best fee rate first")),
    h("div", { class: "kpis" },
      kpi("waiting", num(m.count), "transactions"),
      kpi("total fees", coins(m.fees), "MDW"),
      kpi("weight", num(m.weight), "units"),
      kpi("best fee rate", txs.length ? num(Math.round(rateOf(txs[0]))) : "\u2014", "units per weight", { small: true })),
    section("Waiting", "refreshes every 5s",
      txs.length ? h("div", { class: "charts" }, h("div", { class: "chart" },
        h("div", { class: "k" }, "fee rate per transaction"),
        barChart(txs.map(rateOf), { colour: themeColors().amber, label: (v, i) => num(Math.round(v)) + " units per weight \u00b7 " + short(txs[i].hash, 12) }))) : null),
    section("Transactions", m.listed < m.count ? "showing " + num(m.listed) + " of " + num(m.count) : null,
      txs.length ? list : h("div", { class: "empty" }, "nothing waiting")));
  schedule(mempoolPage, 5000);
}

// ---------- api ------------------------------------------------------------
function apiValue(v) {
  if (v == null) return h("span", { class: "dim" }, "\u2014");
  if (typeof v === "string") return v;
  if (typeof v === "number" || typeof v === "boolean") return String(v);
  if (Array.isArray(v)) return v.map(x => apiValue(x)).join(", ");
  return h("span", null, Object.entries(v).map(([k, x], i) => [i ? " \u00b7 " : null, h("span", { class: "dim" }, k + ": "), apiValue(x)]));
}
async function apiPage() {

  view.replaceChildren(
    h("div", { class: "title" }, h("h1", null, "API"), h("span", { class: "dim" }, Object.keys(endpoints).length + " JSON endpoints")),

        h("tr", null, h("td", null, h("a", { href: path, class: "hash" }, path)), h("td", { style: "white-space:normal" }, apiValue(desc)))))))),

      "All endpoints return JSON. Base paths: /explorer/{blocks, block/:id, output/:id, kernel/:id, bonds, bond/:id, burn, search/:query, mempool, network, anchors, relay, api, chart/difficulty, chart/emission}."));
}

// ---------- routing, refresh, search ---------------------------------------
let timer = null, generation = 0, sseConn = null, newSinceLoad = 0, newBlocksEl = null;
function schedule(fn, ms) {
  const mine = generation;
  clearTimeout(timer);
  timer = setTimeout(() => { if (mine === generation) fn().catch(() => {}); }, ms);
}
const routes = [
  [/^#?\/?$/, overview],
  [/^#\/blocks(?:\/(\d+))?$/, blocksPage],
  [/^#\/block\/(\d+|[0-9a-fA-F]{64})$/, blockPage],
  [/^#\/output\/([0-9a-fA-F]{64})$/, outputPage],
  [/^#\/kernel\/([0-9a-fA-F]{64})$/, kernelPage],
  [/^#\/bonds$/, bondsPage],
  [/^#\/burn$/, burnPage],
  [/^#\/privacy$/, privacyPage],
  [/^#\/network$/, networkPage],
  [/^#\/mempool$/, mempoolPage],
  [/^#\/bond\/([0-9a-fA-F]{64})$/, bondPage],
  [/^#\/api$/, apiPage],
  [/^#\/anchors$/, anchorsPage],
  [/^#\/relay$/, relayPage],
];
const NAV_SECTION = { block: "blocks", output: "blocks", kernel: "blocks", bond: "bonds" };
function markNav(hash) {
  const head = hash.replace(/^#?\/?/, "").split("/")[0];
  const section = NAV_SECTION[head] || head;
  for (const a of document.querySelectorAll(".bar-top nav a")) {
    const target = (a.getAttribute("href") || "").replace(/^#\/?/, "");
    a.classList.toggle("on", target === section);
  }
}
async function route() {
  generation++;
  clearTimeout(timer);
  if (sseConn) { sseConn.close(); sseConn = null; }
  const hash = location.hash || "#/";
  markNav(hash);
  if (hash.replace(/^#?\/?/, "").split("/")[0] !== "block") blockTab = "overview";
  const found = routes.find(([re]) => re.test(hash));
  window.scrollTo(0, 0);
  if (!found) { view.replaceChildren(section("Not found", null, h("div", { class: "empty" }, "No page at " + hash + "."))); return; }
  try { await found[1](hash.match(found[0])); }
  catch (e) { view.replaceChildren(section("Nothing here", null, h("div", { class: "empty" }, e.message))); }
}
document.getElementById("search").addEventListener("submit", async ev => {
  ev.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  try {
    const r = await get("/explorer/search/" + encodeURIComponent(q));
    document.getElementById("q").value = "";
    location.hash = "#/" + r.kind + "/" + r.id;
  } catch (e) { flash(e.message); }
});
document.getElementById('themeToggle')?.addEventListener('click', toggleTheme);

const barTop = document.querySelector('.bar-top');
const hamburger = document.getElementById('hamburger');
function setNav(open) {
  barTop.classList.toggle('nav-open', open);
  hamburger.setAttribute('aria-expanded', open ? 'true' : 'false');
}
hamburger?.addEventListener('click', () => setNav(!barTop.classList.contains('nav-open')));
document.getElementById('mainnav')?.addEventListener('click', e => { if (e.target.closest('a')) setNav(false); });
window.addEventListener('hashchange', () => setNav(false));
window.addEventListener("hashchange", route);
(function initTheme() {
  const saved = localStorage.getItem('explorer-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('themeToggle');
  if (btn) btn.textContent = saved === 'light' ? '\u2600' : '\u263E';
})();
route();
</script>
