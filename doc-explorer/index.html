 peer and denies the request.\n2. **Preconditions**: The `peer` must exist in the state map or be added implicitly.\n3. **Postconditions**: Returns `true` if the request is allowed; `false` otherwise (and triggers a strike). `expensive_count` is incremented upon success.\n4. **Z Notation (informal)**: $\\text{check\\_expensive} \\implies (\\text{expensive\\_count} < \\text{limit}) \\implies (\\text{expensive\\_count} := \\text{expensive\\_count} + 1; \\text{return True})$\n5. **Doc comment**: Checks the expensive request limit. If exceeded, strikes the peer and returns `false`.\n\n### `async fn close_stream(&self, peer: PeerId)`\n1. **Reasoning**: Decrements the active stream count when a connection is closed.\n2. **Preconditions**: The `peer` must exist in the state map.\n3. **Postconditions**: `active_streams` for the peer is decremented (saturating).\n4. **Z Notation (informal)**: $\\text{close\\_stream} \\implies \\text{active\\_streams} := \\max(0, \\text{active\\_streams} - 1)$\n5. **Doc comment**: Decrements the active stream count for a given peer.\n\n### `async fn remove_peer(&self, peer: &PeerId)`\n1. **Reasoning**: Removes a peer entirely from the tracking state (e.g., upon permanent disconnection).\n2. **Preconditions**: The `peer` must be tracked in the state map.\n3. **Postconditions**: The entry for `peer` is removed from the internal state map.\n4. **Z Notation (informal)**: $\\text{remove\\_peer} \\implies \\text{state} := \\text{state} \\setminus \\{\\text{peer}\\}$\n5. **Doc comment**: Removes a peer entirely from the light client tracking state.\n\n### `async fn is_banned(&self, peer: &PeerId) -> bool`\n1. **Reasoning**: Checks if the peer is currently banned based on its state.\n2. **Preconditions**: The `peer` must exist in the state map.\n3. **Postconditions**: Returns `true` if the ban period is active, otherwise `false`.\n4. **Z Notation (informal)**: $\\text{is\\_banned} = \\text{state}[\\text{peer}] \\text{.is\\_banned}()$\n5. **Doc comment**: Checks if a specific peer is currently under a temporary ban.\n\n### `async fn observe_honest(&self, peer: PeerId)`\n1. **Reasoning**: Increases the $\\alpha$ (honest) count for a peer, reinforcing positive reputation.\n2. **Preconditions**: The `peer` must exist in the state map.\n3. **Postconditions**: $\\alpha$ is incremented (saturating) up to 10,000.\n4. **Z Notation (informal)**: $\\text{observe\\_honest} \\implies \\alpha := \\min(10000, \\alpha + 1)$\n5. **Doc comment**: Records an honest observation for a peer, increasing the $\\alpha$ reputation count.\n\n### `async fn observe_adversarial(&self, peer: PeerId)`\n1. **Reasoning**: Increases the $\\beta$ (adversarial) count significantly upon negative behavior, potentially triggering an immediate ban if $\\beta$ heavily outweighs $\\alpha$.\n2. **Preconditions**: The `peer` must exist in the state map.\n3. **Postconditions**: $\\beta$ is incremented by 10 (saturating). If $\\beta > 10 \\cdot \\alpha$, a temporary ban is applied.\n4. **Z Notation (informal)**: $\\text{observe\\_adv} \\implies \\beta := \\min(10000, \\beta + 10) \\land (\\beta > 10\\alpha) \\implies (\\text{banned\\_until} := \\text{NOW} + \\text{DURATION})$\n5. **Doc comment**: Records an adversarial observation, increasing $\\beta$. May trigger an immediate ban if the adversarial count significantly outweighs the honest count.\n\n### `async fn gc_stale(&self)`\n1. **Reasoning**: Performs garbage collection by removing peers that have no active streams, are not banned, and whose window has been inactive for a long duration (1 hour).\n2. **Preconditions**: None.\n3. **Postconditions**: The internal state map is pruned, retaining only active or recently observed/banned peers.\n4. **Z Notation (informal)**: $\\text{gc\\_stale} \\implies \\text{state} := \\{s \\in \\text{state} \\mid s.\\text{active\\_streams} > 0 \\lor s.\\text{is\\_banned}() \\lor \\text{window\\_start} \\text{ elapsed} < 3600\\}$\n5. **Doc comment**: Garbage collects stale peer entries, removing those with no active streams and long-inactive windows.\n\n## Network\n\n### `async fn new(...) -> Result<Self>`\n1. **Reasoning**: Convenience constructor that delegates to `with_data_dir`.\n2. **Preconditions**: Valid `Keypair`, `listen_addr`, `bootstrap_peers`, and `banned_peers` must be provided.\n3. **Postconditions**: A fully initialized `Network` struct is returned, ready for operation.\n4. **Z Notation (informal)**: $\\text{new} \\implies \\text{with\\_data\\_dir}(\\dots) \\to \\text{Network}'$\n5. **Doc comment**: Creates a new network instance using the data directory path (if provided).\n\n### `async fn with_data_dir(...) -> Result<Self>`\n1. **Reasoning**: Primary initialization function. Sets up the libp2p swarm, registers protocols, loads/creates the WebRTC certificate (if enabled), sets up listening addresses (TCP, QUIC, WebRTC), and initiates Kademlia bootstrapping.\n2. **Preconditions**: Valid `Keypair`, `listen_addr`, `bootstrap_peers`, and `banned_peers` must be provided.\n3. **Postconditions**: A fully initialized `Network` struct is returned. The WebRTC certificate is persisted if created. Initial bans are applied via `bans::Bans`.\n4. **Z Notation (informal)**: $\\text{with\\_data\\_dir} \\implies \\text{Swarm}' = \\text{build\\_swarm}(\\dots) \\land \\text{Network}' = \\text{initialize}(\\text{Swarm}', \\dots)$\n5. **Doc comment**: Initializes the network, setting up the libp2p swarm, listening addresses (TCP/QUIC/WebRTC), and bootstrapping Kademlia. Handles persistent state like the WebRTC certificate.\n\n### `pub fn has_light_peers(&self) -> bool`\n1. **Reasoning**: Checks if any light client peers have been connected.\n2. **Preconditions**: The `Network` instance must be initialized.\n3. **Postconditions**: Returns `true` if `light_peers` is non-empty, otherwise `false`.\n4. **Z Notation (informal)**: $\\text{has\\_light\\_peers} = \\text{light\\_peers} \\ne \\emptyset$\n5. **Doc comment**: Checks if the node currently has any connected light client peers.\n\n### `pub fn light_load(&self) -> (usize, usize)`\n1. **Reasoning**: Provides load information to browser wallets, indicating current capacity versus maximum capacity (`MAX_LIGHT_PEERS`), enabling load-aware peer placement.\n2. **Preconditions**: The `Network` instance must be initialized.\n3. **Postconditions**: Returns a tuple: (current light peers count, maximum allowed light peers).\n4. **Z Notation (informal)**: $\\text{light\\_load} = (\\text{light\\_peers}.\\text{len}(), \\text{MAX\\_LIGHT\\_PEERS})$\n5. **Doc comment**: Returns the current number of light peers and the maximum capacity, used by browser wallets for load-aware placement.\n\n### `pub fn broadcast_light_push(&mut self, notification: &LightNotification)`\n1. **Reasoning**: Sends a light client notification (e.g., state updates) to all connected light peers via dedicated push streams.\n2. **Preconditions**: `light_peers` must not be empty.\n3. **Postconditions**: A push message is asynchronously sent to every peer in `light_peers`.\n4. **Z Notation (informal)**: $\\text{broadcast\\_light\\_push} \\implies \\forall p \\in \\text{light\\_peers}: \\text{send\\_stream}(p, \\text{notification})$\n5. **Doc comment**: Broadcasts a light client notification to all connected light peers via dedicated push streams.\n\n### `pub fn observe_honest_light_peer(&self, peer: PeerId) -> impl std::future::Future<Output = ()> + Send + 'static`\n1. **Reasoning**: Provides an asynchronous interface to record positive behavior for a light peer.\n2. **Preconditions**: The `Network` instance must be initialized.\n3. **Postconditions**: An asynchronous task is spawned that calls `LightGuard::observe_honest(peer)`.\n4. **Z Notation (informal)**: $\\text{observe\\_honest} \\implies \\text{spawn}(\\text{LightGuard}.\\text{observe\\_honest}(\\text{peer}))$\n5. **Doc comment**: Asynchronously records\n\n## Function Documentation\n\n### `is_routable` (Implicit logic from the first code block)\n\n**Reasoning**: Determines if a given `Multiaddr` represents an IP address that is publicly routable, excluding loopback, private ranges (RFC 1918, etc.), link-local, and specific reserved/non-public protocols (like P2pCircuit). This prevents peers from advertising addresses that are only reachable locally or internally.\n**Preconditions**: `addr` must be a valid `Multiaddr`.\n**Postconditions**: Returns `true` if the address contains at least one routable IP protocol (IPv4/IPv6) and no non-routable protocols (P2pCircuit, private IPs, etc.). Returns `false` otherwise.\n**Z Notation (informal)**: $\\text{IsRoutable}(A) \\iff \\exists P \\in A. (P = \\text{Ip4}(IP) \\land \\text{Public}(IP)) \\lor (P = \\text{Ip6}(IP) \\land \\text{Public}(IP))$\n**Doc comment**: Checks if a `Multiaddr` contains at least one publicly routable IP address, excluding loopback, private ranges, and reserved protocols.\n\n### `socket_to_multiaddr`\n\n**Reasoning**: Converts standard Rust `SocketAddr` (which contains an IP and port) into the libp2p `Multiaddr` format, suitable for network addressing within the protocol.\n**Preconditions**: `addr` must be a valid `SocketAddr`.\n**Postconditions**: Returns a `Multiaddr` containing the appropriate IP protocol (Ip4 or Ip6) and the TCP protocol bound to the specified port.\n**Z Notation (informal)**: $\\text{SocketToMA}(S) = \\text{MA} \\mid (\\text{IP}(S) \\to \\text{Proto}) \\land (\\text{Port}(S) \\to \\text{Tcp})$\n**Doc comment**: Converts a standard `SocketAddr` into a libp2p `Multiaddr`.\n\n### `tcp_to_udp_variant`\n\n**Reasoning**: Provides a generic mechanism to transform a TCP address component within a `Multiaddr` into a UDP address component, allowing for protocol migration (e.g., TCP $\\to$ QUIC/UDP). It handles port offset and appends a new suffix protocol.\n**Preconditions**: `addr` must be a valid `Multiaddr` containing exactly one `Protocol::Tcp`. `port_offset` must be non-negative. `suffix` must be a valid libp2p protocol.\n**Postconditions**: Returns `Some(new_multiaddr)` where the TCP component is replaced by UDP, the port is adjusted by `port_offset`, and `suffix` is appended. Returns `None` if no TCP component is found or if port arithmetic overflows.\n**Z Notation (informal)**: $\\text{TCPtoUDP}(A, O, S) = \\begin{cases} \\text{MA}' & \\text{if } A \\text{ contains Tcp and } \\text{Port}(A)+O \\text{ is valid} \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n**Doc comment**: Converts a TCP component in a `Multiaddr` to a UDP component, applying a port offset and appending a new protocol suffix.\n\n### `tcp_to_quic`\n\n**Reasoning**: A specific utility function to transform a TCP-based `Multiaddr` into a QUIC (UDP-based) `Multiaddr`, which is common for modern peer-to-peer communication.\n**Preconditions**: `addr` must be a valid `Multiaddr` containing exactly one `Protocol::Tcp`.\n**Postconditions**: Returns `Some(new_multiaddr)` where the TCP component is replaced by UDP and `Protocol::QuicV1` is appended. Returns `None` if the input address is not suitable for conversion.\n**Z Notation (informal)**: $\\text{TCPtoQUIC}(A) = \\text{TCPtoUDP}(A, 0, \\text{QuicV1})$\n**Doc comment**: Converts a TCP-based `Multiaddr` to a QUIC-based `Multiaddr`.\n\n### `tcp_to_webrtc`\n\n**Reasoning**: A feature-gated utility function to transform a TCP-based `Multiaddr` into a WebRTC-direct (UDP-based) `Multiaddr`, enabling browser dialing.\n**Preconditions**: `addr` must be a valid `Multiaddr` containing exactly one `Protocol::Tcp`. The `webrtc` feature must be enabled.\n**Postconditions**: Returns `Some(new_multiaddr)` where the TCP component is replaced by UDP, a port offset of 2 is applied, and `Protocol::WebRTCDirect` is appended. Returns `None` if the input address is not suitable for conversion.\n**Z Notation (informal)**: $\\text{TCPtoWebRTC}(A) = \\text{TCPtoUDP}(A, 2, \\text{WebRTCDirect})$\n**Doc comment**: Converts a TCP-based `Multiaddr` to a WebRTC-direct `Multiaddr` (requires `webrtc` feature).\n\n### `extract_peer_id`\n\n**Reasoning**: Allows extraction of the unique peer identifier (`PeerId`) from a `Multiaddr`, which is crucial for identifying and addressing specific nodes within the network.\n**Preconditions**: `addr` must be a valid `Multiaddr` containing at least one `Protocol::P2p(id)`.\n**Postconditions**: Returns `Some(PeerId)` if a P2p protocol component is found, otherwise returns `None`.\n**Z Notation (informal)**: $\\text{ExtractID}(A) = \\text{id} \\mid \\exists P \\in A. (P = \\text{P2p}(\\text{id}))$\n**Doc comment**: Extracts the `PeerId` from a `Multiaddr`, if present.\n\n### `extract_subnet`\n\n**Reasoning**: Attempts to derive a subnet IP address (e.g., `/24` for IPv4, `/32` for IPv6) from a `Multiaddr`. This is useful for grouping peers within the same local network segment, but explicitly excludes loopback and P2pCircuit addresses.\n**Preconditions**: `addr` must be a valid `Multiaddr` that does not represent a localhost address or contain a `P2pCircuit` protocol.\n**Postconditions**: Returns `Some(IpAddr)` representing the subnet IP (e.g., setting lower octets/segments to zero), or `None` if the address is local, a circuit, or lacks an IP component.\n**Z Notation (informal)**: $\\text{ExtractSubnet}(A) = \\begin{cases} \\text{IP}_{\\text{Subnet}} & \\text{if } A \\text{ is routable and has an IP} \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n**Doc comment**: Extracts the subnet IP address (e.g., /24 for IPv4, /32 for IPv6) from a `Multiaddr`, excluding loopback and P2pCircuit addresses.\n\n### `browser_dialable`\n\n**Reasoning**: Checks if a `Multiaddr` is formatted correctly to be used by a web browser for direct connection (WebRTC-direct) and includes the necessary certificate hash (`Certhash`) for authentication.\n**Preconditions**: `addr` must be a valid `Multiaddr`.\n**Postconditions**: Returns `true` if the address contains both `Protocol::WebRTCDirect` and at least one `Protocol::Certhash(_)`, otherwise returns `false`.\n**Z Notation (informal)**: $\\text{BrowserDialable}(A) \\iff \\exists P_1 \\in A. (P_1 = \\text{WebRTCDirect}) \\land \\exists P_2 \\in A. (P_2 = \\text{Certhash}(\\_) )$\n**Doc comment**: Checks if a `Multiaddr` is configured as a browser-dialable WebRTC address (includes `Certhash`).\n\n### `is_localhost`\n\n**Reasoning**: Utility function to quickly determine if any IP address within a `Multiaddr` is a loopback address (e.g., `127.0.0.1`, `::1`).\n**Preconditions**: `addr` must be a valid `Multiaddr`.\n**Postconditions**: Returns `true` if the `Multiaddr` contains an IPv4 or IPv6 loopback address, otherwise returns `false`.\n**Z Notation (informal)**: $\\text{IsLocalhost}(A) \\iff \\exists P \\in A. (P = \\text{Ip4}(IP) \\land IP.\\text{is\\_loopback}()) \\lor (P = \\text{Ip6}(IP) \\land IP.\\text{is\\_loopback}()) $\n**Doc comment**: Checks if the `Multiaddr` contains any loopback IP address.\n\n### `extract_ip`\n\n**Reasoning**: Simple utility to extract the raw IP address (`IpAddr`) from a `Multiaddr`, ignoring port or protocol details.\n**Preconditions**: `addr` must be a valid `Multiaddr` containing at least one IP protocol (Ip4 or Ip6).\n**Postconditions**: Returns `Some(IpAddr)` if an IP component is found, otherwise returns `None`.\n**Z Notation (informal)**: $\\text{ExtractIP}(A) = \\text{IP} \\mid \\exists P \\in A. (P = \\text{Ip4}(\\text{IP}) \\lor P = \\text{Ip6}(\\text{IP}))$\n**Doc comment**: Extracts the raw `IpAddr` (V4 or V6) from a `Multiaddr`.\n\n### `replace_ip`\n\n**Reasoning**: Allows modification of an IP address component within a `Multiaddr` without altering other protocols (ports, P2p IDs, etc.). This is essential for making WebRTC addresses dialable using the peer's public IP.\n**Preconditions**: `addr` must be a valid `Multiaddr`. `new_ip` must be a valid `IpAddr`.\n**Postconditions**: Returns a new `Multiaddr` identical to the input, but with the original IP protocol component replaced by the specified `new_ip`.\n**Z Notation (informal)**: $\\text{ReplaceIP}(A, I) = A' \\mid A' \\text{ is } A \\text{ with } \\text{Ip4/Ip6} \\to I$\n**Doc comment**: Creates a new `Multiaddr` by replacing the existing IP address component with a specified new IP.\n\n### `dialable_webrtc`\n\n**Reasoning**: Adjusts WebRTC-direct addresses that were announced using a local or unspecified IP (`0.0.0.0`) to use the peer's known public IP. This ensures browsers can dial the node correctly. It avoids modifying already routable addresses.\n**Preconditions**: `addrs` is a mutable vector of `Multiaddr`. `peer_ip` must be `Some(IpAddr)` if any modification is intended.\n**Postconditions**: Returns the modified vector of `Multiaddr`. Addresses that are not routable (and `peer_ip` is provided) are updated to use `peer_ip`. Routable addresses and addresses where `peer_ip` is `None` remain unchanged.\n**Z Notation (informal)**: $\\text{DialableWebRTC}(A, I) = A' \\mid \\forall a \\in A: (\\neg \\text{IsRoutable}(a) \\land I \\neq \\text{None}) \\implies a' = \\text{ReplaceIP}(a, I)$\n**Doc comment**: Makes WebRTC-direct addresses dialable by replacing non-routable IP components with the peer's known public IP.\n\n***\n*(Note: The `is_routable` function is implicitly used throughout the provided code and its logic was documented above.)*"}, {"path": "network/protocol.rs", "module": "network", "doc": "## Constants and Protocol ID\n\n**`MAX_GETBATCHES_COUNT`**\n1. **Reasoning**: Defines a hard limit on the number of batches returned in a `Batches` response to prevent excessive memory usage and adhere to overall message size limits.\n2. **Preconditions**: None.\n3. **Postconditions**: The count of batches in a `Batches` response will not exceed this value during deserialization validation.\n4. **Z Notation (informal)**: $\\forall m \\in \\text{Message} \\bullet (m = \\text{Batches}(\\_, B) \\implies |B| \\le \\text{MAX\\_GETBATCHES\\_COUNT})$\n5. **Doc comment**: Maximum number of batches allowed in a single `Batches` response message.\n\n**`MAX_MSG_SIZE`**\n1. **Reasoning**: Enforces a strict upper bound on the size of any serialized message, protecting against denial-of-service attacks via oversized payloads and ensuring stream stability.\n2. **Preconditions**: None.\n3. **Postconditions**: Any successful serialization or deserialization operation guarantees the payload size is $\\le \\text{MAX\\_MSG\\_SIZE}$.\n4. **Z Notation (informal)**: $\\forall m \\in \\text{Message} \\bullet \\text{size}(m) \\le \\text{MAX\\_MSG\\_SIZE}$\n5. **Doc comment**: Absolute maximum size (in bytes) allowed for any wire message.\n\n**`MIDWIMBLE_PROTOCOL`**\n1. **Reasoning**: Provides a unique identifier for this specific protocol version (`/midwimble/2.0.0`), ensuring compatibility only between nodes running the same protocol specification.\n2. **Preconditions**: None.\n3. **Postconditions**: The protocol identifier is fixed to `/midwimble/2.0.0`.\n4. **Z Notation (informal)**: $\\text{ProtocolID} = \"/\\text{midwimble}/2.0.0\"$\n5. **Doc comment**: Unique `libp2p` stream protocol identifier for Midwimble 2.0.0.\n\n## `Message` Enum\n\n**`Message`** (Enum)\n1. **Reasoning**: Defines the complete set of wire-level commands and data structures used for node-to-node communication, covering transaction gossip, state synchronization, peer discovery, and checkpointing.\n2. **Preconditions**: None.\n3. **Postconditions**: Any instance of `Message` can be serialized into a length-prefixed binary format adhering to size limits.\n4. **Z Notation (informal)**: $\\text{Message} ::= \\text{Transaction}(\\text{T}) | \\text{Batch}(\\text{B}) | \\dots$\n5. **Doc comment**: Defines all possible messages exchanged over the wire protocol.\n\n## `Message` Methods\n\n**`Message::serialize_bin(&self)`**\n1. **Reasoning**: Provides a convenience wrapper for serialization, ensuring that if the message exceeds the defined size limit, it fails immediately with a clear panic (though ideally, this should be handled by `try_serialize_bin`).\n2. **Preconditions**: The message must not exceed `MAX_MSG_SIZE`.\n3. **Postconditions**: Returns a `Vec<u8>` representing the serialized message, or panics if the size limit is violated.\n4. **Z Notation (informal)**: $\\text{serialize\\_bin}(m) \\implies \\text{size}(m) \\le \\text{MAX\\_MSG\\_SIZE} \\land \\text{return } \\text{bincode}(m)$\n5. **Doc comment**: Serializes the message into a byte vector, panicking if it exceeds `MAX_MSG_SIZE`.\n\n**`Message::try_serialize_bin(&self)`**\n1. **Reasoning**: The primary serialization method used by writers. It strictly enforces the `MAX_MSG_SIZE` limit using `bincode` options and returns an `io::Result`, allowing stream handlers to gracefully fail instead of panicking the connection task.\n2. **Preconditions**: None.\n3. **Postconditions**: Returns `Ok(Vec<u8>)` if serialization succeeds and the size is within limits; otherwise, returns an `io::Error` (specifically `InvalidData`) indicating a size violation or serialization failure.\n4. **Z Notation (informal)**: $\\text{try\\_serialize\\_bin}(m) \\implies (\\text{size}(m) \\le \\text{MAX\\_MSG\\_SIZE}) \\implies \\text{Ok}(\\text{bincode}(m)) \\lor \\text{Err}(\\text{io\\_error})$\n5. **Doc comment**: Attempts to serialize the message, failing with an `io::Error` if the size exceeds `MAX_MSG_SIZE`.\n\n**`Message::serialized_size(&self)`**\n1. **Reasoning**: Allows peers to check the expected size of a message before attempting transmission or allocation, aiding in flow control and pre-emptive error checking.\n2. **Preconditions**: None.\n3. **Postconditions**: Returns the exact byte size required for serialization, or `u64::MAX` if size calculation fails.\n4. **Z Notation (informal)**: $\\text{serialized\\_size}(m) = \\text{bincode\\_size}(m) \\lor \\text{u64::MAX}$\n5. **Doc comment**: Calculates the byte size required to serialize the message.\n\n**`Message::deserialize_bin(bytes: &[u8])`**\n1. **Reasoning**: Parses raw bytes into a `Message` enum variant. Crucially, it performs *semantic* validation (e.g., batch count limits, anchor count limits) *after* successful deserialization to prevent logical overflows or resource exhaustion even if the message size is within `MAX_MSG_SIZE`.\n2. **Preconditions**: The input `bytes` must be a valid bincode representation of a `Message`, and its length must be $\\le \\text{MAX\\_MSG\\_SIZE}$.\n3. **Postconditions**: Returns `Ok(Message)` if deserialization succeeds and all internal constraints (e.g., `MAX_GETHEADERS_COUNT`) are met; otherwise, returns an `anyhow::Error` detailing the validation failure or parsing error.\n4. **Z Notation (informal)**: $\\text{deserialize\\_bin}(\\text{bytes}) \\implies (\\text{valid\\_bincode} \\land \\text{size} \\le \\text{MAX\\_MSG\\_SIZE} \\land \\text{semantic\\_constraints}) \\implies \\text{Ok}(m) \\lor \\text{Err}(\\text{validation\\_error})$\n5. **Doc comment**: Deserializes bytes into a `Message`, performing strict semantic validation against defined limits.\n\n## `MidwimbleCodec` Implementation\n\n**`impl libp2p::request_response::Codec for MidwimbleCodec`** (Trait Implementation)\n1. **Reasoning**: Implements the standard `libp2p` request/response codec interface, abstracting the low-level length-prefixed framing, size checks, and timeout logic into standard asynchronous I/O operations.\n2. **Preconditions**: The underlying I/O stream (`T`) must implement `AsyncRead` or `AsyncWrite`.\n3. **Postconditions**: All I/O operations (read/write) are handled using the defined framing protocol (length prefix + payload), respecting `MAX_MSG_SIZE` and the 60-second read deadline.\n4. **Z Notation (informal)**: $\\text{Codec}(\\text{Midwimble}) \\implies \\forall \\text{io} \\bullet (\\text{read\\_request}(\\text{io}) \\to \\text{Message}) \\land (\\text{write\\_request}(\\text{io}, m) \\to \\text{Success})$\n5. **Doc comment**: Implements the `libp2p` codec for Midwimble, handling framing, size limits, and timeouts.\n\n## Helper Functions\n\n**`read_message<T: AsyncRead + Unpin + Send>(io: &mut T)`**\n1. **Reasoning**: Handles the core wire protocol logic: reading the 4-byte length prefix, checking against `MAX_MSG_SIZE`, reading the payload, and performing panic-isolated deserialization with a 60-second timeout. This isolation prevents malformed messages from crashing the connection task.\n2. **Preconditions**: The underlying stream (`io`) must be ready to provide a 4-byte length prefix followed by the full message payload.\n3. **Postconditions**: Returns `Ok(Message)` upon successful, timed-out, and panic-isolated deserialization; otherwise, returns an `io::Error` (Timeout, InvalidData, UnexpectedEof).\n4. **Z Notation (informal)**: $\\text{read\\_message}(\\text{io}) \\implies (\\text{timeout} \\le 60s) \\land (\\text{size} \\le \\text{MAX\\_MSG\\_SIZE}) \\land \\text{Ok}(m) \\lor \\text{Err}(\\text{io\\_error})$\n5. **Doc comment**: Reads a length-prefixed message from the stream, enforcing size limits and a 60-second read timeout, with panic isolation during decoding.\n\n**`write_message<T: AsyncWrite + Unpin + Send>(io: &mut T, msg: &Message)`**\n1. **Reasoning**: Serializes the message, prepends the length prefix, writes both to the stream, and ensures the connection is closed afterward (`io.close().await?`).\n2. **Preconditions**: The message must successfully serialize (i.e., $\\text{size}(msg) \\le \\text{MAX\\_MSG\\_SIZE}$).\n3. **Postconditions**: Writes the 4-byte length prefix followed by the serialized payload to the stream, and closes the underlying I/O resource. Returns `Ok(())` on successful write.\n4. **Z Notation (informal)**: $\\text{write\\_message}(\\text{io}, m) \\implies \\text{try\\_serialize\\_bin}(m) = \\text{Ok}(b) \\land \\text{write\\_all}(\\text{len}(b)) \\land \\text{write\\_all}(b) \\land \\text{close}(\\text{io}) \\land \\text{Ok}()$\n5. **Doc comment**: Serializes the message, prepends the length prefix, writes to the stream, and closes the connection."}], "wallet": [{"path": "wallet/mod.rs", "module": "wallet", "doc": "## Wallet Methods Documentation\n\n### `Wallet::create`\n\n1. **Reasoning**: Initializes a brand new wallet by generating a fresh BIP39 mnemonic, deriving keys, and saving the initial state to disk.\n2. **Preconditions**: The target file path must not exist.\n3. **Postconditions**: A new `Wallet` instance is created, saved to the specified path, and the generated mnemonic string is returned.\n4. **Z Notation (informal)**: $\\text{NewWallet}(P, W, H) \\Rightarrow \\exists \\text{Mnemonic}: (\\text{Mnemonic} \\text{ is valid}) \\land (\\text{WalletState}(P, \\text{Mnemonic}, H)) \\land (\\text{Return}(\\text{Wallet}, \\text{Mnemonic}))$\n5. **Doc comment**: Creates a new wallet with a fresh 24-word mnemonic and saves it to the specified path.\n\n### `Wallet::restore`\n\n1. **Reasoning**: Loads a wallet state from a known mnemonic, setting up the initial internal state for scanning.\n2. **Preconditions**: The target file path must not exist. The provided `recovery_height` must match the height used during creation.\n3. **Postconditions**: A new `Wallet` instance is created, initialized with the provided mnemonic and recovery data, and saved to disk.\n4. **Z Notation (informal)**: $\\text{RestoreWallet}(P, W, M, B, H) \\Rightarrow \\neg \\text{Exists}(P) \\land (\\text{WalletState}(P, M, H, B)) \\land (\\text{Return}(\\text{Wallet}))$\n5. **Doc comment**: Restores a wallet from a mnemonic, setting the initial scanning height (`birth_height`).\n\n### `Wallet::open`\n\n1. **Reasoning**: Loads an existing, encrypted wallet file from disk using the provided password, decrypting and deserializing the internal state.\n2. **Preconditions**: The wallet file must exist and start with `FILE_MAGIC`. The provided password must be correct.\n3. **Postconditions**: A fully initialized `Wallet` instance is returned, containing all keys and decrypted data.\n4. **Z Notation (informal)**: $\\text{OpenWallet}(P, W) \\Rightarrow \\text{Exists}(P) \\land (\\text{Decrypt}(P, W) = \\text{Data}) \\land (\\text{Return}(\\text{Wallet}))$\n5. **Doc comment**: Opens and decrypts an existing wallet file using the provided password.\n\n### `Wallet::save`\n\n1. **Reasoning**: Persists the current internal state of the wallet to disk securely by encrypting it with Argon2id and XChaCha20-Poly1305, ensuring atomic write via temporary files.\n2. **Preconditions**: The wallet must be in a valid, consistent state.\n3. **Postconditions**: The wallet file at `self.path` is updated atomically with the latest encrypted data.\n4. **Z Notation (informal)**: $\\text{SaveWallet}(W) \\Rightarrow \\text{AtomicWrite}(\\text{Encrypt}(\\text{Data}(W))) \\land (\\text{File}(P) = \\text{EncryptedData})$\n5. **Doc comment**: Writes the current wallet state atomically to disk, encrypted using Argon2id and XChaCha20-Poly1305.\n\n### `Wallet::change_password`\n\n1. **Reasoning**: Updates the wallet's password and immediately saves the new state under the new encryption key.\n2. **Preconditions**: The new password must not be empty.\n3. **Postconditions**: The internal password is updated, and the wallet file is saved using the new password for encryption.\n4. **Z Notation (informal)**: $\\text{ChangePassword}(W, W') \\Rightarrow \\text{Password}(W) = W' \\land \\text{SaveWallet}(W)$\n5. **Doc comment**: Changes the wallet password and immediately saves the updated, encrypted file.\n\n### `Wallet::mnemonic`\n\n1. **Reasoning**: Provides read-only access to the mnemonic phrase for recovery purposes.\n2. **Preconditions**: The wallet must be successfully loaded/created.\n3. **Postconditions**: Returns a reference to the stored mnemonic string.\n4. **Z Notation (informal)**: $\\text{Mnemonic}(W) \\Rightarrow \\text{Return}(\\text{Mnemonic}(W.\\text{data}))$\n5. **Doc comment**: Returns a reference to the wallet's 24-word mnemonic phrase.\n\n### `Wallet::address`\n\n1. **Reasoning**: Calculates and provides the public stealth address derived from the wallet's keys.\n2. **Preconditions**: The wallet must be successfully loaded/created, ensuring `WalletKeys` are available.\n3. **Postconditions**: Returns the wallet's `StealthAddress`.\n4. **Z Notation (informal)**: $\\text{Address}(W) \\Rightarrow \\text{Return}(\\text{Keys}(W).\\text{address}())$\n5. **Doc comment**: Returns the wallet's public stealth address.\n\n### `Wallet::view_key`\n\n1. **Reasoning**: Provides a restricted key view, allowing external parties (like pool miners) to audit payouts without gaining spending capability.\n2. **Preconditions**: The wallet must be successfully loaded/created.\n3. **Postconditions**: Returns a `ViewKey` object that permits read-only access to UTXOs.\n4. **Z Notation (informal)**: $\\text{ViewKey}(W) \\Rightarrow \\text{Return}(\\text{Keys}(W).\\text{view\\_only}())$\n5. **Doc comment**: Returns a view-only key allowing external auditing of incoming payments without spending rights.\n\n### `Wallet::scanned_height`\n\n1. **Reasoning**: Tracks the highest block height successfully processed by the wallet, defining the current scanning boundary.\n2. **Preconditions**: The wallet must be successfully loaded/created.\n3. **Postconditions**: Returns the current maximum scanned block height.\n4. **Z Notation (informal)**: $\\text{ScannedHeight}(W) \\Rightarrow \\text{Return}(W.\\text{data}.\\text{scanned\\_height})$\n5. **Doc comment**: Returns the highest block height successfully scanned by this wallet.\n\n### `Wallet::birth_height`\n\n1. **Reasoning**: Records the starting height of the current wallet instance, crucial for determining the absolute minimum rescan point (e.g., after a network relaunch).\n2. **Preconditions**: The wallet must be successfully loaded/created.\n3. **Postconditions**: Returns the initial height from which this wallet began scanning.\n4. **Z Notation (informal)**: $\\text{BirthHeight}(W) \\Rightarrow \\text{Return}(W.\\text{data}.\\text{birth\\_height})$\n5. **Doc comment**: Returns the starting block height (`birth_height`) of this wallet instance.\n\n### `Wallet::coins`\n\n1. **Reasoning**: Provides access to all known Unspent Transaction Outputs (UTXOs) held by the wallet.\n2. **Preconditions**: The wallet must be successfully loaded/created.\n3. **Postconditions**: Returns a slice containing all `WalletCoin` records.\n4. **Z Notation (informal)**: $\\text{Coins}(W) \\Rightarrow \\text{Return}(\\text{Data}(W).\\text{coins})$\n5. **Doc comment**: Returns a slice of all known unspent coin outputs (`WalletCoin`).\n\n### `Wallet::payments`\n\n1. **Reasoning**: Provides access to the history of payments initiated by this wallet, ordered oldest first.\n2. **Preconditions**: The wallet must be successfully loaded/created.\n3. **Postconditions**: Returns a slice containing all `Sent` payment records.\n4. **Z Notation (informal)**: $\\text{Payments}(W) \\Rightarrow \\text{Return}(\\text{Data}(W).\\text{sent})$\n5. **Doc comment**: Returns a slice of payments made by this wallet, ordered chronologically.\n\n### `Wallet::incoming`\n\n1. **Reasoning**: Provides the list of payments received by this wallet that are currently waiting in the node's mempool (unconfirmed).\n2. **Preconditions**: The wallet must have recently performed a sync that included mempool checks.\n3. **Postconditions**: Returns a slice containing all `Incoming` payment records from the last sync.\n4. **Z Notation (informal)**: $\\text{Incoming}(W) \\Rightarrow \\text{Return}(W.\\text{incoming})$\n5. **Doc comment**: Returns payments currently waiting in the node's mempool.\n\n### `Wallet::recorded_hash`\n\n1. **Reasoning**: Allows checking if a specific block hash was recorded within the `REORG_WINDOW`, essential for verifying chain continuity during scanning.\n2. **Preconditions**: The requested `height` must be within the window of recently scanned blocks.\n3. **Postconditions**: Returns `Some([u8; 32])` if the hash was recorded at that height, otherwise `None`.\n4. **Z Notation (informal)**: $\\text{RecordedHash}(W, H) \\Rightarrow \\text{Return}(\\text{Recent}(W) \\text{ contains } (H, \\text{Hash}))$\n5. **Doc comment**: Retrieves the block hash recorded for a specific height, if it is within the reorg window.\n\n### `Wallet::rollback_to`\n\n1. **Reasoning**: Handles chain reorganizations by invalidating UTXOs and payments confirmed at or above the specified `height`. This reserves coins for pending payments.\n2. **Preconditions**: `height` must be greater than 0.\n3. **Postconditions**: All coins and payments with height $\\ge$ `height` are invalidated (spent\\_height/height set to `None`). The wallet's recent block history is truncated, and `scanned_height` is updated. Returns `true` if any state changed.\n4. **Z Notation (informal)**: $\\text{Rollback}(W, H) \\Rightarrow \\forall c \\in \\text{Coins}: (\\text{Height}(c) \\ge H \\Rightarrow \\text{SpentHeight}(c) = \\text{None}) \\land \\text{Update}(\\text{State})$\n5. **Doc comment**: Rolls back the wallet state to `height`, invalidating all coins and payments confirmed at or above that height.\n\n### `Wallet::rescan_from`\n\n1. **Reasoning**: Initiates a targeted rescan from a specific height, typically after a rollback, without resetting the entire wallet history.\n2. **Preconditions**: The provided `height` must be less than or equal to the current `scanned_height`.\n3. **Postconditions**: The wallet state is rolled back to `height`, and `birth_height` is potentially updated to reflect the new minimum rescan point.\n4. **Z Notation (informal)**: $\\text{RescanFrom}(W, H) \\Rightarrow H \\le \\text{ScannedHeight}(W) \\land \\text{Rollback}(W, H) \\land \\text{Update}(\\text{BirthHeight})$\n5. **Doc comment**: Rescans the wallet state starting from a specified `height`, rolling back history up to that point.\n\n### `Wallet::sync`\n\n1. **Reasoning**: The primary method for updating the wallet state against a blockchain node, handling chain checks, reorganizations, scanning forward, and checking mempool status.\n2. **Preconditions**: A valid `RpcClient` connection to the blockchain node must be provided.\n3. **Postconditions**: The wallet state is updated (coins, payments, scanned height). A `SyncReport` detailing all changes (received, lost, confirmed, rolled\\_back\\_to) is returned.\n4. **Z Notation (informal)**: $\\text{Sync}(W, C) \\Rightarrow \\text{UpdateState}(W, C) \\land \\text{Return}(\\text{Report})$\n5. **Doc comment**: Synchronizes the wallet state with a blockchain node, handling chain checks, reorganizations, and scanning.\n\n### `Wallet::rescan`\n\n1. **Reasoning**: Used when the wallet detects it is on a different chain (e.g., network relaunch). It resets the state to the `birth_height` or specified `from` height.\n2. **Preconditions**: A valid `RpcClient` connection must be provided.\n3. **Postconditions**: If the chain differs from the recorded genesis, the wallet is reset (`start_over`). The internal state is updated, and a boolean indicating if a full reset occurred is returned.\n4. **Z Notation (informal)**: $\\text{Rescan}(W, C, F) \\Rightarrow (\\text{ChainMismatch} \\Rightarrow \\text{Reset}(W)) \\land \\text{Update}(\\text{State}) \\land \\text{Return}(\\text{Mismatch})$\n5. **Doc comment**: Rescans the wallet from a specified height or `birth_height`, resetting state if the node is on a different chain than recorded.\n\n### `Wallet::scan_unspent`\n\n1. **Reasoning**: Allows recovery of UTXOs when the node has pruned block bodies, reading only the unspent output list instead of scanning blocks.\n2. **Preconditions**: A list of `(Output, height, coinbase)` tuples from the node's unspent outputs must be provided.\n3. **Postconditions**: New UTXOs are added to `self.data.coins`. Existing coins whose outputs are no longer in the list are marked spent. The wallet's `scanned_height` is updated to `tip_height`. Returns the count of newly found coins.\n4. **Z Notation (informal)**: $\\text{ScanUnspent}(W, O, H) \\Rightarrow \\text{UpdateCoins}(W, O) \\land \\text{MarkSpent}(\\text{OldCoins}, H) \\land \\text{ScannedHeight}(W) = H \\land \\text{Return}(\\text{Count})$\n5. **Doc comment**: Rebuilds the wallet state using the node's unspent output list, compensating for block pruning.\n\n### `Wallet::sync_with`\n\n1. **Reasoning**: Provides a flexible, testable interface for syncing by accepting a custom block fetching function, decoupling it from a specific `RpcClient`.\n2. **Preconditions**: A valid `tip_height` and a mutable block fetching closure (`F`) must be provided.\n3. **Postconditions**: The wallet state is updated according to the blocks fetched. Returns the total number of blocks scanned.\n4. **Z Notation (informal)**: $\\text{SyncWith}(W, H, F) \\Rightarrow \\text{UpdateState}(W, F(H)) \\land \\text{Return}(\\text{BlocksScanned})$\n5. **Doc comment**: Synchronizes the wallet state using a custom block fetching function, allowing for testing and mock environments.\n\n### `Wallet::balance`\n\n1. **Reasoning**: Calculates the current financial status of the wallet, distinguishing between spendable, immature (coinbase), pending (own payments), and incoming (mempool).\n2. **Preconditions**: A current `tip_height` must be provided for maturity checks.\n3. **Postconditions**: Returns a `Balance` struct summarizing all coin values.\n4. **Z Notation (informal)**: $\\text{Balance}(W, H) \\Rightarrow \\text{Return}(\\text{Sum}(\\text{Spendable}) + \\text{Sum}(\\text{Immature}) + \\text{Incoming})$\n5. **Doc comment**: Calculates the current balance, separating spendable, immature, pending, and incoming funds based on `tip_height`.\n\n### `Wallet::build_send`\n\n1. **Reasoning**: Constructs a new transaction by selecting available UTXOs, calculating fees, and recording the payment internally.\n2. **Preconditions**: `amount` must be positive. Sufficient spendable funds must exist. The wallet must have available, mature coins.\n3. **Postconditions**: A valid `Transaction` object is returned. The selected UTXOs are marked as pending (`pending_tx`), and a new `Sent` record is added to the wallet data.\n4. **Z Notation (informal)**: $\\text{BuildSend}(W, T, A, F, H) \\Rightarrow \\exists \\text{Tx}: (\\text{Tx} \\text{ is valid}) \\land (\\text{MarkPending}(\\text{Inputs})) \\land \\text{Return}(\\text{Tx})$\n5. **Doc comment**: Builds and records a new payment transaction, reserving necessary UTXOs until confirmation.\n\n### `Wallet::unrecoverable_coins`\n\n1. **Reasoning**: Identifies coins that failed the recovery check (e.g., due to incorrect blinding factors) but are still unspent, allowing them to be spent normally or sent to self for repair.\n2. **Preconditions**: The wallet must be successfully loaded/created.\n3. **Postconditions**: Returns a slice of `WalletCoin` references that are unspent and fail the recovery check.\n4. **Z Notation (informal)**: $\\text{Unrecoverable}(W) \\Rightarrow \\text{Return}(\\{c \\in \\text{Coins}(W) \\mid \\neg \\text{Spent} \\land \\neg \\text{RecoveryOK}(c)\\})$\n5. **Doc comment**: Returns unspent coins whose recovery commitment was built incorrectly and cannot be claimed during a recovery epoch.\n\n### `Wallet::build_recovery_claim`\n\n1. **Reasoning**: Prepares the necessary data structure (`RecoveryClaim`) to claim unrecoverable UTXOs during a recovery epoch, using the MSS master key derived from the mnemonic.\n2. **Preconditions**: A valid `Checkpoint` and `State` must be provided. The coins must be unspent in the provided `state` and\n\n## Function: `parse_point`\n\n**Reasoning**: This function provides a convenient interface for parsing cryptographic point data from a hexadecimal string, typically used when interacting with command-line interfaces or external configuration. It handles decoding and validation against the expected format (32 bytes) and cryptographic validity.\n\n**Preconditions**:\n1. The input string `s` must be a valid hexadecimal representation of 32 bytes.\n2. The 32-byte sequence must represent a valid elliptic curve point (i.e., pass the `crypto::decompress` check).\n\n**Postconditions**:\n1. If successful, returns `Ok(Point32)` containing the validated point.\n2. If the hex decoding fails or the input length is not 32 bytes, returns an error (`anyhow!(\"expected 32 bytes\")`).\n3. If the decoded bytes do not form a valid cryptographic point, returns an error (`anyhow!(\"not a valid point\")`).\n\n**Z Notation (informal)**:\n$$\\text{parse\\_point}(s) = \\begin{cases} \\text{Ok}(P) & \\text{if } s \\in \\text{Hex}_{32} \\land \\text{ValidPoint}(P) \\\\ \\text{Error}_{\\text{Length}} & \\text{if } |s| \\neq 64 \\text{ (32 bytes)} \\\\ \\text{Error}_{\\text{Crypto}} & \\text{otherwise} \\end{cases}$$\n\n**Doc comment**:\n```rust\n/// Parses a hex string into a validated cryptographic point (`Point32`).\n///\n/// Returns an error if the input is not 32 bytes or if the bytes do not\n/// represent a valid elliptic curve point.\npub fn parse_point(s: &str) -> Result<Point32> { ... }\n```\n\n***\n\n## Structures and Test Behaviors (Contextual Documentation)\n\n*Note: The majority of the provided code is within a test module (`#[cfg(all(test, feature = \"fast-mining\"))]`). Formal documentation (Pre/Postconditions) is typically reserved for public API functions. Below, the purpose of key structures and tests is documented to provide necessary context.*\n\n### Structure: `Chain`\n**Reasoning**: Represents the complete history of the blockchain state held by a node, including the current state, timestamps, and all confirmed blocks.\n**Role**: Used internally in tests to simulate how a full node maintains its ledger.\n\n### Structure: `FakeNode`\n**Reasoning**: Simulates the RPC interface of a blockchain node. It allows external components (like the `Wallet`) to interact with the chain state without running a full network stack.\n**Role**: Enables isolated, deterministic testing of wallet synchronization logic (`Wallet::sync`).\n\n### Test: `a_reorg_keeps_a_payment_reserved_until_the_new_chain_confirms_it`\n**Reasoning**: Verifies the core financial safety property: a payment reserved due to a block confirmation remains reserved even if the chain forks, until the payment is confirmed on the final, heavier chain.\n**Behavior**: Simulates a transaction being pending, followed by a fork, and confirms that the wallet maintains the `pending` balance until the original chain is re-established.\n\n### Test: `a_reorg_past_the_recorded_blocks_rescans_from_birth`\n**Reasoning**: Tests the wallet's recovery mechanism when the node state is truncated (loses recent block history). If the required block is outside the recorded window, the wallet must perform a full rescan from genesis to ensure correct balance calculation.\n**Behavior**: Simulates losing recent blocks and verifies that `sync` triggers a rescan (`r.rescanned = true`) and correctly recalculates lost rewards.\n\n### Test: `a_payment_whose_coins_a_reorg_took_can_no_longer_confirm`\n**Reasoning**: Ensures that payments whose confirmation relied solely on a short-lived, shorter chain are correctly identified as orphaned/failed when the network switches to a longer chain, preventing double-spending attempts based on lost confirmations.\n**Behavior**: Simulates a transaction confirmed on a short fork, followed by a switch to a longer fork, verifying the payment is marked `orphaned` and not pending.\n\n### Test: `payments_waiting_in_the_mempool_show_as_incoming`\n**Reasoning**: Confirms that transactions waiting in the node's mempool are correctly reported to the receiving wallet as `incoming`, but this status transitions to `received` once the transaction is confirmed in a block.\n**Behavior**: Simulates a payment being in the mempool (reported as incoming) and then confirmed in a block (reported as received).\n\n### Test: `a_node_on_another_chain_is_refused_until_a_rescan`\n**Reasoning**: Validates that if the wallet's stored genesis information is inconsistent with the node's chain, synchronization fails, forcing a full rescan to establish trust and correct state.\n**Behavior**: Simulates a mismatched genesis hash, resulting in a refusal error, followed by a successful rescan and state correction."}]};
const allDocs = Object.values(MODULES).flat();
document.getElementById('stats').textContent = `${allDocs.length} files documented`;

function renderNav(filter) {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  for (const [mod, docs] of Object.entries(MODULES)) {
    const matches = docs.filter(d => d.path.toLowerCase().includes(filter));
    if (matches.length === 0) continue;
    const modDiv = document.createElement('div');
    modDiv.className = 'module';
    const title = document.createElement('div');
    title.className = 'module-title';
    title.textContent = mod;
    modDiv.appendChild(title);
    for (const d of matches) {
      const a = document.createElement('a');
      a.className = 'file-link';
      a.textContent = d.path;
      a.dataset.path = d.path;
      a.onclick = () => showDoc(d, a);
      modDiv.appendChild(a);
    }
    nav.appendChild(modDiv);
  }
}

function showDoc(d, el) {
  for (const a of document.querySelectorAll('.file-link')) a.classList.remove('active');
  if (el) el.classList.add('active');
  const main = document.getElementById('main');

  // Protect LaTeX blocks from Markdown parsing, then restore them.
  const mathBlocks = [];
  const protectedDoc = d.doc.replace(/\$([^$]+)\$/g, (match) => {
    const id = '%%MATH' + mathBlocks.length + '%%';
    mathBlocks.push(match);
    return id;
  });
  let html = marked.parse(protectedDoc);
  html = html.replace(/%%MATH(\d+)%%/g, (_, i) => mathBlocks[parseInt(i)]);

  main.innerHTML = `
    <div class="doc-header">
      <h2>${d.path.split('/').pop()}</h2>
      <div class="breadcrumb">${d.path}</div>
    </div>
    <div class="doc-content">${html}</div>
  `;
  renderMath(main);
  main.scrollTop = 0;
}

function renderMath(container) {
  if (window.renderMathInElement) {
    renderMathInElement(container, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false
    });
  } else {
    setTimeout(() => renderMath(container), 300);
  }
}

document.getElementById('search').addEventListener('input', (e) => {
  renderNav(e.target.value.toLowerCase());
});

document.getElementById('themeToggle').addEventListener('click', () => {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('mw-docs-theme', next);
});

if (localStorage.getItem('mw-docs-theme')) {

}
