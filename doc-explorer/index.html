{Inputs} \\parallel \\text{Outputs} \\parallel \\text{Salt})$\n**Doc comment**: `/// Computes the 32-byte fold item hash for a given Midstate transaction element.` (Applies to `tx_fold_item`)\n\n*(Note: Due to the high volume of small, internal helper functions, detailed documentation is provided for the primary public interfaces and the core logic functions.)*"}, {"path": "core/bond.rs", "module": "core", "doc": "## Core Bond Logic & Rules\n\n### `BondRules`\n**Reasoning**: Encapsulates all network-specific parameters (minimum bond, lock duration, early phase timings) required to determine if a bond is eligible to authorize a block at any given time.\n**Preconditions**: None. Must be initialized using `BOND_RULES`.\n**Postconditions**: Provides deterministic methods (`in_early_phase`, `min_bond_at`, `min_lock_at`) to query the required minimums based on a block timestamp.\n**Z Notation (informal)**: $\\forall t: \\text{BlockTimestamp} \\bullet (\\text{BondRules}. \\text{min\\_bond\\_at}(t) = \\begin{cases} \\text{EarlyMinBond} & \\text{if } t < \\text{EarlyUntil} \\\\ \\text{MinBond} & \\text{otherwise} \\end{cases})$\n**Doc comment**: Defines the complete set of rules governing bond eligibility across the network's early and main phases.\n\n### `BondRules::in_early_phase`\n**Reasoning**: Determines if a given block timestamp falls within the initial, less restrictive testing phase of the network.\n**Preconditions**: `self` must be a valid `BondRules` instance.\n**Postconditions**: Returns `true` if `block_timestamp < early_until`, otherwise `false`.\n**Z Notation (informal)**: $\\text{in\\_early\\_phase}(t) \\iff t < \\text{early\\_until}$\n**Doc comment**: Checks if the block timestamp is before the network's early phase cutoff.\n\n### `BondRules::min_bond_at`\n**Reasoning**: Retrieves the minimum required bond value for a block at a specific time, accounting for the early phase reduction.\n**Preconditions**: `self` must be a valid `BondRules` instance.\n**Postconditions**: Returns `early_min_bond` if in the early phase, or `min_bond` otherwise.\n**Z Notation (informal)**: $\\text{min\\_bond\\_at}(t) = \\begin{cases} \\text{EarlyMinBond} & \\text{if } t < \\text{EarlyUntil} \\\\ \\text{MinBond} & \\text{otherwise} \\end{cases}$\n**Doc comment**: Returns the minimum bond required for block authorization at the given timestamp.\n\n### `BondRules::min_lock_at`\n**Reasoning**: Retrieves the minimum remaining lock duration (in midstate blocks) required for a block at a specific time, accounting for the early phase reduction.\n**Preconditions**: `self` must be a valid `BondRules` instance.\n**Postconditions**: Returns `early_min_lock` if in the early phase, or `min_lock` otherwise.\n**Z Notation (informal)**: $\\text{min\\_lock\\_at}(t) = \\begin{cases} \\text{EarlyMinLock} & \\text{if } t < \\text{EarlyUntil} \\\\ \\text{MinLock} & \\text{otherwise} \\end{cases}$\n**Doc comment**: Returns the minimum remaining bond lock duration required for block authorization at the given timestamp.\n\n### `BondRules::eligible`\n**Reasoning**: The core eligibility check. Determines if a specific bond (defined by value and lock height) meets the minimum requirements for a block at a given time.\n**Preconditions**: `value` $\\ge 0$, `bonded_until` $\\ge 0$, `block_timestamp` $\\ge 0$.\n**Postconditions**: Returns `true` if $value \\ge \\text{min\\_bond\\_at}(t)$ AND $bonded\\_until \\ge \\text{est\\_midstate\\_height}(t) + \\text{min\\_lock\\_at}(t)$. Otherwise, returns `false`.\n**Z Notation (informal)**: $\\text{eligible}(v, u, t) \\iff v \\ge \\text{min\\_bond\\_at}(t) \\land u \\ge \\text{est\\_midstate\\_height}(t) + \\text{min\\_lock\\_at}(t)$\n**Doc comment**: Checks if a bond of `value` locked until `bonded_until` may authorize a block stamped `block_timestamp`.\n\n### `BondRules::early_phase_asks_less`\n**Reasoning**: Enforces a critical invariant: the early phase must never require *more* than the full mainnet rules. This ensures that eligibility only ever decreases over time, allowing for clean pruning of expired bonds.\n**Preconditions**: None.\n**Postconditions**: Returns `true` if $\\text{EarlyMinBond} \\le \\text{MinBond}$ AND $\\text{EarlyMinLock} \\le \\text{MinLock}$.\n**Z Notation (informal)**: $\\text{early\\_phase\\_asks\\_less} \\iff \\text{EarlyMinBond} \\le \\text{MinBond} \\land \\text{EarlyMinLock} \\le \\text{MinLock}$\n**Doc comment**: Verifies that the early phase rules are less restrictive than the full mainnet rules.\n\n## Bond Script and Coin\n\n### `BondScript`\n**Reasoning**: Defines the canonical structure of the mining bond script, committing to the mining key, lock height, and owner. The strict parsing ensures only valid, non-minimal encodings are rejected.\n**Preconditions**: Input `bytecode` must be a correctly formed, canonical mining bond script.\n**Postconditions**: Returns a `BondScript` instance if parsing succeeds; otherwise, returns an error.\n**Z Notation (informal)**: $\\text{parse}(\\text{bytecode}) \\to \\text{BondScript} \\land (\\text{to\\_bytecode}(\\text{script}) = \\text{bytecode})$\n**Doc comment**: Represents the canonical script used to lock a mining bond in midstate.\n\n### `BondScript::to_bytecode`\n**Reasoning**: Serializes the `BondScript` into the exact, canonical midstate bytecode format required for address calculation.\n**Preconditions**: `self` must be a valid `BondScript`.\n**Postconditions**: Returns the canonical byte vector representation of the script.\n**Z Notation (informal)**: $\\text{to\\_bytecode}(\\text{script}) = \\text{CanonicalBytecode}$\n**Doc comment**: Converts the bond script structure into its canonical midstate bytecode representation.\n\n### `BondScript::parse`\n**Reasoning**: Deserializes raw bytecode, strictly enforcing the canonical format (e.g., minimal integer encoding, exact opcode sequence) to guarantee a unique address for every bond.\n**Preconditions**: Input `bytecode` must be a correctly formed, canonical mining bond script.\n**Postconditions**: Returns `Self` if parsing succeeds; otherwise, returns an error indicating non-canonical format.\n**Z Notation (informal)**: $\\text{parse}(\\text{bytecode}) \\to \\text{BondScript} \\land (\\text{to\\_bytecode}(\\text{script}) = \\text{bytecode})$\n**Doc comment**: Parses raw midstate bytecode into a `BondScript`, strictly enforcing canonical encoding.\n\n### `BondScript::address`\n**Reasoning**: Calculates the unique midstate address (coin ID precursor) by hashing the canonical script bytecode. This address is the identifier for the locked coin.\n**Preconditions**: `self` must be a valid `BondScript`.\n**Postconditions**: Returns a 32-byte hash representing the bond's midstate address.\n**Z Notation (informal)**: $\\text{address}(\\text{script}) = \\text{Hash}(\\text{to\\_bytecode}(\\text{script}))$\n**Doc comment**: Computes the unique midstate address (hash of the canonical script) for the bond.\n\n### `BondCoin`\n**Reasoning**: Represents the actual locked coin, combining the script, value, and salt to derive a unique, immutable coin ID.\n**Preconditions**: `script` must be a valid `BondScript`.\n**Postconditions**: Provides a deterministic 32-byte `coin_id` based on the script address, value, and salt.\n**Z Notation (informal)**: $\\text{coin\\_id}(\\text{coin}) = \\text{MidstateCoinID}(\\text{script\\_address}, \\text{value}, \\text{salt})$\n**Doc comment**: Represents a midstate coin locked by the bond script, providing a unique coin ID.\n\n## Proof and Bond State\n\n### `MidstateRoots`\n**Reasoning**: Captures the necessary state roots (UTXO set, commitments, chain MMR) from a specific midstate header required for validating the bond's existence.\n**Preconditions**: The header height must be known.\n**Postconditions**: Provides a method (`state_root`) to deterministically calculate the full `state_root` committed by that header, correctly handling V4 activation (burned-WOTS).\n**Z Notation (informal)**: $\\text{state\\_root}(\\text{roots}, h) = \\begin{cases} H(\\text{SMT}, \\text{ChainMMR}) & \\text{if } h < \\text{V4Height} \\\\ H(H(\\text{SMT}, \\text{ChainMMR}), \\text{BurnedWOTS}) & \\text{if } h \\ge \\text{V4Height} \\land \\text{BurnedWOTS} \\ne \\text{None} \\end{cases}$\n**Doc comment**: Holds the state roots (UTXO, commitments, chain MMR) of a specific midstate header required for bond proof validation.\n\n### `MidstateRoots::state_root`\n**Reasoning**: Calculates the final `state_root` committed by the midstate header at a given height, adhering to the V4 activation rules.\n**Preconditions**: The height must be consistent with the presence of `burned_wots`.\n**Postconditions**: Returns the 32-byte state root hash, or an error if the roots are inconsistent with the height.\n**Z Notation (informal)**: $\\text{state\\_root}(\\text{roots}, h) \\to \\text{Hash} \\lor \\text{Error}$\n**Doc comment**: Calculates the full midstate `state_root` for a given header height, respecting V4 activation.\n\n### `BondProof`\n**Reasoning**: Encapsulates all evidence required to prove that a specific `BondCoin` was unspent in the state committed by a particular midstate header.\n**Preconditions**: The `midstate_height` must be $\\ge \\text{MIDSTATE\\_V2\\_ACTIVATION\\_HEIGHT}$.\n**Postconditions**: If verified against the correct `header_state_root`, returns a valid `Bond` structure containing all necessary metadata (ID, key, value, lock height).\n**Z Notation (informal)**: $\\text{verify}(\\text{proof}, \\text{root}) \\to \\text{Bond} \\lor \\text{Error}$\n**Doc comment**: Evidence proving a specific bond coin was unspent in the midstate state committed by a given header.\n\n### `BondProof::verify`\n**Reasoning**: Performs the multi-step validation: checks height constraints, verifies the calculated `state_root` against the provided header root, and finally confirms the coin's presence using the UTXO SMT proof.\n**Preconditions**: The provided `header_state_root` must match the `roots.state_root(midstate_height)`. The UTXO proof must be valid.\n**Postconditions**: Returns a `Bond` object if all checks pass; otherwise, returns an error detailing the failure (e.g., height too low, root mismatch, UTXO not found).\n**Z Notation (informal)**: $\\text{verify}(\\text{proof}, \\text{root}) \\iff (\\text{HeightCheck} \\land \\text{RootMatch} \\land \\text{UTXOSMTValid})$\n**Doc comment**: Verifies the bond coin's existence in the midstate state committed by the specified header.\n\n### `Bond`\n**Reasoning**: The final, validated representation of a registered mining bond, containing all necessary metadata for authorization checks.\n**Preconditions**: Must be successfully constructed via `BondProof::verify`.\n**Postconditions**: Provides deterministic methods (`eligible_at`) to check if the bond meets current network requirements based on time.\n**Z Notation (informal)**: $\\text{Bond} \\equiv \\{ \\text{id}, \\text{mining\\_key}, \\text{value}, \\text{bonded\\_until}, \\text{proven\\_at} \\}$\n**Doc comment**: A validated, registered mining bond, containing all metadata required for block authorization.\n\n### `Bond::eligible_at`\n**Reasoning**: Determines if the bond meets the current network minimums (both value and lock duration) at a specific block timestamp.\n**Preconditions**: `self` must be a valid `Bond`.\n**Postconditions**: Returns `true` if $\\text{value} \\ge \\text{min\\_bond\\_at}(t)$ AND $\\text{bonded\\_until} \\ge \\text{est\\_midstate\\_height}(t) + \\text{min\\_lock\\_at}(t)$. Otherwise, returns `false`.\n**Z Notation (informal)**: $\\text{eligible\\_at}(\\text{bond}, t) \\iff \\text{BondRules}.\\text{eligible}(\\text{value}, \\text{bonded\\_until}, t)$\n**Doc comment**: Checks if this bond meets the current network eligibility requirements at the given block timestamp.\n\n## Retargeting and Registration\n\n### `work_doublings_since_genesis`\n**Reasoning**: Calculates the total number of midwimble work doublings that have occurred since the genesis target, providing the basis for the bond retargeting mechanism.\n**Preconditions**: `midwimble_target` must be a valid 32-byte target hash.\n**Postconditions**: Returns an integer representing the difference in log base 2 of the targets relative to `GENESIS_TARGET`.\n**Z Notation (informal)**: $\\text{doublings}(T) = \\lfloor \\log_2(\\text{Work}(T)) \\rfloor$\n**Doc comment**: Calculates the total number of midwimble work doublings since genesis.\n\n### `registration_min_bond`\n**Reasoning**: Implements the bond retargeting logic. Determines the minimum bond required for a *new* registration, which increases based on midwimble's difficulty, up to `MAX_MINING_BOND`. Crucially, this only gates *new* registrations, not existing ones.\n**Preconditions**: `midwimble_target` must be valid; `block_timestamp` must be $\\ge 0$.\n**Postconditions**: Returns the calculated minimum bond value, clamped between `min_mining_bond` and `MAX_MINING_BOND`.\n**Z Notation (informal)**: $\\text{reg\\_min}(T, t) = \\begin{cases} \\text{MinBond} & \\text{if } t < \\text{BOND\\_RETARGET\\_FROM} \\\\ \\text{MinBond} \\cdot 2^{\\lfloor \\frac{\\text{doublings}(T)}{\\text{WorkDoublingsPerBondDoubling}} \\rfloor} & \\text{otherwise, clamped} \\end{cases}$\n**Doc comment**: Calculates the minimum bond required for a *new* registration based on midwimble's work doublings since genesis, subject to retargeting limits.\n\n## Registration Verification\n\n### `BondRegistration`\n**Reasoning**: Wraps a `BondProof` and provides methods to verify its validity against the chain state maintained by the midstate relay.\n**Preconditions**: The proof's header must exist on the provided `Relay`.\n**Postconditions**: If verified, returns a `BondEntry` containing the bond metadata and the proven header hash; otherwise, returns an error (e.g., missing header, failed proof, insufficient work).\n**Z Notation (informal)**: $\\text{verify}(\\text{reg}, \\text{relay}, T) \\to \\text{BondEntry} \\lor \\text{Error}$\n**Doc comment**: Represents a bond registration proof, allowing verification against the midstate relay's chain state.\n\n### `BondRegistration::verify`\n**Reasoning**: Checks three conditions: 1) The proof's header is on the relay's chain. 2) The proof itself is valid (rebuilds the correct state root). 3) The headers relayed *above* the bond's header provide sufficient work (a full day's worth) at the block's target.\n**Preconditions**: `relay` must contain the header at `proof.midstate_height`.\n**Postconditions**: Returns a `BondEntry` if all checks pass, including the work requirement; otherwise, returns an error.\n**Z Notation (informal)**: $\\text{verify}(\\text{reg}, \\text{relay}, T) \\iff (\\text{HeaderExists} \\land \\text{ProofValid} \\land \\text{CreditedWork} \\ge \\text{RequiredWork}(T))$\n**Doc comment**: Verifies a bond registration against the midstate relay, ensuring the proof is valid and the required work burial has occurred.\n\n## Bond Set Management\n\n### `BondEntry`\n**Reasoning**: The canonical record of a registered bond held by the chain state, linking the bond ID to its metadata and the specific header it was proven against.\n**Preconditions**: Must be derived from a successful `BondRegistration::verify`.\n**Postconditions**: Provides an eligibility check (`eligible_at`) using the global `BondRules`.\n**Z Notation (informal)**: $\\text{BondEntry} \\equiv \\{ \\text{mining\\_key}, \\text{value}, \\text{bonded\\_until}, \\text{proven\\_height}, \\text{proven\\_hash} \\}$\n**Doc comment**: The state record of a registered bond, including the proof header it was validated against.\n\n### `bond_leaf`\n**Reasoning**: Generates the deterministic leaf hash used\n\n## Core Bond Logic Documentation\n\n### `bond_proof_from_json`\n\n1. **Reasoning**: Parses a JSON response from the midstate service (`GET /utxo_proof/:coin_id`) into a structured `BondProof`, validating the presence of required fields and checking for errors in the response.\n2. **Preconditions**: The input `v` must be a valid `serde_json::Value` representing a successful midstate proof response, and `coin` must be a valid `BondCoin`.\n3. **Postconditions**: Returns `Ok(BondProof)` containing all extracted data (roots, height, SMT proof) if parsing is successful; otherwise, returns an error indicating the refusal or missing data.\n4. **Z Notation (informal)**: $\\text{BondProof} \\leftarrow \\text{Parse}(\\text{v}) \\land \\neg \\text{Error}(\\text{v})$\n5. **Doc comment**: Parses a bond proof from the midstate JSON response, validating structure and checking for service errors.\n\n### `cap_among`\n\n1. **Reasoning**: Calculates the maximum number of full-weight blocks one bond can sign within a `CAP_WINDOW`, ensuring the share is distributed equally among the eligible bonds, never falling below $1/CAP\\_K$.\n2. **Preconditions**: `sharing` must be $\\ge 1$.\n3. **Postconditions**: Returns the calculated maximum number of full-weight blocks (a `usize`).\n4. **Z Notation (informal)**: $\\text{Cap} \\leftarrow \\lceil \\frac{\\text{CAP\\_WINDOW}}{\\min(\\text{sharing}, \\text{CAP\\_K})} \\rceil$\n5. **Doc comment**: Calculates the maximum full-weight blocks a single bond can sign within `CAP_WINDOW` when shared among `sharing` eligible bonds.\n\n### `signer_cap`\n\n1. **Reasoning**: Determines the cap (maximum full-weight blocks per bond) below the hard fork activation height (`OVER_CAP_INVALID_FROM`). In this phase, the cap is an equal share among *all* eligible registered bonds, regardless of whether they actually signed a block in the window.\n2. **Preconditions**: `bonds` must be a valid `BondSet`, and `block_timestamp` must be provided.\n3. **Postconditions**: Returns the calculated cap (a `usize`).\n4. **Z Notation (informal)**: $\\text{Cap} \\leftarrow \\text{cap\\_among}(\\text{Count}(\\text{Eligible}(\\text{bonds}, \\text{timestamp})))$\n5. **Doc comment**: Calculates the bond cap below `OVER_CAP_INVALID_FROM`, based on an equal share among all eligible registered bonds.\n\n### `bonds_in_use`\n\n1. **Reasoning**: Identifies the set of bonds that are actively contributing to the cap *from* the hard fork height (`OVER_CAP_INVALID_FROM`). A bond is \"in use\" if it is eligible and has signed at least one *other* block within the current `CAP_WINDOW`.\n2. **Preconditions**: `window` must be a valid `SignerWindow`, `signer` must be an optional ID, `bonds` must be a valid `BondSet`, and `block_timestamp` must be provided.\n3. **Postconditions**: Returns the count of bonds in use (a `usize`).\n4. **Z Notation (informal)**: $\\text{Count} \\leftarrow |\\text{Eligible}(\\text{bonds}, \\text{timestamp}) \\cap \\text{SignedAtLeastOneOther}(\\text{window}, \\text{signer})|$\n5. **Doc comment**: Counts the bonds that are actively in use (signed at least one *other* block) within the current `CAP_WINDOW`.\n\n### `signer_cap_in`\n\n1. **Reasoning**: Determines the cap for a specific block, applying the correct rule based on height: `signer_cap` (share among all eligible bonds) below `OVER_CAP_INVALID_FROM`, and `cap_among(bonds_in_use)` (share among actively used bonds) from that height onward.\n2. **Preconditions**: All arguments (`window`, `signer`, `bonds`, `height`, `block_timestamp`) must be valid.\n3. **Postconditions**: Returns the calculated cap (a `usize`).\n4. **Z Notation (informal)**: $\\text{Cap} \\leftarrow \\begin{cases} \\text{signer\\_cap}(\\text{bonds}, \\text{timestamp}) & \\text{if } \\text{height} < \\text{OVER\\_CAP\\_INVALID\\_FROM} \\\\ \\text{cap\\_among}(\\text{bonds\\_in\\_use}(\\text{window}, \\text{signer}, \\text{bonds}, \\text{timestamp})) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Calculates the block cap (`signer_cap_in`) for a given block, switching from a share among all eligible bonds to a share among only those actively in use at `OVER_CAP_INVALID_FROM`.\n\n### `next_bonds_in_use`\n\n1. **Reasoning**: Predicts which bonds will be \"in use\" for the *next* block, based on the signers of the preceding $CAP\\_WINDOW - 1$ blocks. This is crucial for determining the cap before the block is mined.\n2. **Preconditions**: `signers` must contain at least $CAP\\_WINDOW - 1$ entries (or fewer if the chain is short), `bonds` must be valid, and `block_timestamp` must be provided.\n3. **Postconditions**: Returns the count of bonds that will be in use for the next block (a `usize`).\n4. **Z Notation (informal)**: $\\text{Count} \\leftarrow |\\text{Eligible}(\\text{bonds}, \\text{timestamp}) \\cap \\text{SignersInLast}(\\text{signers}, \\text{CAP\\_WINDOW}-1)|$\n5. **Doc comment**: Determines the set of bonds that will be in use for the next block, based on the signers of the preceding $CAP\\_WINDOW - 1$ blocks.\n\n### `next_signer_cap`\n\n1. **Reasoning**: Predicts the cap for the *next* block. It uses `next_bonds_in_use` to determine the active set if the hard fork is active, otherwise it defaults to `signer_cap`.\n2. **Preconditions**: All arguments (`signers`, `bonds`, `height`, `block_timestamp`) must be valid.\n3. **Postconditions**: Returns the predicted cap for the next block (a `usize`).\n4. **Z Notation (informal)**: $\\text{Cap} \\leftarrow \\begin{cases} \\text{signer\\_cap}(\\text{bonds}, \\text{timestamp}) & \\text{if } \\text{height} < \\text{OVER\\_CAP\\_INVALID\\_FROM} \\\\ \\text{cap\\_among}(\\text{next\\_bonds\\_in\\_use}(\\text{signers}, \\text{bonds}, \\text{timestamp})) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Predicts the cap for the next block, using `next_bonds_in_use` if the hard fork is active, or `signer_cap` otherwise.\n\n### `capped_subsidy`\n\n1. **Reasoning**: Implements the pay-side of the cap rule. If a bond has signed $n$ blocks and $n \\le cap$, it receives the full reward. If $n > cap$, the reward is tapered proportionally: $\\lfloor \\text{reward} \\times \\frac{\\text{cap}}{n} \\rfloor$.\n2. **Preconditions**: `n` must be $\\ge 1$. `cap` must be $\\ge 1$.\n3. **Postconditions**: Returns the calculated subsidy (a `u64`).\n4. **Z Notation (informal)**: $\\text{Subsidy} \\leftarrow \\begin{cases} \\text{reward} & \\text{if } n \\le \\text{cap} \\\\ \\lfloor \\frac{\\text{reward} \\times \\text{cap}}{n} \\rfloor & \\text{if } n > \\text{cap} \\end{cases}$\n5. **Doc comment**: Calculates the coinbase subsidy, applying a proportional taper when the bond has signed more blocks ($n$) than its cap.\n\n### `SignerWindow` (Struct)\n\n1. **Reasoning**: A lightweight, immutable structure used to represent the necessary state of the last $CAP\\_WINDOW$ blocks for calculating caps and quotas, containing signers, timestamps, and signature counts per bond ID.\n2. **Preconditions**: All internal vectors/maps must be consistent with the $CAP\\_WINDOW$ limit.\n3. **Postconditions**: Provides read-only access to the window state.\n4. **Z Notation (informal)**: $\\text{Window} \\leftarrow (\\text{Signers}: \\text{Vector}(\\text{Option}[\\text{ID}]), \\text{Times}: \\text{Vector}(\\text{u64}), \\text{Counts}: \\text{Map}[\\text{ID}, \\text{u32}])$\n5. **Doc comment**: Represents the signer window containing the signers, timestamps, and counts for the last `CAP_WINDOW` blocks.\n\n### `signed_in_window`\n\n1. **Reasoning**: Counts how many times a specific bond ID has signed within its window. Crucially, from `OVER_CAP_INVALID_FROM`, signatures age out based on block timestamp (`CAP_WINDOW_SECS`), not just block count.\n2. **Preconditions**: `window` must be valid, `id` must be a valid bond ID, and `block_timestamp` must be provided.\n3. **Postconditions**: Returns the count $n$ (a `usize`).\n4. **Z Notation (informal)**: $\\text{N} \\leftarrow \\begin{cases} \\text{Count}(\\text{id} \\in \\text{window}) & \\text{if } \\text{height} < \\text{OVER\\_CAP\\_INVALID\\_FROM} \\\\ \\text{Count}(\\text{id} \\in \\text{window} \\land \\text{time} > \\text{aged\\_at}(\\text{timestamp})) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Counts how many blocks in the window a specific bond ID has signed, applying time aging after `OVER_CAP_INVALID_FROM`.\n\n### `quota_used`\n\n1. **Reasoning**: Calculates the total number of signatures each bond has contributed to the window *before* the current block is added. This is used to determine if a bond is under its cap.\n2. **Preconditions**: `signers` and `times` must contain at least $CAP\\_WINDOW - 1$ entries, `height` and `block_timestamp` must be provided.\n3. **Postconditions**: Returns a map detailing the signature count for every bond ID (a `im::HashMap<[u8; 32], u32>`).\n4. **Z Notation (informal)**: $\\text{Used} \\leftarrow \\text{Filter}(\\text{SignersInLast}(\\text{signers}, \\text{CAP\\_WINDOW}-1) \\land \\neg \\text{Aged}(\\text{timestamp})) \\rightarrow \\text{Count}$\n5. **Doc comment**: Returns a map of signature counts for each bond ID in the window, excluding signatures that have aged out after `OVER_CAP_INVALID_FROM`.\n\n### `subsidy_for`\n\n1. **Reasoning**: Provides the definitive subsidy amount for a block. It checks if the block is signed and if it is stamped after `EARLY_BONDS_UNTIL`. If so, it calculates the tapered subsidy using `capped_subsidy`; otherwise, it returns the full scheduled reward.\n2. **Preconditions**: `window` must be the signer window *with this block already counted*, `bonds` must be valid, and `block_timestamp` must be provided.\n3. **Postconditions**: Returns the correct subsidy amount (a `u64`).\n4. **Z Notation (informal)**: $\\text{Subsidy} \\leftarrow \\begin{cases} \\text{Reward}(\\text{height}) & \\text{if } \\neg \\text{Signed} \\lor \\text{timestamp} < \\text{EARLY\\_BONDS\\_UNTIL} \\\\ \\text{capped\\_subsidy}(\\text{Reward}(\\text{height}), n, \\text{cap}) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Determines the correct coinbase subsidy for a block, applying the taper rule only if the block is signed and stamped after `EARLY_BONDS_UNTIL`.\n\n### `over_cap_invalid_at`\n\n1. **Reasoning**: Simple check to determine if the hard fork rule (where over-cap blocks are outright invalid) is active at a given height.\n2. **Preconditions**: `height` must be provided.\n3. **Postconditions**: Returns `true` if `height >= OVER_CAP_INVALID_FROM`, otherwise `false`.\n4. **Z Notation (informal)**: $\\text{Invalid} \\leftarrow \\text{height} \\ge \\text{OVER\\_CAP\\_INVALID\\_FROM}$\n5. **Doc comment**: Checks if the hard fork rule is active, meaning over-cap blocks are outright invalid rather than merely tapered.\n\n### `check_signer_cap`\n\n1. **Reasoning**: The core consensus check for a signed block. If the hard fork is active, it verifies that the bond's signature count ($n$) does not exceed its calculated cap ($\\text{signer\\_cap\\_in}$).\n2. **Preconditions**: All arguments (`signer`, `window`, `bonds`, `height`, `block_timestamp`) must be valid.\n3. **Postconditions**: Returns `Ok(())` if $n \\le \\text{cap}$, or an error (`bail!`) if $n > \\text{cap}$.\n4. **Z Notation (informal)**: $\\text{Check} \\leftarrow \\begin{cases} \\text{Ok}() & \\text{if } \\text{height} < \\text{OVER\\_CAP\\_INVALID\\_FROM} \\\\ \\text{Ok}() & \\text{if } n \\le \\text{cap} \\\\ \\text{Error} & \\text{if } n > \\text{cap} \\end{cases}$\n5. **Doc comment**: Validates a signed block against the bond's cap (`signer_cap_in`). Returns an error if the bond has signed more blocks than its allowed cap after `OVER_CAP_INVALID_FROM`.\n\n### `any_can_sign`\n\n1. **Reasoning**: Determines if there is at least one registered bond that meets the minimum requirements (value and lock) to sign a block at a specific timestamp. This enforces the requirement that bonded mining only occurs when possible.\n2. **Preconditions**: `bonds` must be valid, and `block_timestamp` must be provided.\n3. **Postconditions**: Returns `true` if $\\exists \\text{bond} \\in \\text{bonds}$ such that $\\text{eligible}(\\text{bond}, \\text{timestamp})$, otherwise `false`.\n4. **Z Notation (informal)**: $\\text{CanSign} \\leftarrow \\exists \\text{bond} \\in \\text{bonds} : \\text{eligible}(\\text{bond}, \\text{timestamp})$\n5. **Doc comment**: Checks if any registered bond is eligible to sign a block at the given timestamp, enforcing the bonded mining rule.\n\n### `sliver`\n\n1. **Reasoning**: Calculates the minimum work credit for an over-cap or unsigned block (when bonded mining is active). This ensures that even invalid blocks contribute a non-zero amount to chain weight, preventing chain stalls.\n2. **Preconditions**: `work` must be $\\ge 0$.\n3. **Postconditions**: Returns $\\max(1, \\lfloor \\text{work} / \\text{OVER\\_CAP\\_WORK\\_DIVISOR} \\rfloor)$ (a `u128`).\n4. **Z Notation (informal)**: $\\text{Sliver} \\leftarrow \\max(1, \\lfloor \\text{work} / \\text{OVER\\_CAP\\_WORK\\_\n\n## Function Documentation\n\n### `script()`\n**Reasoning**: Provides a canonical, default instance of `BondScript` used for testing and establishing baseline parameters for mining bonds.\n**Preconditions**: None.\n**Postconditions**: Returns a valid `BondScript` instance with predefined, non-zero placeholder values.\n**Z Notation (informal)**: $\\exists s: \\text{BondScript} \\land s = \\text{default\\_bond\\_script}$\n**Doc comment**: Creates a default, canonical `BondScript` used for testing bond parameters.\n\n### `coin()`\n**Reasoning**: Generates a standard `BondCoin` instance representing the minimum required mining bond value, ensuring consistent test setup.\n**Preconditions**: None.\n**Postconditions**: Returns a valid `BondCoin` instance initialized with `MIN_MINING_BOND`.\n**Z Notation (informal)**: $\\exists c: \\text{BondCoin} \\land c.\\text{value} = \\text{MIN\\_MINING\\_BOND}$\n**Doc comment**: Creates the standard minimum mining bond coin used for proof generation and testing.\n\n### `proven(coin: &BondCoin, height: u64) -> (BondProof, [u8; 32])`\n**Reasoning**: This function constructs a complete `BondProof` by calculating the necessary Merkle State Tree (SMT) path against a simulated UTXO set, and simultaneously derives the required midstate header root for verification at the specified height.\n**Preconditions**: The input `coin` must be valid. The `height` must be within the supported range of midstate history.\n**Postconditions**: Returns a tuple containing a fully constructed `BondProof` and the corresponding 32-byte state root hash for that height.\n**Z Notation (informal)**: $\\forall c, h: (\\text{BondCoin} \\times \\mathbb{N}) \\to (\\text{BondProof} \\times \\text{Hash}_{32})$\n**Doc comment**: Builds a midstate-shaped UTXO set holding the bond, returning the `BondProof` and the required state root hash for verification at the given height.\n\n### `registration(value: u64, bonded_until: u64) -> BondRegistration`\n**Reasoning**: A utility function to quickly construct a minimal `BondRegistration` object for testing purposes, allowing control over the bond value and expiry without needing full midstate simulation.\n**Preconditions**: `value` must be a valid bond amount; `bonded_until` must be a valid height.\n**Postconditions**: Returns a `BondRegistration` instance with placeholder roots and a minimal SMT proof for a single UTXO.\n**Z Notation (informal)**: $\\forall v, h: (\\mathbb{N} \\times \\mathbb{N}) \\to \\text{BondRegistration}$\n**Doc comment**: Constructs a minimal `BondRegistration` object for testing, allowing specification of the bond value and expiry height.\n\n***\n\n*(Note: The functions `verifies_a_real_midstate_header`, `golden_vector`, `parser_accepts_only_the_template`, `proof_verifies_against_the_header_root`, `tampering_is_caught`, `bond_parameters_stay_usable`, and `eligibility_is_a_gate` are all test functions. Their logic is documented by the core functions above, but they serve to formally verify the invariants of the system.)*"}, {"path": "core/bonded_tests.rs", "module": "core", "doc": "## Function Documentation\n\n### `chain_start()`\n1. **Reasoning**: Determines the effective starting timestamp for block stamping in test environments. This ensures that test chains maintain a target near the genesis target, simulating real work, even if the build's genesis time is far in the past or future.\n2. **Preconditions**: `GENESIS_TIMESTAMP` and `current_timestamp()` must be defined and accessible.\n3. **Postconditions**: Returns a `u64` timestamp that is the minimum of the genesis timestamp and the current time minus 3600 seconds (1 hour), preventing blocks from being stamped in the future.\n4. **Z Notation (informal)**: $\\text{chain\\_start}() = \\min(\\text{GENESIS\\_TIMESTAMP}, \\text{current\\_timestamp}() - 3600)$\n5. **Doc comment**: Calculates the effective starting timestamp for block stamping, ensuring test chains carry real work and avoid future timestamps.\n\n### `Chain::new()`\n1. **Reasoning**: Initializes a `Chain` state from genesis, ensuring that the chain has progressed past the minimum height required for bonded mining (`BONDED_MINING_FROM`).\n2. **Preconditions**: `State::genesis()` must successfully initialize the state. `BONDED_MINING_FROM` must be defined.\n3. **Postconditions**: Returns a `Chain` instance where `state.height >= BONDED_MINING_FROM`, and `ts` contains the initial `chain_start()` timestamp.\n4. **Z Notation (informal)**: $\\text{Chain} = \\text{Chain}(\\text{State}_{\\text{genesis}}, [\\text{chain\\_start}()]) \\land \\text{State}.\\text{height} \\ge \\text{BONDED\\_MINING\\_FROM}$\n5. **Doc comment**: Creates a new `Chain` instance initialized from genesis, asserting that bonded mining has begun.\n\n### `Chain::next_stamp()`\n1. **Reasoning**: Calculates the timestamp for the next block based on the last recorded timestamp in the chain's history (`ts`), adhering to the 60-second interval rule.\n2. **Preconditions**: The `Chain` must have at least one timestamp in its `ts` vector.\n3. **Postconditions**: Returns a `u64` representing the next valid block timestamp (last timestamp + 60).\n4. **Z Notation (informal)**: $\\text{next\\_stamp}() = \\text{ts}.\\text{last}() + 60$\n5. **Doc comment**: Calculates the next valid block timestamp by incrementing the last recorded timestamp by 60 seconds.\n\n### `Chain::template()`\n1. **Reasoning**: Generates a `BlockTemplate` for the next block, incorporating the current chain state and the next valid stamp. It optionally includes a `MinerBond` if provided.\n2. **Preconditions**: The `Chain` must be in a valid state (i.e., past genesis).\n3. **Postconditions**: Returns a `Result<BlockTemplate>` containing the template, or an error if template generation fails (e.g., due to missing required bonds).\n4. **Z Notation (informal)**: $\\text{template}(\\text{bond}) \\rightarrow \\text{Result}(\\text{BlockTemplate})$\n5. **Doc comment**: Generates a `BlockTemplate` for the next block, using the current state and next stamp, optionally including a specified miner bond.\n\n### `Chain::try_apply()`\n1. **Reasoning**: Attempts to transition the chain state using a batch, specifically skipping Proof-of-Work verification (`apply_batch_skip_pow`). This is used for testing scenarios where PoW is assumed correct (e.g., template blocks).\n2. **Preconditions**: The `batch` must be valid relative to the current chain height. The header in the batch must be updated with `self.state.height`.\n3. **Postconditions**: Returns a `Result<State>` containing the new state if application succeeds, or an error otherwise. The internal chain timestamps (`self.ts`) are *not* updated.\n4. **Z Notation (informal)**: $\\text{try\\_apply}(\\text{batch}) \\rightarrow \\text{Result}(\\text{State}_{\\text{new}})$\n5. **Doc comment**: Attempts to apply a batch to the current state, skipping Proof-of-Work verification. Returns the new state or an error.\n\n### `Chain::apply()`\n1. **Reasoning**: Applies a valid batch to the chain state, updating both the internal `State` and the list of recorded timestamps (`ts`).\n2. **Preconditions**: The `batch` must be successfully applied via `try_apply`.\n3. **Postconditions**: The internal `state` is updated to the new state, and `batch.timestamp` is appended to `self.ts`.\n4. **Z Notation (informal)**: $\\text{apply}(\\text{batch}) \\Rightarrow \\text{State} := \\text{try\\_apply}(\\text{batch}) \\land \\text{ts} := \\text{ts} \\cup \\{\\text{batch}.\\text{timestamp}\\}$\n5. **Doc comment**: Applies a batch to the chain state, updating both the internal state and the list of recorded timestamps.\n\n### `Chain::apply_trusted()`\n1. **Reasoning**: Applies a batch using trusted verification (`apply_batch_trusted`), which is used for stand-in midstate headers where real PoW is absent but other rules (like miner authorization) must hold.\n2. **Preconditions**: The `batch` must be valid under trusted rules relative to the current chain height.\n3. **Postconditions**: The internal `state` is updated, and `batch.timestamp` is appended to `self.ts`.\n4. **Z Notation (informal)**: $\\text{apply\\_trusted}(\\text{batch}) \\Rightarrow \\text{State} := \\text{apply\\_batch\\_trusted}(\\text{batch}) \\land \\text{ts} := \\text{ts} \\cup \\{\\text{batch}.\\text{timestamp}\\}$\n5. **Doc comment**: Applies a batch using trusted verification, suitable for stand-in midstate headers where real proofs of work are not present.\n\n### `Chain::creditable()`\n1. **Reasoning**: Calculates the maximum amount of chain weight that the next block can contribute before hitting any cap imposed by registered bonds.\n2. **Preconditions**: The current `self.state` must contain valid bond information and a target.\n3. **Postconditions**: Returns a `u128` representing the creditable weight for the next block.\n4. **Z Notation (informal)**: $\\text{creditable}() = \\text{cap\\_work}(\\text{State}.\\text{work\\_floor}, \\text{State}.\\text{height}, \\text{calculate\\_work}(\\text{State}.\\text{target}))$\n5. **Doc comment**: Calculates the maximum chain weight the next block can add before hitting any bond-imposed cap.\n\n### `producer()`\n1. **Reasoning**: Generates a new `MinerBond` and its corresponding public key based on a secret seed, simulating a new participant in the network.\n2. **Preconditions**: A unique `seed` (u8) is provided.\n3. **Postconditions**: Returns a tuple containing the initialized `MinerBond` structure and the compressed public key (`[u8; 32]`).\n4. **Z Notation (informal)**: $\\text{producer}(\\text{seed}) \\rightarrow (\\text{MinerBond}, \\text{Key})$\n5. **Doc comment**: Generates a new `MinerBond` and its associated public key using a deterministic seed.\n\n### `locked_long()`\n1. **Reasoning**: Provides a specific, long-term timestamp for bond locking, comfortably within the maximum horizon but well past minimum remaining lock requirements for blocks stamped from `chain_start`.\n2. **Preconditions**: `MAX_BOND_HORIZON` and `chain_start()` must be defined.\n3. **Postconditions**: Returns a `u64` timestamp suitable for long-term bond locking.\n4. **Z Notation (informal)**: $\\text{locked\\_long}() = \\text{est\\_midstate\\_height}(\\text{chain\\_start}()) + \\text{MAX\\_BOND\\_HORIZON} / 2$\n5. **Doc comment**: Calculates a long-term bond lock timestamp, ensuring it is comfortably within the maximum bond horizon.\n\n### `with_bond()`\n1. **Reasoning**: Registers a new bond directly into the chain's state, simulating a bond that was registered earlier than the current chain history allows.\n2. **Preconditions**: A mutable `Chain` instance, a `seed`, and an `until` timestamp must be provided.\n3. **Postconditions**: The `MinerBond` is created, and a corresponding `BondEntry` is inserted into `chain.state.bonds`. Returns the created `MinerBond`.\n4. **Z Notation (informal)**: $\\text{with\\_bond}(\\text{chain}, \\text{seed}, \\text{until}) \\Rightarrow \\text{chain}.\\text{state}.\\text{bonds} := \\text{chain}.\\text{state}.\\text{bonds} \\cup \\{\\text{BondEntry}\\}$\n5. **Doc comment**: Registers a new bond directly into the chain's bond set, simulating prior registration.\n\n### `unsigned_copy()`\n1. **Reasoning**: Creates a copy of a block batch but removes the miner signature and sets the claimed chain weight to an arbitrary value, modeling a block produced by a non-bonded miner.\n2. **Preconditions**: A valid `Batch` and a desired `weight` must be provided.\n3. **Postconditions**: Returns a new `Batch` where `miner` is `None` and `chain_weight` is set to the input `weight`.\n4. **Z Notation (informal)**: $\\text{unsigned\\_copy}(\\text{batch}, \\text{weight}) \\rightarrow \\text{Batch}' \\land \\text{Batch}'.\\text{miner} = \\text{None} \\land \\text{Batch}'.\\text{chain\\_weight} = \\text{weight}$\n5. **Doc comment**: Creates a copy of a batch stripped of its signature, representing a block produced by a miner without a bond.\n\n### `proven_producer()`\n1. **Reasoning**: Generates a `MinerBond` and the necessary `BondRegistration` proof, simulating a producer whose bond coin exists in a specific stand-in midstate at a given height.\n2. **Preconditions**: A `seed` and the `proven` midstate height must be provided.\n3. **Postconditions**: Returns a tuple containing the initialized `MinerBond` (with its ID updated by the registration) and the `BondRegistration`.\n4. **Z Notation (informal)**: $\\text{proven\\_producer}(\\text{seed}, \\text{proven}) \\rightarrow (\\text{MinerBond}, \\text{BondRegistration})$\n5. **Doc comment**: Generates a producer whose bond coin is proven to exist in a stand-in midstate at a specified height, along with the registration proof.\n\n### `stand_in_headers()`\n1. **Reasoning**: Constructs a set of `MidstateHeaders` that commit to several bond registrations, using non-real (stand-in) proofs of work and timestamps adjusted backward from the schedule.\n2. **Preconditions**: A count (`count`) and a slice of `BondRegistration` references must be provided.\n3. **Postconditions**: Returns a `MidstateHeaders` structure containing the sequence of headers, linking them back to the root of the relay.\n4. **Z Notation (informal)**: $\\text{stand\\_in\\_headers}(\\text{count}, \\text{registrations}) \\rightarrow \\text{MidstateHeaders}$\n5. **Doc comment**: Creates a set of stand-in midstate headers committing to multiple bond registrations, using non-real proofs of work and adjusted timestamps.\n\n### `stand_in_headers_for()`\n1. **Reasoning**: Helper function for `stand_in_headers`, generating the specific header links by calculating targets based on the adjusted stamp time and linking them to the registration roots where applicable.\n2. **Preconditions**: A count (`count`) and a slice of `BondRegistration` references must be provided.\n3. **Postconditions**: Returns a `MidstateHeaders` structure containing the generated headers.\n4. **Z Notation (informal)**: $\\text{stand\\_in\\_headers\\_for}(\\text{count}, \\text{registrations}) \\rightarrow \\text{MidstateHeaders}$\n5. **Doc comment**: Generates stand-in midstate headers for a given count, linking them to specific bond registrations based on their proven height.\n\n### `proven_bond()`\n1. **Reasoning**: Constructs a complete `BondRegistration` structure, including the necessary `BondCoin`, `UtxoAccumulator` roots, and the Merkle proof (`smt`), simulating a verified bond coin.\n2. **Preconditions**: The mining key, `bonded_until`, salt, and `proven` height must be provided.\n3. **Postconditions**: Returns a fully constructed `BondRegistration`.\n4. **Z Notation (informal)**: $\\text{proven\\_bond}(\\text{key}, \\text{until}, \\text{salt}, \\text{proven}) \\rightarrow \\text{BondRegistration}$\n5. **Doc comment**: Constructs a complete `BondRegistration`, including the bond coin, state roots, and Merkle proof, verifying its existence in a stand-in midstate.\n\n### `apply_keeping()`\n1. **Reasoning**: A utility function used in testing to apply a batch while explicitly recording the header with the *current* chain height, simulating how storage would record the block.\n2. **Preconditions**: A mutable `Chain`, a `Batch`, and a mutable vector for headers must be provided.\n3. **Postconditions**: The `Chain` state is updated via `chain.apply(batch)`, and the header (with correct height) is pushed into the `headers` vector.\n4. **Z Notation (informal)**: $\\text{apply\\_keeping}(\\text{chain}, \\text{batch}, \\text{headers}) \\Rightarrow \\text{chain} := \\text{chain}.\\text{apply}(\\text{batch}) \\land \\text{headers} := \\text{headers} \\cup \\{\\text{Header}_{\\text{current\\_height}}\\}$\n5. **Doc comment**: Applies a batch to the chain while explicitly recording the header with the current chain height for testing purposes."}, {"path": "core/chain_tests.rs", "module": "core", "doc": "## TestChain\n\n### `TestChain::new()`\n1. **Reasoning**: Initializes a new blockchain instance starting from the genesis state, ensuring the chain is in a valid, initial configuration.\n2. **Preconditions**: None.\n3. **Postconditions**: The returned `TestChain` contains a valid `State` (genesis), a list of timestamps starting with the genesis timestamp, and a list of blocks starting with the genesis batch.\n4. **Z Notation (informal)**: $\\text{TestChain} = \\langle \\text{State}_{\\text{genesis}}, [\\text{T}_{\\text{genesis}}], [\\text{Batch}_{\\text{genesis}}] \\rangle$\n5. **Doc comment**: Initializes a new `TestChain` starting from the genesis block and state.\n\n### `TestChain::make_block(&self, txs: &[Transaction], payout: &StealthAddress) -> Result<Batch>`\n1. **Reasoning**: Constructs a complete, valid block template based on the current chain state, incorporating provided transactions and a coinbase payout, before mining it.\n2. **Preconditions**: The input `txs` must be valid transactions for the current state; `self` must represent a valid chain state.\n3. **Postconditions**: Returns a fully mined and validated `Batch` that is consistent with `self.state`.\n4. **Z Notation (informal)**: $\\text{Batch}_{\\text{new}} = \\text{Mine}(\\text{Template}(\\text{State}, \\text{Tx}, \\text{Payout}))$\n5. **Doc comment**: Builds and mines a new block template containing the specified transactions and coinbase payout.\n\n### `TestChain::apply(&mut self, batch: Batch) -> Result<()>`\n1. **Reasoning**: Appends a validated block to the chain, updating the internal state and tracking metadata (timestamps, blocks).\n2. **Preconditions**: The input `batch` must be a valid block that successfully applies to `self.state`.\n3. **Postconditions**: `self.state` is updated by applying the batch; `self.timestamps` and `self.blocks` are extended with the batch's data.\n4. **Z Notation (informal)**: $\\text{State}_{\\text{new}} = \\text{ApplyBatch}(\\text{State}_{\\text{old}}, \\text{Batch})$\n5. **Doc comment**: Applies a validated block to the chain, updating the state and historical records.\n\n### `TestChain::mine(&mut self, txs: &[Transaction], payout: &StealthAddress) -> Result<()>`\n1. **Reasoning**: Orchestrates the process of creating and applying a new block in one step, simplifying test usage.\n2. **Preconditions**: The chain state must be valid; `txs` must be valid for the current state.\n3. **Postconditions**: A new block is mined and successfully applied to `self`.\n4. **Z Notation (informal)**: $\\text{Chain}_{\\text{new}} = \\text{Apply}(\\text{MakeBlock}(\\text{State}, \\text{Tx}, \\text{Payout}))$\n5. **Doc comment**: Mines a new block with the specified transactions and applies it to the chain.\n\n## TestWallet\n\n### `TestWallet::new()`\n1. **Reasoning**: Creates a new wallet instance, generating fresh cryptographic keys required for spending and receiving funds.\n2. **Preconditions**: None.\n3. **Postconditions**: Returns a `TestWallet` with randomly generated `WalletKeys` and an empty list of tracked coins.\n4. **Z Notation (informal)**: $\\text{Wallet} = \\langle \\text{Keys}_{\\text{random}}, [] \\rangle$\n5. **Doc comment**: Creates a new wallet with randomly generated keys.\n\n### `TestWallet::address(&self) -> StealthAddress`\n1. **Reasoning**: Provides the public, spendable address derived from the wallet's private keys for use in transactions.\n2. **Preconditions**: The wallet must have valid `WalletKeys`.\n3. **Postconditions**: Returns the unique `StealthAddress` associated with the wallet.\n4. **Z Notation (informal)**: $\\text{Address} = \\text{Keys}.\\text{address}()$\n5. **Doc comment**: Returns the public stealth address of the wallet.\n\n### `TestWallet::scan(&mut self, batch: &Batch, height: u64)`\n1. **Reasoning**: Updates the wallet's internal coin tracking by processing a single block, identifying spent inputs and newly received outputs.\n2. **Preconditions**: The input `batch` must be a valid block; `self` must track coins up to $H-1$.\n3. **Postconditions**: All spendable outputs in `batch` owned by the wallet are added to `self.coins`; all inputs used in `batch` that were previously tracked are removed from `self.coins`.\n4. **Z Notation (informal)**: $\\text{Coins}_{\\text{new}} = (\\text{Coins}_{\\text{old}} \\setminus \\text{Spent}(\\text{Batch})) \\cup \\text{OwnedOutputs}(\\text{Batch})$\n5. **Doc comment**: Scans a single block, updating the wallet's list of owned and unspent coins.\n\n### `TestWallet::scan_chain(&mut self, chain: &TestChain)`\n1. **Reasoning**: Rebuilds the entire coin inventory by iterating over all blocks in the chain, ensuring the wallet state is consistent with the full history.\n2. **Preconditions**: The input `chain` must be a valid, fully applied chain.\n3. **Postconditions**: `self.coins` is cleared and repopulated to reflect all unspent outputs owned by the wallet across the entire chain history.\n4. **Z Notation (informal)**: $\\text{Coins} = \\bigcup_{h=0}^{\\text{Height}} \\text{OwnedOutputs}(\\text{Block}_h) \\setminus \\bigcup_{h=0}^{\\text{Height}} \\text{SpentInputs}(\\text{Block}_h)$\n5. **Doc comment**: Scans the entire chain history to rebuild and synchronize the wallet's coin inventory.\n\n### `TestWallet::balance(&self) -> u64`\n1. **Reasoning**: Calculates the total value of all currently tracked, unspent coins held by the wallet.\n2. **Preconditions**: `self.coins` must be accurate (i.e., `scan_chain` must have been run).\n3. **Postconditions**: Returns the sum of values of all coins in `self.coins`.\n4. **Z Notation (informal)**: $\\text{Balance} = \\sum_{c \\in \\text{Coins}} c.\\text{value}$\n5. **Doc comment**: Calculates the total unspent coin balance of the wallet.\n\n### `TestWallet::spendable_at(&self, height: u64) -> Vec<Spendable>`\n1. **Reasoning**: Filters the wallet's coins to return only those that are available for spending at a specific block height, respecting maturity and coinbase rules.\n2. **Preconditions**: `self.coins` must be accurate; `height` must be non-negative.\n3. **Postconditions**: Returns a list of `Spendable` outputs that are not coinbase coins or whose maturity period has passed relative to `height`.\n4. **Z Notation (informal)**: $\\text{Spendable}(H) = \\{c \\in \\text{Coins} \\mid c.\\text{is\\_cb} = \\text{false} \\lor H \\ge c.\\text{height} + \\text{Maturity}\\}$\n5. **Doc comment**: Returns a list of unspent and mature coins available for spending at the given block height.\n\n## Helper Functions\n\n### `funded_chain(wallet: &mut TestWallet) -> TestChain`\n1. **Reasoning**: Simulates the initial funding process: mines a coinbase reward to the specified wallet, followed by enough subsequent blocks to satisfy the coinbase maturity period.\n2. **Preconditions**: `wallet` must be initialized.\n3. **Postconditions**: Returns a `TestChain` where the input `wallet` has successfully scanned and acquired the initial block reward.\n4. **Z Notation (informal)**: $\\text{Chain} = \\text{Mine}(\\text{Reward}) \\circ \\text{Mine}(\\text{MaturityBlocks})$\n5. **Doc comment**: Mines a coinbase reward to the wallet and advances the chain until the coinbase is mature.\n\n### `locked_long() -> u64`\n1. **Reasoning**: Calculates a timestamp far enough into the future to comfortably exceed the minimum bond lock horizon, used for testing long-term bond validity.\n2. **Preconditions**: The current system time must be available via `current_timestamp()`.\n3. **Postconditions**: Returns a future timestamp guaranteed to be well within `MAX_BOND_HORIZON`.\n4. **Z Notation (informal)**: $\\text{T}_{\\text{long}} = \\text{CurrentTime} + \\text{MAX\\_BOND\\_HORIZON}/2$\n5. **Doc comment**: Calculates a timestamp safely within the maximum bond horizon for long-term testing.\n\n### `bonded_miner(chain: &TestChain, seed: &[u8], bonded_until: u64) -> MinerBond`\n1. **Reasoning**: Generates a complete `MinerBond` structure, including cryptographic secrets and registration details, based on the chain state and a specified lock time.\n2. **Preconditions**: `chain` must be a valid `TestChain`.\n3. **Postconditions**: Returns a fully formed `MinerBond` ready for block creation.\n4. **Z Notation (informal)**: $\\text{Bond} = \\text{Generate}(\\text{Chain}, \\text{Seed}, \\text{Until})$\n5. **Doc comment**: Generates a `MinerBond` structure, including cryptographic secrets and registration, for a given lock duration.\n\n### `bonded_miners(chain: &TestChain, specs: &[(&[u8], u64)]) -> Vec<MinerBond>`\n1. **Reasoning**: Mass-generates multiple `MinerBond` instances based on a list of seeds and lock times, ensuring they are registered against the current chain state.\n2. **Preconditions**: `chain` must be a valid `TestChain`.\n3. **Postconditions**: Returns a vector of unique, fully registered `MinerBond` objects.\n4. **Z Notation (informal)**: $\\text{Bonds} = \\{\\text{Generate}(\\text{Chain}, \\text{Spec}_i) \\mid i \\in \\text{Specs}\\}$\n5. **Doc comment**: Generates multiple `MinerBond` instances, ensuring their registrations are valid against the current chain state.\n\n## TestChain (Bonded Methods)\n\n### `TestChain::bonded_template(&self, bond: &MinerBond, payout: &StealthAddress) -> Result<BlockTemplate>`\n1. **Reasoning**: Constructs a block template specifically for bonded mining, incorporating the miner's bond information and required payouts.\n2. **Preconditions**: `self` must be a valid chain; `bond` must be a valid, registered `MinerBond`.\n3. **Postconditions**: Returns a `BlockTemplate` ready for mining, containing the bond details.\n4. **Z Notation (informal)**: $\\text{Template}_{\\text{bonded}} = \\text{BuildTemplate}(\\text{State}, \\text{Payouts}, \\text{Bond})$\n5. **Doc comment**: Builds a bonded block template using the provided miner's bond information.\n\n### `TestChain::make_bonded_block(&self, bond: &MinerBond, payout: &StealthAddress) -> Result<Batch>`\n1. **Reasoning**: Mines a complete, valid block using the bonded template process.\n2. **Preconditions**: `self` must be a valid chain; `bond` must be eligible to sign (registered and not expired).\n3. **Postconditions**: Returns a fully mined and validated `Batch` signed by the specified `bond`.\n4. **Z Notation (informal)**: $\\text{Batch}_{\\text{bonded}} = \\text{Mine}(\\text{Template}_{\\text{bonded}})$\n5. **Doc comment**: Builds and mines a complete block using the bonded template for the specified miner.\n\n### `TestChain::bonded_block_at(&self, bond: &MinerBond, payout: &StealthAddress, timestamp: u64) -> Result<Batch>`\n1. **Reasoning**: Constructs a block template with a specific, fixed timestamp, useful for testing time-locked or future-dated blocks.\n2. **Preconditions**: `self` must be a valid chain; `bond` must be eligible to sign at the given `timestamp`.\n3. **Postconditions**: Returns a fully mined and validated `Batch` stamped with the provided `timestamp`.\n4. **Z Notation (informal)**: $\\text{Batch}_{\\text{timed}} = \\text{Mine}(\\text{Template}(\\text{State}, \\text{Payouts}, \\text{Bond}, \\text{Timestamp}))$\n5. **Doc comment**: Builds and mines a bonded block with a specific, fixed timestamp.\n\n## `impl TestChain` Methods Documentation\n\n### `next_n(&self, id: [u8; 32]) -> usize`\n\n**Reasoning**: This function provides a convenient wrapper to determine the next block count (`n`) for a specific bond ID, using the current time (`now()`) as the timestamp. It simplifies usage within test scenarios where explicit timestamp management is not required.\n**Preconditions**:\n*   `self` must be a valid `TestChain` instance.\n*   `id` must be a valid bond ID present in `self.state.bonds`.\n**Postconditions**:\n*   Returns the calculated next block count (`n`) for `id` based on the current time.\n**Z Notation (informal)**: $\\text{next\\_n}(C, id) = \\text{next\\_n\\_at}(C, \\text{now}())$\n**Doc comment**:\n```rust\n/// `n` for a block `id` would sign next: how many blocks of its window\n/// its bond would then have signed, that block included (worked out the\n/// way `apply_batch` does). Uses the current time (`now()`) as the timestamp.\nfn next_n(&self, id: [u8; 32]) -> usize { ... }\n```\n\n### `next_n_at(&self, id: [u8; 32], timestamp: u64) -> usize`\n\n**Reasoning**: This core function calculates the next block count (`n`) for a specific bond ID at a precise, specified `timestamp`. This is crucial for testing time-dependent logic (like cap aging) without relying on real-time clock progression.\n**Preconditions**:\n*   `self` must be a valid `TestChain` instance.\n*   `id` must be a valid bond ID present in `self.state.bonds`.\n*   `timestamp` must be a non-negative time value.\n**Postconditions**:\n*   Returns the calculated next block count (`n`) for `id` at the given `timestamp`.\n**Z Notation (informal)**: $\\text{next\\_n\\_at}(C, id, t) = \\text{next\\_window\\_at}(C, id, t).0$\n**Doc comment**:\n```rust\n/// [`TestChain::next_n`] for a block stamped `timestamp`: from\n/// `OVER_CAP_INVALID_FROM` the window ages by its timestamp.\nfn next_n_at(&self, id: [u8; 32], timestamp: u64) -> usize { ... }\n```\n\n### `next_window_at(&self, id: [u8; 32], timestamp: u64) -> (usize, usize)`\n\n**Reasoning**: This function calculates two critical values at a given `timestamp`: the next block count (`n`) for `id`, and the total number of blocks signed by `id` within its current window (`by_blocks`). It simulates the window state without modifying the chain state.\n**Preconditions**:\n*   `self` must be a valid `TestChain` instance.\n*   `id` must be a valid bond ID present in `self.state.bonds`.\n*   `timestamp` must be a non-negative time value.\n**Postconditions**:\n*   Returns a tuple `(n, by_blocks)`, where `n` is the next block count and `by_blocks` is the current count within the window.\n**Z Notation (informal)**: $\\text{next\\_window\\_at}(C, id, t) = (\\text{signed\\_in\\_window}(W(C, t), id, H, t), \\text{counts}[id])$\n**Doc comment**:\n```rust\n/// `n` for the next block, signed by `id` and stamped `timestamp`, and\n/// what the last `CAP_WINDOW` blocks alone would make it (the window\n/// before it aged by time). Returns (next_n, current_window_count).\nfn next_window_at(&self, id: [u8; 32], timestamp: u64) -> (usize, usize) { ... }\n```\n\n### `creditable(&self) -> u128`\n\n**Reasoning**: Determines the maximum amount of work/reward a block can claim based on the current chain state and the defined work cap (`bond::cap_work`). This ensures blocks adhere to the economic rules.\n**Preconditions**:\n*   `self` must be a valid `TestChain` instance.\n*   `self.state.target` must be set.\n**Postconditions**:\n*   Returns the maximum creditable work amount (`u128`) allowed by the cap.\n**Z Notation (informal)**: $\\text{creditable}(C) = \\text{cap\\_work}(\\text{work}(C.\\text{target}), C.\\text{height})$\n**Doc comment**:\n```rust\n/// The work the next block can add in full, as far as the work cap\n/// allows (`bond::cap_work`).\nfn creditable(&self) -> u128 { ... }\n```\n\n### `block_ignoring_the_window(&self, bond: &MinerBond, payout: &StealthAddress) -> Batch`\n\n**Reasoning**: Simulates the block creation process for a miner who ignores the current signer window state (e.g., an old client or modified miner). This allows testing how the chain rejects blocks based purely on per-bond caps, independent of window history.\n**Preconditions**:\n*   `self` must be a valid `TestChain` instance.\n*   `bond` must be a valid `MinerBond`.\n*   `payout` must be a valid `StealthAddress`.\n**Postconditions**:\n*   Returns a `Batch` representing the block signed by the bond, calculated without reference to the chain's current window state.\n**Z Notation (informal)**: $\\text{block\\_ignoring}(C, b, p) = \\text{build\\_template}(C', t, [], [p, 1], b).0.\\text{mine\\_blocking}()$ where $C'$ is $C$ with window state reset.\n**Doc comment**:\n```rust\n/// The block `bond` would sign next on a node that ignored the signer\n/// window -- a modified miner, or one still on the old rules that does\n/// not know where its quota stands. It claims the full weight and pay\n/// of a block under its cap. The window is not in the state root, so\n/// only the per-bond cap can tell this block from an honest one.\nfn block_ignoring_the_window(&self, bond: &MinerBond, payout: &StealthAddress) -> Batch { ... }\n```\n\n### `block_ignoring_the_window_at(&self, bond: &MinerBond, payout: &StealthAddress, timestamp: Option<u64>) -> Batch`\n\n**Reasoning**: An advanced version of `block_ignoring_the_window`, allowing the simulation of a block signed by an ignorant miner at a specific `timestamp`. This is vital for testing time-sensitive cap validation.\n**Preconditions**:\n*   `self` must be a valid `TestChain` instance.\n*   `bond` must be a valid `MinerBond`.\n*   `payout` must be a valid `StealthAddress`.\n*   `timestamp` (if provided) must be non-negative.\n**Postconditions**:\n*   Returns a `Batch` representing the block signed by the bond at the specified time, calculated without reference to the chain's current window state.\n**Z Notation (informal)**: $\\text{block\\_ignoring\\_at}(C, b, p, t) = \\text{build\\_template}(C', t, [], [p, 1], b).0.\\text{mine\\_blocking}()$ where $C'$ is $C$ with window state reset.\n**Doc comment**:\n```rust\n/// [`TestChain::block_ignoring_the_window`], stamped `timestamp` if given.\nfn block_ignoring_the_window_at(\n    &self,\n    bond: &MinerBond,\n    payout: &StealthAddress,\n    timestamp: Option<u64>,\n) -> Batch { ... }\n```\n\n### `next_cap_at(&self, timestamp: u64) -> usize`\n\n**Reasoning**: Calculates the maximum number of bonds allowed to be in use (the cap) at a specific `timestamp`. This is essential for determining if a bond's current count (`n`) exceeds the allowed limit.\n**Preconditions**:\n*   `self` must be a valid `TestChain` instance.\n*   `timestamp` must be a non-negative time value.\n**Postconditions**:\n*   Returns the calculated maximum number of bonds in use (`usize`) at the given `timestamp`.\n**Z Notation (informal)**: $\\text{next\\_cap\\_at}(C, t) = \\text{next\\_signer\\_cap}(C.\\text{recent\\_signers}, C.\\text{bonds}, C.\\text{height}, t)$\n**Doc comment**:\n```rust\n/// The cap the next block, stamped `timestamp`, is judged against,\n/// whoever signs it (`bond::next_signer_cap`).\nfn next_cap_at(&self, timestamp: u64) -> usize { ... }\n```\n\n### `in_use_at(&self, timestamp: u64) -> usize`\n\n**Reasoning**: Counts how many distinct bonds are currently active (i.e., have signed blocks within the current window) at a specific `timestamp`. This helps verify state transitions, especially around cap changes.\n**Preconditions**:\n*   `self` must be a valid `TestChain` instance.\n*   `timestamp` must be a non-negative time value.\n**Postconditions**:\n*   Returns the total count of bonds currently in use (`usize`) at the given `timestamp`.\n**Z Notation (informal)**: $\\text{in\\_use\\_at}(C, t) = \\text{next\\_bonds\\_in\\_use}(C.\\text{recent\\_signers}, C.\\text{bonds}, t)$\n**Doc comment**:\n```rust\n/// How many bonds are in use for the next block, stamped `timestamp`\n/// (`bond::next_bonds_in_use`).\nfn in_use_at(&self, timestamp: u64) -> usize { ... }\n```\n\n### `may_sign_at(&self, id: [u8; 32], timestamp: u64) -> bool`\n\n**Reasoning**: Determines if a specific bond (`id`) is eligible to sign the next block at a given `timestamp`. Eligibility requires that the bond's current count (`n`) does not exceed the calculated cap for that time.\n**Preconditions**:\n*   `self` must be a valid `TestChain` instance.\n*   `id` must be a valid bond ID present in `self.state.bonds`.\n*   `timestamp` must be a non-negative time value.\n**Postconditions**:\n*   Returns `true` if the bond's count is less than or equal to the cap at `timestamp`, otherwise `false`.\n**Z Notation (informal)**: $\\text{may\\_sign\\_at}(C, id, t) = \\text{next\\_n\\_at}(C, id, t) \\le \\text{next\\_cap\\_at}(C, t)$\n**Doc comment**:\n```rust\n/// Whether `id` may sign the next block, stamped `timestamp`.\nfn may_sign_at(&self, id: [u8; 32], timestamp: u64) -> bool { ... }\n```"}, {"path": "core/cuda_walk.rs", "module": "core", "doc": "## Core CUDA Walk Miner Documentation\n\n### `context_words()`\n1. **Reasoning**: Provides the fixed 24-word context keys required by the CUDA kernels (`ms_keys`), ensuring cryptographic consistency with the reference implementation (`walk.rs`).\n2. **Preconditions**: None. The underlying `blake3` hashing must be available.\n3. **Postconditions**: Returns a fixed array of 24 `u32` representing the derived context keys.\n4. **Z Notation (informal)**: $\\text{context\\_words}() \\rightarrow [u32; 24] \\land \\forall i, \\text{word}_i = \\text{hash\\_derive\\_key}(\\text{CONTEXTS}[i])$\n5. **Doc comment**:\n```rust\n/// Generates the 24 fixed context words (`ms_keys`) required by the CUDA kernels, derived from known walk contexts (init, remix, final).\npub fn context_words() -> [u32; 24] { /* ... */ }\n```\n\n### `te_words()`\n1. **Reasoning**: Generates the fixed AES transformation table (`ms_te`) used by the CUDA kernels, ensuring cryptographic consistency with the reference implementation (`walk::SBOX`).\n2. **Preconditions**: None. The `walk::SBOX` must be defined and accessible.\n3. **Postconditions**: Returns a fixed array of 256 `u32` representing the AES transformation table.\n4. **Z Notation (informal)**: $\\text{te\\_words}() \\rightarrow [u32; 256] \\land \\forall x, \\text{te}_x = \\text{build\\_te}(\\text{walk::SBOX}[x])$\n5. **Doc comment**:\n```rust\n/// Generates the fixed AES transformation table (`ms_te`) used by the CUDA kernels, based on `walk::SBOX`.\npub fn te_words() -> [u32; 256] { /* ... */ }\n```\n\n### `DeviceInfo` (Struct)\n1. **Reasoning**: Stores metadata about a detected CUDA device (index, name, SMS count), used for selection and logging.\n2. **Preconditions**: Device must be successfully enumerated by the CUDA driver.\n3. **Postconditions**: Contains accurate identification and hardware capability data for a specific GPU.\n4. **Z Notation (informal)**: $\\text{DeviceInfo} = \\{ \\text{index}: \\mathbb{N}, \\text{name}: \\text{String}, \\text{sms}: \\mathbb{N} \\}$\n5. **Doc comment**:\n```rust\n/// Metadata for a detected CUDA device, including its index and Streaming Multiprocessor (SMS) count.\n#[derive(Clone, Debug)]\npub struct DeviceInfo { /* ... */ }\n```\n\n### `devices()`\n1. **Reasoning**: Interfaces with the CUDA driver (`cuDeviceGetCount`, `cuDeviceGet`, etc.) to enumerate all available GPUs on the system.\n2. **Preconditions**: The NVIDIA driver must be installed and accessible (e.g., `libcuda.so.1` or `nvcuda.dll`).\n3. **Postconditions**: Returns a `Vec<DeviceInfo>` containing all detected devices, or an error string if the driver cannot be initialized or devices cannot be enumerated.\n4. **Z Notation (informal)**: $\\text{devices}() \\rightarrow \\text{Result}(\\text{Vec}<\\text{DeviceInfo}>, \\text{String}) \\land (\\text{Success} \\implies \\forall d \\in \\text{Vec}, d \\text{ is valid GPU info})$\n5. **Doc comment**:\n```rust\n/// Enumerates all available CUDA devices using the driver API. Returns an error if the NVIDIA driver is not found or initialized.\npub fn devices() -> Result<Vec<DeviceInfo>, String> { /* ... */ }\n```\n\n### `WalkBatcher` (Trait)\n1. **Reasoning**: Defines the interface for any mining backend (CUDA, CPU stand-in) to perform a batch of walk calculations, abstracting hardware specifics from the core mining logic.\n2. **Preconditions**: The implementing structure must be thread-safe (`Send`).\n3. **Postconditions**: Provides methods to label the backend, report capacity, and execute a batch of nonces against a target hash.\n4. **Z Notation (informal)**: $\\text{WalkBatcher} \\implies \\{ \\text{label}() \\rightarrow \\text{String}, \\text{capacity}() \\rightarrow \\mathbb{N}, \\text{hash\\_batch}(\\dots) \\rightarrow \\text{Result}(\\text{Option}(\\text{Vec}<[u8; 32]>), \\text{String}) \\}$\n5. **Doc comment**:\n```rust\n/// Trait defining the interface for a mining backend (e.g., CUDA or CPU stand-in) to execute batches of walk calculations.\npub trait WalkBatcher: Send { /* ... */ }\n```\n\n### `CudaWalker` (Struct)\n1. **Reasoning**: Manages the entire lifecycle of a single GPU worker: device opening, context creation, kernel loading (PTX), memory allocation, and execution loop. It implements `WalkBatcher`.\n2. **Preconditions**: The CUDA driver must be available. The device index must be valid.\n3. **Postconditions**: A fully initialized, tested, and ready-to-mine GPU worker instance. Upon dropping, all allocated device memory is freed.\n4. **Z Notation (informal)**: $\\text{CudaWalker} \\land \\text{open}(\\text{index}, \\text{walks}) \\rightarrow \\text{Result}(\\text{CudaWalker}, \\text{String}) \\land (\\text{Drop} \\implies \\text{free\\_memory})$\n5. **Doc comment**:\n```rust\n/// Represents a single initialized CUDA GPU worker, managing context, kernels, and memory for walk mining.\npub struct CudaWalker { /* ... */ }\n```\n\n### `CudaWalker::open(index, walks)`\n1. **Reasoning**: Initializes the CUDA environment for a specific device, loads the PTX kernels, uploads constants (`ms_te`, `ms_keys`), and allocates necessary device memory based on available free memory.\n2. **Preconditions**: The CUDA driver must be functional. The `index` must correspond to an existing device found by `devices()`.\n3. **Postconditions**: Returns a fully configured `CudaWalker` instance, or an error if initialization (driver, memory, kernel load) fails.\n4. **Z Notation (informal)**: $\\text{open}(\\text{index}, \\text{walks}) \\rightarrow \\text{Result}(\\text{CudaWalker}, \\text{String}) \\land (\\text{Success} \\implies \\text{ContextSet} \\land \\text{ModuleLoaded} \\land \\text{MemoryAllocated})$\n5. **Doc comment**:\n```rust\n/// Opens a specified CUDA device, loads the walk kernels (PTX), allocates memory, and performs a self-test against known answers.\npub fn open(index: usize, walks: Option<u32>) -> Result<Self, String> { /* ... */ }\n```\n\n### `CudaWalker::self_test()`\n1. **Reasoning**: Verifies the integrity of the GPU setup by running the kernels against the known golden answers (`walk::GOLDEN`). This prevents mining on faulty or misconfigured hardware.\n2. **Preconditions**: The `CudaWalker` must be successfully opened and initialized.\n3. **Postconditions**: Returns `Ok(())` if all known answers are matched; otherwise, returns an error string, preventing the walker from being used for mining.\n4. **Z Notation (informal)**: $\\text{self\\_test}() \\rightarrow \\text{Result}(\\text{()}, \\text{String}) \\land (\\text{Success} \\implies \\forall g \\in \\text{GOLDEN}, \\text{hash\\_batch}(g) = g)$\n5. **Doc comment**:\n```rust\n/// Runs a self-test against the known golden answers to ensure the GPU is functioning correctly before mining.\nfn self_test(&mut self) -> Result<(), String> { /* ... */ }\n```\n\n### `CudaWalker::hash_batch(mining_hash, nonces, cancel)` (via `WalkBatcher` implementation)\n1. **Reasoning**: Executes the core mining loop: uploads job parameters, launches initialization, iteratively launches step kernels (adjusting chunk size for target latency), and finally launches the finish kernel to retrieve results.\n2. **Preconditions**: The `CudaWalker` must be open and initialized. The `cancel` flag must be monitored between kernel launches.\n3. **Postconditions**: Returns `Ok(Some(Vec<[u8; 32]>))` containing the hashes found for the nonces, or `Ok(None)` if the job was cancelled, or an error string upon CUDA failure.\n4. **Z Notation (informal)**: $\\text{hash\\_batch}(\\dots) \\rightarrow \\text{Result}(\\text{Option}(\\text{Hashes}), \\text{String}) \\land (\\text{Success} \\implies \\text{Hashes} \\subseteq \\text{Nonces})$\n5. **Doc comment**:\n```rust\n/// Executes a batch of walk calculations on the GPU, launching initialization, steps, and finalization kernels.\nfn hash_batch(\n    &mut self,\n    mining_hash: &[u8; 32],\n    nonces: &[u64],\n    cancel: &AtomicBool,\n) -> Result<Option<Vec<[u8; 32]>>, String> { /* ... */ }\n```\n\n### `mine_walk(split, midstate, target, pool_target, threads, cancel, hash_counter)`\n1. **Reasoning**: The primary public entry point for mining. It orchestrates the search by determining if CPU or GPU resources are used based on `Split`, managing the GPU session lifecycle (`Session`), and coordinating results between CPU and GPU workers.\n2. **Preconditions**: `midstate` and `target` must be valid 32-byte hashes. `cancel` and `hash_counter` must be initialized `Arc`s.\n3. **Postconditions**: Returns `Some(MiningResult)` (Block or Share) if a solution is found, or `None` if the job was cancelled or all workers failed/stopped.\n4. **Z Notation (informal)**: $\\text{mine\\_walk}(\\dots) \\rightarrow \\text{Option}(\\text{MiningResult}) \\land (\\text{Success} \\implies (\\text{Result} \\in \\{\\text{Block}, \\text{Share}\\}) \\lor (\\text{Cancelled}))$\n5. **Doc comment**:\n```rust\n/// Mines a single Walk job, utilizing CPU threads and/or available CUDA GPUs based on the specified `Split`.\n/// This function manages the GPU session lifecycle (start/stop) for the given job.\npub fn mine_walk(\n    split: Split,\n    midstate: [u8; 32],\n    target: [u8; 32],\n    pool_target: Option<[u8; 32]>,\n    threads: usize,\n    cancel: Arc<AtomicBool>,\n    hash_counter: Arc<AtomicU64>,\n) -> Option<MiningResult> { /* ... */ }\n```"}, {"path": "core/extension.rs", "module": "core", "doc": "## Function Documentation\n\n### `create_extension`\n\n**Reasoning**: This function implements the core sequential Proof-of-Work (PoW) mechanism using Blake3 chaining. It is designed for zero-allocation performance by using a stack array for initial data construction, relying on Blake3's highly optimized assembly routines for fast hashing.\n**Preconditions**: `midstate` must be a valid 32-byte hash. `nonce` must be a valid `u64`.\n**Postconditions**: Returns an `Extension` struct where `nonce` matches the input, and `final_hash` is the result of $ITERATIONS$ sequential Blake3 hashes starting from the initial data derived from `midstate` and `nonce`.\n**Z Notation (informal)**:\n```zed\nCreateExtension\n---------------\nmidstate? : 𝔹³²\nnonce? : ℕ₆₄\next! : Extension\npre  true\npost ext!.nonce = nonce?\n   ∧ ext!.final_hash = ℋ^{ITERS}(ℋ(midstate? ⌢ le8(nonce?)))\n```\n**Doc comment**:\n```rust\n/// Creates a Proof-of-Work extension by executing sequential Blake3 delay iterations.\n/// This function uses zero-allocation stack memory for initial data construction.\npub fn create_extension(midstate: [u8; 32], nonce: u64) -> Extension { ... }\n```\n\n### `verify_extension`\n\n**Reasoning**: Provides a cryptographically sound validation of an extension by recomputing the entire sequential hash chain using `create_extension`. This DRY approach ensures that the mining and validation logic are identical, preventing logic drift. Full recomputation is necessary to defeat subset-grinding attacks.\n**Preconditions**: `midstate` must be a valid 32-byte hash. `ext` must be a valid `Extension`. `target` must be a valid 32-byte difficulty target.\n**Postconditions**: Returns `Ok(())` if the extension's `final_hash` is below the `target` AND if recomputing the chain using `create_extension(midstate, ext.nonce)` yields `ext.final_hash`. Otherwise, returns an error (`anyhow::Error`).\n**Z Notation (informal)**:\n```zed\nVerifyExtension\n---------------\nmidstate? : 𝔹³²\next? : Extension\ntarget? : 𝔹³²\nresult! : Result<()>\npre  true\npost result! = Ok(()) ⇔\n       (ext?.final_hash < target?)\n       ∧ (create_extension(midstate?, ext?.nonce).final_hash = ext?.final_hash)\n```\n**Doc comment**:\n```rust\n/// Verifies a Proof-of-Work extension by recomputing the full sequential hash chain.\n/// This ensures cryptographic soundness and prevents logic drift between mining and validation.\npub fn verify_extension(midstate: [u8; 32], ext: &Extension, target: &[u8; 32]) -> Result<()> { ... }\n```\n\n### `create_extension_with`\n\n**Reasoning**: Acts as a dispatcher, allowing the PoW extension to be created using different algorithms (`PowAlgo::Blake3Chain` or `PowAlgo::Walk`), abstracting the underlying mining implementation.\n**Preconditions**: `midstate` must be valid. `nonce` must be valid. `algo` must be one of the defined `PowAlgo` variants.\n**Postconditions**: Returns an `Extension` struct containing the provided `nonce` and the resulting hash computed according to `algo`.\n**Z Notation (informal)**:\n```zed\nCreateExtensionWith\n---------------\nalgo? : PowAlgo\nmidstate? : 𝔹³²\nnonce? : ℕ₆₄\next! : Extension\npre  true\npost ext!.nonce = nonce?\n   ∧ ext!.final_hash = Hash(midstate?, nonce?, algo?)\n```\n**Doc comment**:\n```rust\n/// Creates a Proof-of-Work extension using a specified algorithm (`PowAlgo`).\npub fn create_extension_with(algo: PowAlgo, midstate: [u8; 32], nonce: u64) -> Extension { ... }\n```\n\n### `create_extension_at`\n\n**Reasoning**: Provides a convenience wrapper to automatically determine the correct PoW algorithm for a specific block height using `pow_algo_at`, simplifying usage within the midwimble context.\n**Preconditions**: `height` must be a non-negative `u64`. `midstate` and `nonce` must be valid.\n**Postconditions**: Returns an `Extension` struct generated using the algorithm defined for `height`.\n**Z Notation (informal)**:\n```zed\nCreateExtensionAt\n---------------\nheight? : ℕ₆₄\nmidstate? : 𝔹³²\nnonce? : ℕ₆₄\next! : Extension\npre  true\npost ext!.nonce = nonce?\n   ∧ ext!.final_hash = Hash(midstate?, nonce?, pow_algo_at(height?))\n```\n**Doc comment**:\n```rust\n/// Creates a Proof-of-Work extension specific to a block height, automatically selecting the required algorithm.\npub fn create_extension_at(height: u64, midstate: [u8; 32], nonce: u64) -> Extension { ... }\n```\n\n### `verify_extension_with`\n\n**Reasoning**: Generalizes validation to support any specified `PowAlgo`, making it flexible for different mining strategies (e.g., Blake3Chain vs. Walk).\n**Preconditions**: `midstate` must be valid. `ext` must be a valid `Extension`. `target` must be valid. `algo` must be one of the defined `PowAlgo` variants.\n**Postconditions**: Returns `Ok(())` if `ext.final_hash` is below `target` AND if recomputing the chain using `create_extension_with(algo, midstate, ext.nonce)` yields `ext.final_hash`. Otherwise, returns an error.\n**Z Notation (informal)**:\n```zed\nVerifyExtensionWith\n---------------\nalgo? : PowAlgo\nmidstate? : 𝔹³²\next? : Extension\ntarget? : 𝔹³²\nresult! : Result<()>\npre  true\npost result! = Ok(()) ⇔\n       (ext?.final_hash < target?)\n       ∧ (create_extension_with(algo?, midstate?, ext?.nonce).final_hash = ext?.final_hash)\n```\n**Doc comment**:\n```rust\n/// Verifies a Proof-of-Work extension using a specified algorithm (`PowAlgo`).\npub fn verify_extension_with(\n    algo: PowAlgo,\n    midstate: [u8; 32],\n    ext: &Extension,\n    target: &[u8; 32],\n) -> Result<()> { ... }\n```\n\n### `verify_extension_at`\n\n**Reasoning**: Convenience wrapper that automatically selects the correct PoW algorithm for a given block height using `pow_algo_at`, simplifying validation within the midwimble context.\n**Preconditions**: `height`
