 valid chain sequence starting from `prev`; `first_height` must be the correct midstate height of the first header.\n**Postconditions**: Returns `Ok(())` if all proofs of work are valid; returns `Err` with a specific `PowCheck` error otherwise.\n**Z Notation (informal)**: $\\text{verify\\_pow}(rh, h_0) \\triangleq \\forall i \\in [0, |rh.\\text{headers}|-1]: \\text{check\\_pow\\_jobs}(\\text{job}_i) = \\text{Ok}()$\n**Doc comment**: `/// Verifies the proof of work for every header in the run. This is the expensive check, run after initial relay acceptance.`\n\n## `Relay::genesis`\n\n**Reasoning**: Initializes a new relay state to the consensus-agreed midstate genesis point.\n**Preconditions**: None.\n**Postconditions**: Returns a `Relay` instance containing exactly one entry: the `RelayEntry::root()`.\n**Z Notation (informal)**: $\\text{genesis}() \\triangleq R \\mid R.\\text{entries} = \\{ \\text{MIDSTATE\\_BLOCK\\_HEIGHT}: \\text{RelayEntry::root}() \\} \\land R.\\text{heights} = \\{ \\text{hash}(\\text{root}): \\text{MIDSTATE\\_BLOCK\\_HEIGHT} \\}$\n**Doc comment**: `/// The relay before anything is relayed: initializes the state with the midstate genesis root.`\n\n## `Relay::from_entries`\n\n**Reasoning**: Reconstructs a `Relay` state from a list of entries, ensuring they form a continuous, valid chain segment within the window. This validates external persistence formats.\n**Preconditions**: The input `entries` vector must be sorted by height; the length must not exceed `RELAY_WINDOW + 1`.\n**Postconditions**: Returns `Ok(Relay)` if all chain links (height, previous hash, chain work, digest) are consistent; returns `Err` otherwise.\n**Z Notation (informal)**: $\\text{from\\_entries}(E) \\triangleq \\exists R: R = \\text{Relay} \\land \\forall e_i, e_{i+1} \\in E: e_{i+1}.\\text{height} = e_i.\\text{height} + 1 \\land e_{i+1}.\\text{prev} = e_i.\\text{hash} \\land e_{i+1}.\\text{digest} = e_{i+1}.\\text{digest\\_after}(e_i.\\text{digest})$\n**Doc comment**: `/// Rebuilds a relay from its entries, verifying that they form a single, continuous, and valid chain segment.`\n\n## `Relay::tip`\n\n**Reasoning**: Provides quick access to the most recent (highest height) entry in the relay's chain.\n**Preconditions**: The relay must not be empty (guaranteed by `genesis`).\n**Postconditions**: Returns a reference to the highest-height `RelayEntry`.\n**Z Notation (informal)**: $\\text{tip}(R) \\triangleq R.\\text{entries}.\\text{max\\_key}()$\n**Doc comment**: `/// Returns a reference to the highest height entry in the relay's chain.`\n\n## `Relay::base`\n\n**Reasoning**: Provides quick access to the oldest (lowest height) entry currently retained in the relay window.\n**Preconditions**: The relay must not be empty (guaranteed by `genesis`).\n**Postconditions**: Returns a reference to the lowest-height `RelayEntry`.\n**Z Notation (informal)**: $\\text{base}(R) \\triangleq R.\\text{entries}.\\text{min\\_key}()$\n**Doc comment**: `/// Returns a reference to the lowest height entry currently retained in the relay window.`\n\n## `Relay::commitment`\n\n**Reasoning**: Provides the cryptographic commitment of the entire current relay state, which is the digest of the tip entry. This single hash authenticates all entries back to the genesis root.\n**Preconditions**: The relay must not be empty.\n**Postconditions**: Returns the 32-byte digest of the highest-height `RelayEntry`.\n**Z Notation (informal)**: $\\text{commitment}(R) \\triangleq R.\\text{tip}(R).\\text{digest}$\n**Doc comment**: `/// The state root commits to: the tip's digest, which chains through every entry back to genesis.`\n\n## `Relay::credited_above`\n\n**Reasoning**: Calculates the total proof-of-work credited by all headers strictly above a given height, capped at a maximum value. This is used to verify if a replacement branch outweighs the chain it replaces.\n**Preconditions**: `height` must be a valid midstate height; `cap` must be non-negative.\n**Postconditions**: Returns the sum of `work` for all entries $h > \\text{height}$, capped at `cap`.\n**Z Notation (informal)**: $\\text{credited\\_above}(R, h, c) \\triangleq \\min(c, \\sum_{e \\in R, e.\\text{height} > h} e.\\text{work})$\n**Doc comment**: `/// Calculates the total proof-of-work credited above a given height, capped at `cap`.`\n\n## `Relay::extend`\n\n**Reasoning**: The core state transition function. It attempts to incorporate a run of relayed headers into the relay chain, performing all necessary consensus checks (target adherence, timestamp limits, chain continuity, and weight comparison). If successful, it updates the state and reports the changes; otherwise, the state remains unchanged.\n**Preconditions**: `relayed` must be a valid `RelayHeaders` structure; `block_timestamp` must be the timestamp of the block relaying the headers; the run must build on an entry present in the current relay chain (`relayed.prev`).\n**Postconditions**: If successful, the relay state is updated by adding new entries and removing replaced/stale entries, and a `RelayChange` detailing these modifications is returned. If any check fails (e.g., target mismatch, timestamp too far future, insufficient work), the relay state is unchanged, and an error is returned.\n**Z Notation (informal)**: $\\text{extend}(R, rh, t) \\triangleq \\begin{cases} (R', \\Delta) & \\text{if } \\text{valid\\_run}(rh, R, t) \\land \\text{outweighs}(rh, R) \\\\ \\text{Error} & \\text{otherwise} \\end{cases}$\n**Doc comment**: `/// Applies the headers relayed by a block, performing all consensus checks (target, timestamp, weight). Returns the change set or an error.`\n\n## `Relay::apply_change`\n\n**Reasoning**: Utility function to apply a previously calculated state change (`RelayChange`) to the relay in memory, typically used for testing or local state management.\n**Preconditions**: `removed` and `added` must correspond to a valid `RelayChange`.\n**Postconditions**: The relay state is updated by removing all entries in `removed` and inserting all entries in `added`.\n**Z Notation (informal)**: $\\text{apply\\_change}(R, \\Delta) \\triangleq R' \\mid R'.\\text{entries} = (R.\\text{entries} \\setminus \\text{removed}) \\cup \\text{added}$\n**Doc comment**: `/// Replays a change (storage and in-memory rewinds use this) by applying the removed and added entries.`\n\n## `Relay::revert_change`\n\n**Reasoning**: Utility function to undo a state change, restoring the relay to its prior state.\n**Preconditions**: `removed` and `added` must correspond to a valid `RelayChange`.\n**Postconditions**: The relay state is updated by removing all entries in `added` and inserting all entries in `removed`.\n**Z Notation (informal)**: $\\text{revert\\_change}(R, \\Delta) \\triangleq R' \\mid R'.\\text{entries} = (R.\\text{entries} \\setminus \\text{added}) \\cup \\text{removed}$\n**Doc comment**: `/// Takes a change back, restoring the relay state to before the change was applied.`\n\n## `MidstateHeaders::verify`\n\n**Reasoning**: Prepares a run of headers for relaying by first checking local header constraints (target adherence) and then delegating the expensive proof-of-work verification to `RelayHeaders::verify_pow`.\n**Preconditions**: The `headers` must form a continuous chain starting from `prev`; `start` must be the correct height.\n**Postconditions**: Returns `Ok(RelayHeaders)` if all local checks pass, allowing subsequent POW verification; returns `Err` if any target constraint is violated.\n**Z Notation (informal)**: $\\text{verify}(mh) \\triangleq (\\forall i: mh.\\text{headers}[i].\\text{target} \\le mh.\\text{headers}[i].\\text{final\\_hash}) \\implies \\text{RelayHeaders}.\\text{verify\\_pow}(\\dots)$\n**Doc comment**: `/// Checks each header meets its own target and then verifies the full proof of work.`\n\n## `RelayFeed::add`\n\n**Reasoning**: Ingests a new run of headers from a source (e.g., midstate node or bond file) into the feed, respecting the `replace` flag to handle conflicting views.\n**Preconditions**: `run` must be a valid `MidstateHeaders` structure; `replace` dictates conflict resolution.\n**Postconditions**: The feed's internal map is updated with the new headers for the specified height range, potentially overwriting existing entries if `replace` is true.\n**Z Notation (informal)**: $\\text{add}(f, r, \\text{rep}) \\triangleq f' \\mid \\forall i: f'.\\text{headers}[r.\\text{start}+i] = r.\\text{headers}[i] \\land (\\text{rep} \\lor \\neg f.\\text{contains\\_key}(r.\\text{start}+i))$\n**Doc comment**: `/// Adds a run of headers to the feed. If a height is already held, `replace` decides which view wins.`\n\n## `RelayFeed::prune`\n\n**Reasoning**: Maintains memory efficiency by removing headers that are too old (below the relay's base) or too far ahead (beyond the relay's tip plus `FEED_AHEAD`).\n**Preconditions**: A valid `Relay` state must be provided to define the window boundaries.\n**Postconditions**: The feed's internal map is truncated, retaining only headers within the necessary operational range defined by the relay's window and feed buffer.\n**Z Notation (informal)**: $\\text{prune}(f, r) \\triangleq f' \\mid f'.\\text{keys} \\subseteq [r.\\text{base}.\\text{height}, r.\\text{tip}.\\text{height} + \\text{FEED\\_AHEAD}]$\n**Doc comment**: `/// Forgets headers the relay no longer needs (below its window) and any far beyond what blocks could relay soon.`\n\n## `RelayFeed::next_for`\n\n**Reasoning**: Determines the optimal run of headers that a block producer should relay. This is either the continuous extension of the relay's tip or the longest valid fork within the relay's window, prioritizing continuity first.\n**Preconditions**: A valid `Relay` state must be provided; the feed must contain headers relevant to the relay's current state.\n**Postconditions**: Returns `Some(RelayHeaders)` representing the proposed run, or `None` if no valid continuation or fork exists within the relay's window constraints.\n**Z Notation (informal)**: $\\text{next\\_for}(f, r) \\triangleq \\begin{cases} \\text{Run}_{\\text{tip}} & \\text{if } f \\text{ extends } r.\\text{tip} \\\\ \\text{Run}_{\\text{fork}} & \\text"}, {"path": "core/scan.rs", "module": "core", "doc": "## `ScanBlock`\n\n### Reasoning\n`ScanBlock` is a highly compressed representation of a full block, designed specifically for light wallets. It contains only the minimum data (block ID, header hash, output commitments, input prefixes) required to determine if the block concerns the wallet without needing to download the entire block body.\n\n### Preconditions\n* The `Batch` provided must represent a valid, fully constructed block.\n\n### Postconditions\n* A `ScanBlock` instance is returned, containing only essential metadata and commitment prefixes.\n* The `id` and `header_hash` accurately reflect the full block's header.\n* The `outputs` vector includes the `(ephemeral_key, view_tag)` for all outputs (body and coinbase).\n* The `inputs` vector contains the first `INPUT_PREFIX` bytes of every input commitment.\n\n### Z Notation (informal)\n$$\\text{ScanBlock} \\equiv \\{ \\text{id}: [u8; 32], \\text{header\\_hash}: [u8; 32], \\text{outputs}: \\text{Vec}(\\text{Point32} \\times u8), \\text{inputs}: \\text{Vec}([u8; 8]) \\}$$\n\n### Doc comment\n```rust\n/// A compressed representation of a block, containing only the minimal data required\n/// for a light wallet to determine if the block concerns it.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]\npub struct ScanBlock {\n    // ... fields\n}\n```\n\n## `ScanBlock::of`\n\n### Reasoning\nThis constructor translates a full `Batch` (block data) into the compact `ScanBlock` format by extracting only the necessary fields and calculating the header hash.\n\n### Preconditions\n* `batch`: Must be a valid `&Batch` representing a complete block.\n\n### Postconditions\n* A new `ScanBlock` is created, accurately summarizing the input `batch`.\n\n### Z Notation (informal)\n$$\\text{ScanBlock} = \\text{of}(\\text{Batch}) \\land \\text{ScanBlock}.\\text{id} = \\text{Batch}.\\text{extension}.\\text{final\\_hash}$$\n\n### Doc comment\n```rust\n/// Constructs a `ScanBlock` from a full block `Batch`, extracting only the necessary\n/// commitment data and header information.\npub fn of(batch: &Batch) -> Self { /* ... */ }\n```\n\n## `ScanRun`\n\n### Reasoning\n`ScanRun` aggregates consecutive `ScanBlock`s, representing the scan data stream provided by a node. It maintains context (the previous block ID) to ensure blocks are linked correctly and allows validation against full block data.\n\n### Preconditions\n* `prev`: Must be the correct header hash of the block preceding the run.\n* `batches`: Must be a slice of valid `Batch` objects corresponding to the scan data.\n\n### Postconditions\n* A `ScanRun` instance is created, linking the blocks sequentially starting from `prev`.\n\n### Z Notation (informal)\n$$\\text{ScanRun} \\equiv \\{ \\text{prev}: [u8; 32], \\text{blocks}: \\text{Vec}(\\text{ScanBlock}) \\}$$\n\n### Doc comment\n```rust\n/// Consecutive blocks' scan data, as provided by a node. It links blocks sequentially\n/// starting from `prev`.\n#[derive(Clone, Debug, PartialEq, Eq, Serialize, Deserialize)]\npub struct ScanRun {\n    // ... fields\n}\n```\n\n## `ScanRun::of`\n\n### Reasoning\nThis constructor builds the `ScanRun` structure by converting a slice of full blocks (`Batch`) into a sequence of compressed `ScanBlock`s.\n\n### Preconditions\n* `prev`: The header hash of the block immediately preceding the first block in `batches`.\n* `batches`: A slice of valid `Batch` objects.\n\n### Postconditions\n* A `ScanRun` is returned, where `blocks[0]` correctly links to `prev`, and subsequent blocks link sequentially.\n\n### Z Notation (informal)\n$$\\text{ScanRun} = \\text{of}(\\text{Prev}, \\text{Batches}) \\land \\forall i < |\\text{Blocks}|: \\text{Blocks}[i].\\text{id} = \\text{Blocks}[i+1].\\text{prev\\_of}(i+1)$$\n\n### Doc comment\n```rust\n/// Constructs a `ScanRun` from a preceding block ID and a slice of full block batches.\npub fn of(prev: [u8; 32], batches: &[Batch]) -> Self { /* ... */ }\n```\n\n## `ScanRun::prev_of`\n\n### Reasoning\nThis utility method determines the required previous block ID for any block index within the run, handling the special case where the first block links back to the external `prev` ID.\n\n### Preconditions\n* `i`: Must be a valid index within the run (i.e., $0 \\le i < |\\text{blocks}|$).\n\n### Postconditions\n* The header hash of the block that immediately precedes block $i$ is returned.\n\n### Z Notation (informal)\n$$\\text{prev\\_of}(\\text{Run}, i) = \\begin{cases} \\text{Run}.\\text{prev} & \\text{if } i=0 \\\\ \\text{Run}.\\text{blocks}[i-1].\\text{id} & \\text{if } i>0 \\end{cases}$$\n\n### Doc comment\n```rust\n/// Returns the ID of the block that block `i` builds upon.\npub fn prev_of(&self, i: usize) -> [u8; 32] { /* ... */ }\n```\n\n## `ScanRun::describes`\n\n### Reasoning\nThis is the core validation method. It checks if a given full `Batch` (block) matches the compressed scan data at a specific index $i$. This ensures that the block being considered is exactly the one committed to by the scan data, preventing substitution attacks or chain misalignment.\n\n### Preconditions\n* `i`: Must be a valid index within the run ($0 \\le i < |\\text{blocks}|$).\n* `batch`: Must be a valid `&Batch` representing a complete block.\n\n### Postconditions\n* Returns `true` if and only if: (1) $i$ is within bounds, (2) `batch` links correctly to the previous block in the run (`self.prev_of(i)`), AND (3) the compressed representation of `batch` exactly matches `self.blocks[i]`.\n\n### Z Notation (informal)\n$$\\text{describes}(\\text{Run}, i, \\text{Batch}) \\iff (i < |\\text{Blocks}|) \\land (\\text{Batch}.\\text{prev\\_header\\_hash} = \\text{Run}.\\text{prev\\_of}(i)) \\land (\\text{ScanBlock}.\\text{of}(\\text{Batch}) = \\text{Run}.\\text{blocks}[i])$$\n\n### Doc comment\n```rust\n/// Checks if `batch` is block `i` of the run. This requires matching the previous header hash\n/// and ensuring the compressed scan data matches the full block's contents.\npub fn describes(&self, i: usize, batch: &Batch) -> bool { /* ... */ }\n```\n\n## `ScanRun::encode`\n\n### Reasoning\nSerializes the `ScanRun` structure into a compact byte vector using `bincode` with variable-length integer encoding, minimizing data size for transmission.\n\n### Preconditions\n* The `ScanRun` must be fully constructed and valid.\n\n### Postconditions\n* A `Vec<u8>` containing the serialized, compact representation of the run is returned.\n\n### Z Notation (informal)\n$$\\text{EncodedData} = \\text{encode}(\\text{Run})$$\n\n### Doc comment\n```rust\n/// Encodes the scan data into a compact byte vector using bincode with variable-length integers.\npub fn encode(&self) -> Vec<u8> { /* ... */ }\n```\n\n## `ScanRun::decode`\n\n### Reasoning\nDeserializes a raw byte slice back into a `ScanRun` structure, allowing the wallet to ingest scan data received from a node.\n\n### Preconditions\n* `bytes`: Must be a byte slice containing valid, correctly encoded `ScanRun` data.\n\n### Postconditions\n* A `Result<Self>` is returned. If successful, the decoded `ScanRun` matches the input data; otherwise, an error indicating invalid scan data is returned.\n\n### Z Notation (informal)\n$$\\text{Run} = \\text{decode}(\\text{Bytes}) \\implies \\text{Bytes} \\text{ is valid ScanRun encoding}$$\n\n### Doc comment\n```rust\n/// Decodes a byte slice into a `ScanRun`, validating that the data conforms to the scan format.\npub fn decode(bytes: &[u8]) -> Result<Self> { /* ... */ }\n```\n\n## `ScanRun::size_of`\n\n### Reasoning\nCalculates the exact serialized size of a single `ScanBlock` using the chosen compact encoding, useful for efficient data management and network requests.\n\n### Preconditions\n* `block`: Must be a valid `&ScanBlock`.\n\n### Postconditions\n* The precise byte size required to serialize the `block` is returned as a `usize`.\n\n### Z Notation (informal)\n$$\\text{Size} = \\text{size\\_of}(\\text{Block}) \\implies \\text{Size} = \\text{bincode\\_serialized\\_size}(\\text{Block})$$\n\n### Doc comment\n```rust\n/// Calculates the encoded size in bytes of a single `ScanBlock`.\npub fn size_of(block: &ScanBlock) -> usize { /* ... */ }\n```\n\n## `input_prefix`\n\n### Reasoning\nExtracts the required 8-byte prefix from a full `Point32` commitment, fulfilling the minimal data requirement for input tracking in light wallets.\n\n### Preconditions\n* `commitment`: Must be a valid `&Point32` (i.e., at least 8 bytes long).\n\n### Postconditions\n* An array `[u8; 8]` containing the first 8 bytes of the commitment is returned.\n\n### Z Notation (informal)\n$$\\text{Prefix} = \\text{input\\_prefix}(\\text{Commitment}) \\land \\text{Prefix}[1..8] = \\text{Commitment}[1..8]$$\n\n### Doc comment\n```rust\n/// Extracts the first `INPUT_PREFIX` bytes (8 bytes) from a full commitment `Point32`.\npub fn input_prefix(commitment: &Point32) -> [u8; INPUT_PREFIX] { /* ... */ }\n```\n\n## `encoding` (Helper Function)\n\n### Reasoning\nProvides a configured `bincode::Options` instance that enforces variable-length integer encoding, which is crucial for achieving the compact size of the scan data.\n\n### Preconditions\n* None.\n\n### Postconditions\n* An immutable `impl Options` object configured for compact serialization is returned.\n\n### Z Notation (informal)\n$$\\text{Encoding} \\equiv \\text{bincode\\_options}(\\text{varint}, \\text{limit}=2^{21})$$\n\n### Doc comment\n```rust\n/// Configures bincode options to use variable-length integer encoding for maximum compactness.\nfn encoding() -> impl Options { /* ... */ }\n```"}, {"path": "core/simd_mining.rs", "module": "core", "doc": "## Function Documentation\n\n### `bytes_to_words`\n\n1. **Reasoning**: Converts a raw 32-byte message block into 8 little-endian 32-bit words, which is the standard internal representation for BLAKE3 compression.\n2. **Preconditions**: The input slice `b` must be exactly 32 bytes long (`&[u8; 32]`).\n3. **Postconditions**: Returns an array of 8 `u32` words where each word correctly represents 4 consecutive bytes from the input in little-endian order.\n4. **Z Notation (informal)**: $\\forall b \\in \\text{BYTE}^{32} . \\forall i \\in 0..7 . \\text{words}(b)(i) = \\sum_{j=0}^3 b(4i+j) \\cdot 2^{8j}$\n5. **Doc comment**: `/// Converts a 32-byte array into 8 little-endian u32 words for BLAKE3 processing.`\n\n### `SimdLevel::lanes`\n\n1. **Reasoning**: Provides a standardized way to query the effective parallelism (number of nonces processed simultaneously) based on the detected hardware backend.\n2. **Preconditions**: The receiver `self` must be a valid `SimdLevel` variant.\n3. **Postconditions**: Returns an integer value guaranteed to be 4 or 8, representing the number of lanes.\n4. **Z Notation (informal)**: $\\forall \\ell \\in \\text{SimdLevel} . \\text{lanes}(\\ell) \\in \\{4, 8\\}$\n5. **Doc comment**: `/// Returns the number of nonces processed per batch call (4 or 8).`\n\n### `SimdLevel::name`\n\n1. **Reasoning**: Provides a human-readable, unique identifier for logging and diagnostic purposes, mapping the internal enum variant to a descriptive string.\n2. **Preconditions**: The receiver `self` must be a valid `SimdLevel` variant.\n3. **Postconditions**: Returns a static string slice that is injective across all `SimdLevel` variants.\n4. **Z Notation (informal)**: $\\forall \\ell_1, \\ell_2 \\in \\text{SimdLevel} . \\ell_1 \\neq \\ell_2 \\Rightarrow \\text{name}(\\ell_1) \\neq \\text{name}(\\ell_2)$\n5. **Doc comment**: `/// Returns a human-readable name for the detected SIMD level.`\n\n### `detect`\n\n1. **Reasoning**: Determines the optimal SIMD capability at runtime (or compile time for WASM) by checking CPU features (AVX2) and environment variables (`MINER_NEON_FORCE`). This ensures the most performant path is selected without relying on static compilation assumptions alone.\n2. **Preconditions**: None.\n3. **Postconditions**: Returns a `SimdLevel` variant that accurately reflects the host CPU/target capabilities, ensuring `lanes()` is 4 or 8.\n4. **Z Notation (informal)**: $\\text{detect}() \\in \\text{SimdLevel} \\land \\text{lanes}(\\text{detect}()) \\in \\{4, 8\\}$\n5. **Doc comment**: `/// Detects the best available SIMD level for the current CPU/target based on runtime checks and environment configuration.`\n\n### `detected_level`\n\n1. **Reasoning**: Wraps `detect()` using `std::sync::OnceLock` to ensure that the potentially costly CPU feature detection is performed exactly once per process lifetime, providing a stable, cached result for all subsequent calls.\n2. **Preconditions**: None.\n3. **Postconditions**: Returns the globally cached `SimdLevel`. For the first call, it equals `detect()`; for all subsequent calls, it equals the value from the first call. The returned value is invariant across the process lifetime.\n4. **Z Notation (informal)**: $\\forall t_1, t_2 . \\text{detected\\_level}()@t_1 = \\text{detected\\_level}()@t_2$\n5. **Doc comment**: `/// Returns the cached SIMD level, performing detection only on the first call.`\n\n### `mine_batch`\n\n1. **Reasoning**: The core mining function. It dispatches the nonce processing to the fastest available SIMD backend (AVX2, NEON 8-way, WASM 4-way, or Scalar) based on `detected_level()`.\n2. **Preconditions**: The input slice `nonces` must have a length greater than or equal to `detected_level().lanes()`.\n3. **Postconditions**: Returns a vector of tuples `(nonce, hash)` whose length is exactly `detected_level().lanes()`. Crucially, the computed hash for each nonce must match the result of the canonical scalar reference computation (`Scalar`).\n4. **Z Notation (informal)**: $\\text{pre}: \\#\\text{nonces} \\ge w \\Rightarrow \\text{post}: \\#\\text{result} = w \\land \\forall i \\in 0..w-1 . \\text{result}(i).1 = \\text{Scalar}(\\text{midstate}, \\text{nonces}(i))$\n5. **Doc comment**: `/// Mines a batch of nonces using the best available SIMD backend, ensuring consensus safety against scalar reference.`\n\n### `pow_seed`\n\n1. **Reasoning**: Constructs the input data for the final PoW hash check: the 32-byte mining hash concatenated with the 64-bit nonce (little-endian). This is the canonical input required by the PoW verification process.\n2. **Preconditions**: `mining_hash` must be exactly 32 bytes. `nonce` must be a valid `u64`.\n3. **Postconditions**: Returns a 32-byte hash result computed over the concatenated data (`mining_hash` $\\parallel$ `nonce_le8`).\n4. **Z Notation (informal)**: $\\text{pow\\_seed}(\\text{MH}, N) = \\text{blake3}(\\text{MH} \\parallel N_{\\text{le8}})$\n5. **Doc comment**: `/// Computes the PoW chain seed by hashing the mining hash concatenated with the nonce (little-endian).`\n\n### `iterate_scalar`\n\n1. **Reasoning**: Implements the canonical, reference scalar miner: $k$-fold iteration of BLAKE3 compression. This function is used to verify that all SIMD paths produce bit-identical results, ensuring consensus safety.\n2. **Preconditions**: The input `seed` must be exactly 32 bytes. `EXTENSION_ITERATIONS` must be defined.\n3. **Postconditions**: Returns the final 32-byte hash after $k$ iterations of BLAKE3 compression starting from the seed.\n4. **Z Notation (informal)**: $\\text{iterate\\_scalar}(\\text{seed}) = \\text{blake3}^{\\text{EXTENSION\\_ITERATIONS}}(\\text{seed})$\n5. **Doc comment**: `/// Performs k-fold iteration of BLAKE3 compression, serving as the canonical scalar reference miner.`\n\n### `verify_pow_batch`\n\n1. **Reasoning**: Efficiently verifies a large batch of independent PoW seeds. It leverages SIMD (AVX2/NEON) to process multiple seeds in parallel where available, falling back to scalar iteration for remaining seeds.\n2. **Preconditions**: The input `seeds` must be an array of 32-byte hashes.\n3. **Postconditions**: Returns a vector containing the final 32-byte hash for every input seed. If SIMD is used, the batch size processed by SIMD lanes is maximized.\n4. **Z Notation (informal)**: $\\text{verify\\_pow\\_batch}(\\text{Seeds}) = \\{ \\text{iterate\\_scalar}(S) \\mid S \\in \\text{Seeds} \\}$ (optimized via SIMD)\n5. **Doc comment**: `/// Verifies a batch of independent PoW seeds, utilizing SIMD lanes for parallel iteration where available.`\n\n### `PowJob::holds`\n\n1. **Reasoning**: Provides a simple check to verify if a single `PowJob` is valid by recomputing the final hash using the canonical extension function and comparing it against the claimed hash.\n2. **Preconditions**: The job must be fully defined (`algo`, `mining_hash`, `nonce`, `final_hash`).\n3. **Postconditions**: Returns `true` if the recomputed hash matches `self.final_hash`; otherwise, returns `false`.\n4. **Z Notation (informal)**: $\\text{holds}(J) = \\text{create\\_extension}(\\dots). \\text{final\\_hash} = J.\\text{final\\_hash}$\n5. **Doc comment**: `/// Recomputes this single proof of work and checks if it matches the claimed final hash.`\n\n### `check_pow_jobs_with`\n\n1. **Reasoning**: The primary, robust verification function. It processes jobs in chunks, prioritizing SIMD lanes for BLAKE3Chain jobs, while checking standard PoW jobs serially or in parallel (Rayon). It respects a `proceed` callback to allow external control (e.g., stopping on resource limits).\n2. **Preconditions**: The input slice `jobs` must be valid. The `proceed` closure must be callable.\n3. **Postconditions**: Returns `Ok(())` if all jobs hold, or `Err(PowCheck::Bad(i))` with the index of the first bad job, or `Err(PowCheck::Abandoned)` if the caller requested termination.\n4. **Z Notation (informal)**: $\\text{check\\_pow\\_jobs\\_with}(\\text{Jobs}, P) \\Rightarrow \\text{Result} \\in \\{\\text{Ok}(), \\text{Bad}(i), \\text{Abandoned}\\}$\n5. **Doc comment**: `/// Checks many independent proofs of work, respecting a 'proceed' callback and utilizing SIMD for BLAKE3Chain verification.`\n\n### `check_pow_jobs`\n\n1. **Reasoning**: A convenience wrapper around `check_pow_jobs_with` that always allows the check to proceed, simplifying usage when external resource control is not needed.\n2. **Preconditions**: The input slice `jobs` must be valid.\n3. **Postconditions**: Returns `Ok(())` if all jobs hold, or `Err(PowCheck::Bad(i))` if a bad job is found.\n4. **Z Notation (informal)**: $\\text{check\\_pow\\_jobs}(\\text{Jobs}) = \\text{check\\_pow\\_jobs\\_with}(\\text{Jobs}, \\lambda i. \\text{true})$\n5. **Doc comment**: `/// Checks all proofs of work without interruption.`\n\n### `create_extensions_4way`\n\n1. **Reasoning**: Provides a fixed, 4-lane entry point for backward compatibility and testing. It ensures that even on 8-lane architectures (like AVX2/NEON 8-way), the output is strictly 4 lanes, matching the scalar reference computation for each lane.\n2. **Preconditions**: Input `nonces` must be exactly 4 elements.\n3. **Postconditions**: Returns an array of 4 tuples `(nonce, hash)`, where each hash is guaranteed to be bit-identical to the result of the canonical scalar miner for that specific nonce.\n4. **Z Notation (informal)**: $\\text{create\\_extensions\\_4way}(\\text{M}, N^4) \\Rightarrow \\forall i \\in 0..3 . \\text{result}(i).1 = \\text{Scalar}(\\text{M}, N(i))$\n5. **Doc comment**: `/// Convenience entry point for 4-lane extension computation, ensuring scalar reference consistency regardless of detected SIMD width.`\n\n### `wasm_simd::create_extensions_4way_wasm`\n\n1. **Reasoning**: Implements the BLAKE3 compression and iteration logic specifically using WASM SIMD128 intrinsics, allowing 4 nonces to be processed in lockstep on compatible targets.\n2. **Preconditions**: The target must have `simd128` enabled. Input `nonces` must be exactly 4 elements.\n3. **Postconditions**: Returns an array of 4 tuples `(nonce, hash)`, where each hash is bit-identical to the scalar reference computation.\n4. **Z Notation (informal)**: $\\text{create\\_extensions\\_4way\\_wasm}(\\text{M}, N^4) \\Rightarrow \\forall i \\in 0..3 . \\text{result}(i).1 = \\text{Scalar}(\\text{M}, N(i))$\n5. **Doc comment**: `/// Mines 4 independent nonces in parallel using WASM SIMD128 intrinsics.`\n\n### `neon::create_extensions_4way_neon`\n\n1. **Reasoning**: Implements the BLAKE3 compression and iteration logic using ARM NEON intrinsics for 4 lanes, ensuring bit-identical results to the scalar reference on AArch64 targets.\n2. **Preconditions**: Must be running on `aarch64`. Input `nonces` must be exactly 4 elements.\n3. **Postconditions**: Returns an array of 4 tuples `(nonce, hash)`, where each hash is bit-identical to the scalar reference computation.\n4. **Z Notation (informal)**: $\\text{create\\_extensions\\_4way\\_neon}(\\text{M}, N^4) \\Rightarrow \\forall i \\in 0..3 . \\text{result}(i).1 = \\text{Scalar}(\\text{M}, N(i))$\n5. **Doc comment**: `/// Mines 4 independent nonces in parallel using ARM NEON intrinsics on aarch64.`\n\n### `neon::create_extensions_8way_neon`\n\n1. **Reasoning**: Exploits dual-issue capabilities of modern AArch64 cores (A75+, M-series) by running two interleaved 4-lane streams simultaneously, achieving 8 lanes total while maintaining bit-identical results to two consecutive 4-way scalar calls.\n2. **Preconditions**: Must be running on `aarch64`. Input `nonces` must be exactly 8 elements.\n3. **Postconditions**: Returns an array of 8 tuples `(nonce, hash)`. The output is guaranteed to be bit-identical to the result of two separate 4-way calls covering the same nonces.\n4. **Z Notation (informal)**: $\\text{Φ}_8(\\text{M}, N^8) \\equiv \\text{Φ}_4(\\text{M}, N^{0..3}) \\parallel \\text{Φ}_4(\\text{M}, N^{4..7})$\n5. **Doc comment**: `/// Mines 8 independent nonces in parallel using dual-issue ARM NEON streams on AArch64 cores.`\n\n### `neon::compress_4way_x2`\n\n1. **Reasoning**: Internal helper for the 8-way NEON path. It executes two separate 4-way BLAKE3 compressions concurrently, leveraging dual-issue hardware to maximize throughput while maintaining strict bit-identical results.\n2. **Preconditions**: All input arrays (`cv`, `msg_a`, `msg_b`) must be correctly formed for a 4-way compression.\n3. **Postconditions**: Returns a tuple of two 8-element arrays, where each array is the correct output of a single 4-way compression run.\n4. **Z Notation (informal)**: $\\text{compress\\_4way\\_x2}(\\dots) = (\\text{compress\\_4way}(\\dots)_A, \\text{compress\\_4way}(\\dots)_B)$\n5. **Doc comment**: `/// Performs two parallel 4-way BLAKE3 compressions, interleaved for dual-issue NEON execution.`\n\n## Function Documentation\n\n### `vrot16`\n| Aspect | Description |\n| :--- | :--- |\n| **Reasoning** | Implements a 16-bit right rotation for each 32-bit lane within an AVX2 register (`__m256i`). This byte-shuffle approach is used for performance optimization over standard shift/OR operations. |\n| **Preconditions** | `x` must be a valid `__m256i` AVX2 vector. |\n| **Postconditions** | The returned `__m256i` has each 32-bit lane rotated right by 16 bits. |\n| **Z Notation (informal)** | $\\text{vrot16}(x) = x \\ggg 16$ |\n| **Doc comment** | Rotates each 32-bit lane right by 16 bits using a byte-shuffle for optimized AVX2 performance. |\n\n### `vrot12`\n| Aspect | Description |\n| :--- | :--- |\n| **Reasoning** | Implements a 12-bit right rotation for each 32-bit lane using standard SIMD shift and OR operations, which is efficient for this specific rotation amount. |\n| **Preconditions** | `x` must be a valid `__m256i` AVX2 vector. |\n| **Postconditions** | The returned `__m256i` has each 32-bit lane rotated right by 12 bits. |\n| **Z Notation (informal)** | $\\text{vrot12}(x) = x \\ggg 12$ |\n| **Doc comment** | Rotates each 32-bit lane right by 12 bits using AVX2 shift/OR operations. |\n\n### `vrot8`\n| Aspect | Description |\n| :--- | :--- |\n| **Reasoning** | Implements an 8-bit right rotation for each 32-bit lane using a byte-shuffle mask, providing a high-performance alternative to shift/OR for this rotation. |\n| **Preconditions** | `x` must be a valid `__m256i` AVX2 vector. |\n| **Postconditions** | The returned `__m256i` has each 32-bit lane rotated right by 8 bits. |\n| **Z Notation (informal)** | $\\text{vrot8}(x) = x \\ggg 8$ |\n| **Doc comment** | Rotates each 32-bit lane right by 8 bits using a byte-shuffle mask for optimized AVX2 performance. |\n\n### `vrot7`\n| Aspect | Description |\n| :--- | :--- |\n| **Reasoning** | Implements a 7-bit right rotation for each 32-bit lane using standard SIMD shift and OR operations. |\n| **Preconditions** | `x` must be a valid `__m256i` AVX2 vector. |\n| **Postconditions** | The returned `__m256i` has each 32-bit lane rotated right by 7 bits. |\n| **Z Notation (informal)** | $\\text{vrot7}(x) = x \\ggg 7$ |\n| **Doc comment** | Rotates each 32-bit lane right by 7 bits using AVX2 shift/OR operations. |\n\n### `g`\n| Aspect | Description |\n| :--- | :--- |\n| **Reasoning** | Implements the BLAKE3 `G` mixing function, which operates simultaneously across 8 interleaved AVX2 lanes. This is the core cryptographic transformation step. |\n| **Preconditions** | `v` must be a mutable array of 16 `__m256i` vectors. `a, b, c, d` must be valid indices (0-15). `mx` and `my` must be valid AVX2 constants. |\n| **Postconditions** | The state vector `v` is updated according to the BLAKE3 G function rules using SIMD arithmetic and rotations. |\n| **Z Notation (informal)** | $v' = G(v, a, b, c, d, m_x, m_y)$ |\n| **Doc comment** | Executes one BLAKE3 `G` mixing function step over 8 interleaved AVX2 lanes simultaneously, updating the state vector `v`. |\n\n### `round`\n| Aspect | Description |\n| :--- | :--- |\n| **Reasoning** | Defines a full BLAKE3 round by calling the `g` function eight times (four column and four diagonal calls), following the standard BLAKE3 schedule. |\n| **Preconditions** | `v` must be a mutable state vector (`[__m256i; 16]`). `m` and `s` must be valid message and schedule arrays (`[__m256i; 16]` and `[usize; 16]`). |\n| **Postconditions** | The state vector `v` is updated by one complete BLAKE3 round. |\n| **Z Notation (informal)** | $v' = \\text{Round}(v, m, s)$ |\n| **Doc comment** | Applies one full BLAKE3 round consisting of 8 calls to the `g` mixing function, using the provided message and schedule. |\n\n### `compress_8way`\n| Aspect | Description |\n| :--- | :--- |\n| **Reasoning** | Performs a single BLAKE3 compression step over 8 independent chains in parallel using AVX2. This is the primary high-performance hashing primitive for the extension. |\n| **Preconditions** | `cv` (initial vectors) must be valid (`[__m256i; 8]`). `msg` (message block) must be valid (`[__m256i; 16]`). `block_len` must be a valid length. AVX2 must be enabled. |\n| **Postconditions** | Returns an array of 8 resulting hash vectors (`[__m256i; 8]`), representing the output of the compression for each lane. |\n| **Z Notation (informal)** | $\\text{Compress}_8(cv, msg, L) \\rightarrow \\text{Output}^8$ |\n| **Doc comment** | Performs one BLAKE3 compression over 8 independent chains in parallel using AVX2 SIMD instructions. |\n\n### `extract_hash`\n| Aspect | Description |\n| :--- | :--- |\n| **Reasoning** | Converts the SIMD vector output (`__m256i`) from a specific lane into a standard 32-byte byte array, suitable for final hash representation. |\n| **Preconditions** | `out` must be a valid result array (`&[__m256i; 8]`). `lane` must be a valid index (0-7). |\n| **Postconditions** | Returns a 32-byte array (`[u8; 32]`) containing the hash output for the specified lane. |\n| **Z Notation (informal)** | $\\text{ExtractHash}(out, l) \\rightarrow \\text{Byte}^{32}$ |\n| **Doc comment** | Extracts the 32-byte hash from a specific lane index (0-7) of the SIMD output array. |\n\n### `create_extensions_8way_avx2`\n| Aspect | Description |\n| :--- | :--- |\n| **Reasoning** | Implements the BLAKE3 extension function for 8 nonces in parallel using AVX2. This is the core mining function, designed to verify that the SIMD implementation matches the canonical scalar reference. |\n| **Preconditions** | AVX2 must be available on the host CPU. `midstate` must be a valid 32-byte hash. `nonces` must be an array of 8 `u64` nonces. |\n| **Postconditions** | Returns an array of 8 tuples, where each tuple contains the original nonce and its corresponding 32-byte hash output. Each hash must match the scalar reference. |\n| **Z Notation (informal)** | $\\text{CreateExt}_8(M, N) \\rightarrow \\{(N_i, \\text{Scalar}(M, N_i))\\}_{i=0}^7$ |\n| **Doc comment** | Mines 8 independent nonces in parallel using AVX2 SIMD. Verifies that each lane's hash matches the canonical scalar reference. |\n\n### `iterate_seeds_8way_avx2`\n| Aspect | Description |\n| :--- | :--- |\n| **Reasoning** | Runs the BLAKE3 extension hash chain (`EXTENSION_ITERATIONS`) simultaneously for 8 different initial seeds. This is used specifically for verifying block headers where multiple lanes derive from independent midstates. |\n| **Preconditions** | AVX2 must be available on the host CPU. `seeds` must be an array of 8 32-byte seed hashes. |\n| **Postconditions** | Returns an array of 8 32-byte hashes, where each hash is the final output of the iterated hash chain starting from the corresponding seed. |\n| **Z Notation (informal)** | $\\text{IterateSeeds}_8(S) \\rightarrow \\{\\text{Hash}(S_i)\\}_{i=0}^7$ |\n| **Doc comment** | Runs the BLAKE3 extension hash chain (`EXTENSION_ITERATIONS`) on 8 independent seeds in parallel using AVX2. Used for header verification. |"}, {"path": "core/snapshot.rs", "module": "core", "doc": "## `Snapshot` Struct\n\n**Reasoning**: Represents a complete, verified state of the blockchain at a specific checkpoint height. It allows nodes to bootstrap without replaying all history, relying only on the cryptographic integrity of the checkpoint and the subsequent headers.\n**Preconditions**: None (It is a data structure).\n**Postconditions**: None (It is a data structure).\n**Z Notation (informal)**: $\\text{Snapshot} \\triangleq \\text{Checkpoint} \\times \\text{Headers} \\times \\text{StateRootParts} \\times \\dots$\n**Doc comment**: `/// A complete, verified state snapshot tied to a specific Checkpoint.`\n\n## `mmr_peak_values` Function\n\n**Reasoning**: Extracts the specific hash values (peaks) from a `MerkleMountainRange` structure at predefined positions required for checkpoint serialization.\n**Preconditions**: The input `mmr` must be a valid `MerkleMountainRange`. The number of leaves derived from `mmr.leaf_count()` must be positive.\n**Postconditions**: Returns a `Vec<[u8; 32]>` containing the hash values at all required peak positions, or an error if any peak is missing.\n**Z Notation (informal)**: $\\text{mmr\\_peak\\_values}(\\text{mmr}) \\rightarrow \\text{Peaks} \\mid \\text{Error}$\n**Doc comment**: `/// Extracts the hash values (peaks) from a MerkleMountainRange based on its leaf count.`\n\n## `mmr_from_peaks` Function\n\n**Reasoning**: Reconstructs a `MerkleMountainRange` given the required number of leaves and the specific peak hash values, suitable for deserializing state components from a snapshot.\n**Preconditions**: The length of `values` must exactly match the number of peaks required for `leaves`. `leaves` must be positive.\n**Postconditions**: Returns a valid `MerkleMountainRange` constructed from the provided peaks, or an error if the input lengths mismatch.\n**Z Notation (informal)**: $\\text{mmr\\_from\\_peaks}(\\text{leaves}, \\text{values}) \\rightarrow \\text{MMR} \\mid \\text{Error}$\n**Doc comment**: `/// Reconstructs a MerkleMountainRange from its required peak hash values.`\n\n## `Snapshot::verify` Method\n\n**Reasoning**: The core verification logic. It cryptographically validates the entire snapshot against the trusted checkpoint, ensuring consistency across headers, UTXOs, kernels, range proofs, and state roots before constructing the final operational `State`.\n**Preconditions**: 1. `self` must be a valid `Snapshot`. 2. `trusted_id` must match `self.checkpoint.id()`. 3. All internal components (headers, UTXOs, kernels, groups) must be internally consistent and cryptographically sound.\n**Postconditions**: Returns a fully constructed and verified `State` object representing the chain tip, or an `anyhow::Error` if any cryptographic check, structural integrity check, or consistency rule fails.\n**Z Notation (informal)**: $\\text{verify}(\\text{S}, \\text{ID}) \\rightarrow \\text{State} \\mid \\text{Error} \\quad \\text{where } \\text{S.checkpoint.id()} = \\text{ID}$\n**Doc comment**: `/// Verifies the snapshot against a trusted checkpoint ID and returns the resulting operational State.`\n\n## `empty_excess` Function\n\n**Reasoning**: Provides a canonical, zero-value representation for kernel excess sums, typically used in testing or initialization where no excess has been accumulated.\n**Preconditions**: The `IDENTITY` point must be successfully decompressible.\n**Postconditions**: Returns the `IDENTITY` point (`Point32`), representing zero excess.\n**Z Notation (informal)**: $\\text{empty\\_excess}() \\rightarrow \\text{IDENTITY}$\n**Doc comment**: `/// Returns the identity point, representing zero kernel excess sum.`"}, {"path": "core/state.rs", "module": "core", "doc": "## Function Documentation\n\n### `calculate_target(height: u64, timestamp: u64) -> [u8; 32]`\n\n1. **Reasoning**: Calculates the required Proof-of-Work target for a given block height and timestamp, adhering to the ASERT difficulty schedule (BCH aserti3-2d).\n2. **Preconditions**: `height` must be non-negative. `timestamp` must be non-negative.\n3. **Postconditions**: Returns a 32-byte byte array representing the target, clamped between the maximum ceiling (`0xff...`) and a minimum value (1).\n4. **Z Notation (informal)**: $\\text{Target} = \\text{ASERT\\_Schedule}(\\text{height}, \\text{timestamp})$\n5. **Doc comment**: Calculates the ASERT difficulty target for a specific block height and timestamp, accounting for chain schedule shifts.\n\n### `asert_target(...) -> [u8; 32]`\n\n1. **Reasoning**: Implements the core mathematical logic of the ASERT difficulty calculation, handling drift, half-life shifts, and clamping. This is the detailed implementation used by `calculate_target`.\n2. **Preconditions**: `height` must be non-negative. `genesis_target` must be a valid 32-byte target.\n3. **Postconditions**: Returns the calculated 32-byte ASERT target, correctly clamped and shifted based on the input parameters.\n4. **Z Notation (informal)**: $\\text{Target} = \\text{ASERT\\_Calc}(\\text{GTarget}, \\text{GTime}, H, T, S)$\n5. **Doc comment**: Computes the ASERT target value based on genesis parameters, height, timestamp, and schedule shift.\n\n### `adjust_difficulty(state: &State) -> [u8; 32]`\n\n1. **Reasoning**: Provides a simple interface to calculate the next block's target based solely on the current state's height and timestamp, simplifying caller logic.\n2. **Preconditions**: `state` must be a valid, non-mutated reference to the current chain state.\n3. **Postconditions**: Returns the 32-byte target corresponding to `state.height` and `state.timestamp`.\n4. **Z Notation (informal)**: $\\text{Target} = \\text{calculate\\_target}(\\text{State}.\\text{height}, \\text{State}.\\text{timestamp})$\n5. **Doc comment**: Calculates the next block's difficulty target using the current state's height and timestamp.\n\n### `current_timestamp() -> u64`\n\n1. **Reasoning**: Provides a reliable, system-clock based timestamp for validation purposes.\n2. **Preconditions**: The system clock must be operational and able to calculate duration since UNIX epoch.\n3. **Postconditions**: Returns the current time in seconds since the UNIX epoch (or 0 if calculation fails).\n4. **Z Notation (informal)**: $\\text{Time} = \\text{SystemTime}.\\text{now}()$\n5. **Doc comment**: Retrieves the current system time in seconds since the UNIX epoch.\n\n### `TimestampError` (Enum)\n\n1. **Reasoning**: Provides typed, specific error reporting for timestamp validation failures, allowing callers to distinguish between clock-relative errors (`TooFarInFuture`) and chain-intrinsic errors (`NotAfterMedian`).\n2. **Preconditions**: None (used as an error type).\n3. **Postconditions**: Represents a precise failure mode during timestamp validation.\n4. **Z Notation (informal)**: $\\text{Error} \\in \\{\\text{TooFarInFuture}(T, N), \\text{NotAfterMedian}(T, F)\\}$\n5. **Doc comment**: Typed error indicating why a block's timestamp was refused, distinguishing between clock-relative and chain-intrinsic failures.\n\n### `is_future_timestamp(e: &anyhow::Error) -> bool`\n\n1. **Reasoning**: Utility function to check if an `anyhow::Error` chain contains a `TimestampError::TooFarInFuture`, specifically identifying clock-relative refusals that honest peers might relay later.\n2. **Preconditions**: `e` must be a reference to an `anyhow::Error`.\n3. **Postconditions**: Returns `true` if the error chain includes `TooFarInFuture`, otherwise `false`.\n4. **Z Notation (informal)**: $\\text{IsFuture}(E) \\iff E.\\text{chain}() \\ni \\text{TimestampError}.\\text{TooFarInFuture}$\n5. **Doc comment**: Checks if an error was caused solely by the block's timestamp being ahead of the validating node's clock.\n\n### `validate_timestamp(new_timestamp: u64, previous_timestamps: &[u64], current_time: u64) -> Result<()>`\n\n1. **Reasoning**: Enforces the two core timestamp rules: maximum future time (relative to local clock) and minimum time (above the median of recent blocks).\n2. **Preconditions**: `new_timestamp` must be non-negative. `previous_timestamps` must contain historical block timestamps. `current_time` must be the validating node's current time.\n3. **Postconditions**: Returns `Ok(())` if both rules are satisfied; otherwise, returns a specific `TimestampError`.\n4. **Z Notation (informal)**: $\\text{Valid}(T, P, N) \\iff (T \\le N + \\text{MaxFuture}) \\land (T > \\text{Median}(P))$\n5. **Doc comment**: Validates a new block's timestamp against both the maximum future limit and the median time floor of recent blocks.\n\n### `median_time_floor(previous_timestamps: &[u64]) -> Option<u64>`\n\n1. **Reasoning**: Calculates the required minimum timestamp based on the median of the last $N$ block timestamps, ensuring blocks progress chronologically relative to the chain history.\n2. **Preconditions**: `previous_timestamps` must be a slice of historical timestamps.\n3. **Postconditions**: Returns `Some(median)` if enough data exists (>= `MEDIAN_TIME_PAST_WINDOW`), or `Some(last_timestamp)` if not, or `None` if the input is empty.\n4. **Z Notation (informal)**: $\\text{Floor}(P) = \\begin{cases} \\text{Median}(P_{\\text{recent}}) & |P| \\ge N \\\\ P.\\text{last}() & |P| < N \\\\ \\text{None} & |P| = 0 \\end{cases}$\n5. **Doc comment**: Determines the minimum required timestamp by calculating the median of the last $N$ block timestamps, or using the last available timestamp if insufficient data exists.\n\n### `min_next_timestamp(previous_timestamps: &[u64]) -> u64`\n\n1. **Reasoning**: Calculates the absolute smallest valid timestamp for the next block, ensuring it strictly exceeds the median time floor.\n2. **Preconditions**: `previous_timestamps` must be a slice of historical timestamps.\n3. **Postconditions**: Returns $\\text{Floor}(P) + 1$, or 0 if no floor could be determined.\n4. **Z Notation (informal)**: $\\text{MinNext}(P) = \\text{Floor}(P) + 1$\n5. **Doc comment**: Returns the smallest timestamp a new block may use, strictly greater than the median time floor.\n\n### `calculate_work(target: &[u8; 32]) -> u128`\n\n1. **Reasoning**: Converts the cryptographic target (a difficulty measure) into a quantifiable work value ($W = \\lfloor \\text{Max} / T \\rfloor$), used for chain selection and depth tracking.\n2. **Preconditions**: `target` must be a 32-byte byte array representing a valid target.\n3. **Postconditions**: Returns the calculated work as a `u128`, saturating at `u128::MAX` if the target is too low (too easy). Returns 0 if the target is zero.\n4. **Z Notation (informal)**: $W = \\min(\\text{u128::MAX}, \\lfloor \\text{U256::MAX} / \\text{Target} \\rfloor)$\n5. **Doc comment**: Converts a difficulty target into a quantifiable work value, saturating at `u128::MAX`.\n\n### `apply_batch(state: &mut State, batch: &Batch, previous_timestamps: &[u64]) -> Result<()>`\n\n1. **Reasoning**: The primary entry point for full block validation and state transition. It performs all checks (linkage, timestamp, PoW, contents) and updates the state *in place* upon success.\n2. **Preconditions**: `state` must be a mutable reference to the current chain state. `batch` must be a valid block header/body. `previous_timestamps` must be the history of timestamps leading up to `state`.\n3. **Postconditions**: If successful, `state` is updated to reflect the new height, target, state root, and all UTXO/kernel transitions. If validation fails, `state` remains unchanged.\n4. **Z Notation (informal)**: $\\text{State}' = \\text{Apply}(\\text{State}, \\text{Batch}) \\implies \\text{State}'.\\text{Root} = \\text{Batch}.\\text{StateRoot}$\n5. **Doc comment**: Performs full validation (including Proof of Work) and applies the block to the state, updating height, target, and state root upon success.\n\n### `apply_batch_skip_pow(...) -> Result<()>`\n\n1. **Reasoning**: Allows applying a block without re-verifying the Proof of Work, typically used when the PoW has already been verified by an external header verifier (e.g., during header-first sync).\n2. **Preconditions**: `state` must be mutable. `verified_mining_hash` must exactly match the hash computed from the block header.\n3. **Postconditions**: If successful, `state` is updated, but PoW verification is skipped. State transitions are otherwise identical to `apply_batch`.\n4. **Z Notation (informal)**: $\\text{State}' = \\text{Apply}(\\text{State}, \\text{Batch}) \\land \\neg \\text{VerifyPoW}$\n5. **Doc comment**: Applies a block, skipping the Proof of Work verification, provided the mining hash matches the pre-verified hash.\n\n### `apply_batch_trusted(...) -> Result<()>`\n\n1. **Reasoning**: Allows applying a block with minimal checks (skipping PoW, range proofs, and signatures), used only for replaying blocks already known to be valid and stored locally.\n2. **Preconditions**: `state` must be mutable. The block must have been previously validated and stored by this node.\n3. **Postconditions**: If successful, `state` is updated, but PoW and cryptographic proofs are skipped. Balance equations and stateful rules remain enforced.\n4. **Z Notation (informal)**: $\\text{State}' = \\text{Apply}(\\text{State}, \\text{Batch}) \\land \\neg (\\text{VerifyPoW} \\lor \\text{VerifyCrypto})$\n5. **Doc comment**: Applies a block with minimal validation (skipping PoW, range proofs, and signatures), suitable only for replaying locally validated blocks.\n\n### `relay_start(state: &State, batch: &Batch) -> Option<u64>`\n\n1. **Reasoning**: Determines the midstate height of the first midstate header relayed by the block, relative to the parent state. This is crucial for correctly verifying the Proof of Work of relayed headers.\n2. **Preconditions**: `batch` must contain relay information (`batch.relay`). `state` must be the parent state.\n3. **Postconditions**: Returns `Some(H+1)` where $H$ is the height of the entry in `state` that the block builds upon, or `None` if no relay information exists.\n4. **Z Notation (informal)**: $\\text{RelayStart} = \\text{State}.\\text{EntryHeight} + 1$\n5. **Doc comment**: Determines the midstate height of the first relayed header in the block, relative to the parent state's entry.\n\n### `validate_block_contents(...) -> Result<()>`\n\n1. **Reasoning**: Enforces stateless rules on the block's contents (structure, weight, coinbase validity, uniqueness checks) before the state transition occurs.\n2. **Preconditions**: `batch` must be a valid block structure. `skip_crypto` determines if cryptographic proofs are checked. `subsidy` is the calculated reward for the coinbase.\n3. **Postconditions**: Returns `Ok(())` if all structural and content rules are met; otherwise, returns an error detailing the violation (e.g., weight overflow, duplicate commitments).\n4. **Z Notation (informal)**: $\\text{ContentValid}(\\text{Batch}) \\iff \\text{StructureOK} \\land \\text{WeightOK} \\land \\text{UniquenessOK} \\land (\\text{CoinbaseValid} \\lor \\text{Genesis})$\n5. **Doc comment**: Validates the structural and content rules of a block (weight, coinbase validity, uniqueness, structure) before state transition.\n\n### `apply_body(state: &State, body: &Transaction, coinbase: Option<&Coinbase>, subsidy: u64) -> Result<State>`\n\n1. **Reasoning**: Executes the stateful transitions: spending UTXOs, creating new UTXOs, updating kernel sets, tracking supply, and managing kernel offsets. It returns a *new* state copy, ensuring atomicity.\n2. **Preconditions**: `state` must be the current valid state. `body` must be structurally valid. `subsidy` must match the calculated reward.\n3. **Postconditions**: Returns a new `State` object (`next`) where all UTXO and kernel transitions have been applied, but chain linkage fields (height, target, etc.) are not yet updated. The original `state` is untouched.\n4. **Z Notation (informal)**: $\\text{State}_{\\text{new}} = \\text{UTXO\\_Transition}(\\text{State}, \\text{Body}) \\land \\text{Kernel\\_Update}(\\text{State}, \\text{Body})$\n5. **Doc comment**: Applies the transaction body and coinbase to the state, performing UTXO spending/creation and kernel set updates. Returns a new, transitional state copy.\n\n### `apply_batch_internal(...) -> Result<()>`\n\n1. **Reasoning**: The core, atomic transition logic. It executes checks in a strict order (linkage $\\to$ structure $\\to$ timestamp $\\to$ PoW $\\to$ bonds $\\to$ contents $\\to$ state transition) and commits the state only if all steps succeed.\n2. **Preconditions**: `state` must be mutable. All preceding checks (e.g., linkage, timestamp) must pass.\n3. **Postconditions**: If successful, `state` is fully updated to the next height/target/root. If any check fails, `state` remains in its original, pre-call condition.\n4. **Z Notation (informal)**: $\\text{State}_{\\text{final}} = \\text{Commit}(\\text{State}_{\\text{initial}}, \\text{Batch}) \\implies \\text{State}_{\\text{final}}.\\text{Root} = \\text{Batch}.\\text{StateRoot}$\n5. **Doc comment**: Executes the full, atomic state transition sequence: linkage checks, timestamp validation, PoW verification, bond management, content validation, and final state update.\n\n### `choose_best_state<'a>(a: &'a State, b: &'a State) -> &'a State`\n\n1. **Reasoning**: Implements the chain selection rule: prefer the chain with the most cumulative work (`weight`), and break ties by preferring the lower midstate (lexicographically).\n2. **Preconditions**: `a` and `b` must be immutable references to two valid `State` objects.\n3. **Postconditions**: Returns a reference to the state that satisfies the chain selection criteria (highest weight, then lowest midstate).\n4. **Z Notation (informal)**: $\\text{Best}(A, B) \\iff (A.\\text{Weight} > B.\\text{Weight}) \\lor (A.\\text{Weight} = B.\\text{Weight} \\land A.\\text{MidState} < B.\\text{MidState})$\n5. **Doc comment**: Selects the best chain state based on cumulative work (weight), breaking ties by preferring the lower midstate.\n\n### `apply_registrations(next: &mut State, registered: &[([u8; 32], super::bond::BondEntry)]) -> Result<()>`\n\n1. **Reasoning**: Updates the state's bond set by adding newly verified bond registrations from a block.\n2. **Preconditions**: `next` must be mutable. `registered` must contain valid, unique bond entries.\n3. **Postconditions**: All entries in `registered` are added to `next.bonds`. Fails if any ID is already present.\n4. **Z Notation (informal)**: $\\text{State}.\\text{Bonds} \\leftarrow \\text{State}.\\text{Bonds} \\cup \\text{Registered}$\n5. **Doc comment**: Adds verified bond registrations from a block to the state's bond"}, {"path": "core/template.rs", "module": "core", "doc": "## `BlockTemplate` Methods\n\n### `seal(&self, extension: Extension) -> Batch`\n1. **Reasoning**: Finalizes the block body by attaching a solved extension (which contains the final hash derived from PoW).\n2. **Preconditions**: `self` must be a valid `BlockTemplate`. `extension` must be correctly formed for the block's height and mining hash.\n3. **Postconditions**: Returns a `Batch` where `batch.extension` is set to the provided `extension`, and all other fields (body, coinbase, etc.) remain unchanged from the template.\n4. **Z Notation (informal)**: $\\text{Batch}' = \\text{Batch} \\land \\text{Batch}'.\\text{extension} = \\text{Extension}$\n5. **Doc comment**: Attaches a solved extension to the block batch.\n\n### `seal_aux(&self, aux: crate::core::auxpow::AuxPow) -> Batch`\n1. **Reasoning**: Creates a preliminary block batch suitable for midstate blocks (auxiliary proof of work), where the final hash is derived from the auxiliary proof rather than a full PoW grind.\n2. **Preconditions**: `self` must be a valid `BlockTemplate`. `aux` must be a valid `AuxPow` proof corresponding to `self.mining_hash`.\n3. **Postconditions**: Returns a `Batch` where `batch.extension` is set with the auxiliary proof's derived `final_hash`, and `batch.aux_pow` is set to `Some(aux)`.\n4. **Z Notation (informal)**: $\\text{Batch}' = \\text{Batch} \\land \\text{Batch}'.\\text{extension}.\\text{final\\_hash} = \\text{aux}.\\text{block\\_id}(\\text{self}.\\text{mining\\_hash}) \\land \\text{Batch}'.\\text{aux\\_pow} = \\text{Some}(\\text{aux})$\n5. **Doc comment**: Attaches a merged-mining proof (AuxPow) to the block batch.\n\n### `mine_blocking(&self) -> Batch`\n1. **Reasoning**: Performs a single-threaded Proof-of-Work grind until a nonce is found that satisfies the target difficulty for the block's height.\n2. **Preconditions**: `self` must be a valid `BlockTemplate`. The block's `target` must be non-zero.\n3. **Postconditions**: Returns a `Batch` sealed with an `Extension` whose `final_hash` is less than or equal to the block's target, and the nonce used is recorded in the extension.\n4. **Z Notation (informal)**: $\\text{Batch}' = \\text{Seal}(\\text{Template}) \\land \\text{Batch}'.\\text{extension}.\\text{final\\_hash} \\le \\text{Template}.\\text{batch}.\\text{target}$\n5. **Doc comment**: Performs a single-threaded PoW grind to find a valid nonce and returns the sealed batch.\n\n## Global Functions\n\n### `rebind(template: &BlockTemplate, extra: [u8; 32], bond: Option<&MinerBond>) -> Result<BlockTemplate>`\n1. **Reasoning**: Creates a specific, miner-bound copy of a template by updating the coinbase's `extra` field and signing the block using the provided `MinerBond`. This ensures work is bound to a specific miner.\n2. **Preconditions**: `template` must be valid. If `template.batch.miner` is set, `bond` must be provided. The template must contain a coinbase output.\n3. **Postconditions**: Returns a new `BlockTemplate` with the updated coinbase `extra`, and if signed, `batch.miner` is set to `MinerAuth` containing the valid signature against the previous midstate.\n4. **Z Notation (informal)**: $\\text{Template}' = \\text{Template} \\land \\text{Template}'.\\text{coinbase}.\\text{extra} = \\text{extra} \\land (\\text{Template}'.\\text{miner} \\ne \\text{None} \\implies \\text{Signature}(\\text{Template}'.\\text{miner}) = \\text{bond}.\\text{sign}(\\text{Message}))$\n5. **Doc comment**: Creates a miner-bound copy of the template by updating the coinbase extra data and signing it with the provided bond.\n\n### `registration_not_ready(registration: &BondRegistration, relay: &Relay, e: anyhow::Error) -> anyhow::Error`\n1. **Reasoning**: Provides specific error feedback to a producer when its mining bond registration cannot be verified against the current chain state (relay). It distinguishes between stale proofs and unverified proofs.\n2. **Preconditions**: `registration` must be a valid `BondRegistration`. `relay` must represent the current chain state. `e` must be the verification error.\n3. **Postconditions**: Returns an `anyhow::Error` detailing whether the proof is stale (needs re-registration) or simply not yet verified by the relay (needs time/header propagation).\n4. **Z Notation (informal)**: $\\text{Error} = \\begin{cases} \\text{StaleProofError} & \\text{if } \\text{registration}.\\text{proof\\_is\\_stale}(\\text{relay}) \\\\ \\text{NotVerifiedError}(e) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Determines and reports why a mining bond's registration is not ready against the current relay state (stale vs. unverified).\n\n### `choose_relay(state: &State, feed: Option<&RelayFeed>, bond: Option<&MinerBond>, room: usize, timestamp: u64) -> Option<RelayHeaders>`\n1. **Reasoning**: Selects the optimal set of midstate headers to relay for the block, prioritizing external feeds and then using the producer's own bond headers, ensuring the chosen headers fit within the remaining block weight budget (`room`).\n2. **Preconditions**: `state` must be a valid chain state. `room` must be non-negative. `timestamp` must be within `RELAY_MAX_FUTURE`.\n3. **Postconditions**: Returns `Some(RelayHeaders)` containing the best set of headers that the current `state.relay` accepts and fits within the weight limit, or `None` if no suitable headers can be found.\n4. **Z Notation (informal)**: $\\text{RelayHeaders}' = \\text{Choose}(\\text{Feed} \\cup \\text{BondHeaders}) \\land \\text{State}.\\text{relay}.\\text{extend}(\\text{RelayHeaders}', \\text{timestamp}) = \\text{Ok}() \\land |\\text{RelayHeaders}'.\\text{headers}| \\le \\text{room}$\n5. **Doc comment**: Selects the optimal set of midstate headers to relay, prioritizing external feeds and respecting the block's remaining weight budget.\n\n### `transaction_budget(state: &State, payouts: usize, bond: Option<&MinerBond>, feed: Option<&RelayFeed>) -> u64`\n1. **Reasoning**: Calculates the maximum weight available for user transactions by subtracting fixed costs (coinbase outputs, kernel weight, registration requirements, and relay overhead) from the total block weight.\n2. **Preconditions**: `state` must be valid. `payouts` must be $\\ge 0$.\n3. **Postconditions**: Returns a `u64` representing the remaining weight budget for transactions, guaranteed to be non-negative (due to saturating subtraction).\n4. **Z Notation (informal)**: $\\text{Budget} = \\text{MAX\\_BLOCK\\_WEIGHT} - (\\text{Payouts} \\cdot \\text{OUTPUT\\_WEIGHT}) - \\text{KERNEL\\_WEIGHT} - \\text{RegistrationWeight} - \\text{RelayWeight}$\n5. **Doc comment**: Calculates the maximum weight available for user transactions after accounting for coinbase, registration, and relay overhead.\n\n### `select_transactions(candidates: &[Transaction], height: u64, weight_budget: u64) -> Vec<Transaction>`\n1. **Reasoning**: Implements a greedy selection algorithm to fill the block budget by prioritizing transactions with the highest fee per unit of weight, while ensuring validity (lock height, no conflicts).\n2. **Preconditions**: `candidates` must be a slice of valid `Transaction` objects. `weight_budget` must be $\\ge 0$.\n3. **Postconditions**: Returns a `Vec<Transaction>` containing the maximal set of non-conflicting, valid transactions that fit within `weight_budget`, sorted by fee/weight descending.\n4. **Z Notation (informal)**: $\\text{Chosen} = \\text{GreedySelect}(\\text{Candidates}, \\text{Budget}) \\land \\forall t \\in \\text{Chosen}: t.\\text{lock\\_height}() \\le \\text{height} \\land \\sum_{t \\in \\text{Chosen}} t.\\text{weight}() \\le \\text{Budget}$\n5. **Doc comment**: Greedily selects transactions by fee per weight until the block budget is exhausted, respecting validity and conflict rules.\n\n### `build_template(state: &State, previous_timestamps: &[u64], txs: &[Transaction], payout: &StealthAddress, timestamp: Option<u64>) -> Result<BlockTemplate>`\n1. **Reasoning**: A simplified wrapper for building a template without miner-specific data (no `extra` field), suitable for non-bonded or simple pool scenarios.\n2. **Preconditions**: All transactions in `txs` must be individually valid against the chain state. `payout` must be a valid `StealthAddress`.\n3. **Postconditions**: Returns a `Result<BlockTemplate>` containing the constructed template, or an error if internal validation fails (e.g., weight overflow, invalid payouts).\n4. **Z Notation (informal)**: $\\text{Template} = \\text{BuildTemplateWith}(\\text{State}, \\dots, \\text{extra}=[0u8; 32], \\text{timestamp})$\n5. **Doc comment**: Builds a block template based on the provided transactions and payout, using a zeroed miner extra field.\n\n### `split_by_weight<K: Copy>(total: u64, weights: &[(K, u64)]) -> Result<Vec<(K, u64)>>`\n1. **Reasoning**: Distributes a total amount (`total`) among payees based on their specified weights, using standard proportional division followed by remainder distribution (largest fractional entitlement first).\n2. **Preconditions**: The sum of all weights must be greater than zero. `total` and weights must fit within `u64`.\n3. **Postconditions**: Returns a `Result<Vec<(K, u64)>>` where the sum of the resulting amounts equals `total`, and only payees with a non-zero share are included.\n4. **Z Notation (informal)**: $\\sum_{(k, v) \\in \\text{Output}} v = \\text{Total} \\land \\forall (k, w) \\in \\text{Weights}: v \\le \\lfloor \\text{Total} \\cdot w / \\sum w \\rfloor + 1$\n5. **Doc comment**: Splits a total amount proportionally across weighted payees, distributing remainders to the largest fractional entitlements.\n\n### `build_template_with(state: &State, previous_timestamps: &[u64], txs: &[Transaction], payouts: &[(StealthAddress, u64)], extra: [u8; 32], timestamp: Option<u64>) -> Result<(BlockTemplate, Vec<(StealthAddress, PayoutReceipt)>)>`\n1. **Reasoning**: Wrapper function for building a template without explicit miner bonding/signing, delegating to `build_template_bonded` with `bond=None`.\n2. **Preconditions**: All transactions must be individually valid. `payouts` must contain between 1 and `MAX_GROUP_OUTPUTS` entries.\n3. **Postconditions**: Returns a tuple containing the constructed `BlockTemplate` and a list of `PayoutReceipt`s for each surviving payout.\n4. **Z Notation (informal)**: $\\text{Result} = \\text{BuildTemplateBonded}(\\dots, \\text{bond}=\\text{None})$\n5. **Doc comment**: Builds a block template with weighted payouts and miner data in the coinbase extra field, without requiring a specific mining bond.\n\n### `build_template_bonded(state: &State, previous_timestamps: &[u64], txs: &[Transaction], payouts: &[(StealthAddress, u64)], extra: [u8; 32], timestamp: Option<u64>, bond: Option<&MinerBond>) -> Result<(BlockTemplate, Vec<(StealthAddress, PayoutReceipt)>)>`\n1. **Reasoning**: Wrapper function for building a template that incorporates the specific `MinerBond`, delegating to `build_template_relayed` with `feed=None`.\n2. **Preconditions**: All transactions must be individually valid. `payouts` must be valid. If `bond` is provided, it must be configured correctly.\n3. **Postconditions**: Returns a tuple containing the constructed `BlockTemplate` and a list of `PayoutReceipt`s.\n4. **Z Notation (informal)**: $\\text{Result} = \\text{BuildTemplateRelayed}(\\dots, \\text{feed}=\\text{None})$\n5. **Doc comment**: Builds a block template incorporating a specific mining bond, but without relaying external midstate headers.\n\n### `build_template_relayed(state: &State, previous_timestamps: &[u64], txs: &[Transaction], payouts: &[(StealthAddress, u64)], extra: [u8; 32], timestamp: Option<u64>, bond: Option<&MinerBond>, feed: Option<&RelayFeed>) -> Result<(BlockTemplate, Vec<(StealthAddress, PayoutReceipt)>)>`\n1. **Reasoning**: The core logic function. Constructs a complete block template, handling transaction aggregation, coinbase calculation (including subsidy tapering), relay header selection, bond registration verification, signer determination, and final state transition (`apply_body`).\n2. **Preconditions**: `state.height` must be $> 0$. `payouts` must be valid (1 to `MAX_GROUP_OUTPUTS`). All transactions must be individually valid.\n3. **Postconditions**: Returns a tuple containing the fully constructed and validated `BlockTemplate` and the list of `PayoutReceipt`s, or an error if any internal constraint (e.g., weight limit, bond cap, registration failure) is violated.\n4. **Z Notation (informal)**: $\\text{Result} = \\text{Construct}(\\text{State}, \\text{Tx}, \\text{Payouts}) \\land \\text{Validate}(\\text{Batch}) \\land \\text{Subsidy} = \\text{TaperedSubsidy}$\n5. **Doc comment**: Constructs a complete, validated block template, handling coinbase calculation, bond registration, signer determination, and midstate header relay."}, {"path": "core/types.rs", "module": "core", "doc": "## Hashing Functions\n\n### `hash(data: &[u8]) -> [u8; 32]`\n1. **Reasoning**: Provides a standard, fixed-size BLAKE3 hash for arbitrary byte slices, serving as the fundamental cryptographic primitive for state commitment and block identification.\n2. **Preconditions**: `data` must be a valid slice of bytes.\n3. **Postconditions**: Returns a 32-byte array representing the BLAKE3 hash of `data`.\n4. **Z Notation (informal)**: $\\text{hash}(\\text{data}) = H_{BLAKE3}(\\text{data})$\n5. **Doc comment**: BLAKE3 hash of a byte slice.\n\n### `hash_concat(a: &[u8], b: &[u8]) -> [u8; 32]`\n1. **Reasoning**: Computes the BLAKE3 hash of two concatenated byte slices ($\\text{a} \\parallel \\text{b}$), essential for chaining hashes (e.g., in `mw_midstate` updates).\n2. **Preconditions**: `a` and `b` must be valid slices of bytes.\n3. **Postconditions**: Returns a 32-byte array representing the BLAKE3 hash of $\\text{a} \\parallel \\text{b}$.\n4. **Z Notation (informal)**: $\\text{hash\\_concat}(\\text{a}, \\text{b}) = H_{BLAKE3}(\\text{a} \\parallel \\text{b})$\n5. **Doc comment**: BLAKE3 hash of two concatenated byte slices ($\\text{a} \\parallel \\text{b}$).\n\n### `hash_domain(domain: &[u8], parts: &[&[u8]]) -> [u8; 32]`\n1. **Reasoning**: Ensures cryptographic collision resistance across different usage contexts (e.g., UTXO leaves vs. state roots) by prefixing data with a domain label and length-prefixing all input parts.\n2. **Preconditions**: `domain` and `parts` must be valid slices of bytes.\n3. **Postconditions**: Returns a 32-byte array representing the domain-specific BLAKE3 hash.\n4. **Z Notation (informal)**: $\\text{hash\\_domain}(\\text{D}, \\text{P}) = H_{BLAKE3}(\\text{len}(\\text{D}) \\parallel \\text{D} \\parallel \\forall p \\in \\text{P}: (\\text{len}(p) \\parallel p))$\n5. **Doc comment**: BLAKE3 hash over a domain label and length-prefixed parts, preventing cross-purpose collisions.\n\n### `count_leading_zeros(hash: &[u8; 32]) -> u32`\n1. **Reasoning**: Calculates the number of leading zero bits in a hash, used for determining proof-of-work difficulty compliance.\n2. **Preconditions**: `hash` must be a 32-byte array.\n3. **Postconditions**: Returns the count of leading zero bits (0 to 256).\n4. **Z Notation (informal)**: $\\text{count\\_leading\\_zeros}(\\text{H}) = \\min \\{i \\mid \\text{bit}_i(\\text{H}) = 1\\}$\n5. **Doc comment**: Counts the number of leading zero bits in a 32-byte hash.\n\n## Network Identity and Launch Parameters\n\n### `network_anchor() -> [u8; 32]`\n1. **Reasoning**: Provides a stable, unique network identity by hashing the Bitcoin anchor block hash combined with the network magic constant, ensuring this deployment is distinct from the base midstate chain.\n2. **Preconditions**: None (relies on global constants).\n3. **Postconditions**: Returns a 32-byte array representing the network's stable anchor hash.\n4. **Z Notation (informal)**: $\\text{network\\_anchor} = \\text{hash\\_domain}(\\text{\"midwimble.network-anchor.v1\"}, [\\text{BITCOIN\\_BLOCK\\_HASH}, \\text{NETWORK\\_MAGIC}])$\n5. **Doc comment**: Stable 32-byte network identity derived from the Bitcoin anchor and network magic.\n\n## Proof of Work Algorithms\n\n### `PowAlgo::name(self) -> &'static str`\n1. **Reasoning**: Provides a human-readable string representation of the proof-of-work algorithm, matching midstate's template naming conventions.\n2. **Preconditions**: `self` must be a `PowAlgo` variant.\n3. **Postconditions**: Returns the canonical name (\"blake3-chain\" or \"walk\").\n4. **Z Notation (informal)**: $\\text{name}(\\text{P}) = \\begin{cases} \\text{\"blake3-chain\"} & \\text{if } P = \\text{Blake3Chain} \\\\ \\text{\"walk\"} & \\text{if } P = \\text{Walk} \\end{cases}$\n5. **Doc comment**: Returns the canonical name of the proof-of-work algorithm.\n\n### `PowAlgo::from_name(name: &str) -> Option<Self>`\n1. **Reasoning**: Allows parsing the algorithm from a string provided by external sources (e.g., midstate templates).\n2. **Preconditions**: `name` must be a valid string matching one of the defined algorithm names.\n3. **Postconditions**: Returns `Some(PowAlgo)` if the name is recognized, otherwise `None`.\n4. **Z Notation (informal)**: $\\text{from\\_name}(\\text{N}) = \\begin{cases} \\text{Some}(P) & \\text{if } N = \\text{name}(P) \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Parses a string name into the corresponding `PowAlgo`.\n\n### `PowAlgo::of_midstate_template(template: &serde_json::Value) -> anyhow::Result<Self>`\n1. **Reasoning**: Interprets the proof-of-work requirement specified in a midstate template, handling cases where no explicit `pow` field is present (defaulting to BLAKE3Chain).\n2. **Preconditions**: `template` must be a valid JSON structure containing an optional `\"pow\"` string field.\n3. **Postconditions**: Returns `Ok(PowAlgo)` matching the template, or an error if the name is unknown.\n4. **Z Notation (informal)**: $\\text{of\\_midstate\\_template}(\\text{T}) = \\begin{cases} \\text{Blake3Chain} & \\text{if } \\text{\"pow\"} \\notin \\text{T} \\\\ \\text{from\\_name}(\\text{T[\"pow\"]}) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Determines the required PoW algorithm from a midstate template JSON value.\n\n### `pow_algo_at(height: u64) -> PowAlgo`\n1. **Reasoning**: Determines which proof-of-work algorithm is active at a given block height, based on the fixed `WALK_ACTIVATION_HEIGHT`.\n2. **Preconditions**: `height` must be a non-negative integer.\n3. **Postconditions**: Returns `PowAlgo::Blake3Chain` if $height < \\text{WALK\\_ACTIVATION\\_HEIGHT}$, and `PowAlgo::Walk` otherwise.\n4. **Z Notation (informal)**: $\\text{pow\\_algo\\_at}(\\text{h}) = \\begin{cases} \\text{Blake3Chain} & \\text{if } h < \\text{WALK\\_ACTIVATION\\_HEIGHT} \\\\ \\text{Walk} & \\text{if } h \\ge \\text{WALK\\_ACTIVATION\\_HEIGHT} \\end{cases}$\n5. **Doc comment**: Returns the PoW algorithm active at a specific block height.\n\n### `midstate_pow_algo_at(midstate_height: u64) -> PowAlgo`\n1. **Reasoning**: Determines which proof-of-work algorithm is active according to midstate's rules, based on `MIDSTATE_WALK_ACTIVATION_HEIGHT`.\n2. **Preconditions**: `midstate_height` must be a non-negative integer.\n3. **Postconditions**: Returns `PowAlgo::Blake3Chain` if $midstate\\_height < \\text{MIDSTATE\\_WALK\\_ACTIVATION\\_HEIGHT}$, and `PowAlgo::Walk` otherwise.\n4. **Z Notation (informal)**: $\\text{midstate\\_pow\\_algo\\_at}(\\text{h}) = \\begin{cases} \\text{Blake3Chain} & \\text{if } h < \\text{MIDSTATE\\_WALK\\_ACTIVATION\\_HEIGHT} \\\\ \\text{Walk} & \\text{if } h \\ge \\text{MIDSTATE\\_WALK\\_ACTIVATION\\_HEIGHT} \\end{cases}$\n5. **Doc comment**: Determines the PoW algorithm active according to midstate's height rules.\n\n## Economics and Supply\n\n### `Emission::scheduled_before(self, height: u64) -> u128`\n1. **Reasoning**: Calculates the cumulative coin supply issued up to (but not including) the block at `height`, correctly modeling the linear slow start, subsequent halvings, and the hard cap.\n2. **Preconditions**: `height` must be a non-negative integer; `self` must be a valid `Emission` struct.\n3. **Postconditions**: Returns the total cumulative supply issued as a `u128`.\n4. **Z Notation (informal)**: $\\text{scheduled\\_before}(\\text{E}, \\text{h}) = \\sum_{i=0}^{h-1} \\text{block\\_reward}(\\text{E}, i)$\n5. **Doc comment**: Calculates the total cumulative coin supply issued before the block at `height`.\n\n### `Emission::issued_before(self, height: u64) -> u64`\n1. **Reasoning**: Provides the final, capped coin supply issued before a given height, ensuring it never exceeds `MAX_SUPPLY`.\n2. **Preconditions**: `height` must be a non-negative integer; `self` must be a valid `Emission` struct.\n3. **Postconditions**: Returns the total cumulative supply issued as a `u64`, capped at `MAX_SUPPLY`.\n4. **Z Notation (informal)**: $\\text{issued\\_before}(\\text{E}, \\text{h}) = \\min(\\text{scheduled\\_before}(\\text{E}, \\text{h}), \\text{MAX\\_SUPPLY})$\n5. **Doc comment**: Returns the total coin supply issued before the block at `height`, capped by `MAX_SUPPLY`.\n\n### `Emission::block_reward(self, height: u64) -> u64`\n1. **Reasoning**: Calculates the specific reward minted by the block at `height` by taking the difference between two cumulative supply totals.\n2. **Preconditions**: `height` must be a non-negative integer; `self` must be a valid `Emission` struct.\n3. **Postconditions**: Returns the reward for the block at `height`, or 0 if $height=0$.\n4. **Z Notation (informal)**: $\\text{block\\_reward}(\\text{E}, \\text{h}) = \\text{issued\\_before}(\\text{E}, \\text{h}+1) - \\text{issued\\_before}(\\text{E}, \\text{h})$\n5. **Doc comment**: Calculates the coin reward for the block at `height` according to the e
