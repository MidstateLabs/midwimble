ust be called first).\n2. `template` must be a valid `BlockTemplate`.\n**Postconditions**:\n1. The internal `job` counter is incremented.\n2. A new cancellation token (`Arc<AtomicBool>`) is created and stored in `self.cancel`.\n3. A dedicated OS thread is spawned, executing the mining logic.\n4. If mining succeeds, a `MinedBlock` is sent via `result_tx`.\n**Z Notation (informal)**:\n$$ \\text{start}(\\text{template}) \\rightarrow \\text{Miner}.\\text{job}' = \\text{Miner}.\\text{job} + 1 \\land \\exists \\text{Thread}: \\text{Thread.run}(\\text{mine\\_logic}) $$\n**Doc comment**:\n```rust\n/// Starts a new mining job using the provided block template on a dedicated OS thread.\npub fn start(&mut self, template: BlockTemplate) { /* ... */ }\n```\n\n## `Miner::stop` method\n\n**Reasoning**: Provides a mechanism to gracefully terminate a running mining thread by setting the cancellation flag (`AtomicBool`) associated with the current job.\n**Preconditions**: The miner must currently be running (i.e., `self.cancel` must be `Some`).\n**Postconditions**:\n1. If a cancellation token exists, its value is set to `true` using `Ordering::Relaxed`.\n2. The cancellation token is removed from `self.cancel` using `take()`, indicating the job has been stopped/completed.\n**Z Notation (informal)**:\n$$ \\text{stop}() \\rightarrow \\text{Miner}.\\text{cancel}' = \\text{None} \\land \\text{Miner}.\\text{cancel}.\\text{value} = \\text{True} $$\n**Doc comment**:\n```rust\n/// Signals the currently running mining thread to stop gracefully.\npub fn stop(&mut self) { /* ... */ }\n```\n\n## `Miner::is_running` method\n\n**Reasoning**: Allows external code to check the operational status of the miner by inspecting whether a cancellation token has been initialized for the current job.\n**Preconditions**: None.\n**Postconditions**: Returns `true` if `self.cancel` is `Some`, and `false` otherwise.\n**Z Notation (informal)**:\n$$ \\text{is\\_running}() \\rightarrow \\text{Miner}.\\text{cancel} \\neq \\text{None} $$\n**Doc comment**:\n```rust\n/// Checks if a mining job is currently active and running on a dedicated thread.\npub fn is_running(&self) -> bool { /* ... */ }\n```\n\n## `Miner::current_job` method\n\n**Reasoning**: Provides read access to the current job identifier, useful for tracking progress or identifying which job is active.\n**Preconditions**: None.\n**Postconditions**: Returns the value of `self.job`.\n**Z Notation (informal)**:\n$$ \\text{current\\_job}() \\rightarrow \\text{Miner}.\\text{job} $$\n**Doc comment**:\n```rust\n/// Returns the ID of the current mining job.\npub fn current_job(&self) -> u64 { /* ... */ }\n```\n\n## `Miner::drop` implementation\n\n**Reasoning**: Ensures resource cleanup. When the `Miner` object goes out of scope, it must signal any running thread to stop gracefully to prevent resource leaks or orphaned threads.\n**Preconditions**: The `Miner` instance is being dropped.\n**Postconditions**: `self.stop()` is called, ensuring the cancellation flag is set for any active job.\n**Z Notation (informal)**:\n$$ \\text{drop}(\\text{Miner}) \\rightarrow \\text{Miner}.\\text{stop}() $$\n**Doc comment**:\n```rust\n/// Ensures that any running mining thread is gracefully stopped when the Miner object is dropped.\nimpl Drop for Miner { /* ... */ }\n```"}, {"path": "node.rs", "module": "(root)", "doc": "## Node Configuration and Handle\n\n### `NodeConfig`\n**Reasoning**: Defines all operational parameters for the node (e.g., data directory, listening addresses, mining targets, sync timeouts). It allows external configuration without modifying core logic.\n**Preconditions**: Must provide a valid `data_dir` and `listen` address.\n**Postconditions**: A fully configured set of operational parameters ready for node initialization.\n**Z Notation (informal)**: $\\text{Config} \\triangleq \\{\\text{data\\_dir}: \\text{PathBuf}, \\text{listen}: \\text{Multiaddr}, \\dots\\}$\n**Doc comment**: Configuration structure holding all operational settings for the node, including networking, mining, and finality parameters.\n\n### `NodeConfig::new`\n**Reasoning**: Provides a sensible default configuration, ensuring the node is immediately runnable without requiring manual setup of every parameter.\n**Preconditions**: Valid `data_dir` and `listen` address.\n**Postconditions**: A `NodeConfig` instance populated with defaults, overriding user-provided values where necessary.\n**Z Notation (informal)**: $\\text{Config}_{\\text{default}} \\triangleq \\text{new}(\\text{data\\_dir}, \\text{listen})$\n**Doc comment**: Creates a new `NodeConfig` instance with sensible default values.\n\n### `PeerDetail`\n**Reasoning**: A simple structure to represent a connected peer in a format suitable for external display (e.g., an explorer's network map).\n**Preconditions**: Must be populated from the internal `Network` state.\n**Postconditions**: A cloneable, display-friendly representation of a single peer.\n**Z Notation (informal)**: $\\text{PeerDetail} \\triangleq \\{\\text{id}: \\text{String}, \\text{outbound}: \\text{bool}, \\text{addr}: \\text{String}\\}$\n**Doc comment**: Details of a connected peer, including its ID, connection direction (outbound/inbound), and address.\n\n### `DandelionInfo`\n**Reasoning**: Encapsulates the current state of Dandelion++ routing logic, allowing external monitoring without exposing internal network details.\n**Preconditions**: Must be calculated based on the node's current outbound peer count.\n**Postconditions**: A snapshot of the Dandelion++ state (fluff probability, pool size).\n**Z Notation (informal)**: $\\text{DandelionInfo} \\triangleq \\{\\text{outbound\\_peers}: \\mathbb{N}, \\text{fluff\\_percent}: \\mathbb{N}\\}$\n**Doc comment**: Current state of Dandelion++, including outbound peer count and calculated fluff probability.\n\n### `NodeInfo`\n**Reasoning**: A read-mostly, immutable view of the node's current operational state, designed for RPC and testing without requiring internal locks.\n**Preconditions**: Must be derived from the live `Node` state via a read lock.\n**Postconditions**: A complete snapshot of the node's status (state, peers, syncing status, mining activity).\n**Z Notation (informal)**: $\\text{NodeInfo} \\triangleq \\{\\text{state}: \\text{State}, \\text{peers}: \\text{Vec}<\\text{String}>, \\dots\\}$\n**Doc comment**: Read-only view of the node's current status, used for RPC and external monitoring.\n\n### `Command`\n**Reasoning**: Defines the set of asynchronous operations that can be sent to the main node loop, decoupling external calls from internal state management.\n**Preconditions**: Must include a `oneshot::Sender` for synchronous replies where required.\n**Postconditions**: The command is queued for processing by the main node loop.\n**Z Notation (informal)**: $\\text{Command} \\triangleq \\{\\text{SubmitTransaction}(\\dots), \\text{SubmitBlock}(\\dots), \\dots\\}$\n**Doc comment**: Enumeration of asynchronous commands that can be sent to the `NodeHandle` for execution.\n\n### `NodeHandle`\n**Reasoning**: Provides a safe, high-level interface for external components (RPC, clients) to interact with the complex internal state of the `Node`, abstracting away locking and command queuing.\n**Preconditions**: Must be initialized via `Node::new`.\n**Postconditions**: Access to read-only node information (`info()`) and methods to submit commands (`submit_transaction()`).\n**Z Notation (informal)**: $\\text{Handle} \\triangleq \\{\\text{info}: \\text{Arc}<\\text{RwLock}<\\text{NodeInfo}>>, \\text{commands}: \\text{mpsc::UnboundedSender}<\\text{Command}>, \\dots\\}$\n**Doc comment**: Safe handle providing read access to node state and asynchronous methods to submit commands.\n\n## Node Implementation\n\n### `Node::new`\n**Reasoning**: Initializes the entire node ecosystem: storage, identity, network, mempool, miner, and sets up internal communication channels. This is the entry point for starting the node.\n**Preconditions**: Valid `NodeConfig` containing necessary paths and addresses.\n**Postconditions**: A fully initialized `Node` instance and its corresponding `NodeHandle`, ready to enter the main event loop.\n**Z Notation (informal)**: $\\text{Node} \\triangleq \\text{new}(\\text{Config}) \\implies (\\text{Node}, \\text{Handle})$\n**Doc comment**: Initializes the node, loading state from disk, setting up networking, and preparing internal components.\n\n### `Node::run`\n**Reasoning**: The main asynchronous loop of the node. It handles network events, command processing, periodic maintenance (polling peers, checking timeouts), and reacts to mined blocks.\n**Preconditions**: The `Node` must be fully initialized via `Node::new`.\n**Postconditions**: The node runs indefinitely until a `Command::Shutdown` is received or an unrecoverable error occurs.\n**Z Notation (informal)**: $\\text{Run}(\\text{Node}) \\triangleq \\text{loop} (\\text{NetworkEvent} \\lor \\text{Command} \\lor \\text{MinedBlock} \\lor \\dots)$\n**Doc comment**: Starts the main asynchronous event loop, handling network events, commands, and periodic maintenance tasks.\n\n### `Node::submit_transaction`\n**Reasoning**: Allows external clients to submit a transaction. This operation is asynchronous; validation and routing (Dandelion++) happen internally.\n**Preconditions**: The provided `Transaction` must be well-formed. The node must not be stopped.\n**Postconditions**: Returns `Ok(())` if the transaction was successfully queued for validation; returns an error if the node is stopped or the command fails.\n**Z Notation (informal)**: $\\text{submit\\_tx}(\\text{tx}) \\triangleq \\text{Command::SubmitTransaction}(\\text{tx}, \\text{rx}) \\implies \\text{await}(\\text{rx})$\n**Doc comment**: Submits a transaction for validation and routing into Dandelion++. This is an asynchronous operation.\n\n### `Node::submit_block`\n**Reasoning**: Allows miners (or template RPCs) to submit a newly mined block for validation against the current chain tip.\n**Preconditions**: The `Batch` must be valid and not already known or currently being validated. The node must not be syncing.\n**Postconditions**: Returns `Ok(())` if the block is accepted and processed (or queued); returns an error if the node is syncing or the template is stale.\n**Z Notation (informal)**: $\\text{submit\\_block}(\\text{batch}) \\triangleq \\text{Command::SubmitBlock}(\\text{batch}, \\text{tx}) \\implies \\text{await}(\\text{tx})$\n**Doc comment**: Submits a mined block batch for validation against the current chain tip. Waits for acceptance or rejection.\n\n## Internal Logic (Representative)\n\n### `fn handle_new_batch`\n**Reasoning**: Core logic for processing incoming blocks. It determines if the block is valid, whether it's an orphan, and initiates off-thread validation or queuing.\n**Preconditions**: The `Batch` must be received via network or mining. The node must not be actively syncing.\n**Postconditions**: If valid and on tip, the block is validated off-thread; if an orphan, its PoW is screened off-thread; if busy, it is queued.\n**Z Notation (informal)**: $\\text{handle\\_new\\_batch}(\\text{batch}) \\implies (\\text{Queue} \\lor \\text{ScreenPoW} \\lor \\text{ValidateOffThread})$\n**Doc comment**: Processes a new block batch, checking for staleness, orphans, and initiating off-thread validation or queuing.\n\n### `fn check_fork_block`\n**Reasoning**: Implements the logic for determining if an orphan block (on an earlier parent) should replace the current chain tip, based on weight comparison. This is performed off-thread to avoid blocking the event loop.\n**Preconditions**: The block must be an orphan candidate and its parent must be within `MAX_ORPHAN_DEPTH` of the tip.\n**Postconditions**: Triggers an off-thread state derivation and batch application check; if successful and heavier, it leads to a chain reorganization (`on_fork_block_checked`).\n**Z Notation (informal)**: $\\text{check\\_fork\\_block}(\\text{batch}, \\text{parent}) \\implies \\text{SpawnBlocking}(\\text{DeriveState}(\\text{parent})) \\to \\text{Internal::ForkBlockChecked}$\n**Doc comment**: Checks an orphan block against the state of its parent, off-thread, to determine if it outweighs the current chain tip.\n\n### `fn on_batches_applied`\n**Reasoning**: Handles the result of applying a batch (either from sync or fork check). This is where chain adoption, reorg detection, and peer banning occur.\n**Preconditions**: The block application must complete successfully off-thread. The node must not be syncing if it's a committed block.\n**Postconditions**: If successful, the state is updated (`adopt_chain`); if a reorg occurs, the chain is adopted atomically; if invalid, the peer may be banned.\n**Z Notation (informal)**: $\\text{on\\_batches\\_applied}(\\text{state}, \\text{applied}) \\implies (\\text{AdoptChain} \\lor \\text{AbortSync} \\lor \\text{BanPeer})$\n**Doc comment**: Processes the result of batch application, handling chain adoption, reorgs, and peer validation failures.\n\n## `FEED_OVERLAP`\n\n**Reasoning**: Defines a fixed buffer size for headers fetched from the midstate, ensuring that the fetch range overlaps with the relay's tip history to detect potential midstate reorganizations.\n**Preconditions**: None.\n**Postconditions**: Provides a constant value used in header fetching logic.\n**Z Notation (informal)**: $\\text{FEED\\_OVERLAP} = 6$\n**Doc comment**: `/// The number of headers below the relay's tip that are fetched again to detect midstate reorganizations.`\n\n## `fetch_midstate_headers`\n\n**Reasoning**: Retrieves a batch of headers from the midstate, starting slightly before the relay's tip, up to a maximum batch size (`FEED_BATCH`). It validates the header chain integrity (linking) before returning the result.\n**Preconditions**:\n1. `addr` must be a valid RPC endpoint for the midstate.\n2. `relay` must be a valid `Relay` structure with a defined tip and base height.\n3. The calculated start height (`from`) must be less than the midstate's current block height (`blocks`).\n**Postconditions**:\n1. Returns `Ok(Some(MidstateHeaders))` containing a verified, linked sequence of headers if data is found.\n2. Returns `Ok(None)` if the required header range is empty or no headers are fetched.\n3. Returns `Err` if RPC communication fails, height calculations are invalid, or the header chain linkage is broken.\n**Z Notation (informal)**: $\\text{fetch\\_midstate\\_headers}(\\text{addr}, \\text{relay}) \\rightarrow \\begin{cases} \\text{Ok}(\\text{Some}(H)) & \\text{if } H \\text{ is verified and linked} \\\\ \\text{Ok}(\\text{None}) & \\text{if range is empty} \\\\ \\text{Err}(\\text{E}) & \\text{otherwise} \\end{cases}$\n**Doc comment**: `/// Fetches midstate headers from a height slightly below the relay's tip, validating their links and proofs of work.`\n\n## `request_reads_storage`\n\n**Reasoning**: Acts as a quick check to determine if a given `LightRequest` can be answered solely using local storage data, without requiring external RPC calls.\n**Preconditions**: `request` must be a valid `LightRequest`.\n**Postconditions**: Returns `true` if the request type is one that relies only on local storage (e.g., `GetHeaders`, `GetBlock`), and `false` otherwise.\n**Z Notation (informal)**: $\\text{request\\_reads\\_storage}(R) \\iff R \\in \\{\\text{GetHeaders}, \\text{GetBlock}, \\dots\\}$\n**Doc comment**: `/// Checks if a light request can be answered using local storage data only.`\n\n## `light_from_storage`\n\n**Reasoning**: Implements the core logic for serving light requests (e.g., headers, blocks, UTXOs) by querying the local `Storage` instance, ensuring responses are compact and verifiable.\n**Preconditions**:\n1. `storage` must be a valid, initialized `Storage` structure containing relevant chain data.\n2. `tip` must be the current known tip height of the chain.\n3. `request` must be a valid `LightRequest` supported by the storage.\n**Postconditions**:\n1. Returns `Ok(serde_json::Value)` containing the requested data encoded (e.g., hex-encoded bincode).\n2. Returns `Err` if the request is unsupported or if the underlying storage operation fails (e.g., block not found).\n**Z Notation (informal)**: $\\text{light\\_from\\_storage}(S, T, R) \\rightarrow \\begin{cases} \\text{Ok}(V) & \\text{if } S \\text{ satisfies } R \\text{ up to height } T \\\\ \\text{Err}(\\text{E}) & \\text{otherwise} \\end{cases}$\n**Doc comment**: `/// Answers a light request by querying local storage, constrained by the chain tip.`\n\n## `bootstrap_from_checkpoint`\n\n**Reasoning**: Handles the initial synchronization of the node state using a trusted checkpoint. It first verifies the anchor record locally or via peers, then iteratively fetches and verifies snapshot parts from peers until the full state is imported into the database.\n**Preconditions**:\n1. `network` must be a mutable, connected `Network` instance.\n2. `storage` must be the target `Storage` (initially empty).\n3. `trusted` must be the cryptographic ID of the trusted checkpoint.\n4. `config` must provide necessary timeouts and file paths.\n**Postconditions**:\n1. Returns `Ok(())` upon successful verification of the anchor, retrieval of all snapshot parts, and successful import of the state into `storage`.\n2. Returns `Err` if the synchronization times out, an anchor is forged, a snapshot is invalid, or storage import fails.\n3. If successful, the anchor record is appended to the configuration file.\n**Z Notation (informal)**: $\\text{bootstrap\\_from\\_checkpoint}(N, S, T, C) \\rightarrow \\begin{cases} \\text{Ok}() & \\text{if } S \\text{ is successfully updated with state } T \\\\ \\text{Err}(\\text{E}) & \\text{if synchronization fails or times out} \\end{cases}$\n**Doc comment**: `/// Synchronizes the node state by fetching, verifying, and importing a trusted checkpoint snapshot from peers.`"}, {"path": "pool.rs", "module": "(root)", "doc": "## Public Constants & Types\n\n### `MAX_PAID_MINERS`\n1. **Reasoning**: Defines the maximum number of miners that can receive a direct payout from a single coinbase transaction, ensuring the pool fee is accounted for in the remaining output.\n2. **Preconditions**: None.\n3. **Postconditions**: A constant value representing the limit on paid miners.\n4. **Z Notation (informal)**: $\\text{MAX\\_PAID\\_MINERS} = \\text{MAX\\_GROUP\\_OUTPUTS} - 1$\n5. **Doc comment**: The maximum number of miners entitled to a direct payout from one coinbase output (excluding the pool fee).\n\n### `OwnerId`\n1. **Reasoning**: Provides a privacy-preserving identifier for a payout address by hashing the full address key, preventing the pool from linking coinbase outputs directly to public addresses.\n2. **Preconditions**: An input `StealthAddress` must be provided.\n3. **Postconditions**: A fixed-size 32-byte hash (`[u8; 32]`) uniquely identifying the owner.\n4. **Z Notation (informal)**: $\\text{OwnerId} = \\text{hash\\_domain}(\\text{\"midwimble.pool.owner.v1\"}, \\text{AddrKey})$\n5. **Doc comment**: A privacy-preserving 32-byte hash used to identify an owner in windows and payouts, without revealing the underlying address.\n\n### `target_from_leading_zero_bits`\n1. **Reasoning**: Calculates the maximum valid hash value (the target) corresponding to a specified number of required leading zero bits, crucial for defining mining difficulty.\n2. **Preconditions**: `bits` must be between 0 and 256.\n3. **Postconditions**: A 32-byte array representing the target hash, where hashes below this value meet the difficulty requirement.\n4. **Z Notation (informal)**: $\\text{Target}(\\text{bits}) = \\lfloor 2^{256} / 2^{\\text{bits}} \\rfloor$\n5. **Doc comment**: Computes the maximum valid hash target for a given number of required leading zero bits.\n\n## Share Commitment Structures\n\n### `ShareRecord`\n1. **Reasoning**: Represents a single accepted share, containing all necessary data (sequence number, owner ID, weight, nonce, final hash) to allow any verifier to recompute its proof of work against the job it was mined on.\n2. **Preconditions**: Must be generated from a valid mining attempt tied to a specific `job_id`.\n3. **Postconditions**: A verifiable record whose `leaf()` hash is deterministically computed based on its contents.\n4. **Z Notation (informal)**: $\\text{ShareRecord} \\rightarrow (\\text{seq}, \\text{owner}, \\text{weight}, \\text{job\\_id}, \\text{nonce}, \\text{final\\_hash}, \\text{auth})$\n5. **Doc comment**: A complete, verifiable record of a single accepted share, including its proof of work and commitment details.\n\n### `ShareRecord::leaf`\n1. **Reasoning**: Computes the deterministic hash used as the leaf node in the owner's `ShareTree`, ensuring integrity and uniqueness for the share within the tree structure.\n2. **Preconditions**: The `ShareRecord` must be fully populated.\n3. **Postconditions**: A 32-byte hash representing the share's unique identifier within the pool scheme.\n4. **Z Notation (informal)**: $\\text{Leaf}(\\text{SR}) = \\text{hash\\_domain}(\\text{\"midwimble.pool.share.v1\"}, [\\text{SR}.\\text{seq}, \\text{SR}.\\text{owner}, \\dots])$\n5. **Doc comment**: Computes the deterministic leaf hash for the share, used in the `ShareTree`.\n\n### `JobProof`\n1. **Reasoning**: Encapsulates all necessary block header and coinbase information required to reconstruct and verify a miner's specific copy of a job, ensuring that work is credited only if the miner performed it on the correct context.\n2. **Preconditions**: Must be derived from a valid `Batch` structure corresponding to a mined block.\n3. **Postconditions**: A complete, immutable record of the block context, including window roots and coinbase details.\n4. **Z Notation (informal)**: $\\text{JobProof} \\rightarrow (\\text{prev\\_header}, \\text{timestamp}, \\text{target}, \\text{state\\_root}, \\text{coinbase}, \\text{paying\\_root}, \\text{next\\_root})$\n5. **Doc comment**: Contains all block context (header, midstate, coinbase, window roots) needed to verify a miner's specific copy of a job.\n\n### `JobProof::of`\n1. **Reasoning**: Constructs a `JobProof` from a completed block (`Batch`), binding the required window roots (`paying_root`, `next_root`) to the context.\n2. **Preconditions**: The input `batch` must be a valid, completed block structure, and `batch.coinbase` must be present.\n3. **Postconditions**: An `Option<JobProof>` containing the complete proof if the batch is valid, or `None` otherwise (e.g., if no coinbase exists).\n4. **Z Notation (informal)**: $\\text{Of}(\\text{Batch}, R_p, R_n) \\rightarrow \\begin{cases} \\text{JobProof} & \\text{if } \\text{Batch}.\\text{coinbase} \\neq \\text{None} \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Creates a `JobProof` from a block batch, binding the relevant paying and next window roots.\n\n### `JobProof::mining_hash`\n1. **Reasoning**: Calculates the specific mining hash for an owner's copy of the job by correctly binding the commitment (`bind_extra`) to the owner and computing the final block header hash over the derived midstate.\n2. **Preconditions**: A valid `JobProof`, a target `OwnerId`, and an optional `auth` signature must be provided.\n3. **Postconditions**: The 32-byte mining hash that the miner must have found for their specific copy of the job.\n4. **Z Notation (informal)**: $\\text{Hash}(\\text{JP}, O, A) = \\text{compute\\_header\\_hash}(\\text{BlockHeader}(\\dots, \\text{Coinbase}(\\text{Commitment}(\\text{JP}.\\text{paying\\_root}, \\text{JP}.\\text{next\\_root}), O), \\dots))$\n5. **Doc comment**: Calculates the specific mining hash for an owner's copy of the job, incorporating the owner-specific commitment and optional signature.\n\n## Tree Structures\n\n### `TreeNode`\n1. **Reasoning**: Represents a node in the `ShareTree`, storing the Merkle hash, the total weight of shares beneath it, and the range (lowest/highest final hash) covered by those shares.\n2. **Preconditions**: Must be derived from valid `ShareRecord` leaves or joined from two valid child nodes.\n3. **Postconditions**: A node structure with a deterministic hash and associated weight/hash range.\n4. **Z Notation (informal)**: $\\text{TreeNode} \\rightarrow (\\text{hash}, \\text{weight}, \\text{low}, \\text{high})$\n5. **Doc comment**: A node in the `ShareTree`, tracking its hash, total weight, and the range of final hashes it covers.\n\n### `TreeNode::join`\n1. **Reasoning**: Combines two sibling nodes into a parent node, calculating the parent's hash based on the children's properties (hashes, weights, ranges).\n2. **Preconditions**: Both input nodes (`left`, `right`) must be valid `TreeNode`s.\n3. **Postconditions**: A new `TreeNode` representing the parent, with combined weight and range.\n4. **Z Notation (informal)**: $\\text{Join}(L, R) = \\text{hash\\_domain}(\\dots, [L.\\text{hash}, L.\\text{weight}, L.\\text{low}, L.\\text{high}, R.\\text{hash}, R.\\text{weight}, R.\\text{low}, R.\\text{high}])$\n5. **Doc comment**: Joins two sibling nodes into a parent, calculating the parent's hash based on children's properties.\n\n### `TreeNode::join_checked`\n1. **Reasoning**: Performs the structural and ordering checks required for a valid Merkle tree: weights must sum correctly, and the left child's highest hash must be strictly less than the right child's lowest hash. This prevents double-counting work.\n2. **Preconditions**: Both input nodes (`left`, `right`) must be valid `TreeNode`s.\n3. **Postconditions**: An `Option<TreeNode>`: `Some(T)` if the structural and ordering constraints are met, `None` otherwise.\n4. **Z Notation (informal)**: $\\text{JoinChecked}(L, R) = \\begin{cases} \\text{Some}(\\text{Join}(L, R)) & \\text{if } L.\\text{weight} + R.\\text{weight} \\text{ is finite } \\land L.\\text{high} < R.\\text{low} \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Checks structural validity (weight sum and hash ordering) before joining two nodes into a parent.\n\n## Window and Payout Logic\n\n### `Window`\n1. **Reasoning**: Defines the set of accepted shares for a block, specifying the sequence range, minimum difficulty (`share_bits`), and the list of owners and their total weights within that window.\n2. **Preconditions**: Must contain a sorted list of `WindowOwner`s, all with positive weight.\n3. **Postconditions**: A structure defining the accepted share window, capable of calculating its Merkle root and locating any point within its total weight.\n4. **Z Notation (informal)**: $\\text{Window} \\rightarrow (\\text{start\\_seq}, \\text{end\\_seq}, \\text{share\\_bits}, \\text{Owners})$\n5. **Doc comment**: Represents the set of accepted shares for a block, defining the sequence range, minimum difficulty, and owner weights.\n\n### `Window::root`\n1. **Reasoning**: Calculates the Merkle root of all `WindowOwner` leaves, binding this root along with metadata (count, total weight, sequence range, difficulty) into a unique window identifier.\n2. **Preconditions**: The `owners` vector must be sorted by `id`.\n3. **Postconditions**: A 32-byte hash representing the canonical root of the window.\n4. **Z Notation (informal)**: $\\text{Root}(\\text{W}) = \\text{hash\\_domain}(\\text{\"midwimble.pool.window.v3\"}, [\\text{MerkleRoot}(\\text{Owners}), |\\text{Owners}|, \\sum \\text{Weight}, \\text{start\\_seq}, \\text{end\\_seq}, \\text{share\\_bits}])$\n5. **Doc comment**: Computes the canonical Merkle root for the window, binding all structural metadata.\n\n### `job_commitment`\n1. **Reasoning**: Creates a unique commitment hash that ties a specific job to two critical windows: the one it pays (`paying_root`) and the one it freezes for the next tip (`next_root`). This prevents miners from steering the draw by choosing which window to pay from.\n2. **Preconditions**: Two valid window roots (`paying_root`, `next_root`) must be provided.\n3. **Postconditions**: A 32-byte commitment hash.\n4. **Z Notation (informal)**: $\\text{Commit}(\\text{R}_p, \\text{R}_n) = \\text{hash\\_domain}(\\text{\"midwimble.pool.commit.v2\"}, [\\text{R}_p, \\text{R}_n])$\n5. **Doc comment**: Generates the commitment hash that binds a job to both its paying window and the next frozen window.\n\n### `bind_extra`\n1. **Reasoning**: Finalizes the miner's copy of the job by binding the generic `job_commitment` to the specific `OwnerId` of the miner, ensuring that only the intended miner can produce a valid mining hash for that copy.\n2. **Preconditions**: A valid `commitment` hash and the target `OwnerId` must be provided.\n3. **Postconditions**: A 32-byte binding hash used in the coinbase `extra`.\n4. **Z Notation (informal)**: $\\text{Bind}(\\text{C}, O) = \\text{hash\\_domain}(\\text{\"midwimble.pool.bind.v2\"}, [\\text{C}, O])$\n5. **Doc comment**: Binds the job commitment to a specific owner's ID, creating the unique coinbase `extra` for that miner's copy.\n\n### `draw_seed`\n1. **Reasoning**: Generates a deterministic seed for the random sampling of payouts, based on the block hash the job is built upon (`prev_header_hash`) and the window it pays (`paying_root`). This ensures the draw is fixed and cannot be manipulated by the pool after the fact.\n2. **Preconditions**: The `prev_header_hash` and `paying_root` must be valid.\n3. **Postconditions**: A 32-byte seed used for systematic sampling in payout allocation.\n4. **Z Notation (informal)**: $\\text{Seed}(\\text{H}, \\text{R}_p) = \\text{hash\\_domain}(\\text{\"midwimble.pool.draw.v1\"}, [\\text{H}, \\text{R}_p])$\n5. **Doc comment**: Generates the deterministic seed for payout sampling, based on the job's base block hash and the paying window root.\n\n### `payout_weights`\n1. **Reasoning**: Calculates the final payout weights for all entitled owners (operator + miners) by splitting the total reward minus the pool fee according to the PPLNS scheme (exact payments for large owners, systematic sampling for small owners).\n2. **Preconditions**: Valid `fee_ppm`, `operator` ID, a list of `window` owner weights, and a `seed` derived from `draw_seed`.\n3. **Postconditions**: A vector of `(OwnerId, u64)` pairs representing the final payout weights, including the operator's fee entitlement.\n4. **Z Notation (informal)**: $\\text{PayoutWeights}(\\text{Fee}, O, W, S) = \\text{Allocate}(\\text{Scale} - \\text{Fee}, W, S) \\cup \\{ (O, \\text{Fee}) \\}$\n5. **Doc comment**: Calculates the final payout weights for all owners (operator and miners) using PPLNS, incorporating the pool fee and a deterministic draw seed.\n\n## Snapshot and Verification\n\n### `WindowSnapshot`\n1. **Reasoning**: Stores all necessary data about a finalized window—the window structure, its root, the mapping of `OwnerId` to `StealthAddress`, and the actual `ShareRecord`s—to enable external verification (spot checks).\n2. **Preconditions**: Must be constructed from a set of accepted shares and their corresponding addresses.\n3. **Postconditions**: A complete, verifiable snapshot of the window state.\n4. **Z Notation (informal)**: $\\text{Snapshot} \\rightarrow (\\text{Window}, \\text{Root}, \\text{Addresses}, \\text{Shares})$\n5. **Doc comment**: A complete, immutable snapshot of a finalized window, containing all shares and metadata required for external spot checks.\n\n### `WindowSnapshot::sample`\n1. **Reasoning**: Implements the spot check mechanism: given a point `at` within the window's total weight, it identifies the covering share, retrieves its proof of work (`JobProof`), and returns all necessary data for a miner to recompute the share's validity independently.\n2. **Preconditions**: A database connection (`db`) must be available to load `JobProof` and `JobHeight`. The point `at` must be within the window's total weight.\n3. **Postconditions**: A JSON value containing the owner ID, share index, serialized share record, Merkle path, job proof, and job height.\n4. **Z Notation (informal)**: $\\text{Sample}(\\text{S}, \\text{at}) \\rightarrow \\begin{cases} \\text{ProofData} & \\text{if } 0 \\le \\text{at} < \\text{S}.\\text{total} \\\\ \\text{Error} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Provides the necessary data (share, Merkle path, job proof) for a miner to verify a share at a specific weight point within the window.\n\n### `window_size`\n1. **Reasoning**: Calculates the total share weight that a window should hold, based on the block count (`window_blocks`), network difficulty (`network_target`), and the pool's minimum share difficulty (`share_bits`). This ensures consistent window sizing across different network conditions.\n2. **Preconditions**: Valid `network_target`, `share_bits`, and `window_blocks`.\n3. **Postconditions**: A capped `u128` representing the total required weight for the window.\n4\n\n## Verifier Implementation\n\n### `Verifier::start(workers: usize) -> Self`\n1. **Reasoning**: Initializes the verification infrastructure, setting up shared state (queues and condition variable) and spawning dedicated worker threads to handle Proof-of-Work recomputation in parallel.\n2. **Preconditions**: `workers` must be a positive integer.\n3. **Postconditions**: A `Verifier` instance is returned, and `workers` number of background verification threads are running, consuming tasks from the shared queues.\n4. **Z Notation (informal)**: $\\exists V: \\text{Verifier} \\land \\forall i \\in [0, \\text{workers}-1]: \\text{Thread}_i \\text{ is active}$.\n5. **Doc comment**: Initializes and starts the worker threads for Proof-of-Work verification.\n\n### `Verifier::verify(algo: PowAlgo, mining_hash: [u8; 32], nonce: u64, proven: bool) -> Result<[u8; 32]>`\n1. **Reasoning**: Allows external callers (e.g., connection handlers) to submit a Proof-of-Work task asynchronously and wait for the final computed hash result from a worker thread.\n2. **Preconditions**: `self` must be initialized. The shared queue capacity (`unproven_limit`) must not be exceeded by pending tasks.\n3. **Postconditions**: Returns the final computed hash (`[u8; 32]`) upon successful verification, or an error if the verifier stops. The task is moved to either `queues.proven` or `queues.unproven`.\n4. **Z Notation (informal)**: $\\text{verify}(\\dots) \\rightarrow H \\land H = \\text{ComputeHash}(\\text{nonce}, \\text{mining\\_hash}) \\land \\text{Task} \\in \\text{Queues}$.\n5. **Doc comment**: Queues a Proof-of-Work task and asynchronously returns the final computed hash.\n\n## Worker Logic\n\n### `verify_worker(shared: &VerifierShared, lanes: usize)`\n1. **Reasoning**: The core loop for verification threads. It continuously waits for batches of tasks, processes them (separating Blake3Chain tasks for SIMD batching), and sends the results back to the originating callers via one-shot channels.\n2. **Preconditions**: `shared` must be a valid `VerifierShared` instance. `lanes` must be $\\ge 1$.\n3. **Postconditions**: The worker thread runs indefinitely, consuming tasks from `shared.queues`. Results are sent back to the corresponding `VerifyTask` channels. If unproven tasks were processed, `shared.ready` is notified.\n4. **Z Notation (informal)**: $\\forall \\text{batch} \\in \\text{Queues}: (\\text{ProcessBatch}(\\text{batch}) \\rightarrow \\text{SendResults}) \\land (\\text{UnprovenCount} > 0 \\rightarrow \\text{NotifyReady})$.\n5. **Doc comment**: Worker thread loop that consumes batches of tasks, performs verification (including SIMD batching for Blake3Chain), and sends results.\n\n## Server and Job Management\n\n### `Job::bound_batch(&self, variant: &Variant) -> Batch`\n1. **Reasoning**: Creates a specific, miner-bound version of the job batch by injecting the miner's unique `extra` data into the coinbase transaction structure.\n2. **Preconditions**: `self` must be a valid `Job`. `variant` must be a valid `Variant`.\n3. **Postconditions**: A new `Batch` is returned, identical to `self.batch`, but with `coinbase.extra` and `miner` fields updated according to the `variant`.\n4. **Z Notation (informal)**: $\\text{bound\\_batch}(\\text{Job}, \\text{Variant}) \\rightarrow B' \\land B'.\\text{coinbase}.\\text{extra} = \\text{Variant}.\\text{extra}$.\n5. **Doc comment**: Returns a specific batch instance of the job, incorporating the miner's unique coinbase extra data and signature.\n\n### `open_db(path: &std::path::Path) -> Result<(Database, ShareLog, u64)>`\n1. **Reasoning**: Initializes the persistent storage (RedB database), ensures data integrity by dropping unproven credit, sets up necessary tables, loads the share log, and determines the next sequential job ID to prevent ID reuse across restarts.\n2. **Preconditions**: `path` must be a valid directory path.\n3. **Postconditions**: Returns a tuple containing the initialized `Database`, the loaded `ShareLog`, and the next available `u64` job ID.\n4. **Z Notation (informal)**: $\\text{open\\_db}(\\text{Path}) \\rightarrow (D, L, N) \\land D.\\text{tables} = \\{\\dots\\} \\land N = \\max(\\text{JobProofs}, \\text{LogEntries}) + 1$.\n5. **Doc comment**: Opens the pool database, initializes tables, drops unproven credit, and determines the next job ID.\n\n### `run_pool(cfg: PoolConfig, stats: Arc<PoolStats>) -> Result<()>`\n1. **Reasoning**: The main entry point for the pool service. It sets up configuration, initializes the database and state, starts network listeners (Stratum TCP/TLS, API HTTP), spawns background tasks (job loop, verification workers), and runs the server until termination.\n2. **Preconditions**: `cfg` must contain valid network addresses and configuration parameters. `stats` must be a valid `Arc<PoolStats>`.\n3. **Postconditions**: The pool service runs indefinitely, listening for connections and processing jobs/shares. Returns `Ok(())` upon graceful shutdown (or error if setup fails).\n4. **Z Notation (informal)**: $\\text{run\\_pool}(\\text{Cfg}, \\text{Stats}) \\rightarrow \\text{ServiceRunning} \\land \\text{Listeners} = \\{\\text{Stratum}, \\text{API}\\} \\land \\text{Workers} = \\text{AvailableParallelism}$.\n5. **Doc comment**: Initializes and runs the entire pool service, starting database, network listeners, and background job/verification loops.\n\n## Network and Connection Handling\n\n### `serve_stratum(state: Arc<PoolState>, listener: tokio::net::TcpListener, tls: Option<tokio_rustls::TlsAcceptor>) -> Result<()>`\n1. **Reasoning**: Listens for incoming miner connections on the specified TCP listener. It performs initial checks (bans, admission) and spawns a dedicated asynchronous task (`handle_miner`) for each accepted connection, handling both plain and TLS streams.\n2. **Preconditions**: `listener` must be a bound TCP listener. `state` must be a valid `Arc<PoolState>`.\n3. **Postconditions**: The function runs indefinitely, accepting connections and spawning concurrent handlers.\n4. **Z Notation (informal)**: $\\text{serve\\_stratum}(\\dots) \\rightarrow \\forall \\text{Peer}: (\\text{CheckBans} \\land \\text{Admit}) \\rightarrow \\text{SpawnHandler}(\\text{Peer})$.\n5. **Doc comment**: Accepts incoming miner connections on the Stratum listener, handling both plain and TLS streams, and spawns a handler for each connection.\n\n### `connect_pool(url: &str, pin: Option<[u8; 32]>) -> Result<Box<dyn PoolStream>>`\n1. **Reasoning**: Provides a unified mechanism to establish a connection to the pool, automatically determining if TLS is required and configuring the client (either using standard root CAs or enforcing a specific certificate pin).\n2. **Preconditions**: `url` must be a valid Stratum URI (`stratum+tcp://`, `stratum+tls://`, etc.). If `pin` is provided, it must be a valid SHA-256 fingerprint.\n3. **Postconditions**: Returns a boxed stream implementing `PoolStream` (either `TcpStream` or `TlsStream`), ready for I/O operations.\n4. **Z Notation (informal)**: $\\text{connect\\_pool}(\\text{URL}, \\text{Pin}) \\rightarrow S \\land S \\in \\{\\text{TCPStream}, \\text{TLSStream}\\}$.\n5. **Doc comment**: Connects to the pool via Stratum URI, supporting both plain TCP and TLS connections, optionally enforcing certificate pinning.\n\n## Job Lifecycle Management\n\n### `job_loop(state: Arc<PoolState>)`\n1. **Reasoning**: The central scheduler. It periodically polls the node RPC for the current block tip, determines the correct paying/next windows, builds a new job using the node template, stores the job proof, binds the job to connected miners, updates state, and manages the share log pruning.\n2. **Preconditions**: `state` must be initialized with valid configuration and database access.\n3. **Postconditions**: A new `Job` is created periodically (when the tip changes or forced), stored, and broadcasted via `notifier`. The share log is pruned to maintain bounded memory usage.\n4. **Z Notation (informal)**: $\\text{job\\_loop}(\\text{State}) \\rightarrow \\text{PollTip} \\land (\\text{TipChange} \\lor \\text{Forced}) \\rightarrow \\text{BuildJob} \\land \\text{PruneLog}$.\n5. **Doc comment**: Periodically polls the node RPC, builds new jobs based on block tips, binds them to connected miners, and manages job proof storage and share log pruning.\n\n### `freeze_window(state: &PoolState, network_target: &[u8; 32]) -> Arc<WindowSnapshot>`\n1. **Reasoning**: Calculates the relevant window of shares (the last `window_blocks` worth) based on the current share log and returns it as an immutable snapshot.\n2. **Preconditions**: `state` must be valid. `network_target` must be a valid hash.\n3. **Postconditions**: An `Arc<WindowSnapshot>` representing the required window is returned, derived from the shared log.\n4. **Z Notation (informal)**: $\\text{freeze\\_window}(\\text{State}, T) \\rightarrow W \\land W = \\text{Log}.\\text{window}(\\text{Size}(T), \\text{Bits})$.\n5. **Doc comment**: Calculates and returns an immutable snapshot of the required share window based on the current share log.\n\n### `build_job(state: &Arc<PoolState>, job_id: u64, tip: [u8; 32], paying: Arc<WindowSnapshot>, next: Arc<WindowSnapshot>) -> Result<Job>`\n1. **Reasoning**: Constructs a new `Job` by calculating payouts, generating the commitment, requesting the template from the node RPC, and validating that the template matches the current block tip.\n2. **Preconditions**: `state`, `job_id`, `tip`, `paying`, and `next` must be valid. The node RPC must be reachable.\n3. **Postconditions**: A fully constructed `Job` object is returned, containing all necessary metadata (hashes, targets, payouts, commitment).\n4. **Z Notation (informal)**: $\\text{build\\_job}(\\dots) \\rightarrow J \\land J.\\text{prev\\_hash} = \\text{Tip} \\land J.\\text{template} = \\text{NodeRPC}.\\text{template}$.\n5. **Doc comment**: Constructs a new job by calculating payouts, requesting the template from the node RPC, and validating against the current block tip.\n\n### `bind_miners(state: &PoolState, job: &Job, miners: Vec<AddrKey>) -> Result<()>`\n1. **Reasoning**: Requests the node to generate specific copies of the job for a list of connected miners using the job commitment. It validates that the returned copies are correct and stores them in `job.variants`.\n2. **Preconditions**: `state` must be valid. `job` must be fully defined. `miners` must be a list of authorized addresses.\n3. **Postconditions**: All requested miner copies are successfully retrieved from the node, validated against the commitment, and stored in `job.variants`.\n4. **Z Notation (informal)**: $\\text{bind\\_miners}(\\dots) \\rightarrow \\forall m \\in \\text{Miners}: \\text{Job}.\\text{variants}[m] \\text{ is valid} \\land \\text{Variant}.\\text{extra} = \\text{Commitment}(J)$.\n5. **Doc comment**: Requests the node to generate and retrieve specific copies of the job for connected miners, validating the returned variants.\n\n### `variant_for(state: &PoolState, job: &Job, miner: &AddrKey) -> Result<Arc<Variant>>`\n1. **Reasoning**: Retrieves a specific miner's copy (`Variant`) of a job. If it doesn't exist in `job.variants`, it triggers `bind_miners` to fetch it first.\n2. **Preconditions**: `state` must be valid. `job` must be defined. `miner` must be an authorized address.\n3. **Postconditions**: Returns an `Arc<Variant>` specific to the requested miner.\n4. **Z Notation (informal)**: $\\text{variant\\_for}(\\dots) \\rightarrow V \\land V = \\text{Job}.\\text{variants}[\\text{Miner}] \\lor \\text{BindMiners}(\\dots) \\rightarrow V$.\n5. **Doc comment**: Retrieves a specific miner's copy of a job, triggering the binding process if the copy is not yet available.\n\n## Share Processing\n\n### `precheck_share(state: &PoolState, miner: AddrKey, job_id: u64, nonce: u64, bits: u32) -> std::result::Result<PendingShare, ShareOutcome>`\n1. **Reasoning**: Performs fast, cheap checks on a submitted share: ensuring the job is current, the miner is authorized for that job, and the specific work (mining hash/nonce) has not been submitted before (preventing duplicates).\n2. **Preconditions**: `state` must be valid. The job ID must correspond to the currently active job (`state.current`).\n3. **Postconditions**: If checks pass, a `PendingShare` struct is returned, containing the calculated share target and weight. Otherwise, a specific `ShareOutcome` (e.g., `StaleJob`, `Duplicate`) is returned.\n4. **Z Notation (informal)**: $\\text{precheck\\_share}(\\dots) \\rightarrow P \\land P.\\text{job} = \\text{CurrentJob} \\land P.\\text{nonce} \\notin \\text{Seen}$.\n5. **Doc comment**: Performs cheap checks on a submitted share (current job, authorized miner, no duplicates) and prepares the `PendingShare` structure.\n\n### `finish_share(state: &Arc<PoolState>, share: PendingShare, final_hash: [u8; 32]) -> Result<ShareOutcome>`\n1. **Reasoning**: Finalizes the share submission: checks if the hash meets the target (invalidating the share), credits the work to the log if it meets criteria (and is not a block), and handles block submission if the hash meets the network target.\n2. **Preconditions**: `share` must be a valid `PendingShare`. `final_hash` must be the result of verification.\n3. **Postconditions**: Returns a `ShareOutcome` indicating whether the share was `Accepted`, `Uncredited`, `Invalid`, or if it resulted in a block submission. The work is removed from `job.seen` upon successful validation.\n4. **Z Notation (informal)**: $\\text{finish\\_share}(\\dots) \\rightarrow O \\land (\\text{Hash} < \\text{Target} \\rightarrow O \\in \\{\\text{Accepted}, \\text{Uncredited}\\}) \\land (\\text{Hash} \\ge \\text{Target} \\rightarrow O = \\text{Invalid})$.\n5. **Doc comment**: Finalizes a verified share: checks against the target, credits the work to the log if valid, and submits the block if the network target is met.\n\n### `process_share(state: Arc<PoolState>, miner: AddrKey, job_id: u64, nonce: u64, proven: bool, bits: u32) -> Result<ShareOutcome>`\n1. **Reasoning**: Orchestrates the share verification process: runs cheap checks (`precheck_share`), submits the task to the `Verifier` thread pool, and then calls `finish_share` with the result.\n2. **Preconditions**: `state` must be valid. The job ID must correspond to a known job.\n3. **Postconditions**: Returns the final `ShareOutcome` after verification and logging/submission attempts are complete.\n4. **Z Notation (informal)**: $\\text{process\\_share}(\\dots) \\rightarrow O \\land O = \\text{FinishShare}(\\text{Precheck}(\\dots), \\text{Verify}(\\dots))$.\n5. **Doc comment**: Orchestrates the full share verification process: pre-checks, calls the ver\n\n## Documentation for `pool.rs`\n\n### Structs\n\n#### `JobQuery`\n1. **Reasoning**: Defines the input structure for querying a specific job ID via the pool API.\n2. **Preconditions**: None.\n3. **Postconditions**: Provides an optional `job` ID for lookup.\n4. **Z Notation (informal)**: $\\text{JobQuery} \\equiv \\{\\text{job}: \\text{Option}(\\text{u64})\\}$\n5. **Doc comment**: `/// Query structure used to request a specific job by ID.`\n\n#### `SampleQuery`\n1. **Reasoning**: Defines the input structure for requesting a spot check sample at a specific point within a job's paid window.\n2. **Preconditions**: The `job` ID must correspond to an existing, recent job in the pool state. The `at` string must be parsable as a `u128`.\n3. **Postconditions**: Triggers the retrieval of a sample covering the specified point `at` for the given job.\n4. **Z Notation (informal)**: $\\text{SampleQuery} \\equiv \\{\\text{job}: \\text{u64}, \\text{at}: \\text{String}\\}$\n5. **Doc comment**: `/// Query structure for requesting a spot check sample at a specific weight point within a job's window.`\n\n#### `AuditedJob`\n1. **Reasoning**: Encapsulates all necessary, verified information about a job required by a miner to perform local checks (e.g., `verify_sample`) and maintain chain integrity.\n2. **Preconditions**: Must be successfully generated by `audit_job_with_fee_limit`.\n3. **Postconditions**: Guarantees the job's window, roots, height, and previous hash are cryptographically verified against the template and pool API.\n4. **Z Notation (informal)**: $\\text{AuditedJob} \\equiv \\{\\text{prev\\_hash}: [u8; 32], \\text{height}: \\text{u64}, \\text{window\\_root}: [u8; 32], \\text{next\\_root}: [u8; 32], \\text{window}: \\text{Window}\\}$\n5. **Doc comment**: `/// Verified, immutable data structure containing all necessary information about a job for local auditing and chain checks.`\n\n### Functions\n\n#### `find_job`\n1. **Reasoning**: Provides a unified way to retrieve a specific recent job by ID or default to the currently active job if no ID is provided.\n2. **Preconditions**: `state` must be a valid `PoolState`. If `job_id` is `Some(id)`, that job must exist in `state.recent`.\n3. **Postconditions**: Returns `Some(Arc<Job>)` if the job is found, otherwise `None`.\n4. **Z Notation (informal)**: $\\text{find\\_job}(\\text{state}, \\text{job\\_id}) \\to \\begin{cases} \\text{Some}(\\text{job}) & \\text{if } \\text{job\\_id} \\in \\text{recent} \\\\ \\text{state.current} & \\text{if } \\text{job\\_id} = \\text{None} \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: `/// Retrieves a specific recent job by ID, or the current active job if no ID is provided.`\n\n#### `window_json`\n1. **Reasoning**: Serializes the internal `Window` structure into a JSON format suitable for external API consumption (e.g., `/api/window`).\n2. **Preconditions**: `window` must be a valid `Window` instance.\n3. **Postconditions**: Returns a `serde_json::Value` representing the window data, including owner details encoded in hex.\n4. **Z Notation (informal)**: $\\text{window\\_json}(\\text{window}) \\to \\text{JSON}(\\text{window})$\n5. **Doc comment**: `/// Converts an internal Window structure into a JSON value for API response.`\n\n#### `api_window`\n1. **Reasoning**: Implements the pool's `/api/window` endpoint, providing all necessary job and window details to a miner for local auditing.\n2. **Preconditions**: `state` must be a valid `PoolState`. `q.job` must refer to an existing recent job.\n3. **Postconditions**: Returns a JSON object containing the job metadata, window details, and root hashes, or an error if the job is not found.\n4. **Z Notation (informal)**: $\\text{api\\_window}(\\text{state}, \\text{q}) \\to \\begin{cases} \\text{JSON}(\\text{JobData}) & \\text{if } \\text{find\\_job}(\\text{state}, \\text{q.job}) \\ne \\text{None} \\\\ \\text{JSON}(\\{\\text{\"error\": \"no such job\"}\\}) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: `/// API endpoint handler for retrieving all details about a specific job's paying window.`\n\n#### `api_sample`\n1. **Reasoning**: Implements the pool's `/api/sample` endpoint, allowing miners to verify a specific point in the paid window against the pool's committed data.\n2. **Preconditions**: `q.job` must refer to an existing recent job. `q.at` must be a valid `u128`.\n3. **Postconditions**: Returns a JSON object containing the sample data (share, path, index), or an error if the job is not found or the point is invalid.\n4. **Z Notation (informal)**: $\\text{api\\_sample}(\\text{state}, \\text{q}) \\to \\begin{cases} \\text{JSON}(\\text{SampleData}) & \\text{if } \\text{find\\_job}(\\text{state}, \\text{q.job}) \\ne \\text{None} \\land \\text{parse}(\\text{q.at}) = \\text{Ok}(\\text{u128}) \\\\ \\text{JSON}(\\{\\text{\"error\": \"...\"}\\}) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: `/// API endpoint handler for retrieving a spot check sample at a specific weight point within a job's window.`\n\n#### `api_template`\n1. **Reasoning**: Implements the pool's `/api/template` endpoint, providing the essential parameters needed to start mining (e.g., mining hash, targets).\n2. **Preconditions**: `state.current` must contain a valid job.\n3. **Postconditions**: Returns a JSON object containing the job ID, mining hash, and target information, or an error if no current job exists.\n4. **Z Notation (informal)**: $\\text{api\\_template}(\\text{state}) \\to \\begin{cases} \\text{JSON}(\\text{TemplateData}) & \\text{if } \\text{state.current} \\ne \\text{None} \\\\ \\text{JSON}(\\{\\text{\"error\": \"no job\"}\\}) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: `/// API endpoint handler for retrieving the mining template and targets of the current job.`\n\n#### `api_stats`\n1. **Reasoning**: Implements the pool's `/api/stats` endpoint, providing operational metrics about the pool and the current job (e.g., accepted/rejected shares, window weight).\n2. **Preconditions**: `state.current` must contain a valid job.\n3. **Postconditions**: Returns a JSON object containing various statistics (height, job ID, miner count, share counts, etc.).\n4. **Z Notation (informal)**: $\\text{api\\_stats}(\\text{state}) \\to \\text{JSON}(\\text{StatsData})$\n5. **Doc comment**: `/// API endpoint handler for retrieving operational statistics about the pool and the current job.`\n\n#### `parse_window`\n1. **Reasoning**: Parses the raw JSON window data received from the pool API into the internal, validated `Window` structure, enforcing canonical constraints (sorted IDs, positive weights).\n2. **Preconditions**: The input `value` must be a valid JSON object conforming to the expected window schema.\n3. **Postconditions**: Returns `Ok(Window)` if all structural and canonical checks pass; otherwise, returns an `anyhow::Error`.\n4. **Z Notation (informal)**: $\\text{parse\\_window}(\\text{value}) \\to \\begin{cases} \\text{Ok}(\\text{Window}) & \\text{if } \\text{value} \\text{ is valid and canonical} \\\\ \\text{Err}(\\text{Error}) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: `/// Parses and validates raw JSON window data into a canonical Window structure.`\n\n#### `audit_job_with_fee_limit`\n1. **Reasoning**: Performs the comprehensive, cryptographic audit of a job. This verifies the template hash, fee limits, subsidy schedule, coinbase payment correctness (using the miner's `ViewKey`), and ensures the pool credits the miner for all accepted shares.\n2. **Preconditions**: The input `window` must be the result of the pool's `/api/window`. `max_fee_ppm` must be the miner's configured limit. `my_shares` must be the list of shares accepted by the pool.\n3. **Postconditions**: Returns `Ok(AuditedJob)` if all checks (coinbase sum, binding, share credit, payout calculation) pass; otherwise, returns an error detailing the failure.\n4. **Z Notation (informal)**: $\\text{audit\\_job\\_with\\_fee\\_limit}(\\dots) \\to \\begin{cases} \\text{Ok}(\\text{AuditedJob}) & \\text{if } \\text{Checks}(\\text{template}, \\text{window}, \\text{shares}) = \\text{True} \\\\ \\text{Err}(\\text{Reason}) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: `/// Performs a full cryptographic audit of a job, verifying template integrity, fee limits, and accurate payout based on accepted shares.`\n\n#### `bind_template`\n1. **Reasoning**: Transforms the pool's generic, shared job template into a miner-specific copy by injecting the miner's unique coinbase `extra` data and optional bond signature.\n2. **Preconditions**: `template_hex` must be a valid hex-encoded bincode serialization of a `Batch`.\n3. **Postconditions**: Returns a hex-encoded string representing the miner's unique, bound job template, or an error during deserialization/serialization.\n4. **Z Notation (informal)**: $\\text{bind\\_template}(\\text{hex}, \\text{extra}, \\text{miner}) \\to \\text{Hex}(\\text{Batch}_{\\text{bound}})$\n5. **Doc comment**: `/// Binds a shared job template to a specific miner by injecting the coinbase extra and bond signature.`\n\n#### `audit_job`\n1. **Reasoning**: A convenience wrapper for `audit_job_with_fee_limit` used when the miner has no local fee limit or record of accepted shares, defaulting to the maximum allowed pool fee (`FEE_SCALE`) and an empty share list.\n2. **Preconditions**: Same as `audit_job_with_fee_limit`, but `max_fee_ppm` is fixed to `FEE_SCALE` and `my_shares` is empty.\n3. **Postconditions**: Returns `Ok(AuditedJob)` if the job passes the default audit criteria; otherwise, returns an error.\n4. **Z Notation (informal)**: $\\text{audit\\_job}(\\dots) \\equiv \\text{audit\\_job\\_with\\_fee\\_limit}(\\dots, \\text{FEE\\_SCALE}, \\text{[]})$\n5. **Doc comment**: `/// Performs a default job audit suitable for callers without specific fee limits or accepted share records.`\n\n#### `check_window_chain`\n1. **Reasoning**: Ensures chronological integrity of the pool's window selection. A new job must pay the window that the previous job froze (`last.next_root == job.window_root`), unless it is the first job.\n2. **Preconditions**: Both `last` and `job` must be valid `AuditedJob` instances.\n3. **Postconditions**: Returns `Ok(())` if the window chain links correctly (same tip $\\implies$ same roots; new tip $\\implies$ `job.window_root == last.next_root`); otherwise, returns an error.\n4. **Z Notation (informal)**: $\\text{check\\_window\\_chain}(\\text{last}, \\text{job}) \\to \\begin{cases} \\text{Ok}() & \\text{if } (\\text{last}=\\text{None}) \\lor (\\text{job.prev\\_hash} = \\text{last.prev\\_hash} \\land \\text{job.window\\_root} = \\text{last.window\\_root} \\land \\text{job.next\\_root} = \\text{last.next\\_root}) \\lor (\\text{job.prev\\_hash} \\ne \\text{last.prev\\_hash} \\land \\text{job.window\\_root} = \\text{last.next\\_root}) \\\\ \\text{Err}(\\text{Reason}) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: `/// Verifies that the current job's paid window correctly follows the window frozen by the previous job, ensuring chain integrity.`\n\n#### `verify_sample`\n1. **Reasoning**: The core verification function for spot checks. It confirms that a sample provided by the pool at point `at` is genuine: it belongs to the committed window, is ordered correctly within the owner's shares, and represents valid proof-of-work for the job's height.\n2. **Preconditions**: `window` must be a valid `Window`. `at` must be within the window range. `sample` must contain all required fields (owner, share, path, index). `known_height` must provide the correct job height if audited locally.\n3. **Postconditions**: Returns `Ok(())` if the sample is genuine and consistent with the committed window; otherwise, returns an error detailing the failure (e.g., wrong owner, out of order, not PoW).\n4. **Z Notation (informal)**: $\\text{verify\\_sample}(\\dots) \\to \\begin{cases} \\text{Ok}() & \\text{if } \\text{Sample} \\in \\text{Window} \\land \\text{Order}(\\text{Sample}) \\land \\text{PoW}(\\text{Sample}, \\text{Height}) \\\\ \\text{Err}(\\text{Reason}) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: `/// Spot-checks a window sample against the committed window data, verifying ownership, order, and proof-of-work validity.`\n\n#### `TipWatch` (Methods: `observe`, `passed`, `check`)\n1. **Reasoning**: Monitors the miner's own observed chain height to detect if the pool is intentionally holding back new tips, which could be used to steer payouts.\n2. **Preconditions**: `now` must be the current time. `height` must be a valid block height.\n3. **Postconditions**: `observe` records the height. `passed` calculates the duration since the miner first saw a block *after* the target height. `check` returns `Ok(())` if the delay is within `STALE_JOB_GRACE`; otherwise, returns an error.\n4. **Z Notation (informal)**: $\\text{check}(\\text{height}, \\text{now}) \\to \\begin{cases} \\text{Ok}() & \\text{if } \\text{passed}(\\text{height}, \\text{now}) \\le \\text{STALE\\_JOB\\_GRACE} \\\\ \\text{Err}(\\text{Stale}) & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: `/// Tracks the miner's observed chain height to detect if the pool is holding back new tips beyond a grace period.`\n\n#### `run_pool_miner`\n1. **Reasoning**: Provides a backwards-compatible entry point for running the pool miner, accepting any advertised fee. It delegates to the version enforcing a high default limit.\n2. **Preconditions**: `cfg` must be a valid `PoolMinerConfig`.\n3. **Postconditions**: Runs the mining loop until stopped or an unrecoverable error occurs.\n4. **Z Notation (informal)**: $\\text{run\\_pool\\_miner}(\\text{cfg}, \\text{stop}, \\text{stats}) \\equiv \\text{run\\_pool\\_miner\\_with\\_fee\\_percent}(\\text{cfg}, \\text{stop}, \\text{stats}, 99.9999)$\n5. **Doc comment**: `/// Backwards-compatible entrypoint for the pool miner, accepting any advertised fee.`\n\n#### `run_pool_miner_with_fee_percent`\n1. **Reasoning**: The main operational loop of the miner. It connects to the pool, handles Stratum messages (template, notify), performs audits and spot checks, manages mining threads, and enforces a local maximum fee limit (`max_fee_percent`).\n2. **Preconditions**: `cfg` must be a"}, {"path": "rpc.rs", "module": "(root)", "doc": "## RPC Documentation (`rpc.rs`)\n\n### `RpcOptions`\n*   **Reasoning**: Defines configuration parameters for the RPC listener, specifically controlling host access and CORS behavior.\n*   **Preconditions**: None.\n*   **Postconditions**: A configuration structure is initialized with allowed hosts and an optional CORS origin.\n*   **Z Notation (informal)**: $\\text{RpcOptions} \\triangleq \\{\\text{allowed\\_hosts}: \\text{Vec}(\\text{String}), \\text{cors\\_origin}: \\text{Option}(\\text{String})\\}$\n*   **Doc comment**: Configuration options for the RPC listener, including allowed hostnames and CORS origin.\n\n### `router`\n*   **Reasoning**: Provides a convenient entry point to create the full RPC router using default options and an integrated explorer index.\n*   **Preconditions**: A valid `NodeHandle` must be provided.\n*   **Postconditions**: A configured `axum::Router` is returned, including all RPC and explorer routes.\n*   **Z Notation (informal)**: $\\text{router}(\\text{node}) \\rightarrow \\text{Router} \\land (\\text{Router} \\supseteq \\text{AllRPCRoutes} \\cup \\text{ExplorerRoutes})$\n*   **Doc comment**: Creates the full RPC router with default options and an integrated explorer index.\n\n### `router_with`\n*   **Reasoning**: Allows fine-grained control over the RPC configuration, enabling separation of the RPC listener from the explorer index if needed.\n*   **Preconditions**: A valid `NodeHandle`, `RpcOptions`, and `SharedIndex` must be provided.\n*   **Postconditions**: A configured `axum::Router` is returned, respecting the provided options and index.\n*   **Z Notation (informal)**: $\\text{router\\_with}(\\text{node}, \\text{options}, \\text{index}) \\rightarrow \\text{Router}$\n*   **Doc comment**: Creates the RPC router with custom options and an optional shared explorer index.\n\n### `explorer_router`\n*   **Reasoning**: Provides a minimal router containing only the block explorer endpoints, allowing it to run independently of the main RPC functionality.\n*   **Preconditions**: A valid `NodeHandle` and `SharedIndex` must be provided.\n*   **Postconditions**: An `axum::Router`
