mission schedule.\n\n### `Emission::final_reward_height(self) -> Option<u64>`\n1. **Reasoning**: Determines the exact height of the last block that mints any coins, based on when the cumulative supply reaches or exceeds `MAX_SUPPLY`.\n2. **Preconditions**: `self` must be a valid `Emission` struct.\n3. **Postconditions**: Returns `Some(h)` if a final reward height exists, otherwise `None`.\n4. **Z Notation (informal)**: $\\text{final\\_reward\\_height}(\\text{E}) = \\min \\{h \\mid \\text{issued\\_before}(\\text{E}, h+1) \\ge \\text{MAX\\_SUPPLY}\\}$\n5. **Doc comment**: Finds the height of the last block that mints any coins, if the supply cap is reached.\n\n## Amounts\n\n### `format_amount(units: u64) -> String`\n1. **Reasoning**: Converts internal base units (with 8 decimal places) into a standard human-readable coin string format (e.g., \"0.23932616\").\n2. **Preconditions**: `units` must be a non-negative value less than or equal to `MAX_SUPPLY`.\n3. **Postconditions**: Returns a formatted string representing the amount in coins.\n4. **Z Notation (informal)**: $\\text{format\\_amount}(\\text{U}) = \\lfloor \\text{U}/\\text{COIN} \\rfloor \\cdot \".\" \\cdot \\text{frac}(\\text{U})$\n5. **Doc comment**: Formats base units into a standard coin string representation (e.g., \"0.23932616\").\n\n### `parse_amount(s: &str) -> anyhow::Result<u64>`\n1. **Reasoning**: Parses a coin string format back into the internal base unit representation, validating against supply limits and format rules.\n2. **Preconditions**: `s` must be a string representing a valid amount (digits, optional single decimal point, max 8 fractional digits).\n3. **Postconditions**: Returns `Ok(units)` if valid and within `MAX_SUPPLY`, otherwise an `anyhow::Error`.\n4. **Z Notation (informal)**: $\\text{parse\\_amount}(\\text{S}) = \\begin{cases} \\text{U} & \\text{if } S \\text{ is valid and } U \\le \\text{MAX\\_SUPPLY} \\\\ \\text{Error} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Parses a coin string (e.g., \"0.239\") into internal base units, validating against supply limits.\n\n## UTXO Records and State\n\n### `utxo_leaf(commitment: &Point32, entry: &UtxoEntry) -> [u8; 32]`\n1. **Reasoning**: Generates the cryptographic leaf used in the UTXO accumulator, ensuring that the commitment covers all relevant data (owner key, height, coinbase status) for state integrity.\n2. **Preconditions**: `commitment` and `entry` must be valid references.\n3. **Postconditions**: Returns a 32-byte array representing the domain-specific leaf hash.\n4. **Z Notation (informal)**: $\\text{utxo\\_leaf}(\\text{C}, \\text{E}) = \\text{hash\\_domain}(\\text{\"midwimble.utxo-leaf.v1\"}, [\\text{C}, \\text{H}(\\text{E})])$\n5. **Doc comment**: Generates the cryptographic leaf for an unspent output, committed into the UTXO accumulator.\n\n### `StateRootParts::root(&self) -> [u8; 32]`\n1. **Reasoning**: Computes the final state root hash by combining the roots of all major components (UTXO, Kernel, Chain MMR, Bonds, Relay), ensuring a single commitment to the entire chain state.\n2. **Preconditions**: `self` must be a valid `StateRootParts` instance.\n3. **Postconditions**: Returns a 32-byte array representing the overall state root hash.\n4. **Z Notation (informal)**: $\\text{root}(\\text{S}) = \\text{hash\\_domain}(\\text{\"midwimble.state-root.v1\"}, [\\text{R}_{\\text{UTXO}}, \\text{R}_{\\text{Kernel}}, \\dots])$\n5. **Doc comment**: Computes the final 32-byte state root hash by combining all component roots.\n\n## State Management and Auditing\n\n### `State::genesis() -> Self`\n1. **Reasoning**: Initializes the chain state at height 0, anchoring it to the Bitcoin and midstate genesis blocks using defined constants.\n2. **Preconditions**: None (relies on global constants).\n3. **Postconditions**: Returns a fully initialized `State` object representing the pre-block state.\n4. **Z Notation (informal)**: $\\text{genesis} = \\text{State}(\\text{mw\\_midstate}=\\text{H}_{\\text{genesis}}, \\text{height}=0, \\dots)$\n5. **Doc comment**: Creates the initial, genesis state of the chain at height 0.\n\n### `State::state_root(&self) -> [u8; 32]`\n1. **Reasoning**: Provides the commitment to the current state, used in block headers and checkpoints for verification.\n2. **Preconditions**: `self` must be a valid `State` instance.\n3. **Postconditions**: Returns the 32-byte state root hash.\n4. **Z Notation (informal)**: $\\text{state\\_root}(\\text{S}) = \\text{StateRootParts}(\\text{S}).\\text{root}()$\n5. **Doc comment**: Computes the cryptographic commitment (state root) to the entire current chain state.\n\n### `State::checkpoint_parts(&self) -> StateRootParts`\n1. **Reasoning**: Generates the specific set of state components required for a checkpoint, ensuring the Chain MMR is truncated correctly up to $height-1$.\n2. **Preconditions**: `self` must be a valid `State` instance.\n3. **Postconditions**: Returns a `StateRootParts` structure reflecting the state *before* the current block's hash was appended to the MMR.\n4."}, {"path": "core/walk.rs", "module": "core", "doc": "## Function Documentation\n\n### `new_pad()`\n1. **Reasoning**: Allocates the required 256 KiB scratchpad (`Pad`) on the heap, as it is too large for typical thread stacks, ensuring memory safety and isolation per attempt.\n2. **Preconditions**: None.\n3. **Postconditions**: Returns a `Box<Pad>` initialized with zeros, ready to be used as a scratchpad for a walk attempt.\n4. **Z Notation (informal)**: $\\text{Pad} = \\text{Array}[1..WALK\\_LINES][0..8] \\land \\forall i, j: \\text{Pad}[i][j] = 0$\n5. **Doc comment**: Allocates a scratchpad (`Pad`) on the heap (256 KiB) for a walk attempt.\n\n### `walk_hash(mining_hash: &[u8; 32], nonce: u64) -> [u8; 32]`\n1. **Reasoning**: Provides the primary, thread-local interface for calculating the proof-of-work hash for a given nonce and mining hash, utilizing cached scratchpads when available for performance.\n2. **Preconditions**: `mining_hash` must be exactly 32 bytes. The calling thread must not currently hold an active walk (to prevent re-entry errors).\n3. **Postconditions**: Returns the 32-byte final proof-of-work hash derived from the walk state, and ensures the thread's scratchpad is correctly used or initialized.\n4. **Z Notation (informal)**: $\\text{Hash} = \\text{Walk}(\\text{mining\\_hash}, \\text{nonce}) \\land \\text{Return}(\\text{Hash})$\n5. **Doc comment**: Calculates the proof-of-work hash for a given nonce over the mining hash using the thread's scratchpad.\n\n### `walk_with_pad(mining_hash: &[u8; 32], nonce: u64, pad: &mut Pad) -> [u8; 32]`\n1. **Reasoning**: Allows external callers to run a walk using a scratchpad they own (not thread-local), facilitating testing and controlled environments. It selects the optimal hardware backend (AES-NI/ARMv8 or portable).\n2. **Preconditions**: `mining_hash` must be 32 bytes. `pad` must be a valid, initialized `Pad`.\n3. **Postconditions**: Returns the 32-byte final proof-of-work hash, using the provided `pad` throughout the walk.\n4. **Z Notation (informal)**: $\\text{Hash} = \\text{Walk}(\\text{mining\\_hash}, \\text{nonce}, \\text{pad}) \\land \\text{Return}(\\text{Hash})$\n5. **Doc comment**: Calculates the proof-of-work hash using a caller-owned scratchpad, selecting the fastest available AES backend.\n\n### `walk_hash_portable(mining_hash: &[u8; 32], nonce: u64) -> [u8; 32]`\n1. **Reasoning**: Provides a deterministic, portable reference implementation that always uses the generic `SoftAes` backend, ensuring results are identical across all hardware for verification purposes.\n2. **Preconditions**: `mining_hash` must be exactly 32 bytes.\n3. **Postconditions**: Returns the 32-byte final proof-of-work hash using the portable implementation.\n4. **Z Notation (informal)**: $\\text{Hash} = \\text{Walk}_{\\text{SoftAes}}(\\text{mining\\_hash}, \\text{nonce}) \\land \\text{Return}(\\text{Hash})$\n5. **Doc comment**: Calculates the proof-of-work hash using a portable, generic implementation (`SoftAes`) for cross-platform verification.\n\n### `walk_start(mining_hash: &[u8; 32], nonce: u64, pad: &mut Pad) -> WalkState`\n1. **Reasoning**: Initializes the walk state (registers $r$, program $prog$) and seeds the scratchpad (`pad`) using BLAKE3-XOF based on the mining hash and nonce, providing the starting point for a walk.\n2. **Preconditions**: `mining_hash` must be 32 bytes. `pad` must be a valid, initialized `Pad`.\n3. **Postconditions**: Returns a `WalkState` containing the initial registers, program, and $c=0$, and ensures the first 128 bytes of the scratchpad are populated via AES rounds.\n4. **Z Notation (informal)**: $\\text{State} = \\text{Init}(\\text{mining\\_hash}, \\text{nonce}) \\land \\text{Pad}_{\\text{init}} = \\text{AES}(\\text{seed}) \\land \\text{Return}(\\text{State})$\n5. **Doc comment**: Seeds the walk for a given nonce and grows the scratchpad (`pad`) using BLAKE3 and AES, returning the initial `WalkState`.\n\n### `walk_steps(st: &mut WalkState, pad: &mut Pad, n: usize)`\n1. **Reasoning**: Executes $n$ sequential steps of the walk, updating the state registers and scratchpad. It handles the periodic re-mixing of registers and program state.\n2. **Preconditions**: `st.steps + n` must not exceed `WALK_STEPS`. `pad` must be a valid, initialized `Pad`.\n3. **Postconditions**: The `WalkState` (`st`) is updated with the new registers, program, and step count. The `pad` is modified by $n$ steps, and re-mixing occurs if $\\text{steps} \\pmod{\\text{WALK\\_REMIX}} = 0$.\n4. **Z Notation (informal)**: $\\text{State}' = \\text{Step}^n(\\text{State}) \\land \\text{Pad}' = \\text{Update}(\\text{Pad}, n) \\land \\text{Return}(\\text{State}', \\text{Pad}')$\n5. **Doc comment**: Runs $n$ sequential steps of the walk, updating the `WalkState` and modifying the scratchpad (`pad`). Handles periodic re-mixing.\n\n### `apply_op(op: u8, v: u64, k: u64) -> (u64, u64)`\n1. **Reasoning**: Implements the core arithmetic operations defined by the walk (multiplication, division, AES round, rotation, etc.). It returns the result $y$ and the high 64 bits ($h$) if an AES operation was performed.\n2. **Preconditions**: `op` must be one of $\\{0, 1, 2, 3, 4, 5, 6, 7\\}$. $v$ and $k$ are 64-bit words.\n3. **Postconditions**: Returns a tuple $(y, h)$, where $y$ is the result of the operation, and $h$ is non-zero only if $op=3$ (AES round).\n4. **Z Notation (informal)**: $\\text{Result} = \\text{Op}(op, v, k) \\land \\text{Return}(y, h)$\n5. **Doc comment**: Applies the specified walk operation (`op`) to words $v$ and $k$, returning the result and the high 64 bits (relevant for AES).\n\n***\n\n*(Note: Many internal functions like `step`, `round_indexed`, `remix`, `program`, etc., are highly optimized, low-level implementation details of the walk definition. Their documentation is implicitly covered by the public API and the detailed description in the module header, but they are not documented here unless they were part of the public interface.)*\n\n## Function Documentation\n\n### `step_inputs`\n\n**Reasoning**: This function calculates all necessary inputs for a single step of the walk process, based on the current state (`st`) and the padding data (`pad`). It decodes the current register state into specific indices and values required by the operational logic.\n**Preconditions**:\n1. `st` must be a valid `WalkState` representing a point within the walk.\n2. `pad` must be a valid `Pad` containing pre-computed lookup values for the step.\n**Postconditions**:\n1. Returns a `StepInputs` structure containing the current step index (`s`), operation code (`op`), derived indices (`t`, `j`, `e`, `b`, `f`), the required word data (`m`), and the input values (`x`, `k`, `v`).\n2. The returned values are consistent with the walk's state transition logic.\n**Z Notation (informal)**: $\\exists \\text{StepInputs} : \\text{StepInputs} = \\text{derive\\_inputs}(\\text{st}, \\text{pad})$\n**Doc comment**:\n```rust\n/// Calculates all necessary inputs for the next step of the walk based on the current state and padding.\npub fn step_inputs(st: &WalkState, pad: &Pad) -> StepInputs { ... }\n```\n\n### `remix_of`\n\n**Reasoning**: This function performs the register remix operation, which resets and reconfigures the walk state periodically (`WALK_REMIX` steps). It takes the current register array and computes the new registers and the corresponding program code.\n**Preconditions**:\n1. `r` must be a valid array of 8 `u64` registers representing the current walk state.\n**Postconditions**:\n1. Returns a tuple containing the new register array (`[u64; 8]`) and the new program code (`[u8; 8]`).\n2. The new state is guaranteed to be different from the input state, and the program code is a permutation of $\\{0, 1, \\dots, 7\\}$.\n**Z Notation (informal)**: $\\exists (\\text{r}', \\text{p}') : (\\text{r}', \\text{p}') = \\text{remix}(\\text{r})$\n**Doc comment**:\n```rust\n/// Performs the register remix operation, yielding the new registers and program code.\npub fn remix_of(r: &[u64; 8]) -> ([u64; 8], [u8; 8]) { ... }\n```\n\n### `walk_finish`\n\n**Reasoning**: This function computes the final proof-of-work hash after all steps of a walk have been executed. It takes the initial mining hash, the nonce, and the final register state to produce the required 32-byte output.\n**Preconditions**:\n1. `mining_hash` must be a valid 32-byte input hash.\n2. `nonce` must be the specific nonce used for this walk.\n3. `r` must be the final register state after all steps are complete.\n**Postconditions**:\n1. Returns the final 32-byte hash, which is deterministically derived from the inputs and the final registers.\n**Z Notation (informal)**: $\\text{Hash} = \\text{finish}(\\text{mining\\_hash}, \\text{nonce}, \\text{r})$\n**Doc comment**:\n```rust\n/// Computes the proof-of-work hash of a walk whose steps have all run, using the final register state.\npub fn walk_finish(mining_hash: &[u8; 32], nonce: u64, r: &[u64; 8]) -> [u8; 32] { ... }\n```\n\n### `aes_round_pair`\n\n**Reasoning**: This function provides a portable, non-hardware-accelerated implementation of a single AES round (`AESENC`). It is used primarily for cross-checking against hardware implementations (AES-NI/ARMv8) and for verification in proof-of-work contexts where secrecy is not required.\n**Preconditions**:\n1. `lo` and `hi` must be 64-bit words representing the lower and upper halves of a 128-bit state block.\n**Postconditions**:\n1. Returns a tuple `(u64, u64)` representing the new lower and upper halves of the state after one AES round under a zero key.\n2. The result is mathematically equivalent to the output of `SoftAes::round` when applied to the corresponding 16-byte state block.\n**Z Notation (informal)**: $\\exists (\\text{lo}', \\text{hi}') : (\\text{lo}', \\text{hi}') = \\text{aes\\_round}(\\text{lo}, \\text{hi})$\n**Doc comment**:\n```rust\n/// Computes one AES round (`AESENC`) of a 128-bit state (lo || hi) under a zero key, using portable lookup tables.\npub fn aes_round_pair(lo: u64, hi: u64) -> (u64, u64) { ... }\n```\n\n### `program_of`\n\n**Reasoning**: This function translates a 64-bit integer (`z`) into the specific 8-element program code (`[u8; 8]`) that dictates which operation each of the 8 registers will execute during a step. This is crucial for deterministic walk execution and verification.\n**Preconditions**:\n1. `z` must be a valid 64-bit integer used as an input to the program generation logic.\n**Postconditions**:\n1. Returns an array `[u8; 8]` where each element is an operation code (0-7).\n2. The returned program code is guaranteed to be a permutation of $\\{0, 1, \\dots, 7\\}$.\n**Z Notation (informal)**: $\\text{P} = \\text{program}(\\text{z}) \\land \\text{P} \\in S_8$\n**Doc comment**:\n```rust\n/// Decodes a 64-bit integer into the 8-element program code, defining the operation for each register.\npub fn program_of(z: u64) -> [u8; 8] { ... }\n```\n\n***\n\n### Hardware Acceleration Wrappers (Summary)\n\nThe functions defined within `x86::*` and `arm::*` (e.g., `walk`, `start`, `time_steps`) are highly optimized, unsafe wrappers that leverage CPU-specific instruction sets (AES-NI for x86\\_64, AES/NEON for aarch64).\n\n**Note**: These functions require specific target features (`#[target_feature]`) and rely on the caller ensuring the CPU supports the required extensions. They delegate the core logic to generic implementations (`walk_generic`, etc.).\n\n**Safety Precondition (All Hardware Functions)**: The target CPU must support the corresponding AES instruction set (AES-NI or ARMv8 AES extension).\n\n**Doc comment Example (x86)**:\n```rust\n/// Executes the walk using AES-NI instructions for maximum performance.\n/// # Safety\n/// The CPU must support AES-NI and SSE2.\n#[target_feature(enable = \"aes,sse2\")]\npub unsafe fn walk(m: &[u8; 32], nonce: u64, pad: &mut super::Pad) -> [u8; 32] { ... }\n```"}, {"path": "core/wots.rs", "module": "core", "doc": "## `keygen_seq`\n\n**Reasoning**: This function generates a coin ID (public key) deterministically from a seed (private key). It is optimized for sequential generation within parallel contexts (like MSS tree construction) by leveraging SIMD batch processing, avoiding thread overhead for small batches (18 chains).\n**Preconditions**: `seed` must be a 32-byte array. The underlying `wots_simd::process_wots_batch` must be available and correctly implemented.\n**Postconditions**: Returns a unique, deterministic 32-byte coin ID derived from the seed.\n**Z Notation (informal)**: $\\text{CoinID} = \\text{Compress}(\\text{WOTS\\_SIMD}(\\{\\text{chain\\_sk}(\\text{seed}, i)\\}_{i=0}^{17}, \\{\\text{MAX\\_DIGIT}\\}_{i=0}^{17}))$\n**Doc comment**: `/// Generates a coin ID sequentially from a seed, optimized for batch SIMD processing.`\n\n## `chain_sk`\n\n**Reasoning**: This helper function derives the secret key element $sk_i$ for the $i$-th chain. It uses BLAKE3 to ensure that each chain's secret key is uniquely and deterministically derived from the main seed and the chain index $i$.\n**Preconditions**: `seed` must be a 32-byte array. `i` must be within the valid range $[0, \\text{CHAINS}-1]$.\n**Postconditions**: Returns a 32-byte secret key element $sk_i$.\n**Z Notation (informal)**: $sk_i = \\text{BLAKE3}(\\text{seed} \\parallel i)$\n**Doc comment**: `/// Derives the secret key element for chain i using BLAKE3(seed || i).`\n\n## `compress`\n\n**Reasoning**: This function aggregates all 32-byte chain endpoints into a single, fixed-size 32-byte coin ID. This provides a compact and collision-resistant public key representation.\n**Preconditions**: `endpoints` must be an array of $\\text{CHAINS}$ (18) 32-byte hash outputs.\n**Postconditions**: Returns a 32-byte compressed coin ID, which is the BLAKE3 hash of all input endpoints concatenated.\n**Z Notation (informal)**: $\\text{CoinID} = \\text{BLAKE3}(\\text{endpoints}_0 \\parallel \\text{endpoints}_1 \\parallel \\dots \\parallel \\text{endpoints}_{17})$\n**Doc comment**: `/// Compresses all chain endpoints into a single 32-byte coin ID using BLAKE3.`\n\n## `message_digits`\n\n**Reasoning**: WOTS requires the message to be represented as a sequence of small digits (16-bit). This function parses the 32-byte message into $16$ 16-bit big-endian digits.\n**Preconditions**: `msg` must be a 32-byte array.\n**Postconditions**: Returns an array of $\\text{MSG\\_CHAINS}$ (16) `u32` values, where each value represents a 16-bit digit extracted from the message in big-endian order.\n**Z Notation (informal)**: $d_i = \\text{BytesToU16}(\\text{msg}[2i..2i+2])$ for $i \\in [0, 15]$\n**Doc comment**: `/// Parses a 32-byte message into 16 × 16-bit digits (big-endian).`\n\n## `checksum_digits`\n\n**Reasoning**: WOTS requires a checksum to prevent message forgery. This function calculates the 2-digit checksum based on the rule: $\\sum (\\text{MAX\\_DIGIT} - d_i)$. It ensures the total sum fits within 20 bits, encoded into two 16-bit digits.\n**Preconditions**: `msg_digits` must be an array of $\\text{MSG\\_CHAINS}$ (16) message digits.\n**Postconditions**: Returns an array of $\\text{CHECKSUM\\_CHAINS}$ (2) `u32` values representing the high and low 16 bits of the total checksum sum.\n**Z Notation (informal)**: $C = \\sum_{i=0}^{15} (\\text{MAX\\_DIGIT} - d_i)$; $\\text{ChecksumDigits} = (\\lfloor C/2^{16} \\rfloor, C \\bmod 2^{16})$\n**Doc comment**: `/// Computes the 2-digit checksum over the message digits based on the WOTS requirement.`\n\n## `all_digits`\n\n**Reasoning**: This function combines the message digits and the calculated checksum digits into the full vector of $\\text{CHAINS}$ (18) digits required for WOTS processing.\n**Preconditions**: `msg` must be a 32-byte array.\n**Postconditions**: Returns an array of $\\text{CHAINS}$ (18) `u32` values, where the first 16 are message digits and the last 2 are checksum digits.\n**Z Notation (informal)**: $\\text{AllDigits} = (\\text{MessageDigits} \\parallel \\text{ChecksumDigits}(\\text{MessageDigits}))$\n**Doc comment**: `/// Combines message digits and the calculated checksum into the full digit vector (18 digits).`\n\n## `keygen`\n\n**Reasoning**: This is the public entry point for key generation. It delegates to `keygen_seq`, providing a simple, clean interface while maintaining the performance benefits of SIMD batch processing.\n**Preconditions**: `seed` must be a 32-byte array.\n**Postconditions**: Returns a deterministic 32-byte coin ID (public key).\n**Z Notation (informal)**: $\\text{CoinID} = \\text{keygen\\_seq}(\\text{seed})$\n**Doc comment**: `/// Generates a coin ID (public key) from a seed (private key).`\n\n## `sign`\n\n**Reasoning**: This function computes the WOTS signature. For each chain $i$, it calculates $\\text{hash}^{d_i}(sk_i)$, where $d_i$ is the corresponding digit. It uses SIMD to perform all 18 hash chains simultaneously.\n**Preconditions**: `seed` must be a 32-byte array. `message` must be a 32-byte array.\n**Postconditions**: Returns an array of $\\text{CHAINS}$ (18) 32-byte hash outputs, forming the WOTS signature.\n**Z Notation (informal)**: $\\text{Sig}_i = \\text{hash}^{d_i}(\\text{chain\\_sk}(\\text{seed}, i))$ for $i \\in [0, 17]$\n**Doc comment**: `/// Signs a 32-byte message using the seed, computing hash^{d_i}(sk_i) for each chain.`\n\n## `verify`\n\n**Reasoning**: This function verifies the WOTS signature. It calculates the required number of hashes for verification: $\\text{MAX\\_DIGIT} - d_i$. It then applies these hashes to the signature elements and checks if the resulting endpoints compress correctly to the provided coin ID.\n**Preconditions**: `sig` must be a valid array of $\\text{CHAINS}$ (18) 32-byte hash outputs. `message` and `coin_id` must both be 32-byte arrays.\n**Postconditions**: Returns `true` if the signature is valid against the message and coin ID, otherwise `false`.\n**Z Notation (informal)**: $\\text{Verify} \\iff \\text{Compress}(\\text{hash}^{\\text{MAX\\_DIGIT}-d_i}(\\text{Sig}_i)) = \\text{CoinID}$ for all $i$\n**Doc comment**: `/// Verifies a WOTS signature against a message and coin ID by checking endpoint compression.`\n\n## `sig_to_bytes`\n\n**Reasoning**: Provides a serialization mechanism to convert the structured array signature into a contiguous byte vector for storage or transmission.\n**Preconditions**: `sig` must be a valid array of $\\text{CHAINS}$ (18) 32-byte hash outputs.\n**Postconditions**: Returns a `Vec<u8>` exactly $\\text{SIG\\_SIZE}$ (576) bytes long, containing the concatenated signature chunks.\n**Z Notation (informal)**: $\\text{Bytes} = \\text{Concatenate}(\\text{Sig}_0, \\dots, \\text{Sig}_{17})$\n**Doc comment**: `/// Serializes the WOTS signature array into a contiguous byte vector (576 bytes).`\n\n## `sig_from_bytes`\n\n**Reasoning**: Provides a deserialization mechanism to reconstruct the structured signature array from a raw byte vector. Includes length validation for security and correctness.\n**Preconditions**: `bytes` must be a slice of exactly $\\text{SIG\\_SIZE}$ (576) bytes.\n**Postconditions**: Returns `Some` containing the reconstructed 18x32-byte signature array if the length is correct; otherwise, returns `None`.\n**Z Notation (informal)**: $\\text{Sig} = \\text{Chunk}(\\text{Bytes}, 32)$ if $|\\text{Bytes}| = 576$, else $\\text{None}$\n**Doc comment**: `/// Deserializes a WOTS signature from a byte slice, validating the required size (576 bytes).`"}, {"path": "core/wots_simd.rs", "module": "core", "doc": "## Core Constants\n\n*Note: The constants (`IV`, `HASH_FLAGS`, `MSG_SCHEDULE`) are internal implementation details of BLAKE3 and do not require formal method documentation as they are fixed, non-functional data.*\n\n## `SimdLevel`\n\n**Reasoning**: Defines the available hardware acceleration level for WOTS chain processing, mapping specific CPU architectures (x86\\_64, aarch64, wasm32) to their SIMD capabilities.\n**Preconditions**: None.\n**Postconditions**: The enum variant correctly reflects the target architecture's SIMD width (1, 4, or 8 lanes).\n**Z Notation (informal)**: $\\forall L \\in \\text{SimdLevel} \\bullet L.\\text{lanes}() \\in \\{1, 4, 8\\}$\n**Doc comment**: `/// The SIMD execution width selected at runtime (or compile time for WASM/NEON).`\n\n## `SimdLevel::lanes()`\n\n**Reasoning**: Provides a simple interface to retrieve the parallelism factor of the current SIMD backend.\n**Preconditions**: `self` must be a valid `SimdLevel` instance.\n**Postconditions**: Returns the correct number of parallel chains supported by the specific hardware backend (1, 4, or 8).\n**Z Notation (informal)**: $\\text{lanes}(L) = \\begin{cases} 1 & \\text{if } L = \\text{Scalar} \\\\ 4 & \\text{if } L \\in \\{\\text{Wasm128\\_4}, \\text{Neon4}\\} \\\\ 8 & \\text{if } L = \\text{Avx2\\_8} \\end{cases}$\n**Doc comment**: `/// Returns the number of WOTS chains processed in parallel by this backend.`\n\n## `detect()`\n\n**Reasoning**: Determines the optimal SIMD execution level based on compile-time targets (aarch64, wasm32) and runtime checks (x86\\_64 AVX2 support).\n**Preconditions**: The target environment must be runnable (i.e., `std::is_x86_feature_detected` is available if targeting x86\\_64).\n**Postconditions**: Returns a valid `SimdLevel` instance, guaranteed to have at least 1 lane.\n**Z Notation (informal)**: $\\text{detect}() \\in \\text{SimdLevel} \\land \\text{lanes}(\\text{detect}()) \\ge 1$\n**Doc comment**: `/// Detects the best available SIMD level for the current CPU/target.`\n\n## `detected_level()`\n\n**Reasoning**: Provides a thread-safe, cached access point to the detected SIMD level, ensuring detection overhead is paid only once per process.\n**Preconditions**: None.\n**Postconditions**: Returns the globally cached `SimdLevel`. Subsequent calls incur no detection overhead.\n**Z Notation (informal)**: $\\text{detected\\_level}() = \\text{detect}() \\text{ (cached)}$\n**Doc comment**: `/// Returns the cached SIMD level, detecting it on the first call.`\n\n## `scalar_wots_chain(mut val: [u8; 32], iters: usize) -> [u8; 32]`\n\n**Reasoning**: Serves as the scalar fallback for chains that do not fill a full SIMD batch, or for platforms lacking SIMD support. It implements the core WOTS chain iteration using BLAKE3.\n**Preconditions**: `val` must be a valid 32-byte hash output. `iters` must be non-negative.\n**Postconditions**: Returns the hash value after exactly `iters` sequential BLAKE3 compressions. If `iters = 0`, returns `val` unchanged (identity).\n**Z Notation (informal)**: $\\text{scalar\\_wots\\_chain}(v, i) = \\begin{cases} v & \\text{if } i = 0 \\\\ \\mathcal{H}^i(v) & \\text{if } i > 0 \\end{cases}$\n**Doc comment**: `/// Applies `iters` sequential BLAKE3 compressions to `val` and returns the result.`\n\n## `process_wots_batch(inputs: &[[u8; 32]], iters: &[usize]) -> Vec<[u8; 32]>`\n\n**Reasoning**: The primary function for parallel WOTS chain computation. It optimizes performance by sorting chains by iteration count (descending) to minimize \"ghost-hash\" overhead, then processes them in SIMD batches, and finally restores the original input order.\n**Preconditions**: `inputs.len()` must equal `iters.len()`. All elements of `inputs` must be 32-byte hash outputs.\n**Postconditions**: Returns a vector of results, where `results[i]` is the computed chain value for `inputs[i]`, matching the scalar reference. The output order matches the input order.\n**Z Notation (informal)**: $\\text{process\\_wots\\_batch}(I, T) = R \\land \\forall i \\in 0..|I|-1 \\bullet R[i] = \\mathcal{H}^{T[i]}(I[i])$\n**Doc comment**: `/// Processes a batch of WOTS hash chains in parallel using the best available SIMD backend.`\n\n## `verify_pow_batch(inputs: &[[u8; 32]]) -> Vec<[u8; 32]>`\n\n**Reasoning**: Specialized function for Proof-of-Work VDF verification. Unlike `process_wots_batch`, it executes a fixed, large number of iterations (`EXTENSION_ITERATIONS`) without branching inside the SIMD loop to maintain maximum hardware pipeline efficiency (e.g., AVX2).\n**Preconditions**: All elements of `inputs` must be 32-byte hash outputs.\n**Postconditions**: Returns a vector of results where each result is the hash value after exactly `EXTENSION_ITERATIONS` applied to the corresponding input.\n**Z Notation (informal)**: $\\text{verify\\_pow\\_batch}(I) = R \\land \\forall i \\in 0..|I|-1 \\bullet R[i] = \\mathcal{H}^{\\text{ITERS}}(I[i])$\n**Doc comment**: `/// Bare-metal branchless SIMD verifier for Proof-of-Work VDF.`"}], "explorer": [{"path": "explorer/burn.rs", "module": "explorer", "doc": "## Function Documentation\n\n### `BurnIndex::end`\n\n1. **Reasoning**: Determines the current height covered by the stored `rows`. This is crucial for calculating the report's scope relative to the chain tip.\n2. **Preconditions**: The `BurnIndex` must have been initialized and potentially synced.\n3. **Postconditions**: Returns the height immediately following the last block in `self.rows`.\n4. **Z Notation (informal)**: $\\text{end} = \\text{start} + |\\text{rows}|$\n5. **Doc comment**: Gets the height immediately after the last row recorded in the index.\n\n### `BurnIndex::signer`\n\n1. **Reasoning**: Maps a bond ID (a 32-byte hash) to a stable, internal integer index (`u32`). This allows efficient lookup and consistent ranking across reports.\n2. **Preconditions**: The bond ID must be valid.\n3. **Postconditions**: Returns the unique `u32` index for the given bond ID, creating it if not already present in `self.ids` and `self.index`.\n4. **Z Notation (informal)**: $\\text{signer}(\\text{id}) = \\begin{cases} \\text{index}[\\text{id}] & \\text{if } \\text{id} \\in \\text{index} \\\\ |\\text{ids}| & \\text{otherwise, then update } \\text{ids} \\text{ and } \\text{index} \\end{cases}$\n5. **Doc comment**: Maps a bond ID to its internal index, adding the ID if it's new.\n\n### `BurnIndex::sync`\n\n1. **Reasoning**: Ensures the local block history (`self.rows`) is consistent with the chain state provided by `storage` up to `tip`. It handles reorg detection (using `hashes`), pruning (dropping old rows), and catching up (reading new blocks).\n2. **Preconditions**: `storage` must be accessible and contain headers/block records up to `tip`. The index must be initialized.\n3. **Postconditions**: `self.rows`, `self.start`, and `self.hashes` are updated to reflect the latest, non-reorged block history up to `tip`. Returns `Ok(())` on success or an error if storage access fails.\n4. **Z Notation (informal)**: $\\text{sync}(\\text{storage}, \\text{tip}) \\Rightarrow (\\text{rows}', \\text{start}', \\text{hashes}')$ such that $\\text{rows}'$ covers blocks $[\\text{start}', \\text{tip}]$ and $\\text{hashes}'$ matches the final hashes of $\\text{rows}'$.\n5. **Doc comment**: Synchronizes the block rows against the storage up to the given chain tip, handling reorgs and catching up.\n\n### `BurnIndex::report`\n\n1. **Reasoning**: Generates the complete burn tracker report. It first ensures synchronization (`sync`) and then checks if a cached report for the current state exists. If not, it builds the report using `build`.\n2. **Preconditions**: The index must be initialized. `storage` and `state` must reflect the current chain tip.\n3. **Postconditions**: Returns an `Arc<Report>` containing the JSON data for the specific chain state, or a cached version if the state hasn't changed since the last report.\n4. **Z Notation (informal)**: $\\text{report}(\\text{storage}, \\text{state}, \\text{now}) \\Rightarrow \\text{Report}_{\\text{state}}$ where $\\text{Report}_{\\text{state}} = \\text{cache}$ if $\\text{key}(\\text{state}) = \\text{key}(\\text{cache})$, else $\\text{build}(\\text{state}, \\text{now})$.\n5. **Doc comment**: Generates the burn tracker report for the current chain state, utilizing caching to avoid redundant computation.\n\n### `Report::bond`\n\n1. **Reasoning**: Provides a focused view of a single bond's data, extracting relevant metrics (rank, streak, period tallies) from the full JSON report.\n2. **Preconditions**: The `Report` must have been successfully built and contain the bond data in its JSON structure. The input `id` must correspond to a registered bond.\n3. **Postconditions**: Returns a `Value` (JSON object) containing the specific metrics for the requested bond ID, or a minimal structure if the bond is not found/active.\n4. **Z Notation (informal)**: $\\text{bond}(\\text{id}) = \\text{JSON}_{\\text{report}}[\\text{\"bonds\"}][\\text{index}(\\text{id})]$\n5. **Doc comment**: Extracts the detailed metrics for a specific bond ID from the full report.\n\n### `current`\n\n1. **Reasoning**: Acts as the internal coordination function, locking the shared index, retrieving the current chain state, and calling `BurnIndex::report` to generate the necessary data structure (`Arc<Report>`).\n2. **Preconditions**: `index` must be a valid `SharedIndex`. `node` must provide access to the current `State` and `Storage`.\n3. **Postconditions**: Returns an `Arc<Report>` representing the burn tracker state for the chain currently held by `node`.\n4. **Z Notation (informal)**: $\\text{current}(\\text{index}, \\text{node}) \\Rightarrow \\text{Report}_{\\text{state}}$ where $\\text{state} = \\text{node}.\\text{state}()$.\n5. **Doc comment**: Retrieves and generates the current burn tracker report by accessing the shared index and node state.\n\n### `burn` (Public API)\n\n1. **Reasoning**: Implements the main HTTP endpoint (`GET /explorer/burn`). It serves the complete, comprehensive burn tracker report as JSON to external consumers.\n2. **Preconditions**: The `NodeHandle` must be valid and provide access to chain state/storage. The `SharedIndex` must be accessible and locked successfully.\n3. **Postconditions**: Returns an HTTP response with `Content-Type: application/json` containing the full burn report body (`report.body`).\n4. **Z Notation (informal)**: $\\text{burn}(\\text{node}, \\text{index}) \\Rightarrow \\text{Response}_{\\text{JSON}}(\\text{Report}_{\\text{state}})$\n5. **Doc comment**: Handles the `GET /explorer/burn` request, serving the complete burn tracker report as JSON.\n\n### `for_bond` (Public API)\n\n1. **Reasoning**: Implements the specific bond lookup endpoint (`GET /explorer/bond/{id}`). It retrieves the full report internally and then extracts only the data relevant to the requested bond ID.\n2. **Preconditions**: `NodeHandle` and `SharedIndex` must be valid. The input `id` must be a valid bond ID.\n3. **Postconditions**: Returns a JSON `Value` containing the detailed metrics for the specified bond, or an API error if the report generation fails.\n4. **Z Notation (informal)**: $\\text{for\\_bond}(\\text{node}, \\text{index}, \\text{id}) \\Rightarrow \\text{Value}_{\\text{bond}}(\\text{Report}_{\\text{state}}[\\text{id}])$\n5. **Doc comment**: Handles the `GET /explorer/bond/{id}` request, returning the detailed burn metrics for a specific bond ID.\n\n### `emission_series` (Public API)\n\n1. **Reasoning**: Provides time-series data specifically for charting the emission history (`GET /explorer/chart/emission`). It extracts the aggregated daily and k-block tallies from the full report.\n2. **Preconditions**: `NodeHandle` and `SharedIndex` must be valid.\n3. **Postconditions**: Returns a JSON object containing the time-series data (daily/k-block tallies) in the format expected by the emission chart.\n4. **Z Notation (informal)**: $\\text{emission\\_series}(\\text{node}, \\text{index}) \\Rightarrow \\text{JSON}_{\\text{series}}(\\text{Report}_{\\text{state}}[\\text{\"series\"}])$\n5. **Doc comment**: Handles the `GET /explorer/chart/emission` request, returning time-series data (daily and k-block tallies) for scheduled, minted, and withheld subsidies."}], "network": [{"path": "network/addrbook.rs", "module": "network", "doc": "## Function Documentation for `network/addrbook.rs`\n\n### `parse(addr: &str) -> Option<(String, PeerId)>`\n\n**Reasoning**: This function standardizes and validates input address strings. It ensures that the address is a valid `Multiaddr`, contains a specific `PeerId`, and excludes non-trackable transports (like WebRTC direct), allowing the `AddressBook` to operate only on trackable peers.\n**Preconditions**: `addr` must be a non-empty string slice representing a potential network address. The address must contain a valid `PeerId`.\n**Postconditions**: Returns `Some((canonical_addr, peer_id))` if the address is valid and trackable; otherwise, returns `None`.\n**Z Notation (informal)**: $\\text{parse}(\\text{addr}) \\triangleq (\\text{addr} \\in \\text{ValidMultiaddr} \\land \\text{PeerId}(\\text{addr})) \\implies \\text{Some}(\\langle \\text{str}, \\text{PeerId} \\rangle)$\n**Doc comment**: Parses a canonical address string into its string representation and associated `PeerId`, filtering out non-trackable transports.\n\n### `AddressBook::new(saved: impl IntoIterator<Item = (String, bool)>, pinned: &[Multiaddr]) -> Self`\n\n**Reasoning**: Initializes the `AddressBook` state by loading persistent data (`saved`) and operator-defined static addresses (`pinned`). This ensures continuity across restarts.\n**Preconditions**: `saved` must be an iterable collection of `(address_string, is_proven)` tuples. `pinned` must be a slice of valid `Multiaddr`s.\n**Postconditions**: Returns a fully initialized `AddressBook` instance where proven addresses from `saved` are marked as `Proven`, and pinned addresses are correctly registered in the `pinned` vector.\n**Z Notation (informal)**: $\\text{new}(\\text{S}, \\text{P}) \\triangleq \\text{AB} \\mid (\\forall (a, p) \\in \\text{S}: (p \\implies \\text{AB}.\\text{proven}(a)) \\land (\\forall a \\in \\text{P}: \\text{AB}.\\text{pinned\\_contains}(a)))$\n**Doc comment**: Creates a new `AddressBook` instance, loading proven addresses from saved state and registering operator-defined pinned addresses.\n\n### `AddressBook::heard(&mut self, addr: &str) -> bool`\n\n**Reasoning**: Records an address discovered via peer exchange (PEX). It tracks unproven peers, subject to the `MAX_HEARD` limit, allowing the node to later dial them for verification.\n**Preconditions**: `addr` must be a valid, trackable address string. The book must not already contain this address, and the total count of `Heard` entries must be less than `MAX_HEARD`.\n**Postconditions**: If conditions met, the address is inserted into `entries` with `Kind::Heard` and `failures = 0`. Returns `true` if newly added, `false` otherwise.\n**Z Notation (informal)**: $\\text{heard}(\\text{addr}) \\triangleq (\\text{parse}(\\text{addr}) \\land \\neg \\text{exists}(a: \\text{AB}.\\text{entries} \\mid a = \\text{addr}) \\land \\text{AB}.\\text{count}(\\text{Heard}) < \\text{MAX\\_HEARD}) \\implies \\text{AB}.\\text{insert}(\\text{addr}, \\text{Heard})$\n**Doc comment**: Records an address heard from a peer (PEX). Only adds the address if it is new and the `MAX_HEARD` limit has not been reached.\n\n### `AddressBook::proven(&mut self, addr: &str)`\n\n**Reasoning**: Updates the state when the node successfully dials an address and the peer identifies itself as a midwimble node. This promotes the address from `Heard` (if present) or adds it as `Proven`, subject to `MAX_PROVEN`.\n**Preconditions**: `addr` must be a valid, trackable address string. The total count of `Proven` entries must be less than `MAX_PROVEN` if the address is new.\n**Postconditions**: If found, the entry's `kind` is set to `Proven`, and `failures` is reset to 0. If new and capacity allows, it is inserted as `Proven`.\n**Z Notation (informal)**: $\\text{proven}(\\text{addr}) \\triangleq (\\text{parse}(\\text{addr})) \\implies \\text{AB}.\\text{update\\_kind}(\\text{addr}, \\text{Proven}) \\land \\text{AB}.\\text{reset\\_failures}(\\text{addr})$\n**Doc comment**: Marks an address as proven after successful dialing and peer identification. Promotes existing entries or adds new ones, respecting `MAX_PROVEN`.\n\n### `AddressBook::dial_failed(&mut self, addr: &str)`\n\n**Reasoning**: Handles dial failure events. It implements the core retention logic: `Heard` addresses are dropped immediately upon first failure; `Proven` addresses increment a failure counter and are dropped only after reaching `PROVEN_FAILURES_TO_DROP`.\n**Preconditions**: `addr` must be a valid, trackable address string. The entry must exist in `entries`.\n**Postconditions**: If the entry was `Heard`, it is removed. If the entry was `Proven`, its `failures` count is incremented; if this count meets or exceeds `PROVEN_FAILURES_TO_DROP`, the entry is removed.\n**Z Notation (informal)**: $\\text{dial\\_failed}(\\text{addr}) \\triangleq (\\text{exists}(e: \\text{AB}.\\text{entries} \\mid e.\\text{addr} = \\text{addr}) \\land (e.\\text{kind} = \\text{Heard} \\implies \\text{AB}.\\text{remove}(\\text{addr})) \\lor (e.\\text{kind} = \\text{Proven} \\land e.\\text{failures} \\ge \\text{PROVEN\\_FAILURES\\_TO\\_DROP} \\implies \\text{AB}.\\text{remove}(\\text{addr}))$\n**Doc comment**: Increments failure count for an address. Drops `Heard` addresses on first failure, and drops `Proven` addresses after reaching `PROVEN_FAILURES_TO_DROP`.\n\n### `AddressBook::forget_peer(&mut self, peer: &PeerId) -> usize`\n\n**Reasoning**: Allows the node to explicitly forget all addresses associated with a specific peer (e.g., due to banning or foreign status), while preserving pinned addresses that might share the same PeerId but are managed separately.\n**Preconditions**: `peer` must be a valid `PeerId`.\n**Postconditions**: All entries in `entries` matching the given `peer` ID are removed. Returns the count of entries that were removed.\n**Z Notation (informal)**: $\\text{forget\\_peer}(\\text{P}) \\triangleq \\text{count}(\\text{AB}.\\text{entries} \\mid \\text{e}.\\text{peer} = \\text{P}) \\land \\text{AB}.\\text{entries}' = \\{ e \\in \\text{AB}.\\text{entries} \\mid e.\\text{peer} \\ne \\text{P} \\}$\n**Doc comment**: Removes all non-pinned addresses associated with a specific `PeerId`. Returns the number of entries forgotten.\n\n### `AddressBook::pinned(&self) -> &[(String, PeerId)]`\n\n**Reasoning**: Provides read access to the list of addresses explicitly configured by the operator (`--peer`), which are guaranteed never to be dropped by failure logic.\n**Preconditions**: None.\n**Postconditions**: Returns a reference to the internal `pinned` vector containing canonical address strings and their corresponding `PeerId`s.\n**Z Notation (informal)**: $\\text{pinned}(\\text{AB}) \\triangleq \\text{AB}.\\text{pinned}$\n**Doc comment**: Returns a read-only slice of addresses explicitly pinned by the operator (`--peer`), including their resolved `PeerId`.\n\n### `AddressBook::pick(&self, n: usize, skip: impl Fn(&PeerId) -> bool) -> Vec<String>`\n\n**Reasoning**: Implements the peer selection strategy. It prioritizes `Proven` addresses, ensures at least one slot is reserved for an unproven (`Heard`) address if available, and respects the `skip` predicate.\n**Preconditions**: $n > 0$. The `skip` function must correctly identify peers to ignore.\n**Postconditions**: Returns a vector of up to $n$ canonical address strings, prioritizing proven peers, followed by heard peers, while respecting the minimum heard slot requirement and the `skip` filter.\n**Z Notation (informal)**: $\\text{pick}(\\text{n}, \\text{S}) \\triangleq \\text{Select}(\\text{Proven} \\cup \\text{Heard}) \\mid |\\text{Result}| \\le n \\land (\\text{Count}(\\text{Heard} \\in \\text{Result}) \\ge \\max(1, \\lfloor n/3 \\rfloor) \\text{ if } \\text{Heard} \\ne \\emptyset)$\n**Doc comment**: Selects up to $n$ addresses for dialing. Prioritizes proven peers, ensures a minimum slot for unproven peers (if available), and respects the `skip` predicate.\n\n### `AddressBook::to_save(&self) -> Vec<String>`\n\n**Reasoning**: Generates the persistent state required for recovery. Only proven addresses are saved, as heard addresses are transient and must be relearned.\n**Preconditions**: None.\n**Postconditions**: Returns a sorted vector of canonical address strings corresponding exclusively to entries marked `Kind::Proven`.\n**Z Notation (informal)**: $\\text{to\\_save}(\\text{AB}) \\triangleq \\text{Sort}(\\{ a \\mid a \\in \\text{AB}.\\text{entries} \\land \\text{AB}.\\text{entries}[a].\\text{kind} = \\text{Proven} \\})$\n**Doc comment**: Returns a sorted list of canonical address strings for all proven peers, suitable for persistence across sessions.\n\n### `AddressBook::counts(&self) -> (usize, usize)`\n\n**Reasoning**: Provides a simple view of the current state distribution, useful for monitoring and bounding checks.\n**Preconditions**: None.\n**Postconditions**: Returns a tuple `(proven_count, heard_count)` reflecting the number of entries in each kind.\n**Z Notation (informal)**: $\\text{counts}(\\text{AB}) \\triangleq \\langle \\text{AB}.\\text{count}(\\text{Proven}), \\text{AB}.\\text{count}(\\text{Heard}) \\rangle$\n**Doc comment**: Returns a tuple containing the current count of proven and heard addresses.\n\n### `AddressBook::count(&self, kind: Kind) -> usize`\n\n**Reasoning**: Internal helper function to efficiently determine the number of entries belonging to a specific `Kind`.\n**Preconditions**: `kind` must be either `Kind::Proven` or `Kind::Heard`.\n**Postconditions**: Returns the total count of entries matching the specified `kind`.\n**Z Notation (informal)**: $\\text{count}(\\text{AB}, \\text{K}) \\triangleq |\\{ e \\in \\text{AB}.\\text{entries} \\mid e.\\text{kind} = \\text{K} \\}|$\n**Doc comment**: Internal helper to count the number of entries matching a specific address kind."}, {"path": "network/amino.rs", "module": "network", "doc": "## `rendezvous_key`\n\n**Reasoning**: This function calculates a deterministic, network-specific DHT rendezvous key. It must be computable by any node with minimal state (only its compiled-in identity anchor) to ensure all nodes on a given network partition find the same provider record, regardless of chain state or peer count.\n\n**Preconditions**:\n* `anchor` must be the 32-byte compiled-in network identity constant for the specific network instance.\n\n**Postconditions**:\n* The returned `kad::RecordKey` is deterministic based solely on `anchor` and `RENDEZVOUS_LABEL`.\n* The key decodes as a well-formed BLAKE3 multihash (`0x1e` code, 32-byte digest).\n* The resulting key size is 34 bytes.\n\n**Z Notation (informal)**:\n```text\nrendezvous_key(anchor) = ⟨0x1e⟩ ⌢ ⟨0x20⟩ ⌢ BLAKE3(anchor ⌢ RENDEZVOUS_LABEL)\n```\n\n**Doc comment**:\n```rust\n/// Derives the deterministic DHT rendezvous key from the network's identity anchor.\npub fn rendezvous_key(anchor: &[u8; 32]) -> kad::RecordKey { /* ... */ }\n```\n\n## `AminoHandle::announce`\n\n**Reasoning**: This method publishes the node's directly dialable addresses as a provider record for the rendezvous key on the public IPFS DHT. This is the mechanism by which new, external nodes can discover Midstate peers without relying on internal infrastructure.\n\n**Preconditions**:\n* `addrs` must contain only directly routable addresses (e.g., `/ip4/`, not `/p2p-circuit`).\n* `addrs` must not be empty.\n* The caller must ensure the node's NAT status is not private (i.e., externally reachable).\n\n**Postconditions**:\n* If the command queue is not full, a `AminoCommand::Announce` is queued for the background task.\n* Eventually, the node's provider store will contain the rendezvous key mapped to the self-ID and the provided addresses, valid for the DHT TTL.\n* If the queue is full, the request is silently dropped and retried on the next tick.\n\n**Z Notation (informal)**:\n```zed\nAminoAnnounce\n----------------\nΔProviderStore\nkey?   : Multihash\naddrs? : seq Multiaddr\nself   : PeerId\n\npre  nat_status ≠ Private\npre  #addrs? > 0\n\npost providers' = providers ⊕ {key? ↦ (self, addrs?, now + TTL)}\npost ∀ k ∈ dom providers • k ≠ key? ⇒ providers'(k) = providers(k)\n```\n\n**Doc comment**:\n```rust\n/// Publishes this node as a provider of the rendezvous key, advertising the given directly-dialable addresses.\npub fn announce(&self, addrs: Vec<Multiaddr>) { /* ... */ }\n```\n\n## `AminoHandle::discover`\n\n**Reasoning**: This method triggers a DHT query for the rendezvous key. It is designed to be called only when the node is peer-starved, preventing unnecessary load on the public IPFS commons.\n\n**Preconditions**:\n* The node's current outbound peer count must be less than `TARGET_OUTBOUND_PEERS`.\n\n**Postconditions**:\n* A `AminoCommand::Discover` is queued for the background task.\n* Eventually, if providers are found, the results (PeerIds) are resolved into a list of dialable addresses (`Vec<String>`) and sent asynchronously via the discovery channel.\n* The provider store is read-only and remains unchanged by this operation.\n* The returned address list size is capped at `MAX_ADDRS_PER_ROUND`.\n\n**Z Notation (informal)**:\n```zed\nAminoDiscover\n----------------\nΞProviderStore\nkey?   : Multihash\naddrs! : seq Multiaddr\n\npre  outbound_peer_count < TARGET_OUTBOUND_PEERS\n\npost addrs! = { a | ∃ p • (key? ↦ p) ∈ providers ∧ a ∈ addr_of(p) ∧ p ≠ self }\npost #addrs! ≤ MAX_ADDRS_PER_ROUND\n```\n\n**Doc comment**:\n```rust\n/// Queries the rendezvous key for other Midstate nodes, only if peer-starved.\npub fn discover(&self) { /* ... */ }\n```\n\n## `spawn`\n\n**Reasoning**: This function initializes and starts the isolated Amino Swarm in a background Tokio task. It uses the node's existing identity to ensure that the PeerId advertised in the DHT matches the main Midstate listener, allowing for seamless dial-up. The isolation (separate Swarm) prevents foreign peers from interacting with the core Midstate network.\n\n**Preconditions**:\n* `keypair` must be the node's persistent libp2p identity.\n* `anchor` must be the correct 32-byte network identity constant.\n\n**Postconditions**:\n* Returns a tuple containing an `AminoHandle` (for commanding) and an `mpsc::Receiver<Vec<String>>` (for receiving discovered addresses).\n* A background task is spawned, owning an isolated Swarm configured only for `/ipfs/kad/1.0.0`.\n* No inbound listener port is opened by this swarm.\n* If initialization fails, the caller receives `Err`, and discovery is not attempted (non-fatal).\n\n**Z Notation (informal)**:\n```text\nspawn(keypair, anchor) = Ok((handle!, rx!)) ⇒\n  a background task owns an isolated Swarm speaking only /ipfs/kad/1.0.0\n  handle!.peer_id = main_swarm.peer_id\n  no listener is opened\n```\n\n**Doc comment**:\n```rust\n/// Starts the isolated Amino rendezvous task, returning a handle and a discovery channel.\npub fn spawn(keypair: Keypair, anchor: [u8; 32]) -> Result<(AminoHandle, mpsc::Receiver<Vec<String>>)> { /* ... */ }\n```\n\n## `seed_bootstrap`\n\n**Reasoning**: This function initializes the Amino Swarm's routing table by dialing and adding the hardcoded public IPFS bootstrap peers (`AMINO_BOOTSTRAP`). This establishes the initial connectivity required for the DHT to function, relying on a diverse, non-Midstate infrastructure.\n\n**Preconditions**:\n* `swarm` must be a mutable reference to the isolated Amino Swarm.\n\n**Postconditions**:\n* For every valid entry in `AMINO_BOOTSTRAP`, the corresponding peer ID is added to the routing table, and a dial attempt is initiated.\n* Returns the count of successfully added bootstrap peers.\n* If zero peers are added, DHT discovery is logged as inoperable for the session but does not block startup.\n\n**Z Notation (informal)**:\n```text\nseed_bootstrap(swarm) = count! ⇒\n  ∀ a ∈ AMINO_BOOTSTRAP • parses(a) ∧ has_peer_id(a) ⇒ (peer_id(a) ↦ a) ∈ routing_table'\n  count! = number of entries successfully added\n```\n\n**Doc comment**:\n```rust\n/// Seeds the Amino DHT routing table with the public, independent bootstrap fleet.\nfn seed_bootstrap(swarm: &mut Swarm<AminoBehaviour>) -> usize { /* ... */ }\n```\n\n## `resolve_addrs`\n\n**Reasoning**: Kademlia's `GetProvidersOk::FoundProviders` only returns PeerIds. This function queries the local routing table (kbuckets) using those PeerIds to find the actual, dialable Multiaddr entries. It ensures that the returned addresses carry an explicit `/p2p/<id>` suffix for later identity verification by the main Midstate swarm.\n\n**Preconditions**:\n* `providers` must be a set of PeerIds found via DHT query.\n* `local` must be the node's own PeerId.\n\n**Postconditions**:\n* Returns a vector of unique, dialable address strings (`Vec<String>`).\n* All returned addresses are associated with a provider in the input set and are not the local node.\n* The resulting list size is capped at `MAX_ADDRS_PER_ROUND`.\n* Every returned address string explicitly contains the `/p2p/<id>` suffix corresponding to the provider.\n\n**Z Notation (informal)**:\n```zed\nresolve_addrs(swarm, providers, local) = addrs! ⇒\n  addrs! = { a ⌢ /p2p/p | p ∈ providers ∧ p ≠ local ∧ a ∈ routing_table(p) }\n  #addrs! ≤ MAX_ADDRS_PER_ROUND\n  ∀ a ∈ addrs! • a carries an explicit peer id\n```\n\n**Doc comment**:\n```rust\n/// Resolves provider PeerIds into dialable multiaddrs by querying the local routing table.\nfn resolve_addrs(swarm: &mut Swarm<AminoBehaviour>, providers: &HashSet<PeerId>, local: &PeerId) -> Vec<String> { /* ... */ }\n```\n\n## `strip_peer_id`\n\n**Reasoning**: The `Swarm::add_external_address` method requires a transport address without the peer ID suffix. Since libp2p automatically appends the PeerId when building provider records, we must strip this suffix to prevent creating an unparseable, doubled-suffix address.\n\n**Preconditions**:\n* `addr` must be a valid `Multiaddr`.\n\n**Postconditions**:\n* Returns a new `Multiaddr` identical to the input, but with all `/p2p/<id>` components removed.\n* If the input address did not contain a `/p2p/<id>` component, the output is identical to the input.\n\n**Z Notation (informal)**:\n```text\nstrip_peer_id(addr) = addr' ⇒\n  addr' = addr ⊓ ¬ contains_p2p_suffix(addr)\n  addr' = addr ⊓ contains_p2p_suffix(addr) ∧ remove_p2p_suffix(addr)\n```\n\n**Doc comment**:\n```rust\n/// Removes a trailing `/p2p/<id>` component from a Multiaddr, required for `add_external_address`.\nfn strip_peer_id(addr: Multiaddr) -> Multiaddr { /* ... */ }\n```"}, {"path": "network/bans.rs", "module": "network", "doc": "## Constants\n\n### `MAX_BAN`\n1. **Reasoning**: Defines the absolute upper limit for how long any ban can last, preventing unbounded duration escalation.\n2. **Preconditions**: None.\n3. **Postconditions**: The maximum ban duration is fixed at 24 hours.\n4. **Z Notation (informal)**: $\\text{MAX\\_BAN} = 24 \\text{ hours}$\n5. **Doc comment**: `/// The longest a ban grows to by doubling. A longer base (an operator's choice) is kept as it is.`\n\n### `FORGET_AFTER`\n1. **Reasoning**: Determines how long a peer's record is retained *after* its final ban has expired, allowing for subsequent bans to correctly escalate duration.\n2. **Preconditions**: None.\n3. **Postconditions**: Records are eligible for removal only after this duration has passed since the ban ended.\n4. **Z Notation (informal)**: $\\text{FORGET\\_AFTER} = 24 \\text{ hours}$\n5. **Doc comment**: `/// How long after its last ban ends a peer's record is kept, so that a peer banned again soon after gets a longer ban.`\n\n### `MAX_RECORDS`\n1. **Reasoning**: Implements a memory bound on the number of tracked peers, ensuring the state structure remains manageable even with many transient bans.\n2. **Preconditions**: None.\n3. **Postconditions**: The number of records in `Bans` will never exceed this limit after garbage collection (`gc`) runs.\n4. **Z Notation (informal)**: $|\\text{Records}| \\le 10,000$\n5. **Doc comment**: `/// Records kept at most. Past this, ended records go first, then the soonest to end.`\n\n## Structs\n\n### `Record`\n1. **Reasoning**: Internal state representation for a single peer's ban history, tracking duration, reason, and escalation count.\n2. **Preconditions**: None.\n3. **Postconditions**: Holds all necessary data to determine if the ban is active and how long it lasts.\n4. **Z Notation (informal)**: $\\text{Record} \\triangleq \\{ \\text{until}: \\text{Option}(\\text{Instant}), \\text{reason}: \\text{String}, \\text{times}: \\mathbb{N} \\}$\n5. **Doc comment**: `/// Internal record tracking a peer's ban history, including expiration time and escalation count.`\n\n### `BannedPeer`\n1. **Reasoning**: Public representation of an active ban, suitable for external state reporting (e.g., `/state`), simplifying the internal `Record` structure.\n2. **Preconditions**: Must be derived from an active `Record`.\n3. **Postconditions**: Contains the peer identifier, reason, and remaining time in seconds (or `None` if permanent).\n4. **Z Notation (informal)**: $\\text{BannedPeer} \\triangleq \\{ \\text{peer}: \\text{String}, \\text{reason}: \\text{String}, \\text{seconds\\_left}: \\text{Option}(\\mathbb{N}) \\}$\n5. **Doc comment**: `/// A banned peer, as `/state` shows it, providing a public view of the ban status.`\n\n### `Bans`\n1. **Reasoning**: The core state manager for all peer bans, utilizing a `HashMap` keyed by `PeerId` for efficient lookup.\n2. **Preconditions**: None.\n3. **Postconditions**: Maintains a consistent set of ban records, ensuring cleanup and bounds are respected.\n4. **Z Notation (informal)**: $\\text{Bans} \\triangleq \\{ \\text{records}: \\text{HashMap}(\\text{PeerId}, \\text{Record}) \\}$\n5. **Doc comment**: `/// Manages the state of all banned peers, handling escalation and record cleanup.`\n\n## Methods\n\n### `Bans::ban`\n1. **Reasoning**: Applies a new ban, calculating the duration based on previous bans (escalation) up to `MAX_BAN`.\n2. **Preconditions**: `now` must be the current time used for calculating expiration. The peer must not have a permanent (`until: None`) ban already active.\n3. **Postconditions**: A new or updated `Record` is inserted/modified. The returned `Duration` is the length of this specific ban.\n4. **Z Notation (informal)**: $\\text{ban}(\\text{self}, p, r, b, t) \\rightarrow d \\land \\text{self}.\\text{records}[p] = \\text{Record}(t+d, r, \\text{times}+1)$\n5. **Doc comment**: `/// Bans `peer` for `base`, escalating the duration based on previous bans up to [`MAX_BAN`]. Returns the calculated ban duration.`\n\n### `Bans::ban_for_good`\n1. **Reasoning**: Allows permanent banning, overriding time-based expiration and preventing future escalation attempts.\n2. **Preconditions**: None.\n3. **Postconditions**: A new `Record` is inserted where `until` is `None`.\n4. **Z Notation (informal)**: $\\text{ban\\_for\\_good}(\\text{self}, p, r) \\rightarrow \\text{self}.\\text{records}[p] = \\text{Record}(\\text{None}, r, 1)$\n5. **Doc comment**: `/// Bans `peer` permanently until the node restarts (until `until` is None).`\n\n### `Bans::is_banned`\n1. **Reasoning**: Provides a simple check for current ban status by comparing the expiration time against the current time.\n2. **Preconditions**: The `PeerId` must exist in `records`, or the function returns false. `now` must be accurate.\n3. **Postconditions**: Returns `true` if the record exists and the expiration time (`until`) is in the future (or if it's a permanent ban, which is handled by the logic). *Correction*: The implementation treats `None` as always banned, and checks `now < t` for `Some(t)`.\n4. **Z Notation (informal)**: $\\text{is\\_banned}(\\text{self}, p, t) \\iff (\\text{self}.\\text{records}[p] \\text{ exists}) \\land (\\text{self}.\\text{records}[p].\\text{until} = \\text{None} \\lor t < \\text{self}.\\text{records}[p].\\text{until})$\n5. **Doc comment**: `/// Checks if `peer` is currently banned at time `now`.`\n\n### `Bans::reason`\n1. **Reasoning**: Retrieves the specific reason for a ban, only if the peer is currently active in the ban list.\n2. **Preconditions**: The peer must be currently banned according to `is_banned(peer, now)`.\n3. **Postconditions**: Returns `Some(&str)` containing the reason, or `None` if not banned.\n4. **Z Notation (informal)**: $\\text{reason}(\\text{self}, p, t) = \\text{self}.\\text{records}[p].\\text{reason} \\text{ if } \\text{is\\_banned}(\\text{self}, p, t) \\text{ else } \\text{None}$\n5. **Doc comment**: `/// Returns the reason for the ban if the peer is currently banned at time `now`.`\n\n### `Bans::active`\n1. **Reasoning**: Generates a sorted list of all currently active bans, ordered by the soonest expiration time (to facilitate network healing/prioritization).\n2. **Preconditions**: `now` must be the current time for accurate duration calculation.\n3. **Postconditions**: Returns a `Vec<BannedPeer>` containing only active bans, sorted ascending by `seconds_left`.\n4. **Z Notation (informal)**: $\\text{active}(\\text{self}, t) = \\text{SortBy}(\\{\\text{p} \\mid \\text{is\\_banned}(\\text{self}, p, t)\\}, \\text{seconds\\_left})$\n5. **Doc comment**: `/// Returns a sorted list of currently active banned peers, ordered by soonest expiration time.`\n\n### `Bans::gc` (Internal)\n1. **Reasoning**: Performs garbage collection: removes expired records and enforces the `MAX_RECORDS` limit by prioritizing removal of ended records first, then those expiring soonest.\n2. **Preconditions**: None.\n3. **Postconditions**: All records are either active, permanent, or scheduled to remain for `FORGET_AFTER`. The total number of records is $\\le \\text{MAX\\_RECORDS}$.\n4. **Z Notation (informal)**: $\\text{gc}(\\text{self}, t) \\implies |\\text{self}.\\text{records}| \\le \\text{MAX\\_RECORDS} \\land (\\forall r \\in \\text{self}.\\text{records}: r.\\text{until} = \\text{None} \\lor t < r.\\text{until} + \\text{FORGET\\_AFTER})$\n5. **Doc comment**: `/// Garbage collects expired records and enforces the maximum record count, prioritizing removal of ended bans.`\n\n### `escalate` (Helper)\n1. **Reasoning**: Calculates the ban duration by doubling the base duration for each previous ban, capped at `MAX_BAN`, unless the original `base` was already longer than `MAX_BAN`.\n2. **Preconditions**: `times` must be $\\ge 1$.\n3. **Postconditions**: Returns a `Duration` that is $2^{\\text{times}-1} \\times \\text{base}$, capped by $\\text{MAX\\_BAN}$ (or $\\text{base}$ if longer).\n4. **Z Notation (informal)**: $\\text{escalate}(b, n) = \\min(2^{n-1} \\cdot b, \\max(\\text{MAX\\_BAN}, b))$\n5. **Doc comment**: `/// Calculates the escalated ban duration: base doubled for each previous ban, capped at [`MAX_BAN`] unless base is longer.`"}, {"path": "network/light_protocol.rs", "module": "network", "doc": "## Protocol Constants\n\n### `LIGHT_PROTOCOL`\n1. **Reasoning**: Defines the specific StreamProtocol identifier used for standard light client requests, allowing libp2p to route messages correctly.\n2. **Preconditions**: None.\n3. **Postconditions**: A valid `StreamProtocol` instance is available for connection establishment.\n4. **Z Notation (informal)**: $\\text{ProtocolID} = \"/midwimble/light/2.0.0\"$\n5. **Doc comment**: The StreamProtocol identifier for standard light client requests (version 2.0.0).\n\n### `LIGHT_PUSH_PROTOCOL`\n1. **Reasoning**: Defines a separate protocol for push notifications (e.g., new block tips), ensuring these asynchronous updates are handled distinctly from request/response cycles.\n2. **Preconditions**: None.\n3. **Postconditions**: A valid `StreamProtocol` instance is available for receiving push notifications.\n4. **Z Notation (informal)**: $\\text{PushProtocolID} = \"/midwimble/light-push/2.0.0\"$\n5. **Doc comment**: The StreamProtocol identifier for asynchronous light client push notifications (version 2.0.0).\n\n## Data Structures\n\n### `LightNotification`\n1. **Reasoning**: Encapsulates events pushed from the node to the client, primarily signaling when a new block tip is available, allowing the client to react without polling.\n2. **Preconditions**: None.\n3. **Postconditions**: A structured notification containing height, target, filter, and hash is created.\n4. **Z Notation (informal)**: $\\text{Notification} \\in \\{\\text{NewBlockTip}(\\text{height}, \\text{target}, \\text{filter\\_hex}, \\text{block\\_hash}, \\text{element\\_count})\\}$\n5. **Doc comment**: Represents an asynchronous notification pushed from the node, typically signaling a new block tip.\n\n### `LightRequest`\n1. **Reasoning**: Defines the complete set of RPC methods required by a MimbleWimble light client (headers, blocks, scan data, UTXOs, etc.). This structure enables standardized request serialization.\n2. **Preconditions**: None.\n3. **Postconditions**: A structured request object is created, ready for serialization and transmission over the stream.\n4. **Z Notation (informal)**: $\\text{Request} \\in \\{\\text{GetState}, \\text{GetHeaders}(\\text{start}, \\text{count}), \\dots, \\text{SubmitTransaction}(\\text{tx\\_hex})\\}$\n5. **Doc comment**: Defines all RPC methods available for the light client to query the node state (e.g., headers, blocks, UTXOs).\n\n### `LightResponse`\n1. **Reasoning**: Standardizes the response format, ensuring that every response includes a success flag (`ok`), optional data, and an optional error message, facilitating robust error handling on the client side.\n2. **Preconditions**: None.\n3. **Postconditions**: A structured response object is created, indicating success or failure along with relevant data/error details.\n4. **Z Notation (informal)**: $\\text{Response} = \\{\\text{ok}: \\text{bool}, \\text{data}: \\text{Option}(\\text{Value}), \\text{error}: \\text{Option}(\\text{String}), \\text{id}: \\text{Option}(\\text{u64})\\}$\n5. **Doc comment**: Standard response structure for all light client requests, including success status, optional data, and error details.\n\n## Methods\n\n### `LightRequest::is_expensive(&self) -> bool`\n1. **Reasoning**: Provides a quick way for the client to identify requests that require significant computational work from the node (e.g., fetching large blocks or filters), allowing for dynamic rate limiting or prioritization.\n2. **Preconditions**: `self` must be a valid instance of `LightRequest`.\n3. **Postconditions**: Returns `true` if the request is resource-intensive, `false` otherwise.\n4. **Z Notation (informal)**: $\\text{is\\_expensive}(\\text{req}) = \\text{True} \\iff \\text{req} \\in \\{\\text{GetFilters}, \\text{GetHeaders}, \\dots, \\text{SubmitTransaction}\\}$\n5. **Doc comment**: Checks if the request requires significant computational work from the node, typically used for rate limiting.\n\n### `read_request_raw<T: AsyncRead + Unpin + Send>(io: &mut T) -> io::Result<LightRequest>`\n1. **Reasoning**: High-level wrapper to read a complete, length-prefixed request from the stream and deserialize it into a `LightRequest`.\n2. **Preconditions**: `io` must be an active, readable stream containing a valid length-prefixed JSON request.\n3. **Postconditions**: Returns the deserialized `LightRequest` or an `io::Error` if reading or parsing fails.\n4. **Z Notation (informal)**: $\\text{read\\_request\\_raw}(\\text{io}) \\rightarrow \\text{LightRequest} \\text{ if } \\text{io} \\text{ contains valid request}$\n5. **Doc comment**: Reads a complete, length-prefixed `LightRequest` from the asynchronous stream.\n\n### `read_request_with_id<T: AsyncRead + Unpin + Send>(io: &mut T) -> io::Result<(Option<u64>, LightRequest)>`\n1. **Reasoning**: Reads a request and simultaneously extracts an optional client-provided request ID (`id`), which is crucial for matching responses to specific requests, especially in environments with reused stream IDs (like WebRTC).\n2. **Preconditions**: `io` must be an active, readable stream containing a valid length-prefixed JSON request, potentially including an `\"id\"` field.\n3. **Postconditions**: Returns a tuple containing the optional request ID and the deserialized `LightRequest`, or an `io::Error`.\n4. **Z Notation (informal)**: $\\text{read\\_request\\_with\\_id}(\\text{io}) \\rightarrow (\\text{Option}(\\text{u64}), \\text{LightRequest}) \\text{ if } \\text{io} \\text{ contains valid request}$\n5. **Doc comment**: Reads a length-prefixed `LightRequest` and extracts the optional client-provided request ID.\n\n### `write_response_raw<T: AsyncWrite + Unpin + Send>(io: &mut T, res: LightResponse) -> io::Result<()>`\n1. **Reasoning**: Serializes a `LightResponse`, prefixes it with the length, writes it to the stream, and crucially calls `io.close().await?` to signal the end of the response to the client.\n2. **Preconditions**: `io` must be an active, writable stream; `res` must be a valid `LightResponse`.\n3. **Postconditions**: The serialized and length-prefixed response is successfully written to `io`, and the write half of the stream is closed.\n4. **Z Notation (informal)**: $\\text{write\\_response\\_raw}(\\text{io}, \\text{res}) \\rightarrow \\text{Success} \\land \\text{io.closed}$\n5. **Doc comment**: Serializes and writes a `LightResponse` to the stream, ensuring the write half is closed afterward.\n\n### `write_request_raw<T: AsyncWrite + Unpin + Send>(io: &mut T, req: &LightRequest) -> io::Result<()>`\n1. **Reasoning**: Serializes a `LightRequest`, prefixes it with the length, and writes it to the stream.\n2. **Preconditions**: `io` must be an active, writable stream; `req` must be a valid `LightRequest`.\n3. **Postconditions**: The serialized and length-prefixed request is successfully written to `io`.\n4. **Z Notation (informal)**: $\\text{write\\_request\\_raw}(\\text{io}, \\text{req}) \\rightarrow \\text{Success}$\n5. **Doc comment**: Serializes and writes a `LightRequest` to the stream, prefixed by its length.\n\n### `read_response_raw<T: AsyncRead + Unpin + Send>(io: &mut T) -> io::Result<LightResponse>`\n1. **Reasoning**: Reads a complete, length-prefixed response from the stream and deserializes it into a `LightResponse`.\n2. **Preconditions**: `io` must be an active, readable stream containing a valid length-prefixed JSON response.\n3. **Postconditions**: Returns the deserialized `LightResponse` or an `io::Error` if reading or parsing fails.\n4. **Z Notation (informal)**: $\\text{read\\_response\\_raw}(\\text{io}) \\rightarrow \\text{LightResponse} \\text{ if } \\text{io} \\text{ contains valid response}$\n5. **Doc comment**: Reads a complete, length-prefixed `LightResponse` from the asynchronous stream.\n\n### `read_length_prefixed<T: AsyncRead + Unpin + Send>(io: &mut T) -> io::Result<Vec<u8>>`\n1. **Reasoning**: Implements the core protocol framing mechanism: reading a 4-byte little-endian length prefix, validating it against `MAX_LIGHT_MSG_SIZE`, and then reading exactly that many bytes.\n2. **Preconditions**: `io` must be an active, readable stream; the stream must contain at least 4 bytes for the length prefix.\n3. **Postconditions**: Returns a `Vec<u8>` containing the message payload, or an `io::Error` if the length is too large, EOF is reached prematurely, or reading fails.\n4. **Z Notation (informal)**: $\\text{read\\_length\\_prefixed}(\\text{io}) \\rightarrow \\text{Payload} \\text{ if } 4 \\le \\text{len} \\le \\text{MAX\\_LIGHT\\_MSG\\_SIZE}$\n5. **Doc comment**: Reads a message payload prefixed by a 4-byte little-endian length, enforcing size limits.\n\n### `write_length_prefixed<T: AsyncWrite + Unpin + Send>(io: &mut T, data: &[u8]) -> io::Result<()>`\n1. **Reasoning**: Implements the core protocol framing mechanism: writing a 4-byte little-endian length prefix followed by the raw data payload. It also closes the write half of the stream.\n2. **Preconditions**: `io` must be an active, writable stream; `data` must be the message payload.\n3. **Postconditions**: The 4-byte length prefix and the data are successfully written to `io`, and the write half of the stream is closed.\n4. **Z Notation (informal)**: $\\text{write\\_length\\_prefixed}(\\text{io}, \\text{data}) \\rightarrow \\text{Success} \\land \\text{io.closed}$\n5. **Doc comment**: Writes a message payload prefixed by its 4-byte little-endian length, and closes the write half of the stream."}, {"path": "network/mod.rs", "module": "network", "doc": "## LightPeerState\n\n### `fn new() -> Self`\n1. **Reasoning**: Initializes a new state tracker for a peer, setting initial reputation (alpha=1, beta=1) and resetting counters.\n2. **Preconditions**: None.\n3. **Postconditions**: A `LightPeerState` instance is created with all counters zeroed/initialized and `window_start` set to the current time.\n4. **Z Notation (informal)**: $\\text{LightPeerState}' = \\text{new}() \\land \\text{request\\_count} = 0 \\land \\text{alpha} = 1$\n5. **Doc comment**: Initializes a new state for tracking light client behavior and reputation.\n\n### `fn honesty(&self) -> f32`\n1. **Reasoning**: Calculates the peer's current reputation score based on the Beta distribution parameters ($\\alpha / (\\alpha + \\beta)$).\n2. **Preconditions**: The state must be initialized ($\\alpha \\ge 1, \\beta \\ge 1$).\n3. **Postconditions**: Returns a float between 0.0 and 1.0 representing the peer's perceived honesty.\n4. **Z Notation (informal)**: $\\text{honesty} = \\frac{\\alpha}{\\alpha + \\beta}$\n5. **Doc comment**: Calculates the peer's honesty score using the Beta distribution ($\\alpha / (\\alpha + \\beta)$).\n\n### `fn current_rate_limit(&self) -> u32`\n1. **Reasoning**: Determines the allowed request rate based on the calculated honesty score, applying a dynamic limit.\n2. **Preconditions**: The state must be initialized.\n3. **Postconditions**: Returns an integer representing the maximum allowed requests within the current window (minimum 5).\n4. **Z Notation (informal)**: $\\text{limit} = \\begin{cases} 5 & \\text{if } \\text{honesty} < 0.1 \\\\ 50 + 450 \\cdot \\text{honesty} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Calculates the dynamic request rate limit based on peer honesty.\n\n### `fn current_expensive_limit(&self) -> u32`\n1. **Reasoning**: Determines the allowed count of expensive requests based on the calculated honesty score.\n2. **Preconditions**: The state must be initialized.\n3. **Postconditions**: Returns an integer representing the maximum allowed expensive requests within the current window (minimum 5).\n4. **Z Notation (informal)**: $\\text{limit} = \\begin{cases} 5 & \\text{if } \\text{honesty} < 0.2 \\\\ 20 + 200 \\cdot \\text{honesty} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Calculates the dynamic limit for expensive requests based on peer honesty.\n\n### `fn maybe_reset_window(&mut self)`\n1. **Reasoning**: Periodically resets request counters and decrements violations if the defined time window (`LIGHT_RATE_WINDOW_SECS`) has elapsed, allowing temporary chatty behavior to fade.\n2. **Preconditions**: The state must be initialized.\n3. **Postconditions**: If the window has expired, `request_count` and `expensive_count` are reset to 0, and `window_start` is updated. `violations` is decremented (saturating).\n4. **Z Notation (informal)**: $\\text{elapsed} \\ge \\text{WINDOW} \\implies (\\text{request\\_count} := 0 \\land \\text{expensive\\_count} := 0 \\land \\text{violations} := \\max(0, \\text{violations} - 1))$\n5. **Doc comment**: Resets request counters and decrements violations if the rate limit window has elapsed.\n\n### `fn is_banned(&self) -> bool`\n1. **Reasoning**: Checks if the current ban period is active.\n2. **Preconditions**: The state must be initialized.\n3. **Postconditions**: Returns `true` if `Instant::now()` is before `banned_until`, otherwise `false`.\n4. **Z Notation (informal)**: $\\text{is\\_banned} = \\text{banned\\_until} \\ne \\text{None} \\land \\text{Instant::now()} < \\text{banned\\_until}$\n5. **Doc comment**: Checks if the peer is currently under a temporary ban.\n\n### `fn clear_served_ban(&mut self)`\n1. **Reasoning**: Resets the ban status and violation count immediately after the ban duration has expired, preventing permanent outages for honest peers.\n2. **Preconditions**: The state must have a defined `banned_until` time.\n3. **Postconditions**: If the ban period is over, `banned_until` is set to `None`, and `violations` are reset to 0.\n4. **Z Notation (informal)**: $\\text{banned\\_until} \\ne \\text{None} \\land \\text{Instant::now()} \\ge \\text{banned\\_until} \\implies (\\text{banned\\_until} := \\text{None} \\land \\text{violations} := 0)$\n5. **Doc comment**: Clears the ban status and resets violations once the ban duration has expired.\n\n### `fn strike(&mut self) -> bool`\n1. **Reasoning**: Increments the violation count and checks if the threshold is reached, applying a temporary ban if necessary.\n2. **Preconditions**: The state must be initialized.\n3. **Postconditions**: `violations` is incremented. Returns `true` if the ban threshold (`LIGHT_BAN_THRESHOLD`) was met, setting `banned_until`; otherwise, returns `false`.\n4. **Z Notation (informal)**: $\\text{violations} := \\text{violations} + 1 \\land (\\text{violations} \\ge \\text{THRESHOLD}) \\implies (\\text{banned\\_until} := \\text{NOW} + \\text{DURATION}; \\text{return True})$\n5. **Doc comment**: Increments the violation count. If the threshold is reached, applies a temporary ban and returns `true`.\n\n## LightGuard\n\n### `fn new() -> Self`\n1. **Reasoning**: Creates the guard structure, initializing the internal state map protected by a Tokio Mutex.\n2. **Preconditions**: None.\n3. **Postconditions**: A `LightGuard` instance is created with an empty, mutex-protected `HashMap<PeerId, LightPeerState>`.\n4. **Z Notation (informal)**: $\\text{guard}' = \\text{new}() \\land \\text{inner} = \\text{Mutex}(\\{\\})$\n5. **Doc comment**: Creates a new state guard for managing light client peer reputations and limits.\n\n### `async fn try_open_stream(&self, peer: PeerId) -> Result<(), &'static str>`\n1. **Reasoning**: Enforces all light client rules (ban status, stream limit, rate limit) before allowing a new stream connection.\n2. **Preconditions**: The `peer` must be a valid `PeerId`.\n3. **Postconditions**: Returns `Ok(())` if the stream is allowed; otherwise, returns an error string. If limits are exceeded, it calls `strike()` and may apply a ban. `active_streams` and `request_count` are incremented upon success.\n4. **Z Notation (informal)**: $\\text{try\\_open} \\implies (\\neg \\text{is\\_banned}) \\land (\\text{active\\_streams} < \\text{MAX}) \\land (\\text{request\\_count} < \\text{limit}) \\implies (\\text{active\\_streams} := \\text{active\\_streams} + 1 \\land \\text{request\\_count} := \\text{request\\_count} + 1; \\text{return Ok}())$\n5. **Doc comment**: Checks all light client constraints (ban, stream count, rate limit) before opening a new stream. Returns an error if denied.\n\n### `async fn check_expensive(&self, peer: PeerId) -> bool`\n1. **Reasoning**: Checks if the peer has exceeded its expensive request limit for the current window. If so, it strikes the
