cy (IP, localhost, or explicitly allowed).\n\n### `serve`\n*   **Reasoning**: High-level function to start the RPC server using default options.\n*   **Preconditions**: A valid `NodeHandle` and a loopback `SocketAddr` must be provided.\n*   **Postconditions**: The RPC server is bound to the address and starts listening; returns `Ok(())` upon successful startup.\n*   **Z Notation (informal)**: $\\text{serve}(\\text{node}, \\text{addr}) \\rightarrow \\text{StartServer}(\\text{node}, \\text{addr}, \\text{DefaultOptions})$\n*   **Doc comment**: Binds and serves the RPC listener using default options.\n\n### `serve_with`\n*   **Reasoning**: Allows explicit configuration of RPC options (e.g., CORS, custom allowed hosts) when starting the server. Includes a warning if bound to a non-loopback address without authentication.\n*   **Preconditions**: A valid `NodeHandle`, `SocketAddr`, and `RpcOptions` must be provided.\n*   **Postconditions**: The RPC server is bound and starts listening with the specified options; returns `Ok(())`.\n*   **Z Notation (informal)**: $\\text{serve\\_with}(\\text{node}, \\text{addr}, \\text{opts}) \\rightarrow \\text{StartServer}(\\text{node}, \\text{addr}, \\text{opts})$\n*   **Doc comment**: Binds and serves the RPC listener with custom configuration options.\n\n### `serve_on`\n*   **Reasoning**: Enables flexible server startup by allowing the caller to provide an already bound `TcpListener` (e.g., if the caller used `bind(0)`).\n*   **Preconditions**: A valid `NodeHandle` and an active `tokio::net::TcpListener` must be provided.\n*   **Postconditions**: The RPC server starts serving on the provided listener; returns `Ok(())`.\n*   **Z Notation (informal)**: $\\text{serve\\_on}(\\text{node}, \\text{listener}) \\rightarrow \\text{Serve}(\\text{node}, \\text{listener})$\n*   **Doc comment**: Serves the RPC on an already-bound TCP listener.\n\n### `serve_explorer`\n*   **Reasoning**: High-level function to start the block explorer alone using default configuration.\n*   **Preconditions**: A valid `NodeHandle` and a loopback `SocketAddr` must be provided.\n*   **Postconditions**: The explorer server is bound to the address and starts listening; returns `Ok(())`.\n*   **Z Notation (informal)**: $\\text{serve\\_explorer}(\\text{node}, \\text{addr}) \\rightarrow \\text{StartServer}(\\text{node}, \\text{addr}, \\text{Explorer})$\n*   **Doc comment**: Binds and serves the block explorer alone using default options.\n\n### `serve_explorer_on`\n*   **Reasoning**: Allows flexible server startup for the explorer by accepting an already bound `TcpListener`.\n*   **Preconditions**: A valid `NodeHandle` and an active `tokio::net::TcpListener` must be provided.\n*   **Postconditions**: The explorer server starts serving on the provided listener; returns `Ok(())`.\n*   **Z Notation (informal)**: $\\text{serve\\_explorer\\_on}(\\text{node}, \\text{listener}) \\rightarrow \\text{Serve}(\\text{node}, \\text{listener}, \\text{Explorer})$\n*   **Doc comment**: Serves the block explorer on an already-bound TCP listener.\n\n***\n\n### Core RPC Endpoints (Examples)\n\n#### `state` (GET `/state`)\n*   **Reasoning**: Provides a snapshot of the node's current operational state, including height, supply, mining status, and peer information, essential for wallets and explorers.\n*   **Preconditions**: A valid `NodeHandle` must be available via `AxState`.\n*   **Postconditions**: Returns a JSON object containing comprehensive node state data (height, tip hash, supply, peers, etc.).\n*   **Z Notation (informal)**: $\\text{state}(\\text{node}) \\rightarrow \\text{JSON}(\\text{Height}, \\text{TipHash}, \\text{Supply}, \\text{Peers}, \\dots)$\n*   **Doc comment**: Returns the current state of the node, including height, supply, tip hash, and peer information.\n\n#### `light` (POST `/light`)\n*   **Reasoning**: Implements the light protocol over HTTP, allowing wallets to sync and submit transactions when WebRTC is unavailable, ensuring compatibility with the WebRTC light stream format.\n*   **Preconditions**: A valid `NodeHandle` and a JSON body conforming to `LightRequest` must be provided.\n*   **Postconditions**: Returns a JSON object indicating success (`\"ok\": true`) with sync data, or failure (`\"ok\": false`) with an error message.\n*   **Z Notation (informal)**: $\\text{light}(\\text{node}, \\text{req}) \\rightarrow \\text{JSON}(\\text{\"ok\"}: \\text{bool}, \\text{\"data\"}/\\text{\"error\"})$\n*   **Doc comment**: Answers light protocol requests (sync, transaction submission) over HTTP, matching the WebRTC stream format.\n\n#### `co_bonds_list` (GET `/co-bonds`)\n*   **Reasoning**: Allows external miners/pools to query the node's mining key and list of registered co-bonds, necessary for establishing a mining partnership.\n*   **Preconditions**: A valid `NodeHandle` must be available via `AxState`. The node must have an active mining bond.\n*   **Postconditions**: Returns a JSON object containing the node's `mining_key`, `bond_id`, and a list of registered co-bonds.\n*   **Z Notation (informal)**: $\\text{co\\_bonds\\_list}(\\text{node}) \\rightarrow \\text{JSON}(\\text{Key}, \\text{ID}, \\text{CoBonds})$\n*   **Doc comment**: Lists the node's mining key, bond ID, and all registered co-bonds.\n\n#### `co_bonds_add` (POST `/co-bonds`)\n*   **Reasoning**: Allows external parties to register a co-bond (a locked coin) against this node's mining key, enabling the node to sign blocks with that bond.\n*   **Preconditions**: A valid `NodeHandle` and a JSON body conforming to `CoBondBody` (script, value, salt) must be provided. The node must have an active mining bond.\n*   **Postconditions**: Returns a JSON object confirming the registration (`\"new\": true/false`) and the view of the co-bond.\n*   **Z Notation (informal)**: $\\text{co\\_bonds\\_add}(\\text{node}, \\text{coin}) \\rightarrow \\text{JSON}(\\text{\"co\\_bond\"}, \\text{\"new\"})$\n*   **Doc comment**: Registers a new co-bond by submitting the coin's script, value, and salt.\n\n#### `mining_template` (POST `/mining/template`)\n*   **Reasoning**: Provides a signed block template for external miners (pools, GPUs), allowing them to calculate their share based on the current state and payouts.\n*   **Preconditions**: A valid `NodeHandle`, a JSON body conforming to `TemplateBody` (payouts, optional extra) must be provided. The node must not be syncing.\n*   **Postconditions**: Returns a JSON object containing the block template details (height, target, mining hash, reward) and a list of associated payout receipts.\n*   **Z Notation (informal)**: $\\text{mining\\_template}(\\text{node}, \\text{payouts}) \\rightarrow \\text{JSON}(\\text{TemplateDetails}, \\text{Receipts})$\n*   **Doc comment**: Generates a signed block template for external miners, including payout receipts.\n\n#### `mining_bind` (POST `/mining/bind`)\n*   **Reasoning**: Allows an external miner to request multiple copies of a specific template, each with a unique coinbase `extra`, ensuring that shares found by different miners are distinct and non-transferable.\n*   **Preconditions**: A valid `NodeHandle`, a JSON body conforming to `BindBody` (mining hash, list of extras) must be provided. The requested template must exist in the cache.\n*   **Postconditions**: Returns a JSON object containing a list of signed variants, each tied to a specific `extra` and miner identity.\n*   **Z Notation (informal)**: $\\text{mining\\_bind}(\\text{node}, \\text{hash}, \\text{extras}) \\rightarrow \\text{JSON}(\\text{Variants})$\n*   **Doc comment**: Generates multiple signed copies of a template, each incorporating a unique coinbase `extra`.\n\n#### `mining_submit` (POST `/mining/submit`)\n*   **Reasoning**: Allows an external miner to submit a fully solved block (native or merged-mined) back to the node for validation and inclusion.\n*   **Preconditions**: A valid `NodeHandle` and a JSON body containing the `block_hex` must be provided.\n*   **Postconditions**: Returns a success confirmation (`\"accepted\": true`) if the block is valid and accepted by the node.\n*   **Z Notation (informal)**: $\\text{mining\\_submit}(\\text{node}, \\text{block}) \\rightarrow \\text{JSON}(\\text{\"accepted\"}: \\text{true})$\n*   **Doc comment**: Submits a solved block (native or merged-mined) for validation and inclusion.\n\n## Function Documentation\n\n### `mining_submit`\n\n**Reasoning**: This function handles the RPC endpoint for submitting a solved block (a batch) to the node for validation and inclusion in the chain. It deserializes the hex-encoded block, submits it via `node.submit_block`, and returns confirmation details.\n**Preconditions**:\n1. `AxState(node)` must contain a valid `NodeHandle` capable of submitting blocks.\n2. `Json(body)` must contain a `SubmitBody` where `block_hex` is a valid hex string representing a bincode-serialized `crate::core::Batch`.\n**Postconditions**:\n1. If successful, the block is submitted to the node, and an `ApiResult` containing `accepted: true`, the block hash, and a flag indicating if it was merged (i.e., had auxiliary proof of work) is returned.\n2. If submission fails or deserialization fails, an appropriate `ApiResult` error is returned.\n**Z Notation (informal)**:\n$$\\text{mining\\_submit}(\\text{node}, \\text{body}) \\rightarrow \\text{ApiResult} \\mid (\\text{Batch} \\leftarrow \\text{decode}(\\text{body}.\\text{block\\_hex}) \\land \\text{node}.\\text{submit}(\\text{Batch}) \\land \\text{return}(\\text{Accepted}))$$\n**Doc comment**:\n```rust\n/// Submits a solved block (batch) to the node for validation and inclusion.\n/// Returns confirmation details including the block hash and merge status.\nasync fn mining_submit(...) -> ApiResult { ... }\n```\n\n### `template_from_hex`\n\n**Reasoning**: This utility function reconstructs a `BlockTemplate` structure from a hex-encoded batch, typically received from an RPC endpoint like `/mining/template`. Since the template is not yet sealed with a solution, certain chain-dependent fields (like `height` and `subsidy`) are placeholders.\n**Preconditions**:\n1. `template_hex` must be a valid hex string representing a bincode-serialized `crate::core::Batch`.\n2. `mining_hash` must be a valid 32-byte hash associated with the template.\n**Postconditions**:\n1. A `Result<BlockTemplate>` is returned, populated with fees and the original batch data.\n2. If hex decoding or bincode deserialization fails, an error is returned.\n**Z Notation (informal)**:\n$$\\text{template\\_from\\_hex}(\\text{hex}, \\text{hash}) \\rightarrow \\text{Result}(\\text{BlockTemplate}) \\mid (\\text{Batch} \\leftarrow \\text{decode}(\\text{hex}) \\land \\text{return}(\\text{Template}(\\text{Batch}, \\text{hash})))$$\n**Doc comment**:\n```rust\n/// Reassembles a solved template (as returned by `/mining/template`) into a BlockTemplate structure.\npub fn template_from_hex(template_hex: &str, mining_hash: [u8; 32]) -> Result<crate::core::template::BlockTemplate> { ... }\n```\n\n---\n\n## RpcClient Implementation\n\n### `RpcClient` (Struct)\n\n**Reasoning**: Provides a lightweight, HTTP/1.1 client specifically tailored for communicating with a local, loopback-only RPC node, avoiding the overhead of a full HTTP stack or TLS.\n**Preconditions**: None (it's a data structure).\n**Postconditions**: Stores the target RPC address (`addr`).\n**Z Notation (informal)**:\n$$\\text{RpcClient} \\triangleq \\{\\text{addr}: \\text{String}\\}$$\n**Doc comment**:\n```rust\n/// A deliberately tiny HTTP/1.1 client for talking to a local node, so the\n/// CLI needs no HTTP client stack (and no TLS: the RPC is loopback-only).\npub struct RpcClient { ... }\n```\n\n### `RpcClient::new`\n\n**Reasoning**: Initializes the client by parsing and normalizing the input address string, stripping common prefixes like `http://`.\n**Preconditions**: `addr` must be convertible into a string.\n**Postconditions**: A new `RpcClient` instance is returned with a cleaned, usable address string.\n**Z Notation (informal)**:\n$$\\text{new}(\\text{input}) \\rightarrow \\text{RpcClient} \\mid (\\text{addr} \\leftarrow \\text{normalize}(\\text{input}))$$\n**Doc comment**:\n```rust\n/// Accepts `host:port` or `http://host:port[/]`, normalizing the address for internal use.\npub fn new(addr: impl Into<String>) -> Self { ... }\n```\n\n### `RpcClient::request`\n\n**Reasoning**: A high-level wrapper that executes a request, checks the HTTP status code (2xx), and handles RPC error reporting if the status is non-success.\n**Preconditions**:\n1. The underlying `request_raw` must succeed.\n2. The returned HTTP status code must be in the range [200, 299].\n**Postconditions**:\n1. If successful, returns the parsed JSON `Value`.\n2. If the status is outside [200, 300], it parses the RPC error message and returns a descriptive `bail!` error.\n**Z Notation (informal)**:\n$$\\text{request}(\\text{method}, \\text{path}, \\text{body}) \\rightarrow \\text{Result}(\\text{Value}) \\mid (\\text{status} \\in [200, 300] \\land \\text{return}(\\text{Value}))$$\n**Doc comment**:\n```rust\n/// Executes an RPC request, validating the HTTP status code (2xx) and handling RPC errors.\nfn request(&self, method: &str, path: &str, body: Option<&Value>) -> Result<Value> { ... }\n```\n\n### `RpcClient::post_raw`\n\n**Reasoning**: Executes a raw POST request, returning both the HTTP status code and the response body, even if the status indicates an error. This is useful for debugging or specific RPC flows that require status inspection.\n**Preconditions**: The underlying `request_raw` must succeed.\n**Postconditions**: A tuple `(u16, Value)` containing the status and the parsed response body is returned.\n**Z Notation (informal)**:\n$$\\text{post\\_raw}(\\text{path}, \\text{body}) \\rightarrow \\text{Result}(\\text{u16} \\times \\text{Value})$$\n**Doc comment**:\n```rust\n/// Executes a raw POST request, returning the HTTP status and body even if the request fails.\npub fn post_raw(&self, path: &str, body: &Value) -> Result<(u16, Value)> { ... }\n```\n\n### `RpcClient::request_raw`\n\n**Reasoning**: The core networking function. It establishes a TCP connection, constructs and sends an HTTP/1.1 request, reads the raw response, parses the status line, handles chunked encoding (`dechunk`), and deserializes the body into a JSON `Value`.\n**Preconditions**:\n1. The address stored in `self.addr` must be reachable via TCP.\n2. The connection must complete within the 120-second timeout.\n**Postconditions**:\n1. A tuple `(u16, Value)` containing the HTTP status and the parsed JSON response is returned.\n2. Errors related to connection, timeout, malformed HTTP structure, or JSON parsing are propagated via `anyhow!`.\n**Z Notation (informal)**:\n$$\\text{request\\_raw}(\\text{method}, \\text{path}, \\text{body}) \\rightarrow \\text{Result}(\\text{u16} \\times \\text{Value}) \\mid (\\text{TCP\\_Connect} \\land \\text{HTTP\\_Send} \\land \\text{HTTP\\_Parse})$$\n**Doc comment**:\n```rust\n/// Performs the raw HTTP/1.1 request over TCP, handling connection, timeouts, and chunked decoding.\nfn request_raw(&self, method: &str, path: &str, body: Option<&Value>) -> Result<(u16, Value)> { ... }\n```\n\n### `RpcClient::get`\n\n**Reasoning**: Convenience wrapper for performing a GET request using the high-level `request` function.\n**Preconditions**: The underlying `request` must succeed.\n**Postconditions**: Returns the parsed JSON `Value` from the response body.\n**Z Notation (informal)**:\n$$\\text{get}(\\text{path}) \\rightarrow \\text{Result}(\\text{Value})$$\n**Doc comment**:\n```rust\n/// Performs a GET request to the specified RPC path.\npub fn get(&self, path: &str) -> Result<Value> { ... }\n```\n\n### `RpcClient::post`\n\n**Reasoning**: Convenience wrapper for performing a POST request using the high-level `request` function.\n**Preconditions**: The underlying `request` must succeed.\n**Postconditions**: Returns the parsed JSON `Value` from the response body.\n**Z Notation (informal)**:\n$$\\text{post}(\\text{path}, \\text{body}) \\rightarrow \\text{Result}(\\text{Value})$$\n**Doc comment**:\n```rust\n/// Performs a POST request with a JSON body to the specified RPC path.\npub fn post(&self, path: &str, body: &Value) -> Result<Value> { ... }\n```\n\n### `RpcClient::height`\n\n**Reasoning**: Retrieves the current chain height by querying the `/state` endpoint and extracting the `height` field.\n**Preconditions**: The `/state` RPC endpoint must exist and return a JSON object containing a valid `height` field (u64).\n**Postconditions**: Returns the current chain height as a `u64`.\n**Z Notation (informal)**:\n$$\\text{height}() \\rightarrow \\text{Result}(\\text{u64}) \\mid (\\text{get}(\"/state\") \\land \\text{extract}(\\text{height}))$$\n**Doc comment**:\n```rust\n/// Retrieves the current chain height from the node's state endpoint (/state).\npub fn height(&self) -> Result<u64> { ... }\n```\n\n### `RpcClient::unspent_outputs`\n\n**Reasoning**: Fetches a paginated list of Unspent Transaction Outputs (UTXOs), including metadata like height and coinbase status, and returns the cursor for the next page.\n**Preconditions**:\n1. The `/utxos` RPC endpoint must exist.\n2. `limit` must be greater than 0.\n3. If `after` is provided, it must be a valid cursor string.\n**Postconditions**:\n1. Returns a tuple: `(Vec<(Output, u64, bool)>, Option<String>)`. The vector contains the UTXOs for the current page, and `Option<String>` holds the cursor for the next page if available.\n2. Errors occur if the response structure is malformed or hex/bincode decoding fails.\n**Z Notation (informal)**:\n$$\\text{unspent\\_outputs}(\\text{after}, \\text{limit}) \\rightarrow \\text{Result}(\\text{List}(\\text{Output} \\times \\text{u64} \\times \\text{bool}) \\times \\text{Cursor})$$\n**Doc comment**:\n```rust\n/// Fetches a page of unspent outputs, returning the outputs and a cursor for the next page.\npub fn unspent_outputs(&self, after: Option<&str>, limit: usize) -> Result<(Vec<(crate::core::mw::Output, u64, bool)>, Option<String>)> { ... }\n```\n\n### `RpcClient::block_ids`\n\n**Reasoning**: Retrieves the header information (height and final hash) for a contiguous range of blocks starting from `start`.\n**Preconditions**:\n1. The `/headers/{start}/{count}` RPC endpoint must exist.\n2. `start` and `count` must be non-negative.\n3. The response must contain a valid hex string of bincode-serialized `BatchHeader`s.\n**Postconditions**:\n1. Returns a vector of tuples: `(u64, [u8; 32])`, where the first element is the block height and the second is the block hash.\n2. Errors occur during network communication, hex decoding, or bincode deserialization.\n**Z Notation (informal)**:\n$$\\text{block\\_ids}(\\text{start}, \\text{count}) \\rightarrow \\text{Result}(\\text{List}(\\text{u64} \\times \\text{Hash}))$$\n**Doc comment**:\n```rust\n/// Retrieves the height and hash for a range of blocks starting at `start`.\npub fn block_ids(&self, start: u64, count: u64) -> Result<Vec<(u64, [u8; 32])>> { ... }\n```\n\n### `RpcClient::mempool_hashes`\n\n**Reasoning**: Queries the node's mempool to retrieve a list of transaction hashes currently waiting for inclusion in a block.\n**Preconditions**: The `/mempool` RPC endpoint must exist and return a JSON object containing a `transactions` array of strings (hashes).\n**Postconditions**: Returns a `Vec<String>` containing all transaction hashes in the mempool.\n**Z Notation (informal)**:\n$$\\text{mempool\\_hashes}() \\rightarrow \\text{Result}(\\text{List}(\\text{Hash}))$$\n**Doc comment**:\n```rust\n/// Retrieves a list of transaction hashes currently waiting in the node's mempool.\npub fn mempool_hashes(&self) -> Result<Vec<String>> { ... }\n```\n\n### `RpcClient::mempool_txs`\n\n**Reasoning**: Fetches the full transaction data corresponding to a list of provided hashes from the mempool. Since the RPC might have limits, it handles batching using `MAX_RPC_MEMPOOL_TXS`.\n**Preconditions**:\n1. `hashes` must be a slice of valid transaction hash strings.\n2. The `/mempool/txs` endpoint must exist and accept batched POST requests.\n**Postconditions**:\n1. Returns a `Vec<Transaction>` containing the deserialized transaction objects for all provided hashes.\n2. Errors occur if any batch request fails or if hex/bincode decoding of individual transactions fails.\n**Z Notation (informal)**:\n$$\\text{mempool\\_txs}(\\text{hashes}) \\rightarrow \\text{Result}(\\text{List}(\\text{Transaction}))$$\n**Doc comment**:\n```rust\n/// Fetches the full transaction data for a list of mempool hashes, handling batching.\npub fn mempool_txs(&self, hashes: &[String]) -> Result<Vec<Transaction>> { ... }\n```\n\n### `RpcClient::blocks`\n\n**Reasoning**: Retrieves the full serialized block data (as hex strings) for a contiguous range of blocks.\n**Preconditions**:\n1. The `/blocks/{start}/{count}` RPC endpoint must exist.\n2. The response must contain a valid array of hex-encoded block strings.\n**Postconditions**:\n1. Returns a `Vec<crate::core::Batch>` containing the deserialized block objects.\n2. Errors occur during network communication, hex decoding, or bincode deserialization.\n**Z Notation (informal)**:\n$$\\text{blocks}(\\text{start}, \\text{count}) \\rightarrow \\text{Result}(\\text{List}(\\text{Batch}))$$\n**Doc comment**:\n```rust\n/// Retrieves the full serialized block data for a range of blocks starting at `start`.\npub fn blocks(&self, start: u64, count: u64) -> Result<Vec<crate::core::Batch>> { ... }\n```\n\n### `RpcClient::submit`\n\n**Reasoning**: Submits a single, fully deserialized `Transaction` object to the node via the `/tx` endpoint and returns the resulting transaction hash.\n**Preconditions**:\n1. `tx` must be a valid `Transaction` object.\n2. The `/tx` RPC endpoint must exist and accept POST requests containing the serialized transaction hex.\n**Postconditions**:\n1. Returns the unique transaction hash (`String`) assigned by the node upon successful submission.\n2. Errors occur if serialization, network communication, or response parsing fails.\n**Z Notation (informal)**:\n$$\\text{submit}(\\text{tx}) \\rightarrow \\text{Result}(\\text{Hash}) \\mid (\\text{post}(\"/tx\", \\text{serialize}(\\text{tx})) \\land \\text{extract}(\\text{tx\\_hash}))$$\n**Doc comment**:\n```rust\n/// Submits a single transaction to the node and returns its assigned transaction hash.\npub fn submit(&self, tx: &Transaction) -> Result<String> { ... }\n```\n\n### `dechunk` (Helper Function)\n\n**Reasoning**: Implements the logic required to parse HTTP chunked transfer encoding, which is used by the RPC node for large responses.\n**Preconditions**: `body` must be a string containing valid HTTP chunked data (size lines followed by data).\n**Postconditions**: Returns the complete, concatenated body content as a `String`.\n**Z Notation (informal)**:\n$$\\text{dechunk}(\\text{body})"}, {"path": "storage.rs", "module": "(root)", "doc": "## Storage Methods Documentation\n\n### `Storage::open(dir: &Path)`\n1. **Reasoning**: Initializes the persistent database (`redb`) at the specified directory, ensuring all necessary tables are created if they do not exist. This is the entry point for using the storage layer.\n2. **Preconditions**: The provided `dir` path must be accessible and writable by the process.\n3. **Postconditions**: A fully initialized `Storage` instance is returned, containing an `Arc<Database>` ready for read/write operations. All defined tables (`batches`, `headers`, `utxos`, etc.) are present in the database.\n4. **Z Notation (informal)**: $\\exists S: \\text{Storage} \\land S.\\text{db} = \\text{Database}(\\text{dir})$\n5. **Doc comment**: Initializes and opens the persistent chain storage database at the given directory path, ensuring all required tables are present.\n\n### `Storage::meta<T: for<'de> Deserialize<'de>>(key: &str)`\n1. **Reasoning**: Provides a generic way to read specific metadata entries (like `state_meta`, `base`, or `finality`) stored under a given key in the `meta` table.\n2. **Preconditions**: The `Storage` instance must be open and valid. The `key` must correspond to a known metadata entry.\n3. **Postconditions**: Returns `Some(T)` if the key exists and deserializes correctly, or `None` if the key is absent. Returns an error otherwise.\n4. **Z Notation (informal)**: $\\text{meta}(k) = \\begin{cases} \\text{deserialize}(\\text{DB}.\\text{meta}[k]) & \\text{if } \\text{DB}.\\text{meta}[k] \\neq \\text{None} \\\\ \\text{None} & \\text{if } \\text{DB}.\\text{meta}[k] = \\text{None} \\\\ \\text{Error} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Retrieves and deserializes a specific metadata entry identified by `key`.\n\n### `Storage::load_batch(height: u64)`\n1. **Reasoning**: Reads the full block body (`Batch`) for a specific chain height from the `batches` table.\n2. **Preconditions**: The `Storage` instance must be open. A batch must exist at the specified `height`.\n3. **Postconditions**: Returns `Some(Batch)` if found, or `None` if the block has been pruned (not stored).\n4. **Z Notation (informal)**: $\\text{load\\_batch}(h) = \\begin{cases} \\text{DB}.\\text{batches}[h] & \\text{if } \\text{DB}.\\text{batches}[h] \\neq \\text{None} \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Loads the full block body (`Batch`) for a given chain height. Returns `None` if the block has been pruned.\n\n### `Storage::load_batches(start: u64, count: u64, byte_limit: usize)`\n1. **Reasoning**: Efficiently loads a sequence of consecutive stored blocks, respecting pruning gaps and a maximum byte size limit to prevent excessive memory usage during history traversal.\n2. **Preconditions**: `start` and `count` must be non-negative. The database must contain consecutive headers starting at `start`.\n3. **Postconditions**: Returns a `Vec<Batch>` containing up to `count` consecutive blocks starting at `start`, stopping if a gap is found or the `byte_limit` is exceeded.\n4. **Z Notation (informal)**: $\\text{load\\_batches}(s, c, l) = \\{B_i\\}_{i=s}^{s+k} \\land k < c \\land \\sum \\text{size}(B_i) \\le l$\n5. **Doc comment**: Loads up to `count` consecutive stored blocks starting at `start`, respecting pruning gaps and a total encoded byte limit.\n\n### `Storage::load_scan_run(start: u64, count: u64, byte_limit: usize)`\n1. **Reasoning**: Reads blocks and converts them into `ScanBlock` data structures, which are optimized for fast state scanning, while respecting pruning and byte limits.\n2. **Preconditions**: `start` and `count` must be non-negative. The database must contain consecutive headers starting at `start`.\n3. **Postconditions**: Returns `Some(ScanRun)` containing the scan data for up to `count` blocks, or `None` if no block exists at `start`.\n4. **Z Notation (informal)**: $\\text{load\\_scan\\_run}(s, c, l) = \\begin{cases} \\text{ScanRun}(\\text{blocks}) & \\text{if } \\text{DB}.\\text{batches}[s] \\neq \\text{None} \\land \\sum \\text{size}(\\text{ScanBlock}) \\le l \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Loads the scan data (`ScanRun`) for up to `count` consecutive stored blocks starting at `start`, respecting pruning gaps and a total encoded byte limit.\n\n### `Storage::load_header(height: u64)`\n1. **Reasoning**: Reads the block header (`BatchHeader`) for a specific height from the `headers` table.\n2. **Preconditions**: The `Storage` instance must be open. A header must exist at the specified `height`.\n3. **Postconditions**: Returns `Some(BatchHeader)` if found, or `None` if the header has been pruned.\n4. **Z Notation (informal)**: $\\text{load\\_header}(h) = \\begin{cases} \\text{DB}.\\text{headers}[h] & \\text{if } \\text{DB}.\\text{headers}[h] \\neq \\text{None} \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Loads the block header (`BatchHeader`) for a given chain height. Returns `None` if the header has been pruned.\n\n### `Storage::load_headers(start: u64, count: u64)`\n1. **Reasoning**: Reads a sequence of consecutive headers starting at `start`. This is used for range queries like calculating fork-choice windows.\n2. **Preconditions**: `start` and `count` must be non-negative. The database must contain consecutive headers starting at `start`.\n3. **Postconditions**: Returns a `Vec<BatchHeader>` containing up to `count` consecutive headers, or an error if a gap is detected (indicating corruption).\n4. **Z Notation (informal)**: $\\text{load\\_headers}(s, c) = \\{H_i\\}_{i=s}^{s+k} \\land k < c \\land \\forall i \\in [s, s+k], \\text{DB}.\\text{headers}[i] \\neq \\text{None}$\n5. **Doc comment**: Loads up to `count` consecutive stored block headers starting at `start`. Fails if any gap is detected in the sequence.\n\n### `Storage::full_weight_confirmations(height: u64, tip: u64, limit: u64)`\n1. **Reasoning**: Calculates the number of blocks between `height` and `tip` that count towards full fork-choice weight, respecting a defined confirmation window (`limit`).\n2. **Preconditions**: $height \\le tip$ and $tip - height \\le limit$. Headers for the range must be present.\n3. **Postconditions**: Returns `Some(u64)` representing the confirmed block count, or `None` if the height is past the tip or exceeds the confirmation limit.\n4. **Z Notation (informal)**: $\\text{full\\_weight}(h, t, l) = \\begin{cases} \\text{count}(\\text{blocks } i \\in [h, t] \\mid \\text{is\\_full\\_weight}) & \\text{if } t-h \\le l \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Calculates the number of full-weight confirmations between `height` and `tip`, respecting a maximum confirmation limit.\n\n### `Storage::load_timestamps(end: u64, n: u64)`\n1. **Reasoning**: Retrieves the timestamps for the $n$ blocks immediately preceding `end`, used for aging per-bond windows.\n2. **Preconditions**: $n \\ge 0$. Headers for the range $[end-n, end-1]$ must be present.\n3. **Postconditions**: Returns a `Vec<u64>` containing the timestamps of the blocks in chronological order. Fails if any header is missing.\n4. **Z Notation (informal)**: $\\text{load\\_timestamps}(e, n) = \\{H_i.\\text{timestamp}\\}_{i=e-n}^{e-1} \\land \\forall i \\in [e-n, e-1], \\text{DB}.\\text{headers}[i] \\neq \\text{None}$\n5. **Doc comment**: Retrieves the timestamps for the $n$ blocks immediately preceding `end`, ordered chronologically. Fails if any header is missing.\n\n### `Storage::load_meta()`\n1. **Reasoning**: Loads the primary state metadata (`StateMeta`) which defines the current tip height, supply, and chain properties.\n2. **Preconditions**: The `Storage` instance must be open.\n3. **Postconditions**: Returns `Some(StateMeta)` if the `state_meta` key exists, or `None` if the database is empty.\n4. **Z Notation (informal)**: $\\text{load\\_meta} = \\text{DB}.\\text{meta}[\"\\text{state\\_meta}\"]$\n5. **Doc comment**: Loads the current chain state metadata (`StateMeta`) from the database.\n\n### `Storage::base()`\n1. **Reasoning**: Retrieves the snapshot base information, indicating where the chain history begins if a checkpoint was used for initialization.\n2. **Preconditions**: The `Storage` instance must be open.\n3. **Postconditions**: Returns `Some(SnapshotBase)` if a base is recorded, or `None` if the chain started from genesis.\n4. **Z Notation (informal)**: $\\text{base} = \\text{DB}.\\text{meta}[\"\\text{base}\"]$\n5. **Doc comment**: Loads the snapshot base information (`SnapshotBase`), indicating the starting height and MMR peaks if initialized from a checkpoint.\n\n### `Storage::finality()`\n1. **Reasoning**: Retrieves the finality bookkeeping information, defining the immutable floor and retention policies for pruning.\n2. **Preconditions**: The `Storage` instance must be open.\n3. **Postconditions**: Returns `FinalityInfo`, defaulting to a genesis state if no finality info is recorded.\n4. **Z Notation (informal)**: $\\text{finality} = \\text{DB}.\\text{meta}[\"\\text{finality}\"] \\lor \\text{Default}(\\text{FinalityInfo})$\n5. **Doc comment**: Loads the chain finality information (`FinalityInfo`), including the immutable floor and undo retention height.\n\n### `Storage::depth_after(height: u64)`\n1. **Reasoning**: Reads the cumulative proof-of-work depth recorded for a specific block height, useful for verifying checkpoint claims without recalculating the entire chain.\n2. **Preconditions**: The `Storage` instance must be open. A depth entry must exist at `height`.\n3. **Postconditions**: Returns `Some(u128)` if the depth is recorded, or `None` if it was not recorded (e.g., before the table existed).\n4. **Z Notation (informal)**: $\\text{depth\\_after}(h) = \\text{DB}.\\text{depths}[h]$\n5. **Doc comment**: Retrieves the cumulative proof-of-work depth recorded for the block at `height`. Returns `None` if not recorded.\n\n### `Storage::set_finality(info: &FinalityInfo)`\n1. **Reasoning**: Persists a new `FinalityInfo` structure, typically after a checkpoint is finalized, establishing an immutable floor for future rewrites.\n2. **Preconditions**: The `Storage` instance must be open. The provided `info` must be valid.\n3. **Postconditions**: The `finality` metadata entry is updated in the database.\n4. **Z Notation (informal)**: $\\text{set\\_finality}(I) \\implies \\text{DB}.\\text{meta}[\"\\text{finality}\"] = I$\n5. **Doc comment**: Sets and persists the chain finality information, establishing the immutable rewrite floor.\n\n### `Storage::load_state()`\n1. **Reasoning**: Reconstructs the entire in-memory `State` object by reading all relevant tables (UTXOs, Kernels, Bonds, Headers, etc.) and verifying that the derived state matches the commitment in the tip header.\n2. **Preconditions**: The `Storage` instance must be open. A valid `state_meta` entry must exist (height > 0).\n3. **Postconditions**: Returns `Some(State)` if the reconstruction is successful and the state root matches the tip header's commitment; otherwise, returns `None` or an error indicating database corruption.\n4. **Z Notation (informal)**: $\\text{load\\_state} = \\begin{cases} \\text{State}(\\text{DB}) & \\text{if } \\text{State}.\\text{root}() = \\text{TipHeader}.\\text{root} \\\\ \\text{Error} & \\text{otherwise} \\end{cases}$\n5. **Doc comment**: Rebuilds and verifies the complete current chain state (`State`) by reading all persistent tables against the tip header's commitment.\n\n### `Storage::state_at(current: &State, height: u64)`\n1. **Reasoning**: Calculates the historical state at a specific `height` by applying `BlockUndo` records in reverse from the current tip state. This is crucial for snapshot generation and historical queries.\n2. **Preconditions**: $height \\le current.\\text{height}$. The chain must not have been reorganized since `current` was taken (verified via header hash). All necessary undo records up to `current.height` must exist.\n3. **Postconditions**: Returns the complete `State` object corresponding to the specified `height`. Fails if the height is in the future or if required undo records are missing.\n4. **Z Notation (informal)**: $\\text{state\\_at}(C, h) = \\text{ApplyUndo}(\\text{DB}, C, h)$\n5. **Doc comment**: Derives the historical state at a specific `height` by applying stored `BlockUndo` records in reverse from the current tip state.\n\n### `Storage::rebuild_fork_choice_windows(&self, state: &mut State)`\n1. **Reasoning**: Updates the fork-choice windows (signer window and work floor) within the provided `State` object by reading recent headers and signer logs from the database. This ensures the in-memory state is consistent with stored history.\n2. **Preconditions**: The `Storage` instance must be open. The `state` must represent a valid chain tip.\n3. **Postconditions**: The `state` object's internal fork-choice windows (signer window, work floor) are updated based on the last `CAP_WINDOW` blocks.\n4. **Z Notation (informal)**: $\\text{rebuild\\_windows}(S) \\implies S.\\text{signer\\_window} = \\text{DB}.\\text{signers}[S.\\text{height}-1..]$\n5. **Doc comment**: Refills the fork-choice windows (signer window and work floor) in the provided `State` object using recent stored headers and signer logs.\n\n### `Storage::work_floor_before(height: u64)`\n1. **Reasoning**: Retrieves the specific set of (height, work) pairs that define the work cap for blocks leading up to `height`, used by fork-choice logic.\n2. **Preconditions**: $height > 0$. Headers for the range $[height - \\text{WORK\\_CAP\\_WINDOW}, height - 1]$ must be present.\n3. **Postconditions**: Returns an `im::Vector<(u64, u128)>` representing the work floor, or an error if headers are incomplete.\n4. **Z Notation (informal)**: $\\text{work\\_floor}(h) = \\text{CapWork}(\\text{DB}.\\text{headers}[h-\\text{W}..h])$\n5. **Doc comment**: Retrieves the fork-choice work window (`bond::cap_work`) defined by stored headers below `height`.\n\n### `Storage::capped_before(height: u64)`\n1. **Reasoning**: Reads the cumulative work withheld (capped) from blocks $0$ up to $height-1$.\n2. **Preconditions**: $height > 0$. A capped entry must exist at $height-1$.\n3. **Postconditions**: Returns the total capped work (`u128`) for the chain up to $height-1$, or 0 if no entry exists.\n4. **Z Notation (informal)**: $\\text{capped}(h) = \\text{DB}.\\text{capped}[h-1] \\lor 0$\n5. **Doc comment**: Retrieves the total work withheld (`u128`) from blocks $0$ up to $height-1$.\n\n### `Storage::subsidy_at(height: u64)`\n1. **Reasoning**: Reads the specific subsidy amount a block at `height` was allowed to mint, accounting for per-bond cap\n\n## Function Documentation\n\n### `devnet_bond`\n1. **Reasoning**: Provides a specific implementation of `MinerBond` for devnet testing, simplifying the call to `devnet_bonds`.\n2. **Preconditions**: `seed` must be a valid seed byte slice; `target` must be a 32-byte hash target.\n3. **Postconditions**: Returns a single `MinerBond` structure configured for devnet use.\n4. **Z Notation (informal)**: $\\text{devnet\\_bond}(\\text{seed}, \\text{target}) \\rightarrow \\text{MinerBond}$\n5. **Doc comment**: A producer signing with its own devnet bond, registered in its first block.\n\n### `genesis_lock`\n1. **Reasoning**: Calculates the required lock height for bonds based on the genesis timestamp and maximum bond horizon, ensuring consistency during initialization.\n2. **Preconditions**: `GENESIS_TIMESTAMP` and `MAX_BOND_HORIZON` must be defined constants.\n3. **Postconditions**: Returns a `u64` representing the required lock height.\n4. **Z Notation (informal)**: $\\text{genesis\\_lock}() \\rightarrow \\text{u64}$\n5. **Doc comment**: Calculates the minimum required lock height for bonds starting from genesis.\n\n### `devnet_bonds`\n1. **Reasoning**: Generates a list of `MinerBond` structures suitable for devnet testing, utilizing `genesis_lock()` to set the bond expiry time.\n2. **Preconditions**: `seeds` must be a slice of seed byte slices; `target` must be a 32-byte hash target.\n3. **Postconditions**: Returns a `Vec<MinerBond>` where all bonds share the same genesis lock height.\n4. **Z Notation (informal)**: $\\text{devnet\\_bonds}(\\text{seeds}, \\text{target}) \\rightarrow \\text{Vec<MinerBond>}$\n5. **Doc comment**: Generates a vector of `MinerBond`s whose bonds share one stand-in midstate, locked for a long time (genesis lock).\n\n### `bonds_until`\n1. **Reasoning**: Core logic for creating `MinerBond` instances based on provided seeds and expiry heights. It handles cryptographic operations (Scalar/RistrettoPoint) and interacts with `devnet_registrations` to finalize the bond structure.\n2. **Preconditions**: `specs` must be a slice of `(&[u8], u64)` pairs; `target` must be a 32-byte hash target.\n3. **Postconditions**: Returns a `Vec<MinerBond>` ready for use in the state, where each bond is uniquely identified and configured with its secret and expiry.\n4. **Z Notation (informal)**: $\\text{bonds\\_until}(\\text{specs}, \\text{target}) \\rightarrow \\text{Vec<MinerBond>}$\n5. **Doc comment**: Creates `MinerBond`s locked until the given midstate heights, deriving cryptographic secrets from seeds.\n\n### `mine_signed`\n1. **Reasoning**: High-level function to mine and commit a block signed by a specific bond. It calculates the correct on-schedule timestamp before delegating to `mine_signed_at`.\n2. **Preconditions**: `storage` must be valid; `state` must be mutable and initialized; `ts` must contain current timestamps; `to` must be a valid `StealthAddress`; `bond` must be a valid `MinerBond`.\n3. **Postconditions**: The block is mined, applied to `state`, and committed to `storage`. `ts` is updated with the new block timestamp.\n4. **Z Notation (informal)**: $\\text{mine\\_signed}(\\text{storage}, \\text{state}, \\text{ts}, \\text{to}, \\text{bond}) \\rightarrow \\text{Unit}$\n5. **Doc comment**: Mines a block signed by `bond` and commits it, ensuring the timestamp is on schedule relative to genesis.\n\n### `mine_signed_at`\n1. **Reasoning**: Executes the actual mining process for a block at a specified timestamp. It builds the template, mines the block, applies the batch, updates timestamps, and commits the result to storage.\n2. **Preconditions**: `storage`, `state`, and `ts` must be valid and mutable; `to` must be a valid `StealthAddress`; `bond` must be a valid `MinerBond`; `timestamp` must be a valid `u64`.\n3. **Postconditions**: The block is mined, applied to `state`, and committed to `storage`. `ts` is updated with the new block timestamp.\n4. **Z Notation (informal)**: $\\text{mine\\_signed\\_at}(\\text{storage}, \\text{state}, \\text{ts}, \\text{to}, \\text{bond}, \\text{timestamp}) \\rightarrow \\text{Unit}$\n5. **Doc comment**: Mines a block signed by `bond` at the specified `timestamp`, applies the batch, and commits it to storage.\n\n### `fresh`\n1. **Reasoning**: Initializes a new node state from scratch (genesis). It opens storage, initializes `State`, applies the genesis batch, and commits this initial state.\n2. **Preconditions**: `dir` must be a valid path to store the database.\n3. **Postconditions**: Returns a tuple containing the initialized `Storage`, `State` (at genesis), and a timestamp vector starting with the genesis timestamp.\n4. **Z Notation (informal)**: $\\text{fresh}(\\text{dir}) \\rightarrow (\\text{Storage}, \\text{State}, \\text{Vec<u64>})$\n5. **Doc comment**: Initializes a new node state from genesis, opening storage and committing the initial batch.\n\n### `mine`\n1. **Reasoning**: General function to mine a block without requiring a specific bond (used for unsigned blocks). It builds the template using `build_template`, mines the block, applies the batch, and updates timestamps.\n2. **Preconditions**: `state` must be mutable; `ts` must contain current timestamps; `txs` must be valid transactions; `to` must be a valid `StealthAddress`.\n3. **Postconditions**: The block is mined, applied to `state`, and `ts` is updated with the new block timestamp. Returns the resulting `Batch`.\n4. **Z Notation (informal)**: $\\text{mine}(\\text{state}, \\text{ts}, \\text{txs}, \\text{to}) \\rightarrow \\text{Batch}$\n5. **Doc comment**: Mines a block based on current state and transactions, suitable for unsigned blocks.\n\n### `chain_with_spend`\n1. **Reasoning**: Utility function to construct a deterministic chain history for testing purposes. It simulates the coinbase maturity period, the subsequent spend transaction, and optional empty blocks.\n2. **Preconditions**: No external preconditions; relies on internal constants like `COINBASE_MATURITY`.\n3. **Postconditions**: Returns a `Built` structure containing ordered vectors of `Batch`s, `State`s, and timestamps representing the full chain history.\n4. **Z Notation (informal)**: $\\text{chain\\_with\\_spend}(\\text{extra}) \\rightarrow \\text{Built}$\n5. **Doc comment**: Generates a deterministic chain history including coinbase maturity, a spend transaction, and optional empty blocks for testing.\n\n### `fx`\n1. **Reasoning**: Helper function to extract the `BlockEffects` from a sequence of `State` objects, which are needed for batch commitment.\n2. **Preconditions**: `states` must be a slice of valid `State` objects.\n3. **Postconditions**: Returns a vector of `Arc<BlockEffects>` corresponding to the input states.\n4. **Z Notation (informal)**: $\\text{fx}(\\text{states}) \\rightarrow \\text{Vec<Arc<BlockEffects>>}$\n5. **Doc comment**: Extracts the `BlockEffects` from a slice of `State` objects.\n\n### `same`\n1. **Reasoning**: Provides a robust comparison between two `State` objects, ensuring not only that the state root matches but also that metadata and UTXO/MMR structures are identical.\n2. **Preconditions**: Both `a` and `b` must be valid `State` objects.\n3. **Postconditions**: Returns `true` if all critical components (root, metadata, UTXOs, MMR) match; otherwise, returns `false`.\n4. **Z Notation (informal)**: $\\text{same}(a, b) \\leftrightarrow (a.\\text{root} = b.\\text{root}) \\land (\\text{meta}(a) = \\text{meta}(b)) \\land \\dots$\n5. **Doc comment**: Compares two `State` objects for deep equality across root, metadata, UTXOs, and MMR structure.\n\n### `group_digest`\n1. **Reasoning**: Calculates a canonical, sorted list of hashes representing all current UTXO groups in the storage. This is used to verify that group tracking is consistent across chain history and reorgs.\n2. **Preconditions**: `s` must be a valid `Storage` instance.\n3. **Postconditions**: Returns a sorted vector of 32-byte hashes, one for each UTXO group.\n4. **Z Notation (informal)**: $\\text{group\\_digest}(\\text{s}) \\rightarrow \\text{Vec<[u8; 32]>}$\n5. **Doc comment**: Computes a sorted vector of cryptographic digests for all active UTXO groups in the storage.\n\n### `checkpoint_for`\n1. **Reasoning**: Creates a `Checkpoint` structure at a specific height, linking the state depth to the header of the preceding block. This is crucial for defining valid snapshots.\n2. **Preconditions**: `s` must be a valid `Storage`; `state` must be a valid `State` at the target height; `height` must be $\\ge 1$.\n3. **Postconditions**: Returns a `Checkpoint` object containing the necessary header information and state depth for snapshot creation.\n4. **Z Notation (informal)**: $\\text{checkpoint\\_for}(\\text{s}, \\text{state}, \\text{height}) \\rightarrow \\text{Checkpoint}$\n5. **Doc comment**: Generates a `Checkpoint` structure linking the state at a given height to the preceding block's header.\n\n***\n*(Note: The remaining functions are primarily test harnesses and do not require formal documentation in this context, as their purpose is validation rather than core API functionality.)*"}, {"path": "sync.rs", "module": "(root)", "doc": "## `verify_header_chain`\n\n1. **Reasoning**: Provides a high-level, safe wrapper around `verify_header_chain_with`, simplifying the API for consumers who do not need to manage the chunk-by-chunk verification flow (e.g., when verifying a complete, pre-fetched batch).\n2. **Preconditions**: `headers` must be a sequence of consecutive, valid `BatchHeader`s starting from a known chain link. `prior_timestamps`, `parent_weight`, and `work_floor` must accurately reflect the state immediately preceding `headers[0]`.\n3. **Postconditions**: If successful, the entire header chain is verified against linkage rules, timestamp constraints (median-time-past), chain weight growth, difficulty targets, and optionally, Proof of Work (PoW). If verification fails, a descriptive `anyhow::Error` is returned.\n4. **Z Notation (informal)**: $\\text{VerifyChain}(\\text{Headers}, \\text{PriorTS}, \\text{Weight}, \\text{Floor}, \\text{CheckPoW}) \\implies (\\text{ValidLinkage} \\land \\text{ValidTimestamps} \\land \\text{ValidWeights} \\land (\\text{CheckPoW} \\implies \\text{ValidPoW})) \\implies \\text{Ok}()$\n5. **Doc comment**:\n```rust\n/// Checks a run of consecutive headers for validity, including linkage,\n/// timestamp constraints, chain weight growth, and optional Proof of Work (PoW).\n///\n/// `prior_timestamps` are the timestamps of the blocks just below `headers[0]` (oldest first);\n/// `parent_weight` is the chain weight of the block below `headers[0]`.\npub fn verify_header_chain(\n    headers: &[BatchHeader],\n    prior_timestamps: &[u64],\n    parent_weight: u128,\n    work_floor: &im::Vector<(u64, u128)>,\n    check_pow: bool,\n) -> Result<()> { /* ... */ }\n```\n\n## `verify_header_chain_with`\n\n1. **Reasoning**: Implements the core verification logic in a chunked manner. This allows verification to be abandoned mid-chunk if resources are constrained or if an early failure is detected, preventing wasted CPU cycles on long PoW checks.\n2. **Preconditions**: `headers` must be a sequence of consecutive headers. The initial state (`prior_timestamps`, `parent_weight`, `work_floor`) must be correct relative to `headers[0]`. The `proceed` closure must be callable for each chunk piece.\n3. **Postconditions**: If successful, all headers are verified. If the `proceed` closure returns `false` at any point, verification is aborted and fails. If a structural or cryptographic error is found (e.g., broken linkage, invalid target), an error is returned immediately.\n4. **Z Notation (informal)**: $\\text{VerifyChainWith}(\\text{Headers}, \\dots, \\text{Proceed}) \\implies (\\forall h \\in \\text{Headers}: \\text{Check}(h) \\land \\text{Proceed}(\\text{ChunkSize})) \\implies \\text{Ok}()$\n5. **Doc comment**:\n```rust\n/// Core header chain verification, implemented chunk-by-chunk.\n///\n/// The `proceed` closure allows the caller to abandon verification early (returning `false`)\n/// before a full chunk is processed, preventing wasted work on long PoW checks.\npub fn verify_header_chain_with(\n    headers: &[BatchHeader],\n    prior_timestamps: &[u64],\n    parent_weight: u128,\n    work_floor: &im::Vector<(u64, u128)>,\n    check_pow: bool,\n    mut proceed: impl FnMut(usize) -> bool,\n) -> Result<()> { /* ... */ }\n```\n\n## `SyncSession::note_backing`\n\n1. **Reasoning**: Determines if the peer has met its claim of chain weight. This is crucial for accountability; a peer must prove its claim by serving headers that reach the promised weight.\n2. **Preconditions**: The session must have an established `peer_weight` (the claimed weight). `self.headers.verified_weight` must be updated with the current verified chain weight.\n3. **Postconditions**: If `self.headers.verified_weight >= self.peer_weight`, `self.backed` is set to `true`. Otherwise, it remains unchanged.\n4. **Z Notation (informal)**: $\\text{NoteBacking}(S) \\implies S.\\text{backed} \\leftarrow (S.\\text{headers}.\\text{verified\\_weight} \\ge S.\\text{peer\\_weight})$\n5. **Doc comment**:\n```rust\n/// Records that the peer has backed its claim, once its verified headers\n/// weigh what it claimed (`self.peer_weight`).\npub fn note_backing(&mut self) { /* ... */ }\n```\n\n## `SyncSession::timed_out`\n\n1. **Reasoning**: Implements the session timeout logic, distinguishing between peer inactivity (which triggers a drop) and local processing time (which is allowed to run longer). This prevents legitimate, slow verification work from prematurely terminating the sync.\n2. **Preconditions**: `idle` must be the configured peer inactivity timeout (`SYNC_TIMEOUT_SECS`). `self.last_progress` must be accurate.\n3. **Postconditions**: Returns `true` if the session should be dropped (i.e., elapsed time exceeds the appropriate limit: `idle` if not busy, or `LOCAL_WORK_TIMEOUT` if busy). Returns `false` otherwise.\n4. **Z Notation (informal)**: $\\text{TimedOut}(S, \\text{Idle}) \\implies S.\\text{last\\_progress}.\\text{elapsed}() > (\\text{Busy}(S) ? \\text{LocalWorkTimeout} : \\text{Idle})$\n5. **Doc comment**:\n```rust\n/// Checks if the session should be dropped due to inactivity.\n///\n/// Time spent on our own work (`busy()`) does not count against the peer's timeout.\npub fn timed_out(&self, idle: Duration) -> bool { /* ... */ }\n```\n\n## `SyncSession::busy`\n\n1. **Reasoning**: Determines if the node is actively performing work related to this session (header verification, fork state derivation, or block application). This is used by `timed_out` to correctly apply the local work timeout limit.\n2. **Preconditions**: The internal state of `self.headers` and `self.blocks` must be up-to-date.\n3. **Postconditions**: Returns `true` if `self.headers.verifying` is true, or if `self.blocks` is present and is currently `applying` or `rebuilding`. Returns `false` otherwise.\n4. **Z Notation (informal)**: $\\text{Busy}(S) \\implies S.\\text{headers}.\\text{verifying} \\lor (\\text{Blocks}(S) \\land (\\text{Blocks}(S).\\text{applying} \\lor \\text{Blocks}(S).\\text{rebuilding}))$\n5. **Doc comment**:\n```rust\n/// Checks whether this node is actively working on the session (verifying headers,\n/// deriving fork state, or applying blocks).\npub fn busy(&self) -> bool { /* ... */ }\n```\n\n## `SyncRecord::record`\n\n1. **Reasoning**: Manages the accountability system. It tracks strikes and cooldowns based on how a session ended (`Blame`), ensuring peers who lie about chain weight are penalized, while those who merely cannot serve are paused.\n2. **Preconditions**: `peer` must be a valid `PeerId`. `blame` must indicate the session outcome. `cooldown` specifies the base pause duration.\n3. **Postconditions**: Updates the internal map of peer records. Returns `true` if the peer has reached `SYNC_STRIKES_TO_BAN` and is banned; otherwise, returns `false`.\n4. **Z Notation (informal)**: $\\text{Record}(R, P, B, C) \\implies R.\\text{peers}[P] \\leftarrow \\text{Update}(\\text{Strikes}, \\text{Until}) \\land (\\text{Blame} = \\text{Strike} \\land \\text{Strikes} \\ge 3) \\implies \\text{Banned}(P)$\n5. **Doc comment**:\n```rust\n/// Records how a session with `peer` ended, updating strikes and cooldowns.\n///\n/// Returns `true` if the peer is now banned (reached `SYNC_STRIKES_TO_BAN`).\npub fn record(&mut self, peer: PeerId, blame: Blame, cooldown: Duration) -> bool { /* ... */ }\n```\n\n## `SyncRecord::barred`\n\n1. **Reasoning**: Provides a quick check to determine if a peer is currently under a cooldown or strike penalty and cannot start a new session.\n2. **Preconditions**: `peer` must be a valid `PeerId`. The internal records must be up-to-date.\n3. **Postconditions**: Returns `true` if the peer's recorded cooldown (`until`) is in the future relative to `Instant::now()`. Returns `false` otherwise.\n4. **Z Notation (informal)**: $\\text{Barred}(R, P) \\implies R.\\text{peers}[P].\\text{Until} > \\text{Now}()$\n5. **Doc comment**:\n```rust\n/// Checks whether `peer` is currently barred from starting a session due to strikes or pauses.\npub fn barred(&self, peer: &PeerId) -> bool { /* ... */ }\n```\n\n## `SyncRecord::succeeded`\n\n1. **Reasoning**: Clears the record for a peer when a session successfully completes and contributes to the chain, indicating the peer was honest and served the required data.\n2. **Preconditions**: `peer` must be a valid `PeerId`. The peer must have been previously recorded in `self.peers`.\n3. **Postconditions**: Removes the entry for `peer` from `self.peers`.\n4. **Z Notation (informal)**: $\\text{Succeeded}(R, P) \\implies R.\\text{peers} \\leftarrow R.\\text{peers} \\setminus \\{P\\}$\n5. **Doc comment**:\n```rust\n/// Clears the sync record for `peer` after a successful session where the peer\n/// provided the necessary chain data.\npub fn succeeded(&mut self, peer: &PeerId) { /* ... */ }\n```"}], "bin": [{"path": "bin/main.rs", "module": "bin", "doc": "## Documentation for `bin/main.rs` (Chunk 1/2)\n\n### Macro: `out!`\n\n**Reasoning**: Provides a safe way to print output to `stdout` that does not cause a panic or crash the application if `stdout` is closed (e.g., when piped into `head`). This ensures quiet exit behavior in shell pipelines.\n**Preconditions**: None.\n**Postconditions**: If writing succeeds, prints the arguments to `stdout`. If writing fails, the process exits with status code 0.\n**Z Notation (informal)**: $\\text{out}(A) \\implies (\\text{write}(\\text{stdout}, A) \\land \\text{success}) \\lor (\\neg \\text{write}(\\text{stdout}, A) \\land \\text{exit}(0))$\n**Doc comment**: `/// Prints output to stdout, exiting quietly (status 0) if stdout is closed.`\n\n### Struct: `Cli`\n\n**Reasoning**: Defines the top-level command-line interface structure using `clap`. It serves as the entry point for all `midwimble` operations.\n**Preconditions**: None.\n**Postconditions**: None (It is a data structure used for parsing arguments).\n**Z Notation (informal)**: $\\text{Cli} \\equiv \\{\\text{command}: \\text{Cmd}\\}$\n**Doc comment**: `/// Main command-line interface structure for midwimble.`\n\n### Enum: `Cmd`\n\n**Reasoning**: Defines the primary subcommands available in `midwimble` (e.g., `node`, `merge-mine`, `pool`).\n**Preconditions**: None.\n**Postconditions**: None (It is a data structure used for parsing arguments).\n**Z Notation (informal)**: $\\text{Cmd} \\in \\{\\text{Node}, \\text{MergeMine}, \\text{Pool}, \\dots\\}$\n**Doc comment**: `/// Available subcommands for the midwimble CLI.`\n\n### Function: `tls_pin_from_hex`\n\n**Reasoning**: Validates and converts a hexadecimal string into a 32-byte array, specifically checking if the input matches the expected SHA-256 format used for pool TLS pinning.\n**Preconditions**: The input string `pin` must contain a valid hexadecimal representation of exactly 32 bytes (64 hex characters).\n**Postconditions**: Returns a `Result<[u8; 32]>` containing the decoded bytes upon success, or an `anyhow::Error` if the format is incorrect.\n**Z Notation (informal)**: $\\text{tls\\_pin\\_from\\_hex}(s) \\implies (s \\in \\text{Hex}_{64} \\land |s|=64) \\implies [u8; 32]$\n**Doc comment**: `/// Decodes a 32-byte SHA-256 hex string into a byte array, validating the length.`\n\n### Function: `password`\n\n**Reasoning**: Securely retrieves the wallet password, prioritizing an environment variable (`MIDWIMBLE_PASSWORD`) and falling back to interactive standard input if the environment variable is not set.\n**Preconditions**: The user must be able to provide a password either via the environment or interactively.\n**Postconditions**: Returns a `Result<String>` containing the validated, non-empty password, or an error if retrieval fails or the password is empty.\n**Z Notation (informal)**: $\\text{password}() \\implies (\\text{env}(\\text{MIDWIMBLE\\_PASSWORD}) \\lor \\text{stdin\\_input}) \\land \\text{non\\_empty} \\implies \\text{String}$\n**Doc comment**: `/// Retrieves the wallet password from environment variable or prompts interactively.`\n\n### Function: `gpu_info` (GPU enabled)\n\n**Reasoning**: Performs a self-test of available GPUs, checking both Midstate Walk compatibility (NVIDIA CUDA) and general shader capability (BLAKE3 chain via wgpu). This confirms the mining backend is functional.\n**Preconditions**: The binary must be compiled with the `gpu` feature enabled. A CUDA driver must be installed for NVIDIA checks.\n**Postconditions**: Prints detailed status messages to `stdout` regarding found GPUs, successful Midstate Walk tests, and the results of a trivial BLAKE3 chain mining test. Returns `Ok(())` on successful testing.\n**Z Notation (informal)**: $\\text{gpu\\_info}() \\implies (\\text{CUDA\\_check} \\land \\text{wgpu\\_test}) \\implies \\text{stdout\\_output}$\n**Doc comment**: `/// Checks for and tests CUDA and wgpu GPU capabilities for mining.`\n\n### Function: `gpu_info` (GPU disabled)\n\n**Reasoning**: Provides a clear error message if the user attempts to run GPU-related commands without compiling with the necessary feature flag.\n**Preconditions**: The binary must *not* be compiled with the `gpu` feature enabled.\n**Postconditions**: Returns an `anyhow::Error` indicating that GPU support is missing.\n**Z Notation (informal)**: $\\neg \\text{feature}(\\text{gpu}) \\implies \\text{bail}(\\text{\"missing gpu support\"})$\n**Doc comment**: `/// Fails if the binary was not built with GPU support.`\n\n### Function: `set_backend`\n\n**Reasoning**: Configures the mining backend (auto, gpu, cpu) based on user input, ensuring compatibility with the build features.\n**Preconditions**: The input `name` must be one of \"auto\", \"gpu\", or \"cpu\". If `name` is \"gpu\", the binary must have been built with the `gpu` feature.\n**Postconditions**: Sets the internal mining backend configuration successfully, or returns an `anyhow::Error` if the name is unknown or if GPU support is requested but unavailable.\n**Z Notation (informal)**: $\\text{set\\_backend}(n) \\implies (n \\in \\{\\text{auto}, \\text{gpu}, \\text{cpu}\\} \\land (\\text{gpu} \\implies \\text{feature}(\\text{gpu}))) \\implies \\text{Ok}()$\n**Doc comment**: `/// Sets the mining backend (auto, gpu, cpu) based on configuration.`\n\n### Function: `ctrlc_like`\n\n**Reasoning**: Implements a non-blocking Ctrl+C handler using `tokio::runtime`. This allows the main application loop to continue running while gracefully handling termination signals without relying on external crates for signal handling.\n**Preconditions**: The closure `f` must be `Send` and `'static`.\n**Postconditions**: Spawns a thread that waits for Ctrl+C; upon receiving the signal, it executes the provided closure `f()`.\n**Z Notation (informal)**: $\\text{ctrlc\\_like}(f) \\implies \\text{spawn}(\\text{thread}) \\land (\\text{CtrlC} \\implies f())$\n**Doc comment**: `/// Runs a closure upon receiving Ctrl-C without external signal handling crates.`\n\n### Enum: `BondCmd`\n\n**Reasoning**: Defines the specific actions related to mining bonds (creating, checking address, registering).\n**Preconditions**: None.\n**Postconditions**: None (Data structure for CLI parsing).\n**Z Notation (informal)**: $\\text{BondCmd} \\in \\{\\text{New}, \\text{Address}, \\text{Register}\\}$\n**Doc comment**: `/// Subcommands for managing mining bonds.`\n\n### Function: `bond_command`\n\n**Reasoning**: Orchestrates the logic for all `BondCmd` subcommands. It handles file I/O, cryptographic validation (e.g., ensuring owner keys are 32 bytes, not midstate addresses), and complex chain state checks (e.g., proof validity against Midstate headers, burial depth).\n**Preconditions**: The input `cmd` must be a valid `BondCmd`. Required RPC endpoints (`midstate_rpc`, `midwimble_rpc`) must be reachable if registration is attempted.\n**Postconditions**: Writes the updated bond file (including proof and registration data) to disk upon successful operation. Prints status, keys, or warnings to `stdout`. Returns `Ok(())` on success or an `anyhow::Error` on validation failure (e.g., insufficient bond value, proof stale).\n**Z Notation (informal)**: $\\text{bond\\_command}(c) \\implies (\\text{validation}(c) \\land \\text{RPC\\_ok}) \\implies \\text{write}(\\text{file}, f') \\land \\text{stdout\\_output}$\n**Doc comment**: `/// Executes the logic for a specific bond command (New, Address, Register).`\n\n### Function: `midstate_header`\n\n**Reasoning**: Queries a Midstate node RPC to retrieve a specific header link at a given height. This is crucial for verifying proofs against the current chain state.\n**Preconditions**: The `midstate` RPC client must be initialized and reachable. The requested `height` must exist on the Midstate chain.\n**Postconditions**: Returns `Ok(Some(HeaderLink))` if the header exists, or `Ok(None)` if the node is not yet at that height, or an `anyhow::Error` if RPC communication fails.\n**Z Notation (informal)**: $\\text{midstate\\_header}(m, h) \\implies m.\\text{get}(\\text{headers}/h/1) \\implies \\text{Result}(\\text{Option}(\\text{HeaderLink}))$\n**Doc comment**: `/// Fetches the Midstate header link for a specific height from the RPC node.`\n\n### Function: `bond_units`\n\n**Reasoning**: Converts raw bond unit counts (u6 nction: `print_params`\n\n**Reasoning**: Outputs critical launch and consensus parameters (genesis target, block times, bond rules, max supply) for verification against public announcements.\n**Preconditions**: None. Requires access to internal constants and state calculation functions.\n**Postconditions**: Prints a comprehensive list of network and consensus parameters to `stdout`.\n**Z Notation (informal)**: $\\text{print\\_params}() \\implies \\text{stdout\\_output}(\\text{ConsensusParams})$\n**Doc comment**: `/// Prints the build's launch and consensus parameters, including genesis details.`\n\n### Function: `json_str_array`\n\n**Reasoning**: Utility function to safely extract an array of strings from a potentially complex JSON structure returned by the RPC client, filtering out non-string elements.\n**Preconditions**: Input `v` must be a `serde_json::Value`.\n**Postconditions**: Returns a `Vec<String>` containing only the string elements from the JSON array, or an empty vector if the value is not an array.\n**Z Notation (informal)**: $\\text{json\\_str\\_array}(v) \\implies v.\\text{is\\_array} \\implies \\text{Vec}(\\text{string})$\n**Doc comment**: `/// Extracts a JSON array of strings, safely filtering non-string entries.`\n\n### Function: `link_qr`\n\n**Reasoning**: Determines the correct, dialable address for the node (handling public vs. host-specific addresses) and generates a QR code URI that a mobile or web wallet can scan to connect directly to the local node.\n**Preconditions**: The RPC address must be reachable. If `host` is `None`, the node must have a public WebRTC address.\n**Postconditions**: Prints the generated QR code image, instructions, and the raw URI to `stdout`. Returns `Ok(())` on success or an `anyhow::Error` if no dialable address can be determined.\n**Z Notation (informal)**: $\\text{link\\_qr}(r, h, f) \\implies \\text{determine\\_address}(r, h) \\implies \\text{stdout\\_output}(\\text{QR\\_image}, \\text{URI})$\n**Doc comment**: `/ unction checking if a key has been seen.\n**Postconditions**: Returns `Ok(Vec<[u8; 32]>)` containing the keys of all verified headers; otherwise, returns an error (`Result<()>`).\n**Z Notation (informal)**: $\\text{verify\\_proofs\\_with}(\\text{MI}, \\text{P}, \\text{K}) \\rightarrow \\text{Keys} \\mid \\forall h \\in \\text{links}: (\\neg \\text{K}(\\text{link\\_key}(h)) \\implies \\text{PoW\\_Valid}(h))$\n**Doc comment**:\n```rust\n/// Optimized proof verification, skipping PoW checks for headers whose keys are already known. Returns all computed keys.\npub fn verify_proofs_with(\n    &self,\n    payload: &[u8; 32],\n    known: impl Fn(&[u8; 32]) -> bool,\n) -> Result<Vec<[u8; 32]>> { /* ... */ }\n```\n\n### `MidstateInclusion::trim`\n\n**Reasoning**: Allows the evidence to be pruned to match exactly the required depth of a verifier, minimizing storage and transmission overhead.\n**Preconditions**: `depth` must be $\\ge 1$.\n**Postconditions**: The `confirmations` vector is truncated such that the total number of headers (anchor + confirmations) equals `depth`.\n**Z Notation (informal)**: $\\text{trim}(\\text{MI}, D) \\rightarrow \\text{MI.confirmations} = \\text{truncate}(D - 1)$\n**Doc comment**:\n```rust\n/// Trims the confirmation list to match the required `depth` (anchor block included).\npub fn trim(&mut self, depth: usize) { /* ... */ }\n```\n\n### `MidstateInclusion::from_midstate_json`\n\n**Reasoning**: Reconstructs the `MidstateInclusion` evidence structure from raw JSON data provided by a Midstate node, ensuring all internal consistency checks (folding, linking) are performed during construction.\n**Preconditions**: `block` and `following` must be valid JSON representations of Midstate headers; `payload` must match an item in the anchor block.\n**Postconditions**: A fully constructed and internally consistent `MidstateInclusion` instance is returned; otherwise, returns an error (`Result<Self>`).\n**Z Notation (informal)**: $\\text{from\\_midstate\\_json}(\\dots) \\rightarrow \\text{MI} \\mid \\text{MI.block} = \\text{recompute\\_header}(\\text{block}) \\land \\text{fold}(\\text{payload}) \\in \\text{items}$\n**Doc comment**:\n```rust\n/// Builds evidence from Midstate JSON data: the anchor block and subsequent confirmations.\npub fn from_midstate_json(\n    height: u64,\n    block: &Value,\n    kind: AnchoredItem,\n    payload: &[u8; 32],\n    following: &[Value],\n) -> Result<Self> { /* ... */ }\n```\n\n## Helper Functions (Midstate Block Parsing)\n\n### `midstate_fold_items`\n\n**Reasoning**: Parses a Midstate block JSON to extract the previous midstate root and the ordered list of all fold items (transactions and coinbase outputs).\n**Preconditions**: `batch` must be a valid JSON representation of a Midstate block.\n**Postconditions**: Returns `Ok((prev_midstate, items))` where `items` is the sequence of 32-byte fold hashes.\n**Z Notation (informal)**: $\\text{fold\\_items}(\\text{Batch}) \\rightarrow (\\text{"}, {"path": "core/auxpow.rs", "module": "core", "doc": "## `pub const MAX_COINBASE_AFTER`\n\n**Reasoning**: Defines a strict constraint based on the protocol rule that the merge commitment must reside only in the parent's last coinbase output, preventing equivocation.\n**Preconditions**: None.\n**Postconditions**: The constant value is set to 0.\n**Z Notation (informal)**: $\\text{MAX\\_COINBASE\\_AFTER} = 0$\n**Doc comment**: `/// Parent coinbase outputs allowed after the committing one: none.`\n\n## `pub fn merge_commitment`\n\n**Reasoning**: Calculates the specific salt required for a parent coinbase output to commit to a given midwimble block's header hash (`aux_mining_hash`). This ensures cryptographic binding.\n**Preconditions**: `aux_mining_hash` must be a valid 32-byte hash of the midwimble block header.\n**Postconditions**: Returns a 32-byte salt that, when used in `midstate_coin_id`, results in a commitment to `aux_mining_hash`.\n**Z Notation (informal)**: $\\text{merge\\_commitment}(H) = \\text{HashDomain}(\\text{\"midwimble.merge-mining.v1\"}, [\\text{NETWORK\\_MAGIC}, H])$\n**Doc comment**: `/// Calculates the salt required for a parent coinbase output to commit to a specific aux mining hash.`\n\n## `pub fn midstate_coin_id`\n\n**Reasoning**: Implements the standard Midstate function to compute a unique coin ID based on address, value, and salt, consistent with Midstate's internal state transitions.\n**Preconditions**: `address`, `salt` must be 32-byte arrays; `value` must be a valid u64.\n**Postconditions**: Returns the 32-byte coin ID derived from the inputs using Blake3 hashing.\n**Z Notation (informal)**: $\\text{midstate\\_coin\\_id}(A, V, S) = \\text{Blake3Hash}(A \\parallel V \\parallel S)$\n**Doc comment**: `/// Computes the Midstate coin ID for a given address, value, and salt.`\n\n## `pub fn aux_block_id`\n\n**Reasoning**: Provides a canonical, unique identifier for a merged-mined block. This ID is derived from both the parent's final PoW result and the specific auxiliary mining hash, preventing confusion with the parent's native block ID.\n**Preconditions**: `parent_final_hash` and `aux_mining_hash` must be valid 32-byte hashes.\n**Postconditions**: Returns a unique 32-byte identifier for the merged-mined block.\n**Z Notation (informal)**: $\\text{aux\\_block\\_id}(P, A) = \\text{HashDomain}(\\text{\"midwimble.aux-block-id.v1\"}, [P, A])$\n**Doc comment**: `/// Generates the unique ID for a merged-mined block using the parent's final hash and the aux mining hash.`\n\n## `impl AuxPow`\n\n### `pub fn parent_mining_hash`\n\n**Reasoning**: Recomputes the Midstate header hash that the parent block was mined over. This is crucial for verification, as the merged miner must prove their work aligns with Midstate's rules.\n**Preconditions**: `aux_mining_hash` must be the hash of the midwimble block being committed to; `self` must contain valid parent header fields (e.g., `pre_commit_midstate`, `state_root`).\n**Postconditions**: Returns the 32-byte Midstate header hash (`m`) used as the input for the parent's PoW calculation.\n**Z Notation (informal)**: $M = \\text{MidstateHeaderHash}(\\text{PrevH}, \\text{CoinID}(A, V, S), \\text{SR}, T, \\text{Target})$ where $S = \\text{merge\\_commitment}(A)$\n**Doc comment**: `/// Computes the Midstate header hash that the parent's proof-of-work was computed over.`\n\n### `pub fn pow_job`\n\n**Reasoning**: Packages the necessary components (mining hash, nonce, final hash) into a `PowJob` structure for efficient PoW verification against a specific algorithm.\n**Preconditions**: `algo` must be a valid `PowAlgo`; `aux_mining_hash` must be the target block's hash.\n**Postconditions**: Returns a `PowJob` struct containing the required mining parameters.\n**Z Notation (informal)**: $\\text{PowJob} = \\{ \\text{algo}, \\text{parent\\_mining\\_hash}(\\text{aux\\_mining\\_hash}), \\text{nonce}, \\text{final\\_hash} \\}$\n**Doc comment**: `/// Creates a PowJob structure containing the mining hash, nonce, and final hash for batched verification.`\n\n### `pub fn block_id`\n\n**Reasoning**: Calculates the canonical ID of the merged-mined block using the auxiliary mining hash.\n**Preconditions**: `aux_mining_hash` must be the hash of the midwimble block being committed to.\n**Postconditions**: Returns the 32-byte unique block identifier.\n**Z Notation (informal)**: $\\text{BlockID} = \\text{aux\\_block\\_id}(\\text{self}.\\text{final\\_hash}, A)$\n**Doc comment**: `/// Calculates the unique ID of this merged-mined block.`\n\n### `pub fn check_claims`\n\n**Reasoning**: Performs local, inexpensive checks on the `AuxPow` structure to ensure protocol invariants are met (e.g., commitment is in the last output, block ID matches proof, PoW meets target).\n**Preconditions**: `aux_mining_hash` must match the commitment salt; `extension` must contain the correct nonce and calculated block ID; `target` must be the required difficulty.\n**Postconditions**: Returns `Ok(())` if all claims are valid; otherwise, returns an error detailing the violation.\n**Z Notation (informal)**: $\\text{CheckClaims} \\iff (\\text{CoinbaseAfter} = \\emptyset) \\land (\\text{Ext}.\\text{Nonce} = 0) \\land (\\text{Ext}.\\text{FinalHash} = \\text{BlockID}(A)) \\land (\\text{FinalHash} < \\text{Target})$\n**Doc comment**: `/// Checks local protocol invariants: commitment position, block ID consistency, and PoW target satisfaction.`\n\n## `pub fn verify_pow`\n\n**Reasoning**: High-level entry point for verifying PoW. It determines the required PoW algorithm based on the block's height using `pow_algo_at`.\n**Preconditions**: `height` must be a valid block height; `mining_hash`, `extension`, and `target` must be correct for that height.\n**Postconditions**: Returns `Ok(())` if the PoW is valid according to the algorithm required at `height`; otherwise, returns an error.\n**Z Notation (informal)**: $\\text{VerifyPoW}(H, M, E, T, \\text{Aux}) = \\text{VerifyPowWith}(\\text{PowAlgoAt}(H), M, E, T, \\text{Aux})$\n**Doc comment**: `/// Verifies the proof of work for a block at a known height, using the algorithm specified by that height.`\n\n## `pub fn verify_pow_with`\n\n**Reasoning**: Core verification logic. It handles both native blocks (`aux=None`) and merged-mined blocks (`aux=Some`). For merged blocks, it performs the expensive check: recomputing the parent's mining hash and verifying the final PoW result against that computed hash.\n**Preconditions**: `algo` must be a valid `PowAlgo`; `mining_hash`, `extension`, and `target` must be correct for `algo`. If `aux` is present, `aux.check_claims` must pass.\n**Postconditions**: Returns `Ok(())` if the PoW is valid under `algo` (either standard or merged-mined); otherwise, returns an error.\n**Z Notation (informal)**: $\\text{VerifyPoWWith}(A, M, E, T, \\text{Aux}) = (\\text{Aux} = \\text{None} \\implies \\text{VerifyExt}(A, M, E, T)) \\land (\\text{Aux} \\ne \\text{None} \\implies \\text{CheckClaims}(\\text{Aux}) \\land \\text{RecomputeAndVerify}(A, \\text{Aux}))$\n**Doc comment**: `/// Verifies the proof of work using a specific algorithm, handling both native and merged-mined blocks.`\n\n## `pub fn verify_pow_near`\n\n**Reasoning**: Handles orphan blocks near the PoW algorithm switch height (`WALK_ACTIVATION_HEIGHT`). Since the block's true height is unknown, it checks validity against all algorithms active near the switch.\n**Preconditions**: `tip_height` must be close enough to the switch height; `mining_hash`, `extension`, and `target` must be provided.\n**Postconditions**: Returns `Ok(())` if the PoW is valid under *any* algorithm active near `tip_height`; otherwise, returns an error indicating failure across all checked algorithms.\n**Z Notation (informal)**: $\\text{VerifyPoWNear}(T, M, E, T, \\text{Aux}) = \\exists A \\in \\text{AlgosNear}(T) : \\text{VerifyPowWith}(A, M, E, T, \\text{Aux})$\n**Doc comment**: `/// Screens orphan blocks near the PoW algorithm switch height by checking against all relevant algorithms.`\n\n## `impl ParentTemplate`\n\n### `pub fn from_midstate_json`\n\n**Reasoning**: Parses a Midstate block template (JSON format) and extracts all necessary header and transaction data, specifically identifying the coinbase output designated to carry the merge commitment.\n**Preconditions**: `batch` must be a valid JSON structure conforming to the Midstate block template; `commit_index` must be a valid index within the coinbase array.\n**Postconditions**: Returns a `ParentTemplate` struct populated with all header data, ensuring the commitment is in the last output (`MAX_COINBASE_AFTER = 0`).\n**Z Notation (informal)**: $\\text{ParentTemplate} = \\text{ParseJSON}(\\text{Batch}) \\land (\\text{CommitIndex} = |\\text{Coinbase}| - 1)$\n**Doc comment**: `/// Reconstructs the ParentTemplate from a Midstate batch JSON, ensuring the commitment is in the last coinbase output.`\n\n### `pub fn proof`\n\n**Reasoning**: Constructs the final `AuxPow` structure required for verification, using the parsed template data and supplying the found nonce and final hash.\n**Preconditions**: `nonce` and `final_hash` must be the result of a successful PoW search.\n**Postconditions**: Returns a complete `AuxPow` struct ready for verification.\n**Z Notation (informal)**: $\\text{AuxPow} = \\{ \\text{TemplateData}, \\text{Nonce}, \\text{FinalHash} \\}$\n**Doc comment**: `/// Constructs the full AuxPow proof structure given a found nonce and final hash.`\n\n### `pub fn check`\n\n**Reasoning**: Verifies that the template data correctly commits to the provided `aux_mining_hash` (by checking the salt) and, critically, confirms that the parent's calculated Midstate header hash matches the hash provided by the miner. This prevents miners from using arbitrary parent headers.\n**Preconditions**: `aux_mining_hash` must be the target block's hash; `parent_mining_hash` must be the hash claimed by the miner.\n**Postconditions**: Returns `Ok(())` if the commitment is correct and the calculated Midstate header hash matches the claimed hash; otherwise, returns an error.\n**Z Notation (informal)**: $\\text{Check}(\\text{Template}, A, M) \\iff (\\text{CommitSalt} = \\text{merge\\_commitment}(A)) \\land (\\text{ParentMiningHash}(\\text{Template}, A) = M)$\n**Doc comment**: `/// Validates that the template commits to the aux_mining_hash and reproduces the parent's required Midstate header hash.`\n\n## Helper Functions (`tx_fold_item`, `input_coin_id`, etc.)\n\n**Reasoning**: These functions implement the specific folding logic required by Midstate for various transaction types (Commit, Reveal, Consolidate) and output kinds (Standard, Confidential, DataBurn). They ensure that the `pre_commit_midstate` calculation is accurate.\n**Preconditions**: Input JSON values must conform to expected Midstate transaction structures.\n**Postconditions**: Returns the 32-byte fold item hash for a given transaction element.\n**Z Notation (informal)**: $\\text{TxFoldItem}(T) = \\text{Blake3Hash}(\\text
