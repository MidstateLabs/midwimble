}(\\text{Point32} \\times \\mathbb{N}) \\}$\n**Doc comment**: `/// A built transaction plus what the sender needs to remember about it (e.g., change output).`\n\n---\n\n## Function Documentation\n\n### `build_transaction`\n**Reasoning**: This is the core function for constructing a standard user-initiated transaction. It aggregates inputs, calculates required outputs (payments + change), verifies fund sufficiency, generates cryptographic proofs (OutputGroup), and determines the necessary kernel offsets to ensure consensus rules are met (non-zero excess).\n**Preconditions**:\n1. `spend` must not be empty.\n2. `payments` must not be empty.\n3. All values in `payments` must be positive.\n4. $\\sum \\text{value}(\\text{spend}) \\ge \\text{fee} + \\sum \\text{value}(\\text{payments})$.\n**Postconditions**: Returns a `BuiltTransaction` containing a self-validated `Transaction`. The transaction adheres to the required cryptographic constraints ($e \\ne 0, e_{\\text{owner}} \\ne 0$).\n**Z Notation (informal)**: $\\text{build\\_transaction}(\\text{spend}, \\text{payments}, \\dots) \\Rightarrow \\text{BuiltTransaction} \\land (\\sum V_{in} \\ge \\sum V_{out}) \\land (e \\ne 0 \\land e_{\\text{owner}} \\ne 0)$\n**Doc comment**: `/// Builds and self-validates a transaction from selected inputs and payments.`\n\n### `build_coinbase`\n**Reasoning**: Provides a simple, convenience wrapper for creating a coinbase transaction, which is used by miners to reward themselves. It defaults the miner data (`extra`) to zero.\n**Preconditions**: `payouts` must not be empty. All values in `payouts` must be positive.\n**Postconditions**: Returns a `Coinbase` structure representing the mined reward.\n**Z Notation (informal)**: $\\text{build\\_coinbase}(\\text{payouts}) \\Rightarrow \\text{Coinbase}$\n**Doc comment**: `/// Builds a coinbase transaction paying specified amounts, using default miner data.`\n\n### `build_coinbase_with`\n**Reasoning**: The detailed implementation of coinbase construction. It handles the creation of outputs, calculates the total excess secret (sum of blindings), generates necessary `PayoutReceipts` for tracking, and constructs the specific `KernelFeatures::Coinbase` kernel.\n**Preconditions**:\n1. `payouts` must not be empty.\n2. All values in `payouts` must be positive.\n**Postconditions**: Returns a tuple containing a self-validated `Coinbase` structure and a vector of corresponding `PayoutReceipt`s, maintaining the order of the input `payouts`.\n**Z Notation (informal)**: $\\text{build\\_coinbase\\_with}(\\text{payouts}, \\text{extra}) \\Rightarrow (\\text{Coinbase}, \\text{PayoutReceipt}^n) \\land \\text{validate}(\\text{Coinbase})$\n**Doc comment**: `/// Builds a coinbase transaction with custom miner data, returning receipts for each payout.`\n\n### `owner_key_of`\n**Reasoning**: A utility function to derive the public key (commitment) from a private `owner_secret`. This is necessary for verifying ownership and constructing inputs.\n**Preconditions**: `owner_secret` must be a valid scalar.\n**Postconditions**: Returns the compressed `Point32` representation of the owner's public key.\n**Z Notation (informal)**: $\\text{owner\\_key\\_of}(s) \\Rightarrow P \\mid P = \\text{compress}(\\text{RistrettoPoint}(s))$\n**Doc comment**: `/// Convenience function to derive the public key (commitment) from an owner secret.`"}, {"path": "core/mw/crypto.rs", "module": "core", "doc": "## Core Cryptographic Primitives Documentation\n\n### `pc_gens()`\n1. **Reasoning**: Provides a globally accessible, lazily initialized reference to the Pedersen commitment generators (`G` and `H`), which are fundamental for constructing commitments $C = v \\cdot G + r \\cdot H$.\n2. **Preconditions**: None. The generator must be initialized (guaranteed by `OnceLock`).\n3. **Postconditions**: Returns a valid, static reference to the `PedersenGens` structure.\n4. **Z Notation (informal)**: $\\text{pc\\_gens}() \\rightarrow \\text{PedersenGens}$\n5. **Doc comment**: Retrieves the static, lazily initialized Pedersen commitment generators.\n\n### `bp_gens()`\n1. **Reasoning**: Provides a globally accessible, lazily initialized reference to the Bulletproof range proof generators, configured for `RANGE_BITS` (64) and `MAX_GROUP_OUTPUTS` (32).\n2. **Preconditions**: None. The generator must be initialized (guaranteed by `OnceLock`).\n3. **Postconditions**: Returns a valid, static reference to the `BulletproofGens` structure.\n4. **Z Notation (informal)**: $\\text{bp\\_gens}() \\rightarrow \\text{BulletproofGens}$\n5. **Doc comment**: Retrieves the static, lazily initialized Bulletproof range proof generators configured for 64-bit values and up to 32 outputs.\n\n### `gen_g()`\n1. **Reasoning**: Returns the Ristretto basepoint $G$, which serves as the value generator for wallet keys, owner keys, and owner excesses in Pedersen commitments.\n2. **Preconditions**: `pc_gens()` must be initialized.\n3. **Postconditions**: Returns the static Ristretto basepoint $G$.\n4. **Z Notation (informal)**: $\\text{gen\\_g}() \\rightarrow G$\n5. **Doc comment**: Returns the Ristretto basepoint $G$, used as the value generator in Pedersen commitments.\n\n### `gen_h()`\n1. **Reasoning**: Returns the blinding generator $H$, used specifically for blinding factors and the Pedersen kernel excess, ensuring separation between value and blinding components.\n2. **Preconditions**: `pc_gens()` must be initialized.\n3. **Postconditions**: Returns the static blinding point $H$.\n4. **Z Notation (informal)**: $\\text{gen\\_h}() \\rightarrow H$\n5. **Doc comment**: Returns the blinding generator $H$, used for blinding factors and kernel excesses.\n\n### `decompress(bytes: &Point32)`\n1. **Reasoning**: Converts a canonical 32-byte compressed Ristretto point representation back into the full `RistrettoPoint` structure for internal arithmetic operations.\n2. **Preconditions**: `bytes` must be a valid, canonical 32-byte compressed Ristretto point encoding.\n3. **Postconditions**: Returns `Some(RistrettoPoint)` if decompression is successful, otherwise `None`.\n4. **Z Notation (informal)**: $\\text{decompress}(\\text{bytes}) \\rightarrow \\text{Option}(\\text{RistrettoPoint})$\n5. **Doc comment**: Decompresses a 32-byte canonical Ristretto point encoding into an internal `RistrettoPoint`.\n\n### `compress(point: &RistrettoPoint)`\n1. **Reasoning**: Converts an internal `RistrettoPoint` structure into its canonical, 32-byte compressed representation for serialization and hashing.\n2. **Preconditions**: `point` must be a valid `RistrettoPoint`.\n3. **Postconditions**: Returns the 32-byte canonical compressed point encoding.\n4. **Z Notation (informal)**: $\\text{compress}(\\text{point}) \\rightarrow \\text{Point32}$\n5. **Doc comment**: Compresses an internal `RistrettoPoint` into its 32-byte canonical representation.\n\n### `scalar_from_bytes(bytes: &Scalar32)`\n1. **Reasoning**: Parses a 32-byte scalar, strictly enforcing canonical encoding to prevent malleability attacks where the same value has multiple byte representations.\n2. **Preconditions**: `bytes` must be a canonically encoded 32-byte scalar.\n3. **Postconditions**: Returns `Some(Scalar)` if canonical parsing succeeds, otherwise `None`.\n4. **Z Notation (informal)**: $\\text{scalar\\_from\\_bytes}(\\text{bytes}) \\rightarrow \\text{Option}(\\text{Scalar})$\n5. **Doc comment**: Parses a 32-byte scalar, rejecting non-canonical encodings to ensure hash consistency and prevent malleability.\n\n### `hash_to_scalar(domain: &[u8], parts: &[&[u8]])`\n1. **Reasoning**: Implements domain separation by hashing input parts (including length prefixes) using BLAKE3 XOF, then reducing the 64-byte output modulo the curve order $\\ell$. This ensures uniform distribution and prevents cross-protocol attacks.\n2. **Preconditions**: `domain` and all elements in `parts` must be valid byte slices.\n3. **Postconditions**: Returns a uniformly distributed `Scalar` derived from the hash output, reduced modulo $\\ell$.\n4. **Z Notation (informal)**: $\\text{hash\\_to\\_scalar}(\\text{domain}, \\text{parts}) \\rightarrow \\text{Scalar}$\n5. **Doc comment**: Computes a domain-separated, length-prefixed hash using BLAKE3 XOF and reduces the 64-byte output to a curve scalar.\n\n### `commit(value: u64, blinding: &Scalar)`\n1. **Reasoning**: Creates a Pedersen commitment $C = v \\cdot G + r \\cdot H$ for a specific value $v$, ensuring that the value is hidden by the blinding factor $r$.\n2. **Preconditions**: `value` must be a 64-bit integer; `blinding` must be a valid `Scalar`.\n3. **Postconditions**: Returns the resulting `RistrettoPoint` commitment $C$.\n4. **Z Notation (informal)**: $\\text{commit}(v, r) \\rightarrow C$ where $C = v \\cdot G + r \\cdot H$\n5. **Doc comment**: Creates a Pedersen commitment $C = v \\cdot G + r \\cdot H$ for a given 64-bit value and blinding factor.\n\n### `sum_points<'a>(points: impl IntoIterator<Item = &'a Point32>)`\n1. **Reasoning**: Allows aggregation of multiple compressed commitments by summing their underlying `RistrettoPoint` representations, necessary for efficient verification of multi-output transactions.\n2. **Preconditions**: All input `Point32` slices must represent valid, canonical Ristretto points.\n3. **Postconditions**: Returns the sum of all decompressed points as a single `RistrettoPoint`, or an error if any point encoding is invalid.\n4. **Z Notation (informal)**: $\\text{sum\\_points}(\\{P_i\\}) \\rightarrow \\sum P_i$\n5. **Doc comment**: Sums a list of compressed Ristretto points, failing if any input encoding is invalid.\n\n### `range_proof_len(n: usize)`\n1. **Reasoning**: Calculates the exact serialized byte length of an aggregated Bulletproof for $n$ values, accounting for padding up to the next power of two ($m$) and the structure of the proof (9 points, 2 inner-product vectors).\n2. **Preconditions**: $n \\ge 1$.\n3. **Postconditions**: Returns the required byte length in bytes.\n4. **Z Notation (informal)**: $\\text{range\\_proof\\_len}(n) = (9 + 2 \\cdot \\log_2(64 \\cdot m)) \\cdot 32$ where $m = \\lceil n \\rceil_{2^k}$\n5. **Doc comment**: Calculates the serialized byte length of an aggregated range proof covering $n$ values, including padding.\n\n### `prove_range(values: &[u64], blindings: &[Scalar], binding: &[u8; 32])`\n1. **Reasoning**: Generates a Bulletproof proving that every input value lies within the $[0, 2^{64})$ range. The proof is bound to a specific `binding` hash to prevent output redirection (transcript binding).\n2. **Preconditions**: $1 \\le n \\le 32$, where $n$ is the length of `values` and `blindings`. `values.len()` must equal `blindings.len()`.\n3. **Postconditions**: Returns a `Vec<u8>` containing the serialized proof, or an error if constraints are violated or proof generation fails.\n4. **Z Notation (informal)**: $\\text{prove\\_range}(V, R, B) \\rightarrow \\text{Proof} \\land \\forall v \\in V: 0 \\le v < 2^{64}$\n5. **Doc comment**: Generates an aggregated Bulletproof proving that all input values are within the $[0, 2^{64})$ range, bound to a specific metadata hash.\n\n### `verify_range(proof_bytes: &[u8], commitments: &[Point32], binding: &[u8; 32])`\n1. **Reasoning**: Verifies the aggregated Bulletproof against the provided commitments and ensures the proof is bound to the correct metadata (`binding`). This confirms that all committed values are within the required range.\n2. **Preconditions**: $1 \\le n \\le 32$, where $n$ is `commitments.len()`. `proof_bytes.len()` must match `range_proof_len(n)`.\n3. **Postconditions**: Returns `true` if the proof is valid and bound correctly, otherwise `false`.\n4. **Z Notation (informal)**: $\\text{verify\\_range}(\\text{Proof}, C, B) \\rightarrow \\text{True} \\iff \\text{Proof} \\text{ verifies } C \\text{ under binding } B$\n5. **Doc comment**: Verifies an aggregated range proof against the corresponding commitments and ensures the proof is bound to the correct metadata hash.\n\n### `schnorr_challenge(public: &Point32, r: &Point32, msg: &[u8; 32])`\n1. **Reasoning**: Calculates the key-prefixed Schnorr challenge $e = H(P \\parallel R \\parallel m)$. Including the public key $P$ in the hash prevents signature malleability (e.g., converting a signature for $P$ into one for $P+k\\cdot H$).\n2. **Preconditions**: `public`, `r`, and `msg` must be valid, canonical 32-byte encodings.\n3. **Postconditions**: Returns the calculated challenge scalar $e$.\n4. **Z Notation (informal)**: $\\text{schnorr\\_challenge}(P, R, m) \\rightarrow e$ where $e = H(P \\| R \\| m)$\n5. **Doc comment**: Computes the key-prefixed Schnorr challenge $e = H(P \\parallel R \\parallel m)$, ensuring signature binding to the public key.\n\n### `schnorr_sign(secret: &Scalar, msg: &[u8; 32])`\n1. **Reasoning**: Generates an $(e, s)$-form Schnorr signature using a hashed nonce $k = H(\\text{secret} \\parallel \\text{msg} \\parallel \\text{random})$ to prevent key leakage via nonce reuse.\n2. **Preconditions**: `secret` must be a valid scalar; `msg` must be a 32-byte message.\n3. **Postconditions**: Returns a `SchnorrSig` struct containing the challenge $e$ and response $s$.\n4. **Z Notation (informal)**: $\\text{schnorr\\_sign}(sk, m) \\rightarrow (e, s)$ where $R = k \\cdot G$, $e = H(P \\| R \\| m)$, $s = k + e \\cdot sk$\n5. **Doc comment**: Generates an $(e, s)$-form Schnorr signature using a hashed nonce to prevent key leakage from nonce reuse.\n\n### `schnorr_verify(public: &Point32, msg: &[u8; 32], sig: &SchnorrSig)`\n1. **Reasoning**: Verifies the Schnorr signature by checking the identity $R' = s \\cdot G - e \\cdot P$ and ensuring that the calculated challenge matches the provided challenge $e$.\n2. **Preconditions**: `public`, `msg`, and `sig` must be valid, canonical 32-byte encodings. The public key must not be the identity point.\n3. **Postconditions**: Returns `true` if the signature is valid, otherwise `false`.\n4. **Z Notation (informal)**: $\\text{schnorr\\_verify}(P, m, (e, s)) \\rightarrow \\text{True} \\iff H(P \\| R' \\| m) = e$ where $R' = s \\cdot G - e \\cdot P$\n5. **Doc comment**: Verifies an $(e, s)$-form Schnorr signature against the public key and message.\n\n### `kernel_challenge(...)`\n1. **Reasoning**: Calculates the kernel challenge $c = H(E \\parallel E' \\parallel R_1 \\parallel R_2 \\parallel m)$. This binding ensures that both excess keys ($e$ and $e'$) agree on the context before signing, crucial for multi-party ownership fixes.\n2. **Preconditions**: All input points (`excess`, `owner_excess`, `r1`, `r2`) must be valid, canonical 32-byte encodings; `msg` must be 32 bytes.\n3. **Postconditions**: Returns the calculated challenge scalar $c$.\n4. **Z Notation (informal)**: $\\text{kernel\\_challenge}(E, E', R_1, R_2, m) \\rightarrow c$ where $c = H(E \\| E' \\| R_1 \\| R_2 \\| m)$\n5. **Doc comment**: Computes the kernel challenge $c = H(E \\parallel E' \\parallel R_1 \\parallel R_2 \\parallel m)$, binding the proof to both excess keys and their respective commitments.\n\n### `kernel_sign(...)`\n1. **Reasoning**: Generates a `KernelSig` proving knowledge of *both* excess secrets ($e$ and $e'$). By using separate nonce commitments ($R_1$ on $H$, $R_2$ on $G$), it prevents an attacker from satisfying the proof while knowing only a combined representation of $E+E'$.\n2. **Preconditions**: All input secrets (`excess_secret`, `owner_secret`) and points (`excess`, `owner_excess`) must be valid. `msg` must be 32 bytes.\n3. **Postconditions**: Returns a `KernelSig` struct containing the challenge $c$ and responses $s_1, s_2$.\n4. **Z Notation (informal)**: $\\text{kernel\\_sign}(e_{sk}, o_{sk}, E, E', m) \\rightarrow (c, s_1, s_2)$ where $R_1 = k_1 \\cdot H$, $R_2 = k_2 \\cdot G$, $s_1 = k_1 + c \\cdot e_{sk}$, $s_2 = k_2 + c \\cdot o_{sk}$\n5. **Doc comment**: Generates a `KernelSig` proving knowledge of both excess secrets ($e$ and $e'$), using separate commitments $R_1$ (on $H$) and $R_2$ (on $G$).\n\n### `kernel_verify(...)`\n1. **Reasoning**: Verifies the `KernelSig` by checking the two Schnorr-like equations ($R_1 = s_1 \\cdot H - c \\cdot E$ and $R_2 = s_2 \\cdot G - c \\cdot E'$) and ensuring the calculated challenge matches the provided challenge $c$.\n2. **Preconditions**: All input points (`excess`, `owner_excess`) must be valid; `msg` must be 32 bytes; `sig` must contain valid, canonical scalars.\n3. **Postconditions**: Returns `true` if both verification equations hold and the challenge matches, otherwise `false`.\n4. **Z Notation (informal)**: $\\text{kernel\\_verify}(E, E', m, (c, s_1, s_2)) \\rightarrow \\text{True} \\iff R_1 = s_1 \\cdot H - c \\cdot E \\land R_2 = s_2 \\cdot G - c \\cdot E' \\land H(E \\| E' \\| R_1 \\| R_2 \\| m) = c$\n5. **Doc comment**: Verifies a `KernelSig` by checking the two required Schnorr-like equations and ensuring the challenge is correctly bound to all inputs.\n\n### `binding_hash(domain: &[u8], parts: &[&[u8]])`\n1. **Reasoning**: Provides a utility function for creating a fixed 32-byte hash used as a binding key for metadata that is not itself a point or scalar (e.g., transaction context).\n2. **Preconditions**: `domain` and all elements in `parts` must be valid byte slices.\n3. **Postconditions**: Returns a fixed 32-byte array representing the domain-separated hash.\n4. **Z Notation (informal)**: $\\"}, {"path": "core/mw/mod.rs", "module": "core", "doc": "## Documentation for `core/mw/mod.rs` Interfaces\n\nSince this file primarily acts as a module entry point and re-exports complex data structures rather than defining individual functions, the documentation below focuses on key interfaces (types) and their critical methods (e.g., `Transaction::validate`) to demonstrate the required formal specification.\n\n### 1. `Transaction::validate(context: Context)`\n\n**Reasoning**: This function is the core integrity check for any transaction in the MimbleWimble system. It ensures that all cryptographic constraints (Pedersen equations, range proofs, signatures) and business logic rules (input/output balance, fee constraints) are met before the transaction can be accepted by a relay or block validator.\n\n**Preconditions**:\n1. The `Transaction` structure must be fully constructed (i.e., not an empty transaction unless validated in a `Block` context).\n2. All internal cryptographic proofs (`OutputGroup`, `Input` signatures) must be correctly formed and verifiable.\n3. The `Context` parameter must accurately reflect the validation environment (e.g., `Relay` for mempool checks, `Block` for final state checks).\n\n**Postconditions**:\n1. If successful, the transaction is cryptographically and logically sound within the given context.\n2. If unsuccessful, a detailed error indicating the specific violation (e.g., \"owner sum mismatch\", \"range proof failure\") is returned.\n\n**Z Notation (informal)**:\n$$\\text{validate}(T, C) \\triangleq \\begin{cases} \\text{True} & \\text{if } (\\forall i \\in \\text{Inputs}, \\text{verify\\_sig}(i)) \\land (\\text{PedersenBalance}(T)) \\land (\\text{RangeProof}(T)) \\\\ \\text{False} & \\text{otherwise} \\end{cases}$$\n\n**Doc comment**:\n```rust\n/// Validates the transaction against all cryptographic and business rules for the given context.\n/// Returns Ok(()) if valid, or an error detailing the specific failure.\npub fn validate(&self, context: Context) -> Result<(), String>\n```\n\n### 2. `Input::verify_signature()`\n\n**Reasoning**: This method confirms that the input was genuinely signed by the owner of the UTXO being spent. This is crucial for preventing unauthorized spending and enforcing ownership rules defined by the owner key.\n\n**Preconditions**:\n1. The `Input` must be correctly constructed, containing the commitment, the signature, and the associated owner key.\n2. The underlying cryptographic primitives (e.g., Schnorr signatures) must be implemented correctly.\n\n**Postconditions**:\n1. Returns `true` if the signature verifies against the public key derived from the owner key and the UTXO commitment.\n2. Returns `false` otherwise.\n\n**Z Notation (informal)**:\n$$\\text{verify\\_signature}(I) \\triangleq \\text{Verify}(\\text{Sig}_I, \\text{Commit}_I, \\text{OwnerKey}_I)$$\n\n**Doc comment**:\n```rust\n/// Verifies the input signature against the UTXO commitment and owner key.\npub fn verify_signature(&self) -> bool\n```\n\n### 3. `Kernel::verify_sums()`\n\n**Reasoning**: The kernel is the mechanism that enforces the conservation of value (Pedersen equation) and the ownership constraints (owner sum). This method checks that the input commitments equal the output commitments, adjusted by the kernel's internal values (`e` and `e_owner`).\n\n**Preconditions**:\n1. The `Kernel` must be associated with a valid transaction body (`TxBody`).\n2. All required offsets (`kernel_offset`, `owner_offset`) must be present and correctly decoded.\n3. The input and output commitments must be correctly linked via the kernel's blinding factors.\n\n**Postconditions**:\n1. If successful, the Pedersen balance equation ($\\sum \\text{Inputs} = \\sum \\text{Outputs} + \\text{Kernel}$) holds, and the owner sum constraint is satisfied.\n2. If unsuccessful, an error indicating a mismatch in the sums (e.g., \"Pedersen mismatch\" or \"owner sum failure\") is returned.\n\n**Z Notation (informal)**:\n$$\\text{verify\\_sums}(K, T) \\triangleq (\\sum_{i \\in \\text{Inputs}} C_i = \\sum_{o \\in \\text{Outputs}} C_o + K_{\\text{value}}) \\land (\\sum \\text{Ko}_{\\text{in}} = \\sum E' + x \\cdot G)$$\n\n**Doc comment**:\n```rust\n/// Verifies the core MimbleWimble constraints: Pedersen balance and owner sum.\n/// This ensures value conservation and prevents theft/reuse attacks.\npub fn verify_sums(&self) -> Result<(), String>\n```\n\n### 4. `OutputGroup::prove(...)`\n\n**Reasoning**: Output Groups allow multiple unspent outputs (UTXOs) to be aggregated into a single commitment, enabling transaction privacy and efficient verification. The `prove` function generates the necessary cryptographic proof that the provided set of outputs is valid and unspent.\n\n**Preconditions**:\n1. All provided outputs must be valid UTXOs (i.e., they must have been created via `scan_output`).\n2. The values and blinding factors must correspond correctly to the commitments in the output list.\n\n**Postconditions**:\n1. Returns a verifiable `OutputGroup` structure containing the aggregated commitment and the proof data.\n2. If the inputs are inconsistent or invalid, returns an error.\n\n**Z Notation (informal)**:\n$$\\text{prove}(O, V, B) \\triangleq \\text{Commit} = \\sum_{o \\in O} C_o \\land \\text{Proof} = \\text{Witness}(\\text{Commit}, O, V, B)$$\n\n**Doc comment**:\n```rust\n/// Generates a cryptographic proof (OutputGroup) for a set of unspent outputs.\n/// This enables privacy by aggregating commitments without revealing individual values.\npub fn prove(outputs: Vec<Output>, values: &[u64], blindings: &[Scalar32]) -> Result<Self, String>\n```"}, {"path": "core/mw/stealth.rs", "module": "core", "doc": "## StealthAddress\n\n**Reasoning**: Represents a recipient's public identity in the MimbleWimble context, containing the scan key (`A`), spend key (`B`), and a recovery key for disaster recovery (MSS). It is the canonical address format used for payments.\n**Preconditions**: The internal `scan` and `spend` keys must be valid compressed curve points and must not be the identity point.\n**Postconditions**: The address can be reliably encoded into a Bech32m string and decoded back, provided the input string is valid.\n**Z Notation (informal)**: $\\text{StealthAddress} \\equiv \\{ \\text{scan}: \\text{Point32}, \\text{spend}: \\text{Point32}, \\text{recovery}: [u8; 32] \\} \\land (\\text{scan} \\ne \\text{Identity}) \\land (\\text{spend} \\ne \\text{Identity})$\n**Doc comment**: A recipient address containing the scan key, spend key, and recovery key.\n\n## StealthAddress::encode\n\n**Reasoning**: Converts the internal structured address data into the standardized, human-readable Bech32m format (`mw1...`).\n**Preconditions**: The `StealthAddress` instance must be valid (i.e., keys are non-identity).\n**Postconditions**: A valid Bech32m string starting with `mw1` is returned, representing the address.\n**Z Notation (informal)**: $\\text{encode}(\\text{addr}) \\rightarrow \\text{string} \\land \\text{startswith}(\\text{string}, \\text{\"mw1\"})$\n**Doc comment**: Encodes the address into a Bech32m string (`mw1...`).\n\n## StealthAddress::decode\n\n**Reasoning**: Parses a Bech32m string back into a validated `StealthAddress` structure, ensuring format and key validity.\n**Preconditions**: The input string must be a valid Bech32m encoding starting with `mw1` and conform to the expected length (97 bytes).\n**Postconditions**: Returns `Ok(StealthAddress)` if parsing is successful and keys are non-identity; otherwise, returns an `Err` detailing the validation failure.\n**Z Notation (informal)**: $\\text{decode}(\\text{s}) \\rightarrow \\text{Result}(\\text{StealthAddress}) \\land (\\text{s} \\in \\text{ValidBech32m})$\n**Doc comment**: Decodes a Bech32m string into a validated `StealthAddress`.\n\n## StealthAddress::points\n\n**Reasoning**: Extracts the underlying Ristretto points from the compressed byte representations, performing necessary decompression and identity checks.\n**Preconditions**: Both `scan` and `spend` byte arrays must represent valid, non-identity compressed curve points.\n**Postconditions**: Returns `Ok((RistrettoPoint, RistrettoPoint))` containing the decompressed scan and spend keys; otherwise, returns an error.\n**Z Notation (informal)**: $\\text{points}(\\text{addr}) \\rightarrow \\text{Result}((\\text{scan}_{\\text{Ristretto}}, \\text{spend}_{\\text{Ristretto}})) \\land (\\text{scan}_{\\text{Ristretto}} \\ne \\text{Identity}) \\land (\\text{spend}_{\\text{Ristretto}} \\ne \\text{Identity})$\n**Doc comment**: Decompresses and validates the scan and spend keys as Ristretto points.\n\n## WalletKeys\n\n**Reasoning**: Holds the private secrets (`scan_secret`, `spend_secret`) and the recovery key necessary for full control over a wallet. It implements zeroization on drop to protect secrets in memory.\n**Preconditions**: None upon creation, but secrets must be handled securely (zeroized).\n**Postconditions**: Provides methods to derive the public `StealthAddress` and manage key persistence (`to_bytes`, `from_bytes`). Secrets are zeroized when the struct is dropped.\n**Z Notation (informal)**: $\\text{WalletKeys} \\equiv \\{ \\text{scan\\_secret}: \\text{Scalar}, \\text{spend\\_secret}: \\text{Scalar}, \\text{recovery\\_key}: [u8; 32] \\} \\land (\\text{drop}(\\text{keys}) \\Rightarrow \\text{zeroize}(\\text{secrets}))$\n**Doc comment**: Holds the private scan and spend secrets, along with the recovery key. Secrets are zeroized on drop.\n\n## WalletKeys::from_seed\n\n**Reasoning**: Derives wallet keys deterministically from a BIP39 seed and a known recovery root, ensuring consistent key derivation across wallets.\n**Preconditions**: `seed` must be a valid byte slice; `recovery_key` must be 32 bytes.\n**Postconditions**: Returns a `WalletKeys` instance where secrets are derived via domain-separated hashing from the seed.\n**Z Notation (informal)**: $\\text{from\\_seed}(\\text{seed}, \\text{rk}) \\rightarrow \\text{keys} \\land (\\text{scan}_{\\text{keys}} = \\text{Hash}(\\text{\"midwimble.wallet.scan.v1\"}, \\text{seed}))$\n**Doc comment**: Derives wallet keys deterministically from a BIP39 seed and recovery key.\n\n## WalletKeys::random\n\n**Reasoning**: Provides a mechanism for generating ephemeral or test wallet keys without relying on a seed, useful for testing or non-custodial tools that don't require recovery.\n**Preconditions**: None.\n**Postconditions**: Returns a `WalletKeys` instance with randomly generated secrets and a random recovery key.\n**Z Notation (informal)**: $\\text{random}() \\rightarrow \\text{keys} \\land (\\text{scan}_{\\text{keys}} \\sim \\text{Scalar}_{\\text{Random}})$\n**Doc comment**: Generates random wallet keys suitable for testing or non-custodial use.\n\n## WalletKeys::address\n\n**Reasoning**: Computes the public `StealthAddress` from the private secrets by performing scalar multiplication and compression.\n**Preconditions**: `scan_secret` and `spend_secret` must be valid scalars.\n**Postconditions**: Returns a `StealthAddress` containing the compressed public keys derived from the secrets.\n**Z Notation (informal)**: $\\text{address}(\\text{keys}) \\rightarrow \\text{addr} \\land (\\text{scan}_{\\text{addr}} = \\text{Compress}(\\text{scan}_{\\text{secret}} \\cdot G))$\n**Doc comment**: Computes the public `StealthAddress` from the private wallet secrets.\n\n## WalletKeys::to_bytes / WalletKeys::from_bytes\n\n**Reasoning**: Provides canonical serialization and deserialization of the wallet state (secrets + recovery key) for persistence, ensuring that only canonical scalars can be loaded, preventing corruption attacks.\n**Preconditions**: `to_bytes` requires valid secrets; `from_bytes` requires a 96-byte array where the first two 32-byte segments are canonical scalars.\n**Postconditions**: `to_bytes` returns a fixed-size array of 3x32 bytes. `from_bytes` returns `Some(WalletKeys)` if all inputs are valid and canonical; otherwise, `None`.\n**Z Notation (informal)**: $\\text{from\\_bytes}(\\text{bytes}) \\rightarrow \\text{Result}(\\text{keys}) \\land (\\text{bytes}[0] \\in \\text{CanonicalScalar})$\n**Doc comment**: Serializes/deserializes the wallet state (secrets and recovery key) to/from a canonical byte array.\n\n## ViewKey\n\n**Reasoning**: Represents a read-only, watch-only view of an address. It holds the `scan_secret` but *not* the `spend_secret`, ensuring that while payments can be detected and valued, they cannot be spent.\n**Preconditions**: The internal `scan_secret` must be a valid scalar.\n**Postconditions**: Provides methods to encode/decode the view key and perform scan operations without exposing spending capability. The `scan_secret` is zeroized on drop.\n**Z Notation (informal)**: $\\text{ViewKey} \\equiv \\{ \\text{scan\\_secret}: \\text{Scalar}, \\text{address}: \\text{StealthAddress} \\} \\land (\\text{drop}(\\text{view}) \\Rightarrow \\text{zeroize}(\\text{scan\\_secret}))$\n**Doc comment**: A read-only key allowing detection and valuation of payments without spending capability.\n\n## ViewKey::encode / ViewKey::decode\n\n**Reasoning**: Standardizes the view key into a specific Bech32m format (`mwview1...`) for sharing and auditing, ensuring the private `scan_secret` is included for scanning but not the spend secret.\n**Preconditions**: The internal `scan_secret` must be a valid scalar; the address must be valid.\n**Postconditions**: Returns a valid Bech32m string upon encoding; returns `Ok(ViewKey)` upon decoding, provided the format and version match.\n**Z Notation (informal)**: $\\text{encode}(\\text{view}) \\rightarrow \\text{string} \\land \\text{startswith}(\\text{string}, \\text{\"mwview1\"})$\n**Doc comment**: Encodes/decodes the view key into a Bech32m string (`mwview1...`).\n\n## ViewKey::may_own\n\n**Reasoning**: Implements the probabilistic check used by scanning wallets to quickly filter outputs. It verifies if the output's ephemeral key, when combined with the scan secret, yields a shared secret whose view tag matches the output's tag.\n**Preconditions**: `ephemeral_key` must be a valid compressed point; `tag` must be a single byte (0-255).\n**Postconditions**: Returns `true` if the view tag check passes, and `false` otherwise. This is a necessary but not sufficient condition for ownership.\n**Z Notation (informal)**: $\\text{may\\_own}(\\text{view}, \\text{ephemeral}, \\text{tag}) \\iff \\text{view\\_tag}(\\text{SharedSecret}(\\text{scan}_{\\text{view}} \\cdot \\text{ephemeral})) = \\text{tag}$\n**Doc comment**: Checks if an output's ephemeral key matches the view key's scan secret and view tag.\n\n## ViewKey::scan\n\n**Reasoning**: Performs a full, deterministic scan of a single output. It verifies the view tag, decrypts the payload, checks the on-chain commitment, and crucially, verifies that the derived owner key can be signed by the address's spend secret.\n**Preconditions**: The `output` must be a valid on-chain structure; the internal keys must be valid.\n**Postconditions**: Returns `Some((value, recovery_ok))` if all cryptographic checks pass (including owner key validation); otherwise, returns `None`.\n**Z Notation (informal)**: $\\text{scan}(\\text{view}, \\text{output}) \\rightarrow \\text{Option}((\\text{value}, \\text{recovery\\_ok})) \\land (\\text{is\\_valid\\_owner\\_key} \\implies \\text{Some})$\n**Doc comment**: Scans a single output, returning the value and recovery commitment status if ownership is confirmed.\n\n## NewOutput\n\n**Reasoning**: A temporary structure used during output creation, holding the public `Output` data alongside the private secrets (`value`, `blinding`, `ephemeral_secret`) needed to construct the output correctly.\n**Preconditions**: The target `StealthAddress` must be valid.\n**Postconditions**: Returns a fully constructed `NewOutput` containing all necessary components for on-chain commitment and subsequent scanning.\n**Z Notation (informal)**: $\\text{NewOutput} \\equiv \\{ \\text{output}: \\text{Output}, \\text{value}: u64, \\text{blinding}: \\text{Scalar}, \\text{ephemeral\\_secret}: \\text{Scalar} \\}$\n**Doc comment**: A freshly created output along with the private secrets required for its construction.\n\n## PayoutReceipt\n\n**Reasoning**: A public proof generated by the sender that an output pays a specific value to a specific address. It is verifiable by anyone without revealing the full blinding factor or spending secret, but it grants no spending power.\n**Preconditions**: The `to` address must be valid; the `output` must be a valid on-chain structure.\n**Postconditions**: `verify()` returns `true` if the receipt correctly matches all public fields of the output (commitment, owner key, view tag, recovery commitment) and the ephemeral key matches the receipt's secret.\n**Z Notation (informal)**: $\\text{verify}(\\text{receipt}, \\text{to}, \\text{output}) \\iff (\\text{ephemeral\\_key}_{\\text{output}} = \\text{Compress}(\\text{secret}_{\\text{receipt}} \\cdot G)) \\land (\\text{CommitmentMatch}) \\land (\\text{OwnerKeyMatch}) \\land (\\text{ViewTagMatch}) \\land (\\text{RecoveryMatch})$\n**Doc comment**: A public proof confirming an output's value and recipient, verifiable against the on-chain data.\n\n## new_output\n\n**Reasoning**: The core function for creating a valid stealth output. It deterministically generates all required cryptographic components (shared secret $t$, owner key $Ko$, view tag, payload) ensuring consistency with the address and value.\n**Preconditions**: `to` must be a valid `StealthAddress`; `value` must be a non-negative 64-bit integer.\n**Postconditions**: Returns `Ok(NewOutput)` containing a fully constructed, cryptographically sound output structure.\n**Z Notation (informal)**: $\\text{new\\_output}(\\text{to}, \\text{v}) \\rightarrow \\text{Result}(\\text{NO}) \\land (\\text{Commitment}_{\\text{NO}} = \\text{Commit}(\\text{v}, \\text{blinding})) \\land (\\text{OwnerKey}_{\\text{NO}} = \\text{Compress}(\\text{owner\\_tweak}(t) + \\text{spend}))$\n**Doc comment**: Creates a new, cryptographically valid stealth output paying the specified value to the recipient.\n\n## OwnedOutput\n\n**Reasoning**: Represents the complete knowledge gained by a wallet about one of its outputs after successful scanning. It includes the private `owner_secret` needed for spending and the `blinding` factor.\n**Preconditions**: Must be derived successfully via `scan_output`.\n**Postconditions**: Provides access to the output's value, blinding factor, and the secret required to sign inputs (`owner_secret`). Secrets are zeroized on drop.\n**Z Notation (informal)**: $\\text{OwnedOutput} \\equiv \\{ \\text{value}: u64, \\text{blinding}: \\text{Scalar}, \\text{owner\\_secret}: \\text{Scalar}, \\text{recovery\\_salt}: [u8; 32] \\} \\land (\\text{drop}(\\text{output}) \\Rightarrow \\text{zeroize}(\\text{secrets}))$\n**Doc comment**: The complete, private view of a single output, including the owner secret required for spending.\n\n## scan_output\n\n**Reasoning**: The primary function for a full wallet scan. It verifies all cryptographic constraints (view tag, commitment, owner key) and, critically, confirms that the derived owner key matches the spend key of the address, preventing unauthorized or redirected outputs from being counted.\n**Preconditions**: `keys` must be a valid `WalletKeys` instance; `output` must be a valid on-chain structure.\n**Postconditions**: Returns `Some(OwnedOutput)` if all checks pass and the output belongs to the wallet; otherwise, returns `None`.\n**Z Notation (informal)**: $\\text{scan\\_output}(\\text{keys}, \\text{output}) \\rightarrow \\text{Option}(\\text{OO}) \\land (\\text{OwnerKey}_{\\text{output}} = \\text{Compress}(\\text{tweak}(t) + \\text{spend}_{\\text{keys}}))$\n**Doc comment**: Recognizes and opens an output addressed to the wallet, returning full private details if ownership is confirmed.\n\n## scan_output_view_only\n\n**Reasoning**: Provides a lightweight, non-spending scan for watch-only wallets (`ViewKey`). It only verifies the view tag and payload commitment, ignoring the owner key check, as the `ViewKey` lacks the spend secret.\n**Preconditions**: `view` must be a valid `ViewKey`; `output` must be a valid on-chain structure.\n**Postconditions**: Returns `Some(u64)` containing the output value if the view tag and payload are valid; otherwise, returns `None`.\n**Z Notation (informal)**: $\\text{scan\\_view\\_only}(\\text{view}, \\text{output}) \\rightarrow \\text{Option}(u64) \\land (\\text{ViewTagMatch} \\land \\text{CommitmentMatch})$\n**Doc comment**: Performs a watch-only scan, returning the output value if it matches the view key's scan secret.\n\n## detect (Internal Helper)\n\n**Reasoning**: Centralizes the cryptographic validation logic: ephemeral key decompression, shared secret calculation, view tag check, payload decryption, and commitment verification.\n**Preconditions**: `scan_secret` and `spend_public` must be valid; `output` must be a valid on-chain structure.\n**Postconditions**: Returns `Some((value, blinding, tweak, salt))` if all cryptographic checks pass; otherwise, returns `None`.\n**Z Notation (informal)**: $\\text{detect}(\\text{s}, \\text{p}, \\text{o}) \\rightarrow \\text{Option}((v"}, {"path": "core/mw/transaction.rs", "module": "core", "doc": "## Output Structs\n\n### `Output`\n1. **Reasoning**: Represents a single UTXO in the MimbleWimble system, containing commitments, ownership keys, and encrypted value data.\n2. **Preconditions**: The commitment and owner key must be valid non-identity points; payload length must equal `PAYLOAD_LEN`.\n3. **Postconditions**: A valid, well-formed output structure is returned/validated.\n4. **Z Notation (informal)**: $\\text{Output} \\triangleq \\{ \\text{commitment}: P_{32}, \\text{owner\\_key}: P_{32}, \\dots \\} \\land \\text{isValid}(\\text{commitment}) \\land \\text{len}(\\text{payload}) = \\text{PAYLOAD\\_LEN}$\n5. **Doc comment**: `/// Represents a single MimbleWimble output (UTXO) with commitment, owner key, and encrypted value.`\n\n#### `Output::metadata_hash`\n1. **Reasoning**: Provides a unique, deterministic identifier for the output used in range proof binding, excluding data already covered by the commitment.\n2. **Preconditions**: `self` must be a valid `Output`.\n3. **Postconditions**: A 32-byte domain hash representing the metadata of the output.\n4. **Z Notation (informal)**: $\\text{MetadataHash}(\\text{o}) = \\text{HashDomain}(\\text{\"midwimble.output.metadata.v1\"}, \\{\\text{o}.\\text{owner\\_key}, \\dots\\})$\n5. **Doc comment**: `/// Computes the hash of all fields used for range proof binding, excluding the commitment itself.`\n\n#### `Output::check_encoding`\n1. **Reasoning**: Ensures that the internal cryptographic fields (commitments, keys, ephemeral keys) are correctly formatted and non-identity where required.\n2. **Preconditions**: `self` must be a populated `Output`.\n3. **Postconditions**: Returns `Ok(())` if all fields are valid; otherwise, returns an error detailing the invalid structure.\n4. **Z Notation (informal)**: $\\text{CheckEncoding}(\\text{o}) \\Rightarrow (\\text{decompress}(\\text{o}.\\text{commitment}) \\ne \\text{IDENTITY}) \\land \\text{len}(\\text{o}.\\text{payload}) = \\text{PAYLOAD\\_LEN}$\n5. **Doc comment**: `/// Validates the internal cryptographic structure and field lengths of the output.`\n\n### `OutputGroup`\n1. **Reasoning**: Groups multiple outputs together, allowing a single aggregated range proof to cover all values in the group, enabling efficient pruning.\n2. **Preconditions**: All input `outputs` must be valid; `values` and `blindings` must match the length of `outputs`.\n3. **Postconditions**: A `Self` instance is returned containing the outputs and a valid range proof covering their values.\n4. **Z Notation (informal)**: $\\text{OutputGroup} \\triangleq \\{ \\text{outputs}: \\text{Vec}(\\text{Output}), \\text{range\\_proof}: \\text{Vec}(\\text{u8}) \\} \\land \\text{VerifyRangeProof}(\\text{outputs}, \\text{range\\_proof})$\n5. **Doc comment**: `/// A collection of outputs covered by a single aggregated range proof.`\n\n#### `OutputGroup::prove`\n1. **Reasoning**: Constructs an `OutputGroup` by generating the necessary range proof based on the values and blinding factors of the provided outputs.\n2. **Preconditions**: `outputs`, `values`, and `blindings` must have the same length.\n3. **Postconditions**: Returns a `Self` instance where `range_proof` is cryptographically valid for the given `values`.\n4. **Z Notation (informal)**: $\\text{Prove}(\\text{O}, \\text{V}, \\text{B}) \\Rightarrow \\text{OutputGroup} \\land \\text{RangeProof}(\\text{V}, \\text{B}, \\text{Binding}(\\text{O}))$\n5. **Doc comment**: `/// Builds the output group and generates the aggregated range proof.`\n\n#### `OutputGroup::check_structure`\n1. **Reasoning**: Performs structural validation on the group, ensuring correct size constraints (1 to `MAX_GROUP_OUTPUTS`) and matching range proof length.\n2. **Preconditions**: `self` must be initialized with a range proof.\n3. **Postconditions**: Returns `Ok(())` if the group adheres to all structural rules; otherwise, returns an error.\n4. **Z Notation (informal)**: $\\text{CheckStructure}(\\text{g}) \\Rightarrow 1 \\le |\\text{g}.\\text{outputs}| \\le \\text{MAX\\_GROUP\\_OUTPUTS} \\land \\text{len}(\\text{g}.\\text{range\\_proof}) = \\text{RangeProofLen}(|\\text{g}.\\text{outputs}|)$\n5. **Doc comment**: `/// Validates the structural integrity of the output group (size and proof length).`\n\n### `GroupMember`\n1. **Reasoning**: Allows a single output group to track both unspent outputs and spent outputs using minimal data (commitment and metadata hash) for pruning.\n2. **Preconditions**: Must be initialized as either `Unspent(Output)` or `Spent { commitment, metadata_hash }`.\n3. **Postconditions**: Provides consistent accessors (`commitment`, `metadata_hash`) regardless of state.\n4. **Z Notation (informal)**: $\\text{GroupMember} \\triangleq \\text{Unspent}(\\text{o}) \\lor \\text{Spent}(\\text{c}, \\text{h}) \\land \\text{Commitment}(\\text{m}) = \\text{c} \\lor \\text{o}.\\text{commitment}$\n5. **Doc comment**: `/// A member of an output group, tracking whether the output is unspent or spent (pruned).`\n\n### `StoredGroup`\n1. **Reasoning**: Represents a pruned version of an `OutputGroup`, retaining the range proof but replacing full outputs with minimal spent markers for state reduction.\n2. **Preconditions**: Must be created from a valid `OutputGroup`.\n3. **Postconditions**: The group maintains cryptographic validity (`verify()` returns true) while minimizing storage footprint.\n4. **Z Notation (informal)**: $\\text{StoredGroup} \\triangleq \\{ \\text{range\\_proof}: \\text{Vec}(\\text{u8}), \\text{members}: \\text{Vec}(\\text{GroupMember}) \\} \\land \\text{Verify}(\\text{sg})$\n5. **Doc comment**: `/// A pruned representation of an output group used for state storage, replacing full outputs with minimal spent markers.`\n\n#### `StoredGroup::spend`\n1. **Reasoning**: Transitions a specific unspent member to a spent state, enabling pruning while preserving the range proof validity.\n2. **Preconditions**: The provided `index` must correspond to an `Unspent` member in `self.members`.\n3. **Postconditions**: The member at `index` is updated to `GroupMember::Spent`, and the group remains cryptographically valid.\n4. **Z Notation (informal)**: $\\text{Spend}(\\text{sg}, i) \\Rightarrow \\text{sg}.\\text{members}[i] = \\text{Spent}(\\text{c}_i, \\text{h}_i) \\land \\text{Verify}(\\text{sg})$\n5. **Doc comment**: `/// Marks the member at the given index as spent, transitioning it to a pruned state.`\n\n## Input and Kernel Structs\n\n### `Input`\n1. **Reasoning**: Represents an input UTXO being spent, secured by a Schnorr signature from the owner key (`Ko`).\n2. **Preconditions**: The signature must be generated using the correct owner secret over the specific message derived from the commitment and owner key.\n3. **Postconditions**: `verify_signature()` returns `true` if the input ownership is cryptographically proven; otherwise, `false`.\n4. **Z Notation (informal)**: $\\text{Input} \\triangleq \\{ \\text{commitment}: P_{32}, \\text{owner\\_key}: P_{32}, \\text{signature}: \\text{SchnorrSig} \\} \\land \\text{VerifySignature}(\\text{i})$\n5. **Doc comment**: `/// Represents an input UTXO being spent, secured by a Schnorr signature from the owner key.`\n\n#### `Input::verify_signature`\n1. **Reasoning**: Verifies that the owner of the UTXO signed the specific message binding the input to its commitment and owner key.\n2. **Preconditions**: `self` must be a valid `Input`.\n3. **Postconditions**: Returns `true` if the signature is valid against the derived message; otherwise, `false`.\n4. **Z Notation (informal)**: $\\text{VerifySignature}(\\text{i}) \\Rightarrow \\text{SchnorrVerify}(\\text{i}.\\text{owner\\_key}, \\text{Message}(\\text{i}), \\text{i}.\\text{signature})$\n5. **Doc comment**: `/// Verifies the Schnorr signature proving ownership of the input UTXO.`\n\n### `Kernel`\n1. **Reasoning**: Defines transaction metadata (fee, minimum height) and provides cryptographic proof (`KernelSig`) that the creator knows the necessary secrets (`e`, `e'`) to justify the kernel's existence.\n2. **Preconditions**: The kernel must be constructed using valid excess/owner-excess points and signed correctly over its message.\n3. **Postconditions**: `verify_signature()` returns `true` if the kernel signature is valid; `check_rules()` ensures adherence to consensus constraints (e.g., Coinbase rules).\n4. **Z Notation (informal)**: $\\text{Kernel} \\triangleq \\{ \\text{features}: \\text{KF}, \\text{fee}: \\text{u64}, \\dots \\} \\land \\text{VerifySignature}(\\text{k}) \\land \\text{CheckRules}(\\text{k})$\n5. **Doc comment**: `/// Defines transaction metadata (fee, min_height) and carries a cryptographic proof of knowledge of its secrets.`\n\n#### `Kernel::new`\n1. **Reasoning**: Constructs a new, cryptographically sound `Kernel` by generating the necessary excess/owner-excess points and signing them over the kernel message.\n2. **Preconditions**: Valid `excess_secret` and `owner_secret` must be provided.\n3. **Postconditions**: A fully signed and internally consistent `Self` instance is returned.\n4. **Z Notation (informal)**: $\\text{New}(\\text{f}, \\text{fee}, \\text{h}, \\text{s}_e, \\text{s}_{o}) \\Rightarrow \\text{Kernel} \\land \\text{Signature}(\\text{k})$\n5. **Doc comment**: `/// Creates a new, signed kernel using the required secrets.`\n\n## Transaction Structs\n\n### `TxBody`\n1. **Reasoning**: Encapsulates all components of a transaction (inputs, outputs, kernels) and enforces canonical ordering for deterministic serialization and aggregation.\n2. **Preconditions**: All internal vectors must be sorted according to their defined criteria (commitment, sort\\_key, Kernel::id).\n3. **Postconditions**: A structured body ready for validation or aggregation.\n4. **Z Notation (informal)**: $\\text{TxBody} \\triangleq \\{ \\text{inputs}: \\text{Sorted}(\\text{Input}), \\text{outputs}: \\text{Sorted}(\\text{OutputGroup}), \\text{kernels}: \\text{Sorted}(\\text{Kernel}) \\}$\n5. **Doc comment**: `/// The core body of a transaction, containing inputs, output groups, and kernels in canonical order.`\n\n### `Transaction`\n1. **Reasoning**: The complete transaction structure, including the cryptographic offsets (`kernel_offset`, `owner_offset`) necessary to satisfy the linear balance equations across aggregated blocks.\n2. **Preconditions**: Offsets must be canonical scalars; body components must be canonically ordered.\n3. **Postconditions**: A valid transaction that satisfies both Pedersen and Owner balance equations when verified.\n4. **Z Notation (informal)**: $\\text{Transaction} \\triangleq \\{ \\text{body}: \\text{TxBody}, \\text{kernel\\_offset}: S_{32}, \\text{owner\\_offset}: S_{32} \\} \\land \\text{VerifySums}(\\text{tx})$\n5. **Doc comment**: `/// A complete MimbleWimble transaction, including cryptographic offsets for balance verification.`\n\n#### `Transaction::validate_structure`\n1. **Reasoning**: Performs cheap, stateless checks: weight limits, canonical ordering (inputs, outputs, kernels), uniqueness (commitments, owner keys, kernel IDs), and basic kernel rule adherence.\n2. **Preconditions**: The transaction must be canonically ordered internally.\n3. **Postconditions**: Returns `Ok(())` if the structure is valid for the given context (`Relay` or `Block`); otherwise, returns a specific validation error.\n4. **Z Notation (informal)**: $\\text{ValidateStructure}(\\text{tx}, \\text{C}) \\Rightarrow \\text{Weight}(\\text{tx}) \\le \\text{MaxWeight}(\\text{C}) \\land \\text{Ordered}(\\text{tx}.\\text{body}) \\land \\text{Unique}(\\text{tx})$\n5. **Doc comment**: `/// Performs cheap, stateless structural validation (weight, ordering, uniqueness) based on the validation context.`\n\n#### `Transaction::verify_sums`\n1. **Reasoning**: Checks the two core linear balance equations (Pedersen and Owner sum) using the transaction's offsets. This is a non-cryptographic check of value conservation.\n2. **Preconditions**: Offsets must be valid scalars; all inputs, outputs, and kernels must be present.\n3. **Postconditions**: Returns `Ok(())` if both $\\sum C_{out} - \\sum C_{in} + \\text{fee}\\cdot G = \\sum E + o\\cdot H$ and $\\sum Ko_{in} = \\sum E' + x\\cdot G$ hold; otherwise, returns a balance error.\n4. **Z Notation (informal)**: $\\text{VerifySums}(\\text{tx}) \\Rightarrow (\\sum C_{out} - \\sum C_{in} + \\text{fee}\\cdot G) = (\\sum E + o\\cdot H) \\land (\\sum Ko_{in}) = (\\sum E' + x\\cdot G)$\n5. **Doc comment**: `/// Verifies the two core linear balance equations (Pedersen and Owner sum) using the transaction offsets.`\n\n#### `Transaction::verify_crypto`\n1. **Reasoning**: Performs expensive, cryptographic checks: range proofs for all output groups, ownership signatures for all inputs, and kernel signatures for all kernels.\n2. **Preconditions**: All internal structures must be structurally valid.\n3. **Postconditions**: Returns `Ok(())` if all cryptographic proofs are valid; otherwise, returns a crypto validation error.\n4. **Z Notation (informal)**: $\\text{VerifyCrypto}(\\text{tx}) \\Rightarrow \\forall \\text{g} \\in \\text{tx}.\\text{body}.\\text{outputs}: \\text{VerifyRangeProof}(\\text{g}) \\land \\forall \\text{i} \\in \\text{tx}.\\text{body}.\\text{inputs}: \\text{VerifySignature}(\\text{i}) \\land \\dots$\n5. **Doc comment**: `/// Verifies all cryptographic proofs: range proofs, input signatures, and kernel signatures.`\n\n#### `Transaction::validate`\n1. **Reasoning**: The comprehensive validation entry point, combining structural, balance, and cryptographic checks into a single atomic operation.\n2. **Preconditions**: None (assuming the transaction is serialized correctly).\n3. **Postconditions**: Returns `Ok(())` if the transaction is fully valid for the given context; otherwise, returns the first encountered validation error.\n4. **Z Notation (informal)**: $\\text{Validate}(\\text{tx}, \\text{C}) \\Rightarrow \\text{ValidateStructure}(\\text{tx}, \\text{C}) \\land \\text{VerifySums}(\\text{tx}) \\land \\text{VerifyCrypto}(\\text{tx})$\n5. **Doc comment**: `/// Performs full, comprehensive validation (structure, balance, and cryptography) of the transaction.`\n\n#### `Transaction::aggregate`\n1. **Reasoning**: Implements MimbleWimble's native aggregation, merging multiple transactions into a single, canonical transaction by summing offsets and merging sorted components.\n2. **Preconditions**: All input transactions must be valid; no shared inputs, outputs, or kernels are allowed across the set of transactions.\n3. **Postconditions**: A new, merged `Transaction` is returned, which is guaranteed to be canonically ordered and structurally valid (after internal checks).\n4. **Z Notation (informal)**: $\\text{Aggregate}(\\text{T}_1, \\dots, \\text{T}_n) \\Rightarrow \\text{Tx}_{\\text{agg}} \\land \\text{NoSharedElements}(\\text{T}_i) \\land \\text{ValidateStructure}(\\text{Tx}_{\\text{agg}}, \\text{Block})$\n5. **Doc comment**: `/// Merges multiple transactions into a single, canonical transaction by summing offsets and merging components.`\n\n## Coinbase Struct\n\n### `Coinbase`\n1. **Reasoning**: Represents the block reward mechanism. It is kept separate from the main transaction body to allow the reward equation to be offset-free, simplifying fee pinning relative to the block hash.\n2. **Preconditions**: The internal `outputs` must be structurally valid; the kernel must be a `Coinbase` type.\n3. **Postconditions**: A structure that cryptographically proves the reward amount paid matches the kernel excess.\n4. **Z Notation (informal)**: $\\text{Coinbase} \\triangleq \\{ \\text{outputs}: \\text{OutputGroup}, \\text{kernel}: \\text{Kernel} \\} \\land \\text{VerifyStructure}(\\text{c}) \\land \\text{VerifySum}(\\text{c}, \\"}, {"path": "core/orphan.rs", "module": "core", "doc": "## Constants\n\n### `MAX_ORPHAN_DEPTH`\n1. **Reasoning**: Defines the maximum historical depth a producer is allowed to build back into when replacing an over-cap run, preventing excessive chain reorganization and unnecessary state rescan for nodes.\n2. **Preconditions**: None.\n3. **Postconditions**: The maximum depth limit is set to 100 blocks.\n4. **Z Notation (informal)**: $\\text{MaxDepth} = 100$\n5. **Doc comment**: `/// The most blocks one block of a producer's replaces: a hundred.`\n\n### `COMPATIBLE_ORPHAN_DEPTH`\n1. **Reasoning**: Provides backward compatibility for older nodes that used a smaller default depth (12), allowing smooth transition while maintaining the modern, safer default.\n2. **Preconditions**: None.\n3. **Postconditions**: The compatible depth limit is set to 12 blocks.\n4. **Z Notation (informal)**: $\\text{CompatibleDepth} = 12$\n5. **Doc comment**: `/// The old default for \\`NodeConfig::max_orphan_depth\\`: twelve.`\n\n## Functions\n\n### `full_weight(credited: u128, work: u128) -> bool`\n1. **Reasoning**: Determines if a block contributes its full calculated work to the chain's weight, distinguishing it from \"over-cap\" blocks which only contribute a fraction (`sliver`).\n2. **Preconditions**: `work` must be greater than zero (or one). `credited` must be the actual credit received by the block.\n3. **Postconditions**: Returns `true` if the block counts fully towards fork choice weight, and `false` otherwise.\n4. **Z Notation (informal)**: $\\text{FullWeight}(C, W) \\iff C > \\text{sliver}(W) \\lor C = W$\n5. **Doc comment**: `/// Whether a block that added \\`credited\\` to its chain's weight, with \\`work\\` behind it, counted in full.`\n\n### `counted_in_full(header: &BatchHeader, weight_before: u128) -> bool`\n1. **Reasoning**: Checks if a specific block header contributed its full work, given the chain's total weight immediately preceding that block.\n2. **Preconditions**: `header` must be a valid `BatchHeader`. `weight_before` must accurately reflect the chain weight before `header.height`.\n3. **Postconditions**: Returns `true` if the block meets the full-weight criteria based on its work and the preceding chain weight, `false` otherwise.\n4. **Z Notation (informal)**: $\\text{CountedInFull}(H, W_{before}) \\iff \\text{FullWeight}(H.\\text{chain\\_weight} - W_{before}, \\text{calculate\\_work}(H.\\text{target}))$\n5. **Doc comment**: `/// Whether the block \\`header\\` counted in full, given the chain's weight before it.`\n\n### `full_weight_blocks(headers: &[BatchHeader], from: u64) -> u64`\n1. **Reasoning**: Calculates the number of consecutive blocks starting at or after `from` that contributed their full work to the chain, which is crucial for determining how many confirmations are required to outweigh a reorganization.\n2. **Preconditions**: `headers` must be a slice of consecutive `BatchHeader`s (oldest first). `from` must be a valid height within the context of `headers`.\n3. **Postconditions**: Returns the count of full-weight blocks starting from `from`, respecting chain linkage and weight calculation rules.\n4. **Z Notation (informal)**: $\\text{FWBlocks}(H, F) = |\\{h \\in H \\mid h.\\text{height} \\ge F \\land \\text{CountedInFull}(h, W_{h-1})\\}|$\n5. **Doc comment**: `/// How many blocks from \\`from\\` on counted in full, of consecutive \\`headers\\` (oldest first).`\n\n### `orphanable_run(headers: &[BatchHeader], ours: impl Fn(&[u8; 32]) -> bool, max_depth: u64) -> u64`\n1. **Reasoning**: Identifies the specific run of over-cap or unsigned blocks at the tip that a producer (identified by `ours`) can legally replace. This defines the target for building an `OrphanBase`.\n2. **Preconditions**: `headers` must be consecutive and ordered oldest to newest, ending at the tip. `ours` must be a predicate identifying the producer's bonds. `max_depth` must be $\\le \\text{MAX\\_ORPHAN\\_DEPTH}$.\n3. **Postconditions**: Returns the length of the run (number of blocks) that is over-cap/unsigned, does not contain any of the producer's signed blocks, and does not exceed `max_depth`. The run stops immediately before the first full-weight block or a signed block by `ours`.\n4. **Z Notation (informal)**: $\\text{RunLength}(H, O, D) = \\min(D, |\\{h \\in H \\mid h \\text{ is over-cap} \\land \\neg \\text{SignedBy}(h, O)\\}|)$\n5. **Doc comment**: `/// The run a producer signing with any bond \\`ours\\` names may orphan: how many blocks at the end of \\`headers\\` are over-cap or unsigned blocks that none of its bonds signed, up to \\`max_depth\\`.`\n\n## Structs and Methods\n\n### `OrphanBase`\n1. **Reasoning**: Encapsulates the necessary state (State, timestamps, tip hash/weight, run signers, carried transactions) required for a producer to build a new block that successfully replaces an over-cap run.\n2. **Preconditions**: Must be constructed from a valid `headers` slice and `orphanable_run` result.\n3. **Postconditions**: Provides a complete, self-contained snapshot of the chain state immediately preceding the orphanable run.\n4. **Z Notation (informal)**: $\\text{OrphanBase} = \\langle S, T, H_{tip}, W_{tip}, R_{signers}, C_{txs} \\rangle$\n5. **Doc comment**: `/// Where a producer builds instead of on the tip: on the last block before a run of other producers' over-cap blocks.`\n\n#### `OrphanBase::height()`\n1. **Reasoning**: Provides quick access to the height of the base block, which is the parent of the new orphan block.\n2. **Preconditions**: `self` must be a valid `OrphanBase`.\n3. **Postconditions**: Returns the height of the state contained in `self.state`.\n4. **Z Notation (informal)**: $\\text{Height}(OB) = OB.\\text{state}.\\text{height}$\n5. **Doc comment**: `/// The height of the block built on this base.`\n\n#### `OrphanBase::parent()`\n1. **Reasoning**: Provides the hash of the block that the new orphan block must reference.\n2. **Preconditions**: `self` must be a valid `OrphanBase`.\n3. **Postconditions**: Returns the header hash of the state contained in `self.state`.\n4. **Z Notation (informal)**: $\\text{Parent}(OB) = OB.\\text{state}.\\text{header\\_hash}$\n5. **Doc comment**: `/// The hash of the block a block on this base builds on.`\n\n#### `OrphanBase::replaces()`\n1. **Reasoning**: Reports the size of the run being replaced, which is critical for calculating the weight gain and confirming the reorganization's impact.\n2. **Preconditions**: `self` must be a valid `OrphanBase`.\n3. **Postconditions**: Returns the number of blocks in the run (`run_signers.len()`).\n4. **Z Notation (informal)**: $\\text{Replaces}(OB) = |OB.\\text{run\\_signers}|$\n5. **Doc comment**: `/// How many blocks a block on this base orphans.`\n\n#### `OrphanBase::signed_by(bond: &MinerBond) -> bool`\n1. **Reasoning**: Checks if any block within the run was signed by the specific producer (`bond`) or one of its co-bonds, which would prevent the producer from building on this base.\n2. **Preconditions**: `self` must be a valid `OrphanBase`. `bond` must be a valid `MinerBond`.\n3. **Postconditions**: Returns `true` if the run contains a signature matching the bond or its co-bonds, `false` otherwise.\n4. **Z Notation (informal)**: $\\text{SignedBy}(OB, B) \\iff \\exists s \\in OB.\\text{run\\_signers} \\land (\\text{is\\_bond}(s, B) \\lor \\text{is\\_co\\_bond}(s, B))$\n5. **Doc comment**: `/// Whether one of \\`bond\\`'s bonds, its own or a co-bond, signed a block of the run.`\n\n## Functions\n\n### `orphan_template(...) -> Option<(BlockTemplate, Vec<(StealthAddress, PayoutReceipt)>)>`\n1. **Reasoning**: Attempts to construct a valid block template on the `OrphanBase`. This function enforces all constraints (e.g., not signed by self, full weight gain, sufficient work) before returning a usable template for mining.\n2. **Preconditions**: `bond` must be provided (`Some(MinerBond)`). The run must not be empty and must not have been signed by the producer. The resulting block must count in full *and* outweigh the original tip.\n3. **Postconditions**: Returns `Some((BlockTemplate, Receipts))` if a valid, weight-increasing, full-weight template can be built; otherwise, returns `None`.\n4. **Z Notation (informal)**: $\\text{OrphanTemplate}(OB, P, B) \\iff (\\text{RunLength}(OB) > 0 \\land \\neg \\text{SignedBy}(OB, B) \\land \\text{FullWeight}(\\Delta W, W_{new}) \\land W_{new} > W_{tip})$\n5. **Doc comment**: `/// A template for a block on \\`base\\` that orphans its run, or \\`None\\` where a producer signing with \\`bond\\` should build on the tip.`"}, {"path": "core/recovery.rs", "module": "core", "doc": "## Documentation for `core/recovery.rs`\n\n### `recovery_salt`\n1. **Reasoning**: Generates a unique, deterministic salt derived from the shared secret, ensuring that the recovery commitment is tied to the specific stealth shared secret used in the recovery process.\n2. **Preconditions**: `shared_secret` must be a 32-byte array.\n3. **Postconditions**: Returns a 32-byte array representing the unique recovery salt.\n4. **Z Notation (informal)**: $\\text{recovery\\_salt}(\\text{ss}) = \\text{hash\\_domain}(\\text{\"midwimble.recovery.salt.v1\"}, \\{\\text{ss}\\})$\n5. **Doc comment**: `/// Generates a deterministic, per-output salt from the stealth shared secret.`\n\n### `recovery_commitment`\n1. **Reasoning**: Computes the Pedersen commitment (`rc`) for a specific output, binding the value, blinding factor, recovery key, and salt together. This commitment is fixed before the opening is revealed.\n2. **Preconditions**: `recovery_key` must be 32 bytes; `blinding` must be a valid `Scalar32`; `salt` must be 32 bytes.\n3. **Postconditions**: Returns a 32-byte hash representing the Pedersen commitment.\n4. **Z Notation (informal)**: $\\text{rc} = \\text{hash\\_domain}(\\text{\"midwimble.recovery.v1\"}, \\{\\text{MAGIC}, \\text{rk}, \\text{value}, \\text{blinding}, \\text{salt}\\})$\n5. **Doc comment**: `/// Computes the Pedersen commitment (rc) for a recovery output, binding value, blinding, and salt.`\n\n### `derive_recovery_keypair`\n1. **Reasoning**: Generates the full MSS keypair required for signing recovery claims. This is computationally expensive due to WOTS key generation proportional to $2^{\\text{height}}$.\n2. **Preconditions**: `seed` must be a valid wallet seed; `height` must be within $[1, \\text{MAX\\_HEIGHT}]$.\n3. **Postconditions**: Returns a `Result<MssKeypair>` containing the derived public and private key.\n4. **Z Notation (informal)**: $\\text{kp} = \\text{mss::keygen}(\\text{recovery\\_master\\_seed}(\\text{seed}), \\text{height})$\n5. **Doc comment**: `/// Derives the full MSS recovery keypair from a seed and height. Expensive operation.`\n\n### `recovery_master_seed`\n1. **Reasoning**: Deterministically derives the master seed used for generating all MSS leaves, ensuring consistency across different derivation methods (e.g., CLI vs. library).\n2. **Preconditions**: `seed` must be a valid wallet seed.\n3. **Postconditions**: Returns a 32-byte array representing the recovery master seed.\n4. **Z Notation (informal)**: $\\text{rms} = \\text{hash\\_domain}(\\text{\"midwimble.wallet.recovery.v1\"}, \\{\\text{seed}\\})$\n5. **Doc comment**: `/// Derives the deterministic MSS master seed from the wallet seed.`\n\n### `recovery_public_key`\n1. **Reasoning**: Computes the public key by aggregating all required MSS leaves up to the specified height, matching the address format used in the network. It avoids full keypair generation for efficiency when only the public key is needed.\n2. **Preconditions**: `seed` must be a valid wallet seed; `height` must be in $[1, \\text{MAX\\_HEIGHT}]$.\n3. **Postconditions**: Returns a 32-byte array representing the aggregated MSS public key root.\n4. **Z Notation (informal)**: $\\text{pk} = \\text{mss::root\\_from\\_leaves}(\\{\\text{leaf\\_public\\_key}(\\text{rms}, i) \\mid i < 2^{\\text{height}}\\})$\n5. **Doc comment**: `/// Computes the aggregated MSS public key root for a given height, matching network address format.`\n\n### `Generators` (Struct & Methods)\n1. **Reasoning**: Holds the standard elliptic curve generators ($G$ and $H$) used in the Pedersen commitment scheme.\n2. **Preconditions**: None for `standard()`.\n3. **Postconditions**: `standard()` returns a struct initialized with standard curve points.\n4. **Z Notation (informal)**: $\\text{gens} = \\{\\text{g}: \\text{gen\\_g}(), \\text{h}: \\text{gen\\_h}()\\}$\n5. **Doc comment**: `/// Standard elliptic curve generators (G and H) for Pedersen commitments.`\n\n#### `Generators::standard`\n1. **Reasoning**: Provides the canonical, consensus-approved set of curve generators.\n2. **Preconditions**: None.\n3. **Postconditions**: Returns a `Generators` instance using standard curve parameters.\n4. **Z Notation (informal)**: $\\text{gens} = \\text{Generators::standard}()$\n5. **Doc comment**: `/// Returns the consensus-approved standard curve generators.`\n\n#### `Generators::commit`\n1. **Reasoning**: Calculates the Pedersen commitment point based on the value and blinding factor using the stored generators.\n2. **Preconditions**: `value` must be a valid `u64`; `blinding` must be a valid `Scalar`.\n3. **Postconditions**: Returns a 32-byte compressed curve point (`Point32`).\n4. **Z Notation (informal)**: $\\text{rc} = \\text{compress}((\\text{value} \\cdot G) + (\\text{blinding} \\cdot H))$\n5. **Doc comment**: `/// Calculates the Pedersen commitment point for a given value and blinding factor.`\n\n### `ClaimedOutput` (Struct & Methods)\n1. **Reasoning**: Represents a single output being claimed during recovery, bundling the commitment, UTXO proof, and the necessary opening data (`value`, `blinding`, `salt`).\n2. **Preconditions**: The `commitment` must exist in the provided `State`'s UTXO set.\n3. **Postconditions**: `from_state` returns a fully populated `ClaimedOutput` structure, including the required `UtxoProof`.\n4. **Z Notation (informal)**: $\\text{co} = \\text{ClaimedOutput}(\\text{commitment}, \\text{entry}, \\text{value}, \\text{blinding}, \\text{salt}, \\text{prove}(\\text{leaf}, \\text{proof}))$\n5. **Doc comment**: `/// Represents a single output being claimed, including its UTXO proof and opening data.`\n\n#### `ClaimedOutput::from_state`\n1. **Reasoning**: Constructs a `ClaimedOutput` by verifying the output's existence within the checkpoint state and generating the necessary UTXO membership proof.\n2. **Preconditions**: The `commitment` must be present in `state.utxos`.\n3. **Postconditions**: Returns `Ok(Self)` if the output is found and a valid proof is generated; otherwise, returns an error.\n4. **Z Notation (informal)**: $\\text{co} = \\text{ClaimedOutput}(\\text{commitment}, \\text{state.utxos}[\\text{commitment}], \\dots) \\land \\text{proof} = \\text{state.utxo\\_set.prove}(\\dots)$\n5. **Doc comment**: `/// Builds a ClaimedOutput structure using data from the checkpoint state, including UTXO proof generation.`\n\n### `RecoveryClaim` (Struct & Methods)\n1. **Reasoning**: Encapsulates the entire recovery transaction: checkpoint ID, recovery key, list of claimed outputs, destination, and the MSS signature proving ownership.\n2. **Preconditions**: All fields must be correctly populated; the signature must correspond to the digest derived from the claim data.\n3. **Postconditions**: `build` returns a fully signed `RecoveryClaim`; `digest` returns the canonical hash of the claim data.\n4. **Z Notation (informal)**: $\\text{rc} = \\text{RecoveryClaim}(\\text{cid}, \\text{rk}, \\text{outputs}, \\text{dest}, \\text{sign}(\\text{digest}(\\text{rc})))$\n5. **Doc comment**: `/// Represents a complete recovery claim, including outputs and the MSS signature.`\n\n#### `claim_digest`\n1. **Reasoning**: Computes the canonical hash used as the message for the MSS signature, ensuring all relevant claim data is included deterministically.\n2. **Preconditions**: All input slices (`checkpoint_id`, `recovery_key`, `destination`) and `outputs` must be valid.\n3. **Postconditions**: Returns a 32-byte hash digest of the claim data.\n4. **Z Notation (informal)**: $\\text{digest} = \\text{hash\\_domain}(\\text{\"midwimble.recovery-claim.v1\"}, \\{\\text{MAGIC}, \\text{cid}, \\text{rk}, \\text{dest}, \\text{commitments}, \\text{values}\\})$\n5. **Doc comment**: `/// Computes the canonical digest used for signing the recovery claim.`\n\n#### `RecoveryClaim::build`\n1. **Reasoning**: Generates a complete, signed `RecoveryClaim` using the provided MSS keypair, consuming one leaf from the key.\n2. **Preconditions**: `key` must be mutable and hold the recovery keypair; inputs must be valid.\n3. **Postconditions**: Returns `Ok(Self)` containing the signature; modifies `key` state (implicitly by signing).\n4. **Z Notation (informal)**: $\\text{rc} = \\text{RecoveryClaim}(\\dots, \\text{mss::sign}(\\text{digest}(\\text{rc}), \\text{key}))$\n5. **Doc comment**: `/// Builds and signs a RecoveryClaim using the wallet's recovery keypair, consuming one MSS leaf.`\n\n#### `RecoveryClaim::digest`\n1. **Reasoning**: Provides a convenient way to retrieve the canonical digest of the claim without recalculating it.\n2. **Preconditions**: The claim must be fully constructed.\n3. **Postconditions**: Returns the 32-byte hash digest.\n4. **Z Notation (informal)**: $\\text{digest} = \\text{claim\\_digest}(\\text{self}.\\text{checkpoint\\_id}, \\dots)$\n5. **Doc comment**: `/// Returns the canonical digest of this recovery claim.`\n\n### `RecoveryState` (Struct & Methods)\n1. **Reasoning**: Manages the state of the recovery epoch, tracking which outputs have been claimed, which MSS leaves have been used, and calculating the total credited value against the checkpoint's supply cap.\n2. **Preconditions**: The initial `parts` must correctly hash to the `checkpoint.mw_state_root`.\n3. **Postconditions**: `activate` initializes the state; `apply` updates `claimed`, `used_leaves`, and `total_claimed` upon successful validation.\n4. **Z Notation (informal)**: $\\text{RS} = \\{\\text{checkpoint}, \\text{parts}, \\text{gens}, \\text{claimed}: \\mathcal{P}(\\text{Point32}), \\text{used\\_leaves}: \\mathcal{P}(\\text{rk} \\times \\text{leaf\\_idx}), \\dots\\}$\n5. **Doc comment**: `/// Manages the state of the recovery epoch, tracking claimed outputs and used MSS leaves.`\n\n#### `RecoveryState::activate`\n1. **Reasoning**: Initializes the recovery state by verifying that the provided state root parts match the checkpoint's recorded state root.\n2. **Preconditions**: `parts.root()` must equal `checkpoint.mw_state_root`.\n3. **Postconditions**: Returns `Ok(Self)` with empty tracking sets; otherwise, returns an error.\n4. **Z Notation (informal)**: $\\text{RS} = \\text{RecoveryState}(\\text{cp}, \\text{parts}) \\land \\text{parts}.\\text{root}() = \\text{cp}.\\text{mw\\_state\\_root}$\n5. **Doc comment**: `/// Initializes the recovery state, verifying consistency with the anchored checkpoint.`\n\n#### `RecoveryState::is_claimed`\n1. **Reasoning**: Simple lookup to check if a specific output commitment has already been claimed in this epoch.\n2. **Preconditions**: `commitment` must be a valid `Point32`.\n3. **Postconditions**: Returns `true` if the commitment is in `self.claimed`, otherwise `false`.\n4. **Z Notation (informal)**: $\\text{is\\_claimed}(\\text{c}) \\iff \\text{c} \\in \\text{self}.\\text{claimed}$\n5. **Doc comment**: `/// Checks if a given output commitment has already been claimed in this recovery epoch.`\n\n#### `RecoveryState::apply`\n1. **Reasoning**: The core validation logic. It verifies the claim against all checkpoint rules (UTXO proof, commitment binding, supply cap, MSS signature) and, if successful, updates the internal state.\n2. **Preconditions**: The `claim` must match the current `checkpoint_id`; the leaf index must not be used; all outputs must be valid within the checkpoint state.\n3. **Postconditions**: If validation succeeds, returns `Ok(total_value)` and updates `self.claimed`, `self.used_leaves`, `self.total_claimed`, and `self.credited`. If validation fails, the state remains unchanged and an error is returned.\n4. **Z Notation (informal)**: $\\text{RS}' = \\text{RS} \\oplus \\text{claim} \\land \\text{validate}(\\text{claim}, \\text{RS}) \\implies \\text{RS}'.\\text{total\\_claimed} = \\text{RS}.\\text{total\\_claimed} + \\sum \\text{output\\_values}$\n5. **Doc comment**: `/// Validates and applies a RecoveryClaim against the current state. State is only mutated upon successful validation.`"}, {"path": "core/relay.rs", "module": "core", "doc": "## `window_left`\n\n**Reasoning**: Determines if a specific midstate header height is still retained within the defined relay window relative to the current chain tip. This enforces the constraint that only recent headers can be proven against or forked from.\n**Preconditions**: `height` must be a valid midstate height; `tip` must be the height of the current relay tip.\n**Postconditions**: Returns `Some(u64)` representing the number of headers remaining in the window (including the header at `height`) if `height` is within the window, otherwise returns `None`.\n**Z Notation (informal)**: $\\text{window\\_left}(h, t) \\triangleq \\begin{cases} t + \\text{RELAY\\_WINDOW} - h & \\text{if } h \\le t + \\text{RELAY\\_WINDOW} \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n**Doc comment**: `/// Calculates how many more headers can be relayed above the relay tip before the header at `height` leaves the window.`\n\n## `RelayEntry::root`\n\n**Reasoning**: Provides the canonical starting point for the relay chain, corresponding to the midstate genesis block committed to by the consensus.\n**Preconditions**: None.\n**Postconditions**: Returns a `RelayEntry` struct initialized with the midstate genesis height (`MIDSTATE_BLOCK_HEIGHT`), its hash, and zeroed fields for unproven data (state root, work).\n**Z Notation (informal)**: $\\text{root}() \\triangleq \\text{RelayEntry} \\mid \\text{height} = \\text{MIDSTATE\\_BLOCK\\_HEIGHT} \\land \\text{prev} = [0]^{32} \\land \\text{work} = 0$\n**Doc comment**: `/// The midstate block the genesis commits to. Only its hash is pinned, so nothing can be proven against it; it is where relaying starts.`\n\n## `RelayEntry::is_root`\n\n**Reasoning**: Checks if a given entry is identical to the canonical genesis root entry.\n**Preconditions**: The entry must be a valid `RelayEntry`.\n**Postconditions**: Returns `true` if the entry matches the genesis root, `false` otherwise.\n**Z Notation (informal)**: $\\text{is\\_root}(e) \\triangleq e = \\text{RelayEntry::root}()$\n**Doc comment**: `/// Checks if this entry is the canonical genesis root.`\n\n## `RelayEntry::next`\n\n**Reasoning**: Constructs the next `RelayEntry` in the chain, linking it to the current entry based on a provided `HeaderLink` and calculating the necessary work.\n**Preconditions**: `link` must be a valid `HeaderLink`; `work` must be the calculated work for that link's target.\n**Postconditions**: Returns a new `RelayEntry` where `height = self.height + 1`, `prev = self.hash`, and `digest` is correctly chained from `self.digest`.\n**Z Notation (informal)**: $\\text{next}(e, l, w) \\triangleq e' \\mid e'.\\text{height} = e.\\text{height} + 1 \\land e'.\\text{prev} = e.\\text{hash} \\land e'.\\text{digest} = \\text{digest\\_after}(e', e.\\text{digest})$\n**Doc comment**: `/// The entry `link` makes on top of this one. Constructs the next RelayEntry in the chain.`\n\n## `RelayEntry::digest_after`\n\n**Reasoning**: Computes the cryptographic digest for the current entry, ensuring it chains correctly from the previous entry's digest. This is crucial for verifying the integrity of the entire chain segment.\n**Preconditions**: `prev_digest` must be a valid 32-byte digest from the preceding entry.\n**Postconditions**: Returns a new 32-byte digest that incorporates all fields of `self` and the `prev_digest`.\n**Z Notation (informal)**: $\\text{digest\\_after}(e, d_{\\text{prev}}) \\triangleq \\text{hash\\_domain}(\\dots, [d_{\\text{prev}}, e.\\text{height}, \\dots])$\n**Doc comment**: `/// Computes the entry's digest, chaining it from the previous entry's digest.`\n\n## `RelayHeaders::weight`\n\n**Reasoning**: Calculates the total byte weight of the relayed headers, used for block size constraints.\n**Preconditions**: The `headers` vector must be defined.\n**Postconditions**: Returns the total weight in bytes (`u64`).\n**Z Notation (informal)**: $\\text{weight}(rh) \\triangleq \\text{RELAY\\_WEIGHT\\_PER\\_HEADER} \\times |\\text{rh}.\\text{headers}|$\n**Doc comment**: `/// Calculates the total byte weight of all relayed headers.`\n\n## `RelayHeaders::hash`\n\n**Reasoning**: Computes the unique hash commitment for the entire run of relayed headers, which a block producer commits to.\n**Preconditions**: The `headers` vector must be defined and serializable via `bincode`.\n**Postconditions**: Returns a 32-byte hash commitment for the `RelayHeaders` structure.\n**Z Notation (informal)**: $\\text{hash}(rh) \\triangleq \\text{hash\\_domain}(\\dots, [\\text{serialize}(rh)])$\n**Doc comment**: `/// What a block's fold commits to: the cryptographic hash of the entire header run.`\n\n## `RelayHeaders::verify_pow`\n\n**Reasoning**: Performs the expensive proof-of-work verification for every header in the run. This check is deferred until the run is accepted by the relay, ensuring that forged runs are rejected efficiently.\n**Preconditions**: The headers must form a
