 must be non-negative. `midstate`, `ext`, and `target` must be valid.\n**Postconditions**: Returns `Ok(())` if the extension is valid for that specific height, otherwise returns an error.\n**Z Notation (informal)**:\n```zed\nVerifyExtensionAt\n---------------\nheight? : ℕ₆₄\nmidstate? : 𝔹³²\next? : Extension\ntarget? : 𝔹³²\nresult! : Result<()>\npre  true\npost result! = Ok(()) ⇔ ext?.final_hash < target?\n       ∧ create_extension_with(pow_algo_at(height?), midstate?, ext?.nonce).final_hash = ext?.final_hash\n```\n**Doc comment**:\n```rust\n/// Verifies a Proof-of-Work extension specific to a block height, automatically selecting the required algorithm.\npub fn verify_extension_at(\n    height: u64,\n    midstate: [u8; 32],\n    ext: &Extension,\n    target: &[u8; 32],\n) -> Result<()> { ... }\n```\n\n### `algos_near`\n\n**Reasoning**: Determines the set of possible PoW algorithms that an orphan block, located near the current tip height, might carry. This is crucial for handling algorithm switches (e.g., to Midstate Walk) during chain reorganization.\n**Preconditions**: `tip_height` must be non-negative.\n**Postconditions**: Returns a `Vec<PowAlgo>` containing the algorithms applicable at `tip_height - ORPHAN_POW_SLACK` and `tip_height + ORPHAN_POW_SLACK`, ensuring no duplicates.\n**Z Notation (informal)**:\n```zed\nAlgosNear\n---------------\ntip_height? : ℕ₆₄\nalgos! : Vec<PowAlgo>\npre  true\npost algos! = {pow_algo_at(tip_height - ORPHAN_POW_SLACK), pow_algo_at(tip_height + ORPHAN_POW_SLACK)}\n```\n**Doc comment**:\n```rust\n/// Returns the set of PoW algorithms that a block within `ORPHAN_POW_SLACK` of `tip_height` may carry.\npub fn algos_near(tip_height: u64) -> Vec<PowAlgo> { ... }\n```\n\n### `cpu_nonce`\n\n**Reasoning**: Generates a random, non-colliding nonce for CPU workers. By ensuring the top bit is clear (shifting right by 1), it avoids collision with nonces used by CUDA Walk miners who set that bit (`cuda_walk`).\n**Preconditions**: None (relies on `rand` crate).\n**Postconditions**: Returns a random `u64` where the most significant bit is guaranteed to be zero.\n**Z Notation (informal)**:\n```zed\nCpuNonce\n---------------\nnonce! : ℕ₆₄\npre  true\npost nonce! < 2^63\n```\n**Doc comment**:\n```rust\n/// Generates a random CPU nonce, ensuring it does not conflict with CUDA Walk miner nonces.\npub fn cpu_nonce() -> u64 { ... }\n```\n\n### `mine_extension`\n\n**Reasoning**: Implements the parallel mining loop. It spawns worker threads (one per core) to independently search for a valid block or a pool share, using `AtomicBool` for instant cancellation upon discovery by a peer.\n**Preconditions**: `midstate`, `target`, and `pool_target` must be valid hashes. `threads` must be non-negative. `cancel` and `hash_counter` must be initialized `Arc` atomic types.\n**Postconditions**: Returns `Some(MiningResult::Block(ext))` if a block meeting the `target` is found, `Some(MiningResult::Share(ext))` if a share meeting `pool_target` is found, or `None` if mining is cancelled or completes without finding anything.\n**Z Notation (informal)**:\n```zed\nMineExtension\n---------------\nalgo? : PowAlgo\nmidstate? : 𝔹³²\ntarget? : 𝔹³²\npool_target? : Option<𝔹³²>\nthreads? : ℕ\ncancel? : Arc<AtomicBool>\nhash_counter? : Arc<AtomicU64>\nresult! : Option<MiningResult>\npre  true\npost result! = Some(Block(ext)) ⇔ ext.final_hash < target?\n       ∧ (ext.final_hash >= pool_target? ∨ pool_target? = None)\n```\n**Doc comment**:\n```rust\n/// Mines a Proof-of-Work extension using parallel threads until a valid block or pool share is found.\n/// Uses an AtomicBool for instant cancellation if a peer solves the block first.\npub fn mine_extension(\n    algo: PowAlgo,\n    midstate: [u8; 32],\n    target: [u8; 32],\n    pool_target: Option<[u8; 32]>,\n    threads: usize,\n    cancel: Arc<AtomicBool>,\n    hash_counter: Arc<std::sync::atomic::AtomicU64>,\n) -> Option<MiningResult> { ... }\n```\n\n### `mine_extension_single`\n\n**Reasoning**: Provides a single-threaded fallback implementation of the mining loop. This is used when only one thread is available, ensuring functionality even on constrained environments.\n**Preconditions**: `midstate`, `target`, and `pool_target` must be valid hashes. `cancel` and `hash_counter` must be initialized `Arc` atomic types.\n**Postconditions**: Returns `Some(MiningResult::Block(ext))` or `Some(MiningResult::Share(ext))` upon finding a solution, or `None` if the `cancel` flag is set.\n**Z Notation (informal)**:\n```zed\nMineExtensionSingle\n---------------\nalgo? : PowAlgo\nmidstate? : 𝔹³²\ntarget? : 𝔹³²\npool_target? : Option<𝔹³²>\ncancel? : Arc<AtomicBool>\nhash_counter? : Arc<AtomicU64>\nresult! : Option<MiningResult>\npre  true\npost result! = Some(Block(ext)) ⇔ ext.final_hash < target?\n       ∧ (ext.final_hash >= pool_target? ∨ pool_target? = None)\n```\n**Doc comment**:\n```rust\n/// Single-threaded fallback implementation for mining the Proof-of-Work extension.\nfn mine_extension_single(\n    algo: PowAlgo,\n    midstate: [u8; 32],\n    target: [u8; 32],\n    pool_target: Option<[u8; 32]>,\n    cancel: Arc<AtomicBool>,\n    hash_counter: Arc<std::sync::atomic::AtomicU64>,\n) -> Option<MiningResult> { ... }\n```"}, {"path": "core/filter.rs", "module": "core", "doc": "## `CompactFilter` Implementation Documentation\n\n### `CompactFilter::items_in(batch: &Batch) -> HashSet<[u8; 32]>`\n\n**Reasoning**: This function establishes the canonical set of all unique items (commitments, owner keys, kernel IDs) that are relevant to the given `Batch`. It serves as the single source of truth for determining the filter size ($N$), ensuring consistency between the reported element count and the actual filter contents.\n\n**Preconditions**:\n1. `batch` must be a valid, non-mutated reference to a `Batch` structure.\n\n**Postconditions**:\n1. Returns a `HashSet` containing exactly all unique 32-byte items present in the batch (inputs, outputs, kernel IDs, coinbase outputs/kernel).\n2. The size of the returned set is $N$, which must be used when building or matching the filter.\n\n**Z Notation (informal)**:\n$$\\{ \\text{items} \\mid \\forall i \\in \\text{BatchItems}(\\text{batch}) \\cdot i \\in \\text{items} \\land |\\text{items}| = N \\}$$\n\n**Doc comment**:\n```rust\n/// Returns the canonical set of unique 32-byte items (commitments, owner keys, kernel IDs)\n/// present in the batch. This set determines the filter size $N$.\npub fn items_in(batch: &Batch) -> HashSet<[u8; 32]> { ... }\n```\n\n### `CompactFilter::build(batch: &Batch) -> Self`\n\n**Reasoning**: This function constructs the compact, Golomb-coded filter data structure. It maps the canonical set of items ($N$) into a uniform distribution $[0, N \\cdot \\text{FPR\\_INVERSE}]$, sorts these hashes, and then encodes the deltas between adjacent sorted hashes using Golomb-Rice coding for maximum compression.\n\n**Preconditions**:\n1. `batch` must be a valid, non-mutated reference to a `Batch` structure.\n2. The necessary dependencies (`hash_concat`, `FPR_INVERSE`) must be correctly defined.\n\n**Postconditions**:\n1. Returns a `CompactFilter` instance where `data` contains the Golomb-coded byte representation of the sorted hash deltas.\n2. If $N=0$, `data` is an empty vector.\n3. The filter data is keyed by `batch.extension.final_hash`, preventing precomputation attacks.\n\n**Z Notation (informal)**:\n$$\\text{Filter} = \\text{EncodeGolomb}(\\text{Sort}(\\{\\text{Hash}(\\text{BlockHash}, i) \\pmod{N \\cdot \\text{FPR\\_INVERSE}} \\mid i \\in \\text{items}\\}))$$\n\n**Doc comment**:\n```rust\n/// Builds a Golomb-Coded Set filter for the given Batch.\n/// The filter data is compressed and keyed by the block's final hash.\npub fn build(batch: &Batch) -> Self { ... }\n```\n\n***\n\n## Helper Function Documentation\n\n### `encode_golomb(writer: &mut BitWriter, value: u64)`\n\n**Reasoning**: Implements the Golomb-Rice encoding scheme. It separates the input `value` into a quotient ($Q$) and a remainder ($R$), where $Q = \\lfloor \\text{value} / 2^P \\rfloor$ and $R = \\text{value} \\pmod{2^P}$. The quotient is encoded using unary (a sequence of '1's followed by a '0'), and the remainder is encoded using fixed-width binary ($P$ bits).\n\n**Preconditions**:\n1. `writer` must be a mutable reference to an initialized `BitWriter`.\n2. $P$ (defined as 20) must be the correct parameter for the target FPR.\n\n**Postconditions**:\n1. The `writer` state is updated, containing the bit representation of the encoded value.\n2. The encoding adheres to the Golomb-Rice definition for parameter $P$.\n\n**Z Notation (informal)**:\n$$\\text{Encode}(V) \\equiv (\\underbrace{1, 1, \\dots, 1}_{Q}, 0) \\circ \\text{Binary}(R, P)$$\n\n**Doc comment**:\n```rust\n/// Encodes a u64 value using Golomb-Rice coding with parameter P.\nfn encode_golomb(writer: &mut BitWriter, value: u64) { ... }\n```\n\n### `decode_golomb(reader: &mut BitReader) -> Option<u64>`\n\n**Reasoning**: Reverses the Golomb-Rice encoding. It reads bits sequentially, counting '1's until a '0' is encountered to determine the quotient ($Q$), and then reads the subsequent $P$ bits to reconstruct the remainder ($R$). The original value is $V = Q \\cdot 2^P + R$.\n\n**Preconditions**:\n1. `reader` must be a mutable reference to an initialized `BitReader` pointing to valid filter data.\n2. The data must be correctly formatted according to `encode_golomb`.\n\n**Postconditions**:\n1. Returns `Some(V)` where $V$ is the original decoded value, or `None` if the end of the data stream is reached prematurely.\n2. The `reader` state is advanced past the consumed bits.\n\n**Z Notation (informal)**:\n$$\\text{Decode}(\\text{Stream}) \\equiv (Q \\leftarrow \\text{CountOnes}(\\text{Stream}), R \\leftarrow \\text{ReadBits}(\\text{Stream}, P)) \\implies Q \\cdot 2^P + R$$\n\n**Doc comment**:\n```rust\n/// Decodes a single Golomb-Rice coded value from the bit stream.\nfn decode_golomb(reader: &mut BitReader) -> Option<u64> { ... }\n```\n\n### `match_any(filter_data: &[u8], block_hash: &[u8; 32], n: u64, items: &[[u8; 32]]) -> bool`\n\n**Reasoning**: This is the core client-side matching function. It hashes all query items using the same method as `build()`, sorts them, and then performs a zero-allocation intersection check against the decoded, sorted hash values from the filter data. This avoids fully decoding the entire filter if a match is found early.\n\n**Preconditions**:\n1. `filter_data` must be the raw Golomb-coded bytes generated by `CompactFilter::build()`.\n2. `block_hash` must be the `extension.final_hash` of the block covered by the filter.\n3. $N$ must accurately reflect the number of elements encoded in `filter_data`.\n4. `items` must contain the 32-byte items to test.\n\n**Postconditions**:\n1. Returns `true` if at least one query item's hash matches a decoded hash value in the filter (potential match, subject to FPR).\n2. Returns `false` only if *no* query item's hash matches any decoded hash value.\n3. The function terminates early upon finding the first match.\n\n**Z Notation (informal)**:\n$$\\text{MatchAny} \\equiv \\exists h_q \\in \\text{QueryHashes} \\cdot h_q \\in \\text{DecodedHashes}(\\text{filter\\_data}, N)$$\n\n**Doc comment**:\n```rust\n/// Checks if ANY of the given items might be present in a compact filter.\n/// Returns true if there's a potential match (FPR 1/1,000,000).\npub fn match_any(filter_data: &[u8], block_hash: &[u8; 32], n: u64, items: &[[u8; 32]]) -> bool { ... }\n```"}, {"path": "core/finality.rs", "module": "core", "doc": "## `FinalityEstimator` Struct\n\n**Reasoning**: This struct encapsulates the state of our belief regarding the honest proportion ($p$) of hashpower, modeled by the parameters ($\\alpha, \\beta$) of a Beta distribution. It allows for dynamic updating based on network observations.\n**Preconditions**: None.\n**Postconditions**: The struct holds valid non-negative integer counts $\\alpha$ and $\\beta$, capped at 10,000.\n**Z Notation (informal)**: $\\text{FinalityEstimator} \\equiv \\{\\alpha: \\mathbb{N}_0, \\beta: \\mathbb{N}_0 \\mid \\alpha \\le 10000 \\land \\beta \\le 10000\\}$\n**Doc comment**: `/// Estimates finality using Beta-Binomial model parameters (alpha, beta).`\n\n---\n\n## `FinalityEstimator::new(alpha: u64, beta: u64)`\n\n**Reasoning**: This is the constructor, establishing the initial prior belief about the honest hashpower proportion $p$.\n**Preconditions**: $\\alpha \\ge 0$ and $\\beta \\ge 0$.\n**Postconditions**: A new `FinalityEstimator` instance is returned with the specified $\\alpha$ and $\\beta$.\n**Z Notation (informal)**: $\\text{new}(\\alpha, \\beta) \\rightarrow \\text{FE} \\mid \\text{FE}.\\alpha = \\alpha \\land \\text{FE}.\\beta = \\beta$\n**Doc comment**: `/// Creates a new estimator with a prior belief defined by alpha and beta.`\n\n---\n\n## `FinalityEstimator::observe_honest(&mut self)`\n\n**Reasoning**: An honest observation (e.g., linear chain extension) increases confidence in the honest proportion $p$. In a Beta-Binomial model, this corresponds to incrementing $\\alpha$.\n**Preconditions**: The estimator must be mutable (`&mut self`).\n**Postconditions**: $\\text{self}.\\alpha$ is incremented by 1, capped at 10,000. $\\text{self}.\\beta$ remains unchanged.\n**Z Notation (informal)**: $\\text{observe\\_honest}(\\text{FE}) \\rightarrow \\text{FE}' \\mid \\text{FE}'.\\alpha = \\min(\\text{FE}.\\alpha + 1, 10000) \\land \\text{FE}'.\\beta = \\text{FE}.\\beta$\n**Doc comment**: `/// Records an honest block observation, updating alpha (capped at 10,000).`\n\n---\n\n## `FinalityEstimator::observe_adversarial(&mut self)`\n\n**Reasoning**: An adversarial observation (e.g., deep fork) increases confidence in the attacker's proportion $(1-p)$. This corresponds to incrementing $\\beta$.\n**Preconditions**: The estimator must be mutable (`&mut self`).\n**Postconditions**: $\\text{self}.\\beta$ is incremented by 1, capped at 10,000. $\\text{self}.\\alpha$ remains unchanged.\n**Z Notation (informal)**: $\\text{observe\\_adversarial}(\\text{FE}) \\rightarrow \\text{FE}' \\mid \\text{FE}'.\\alpha = \\text{FE}.\\alpha \\land \\text{FE}'.\\beta = \\min(\\text{FE}.\\beta + 1, 10000)$\n**Doc comment**: `/// Records an adversarial observation, updating beta (capped at 10,000).`\n\n---\n\n## `FinalityEstimator::calculate_safe_depth(&self, target_risk: f64) -> u64`\n\n**Reasoning**: This function determines the minimum block depth $z$ required such that the expected probability of a successful re-organization (given the current belief $\\text{Beta}(\\alpha, \\beta)$) is less than or equal to `target_risk`. It uses numerical integration (via discretization/sampling) and binary search for efficiency.\n**Preconditions**: `target_risk` must be a positive probability ($0 < \\text{target\\_risk} \\le 1$). $\\alpha$ and $\\beta$ must be non-negative.\n**Postconditions**: A minimum safe depth $z \\in [1, 10000]$ is returned, satisfying the risk constraint based on the current Beta distribution.\n**Z Notation (informal)**: $\\text{calculate\\_safe\\_depth}(\\text{FE}, R) \\rightarrow z \\mid \\mathbb{E}_{p \\sim \\text{Beta}(\\alpha, \\beta)} [(\\frac{1-p}{p})^z] \\le R \\land z = \\min \\{z' \\mid \\mathbb{E}[\\dots] \\le R\\}$\n**Doc comment**: `/// Calculates the minimum block depth 'z' required to keep the expected reorg risk below target_risk.`"}, {"path": "core/golden.rs", "module": "core", "doc": "## Function Documentation\n\n### `output(seed: u8) -> Output`\n\n**Reasoning**: Generates a standardized `Output` structure using a simple seed for deterministic, reproducible testing of consensus hashes. This ensures that the golden vectors remain valid across builds.\n**Preconditions**: `seed` must be a valid `u8` value (0-255).\n**Postconditions**: Returns an `Output` struct where all fields are deterministically derived from the input `seed`.\n**Z Notation (informal)**: $\\text{Output} = \\text{Output}(\\text{seed}) \\land \\forall f \\in \\text{fields}(\\text{Output}): f = f(\\text{seed})$\n**Doc comment**:\n```rust\n/// Generates a deterministic `Output` structure based on a seed.\nfn output(seed: u8) -> Output { /* ... */ }\n```\n\n### `kernel(features: KernelFeatures, seed: u8) -> Kernel`\n\n**Reasoning**: Creates a standardized `Kernel` structure, which holds critical operational parameters (fees, min height, signatures) required for consensus testing.\n**Preconditions**: `features` must be a valid `KernelFeatures` variant; `seed` must be a valid `u8`.\n**Postconditions**: Returns a `Kernel` struct where all fields are deterministically derived from the input `features` and `seed`.\n**Z Notation (informal)**: $\\text{Kernel} = \\text{Kernel}(\\text{features}, \\text{seed}) \\land \\forall f \\in \\text{fields}(\\text{Kernel}): f = f(\\text{features}, \\text{seed})$\n**Doc comment**:\n```rust\n/// Generates a deterministic `Kernel` structure based on features and a seed.\nfn kernel(features: KernelFeatures, seed: u8) -> Kernel { /* ... */ }\n```\n\n### `transaction() -> Transaction`\n\n**Reasoning**: Constructs a fixed, canonical `Transaction` used for golden vector testing. This ensures that the transaction hash remains constant, preventing silent chain splits due to encoding changes.\n**Preconditions**: None (relies only on internal helper functions like `output` and `kernel`).\n**Postconditions**: Returns a fully formed `Transaction` struct with fixed, deterministic content.\n**Z Notation (informal)**: $\\text{Transaction} = \\text{Transaction}() \\land \\text{TxBody}(\\text{Transaction}) = \\text{TxBody}(\\text{fixed\\_inputs}, \\text{fixed\\_outputs}, \\text{fixed\\_kernels})$\n**Doc comment**:\n```rust\n/// Constructs a fixed, canonical `Transaction` for consensus hash testing.\nfn transaction() -> Transaction { /* ... */ }\n```\n\n### `coinbase() -> Coinbase`\n\n**Reasoning**: Generates a standardized `Coinbase` transaction structure. Like `transaction()`, this ensures the coinbase hash is immutable across compatible builds.\n**Preconditions**: None.\n**Postconditions**: Returns a fully formed `Coinbase` struct with fixed, deterministic content.\n**Z Notation (informal)**: $\\text{Coinbase} = \\text{Coinbase}() \\land \\text{Outputs}(\\text{Coinbase}) = \\text{fixed\\_output\\_group}$\n**Doc comment**:\n```rust\n/// Constructs a fixed, canonical `Coinbase` transaction for consensus hash testing.\nfn coinbase() -> Coinbase { /* ... */ }\n```\n\n### `checkpoint() -> Checkpoint`\n\n**Reasoning**: Provides a fixed, representative `Checkpoint` structure. This is crucial for verifying that checkpoint hashes are stable and correctly committed in the golden vectors.\n**Preconditions**: None.\n**Postconditions**: Returns a fully formed `Checkpoint` struct with predefined, constant values (e.g., height 10,000).\n**Z Notation (informal)**: $\\text{Checkpoint} = \\text{Checkpoint}() \\land \\text{version}(\\text{Checkpoint}) = 1$\n**Doc comment**:\n```rust\n/// Constructs a fixed, canonical `Checkpoint` structure for consensus hash testing.\nfn checkpoint() -> Checkpoint { /* ... */ }\n```\n\n### `relayed() -> RelayHeaders`\n\n**Reasoning**: Creates a deterministic set of `RelayHeaders`. This is used to verify the integrity of relayed header hashes against golden vectors.\n**Preconditions**: None.\n**Postconditions**: Returns a `RelayHeaders` struct containing fixed, deterministically generated `HeaderLink`s.\n**Z Notation (informal)**: $\\text{RelayHeaders} = \\text{RelayHeaders}() \\land \\forall h \\in \\text{headers}(\\text{RelayHeaders}): h = \\text{HeaderLink}(\\text{fixed\\_seed})$\n**Doc comment**:\n```rust\n/// Constructs a fixed, canonical set of `RelayHeaders` for consensus hash testing.\nfn relayed() -> RelayHeaders { /* ... */ }\n```\n\n### `registration() -> BondRegistration`\n\n**Reasoning**: Generates a complex, fixed `BondRegistration` structure. Due to its complexity (involving proofs, midstate roots, and SMT), this function guarantees the stability of the registration hash in the golden vectors.\n**Preconditions**: None.\n**Postconditions**: Returns a fully formed `BondRegistration` struct with predefined, constant proof and root data.\n**Z Notation (informal)**: $\\text{BondRegistration} = \\text{BondRegistration}() \\land \\text{proof}(\\text{BondRegistration}) = \\text{fixed\\_bond\\_proof}$\n**Doc comment**:\n```rust\n/// Constructs a fixed, canonical `BondRegistration` structure for consensus hash testing.\nfn registration() -> BondRegistration { /* ... */ }\n```\n\n### `header() -> BatchHeader`\n\n**Reasoning**: Provides a fixed, representative `BatchHeader`. This header is used to test the core block header hashing mechanism and its interaction with midstate roots.\n**Preconditions**: None.\n**Postconditions**: Returns a fully formed `BatchHeader` struct with predefined, constant values (e.g., height 12).\n**Z Notation (informal)**: $\\text{BatchHeader} = \\text{BatchHeader}() \\land \\text{height}(\\text{BatchHeader}) = 12$\n**Doc comment**:\n```rust\n/// Constructs a fixed, canonical `BatchHeader` for consensus hash testing.\nfn header() -> BatchHeader { /* ... */ }\n```"}, {"path": "core/gpu_mining.rs", "module": "core", "doc": "## `pick_adapters`\n\n**Reasoning**: This function is responsible for enumerating all available GPU adapters via `wgpu`, filtering them based on user preferences (name substring, max count), and selecting a single optimal backend (Vulkan > DX12 > Metal > GL) to ensure consistent performance and avoid double-counting physical devices.\n\n**Preconditions**:\n*   `instance`: A valid `wgpu::Instance` must be provided.\n*   The system must have at least one adapter available, or the function must return an error.\n\n**Postconditions**:\n*   If successful (`Ok(s)`), `s` is a vector of `wgpu::Adapter`s, sorted by performance rank (Discrete > Integrated) within the chosen best backend.\n*   The number of adapters in `s` is less than or equal to `max_devices` (or `MINER_GPU_DEVICES`).\n*   All adapters in `s` are non-software (i.e., not `wgpu::DeviceType::Cpu`).\n*   If no suitable GPU is found, an error is returned (`Err`).\n\n**Z Notation (informal)**:\n$$\n\\text{pick\\_adapters}(\\text{instance}) \\downarrow \\text{result!} \\\\\n\\text{pre} \\quad \\text{true} \\\\\n\\text{post} \\quad \\text{result!} = \\text{Ok}(s) \\Rightarrow (\\forall a \\in s, \\neg \\text{soft}(a)) \\land |s| \\le \\text{cap} \\land \\text{rank}(s) \\text{ is sorted} \\\\\n\\text{post} \\quad \\text{result!} = \\text{Err}(\\_) \\Rightarrow \\text{no usable GPU exists}\n$$\n\n**Doc comment**:\n```rust\n/// Choose every GPU adapter to mine on, best first.\n/// Filters adapters by name preference, excludes software devices, and selects\n/// all devices from the highest-ranked backend (Vulkan > DX12 > Metal > GL).\nasync fn pick_adapters(instance: &wgpu::Instance) -> Result<Vec<wgpu::Adapter>>\n```\n\n## `set_gpu_duty`\n\n**Reasoning**: Allows external configuration (e.g., via CLI flags) to override the GPU duty cycle defined in the TOML settings, enabling dynamic throttling for desktop responsiveness without requiring a full application restart or config file change.\n\n**Preconditions**:\n*   `duty`: A floating-point value representing the desired fraction of time the GPU should be active.\n\n**Postconditions**:\n*   The internal `GPU_DUTY_MILLI` atomic variable is updated to reflect `duty`, clamped to $[0.02, 1.0]$.\n*   The duty cycle is immediately available via `gpu_duty()`.\n\n**Z Notation (informal)**:\n$$\n\\text{set\\_gpu\\_duty}(\\text{duty}) \\downarrow \\\\\n\\text{pre} \\quad \\text{duty} \\in [0.02, 1.0] \\\\\n\\text{post} \\quad \\text{GPU\\_DUTY\\_MILLI} = (\\text{duty} \\times 1000)\n$$\n\n**Doc comment**:\n```rust\n/// Set the GPU duty cycle, clamped to `0.02..=1.0` (1.0 = full speed). Values\n/// below 1.0 insert idle gaps between dispatches so the GPU isn't pinned at 100%,\n/// trading hashrate for desktop responsiveness / lower heat. Call once at startup\n/// (e.g. from a `--gpu-duty` flag); overrides the TOML `duty`.\npub fn set_gpu_duty(duty: f32)\n```\n\n## `gpu_duty`\n\n**Reasoning**: Provides a unified, prioritized mechanism to retrieve the current GPU duty cycle, respecting environment variables (`GPU_MINE_DUTY`), CLI settings (`set_gpu_duty`), and finally falling back to TOML/defaults.\n\n**Preconditions**:\n*   No external state modification is required; it is a read operation.\n\n**Postconditions**:\n*   Returns the effective duty cycle $d \\in [0.02, 1.0]$, prioritized as: Env Var > CLI State > TOML Default.\n\n**Z Notation (informal)**:\n$$\n\\text{gpu\\_duty}() \\downarrow d \\\\\n\\text{pre} \\quad \\text{true} \\\\\n\\text{post} \\quad d = \\text{Env}(\\text{GPU\\_MINE\\_DUTY}) \\lor \\text{CLI\\_State} \\lor \\text{TOML\\_Default}\n$$\n\n**Doc comment**:\n```rust\n/// Current duty cycle. Precedence: `GPU_MINE_DUTY` env (live, no rebuild) >\n/// `set_gpu_duty` (CLI) > TOML `duty` > 1.0.\nfn gpu_duty() -> f32\n```\n\n## `GpuMiner::new`\n\n**Reasoning**: Provides a convenience constructor for initializing a single, best-performing GPU context, suitable for simple single-device mining setups.\n\n**Preconditions**:\n*   The system must have at least one usable GPU adapter available (checked via `pick_adapters`).\n*   WGPU initialization and shader compilation must succeed.\n\n**Postconditions**:\n*   Returns a fully initialized `GpuMiner` instance (`Ok(self)`).\n*   If no usable GPU is found, returns an error (`Err`).\n*   The internal state is initialized to an empty job/pending queue.\n\n**Z Notation (informal)**:\n$$\n\\text{GpuMiner::new}() \\downarrow \\text{result!} \\\\\n\\text{pre} \\quad \\exists a \\in \\text{pick\\_adapters}(\\text{instance}) \\land \\text{init}(a) \\text{ succeeds} \\\\\n\\text{post} \\quad \\text{result!} = \\text{Ok}(m) \\Rightarrow m.\\text{adapter\\_name} = \\text{best\\_adapter\\_name} \\\\\n\\text{post} \\quad \\text{result!} = \\text{Err}(\\_) \\Rightarrow \\text{no usable GPU found}\n$$\n\n**Doc comment**:\n```rust\n/// Build the GPU context for the single best adapter. Cheap-ish but not free (device init + shader\n/// compile); construct once and reuse across blocks.\npub fn new() -> Result<Self>\n```\n\n## `GpuMiner::new_all`\n\n**Reasoning**: Allows initialization of contexts for *every* usable GPU device, ensuring that multi-GPU rigs can utilize all available hardware, while gracefully handling partial failures (i.e., one card failing to initialize does not stop the others).\n\n**Preconditions**:\n*   The system must have at least one usable GPU adapter available.\n\n**Postconditions**:\n*   Returns a vector of initialized `GpuMiner` instances (`Ok(Vec<Self>)`). The vector is ordered by performance (best first).\n*   If no GPU device could be initialized, returns an error (`Err`).\n*   Each returned instance is isolated (own buffers, own mutex) to allow concurrent dispatching.\n\n**Z Notation (informal)**:\n$$\n\\text{GpuMiner::new\\_all}() \\downarrow \\text{result!} \\\\\n\\text{pre} \\quad \\exists a \\in \\text{pick\\_adapters}(\\text{instance}) \\land \\text{init}(a) \\text{ succeeds} \\\\\n\\text{post} \\quad \\text{result!} = \\text{Ok}(V) \\Rightarrow |V| \\ge 1 \\land \\forall m \\in V, m \\text{ is isolated} \\\\\n\\text{post} \\quad \\text{result!} = \\text{Err}(\\_) \\Rightarrow \\text{no GPU device could be initialized}\n$$\n\n**Doc comment**:\n```rust\n/// Build every usable device, best first. One `GpuMiner` per physical GPU.\n/// Partial failure is survivable: a single device initialization failure does not\n/// prevent other GPUs from being used.\npub fn new_all() -> Result<Vec<Self>>\n```\n\n## `GpuMiner::adapter_name`\n\n**Reasoning**: Provides read access to the name of the GPU adapter this specific miner instance is bound to, useful for logging and reporting results.\n\n**Preconditions**:\n*   The `GpuMiner` instance must be successfully initialized.\n\n**Postconditions**:\n*   Returns a string slice containing the adapter's name.\n\n**Z Notation (informal)**:\n$$\n\\text{GpuMiner::adapter\\_name}(m) \\downarrow \\text{name} \\\\\n\\text{pre} \\quad m \\text{ is initialized} \\\\\n\\text{post} \\quad \\text{name} = m.\\text{adapter\\_name}\n$$\n\n**Doc comment**:\n```rust\n/// Returns the name of the GPU adapter this miner instance is bound to.\npub fn adapter_name(&self) -> &str\n```\n\n## `GpuMiner::dispatch`\n\n**Reasoning**: Executes a single compute pipeline dispatch on the GPU queue, submitting the command buffer for asynchronous execution.\n\n**Preconditions**:\n*   `pipe`: A valid `wgpu::ComputePipeline` must be provided.\n*   `groups`: The number of workgroups to dispatch must be positive.\n*   The miner state must be initialized and bound correctly.\n\n**Postconditions**:\n*   A command encoder is created, the pipeline is set, and the workgroups are dispatched.\n*   The command buffer is submitted to the `wgpu::Queue`.\n\n**Z Notation (informal)**:\n$$\n\\text{GpuMiner::dispatch}(m, \\text{pipe}, \\text{groups}) \\downarrow \\\\\n\\text{pre} \\quad \\text{pipe} \\in \\text{pipelines}(m) \\land \\text{groups} > 0 \\\\\n\\text{post} \\quad \\text{command\\_buffer} \\text{ submitted to } m.\\text{queue}\n$$\n\n**Doc comment**:\n```rust\n/// Executes a single compute pipeline dispatch on the GPU queue.\nfn dispatch(&self, pipe: &wgpu::ComputePipeline, groups: u32)\n```\n\n## `GpuMiner::wait`\n\n**Reasoning**: Blocks the host thread until all previously submitted GPU work (commands) has completed execution on the device. This is crucial for synchronization before reading back results or checking cancellation status.\n\n**Preconditions**:\n*   The miner must be initialized and have submitted work to the queue.\n\n**Postconditions**:\n*   The host thread blocks until the GPU queue is empty of submitted commands.\n\n**Z Notation (informal)**:\n$$\n\\text{GpuMiner::wait}(m) \\downarrow \\\\\n\\text{pre} \\quad m \\text{ is initialized} \\\\\n\\text{post} \\quad \\text{all work submitted to } m.\\text{queue} \\text{ is complete}\n$$\n\n**Doc comment**:\n```rust\n/// Blocks the host thread until all previously submitted GPU work has completed.\nfn wait(&self)\n```\n\n## `GpuMiner::map_readback`\n\n**Reasoning**: Synchronously copies data from the GPU-owned `winners_buf` to a host-accessible buffer (`readback_buf`), maps it, and reads the raw bytes back from the GPU memory.\n\n**Preconditions**:\n*   The miner must be initialized.\n*   The source buffer copy (e.g., `winners_buf` $\\to$ `readback_buf`) must have been issued by the caller *before* this method is called.\n*   `len`: The exact number of bytes to read must be provided.\n\n**Postconditions**:\n*   Returns a `Vec<u8>` containing the raw data from the GPU buffer slice.\n*   The `readback_buf` is unmapped, making it ready for subsequent use.\n*   If mapping fails, a warning is logged, and a zeroed vector of the correct length is returned (ensuring safety).\n\n**Z Notation (informal)**:\n$$\n\\text{GpuMiner::map\\_readback}(m, \\text{len}) \\downarrow \\text{bytes} \\\\\n\\text{pre} \\quad m \\text{ is initialized} \\land \\text{copy\\_issued}(\\text{winners\\_buf} \\to \\text{readback\\_buf}) \\\\\n\\text{post} \\quad \\text{bytes} = \\text{data}(\\text{readback\\_buf}[0..\\text{len}]) \\land \\text{readback\\_buf} \\text{ is unmapped}\n$$\n\n**Doc comment**:\n```rust\n/// Copy `len` bytes out of the readback buffer and return them. Assumes the source copy was issued by\n/// the caller via `copy_buffer_to_buffer` before calling.\nfn map_readback(&self, len: u64) -> Vec<u8>\n```\n\n## `GpuMiner::groups`\n\n**Reasoning**: Calculates the required number of GPU workgroups based on the total number of nonces (`n`), ensuring that all nonces are covered by dispatching groups of 64 threads.\n\n**Preconditions**:\n*   $n$: The total number of nonces must be positive.\n\n**Postconditions**:\n*   Returns $\\lceil n / 64 \\rceil$, the minimum number of workgroups required.\n\n**Z Notation (informal)**:\n$$\n\\text{GpuMiner::groups}(n) \\downarrow g \\\\\n\\text{pre} \\quad n > 0 \\\\\n\\text{post} \\quad g = \\lceil n / 64 \\rceil\n$$\n\n**Doc comment**:\n```rust\n/// Calculates the required number of workgroups for a given number of nonces (n),\n/// assuming a workgroup size of 64.\nfn groups(n: u32) -> u32\n```\n\n## `GpuMiner::run_batch`\n\n**Reasoning**: Executes the full mining cycle for a batch of nonces: initialization, iterative stepping (potentially throttled), and final testing against the target/pool. It manages the state buffer (`state_buf`) on the GPU.\n\n**Preconditions**:\n*   The miner must be initialized.\n*   `params`: Must be configured with `base_lo`, `base_hi`, and `n_nonces`.\n*   `cancel`: The cancellation flag must be monitored throughout the iterative steps.\n\n**Postconditions**:\n*   If not cancelled, the state buffer is updated for all nonces in the batch.\n*   If `collect_winners` is true, a final test dispatch occurs, and winners are read back into a vector of `(nonce, kind)`.\n*   Returns `Some(winners)` or `None` if cancellation occurred.\n\n**Z Notation (informal)**:\n$$\n\\text{GpuMiner::run\\_batch}(m, \\text{params}, \\text{base}, n, \\text{cancel}, \\text{hash\\_counter}, \\text{collect}) \\downarrow \\text{result!} \\\\\n\\text{pre} \\quad m \\text{ is initialized} \\land \\text{params} \\text{ configured} \\\\\n\\text{post} \\quad \\text{result!} = \\text{Some}(W) \\Rightarrow W \\subseteq \\{ (n_i, k_i) | n_i \\in [base, base+n-1] \\} \\\\\n\\text{post} \\quad \\text{result!} = \\text{None} \\Rightarrow \\text{cancel} \\text{ was set}\n$$\n\n**Doc comment**:\n```rust\n/// Run one batch of `BATCH_NONCES` nonces starting at `base`, applying the\n/// full `EXTENSION_ITERATIONS` chain, then test against target/pool. Returns\n/// the list of (nonce, kind) candidates the GPU surfaced. Returns `None` if\n/// `cancel` fired partway through.\nfn run_batch(\n    &self,\n    params: &mut Params,\n    base: u64,\n    n_nonces: u32,\n    cancel: &AtomicBool,\n    hash_counter: &AtomicU64,\n    collect_winners: bool,\n) -> Option<Vec<(u64, u32)>>\n```\n\n## `GpuMiner::mine_gpu`\n\n**Reasoning**: The primary mining loop. It iteratively calls `run_batch`, CPU-verifies all surfaced candidates against the target/pool using the authoritative `create_extension`, and manages the surplus winner stash (`pending`).\n\n**Preconditions**:\n*   The miner must be initialized and successfully passed `self_test()`.\n*   `midstate`, `target`, and `pool_target` define a valid mining job.\n*   The caller must provide `cancel` and `hash_counter` references.\n\n**Postconditions**:\n*   Returns `Some(MiningResult)` if a block or share is found, which is the highest priority hit (Block > Share).\n*   Returns `None` only if the `cancel` flag was set during execution.\n*   If hits are found but not the first\n\n## GPU Mining Backend Functions\n\n### `shared()`\n\n**Reasoning**: Provides a quick, process-wide access point to the single best available `GpuMiner` device, simplifying common call sites that only need one device.\n**Preconditions**: The process must have initialized the GPU mining system (i.e., `shared_all()` must have been called at least once).\n**Postconditions**: Returns a reference to the best available `GpuMiner` if one exists and passed self-test; otherwise, returns `None`.\n**Z Notation (informal)**: $\\text{result} = \\text{head}(\\text{shared\\_all}())$\n**Doc comment**: Lazily constructed, process-wide handle to the best available GPU miner. Returns `None` if no usable GPU is found or if mining is disabled.\n\n### `shared_all()`\n\n**Reasoning**: Enumerates all available GPUs, performs a rigorous self-test on each, and caches the list of *only* usable devices for the entire process lifetime. This ensures multi-GPU support and fault isolation (one bad card doesn't disable all mining).\n**Preconditions**: `MINER_DISABLE_GPU` environment variable is not set to enable GPU mining.\n**Postconditions**: Returns a static slice containing all self-tested, usable `GpuMiner` instances, ordered by adapter preference. The result is memoized and never recomputed.\n**Z Notation (informal)**: $\\text{result} = \\text{filter}(\\text{new\\_all}(), \\lambda d. \\text{self\\_test}(d) = \\text{Ok})$\n**Doc comment**: Returns a static slice of all self-tested, usable GPU miners, ordered by preference. This list is memoized once per process.\n\n### `gpu_available()`\n\n**Reasoning**: Provides a simple boolean check to determine if any functional GPU backend is ready for mining without needing to access the full device list.\n**Preconditions**: The GPU mining system has been initialized (i.e., `shared_all()` has run).\n**Postconditions**: Returns `true` if `shared_all()` contains one or more devices; otherwise, returns `false`.\n**Z Notation (informal)**: $\\text{gpu\\_available}() \\Leftrightarrow \\#\\text{shared\\_all}() > 0$\n**Doc comment**: Checks if at least one self-tested GPU backend is available for mining.\n\n### `gpu_device_count()`\n\n**Reasoning**: Reports the exact number of functional, self-tested GPUs currently participating in mining, useful for logging and resource monitoring.\n**Preconditions**: The GPU mining system has been initialized.\n**Postconditions**: Returns the total count of usable `GpuMiner` instances found by `shared_all()`.\n**Z Notation (informal)**: $\\text{gpu\\_device\\_count}() = \\#\\text{shared\\_all}()$\n**Doc comment**: Returns the number of GPUs currently enabled and available for mining.\n\n### `mine_all_gpus()`\n\n**Reasoning**: Implements the fan-out logic necessary for multi-GPU rigs. It drains existing work stashes first, then spawns a dedicated thread for *each* usable GPU to search disjoint regions concurrently. This ensures no work is lost and all devices contribute to the hash rate.\n**Preconditions**: `shared_all()` must return at least one device.\n**Postconditions**: Returns `Some(h)` if a verified hit $h$ is found by any device $d \\in D$. Returns `None` if the search completes without a hit or if cancellation was observed. All spawned threads are guaranteed to join, and all verified hits (even those arriving after the winner) are returned to their respective stashes.\n**Z Notation (informal)**: $\\text{result} = \\begin{cases} \\text{Some}(h) & \\text{if } \\exists d \\in D, h \\text{ verified by } d \\\\ \\text{None} & \\text{otherwise} \\end{cases}$\n**Doc comment**: Runs the nonce search concurrently across all self-tested GPUs. Returns the first verified hit found, or `None` if no hit is found or mining is cancelled.\n\n---\n\n## Backend Configuration\n\n### `Backend` (Enum)\n\n**Reasoning**: Defines the policy for how the mining function should select a backend (GPU, CPU, or automatic preference).\n**Preconditions**: None.\n**Postconditions**: Provides a clear, type-safe representation of mining strategy.\n**Z Notation (informal)**: $\\text{Backend} \\in \\{\\text{Auto}, \\text{Gpu}, \\text{Cpu}\\}$\n**Doc comment**: Defines the preferred mining backend: `Auto` (GPU preferred, CPU fallback), `Gpu` (must use GPU if available), or `Cpu` (always use CPU).\n\n### `set_backend()`\n\n**Reasoning**: Allows the application to configure the global mining strategy once at startup, ensuring all subsequent `mine()` calls adhere to the chosen policy.\n**Preconditions**: Must be called before any mining operation begins.\n**Postconditions**: The process-wide `BACKEND` state is updated to reflect the input `b`.\n**Z Notation (informal)**: $\\text{BACKEND}' = b$\n**Doc comment**: Sets the process-wide mining backend policy. Call once at startup.\n\n### `backend()`\n\n**Reasoning**: Provides a thread-safe, read-only accessor for the currently configured global mining strategy.\n**Preconditions**: None.\n**Postconditions**: Returns the current value of the globally stored `BACKEND`.\n**Z Notation (informal)**: $\\text{current\\_backend} = \\text{BACKEND}$\n**Doc comment**: Retrieves the currently selected process-wide mining backend policy.\n\n---\n\n## Main Mining Entry Point\n\n### `mine()`\n\n**Reasoning**: Serves as the unified, drop-in replacement for the old extension function. It intelligently routes the mining job: first checking CUDA, then applying the configured `Backend` logic (GPU fan-out or CPU), ensuring robust fallback and adherence to policy.\n**Preconditions**: All required inputs (`midstate`, `target`, `cancel`, `hash_counter`) must be valid. The `Backend` must have been set via `set_backend()` if a specific policy is required.\n**Postconditions**: Returns `Some(h)` if a verified hit $h$ is found, or `None` if the search completes without a hit or if cancellation was observed. The `hash_counter` is updated across all utilized devices (GPU/CPU).\n**Z Notation (informal)**: $\\text{result} = \\begin{cases} \\text{CUDA\\_walk}(\\dots) & \\text{if } \\text{cuda\\_walk} \\text{ succeeds} \\\\ \\text{mine\\_all\\_gpus}(\\dots) & \\text{if } \\text{backend}() \\in \\{\\text{Auto}, \\text{Gpu}\\} \\land \\text{gpu\\_available}() \\\\ \\text{mine\\_extension}(\\dots) & \\text{otherwise} \\end{cases}$\n**Doc comment**: The primary mining entry point. Routes the job based on CUDA availability and the configured `Backend` policy (GPU fan-out, CPU, or CUDA walk)."}, {"path": "core/mmr.rs", "module": "core", "doc": "## `hash_node`\n\n**Reasoning**: This function implements the core cryptographic operation for building both the Merkle Mountain Range (MMR) and the Sparse Merkle Tree (SMT). It allows switching between V1 (legacy, non-domain-separated) and V2 (domain-separated) hashing modes, ensuring backward compatibility while providing modern security guarantees.\n\n**Preconditions**:\n* `left` must be a 32-byte BLAKE3 hash output.\n* `right` must be a 32-byte BLAKE3 hash output.\n* `is_v2` must be a boolean flag indicating the required hashing mode.\n\n**Postconditions**:\n* The returned 32-byte hash is deterministically ty).\n\n**Z Notation (informal)**:\n$$ \\text{flip\\_bit} : [u8; 32] \\to \\{0..255\\} \\to \\text{void} $$\n$$ \\text{bytes}' = \\text{bytes} \\oplus (1 \\ll \\text{offset}) $$\n\n**Doc comment**:\n```rust\n/// Toggle bit `bit_index` of `bytes` in place.\n#[inline]\nfn flip_bit(bytes: &mut [u8; 32], bit_index: usize) { /* ... */ }\n```\n\n## `mask_lower_bits`\n\n**Reasoning**: This function efficiently clears the lowest `height` bits of a path array in $O(1)$ time, which is crucial for performance inside the SMT proof generation loop (`prove`), preventing an unnecessary $O(\\text{height})$ loop.\n\n**Preconditions**:\n* `height` must be less than or equal to 256.\n\n**Postconditions**:\n* The input slice `path` is mutated such that all bits $i \\in \\{0, \\dots, \\text{height}-1\\}$ are zero.\n* All bits $i \\in \\{\\text{height}, \\dots, 255\\}$ remain unchanged.\n\n**Z Notation (informal)**:\n$$ \\text{mask\\_lower\\_bits} : [u8; 32] \\to \\{0..256\\} \\to \\text{void} $$\n$$ \\text{post}: \\forall i \\in 0..\\text{height} \\cdot \\text{bit}(\\text{path}', i) = 0 $$\n$$ \\text{post}: \\forall i \\in \\text{height}..256 \\cdot \\text{bit}(\\text{path}', i) = \\text{bit}(\\text{path}, i) $$\n\n**Doc comment**:\n```rust\n/// Clear all bits in positions `0..height` of `path` in place.\n#[inline]\nfn mask_lower_bits(path: &mut [u8; 32], height: usize) { /* ... */ }\n```\n\n## `pos_height`\n\n**Reasoning**: Determines the height of the MMR node at a specific post-order position. This is necessary for validating leaf positions and guiding the proof construction, as leaves are defined to be at height 0.\n\n**Preconditions**:\n* `pos` must be less than $2^{63}$.\n\n**Postconditions**:\n* Returns the height $h$ such that the node at `pos` is the root of a perfect binary subtree of height $h$.\n\n**Z Notation (informal)**:\n$$ \\text{pos\\_height} : \\mathbb{N} \\to \\{0..32\\} $$\n$$ \\text{post}: \\text{result} = h \\iff \\text{node}(\\text{pos}) \\text{ is root of height } h \\text{ subtree} $$\n\n**Doc comment**:\n```rust\n/// Compute the height of the MMR node at the given post-order position.\nfn pos_height(mut pos: u64) -> u32 { /* ... */ }\n```\n\n## `mmr_size`\n\n**Reasoning**: Calculates the total number of nodes (leaves + internal merges) required for an MMR with $n$ leaves. This is a fundamental invariant used for structural validation and proof size calculation.\n\n**Preconditions**:\n* $n$ must be a non-negative integer (`u64`).\n\n**Postconditions**:\n* Returns the total node count: $2n - \\text{popcount}(n)$.\n\n**Z Notation (informal)**:\n$$ \\text{mmr\\_size} : \\mathbb{N} \\to \\mathbb{N} $$\n$$ \\text{mmr\\_size}(n) = 2 \\cdot n - \\text{popcount}(n) $$\n\n**Doc comment**:\n```rust\n/// Total number of MMR nodes (leaves and internal) in an MMR with `n` leaves.\npub fn mmr_size(n: u64) -> u64 { /* ... */ }\n```\n\n## `peaks`\n\n**Reasoning**: Identifies the post-order positions of all perfect binary subtree roots (the \"peaks\"). This list is essential for the MMR root calculation, as the root is derived by bagging these peaks.\n\n**Preconditions**:\n* `size` must be a valid total node count, i.e., $\\text{size} = \\text{mmr\\_size}(n)$ for some $n \\ge 0$.\n\n**Postconditions**:\n* Returns a vector of positions, ordered left-to-right (largest height first).\n* The length of the returned vector is $\\text{popcount}(n)$.\n\n**Z Notation (informal)**:\n$$ \\text{peaks} : \\mathbb{N} \\to \\text{seq } \\mathbb{N} $$\n$$ \\text{pre}: \\text{size} = \\text{mmr\\_size}(n) \\text{ for some } n \\ge 0 $$\n$$ \\text{post}: \\#\\text{result} = \\text{popcount}(n) $$\n\n**Doc comment**:\n```rust\n/// Positions of the peaks in an MMR with `size` total nodes (post-order).\npub fn peaks(size: u64) -> Vec<u64> { /* ... */ }\n```\n\n## `MerkleMountainRange::new`\n\n**Reasoning**: Provides the canonical starting point for any MMR, representing a state with zero leaves and zero nodes.\n\n**Preconditions**:\n* None.\n\n**Postconditions**:\n* Returns an `MerkleMountainRange` instance where `leaf_count = 0` and `nodes` is empty.\n\n**Z Notation (informal)**:\n$$ \\text{new}() \\to \\text{MMR} $$\n$$ \\text{post}: \\text{result}.\\text{leaf\\_count} = 0 \\land \\text{result}.\\text{nodes} = \\langle\\rangle $$\n\n**Doc comment**:\n```rust\n/// Construct an empty MMR.\npub fn new() -> Self { /* ... */ }\n```\n\n## `MerkleMountainRange::from_raw_parts`\n\n**Reasoning**: A hidden constructor intended solely for internal storage migration paths. It bypasses structural validation, assuming the caller has already verified the consistency of the raw data (i.e., $\\text{#nodes} = \\text{mmr\\_size}(\\text{leaf\\_count})$).\n\n**Preconditions**:\n* `nodes` and `leaf_count` must satisfy the MMR structural invariant: $\\text{#nodes} = 2 \\cdot \\text{leaf\\_count} - \\text{popcount}(\\text{leaf\\_count})$.\n* All interior nodes in `nodes` must have been hashed using a single, consistent V1 or V2 mode.\n\n**Postconditions**:\n* Returns an MMR instance with the provided raw parts.\n\n**Z Notation (informal)**:\n$$ \\text{from\\_raw\\_parts} : \\text{im::Vector } [u8; 32] \\times \\mathbb{N} \\to \\text{MMR} $$\n$$ \\text{pre}: \\text{#nodes} = \\text{mmr\\_size}(\\text{leaf\\_count}) $$\n$$ \\text{post}: \\text{result}.\\text{nodes} = \\text{nodes} \\land \\text{result}.\\text{leaf\\_count} = \\text{leaf\\_count} $$\n\n**Doc comment**:\n```rust\n/// Reconstruct an MMR from its raw post-order node array and leaf count.\n#[doc(hidden)]\npub fn from_raw_parts(nodes: im::Vector<[u8; 32]>, leaf_count: u64) -> Self { /* ... */ }\n```\n\n## `MerkleMountainRange::truncated`\n\n**Reasoning**: Allows deriving a smaller MMR state from a larger one without recomputing hashes. Since MMRs are append-only and stored in post-order, the prefix of the node array corresponds exactly to the MMR of the first $n$ leaves.\n\n**Preconditions**:\n* `n` must be non-negative.\n\n**Postconditions**:\n* Returns a new MMR instance whose node count is $\\text{mmr\\_size}(\\min(n, \\text{self}.\\text{leaf\\_count}))$.\n* The new MMR contains the prefix of the original `nodes` vector up to the required size.\n\n**Z Notation (informal)**:\n$$ \\text{truncated} : \\text{MMR} \\times \\mathbb{N} \\to \\text{MMR} $$\n$$ \\text{post}: \\text{result}.\\text{leaf\\_count} = \\min(\\text{self}.\\text{leaf\\_count}, n) $$\n\n**Doc comment**:\n```rust\n/// The MMR of the first `n` leaves (midwimble addition, used to rebuild\n/// a fork-point state without rehashing the chain).\npub fn truncated(&self, n: u64) -> Self { /* ... */ }\n```\n\n## `MerkleMountainRange::leaf_count` / `MerkleMountainRange::size`\n\n**Reasoning**: Simple accessors for the core structural invariants of the MMR.\n\n**Preconditions**:\n* None.\n\n**Postconditions**:\n* `leaf_count()` returns the number of leaves appended.\n* `size()` returns the total number of nodes ($\\text{nodes}.\\text{len()}$).\n\n**Z Notation (informal)**:\n$$ \\text{leaf\\_count}() \\to \\mathbb{N} $$\n$$ \\text{size}() \\to \\mathbb{N} $$\n\n**Doc comment**:\n```rust\n/// Number of leaves currently in the MMR.\npub fn leaf_count(&self) -> u64 { /* ... */ }\n/// Total number of nodes (leaves plus internal merges).\npub fn size(&self) -> u64 { /* ... */ }\n```\n\n## `MerkleMountainRange::append`\n\n**Reasoning**: Implements the core append-only logic. It places a new leaf and then iteratively performs cascade merges with preceding same-height siblings until no more merges are possible, maintaining the MMR invariant in amortized $O(1)$ time.\n\n**Preconditions**:\n* $\\text{#L} < 2^{63} - 1$.\n* `leaf_hash` must be a 32-byte hash output.\n* `is_v2` must reflect the correct hashing mode for the current chain height.\n\n**Postconditions**:\n* The MMR state is updated: $\\text{L}' = \\text{L} \\mathbin\\Vert \\langle \\text{leaf\\_hash} \\rangle \\mathbin\\Vert \\langle \\text{merges} \\rangle$.\n* Returns the post-order position of the newly appended leaf.\n* All internal merges are computed using `hash_node` with the provided `is_v2`.\n\n**Z Notation (informal)**:\n$$ \\text{append} : \\text{MMR} \\times [u8; 32] \\times \\mathbb{B} \\to \\mathbb{N} $$\n$$ \\text{pre}: \\#L < 2^{63} - 1 $$\n$$ \\text{post}: L' = L \\mathbin\\Vert \\langle \\text{leaf\\_hash} \\rangle \\land \\text{result}! = \\text{mmr\\_size}(\\#L) $$\n\n**Doc comment**:\n```rust\n/// Append a leaf and cascade-merge any sibling pairs of equal height.\npub fn append(&mut self, leaf_hash: &[u8; 32], is_v2: bool) -> u64 { /* ... */ }\n```\n\n## `MerkleMountainRange::root`\n\n**Reasoning**: Computes the canonical MMR root by \"bagging\" (folding) the peak hashes right-to-left. This process is $O(\\log n)$ and is the primary function used for state commitment.\n\n**Preconditions**:\n* None.\n* `is_v2` must reflect the correct hashing mode for the chain height.\n\n**Postconditions**:\n* Returns the 32-byte MMR root hash.\n* If the MMR is empty, returns the all-zero hash $\\langle 0 \\rangle$.\n* The calculation uses the canonical right-to-left bagging order.\n\n**Z Notation (informal)**:\n$$ \\text{root} : \\text{MMR} \\times \\mathbb{B} \\to [u8; 32] $$\n$$ \\text{post}: \\text{result} = \\text{bag}(\\text{peaks}(\\text{size}()), \\text{is\\_v2}) $$\n\n**Doc comment**:\n```rust\n/// Compute the MMR root by **bagging the peaks right-to-left**.\npub fn root(&self, is_v2: bool) -> [u8; 32] { /* ... */ }\n```\n\n## `MerkleMountainRange::prove`\n\n**Reasoning**: Generates a compact inclusion proof for a specific leaf. The proof structure (siblings + peak list) allows a light client to verify the leaf's existence and its contribution to the root without needing the full MMR state.\n\n**Preconditions**:\n* `leaf_pos` must be within the range $[0, \\text{size}-1]$.\n* $\\text{pos\\_height}(\\text{leaf\\_pos})$ must be 0 (\n\n## Function Documentation\n\n### `path_from_top16`\n\n**Reasoning**: Converts a 16-bit prefix (derived from the first two bytes of a coin ID) into a fixed 32-byte path representation, ensuring the low 240 bits are zeroed out. This is necessary for indexing the top 16 levels of the SMT cache.\n**Preconditions**: `height` must be within the valid range `CACHE_MIN_HEIGHT..=SMT_HEIGHT`.\n**Postconditions**: Returns a tuple `(u16, [u8; 32])` where the `u16` is the prefix and the array is the canonical path for that prefix at height 256 (or SMT\\_HEIGHT).\n**Z Notation (informal)**: $\\text{path\\_from\\_top16}(h) \\triangleq (h, P_{top16})$ where $P_{top16}$ has bits $0..239$ set to zero.\n**Doc comment**: `/// Converts a height and top-16 prefix into the canonical 32-byte SMT path.`\n\n### `path_from_top16` (Usage Context)\n\n*(Note: This function is used internally by `get_node` and `update_cache_for_bucket`. Its usage ensures that all paths passed to the cache are correctly normalized.)*\n\n### `UtxoAccumulator::new`\n\n**Reasoning**: Provides a clean, empty starting state for the accumulator, representing an empty UTXO set.\n**Preconditions**: None.\n**Postconditions**: Returns an `UtxoAccumulator` where `coins` is empty and `nodes` is empty.\n**Z Notation (informal)**: $\\text{new}() \\rightarrow A$ where $A.\\text{coins} = \\emptyset$ and $A.\\text{nodes} = \\emptyset$.\n**Doc comment**: `/// Constructs a new, empty UtxoAccumulator.`\n\n### `UtxoAccumulator::from_set`\n\n**Reasoning**: Allows bulk construction from an iterable of coins. It ensures the resulting state is consistent by performing individual insertions, leveraging existing cache entries if possible.\n**Preconditions**: `coins` must be iterable over `[u8; 32]` coin IDs. `is_v2` must accurately reflect the hashing mode for all coins.\n**Postconditions**: Returns an accumulator where `coins` equals the input set, and `nodes` is consistent with `coins` under `is_v2`.\n**Z Notation (informal)**: $\\text{from\\_set}(\\text{C}, v) \\rightarrow A$ where $A.\\text{coins} = \\text{C}$ and $A.\\text{nodes} \\text{ consistent}(\\text{C}, v)$.\n**Doc comment**: `/// ed with naive per-insert cache updates.\n**Preconditions**: None. The state must be consistent (i.e., `self.coins` is valid).\n**Postconditions**: `nodes` is updated such that it satisfies the cache derivability invariant for `self.coins` under `is_v2`. `self.coins` remains unchanged.\n**Z Notation (informal)**: $\\text{rebuild\\_tree}(v) \\rightarrow A'$ where $A'.\\text{nodes} \\text{ consistent}(A.\\text{coins}, v)$ and $A'.\\text{coins} = A.\\text{coins}$.\n**Doc comment**: `/// Completely rebuilds the SMT cache (nodes/buckets) from the canonical coin set under the given hashing mode.`\n\n### `UtxoAccumulator::bucket`\n\n**Reasoning**: Provides an efficient way to retrieve all coins sharing a specific 16-bit prefix by performing a range query over the ordered `coins` set. This avoids redundant storage of bucket data.\n**Preconditions**: `prefix` must be a valid 16-bit value (0-65535).\n**Postconditions**: Returns a `Vec<[u8; 32]>` containing all coins $c$ such that $\\text{top16}(c) = \\text{prefix}$, sorted ascendingly.\n**Z Notation (informal)**: $\\text{bucket}(p) \\rightarrow \\{ c \\in \\text{coins} \\mid \\text{top16}(c) = p \\}$.\n**Doc comment**: `/// Retrieves all coins sharing a 16-bit prefix, sorted ascendingly.`\n\n### `UtxoAccumulator::insert`\n\n**Reasoning**: Mutates the canonical state (`coins`) and then updates the derived cache (`nodes`). It is idempotent; if the coin exists, no further work is done.\n**Preconditions**: None. `is_v2` must match the current accumulator's intended hashing mode.\n**Postconditions**: If the coin was new: `coins'` includes the coin, and `nodes'` is updated to reflect the change via cache ripple. Returns `true`. If the coin existed: `coins'` equals `coins`, and `nodes'` equals `nodes`. Returns `false`.\n**Z Notation (informal)**: $\\text{insert}(c, v) \\rightarrow A'$ where $A'.\\text{coins} = A.\\text{coins} \\cup \\{c\\}$ if $c \\notin A.\\text{coins}$, and $A'.\\text{nodes} \\text{ consistent}(A'.\\text{coins}, v)$.\n**Doc comment**: `/// Inserts a coin into the accumulator, updating the SMT cache under the given hashing mode.`\n\n### `UtxoAccumulator::remove`\n\n**Reasoning**: Mutates the canonical state (`coins`) and updates the derived cache. Crucially, removing a coin may cause its bucket to empty, triggering cache eviction (removal of stale entries) up the tree.\n**Preconditions**: None. `is_v2` must match the current accumulator's intended hashing mode.\n**Postconditions**: If the coin was present: `coins'` equals `coins` minus the coin, and `nodes'` is updated/evicted accordingly. Returns `true`. If the coin was absent: `coins'` equals `coins`, and `nodes'` equals `nodes`. Returns `false`.\n**Z Notation (informal)**: $\\text{remove}(c, v) \\rightarrow A'$ where $A'.\\text{coins} = A.\\text{coins} \\setminus \\{c\\}$ if $c \\in A.\\text{coins}$, and $A'.\\text{nodes} \\text{ consistent}(A'.\\text{coins}, v)$.\n**Doc comment**: `/// Removes a coin from the accumulator, updating the SMT cache under the given hashing mode.`\n\n### `UtxoAccumulator::root`\n\n**Reasoning**: Provides O(1) access to the current SMT root by reading the cached node at the top level (`SMT_HEIGHT`).\n**Preconditions**: The cache (`nodes`) must have been recently rebuilt or updated using the specified `is_v2` mode.\n**Postconditions**: Returns the canonical SMT root hash for `self.coins` under `is_v2`.\n**Z Notation (informal)**: $\\text{root}(v) \\rightarrow H$ where $H = \\text{get\\_node}(\\text{SMT\\_HEIGHT}, P_{zero}, v)$.\n**Doc comment**: `/// Retrieves the current SMT root hash under the specified hashing mode.`\n\n### `UtxoAccumulator::prove`\n\n**Reasoning**: Generates a cryptographically verifiable inclusion proof. It efficiently combines a single recursive descent over the small bucket (bottom 240 levels) with direct cache lookups for the top 16 levels, achieving $O(\\log N)$ amortized complexity.\n**Preconditions**: The input `coin` must be present in `self.coins`. The cache (`nodes`) ext{update\\_cache}(p, B, v) \\rightarrow A'$ where $A'.\\text{nodes}$ reflects the new hashes along $p$'s path, and $A'.\\text{nodes}$ contains no empty-subtree entries.\n**Doc comment**: `/// Recomputes the cache contributions for one bucket and ripples the hash up through the cached top 16 levels.`\n\n### `UtxoProof`\n\n**Reasoning**: Defines the fixed wire format for an SMT inclusion proof, containing all necessary sibling hashes and structural metadata for verification.\n**Preconditions**: None (data structure definition).\n**Postconditions**: N/A (data structure).\n**Z Notation (informal)**: $\\text{UtxoProof} \\triangleq \\langle \\text{leaf\\_index}: \\text{usize}, \\text{leaf\\_count}: \\text{usize}, \\text{siblings}: \\text{Vec}<\\text{ProofElement}> \\rangle$.\n**Doc comment**: `/// SMT inclusion proof containing 256 sibling hashes in bottom-up order.`\n\n### `verify_utxo_proof`\n\n**Reasoning**: Verifies the cryptographic soundness of an inclusion proof by folding the siblings against the coin ID using the specified hashing mode, ensuring the final hash matches the expected root.\n**Preconditions**: The proof must contain exactly `SMT_HEIGHT` (256) siblings. The structural check must pass (sibling side indicators match coin bits). `is_v2` must match the mode used to generate the proof and root.\n**Postconditions**: Returns `true` if the folded hash equals `expected_root`, otherwise `false`.\n**Z Notation (informal)**: $\\text{verify\\_utxo\\_proof}(c, P, R, v) \\rightarrow \\text{true} \\iff \\text{Fold}(c, P, v) = R$.\n**Doc comment**: `/// Verifies an SMT inclusion proof against a known root under the given hashing mode.`"}, {"path": "core/mod.rs", "module": "core", "doc": "## Documentation for `core/mod.rs`\n\nThis file serves as the central entry point for the consensus core, aggregating all pure functional components related to chain state management, consensus rules, and various mining/validation strategies.\n\n### Exported Functions from `state`\n\n#### `apply_batch(batch: Batch) -> State`\n1. **Reasoning**: This function is the primary mechanism for advancing the chain state based on a validated batch of transactions/blocks. It ensures deterministic state transitions.\n2. **Preconditions**: The input `batch` must be cryptographically valid, correctly signed, and adhere to all protocol rules (e.g., correct header structure, valid extensions).\n3. **Postconditions**: A new, consistent `State` is returned, reflecting the successful application of all transactions within the `batch`. The resulting state is ready for subsequent validation or processing.\n4. **Z Notation (informal)**: $\\text{apply\\_batch}(\\text{batch}) \\rightarrow \\text{State}' \\mid \\text{State}' = \\text{Transition}(\\text{State}, \\text{batch})$\n5. **Doc comment**: `/// Applies a validated batch to the current chain state, yielding the next state.`\n\n#### `apply_batch_skip_pow(batch: Batch) -> State`\n1. **Reasoning**: Used in scenarios where Proof-of-Work (PoW) requirements are bypassed or skipped (e.g., during recovery, trusted validation, or specific consensus phases). It allows state advancement without requiring full PoW verification.\n2. **Preconditions**: The input `batch` must be cryptographically valid and adhere to all non-PoW protocol rules. The system must be in a state where PoW skipping is permissible.\n3. **Postconditions**: A new, consistent `State` is returned, reflecting the successful application of the batch, even if PoW was skipped.\n4. **Z Notation (informal)**: $\\text{apply\\_batch\\_skip\\_pow}(\\text{batch}) \\rightarrow \\text{State}' \\mid \\text{State}' = \\text{Transition}_{\\text{skip}}(\\text{State}, \\text{batch})$\n5. **Doc comment**: `/// Applies a validated batch, skipping Proof-of-Work verification when protocol allows.`\n\n#### `apply_batch_trusted(batch: Batch) -> State`\n1. **Reasoning**: Designed for environments where the input batch is trusted (e.g., internal testing, recovery from known good checkpoints). It assumes external validation has already occurred, optimizing performance by skipping redundant checks.\n2. **Preconditions**: The input `batch` must be cryptographically valid. The calling context must guarantee the trustworthiness of the batch data.\n3. **Postconditions**: A new, consistent `State` is returned, reflecting the successful application of the batch without performing full internal validation checks.\n4. **Z Notation (informal)**: $\\text{apply\\_batch\\_trusted}(\\text{batch}) \\rightarrow \\text{State}' \\mid \\text{State}' = \\text{Transition}_{\\text{trusted}}(\\text{State}, \\text{batch})$\n5. **Doc comment**: `/// Applies a validated batch assuming external trust, bypassing internal validation checks for speed.`\n\n#### `choose_best_state(states: &[State]) -> State`\n1. **Reasoning**: This function resolves conflicts or selects the canonical state from a set of potential states (e.g., during fork resolution, recovery, or comparing competing chain histories). It implements the core consensus rule for state selection.\n2. **Preconditions**: The input slice `states` must not be empty. All states within the slice must be derived from valid chain history according to protocol rules.\n3. **Postconditions**: A single, canonical `State` is returned, guaranteed to be the \"best\" according to the defined consensus criteria (e.g., longest chain, highest weight, most finalized).\n4. **Z Notation (informal)**: $\\text{choose\\_best\\_state}(\\text{S}) \\rightarrow \\text{State}^* \\mid \\text{State}^* = \\arg\\max_{\\text{s} \\in \\text{S}} (\\text{ConsensusMetric}(\\text{s}))$\n5. **Doc comment**: `/// Selects the canonical, best state from a list of competing states based on consensus rules.`\n\n### Module Structure Overview\n\nThe module structure organizes the complex consensus logic into focused, pure functional units:\n\n*   **`types`**: Defines core data structures (`Batch`, `BatchHeader`, `Extension`, `State`).\n*   **`state`**: Contains state transition logic (the functions documented above).\n*   **`walk` / `scan`**: Utilities for traversing and inspecting the chain history.\n*   **`finality` / `wots`**: Implements finality guarantees and related consensus mechanisms (e.g., Weak/Strong Ordering Time Stamps).\n*   **`mmr` / `mss` / `mw`**: Modules dedicated to specific consensus or mining strategies (e.g., Miner Maximization Ratio, etc.).\n*   **`anchor` / `bond` / `recovery`**: Logic related to staking, collateral, and chain recovery procedures.\n*   **`cuda_walk` / `gpu_mining` / `simd_mining`**: Optional modules providing hardware-accelerated implementations for mining/validation when the `gpu` feature is enabled.\n\n### Public Types\n\n*   **`Batch`**: Represents a collection of transactions or blocks ready for state application.\n*   **`BatchHeader`**: Metadata defining the batch (e.g., previous hash, timestamp, PoW proof).\n*   **`Extension`**: Protocol extensions allowing future feature additions without breaking compatibility.\n*   **`State`**: The complete, deterministic snapshot of the chain's current status (e.g., account balances, contract states)."}, {"path": "core/mss.rs", "module": "core", "doc": "## `MssKeypair` Struct\n\n**Reasoning**: Holds the complete state required for MSS signing, including the master seed, tree structure, and the current signing index (`next_leaf`).\n**Preconditions**: `height` must be in $1 \\le H \\le 20$.\n**Postconditions**: The internal tree is fully constructed up to the root (`master_pk`), and `next_leaf` is initialized to 0.\n**Z Notation (informal)**: $\\text{MssKeypair} \\triangleq \\{H: \\mathbb{Z}, \\text{seed}: [u8]^{32}, \\text{tree}: \\text{Vec}[u8]^{32}, \\text{next\\_leaf}: \\mathbb{N}, \\text{master\\_pk}: [u8]^{32}\\}$\n**Doc comment**: Full MSS keypair, containing the master seed, tree structure, and the index of the next available leaf for signing.\n\n## `MasterPublicKey` Type Alias\n\n**Reasoning**: Provides a clear, fixed-size type for the root hash of the Merkle tree, which serves as the coin ID on-chain.\n**Preconditions**: N/A\n**Postconditions**: A 32-byte hash representing the MSS tree root.\n**Z Notation (informal)**: $\\text{MasterPublicKey} \\triangleq [u8]^{32}$\n**Doc comment**: The 32-byte root hash of the Merkle tree, serving as the unique master public key (coin ID).\n\n## `MssSignature` Struct\n\n**Reasoning**: Encapsulates all data required to verify a single signature: the WOTS signature, the leaf's public key, the index, and the Merkle authentication path.\n**Preconditions**: The signature must be derived from a valid MSS tree structure.\n**Postconditions**: A complete, verifiable signature package ready for transmission or on-chain verification.\n**Z Notation (informal)**: $\\text{MssSignature} \\triangleq \\{ \\text{index}: \\mathbb{N}, \\text{wots\\_pk}: [u8]^{32}, \\text{wots\\_sig}: [[u8]^{32}]^{\\text{WOTS\\_CHAINS}}, \\text{auth\\_path}: \\text{Vec}[u8]^{32} \\}$\n**Doc comment**: A complete MSS signature, including the WOTS signature, leaf public key, index, and the Merkle authentication path to the master public key.\n\n## `derive_wots_seed` (Private Helper)\n\n**Reasoning**: Deterministically generates the WOTS seed for a specific leaf index using the master seed, ensuring reproducibility.\n**Preconditions**: `master_seed` is 32 bytes; `index` is a valid leaf index.\n**Postconditions**: A unique 32-byte WOTS seed corresponding to the input index.\n**Z Notation (informal)**: $\\text{WotsSeed} = \\text{BLAKE3}(\\text{master\\_seed} \\parallel \\text{index})$\n**Doc comment**: Derives the deterministic WOTS seed for a given leaf index from the master seed.\n\n## `keygen`\n\n**Reasoning**: The primary function to generate a complete MSS keypair by calculating all WOTS public keys and building the Merkle tree structure. It supports checkpointing for large trees.\n**Preconditions**: $1 \\le \\text{height} \\le 20$; `master_seed` is 32 bytes.\n**Postconditions**: A fully constructed `MssKeypair` with a valid `master_pk` and `next_leaf = 0`.\n**Z Notation (informal)**: $\\text{MssKeypair} \\leftarrow \\text{BuildTree}(\\text{seed}, H)$\n**Doc comment**: Generates a complete MSS keypair for a specified height, supporting checkpointing for large trees.\n\n## `save_checkpoint` (Private Helper)\n\n**Reasoning**: Persists the calculated WOTS leaf keys to disk during long generation processes, allowing resumption.\n**Preconditions**: `path` is writable; `leaves` contains all calculated WOTS public keys.\n**Postconditions**: The leaf data is serialized and saved to the specified file path.\n**Z Notation (informal)**: $\\text{Save}(\\text{path}, \\text{leaves}) \\Rightarrow \\text{FileExists}(\\text{path})$\n**Doc comment**: Saves the current set of WOTS leaf public keys to a checkpoint file for generation resumption.\n\n## `leaf_public_key`\n\n**Reasoning**: Allows external calculation of a specific leaf's WOTS public key without generating the entire tree, useful for parallel or partial tree construction.\n**Preconditions**: `master_seed` is 32 bytes; `index` is a valid leaf index.\n**Postconditions**: The 32-byte WOTS public key corresponding to the given index.\n**Z Notation (informal)**: $\\text{WotsPK}(\\text{seed}, i) = \\text{keygen\\_seq}(\\text{derive\\_wots\\_seed}(\\text{seed}, i))$\n**Doc comment**: Calculates the WOTS public key for a specific leaf index using the master seed, without building the full tree.\n\n## `root_from_leaves`\n\n**Reasoning**: Verifies that a set of leaves forms a valid MSS tree and computes the Merkle root from them, useful for validating partial or external tree data.\n**Preconditions**: Input `leaves` must have $2^H$ elements, where $1 \\le H \\le 20$.\n**Postconditions**: Returns the 32-byte Merkle root if valid; otherwise, returns an error.\n**Z Notation (informal)**: $\\text{Root}(\\text{Leaves}) = \\text{Fold}(\\text{Leaves})$\n**Doc comment**: Computes the Merkle root from a complete set of WOTS leaf public keys, validating that the input forms a power-of-two sized tree up to `MAX_HEIGHT`.\n\n## `keygen_random`\n\n**Reasoning**: Provides a convenience function for generating a keypair with a randomly generated master seed.\n**Preconditions**: N/A\n**Postconditions**: A valid `MssKeypair` using `DEFAULT_HEIGHT`.\n**Z Notation (informal)**: $\\text{MssKeypair} \\leftarrow \\text{keygen}(\\text{rand}() , 10)$\n**Doc comment**: Generates a new MSS keypair with a random master seed and the default tree height (10).\n\n## `MssKeypair::remaining`\n\n**Reasoning**: Calculates how many signatures can still be generated before the tree is exhausted.\n**Preconditions**: The keypair must be valid.\n**Postconditions**: The count of unused leaves: $2^H - \\text{next\\_leaf}$.\n**Z Notation (informal)**: $\\text{Remaining} = 2^H - \\text{next\\_leaf}$\n**Doc comment**: Returns the number of signatures remaining in the MSS tree.\n\n## `MssKeypair::used`\n\n**Reasoning**: Reports how many signatures have already been consumed.\n**Preconditions**: The keypair must be valid.\n**Postconditions**: The current value of `next_leaf`.\n**Z Notation (informal)**: $\\text{Used} = \\text{next\\_leaf}$\n**Doc comment**: Returns the number of signatures already used (i.e., the current leaf index to be used next).\n\n## `MssKeypair::public_key`\n\n**Reasoning**: Provides quick access to the immutable master public key (the tree root).\n**Preconditions**: The keypair must be valid and fully generated.\n**Postconditions**: The 32-byte `master_pk`.\n**Z Notation (informal)**: $\\text{PK} = \\text{master\\_pk}$\n**Doc comment**: Returns the master public key (the Merkle tree root).\n\n## `MssKeypair::sign`\n\n**Reasoning**: Generates a signature for a message, consuming the next available leaf index. This is a stateful operation requiring persistence of `next_leaf`.\n**Preconditions**: `next_leaf` must be less than $2^H$; message must be 32 bytes.\n**Postconditions**: Returns a valid `MssSignature`; `self.next_leaf` is incremented by 1.\n**Z Notation (informal)**: $\\text{Sig} \\leftarrow \\text{Sign}(\\text{seed}, i, m); \\text{next\\_leaf} \\leftarrow i+1$\n**Doc comment**: Signs a 32-byte message using the next unused leaf. **Crucially, this consumes the leaf and increments `next_leaf`.**\n\n## `MssKeypair::auth_path` (Private Helper)\n\n**Reasoning**: Calculates the necessary Merkle authentication path by traversing the internal tree structure from the leaf index up to the root.\n**Preconditions**: `leaf_idx` must be a valid index within the tree height $H$.\n**Postconditions**: A vector containing $H$ sibling hashes required for verification.\n**Z Notation (informal)**: $\\text{Path}(i) = \\text{Traverse}(\\text{tree}, i, H)$\n**Doc comment**: Calculates the Merkle authentication path from a given leaf index up to the tree root.\n\n## `MssKeypair::peek_next_leaf`\n\n**Reasoning**: Allows inspection of the next available leaf without modifying the state.\n**Preconditions**: The keypair must be valid.\n**Postconditions**: The current value of `next_leaf`.\n**Z Notation (informal)**: $\\text{Peek} = \\text{next\\_leaf}$\n**Doc comment**: Returns the index of the next leaf to be used without modifying the keypair state.\n\n## `MssKeypair::set_next_leaf`\n\n**Reasoning**: Allows recovery or manual state manipulation (e.g., after checkpoint loading). **Warning: Reusing a leaf is catastrophic.**\n**Preconditions**: `idx` must be a valid index within the tree height $H$.\n**Postconditions**: `self.next_leaf` is set to `idx`.\n**Z Notation (informal)**: $\\text{next\\_leaf} \\leftarrow i$\n**Doc comment**: Sets the next leaf index for signing. **Use only for recovery; reusing a leaf breaks security.**\n\n## `verify`\n\n**Reasoning**: The core verification function. It checks both the WOTS signature validity and the Merkle path integrity against the provided master public key, ensuring the signature is authentic and non-malleable.\n**Preconditions**: `sig` is a well-formed `MssSignature`; `message` is 32 bytes; `master_pk` matches the root of the tree from which `sig` was derived.\n**Postconditions**: Returns `true` if both WOTS and Merkle path checks pass, `false` otherwise.\n**Z Notation (informal)**: $\\text{Verify}(\\text{sig}, m, \\text{pk}) = (\\text{WotsVerify}(\\text{sig}, m) \\land \\text{Fold}(\\text{sig}) = \\text{pk})$\n**Doc comment**: Verifies an MSS signature by checking the WOTS signature and confirming that the Merkle path folds up to the provided master public key.\n\n## `recover_master_pk`\n\n**Reasoning**: Extracts the master public key committed to by a specific signature by performing the Merkle tree fold operation defined in `verify`. This is crucial for ensuring consistency between consensus code and external checks.\n**Preconditions**: `sig` must be a well-formed `MssSignature`.\n**Postconditions**: The 32-byte master public key derived from folding the signature's path onto its WOTS public key.\n**Z Notation (informal)**: $\\text{Recover}(\\text{sig}) = \\text{Fold}(\\text{sig})$\n**Doc comment**: Recovers the master public key committed to by an MSS signature by folding the authentication path onto the leaf's WOTS public key.\n\n## `mss_sigs_in_stack`\n\n**Reasoning**: Scans a raw witness stack (list of byte vectors) and extracts only valid MSS signatures, ignoring legacy WOTS signatures. This prevents burn accounting errors in multisig contexts.\n**Preconditions**: `stack` is a slice of byte vectors; items must be untrusted network data.\n**Postconditions**: A vector containing all successfully parsed `MssSignature` objects from the stack, in order.\n**Z Notation (informal)**: $\\text{Sigs} = \\{ \\text{Parse}(\\text{item}) \\mid \\text{item} \\in \\text{stack}, \\text{length}(\\text{item}) \\ne \\text{WOTS\\_SIG\\_SIZE} \\}$\n**Doc comment**: Parses a raw witness stack, extracting only valid MSS signatures and skipping legacy WOTS signatures.\n\n## `MssSignature::to_bytes`\n\n**Reasoning**: Serializes the signature into a compact wire format for network transmission or storage.\n**Preconditions**: The signature must be well-formed.\n**Postconditions**: A `Vec<u8>` representing the complete, serialized signature.\n**Z Notation (informal)**: $\\text{Bytes} = \\text{Serialize}(\\text{sig})$\n**Doc comment**: Serializes the MSS signature into its compact wire format.\n\n## `MssSignature::from_bytes`\n\n**Reasoning**: Deserializes an untrusted byte array into a structured `MssSignature`. This function is critical for security as it must be robust against malformed or truncated input without panicking.\n**Preconditions**: Input `data` must meet minimum length requirements; `auth_len` must not exceed `MAX_HEIGHT`.\n**Postconditions**: Returns `Ok(sig)` if the data is a well-formed MSS signature, or an descriptive `Err` otherwise (never panics).\n**Z Notation (informal)**: $\\text{Parse}(\\text{data}) \\Rightarrow (\\text{Ok}(\\text{sig}) \\lor \\text{Err}(\\text{descriptive}))$\n**Doc comment**: Parses an MSS signature from its wire format. **Designed to be robust against untrusted, malformed input and never panics.**\n\n## `MssSignature::size`\n\n**Reasoning**: Calculates the exact byte size of the serialized signature, useful for buffer allocation and validation.\n**Preconditions**: The signature must be well-formed.\n**Postconditions**: The total byte length of the serialized signature.\n**Z Notation (informal)**: $\\text{Size} = 8 + 32 + \\text{WOTS\\_SIG\\_SIZE} + 4 + H \\times 32$\n**Doc comment**: Returns the exact byte size of the serialized MSS signature.\n\n## `keygen_with_progress`\n\n**Reasoning**: Provides a non-blocking, callback-driven version of `keygen`, suitable for environments like web browsers (Wasm) where long computations must yield progress updates.\n**Preconditions**: $1 \\le \\text{height} \\le 20$; `master_seed` is 32 bytes; `progress_cb` is callable.\n**Postconditions**: A fully constructed `MssKeypair`.\n**Z Notation (informal)**: $\\text{MssKeypair} \\leftarrow \\text{BuildTree}(\\text{seed}, H) \\text{ with } \\text{Callback}$\n**Doc comment**: Generates an MSS keypair using a progress callback, suitable for environments requiring non-blocking computation."}, {"path": "core/mw/builder.rs", "module": "core", "doc": "## Struct Documentation\n\n### `Spendable`\n**Reasoning**: Represents a specific Unspent Transaction Output (UTXO) that the wallet intends to spend. It holds all necessary cryptographic material for signing and calculating totals.\n**Preconditions**: Must be a valid UTXO retrieved from the blockchain state.\n**Postconditions**: Provides the commitment, value, blinding factor, and owner secret required for transaction construction.\n**Z Notation (informal)**: $\\text{Spendable} \\equiv \\{ \\text{commitment}: \\text{Point32}, \\text{value}: \\mathbb{N}, \\text{blinding}: \\text{Scalar}, \\text{owner\\_secret}: \\text{Scalar} \\}$\n**Doc comment**: `/// An unspent output the wallet can spend.`\n\n### `Payment`\n**Reasoning**: Defines a single recipient and the amount of value being sent to them.\n**Preconditions**: The value must be positive. The `StealthAddress` must be valid.\n**Postconditions**: A structured definition of a payment destination and amount.\n**Z Notation (informal)**: $\\text{Payment} \\equiv \\{ \\text{to}: \\text{StealthAddress}, \\text{value}: \\mathbb{N}^+ \\}$\n**Doc comment**: `/// Defines a single payment destination and amount.`\n\n### `BuiltTransaction`\n**Reasoning**: Encapsulates the final, constructed `Transaction` along with specific metadata (the change commitment/value) that the sender needs to track locally after broadcasting.\n**Preconditions**: Must be successfully generated by `build_transaction`.\n**Postconditions**: Contains a fully formed and self-validated `Transaction` and an optional record of the change output.\n**Z Notation (informal)**: $\\text{BuiltTransaction} \\equiv \\{ \\text{tx}: \\text{Transaction}, \\text{change}: \\text{Option
