const MODULES = {"(root)": [{"path": "anchor.rs", "module": "(root)", "doc": "## `AnchorRecord` Methods\n\n### `AnchorRecord::verify_standalone`\n\n1. **Reasoning**: Provides a simplified entry point to verify an `AnchorRecord` against its internal consistency, delegating complex logic to `verify_standalone_with`.\n2. **Preconditions**: The `AnchorRecord` must be fully populated (including `checkpoint_id` matching the checkpoint ID). `depth` and `min_work` must reflect the current chain state requirements.\n3. **Postconditions**: Returns `Ok(())` if the record is internally consistent and passes basic policy checks; otherwise, returns an error detailing the failure.\n4. **Z Notation (informal)**: $\\text{VerifyStandalone}(\\text{record}, \\text{depth}, \\text{min\\_work}) \\Rightarrow \\text{True}$\n5. **Doc comment**: `/// Verifies the record on its own: the checkpoint id, the header (if carried) and the Midstate evidence.`\n\n### `AnchorRecord::verify_standalone_with`\n\n1. **Reasoning**: Performs the core validation of an `AnchorRecord`, checking ID consistency, ensuring Midstate evidence exists, verifying structural integrity based on the anchored item type (Commit or MergeMined), and finally calling the evidence's policy and proof verification.\n2. **Preconditions**: The record must be initialized. `depth` and `min_work` must be valid chain parameters. The `known` closure must correctly identify known header keys.\n3. **Postconditions**: Returns `Ok(Vec<[u8; 32]>)` containing the header keys used in the evidence; returns an error if any structural or policy check fails.\n4. **Z Notation (informal)**: $\\text{VerifyStandaloneWith}(\\text{record}, \\text{depth}, \\text{min\\_work}, \\text{known}) \\Rightarrow \\text{Keys} \\land \\text{PolicyCheck}(\\text{evidence})$\n5. **Doc comment**: `/// Verifies the record standalone, optionally skipping known header proof checks. Returns the evidence's header keys.`\n\n## Checkpoint Functions\n\n### `checkpoint_at`\n\n1. **Reasoning**: Retrieves a specific `Checkpoint` object for a given height by reading necessary headers from the Midwimble RPC, calculating the cumulative work relative to the chain tip.\n2. **Preconditions**: The `mw` client must be connected and responsive. `height` must be $1 \\le \\text{height} \\le \\text{tip}$. `previous` must be the correct hash of the preceding checkpoint.\n3. **Postconditions**: Returns `Ok(Checkpoint)` representing the state at `height`; returns an error if the height is invalid or chain data is inconsistent.\n4. **Z Notation (informal)**: $\\text{CheckpointAt}(\\text{mw}, h, p) \\Rightarrow C_h$\n5. **Doc comment**: `/// Retrieves the checkpoint for a specific height, calculating cumulative work relative to the current chain tip.`\n\n### `make_checkpoint`\n\n1. **Reasoning**: Creates a robust checkpoint by anchoring it `lag` blocks below the current chain tip, ensuring protection against short reorganizations.\n2. **Preconditions**: The `mw` client must be connected. `lag` must be $\\ge 1$. `previous` must be the hash of the preceding checkpoint.\n3. **Postconditions**: Returns `Ok(Checkpoint)` representing the checkpoint at $\\text{tip} - \\text{lag}$; returns an error if RPC calls fail or chain state is inconsistent.\n4. **Z Notation (informal)**: $\\text{MakeCheckpoint}(\\text{mw}, l, p) \\Rightarrow C_{\\text{tip}-l}$\n5. **Doc comment**: `/// Creates a checkpoint lagged below the tip to resist short reorganizations.`\n\n### `checkpoint_matches_chain`\n\n1. **Reasoning**: Validates that a provided `Checkpoint` accurately describes the state of the Midwimble chain at its recorded height by re-fetching the data from the RPC.\n2. **Preconditions**: The `mw` client must be connected. The input `checkpoint` must be valid.\n3. **Postconditions**: Returns `Ok(())` if the fetched checkpoint matches the input checkpoint; returns an error otherwise, indicating chain inconsistency.\n4. **Z Notation (informal)**: $\\text{MatchesChain}(\\text{mw}, C) \\Rightarrow \\text{FetchCheckpoint}(\\text{mw}, C.\\text{height}) = C$\n5. **Doc comment**: `/// Checks if a given checkpoint accurately describes the Midwimble chain at its recorded height.`\n\n## Anchor Management Functions\n\n### `collect_merged_anchors`\n\n1. **Reasoning**: Processes pending merged-mining anchors, verifying their inclusion in Midstate blocks and confirming sufficient confirmation depth (`depth`). Successful anchors are converted into `AnchorRecord`s and persisted.\n2. **Preconditions**: Both `mw` and `ms` clients must be connected. `store` path must be writable. `pending` list must contain valid `PendingMergedAnchor` structs. `depth` and `min_work` must be valid.\n3. **Postconditions**: Updates the `pending` vector (removing confirmed anchors); returns `Ok(usize)` indicating the count of newly written records; returns an error on critical RPC or file I/O failure.\n4. **Z Notation (informal)**: $\\text{Collect}(\\text{mw}, \\text{ms}, \\text{store}, P, d, w) \\Rightarrow P' \\land \\text{Written} = |\\{p \\in P \\mid \\text{Confirmed}(p, d)\\}|$\n5. **Doc comment**: `/// Converts pending merged-mining anchors into stored AnchorRecords once sufficient Midstate depth is reached.`\n\n### `mine_commit_nonce`\n\n1. **Reasoning**: Implements the Proof-of-Work required for a Midstate Commit transaction: finding a nonce such that the hash of (anchor block hash || commitment || nonce) meets the specified leading zero bit requirement.\n2. **Preconditions**: `anchor_block_hash` and `commitment` must be 32 bytes. `bits` must be $\\le 32$.\n3. **Postconditions**: Returns `Ok(u32)` containing the valid nonce; returns an error if no nonce is found within the search space ($0$ to $2^{32}-1$).\n4. **Z Notation (informal)**: $\\text{MineNonce}(H_a, C, b) \\Rightarrow N \\land \\text{CLZ}(\\text{Hash}(H_a \\| C \\| N)) \\ge b$\n5. **Doc comment**: `/// Mines the commit nonce required by Midstate PoW for a given anchor block hash and commitment.`\n\n### `post_commit`\n\n1. **Reasoning**: Posts a commitment to Midstate via RPC, iteratively increasing the required PoW difficulty if the initial submission is rejected due to insufficient leading zeros, until accepted or difficulty limit is reached.\n2. **Preconditions**: `ms` client must be connected. `commitment` must be 32 bytes. Midstate chain height must be $\\ge 2$.\n3. **Postconditions**: Returns `Ok(u64)` representing the Midstate height at which the commitment was successfully posted; returns an error if posting fails, difficulty increases indefinitely, or chain is too short.\n4. **Z Notation (informal)**: $\\text{PostCommit}(\\text{ms}, C) \\Rightarrow H_{\\text{post}} \\land \\text{Status}(\\text{Commit}) = 2xx$\n5. **Doc comment**: `/// Posts a commitment as a Midstate Commit transaction, iteratively increasing PoW difficulty until acceptance.`\n\n### `find_commit`\n\n1. **Reasoning**: Scans Midstate blocks starting from `from_height` to find the first block containing the specified `commitment`. It returns evidence only if the block has reached the required confirmation `depth`.\n2. **Preconditions**: `ms` client must be connected. `commitment` must be 32 bytes. `from_height` must be $\\le \\text{tip}$. `depth` must be $\\ge 1$.\n3. **Postconditions**: Returns `Ok(Some(evidence))` if found and confirmed; returns `Ok(None)` if found but not yet deep enough, or if not found up to the tip; returns an error on RPC failure.\n4. **Z Notation (informal)**: $\\text{FindCommit}(\\text{ms}, C, h_f, d) \\Rightarrow E \\land \\text{Depth}(E) \\ge d$\n5. **Doc comment**: `/// Searches Midstate blocks for a commitment and returns inclusion evidence once sufficient confirmation depth is reached.`\n\n## File I/O Functions\n\n### `load_records`\n\n1. **Reasoning**: Simple utility to load all `AnchorRecord`s from the JSONL store file, handling non-existence gracefully.\n2. **Preconditions**: `path` must be a valid filesystem path.\n3. **Postconditions**: Returns `Ok(Vec<AnchorRecord>)` containing all records; returns an empty vector if the file does not exist.\n4. **Z Notation (informal)**: $\\text{LoadRecords}(P) \\Rightarrow R$\n5. **Doc comment**: `/// Loads all AnchorRecords from the JSONL store file.`\n\n### `load_records_from`\n\n1. **Reasoning**: Implements robust, incremental reading of the JSONL store, starting from a specified `offset`. It ensures only complete lines are parsed and allows filtering based on a `keep` predicate.\n2. **Preconditions**: `path` must be a valid filesystem path. `offset` must be $\\le \\text{file\\_size}$. `max` must be $\\ge 1$. `keep` must be a callable predicate.\n3. **Postconditions**: Returns `Ok((Vec<AnchorRecord>, u64))` containing records that satisfy `keep` and the new file offset; returns an empty vector and offset 0 if the file cannot be opened.\n4. **Z Notation (informal)**: $\\text{LoadFrom}(P, o, m, k) \\Rightarrow (R, o') \\land R = \\{r \\in P[o..o+m] \\mid k(r)\\}$\n5. **Doc comment**: `/// Reads AnchorRecords incrementally from a specified offset, respecting line completeness and applying a filter.`\n\n### `append_record`\n\n1. **Reasoning**: Atomically appends a serialized `AnchorRecord` to the JSONL store file using append mode.\n2. **Preconditions**: `path` must be a valid filesystem path. `record` must be serializable.\n3. **Postconditions**: Writes the record followed by a newline to the end of the file; returns an error on I/O failure.\n4. **Z Notation (informal)**: $\\text{AppendRecord}(P, r) \\Rightarrow P \\leftarrow P \\| r$\n5. **Doc comment**: `/// Appends a serialized AnchorRecord to the JSONL store file.`\n\n## Orchestration Functions\n\n### `anchor_once`\n\n1. **Reasoning**: Executes a single, complete anchoring round: determines the target checkpoint, posts the commitment, and polls Midstate until the required confirmation depth is met or a timeout occurs.\n2. **Preconditions**: All RPC clients (`mw`, `ms`) must be connected. `store` path must be writable. `lag`, `depth`, and `min_work` must be valid chain parameters. `timeout` must be positive.\n3. **Postconditions**: Returns `Ok(AnchorRecord)` upon successful anchoring; returns a timeout or RPC error otherwise.\n4. **Z Notation (informal)**: $\\text{AnchorOnce}(\\dots) \\Rightarrow R_{\\text{new}} \\land \\text{Depth}(R_{\\text{new}}) \\ge d$\n5. **Doc comment**: `/// Executes one full anchoring round: checkpoint, post commitment, and wait for required Midstate depth.`\n\n### `verify_records`\n\n1. **Reasoning**: Iterates over all stored records, verifying each against three criteria: internal ID consistency, chain state consistency (`checkpoint_matches_chain`), and Midstate evidence validity (including checking the correct anchored payload).\n2. **Preconditions**: `mw` client must be connected. `store` path must be readable. `depth` and `min_work` must be valid.\n3. **Postconditions**: Returns `Ok(Vec<(String, Result<()>)>)` where each tuple contains the record ID and the result of its verification (success or specific error); returns an error if the store cannot be loaded.\n4. **Z Notation (informal)**: $\\text{VerifyRecords}(\\text{mw}, P, d, w) \\Rightarrow \\forall r \\in P: (\\text{ID}(r) = \\text{StoredID}(r)) \\land \\text{MatchesChain}(r) \\land \\text{VerifyEvidence}(r)$\n5. **Doc comment**: `/// Verifies every stored AnchorRecord against Midstate evidence and the local chain state.`"}, {"path": "co_bonds.rs", "module": "(root)", "doc": "## `Entry` struct methods\n\n### `Entry::view`\n1. **Reasoning**: Provides a clean, serializable view of the internal `Entry` state for external consumption (e.g., RPC).\n2. **Preconditions**: The `Entry` must be fully initialized.\n3. **Postconditions**: A `CoBondView` struct is returned containing essential, non-internal state information.\n4. **Z Notation (informal)**: $\\text{view}(e) \\rightarrow v \\mid v.\\text{bond\\_id} = \\text{hex}(e.\\text{coin}.\\text{coin\\_id}())$\n5. **Doc comment**: `/// Returns a public view of the co-bond entry.`\n\n### `Entry::signer`\n1. **Reasoning**: Determines if this specific co-bond is currently ready for the node to sign blocks with, based on its internal phase and stored file data.\n2. **Preconditions**: The `Entry` must be initialized.\n3. **Postconditions**: Returns `Some(CoBond)` if the phase is \"registered\" or \"ready\" and necessary file data exists; otherwise, returns `None`.\n4. **Z Notation (informal)**: $\\text{signer}(e) \\rightarrow c \\mid e.\\text{phase} \\in \\{\\text{\"registered\"}, \\text{\"ready\"}\\} \\land (\\text{phase} = \\text{\"ready\"} \\implies e.\\text{file} \\neq \\text{None})$\n5. **Doc comment**: `/// Returns the CoBond structure used for signing if the entry is ready or registered, otherwise None.`\n\n## `CoBondView` struct\n\n*(No methods requiring formal documentation, serves as a data structure.)*\n\n## `CoBondBook` struct methods\n\n### `CoBondBook::open`\n1. **Reasoning**: Initializes the co-bond book by loading existing state from disk (`co-bonds.json`) and immediately applying this state to the node's signing capabilities.\n2. **Preconditions**: The file path must point to a readable JSON file (or not exist). `started`, `signing`, `feed`, and `info` must be valid, initialized references.\n3. **Postconditions**: A fully initialized `CoBondBook` instance is returned. The internal state (`entries`) is loaded, and the node's signing bond (`signing`) is updated via `apply()`.\n4. **Z Notation (informal)**: $\\text{open}(p, r, s, \\dots) \\rightarrow b \\mid b.\\text{entries} = \\text{load\\_from}(p) \\land \\text{apply}(b)$\n5. **Doc comment**: `/// Opens the co-bond book from disk, loading existing entries and applying them to the node's signing capabilities.`\n\n### `CoBondBook::mining_key`\n1. **Reasoning**: Provides access to the mining key associated with this node's primary bond (`started`).\n2. **Preconditions**: The `CoBondBook` must be initialized.\n3. **Postconditions**: Returns a string representation (hex) of the node's mining key.\n4. **Z Notation (informal)**: $\\text{mining\\_key}(b) \\rightarrow k \\mid k = \\text{hex}(b.\\text{started}.\\text{mining\\_key}())$\n5. **Doc comment**: `/// Returns this node's mining key as a hex string.`\n\n### `CoBondBook::bond_id`\n1. **Reasoning**: Provides access to the bond ID associated with this node's primary bond (`started`).\n2. **Preconditions**: The `CoBondBook` must be initialized.\n3. **Postconditions**: Returns a string representation (hex) of the node's bond ID.\n4. **Z Notation (informal)**: $\\text{bond\\_id}(b) \\rightarrow i \\mid i = \\text{hex}(b.\\text{started}.\\text{bond\\_id})$\n5. **Doc comment**: `/// Returns this node's primary bond ID as a hex string.`\n\n### `CoBondBook::list`\n1. **Reasoning**: Retrieves all co-bonds known to the book, including those loaded from startup and those currently on the chain (via `NodeInfo`).\n2. **Preconditions**: The `CoBondBook` must be initialized. Node state (`info`) must be readable.\n3. **Postconditions**: A vector of `CoBondView` is returned, sorted newest first, containing all known co-bonds.\n4. **Z Notation (informal)**: $\\text{list}(b) \\rightarrow L \\mid L = \\text{view}(\\text{entries}) \\cup \\text{chain\\_bonds}(b.\\text{info})$\n5. **Doc comment**: `/// Lists every co-bond in the book, including those loaded at startup and those currently registered on the chain.`\n\n### `CoBondBook::add`\n1. **Reasoning**: Handles the process of accepting a new coin as a co-bond. This involves validation (script naming, minimum bond requirements), checking existing state, fetching proof from midstate if necessary, and inserting/updating the entry.\n2. **Preconditions**: The `coin` must name this node's mining key; it cannot be this node's own bond; it must meet minimum bond requirements (`registration_min_bond`) and lock duration rules (`BOND_RULES`). If not already known, a proof must be fetchable from the midstate RPC.\n3. **Postconditions**: Returns `Ok((view, true))` if the bond was newly accepted and saved; returns `Ok((view, false))` if it was already known; returns `Err` if any validation or RPC step fails. The book state is updated and saved upon successful insertion.\n4. **Z Notation (informal)**: $\\text{add}(b, c) \\rightarrow \\text{Result}(v, \\text{new}) \\mid (\\text{valid}(c) \\land \\neg \\text{known}(c)) \\implies \\text{save}(b, c) \\land \\text{new} = \\text{true}$\n5. **Doc comment**: `/// Takes a new coin as a co-bond. Validates the coin against bond rules and midstate state. Returns its view and whether it was newly added to the book.`\n\n### `CoBondBook::find`\n1. **Reasoning**: Utility function to quickly locate an existing `Entry` by coin ID without exposing internal state mutation.\n2. **Preconditions**: The `CoBondBook` must be initialized; the provided ID must match a coin in the book.\n3. **Postconditions**: Returns `Some(Entry)` if found, otherwise `None`.\n4. **Z Notation (informal)**: $\\text{find}(b, i) \\rightarrow e \\mid e \\in b.\\text{entries} \\land e.\\text{coin}.\\text{coin\\_id}() = i$\n5. **Doc comment**: `/// Finds an entry in the book matching the given coin ID.`\n\n### `CoBondBook::insert`\n1. **Reasoning**: Adds a new `Entry` to the internal state, ensuring uniqueness, and persists the updated book state to disk.\n2. **Preconditions**: The `Entry` must be valid; the coin ID must not already exist in the book.\n3. **Postconditions**: Returns `Ok(view)` containing the view of the newly inserted entry; returns `Ok(view)` if the entry already existed (idempotent); returns `Err` if saving to disk fails.\n4. **Z Notation (informal)**: $\\text{insert}(b, e) \\rightarrow v \\mid b.\\text{entries}' = b.\\text{entries} \\cup \\{e\\} \\land \\text{save}(b', b.\\text{entries}') \\land v = \\text{view}(e)$\n5. **Doc comment**: `/// Inserts a new entry into the book, saves the state, and returns its view.`\n\n### `CoBondBook::save`\n1. **Reasoning**: Persists the current list of entries to the designated JSON file using atomic write (tmp file + rename) to prevent corruption during crashes.\n2. **Preconditions**: The `entries` slice must be valid; the path must be writable.\n3. **Postconditions**: The book file at `self.path` is updated with the serialized `entries`; returns `Ok(())` on success, or an error otherwise.\n4. **Z Notation (informal)**: $\\text{save}(b, E) \\rightarrow \\text{Ok}() \\mid \\text{file\\_write}(b.\\text{path}, E)$\n5. **Doc comment**: `/// Atomically saves the current list of entries to the book file.`\n\n### `CoBondBook::apply`\n1. **Reasoning**: Synchronizes the internal state (`entries`) with the external signing capabilities (`signing` and `feed`). It updates the node's primary bond structure by adding ready/registered co-bonds and pushing necessary headers to the relay feed.\n2. **Preconditions**: The `CoBondBook` must be initialized; locks on `entries`, `feed`, and `signing` must not be poisoned.\n3. **Postconditions**: The `signing` bond is updated to include all eligible co-bonds; relevant midstate headers are pushed to the `feed`.\n4. **Z Notation (informal)**: $\\text{apply}(b) \\rightarrow b' \\mid b'.\\text{signing} = \\text{update\\_with\\_eligible}(b.\\text{entries}) \\land b'.\\text{feed} = \\text{push\\_headers}(b.\\text{entries})$\n5. **Doc comment**: `/// Updates the node's signing bond and relay feed based on the current state of the co-bond book.`\n\n### `CoBondBook::tick`\n1. **Reasoning**: The main operational loop function. It checks chain state changes (registration/expiration), advances the longest waiting co-bond by performing a single registration step (reading midstate RPC), and persists changes.\n2. **Preconditions**: The `CoBondBook` must be initialized; node state (`info`) and midstate RPC must be available if a \"waiting\" step is required.\n3. **Postconditions**: The internal state (`entries`) is updated based on chain status or successful/failed registration steps; the book is saved if any change occurred; `apply()` is called to update signing capabilities.\n4. **Z Notation (informal)**: $\\text{tick}(b) \\rightarrow b' \\mid b'.\\text{entries} = \\text{update\\_chain\\_status}(b.\\text{entries}) \\cup \\text{execute\\_step}(b.\\text{entries}) \\land \\text{save}(b') \\land \\text{apply}(b')$\n5. **Doc comment**: `/// Performs one operational tick: checks chain status, advances the longest waiting co-bond by one registration step, and persists changes.`\n\n## Helper Functions\n\n### `retry_after`\n1. **Reasoning**: Defines the backoff delay based on the current phase of a co-bond, preventing rapid, unnecessary RPC polling.\n2. **Preconditions**: Input `phase` must be one of the defined string literals (\"waiting\", \"burying\", etc.).\n3. **Postconditions**: Returns the required delay in seconds (`u64`).\n4. **Z Notation (informal)**: $\\text{retry\\_after}(p) \\rightarrow t \\mid p = \\text{\"waiting\"} \\implies t = 300$\n5. **Doc comment**: `/// Calculates the required delay (in seconds) before retrying a co-bond based on its current phase.`\n\n### `register_step`\n1. **Reasoning**: Implements the core logic of advancing a co-bond's registration state: fetching proofs, gathering midstate headers above the proof, calculating accumulated work, and determining the next phase (\"burying\", \"ready\", or \"registered\").\n2. **Preconditions**: `coin` must be valid; `midstate` RPC must be functional; the proof must be anchored above the midstate block anchor.\n3. **Postconditions**: Returns `Ok(Step)` containing the updated `BondFile`, new phase, progress, and note; returns `Err` if RPC fails or bond rules are violated (e.g., insufficient work).\n4. **Z Notation (informal)**: $\\text{register\\_step}(c, h, m, t, r) \\rightarrow s \\mid s.\\text{file} = \\text{update\\_file}(h, m) \\land s.\\text{phase} = \\text{determine\\_phase}(\\text{work}, \\text{headers})$\n5. **Doc comment**: `/// Executes one step of the midwimble bond registration process, fetching proofs and gathering required midstate headers.`"}, {"path": "explorer.rs", "module": "(root)", "doc": "## Explorer Index Management\n\n### `ExplorerIndex::add`\n1. **Reasoning**: This method updates the in-memory index (`ExplorerIndex`) with all relevant metadata from a newly processed block (`Batch`). It is crucial for maintaining fast lookups across the entire chain history.\n2. **Preconditions**: The index must be mutable and locked (i.e., called while holding the `Mutex` lock). The input `Batch` must be a valid, fully processed block.\n3. **Postconditions**: All commitments (outputs, inputs, kernels, registrations) from the block are recorded in the respective hash maps, linked to the block's height. The `BlockLog` is pushed onto the `log` deque, and `self.next` is incremented. If the log exceeds `REORG_LOG`, the oldest entry is popped.\n4. **Z Notation (informal)**: $\\forall b \\in \\text{Batch}, h = \\text{height}(b) \\bullet \\text{Index}' = \\text{Index} \\cup \\{ (h, b) \\} \\land \\text{next}' = h+1$\n5. **Doc comment**: Updates the internal index with metadata from a new block, tracking commitments and history for reorg unwinding.\n\n### `ExplorerIndex::unwind`\n1. **Reasoning**: This method handles chain reorganizations (reorgs). When a block is replaced by a newer chain tip, the index must be rolled back to remove all data associated with the discarded blocks.\n2. **Preconditions**: The index must be mutable and locked. The `log` deque must not be empty.\n3. **Postconditions**: The most recent `BlockLog` is popped from `self.log`. All commitments (spent, created, kernels, registered, hash) associated with that block's height are removed from the respective maps. The `next` pointer is decremented to reflect the new chain tip height. Returns `true` if an entry was unwound, `false` otherwise.\n4. **Z Notation (informal)**: $\\text{log} \\ne \\emptyset \\bullet \\text{log}' = \\text{pop\\_back}(\\text{log}) \\land \\text{Index}' = \\text{Index} \\setminus \\text{data}(\\text{log}') \\land \\text{next}' = \\text{height}(\\text{log}')$\n5. **Doc comment**: Rolls back the index by removing the data of the newest block, used during chain reorganization (reorg). Returns `true` if history was unwound.\n\n### `ExplorerIndex::sync`\n1. **Reasoning**: Ensures the in-memory index is consistent with the persistent storage on the node. It first unwinds blocks that were replaced by a reorg, then loads and indexes all new blocks up to the current chain tip.\n2. **Preconditions**: The index must be mutable and locked. The node must have accessible storage (`NodeHandle`).\n3. **Postconditions**: `self.next` is updated to match the height of the current chain tip. The index contains accurate metadata for all blocks from height 0 up to `node.state().height`. Returns `Ok(())` on success, or an error if storage loading fails.\n4. **Z Notation (informal)**: $\\text{next} \\le \\text{tip} \\bullet \\text{Index}' = \\text{rebuild}(\\text{Storage}[0..\\text{tip}]) \\land \\text{next}' = \\text{tip}+1$\n5. **Doc comment**: Synchronizes the in-memory index with the node's persistent storage, handling reorg unwinding and indexing new blocks up to the chain tip.\n\n## Public API Endpoints\n\n### `blocks`\n1. **Reasoning**: Provides a paginated list of block summaries, allowing clients to view recent chain history efficiently without loading full block data.\n2. **Preconditions**: The `SharedIndex` must be available and synchronized via `with_index`. The query parameters (`before`, `count`) must be valid.\n3. **Postconditions**: Returns a JSON object containing the current `tip` height and an array of `block` summary objects, ordered newest first, covering the requested range.\n4. **Z Notation (informal)**: $\\text{Query} \\in \\text{ValidRange} \\bullet \\text{Result} = \\{ \\text{tip}: H, \\text{blocks}: \\text{Summary}(H-C..H) \\}$\n5. **Doc comment**: Retrieves block summaries for a specified range, ordered newest first.\n\n### `block`\n1. **Reasoning**: Provides the complete, detailed data for a single block, accessible by height or hash. This is the primary endpoint for deep block inspection.\n2. **Preconditions**: The `SharedIndex` must be available and synchronized via `with_index`. The provided `id` (height or hash) must correspond to an existing block below the current chain tip.\n3. **Postconditions**: Returns a JSON object containing all block metadata (inputs, outputs, kernels, miner details, burial status, etc.) for the specified block.\n4. **Z Notation (informal)**: $\\text{ID} \\in \\text{Hashes} \\land \\text{Height}(\\text{ID}) < \\text{Tip} \\bullet \\text{Result} = \\text{FullBlockData}(\\text{Height}(\\text{ID}))$\n5. **Doc comment**: Retrieves a single block in full detail, identifiable by height or hash.\n\n### `output`\n1. **Reasoning**: Tracks the lifecycle of a specific output commitment—from its creation block to its spending block. This is vital for tracing funds and determining maturity.\n2. **Preconditions**: The `SharedIndex` must be available and synchronized via `with_index`. The provided `commitment` must exist in the index's `created` map.\n3. **Postconditions**: Returns a JSON object detailing the output, including its creation height/hash, whether it was in the coinbase, its spending height/hash (if spent), and its confirmation burial status.\n4. **Z Notation (informal)**: $\\text{Commitment} \\in \\text{Created} \\bullet \\text{Result} = \\{ \\text{OutputData}, \\text{CreatedHeight}, \\text{SpentHeight} \\}$\n5. **Doc comment**: Provides the full lifecycle of a specific output commitment, including creation and spending block details.\n\n### `kernel`\n1. **Reasoning**: Allows inspection of kernel transactions, which are used for fee payment and balancing in Midwimble.\n2. **Preconditions**: The `SharedIndex` must be available and synchronized via `with_index`. The provided `excess` must exist in the index's `kernels` map.\n3. **Postconditions**: Returns a JSON object detailing the kernel (fee, excess, features) and the block that contains it, along with its burial status.\n4. **Z Notation (informal)**: $\\text{Excess} \\in \\text{Kernels} \\bullet \\text{Result} = \\{ \\text{KernelData}, \\text{BlockData}(\\text{Height}(\\text{Excess})) \\}$\n5. **Doc comment**: Retrieves details for a specific kernel transaction and the block it resides in.\n\n### `bonds`\n1. **Reasoning**: Provides a global view of all registered bonds, their terms, and their current participation in the fork-choice window.\n2. **Preconditions**: The `SharedIndex` must be available and synchronized via `with_index`. The current time (`unix_now`) is used to calculate eligibility and window usage.\n3. **Postconditions**: Returns a JSON object containing an array of all bond details (sorted by `window_signed`) and a separate `window` summary detailing the current state of the CAP window (size, filled count, cap).\n4. **Z Notation (informal)**: $\\text{State} \\bullet \\text{Result} = \\{ \\text{Bonds}: \\text{List}(\\text{BondData}), \\text{Window}: \\text{WindowSummary}(\\text{State}, \\text{Now}) \\}$\n5. **Doc comment**: Lists all registered bonds, along with a summary of the current fork-choice window state.\n\n### `bond`\n1. **Reasoning**: Provides detailed information for a single bond, including its terms, quota usage, and specific blocks it has signed within the recent window. It also includes burn figures.\n2. **Preconditions**: The `SharedIndex` must be available and synchronized via `with_index`. The provided `id` must correspond to an existing bond or a registered ID in the index.\n3. **Postconditions**: Returns a JSON object containing the bond's terms, its quota usage (`window_signed`), a list of recent signed block heights, and the calculated burn figures (`explorer::burn`).\n4. **Z Notation (informal)**: $\\text{ID} \\in \\text{Bonds} \\lor \\text{Registered} \\bullet \\text{Result} = \\{ \\text{BondData}(\\text{ID}), \\text{WindowSummary}, \\text{BurnData}(\\text{ID}) \\}$\n5. **Doc comment**: Retrieves detailed information for a single bond, including its quota usage and burn figures.\n\n### `mempool`\n1. **Reasoning**: Exposes the current mempool contents, allowing users to monitor pending transactions, typically sorted by fee rate (miner priority).\n2. **Preconditions**: The `NodeHandle` must be valid and capable of querying the mempool.\n3. **Postconditions**: Returns a JSON object containing total count, total weight, total fees, and a truncated list (up to 200) of transactions, sorted by descending fee rate.\n4. **Z Notation (informal)**: $\\text{Mempool} \\bullet \\text{Result} = \\{ \\text{Count}, \\text{Weight}, \\text{Fees}, \\text{List}(\\text{TxData})_{\\text{SortedByFeeRate}} \\}$\n5. **Doc comment**: Lists the most valuable transactions currently in the mempool, sorted by fee rate.\n\n### `network`\n1. **Reasoning**: Provides transparency into the node's network state (peers, listening addresses) and its internal Dandelion++ routing configuration.\n2. **Preconditions**: The `NodeHandle` must be valid.\n3. **Postconditions**: Returns a JSON object detailing the node's peer IDs, connection status (inbound/outbound), listening addresses, and Dandelion++ parameters (fluff percentage, timeouts).\n4. **Z Notation (informal)**: $\\text{Node} \\bullet \\text{Result} = \\{ \\text{PeerList}, \\text{DandelionConfig}, \\text{Stats} \\}$\n5. **Doc comment**: Reports the node's current network view, including peer details and Dandelion++ routing configuration.\n\n### `search`\n1. **Reasoning**: Provides a unified search interface, allowing clients to query by height (numeric) or by commitment/hash (hexadecimal) across multiple index types (block, output, kernel, bond).\n2. **Preconditions**: The `SharedIndex` must be available and synchronized via `with_index`. The input `q` must be either a valid numeric height or a 32-byte hex string.\n3. **Postconditions**: Returns a JSON object identifying the type (`kind`) and the ID of the entity found (e.g., `{\"kind\": \"block\", \"id\": \"123\"}`). Returns `NOT_FOUND` if no match is found or if the input format is invalid.\n4. **Z Notation (informal)**: $\\text{Q} \\in \\text{Height} \\lor \\text{Hash} \\bullet \\text{Result} = \\{ \\text{Kind}(\\text{Q}), \\text{ID}(\\text{Q}) \\}$\n5. **Doc comment**: Searches the index for an entity (height, hash, commitment, kernel excess, or bond ID) and returns its type and ID.\n\n### `events`\n1. **Reasoning**: Implements Server-Sent Events (SSE) to provide real-time updates on new block application without requiring continuous polling.\n2. **Preconditions**: The `NodeHandle` must be valid.\n3. **Postconditions**: Returns an `Sse` stream. For every new block applied by the node, it emits a `\"block\"` event containing the full summary JSON of that block.\n4. **Z Notation (informal)**: $\\text{Node} \\bullet \\text{Stream} = \\text{Event}(\\text{\"block\"}, \\text{Summary}(\\text{NewBlock}))$\n5. **Doc comment**: Streams block summaries as Server-Sent Events (SSE) whenever a new block is applied to the chain.\n\n### `chart_difficulty`\n1. **Reasoning**: Provides historical difficulty data points required for rendering charts, limiting the scope to the last 1000 blocks for performance.\n2. **Preconditions**: The `NodeHandle` must be valid. The query count must be between 1 and 1000.\n3. **Postconditions**: Returns a JSON object containing the current `tip` height and an array of points, each detailing the block's height, timestamp, and calculated difficulty bits.\n4. **Z Notation (informal)**: $\\text{Count} \\le 1000 \\bullet \\text{Result} = \\{ \\text{Tip}: H, \\text{Points}: \\text{Difficulty}(\\text{Block}(H-C..H)) \\}$\n5. **Doc comment**: Retrieves historical difficulty data points for chart rendering, covering the last specified number of blocks (max 1000).\n\n### `chart_emission`\n1. **Reasoning**: Provides time-series data on coin emission (scheduled vs. minted vs. withheld) derived from the burn tracker index.\n2. **Preconditions**: The `SharedIndex` must be available and synchronized via `with_index`.\n3. **Postconditions**: Returns the emission series data calculated by `explorer::burn`, showing scheduled, minted, and withheld amounts over time since the mainnet switch.\n4. **Z Notation (informal)**: $\\text{Index} \\bullet \\text{Result} = \\text{EmissionSeries}(\\text{BurnIndex})$\n5. **Doc comment**: Provides the emission time series data from the burn tracker, showing scheduled, minted, and withheld amounts per day.\n\n### `anchors`\n1. **Reasoning**: Exposes information about checkpoint anchors, which define chain finality and provide historical context for midstate posting.\n2. **Preconditions**: The `NodeHandle` must be valid.\n3. **Postconditions**: Returns a JSON object containing an array of recent checkpoint records (height, anchor ID, depth, confirmation status) and the current chain finality status (floor height, checkpoint ID).\n4. **Z Notation (informal)**: $\\text{Node} \\bullet \\text{Result} = \\{ \\text{Checkpoints}: \\text{List}(\\text{AnchorData}), \\text{Finality}: \\text{FinalityStatus} \\}$\n5. **Doc comment**: Lists recent anchored checkpoints and the current chain finality status.\n\n### `explorer_relay`\n1. **Reasoning**: Reports the state of the midstate relay window, crucial for understanding how recent headers are tracked and confirmed.\n2. **Preconditions**: The `NodeHandle` must be valid.\n3. **Postconditions**: Returns a JSON object detailing the tip height/hash, the root height, and the size/count of the current relay window.\n4. **Z Notation (informal)**: $\\text{Node} \\bullet \\text{Result} = \\{ \\text{TipHeight}, \\text{TipHash}, \\text{RootHeight}, \\text{WindowSize} \\}$\n5. **Doc comment**: Reports the state of the midstate relay window, including tip and root heights and window size.\n\n### `api`\n1. **Reasoning**: Serves a static discovery document listing all available explorer endpoints and their descriptions, aiding client integration.\n2. **Preconditions**: None.\n3. **Postconditions**: Returns a JSON object mapping endpoint paths (e.g., `/blocks`) to concise descriptions.\n4. **Z Notation (informal)**: $\\text{Input} = \\emptyset \\bullet \\text{Result} = \\{ \\text{Endpoints}: \\text{Map}(\\text{Path} \\to \\text{Description}) \\}$\n5. **Doc comment**: A static JSON document listing all available explorer endpoints and their purposes."}, {"path": "finality.rs", "module": "(root)", "doc": "## `FinalityConfig`\n\n**Reasoning**: Defines the policy parameters governing how a node determines checkpoint finality, including required evidence depth (`anchor_depth`), reorg safety depth (`finality_depth`), and minimum computational work (`min_work`).\n**Preconditions**: None.\n**Postconditions**: A configuration struct is initialized with network-specific finality rules.\n**Z Notation (informal)**: $\\text{Config} \\triangleq \\{ \\text{anchor\\_depth}: \\mathbb{N}, \\text{finality\\_depth}: \\mathbb{N}^+, \\text{min\\_work}: \\mathbb{N}_{\\ge 0}, \\dots \\}$\n**Doc comment**: Configuration parameters defining the node's finality policy (e.g., required anchor depth, reorg safety depth, minimum work).\n\n## `Default` for `FinalityConfig`\n\n**Reasoning**: Provides a sensible, network-default set of parameters for quick initialization.\n**Preconditions**: None.\n**Postconditions**: A `FinalityConfig` instance is created using predefined default values.\n**Z Notation (informal)**: $\\text{DefaultConfig} \\triangleq \\{ \\text{anchor\\_depth}: 1000, \\text{finality\\_depth}: 100, \\dots \\}$\n**Doc comment**: Implements the default finality configuration based on network standards.\n\n## `Standing` Enum\n\n**Reasoning**: Categorizes the relationship between a checkpoint and the current node's chain (e.g., Final, Pending, Conflict), which is crucial for determining if a checkpoint contributes to finality or prevents it.\n**Preconditions**: None.\n**Postconditions**: A state representing the checkpoint's status relative to the local chain is returned.\n**Z Notation (informal)**: $\\text{Standing} \\in \\{ \\text{Final}, \\text{Pending}, \\text{Conflict}, \\text{Ahead} \\}$\n**Doc comment**: Represents how a given anchor record relates to this node's current chain state.\n\n## `RecordFault` Enum\n\n**Reasoning**: Provides structured error reporting for why an `AnchorRecord` failed validation, distinguishing between policy violations (e.g., wrong network) and evidence forgery (e.g., invalid PoW).\n**Preconditions**: None.\n**Postconditions**: A specific, categorized reason for validation failure is returned.\n**Z Notation (informal)**: $\\text{Fault} \\in \\{ \\text{Policy}(\\text{Error}), \\text{Invalid}(\\text{Error}) \\}$\n**Doc comment**: Enumerates the reasons an anchor record failed validation, distinguishing policy issues from evidence forgery.\n\n## `precheck` function\n\n**Reasoning**: Performs cheap, local checks on an `AnchorRecord` (network ID, stored ID match, basic policy adherence) before expensive cryptographic verification. It also trims the evidence to the required depth.\n**Preconditions**: `record` is a mutable reference to a valid `AnchorRecord`. `cfg` is a valid `FinalityConfig`.\n**Postconditions**: If successful, the record's evidence is trimmed to `cfg.anchor_depth`, and `Ok(())` is returned. If validation fails, `Err(RecordFault)` is returned.\n**Z Notation (informal)**: $\\text{precheck}(\\text{record}, \\text{cfg}) \\rightarrow (\\text{Success} \\land \\text{EvidenceTrimmed}) \\lor \\text{Fault}$\n**Doc comment**: Performs cheap policy checks on an anchor record, ensuring network compatibility and evidence depth, and trims the evidence.\n\n## `verify_evidence` function\n\n**Reasoning**: Executes the expensive cryptographic verification of all proof-of-work headers within the record's evidence against previously verified links (`CheckedLinks`). This must be run off the main event loop.\n**Preconditions**: `record` passed `precheck`. `cfg` is valid. `checked` contains all previously verified link keys.\n**Postconditions**: If successful, all newly verified keys are added to `checked`, and `Ok(())` is returned. If evidence is forged or invalid, `Err(RecordFault::Invalid)` is returned.\n**Z Notation (informal)**: $\\text{verify\\_evidence}(\\text{record}, \\text{cfg}, \\text{checked}) \\rightarrow (\\text{CheckedKeys} \\subseteq \\text{checked}) \\lor \\text{Invalid}$\n**Doc comment**: Performs the expensive cryptographic verification of all unique proof-of-work headers in the record's evidence.\n\n## `CheckedLinks` struct\n\n**Reasoning**: Maintains a bounded set of cryptographic keys (proof-of-work hashes) that this node has verified, preventing redundant verification for subsequent, closely related anchors.\n**Preconditions**: None.\n**Postconditions**: The internal `LinkSet` maintains a maximum size (`CHECKED_LINKS`), dropping the oldest verified keys when capacity is exceeded.\n**Z Notation (informal)**: $\\text{CheckedLinks} \\triangleq \\{ \\text{keys}: \\text{Set}[H], \\text{order}: \\text{Deque}[H] \\mid |\\text{keys}| \\le \\text{CHECKED\\_LINKS} \\}$\n**Doc comment**: Stores a bounded set of proof-of-work keys verified across accepted anchor evidence.\n\n## `FinalityTracker` struct\n\n**Reasoning**: The core state machine for tracking checkpoint finality. It manages stored records, tracks finalized checkpoints, maintains the current chain floor, and handles eviction/pruning based on policy.\n**Preconditions**: Initialized with a valid `FinalityConfig` and initial `FinalityInfo`.\n**Postconditions**: Holds the complete state of known and finalized anchors relative to the node's chain.\n**Z Notation (informal)**: $\\text{Tracker} \\triangleq \\{ \\text{cfg}: \\text{Config}, \\text{records}: \\text{Map}[ID \\to \\text{Record}], \\text{finalized}: \\text{List}[\\text{Height}, ID], \\dots \\}$\n**Doc comment**: Manages the state of anchor records, tracking known checkpoints, finalized heights, and enforcing record limits.\n\n## `FinalityTracker::new`\n\n**Reasoning**: Initializes the tracker state based on existing information (`FinalityInfo`), setting the initial floor and tip.\n**Preconditions**: `cfg` is valid. `info` contains the current state (floor, checkpoint ID).\n**Postconditions**: A new `FinalityTracker` instance is created with the initial floor and tip set from `info`.\n**Z Notation (informal)**: $\\text{new}(\\text{cfg}, \\text{info}) \\rightarrow \\text{Tracker} \\text{ where } \\text{floor} = \\text{info.floor}$\n**Doc comment**: Creates a new FinalityTracker instance, initializing the floor and tip from existing finality information.\n\n## `FinalityTracker::add`\n\n**Reasoning**: Provides a synchronous path for testing or tools to verify a record on the caller's thread. It performs precheck, expensive verification, and then inserts the verified record.\n**Preconditions**: `record` is valid. `cfg` is valid. The node must be prepared to handle the computational cost.\n**Postconditions**: If successful, the record is inserted via `insert_verified`, and `Ok(true)` (if new) or `Ok(false)` (if known) is returned. If validation fails, `Err(anyhow::Error)` is returned.\n**Z Notation (informal)**: $\\text{add}(\\text{record}) \\rightarrow (\\text{RecordAdded} \\land \\text{Verified}) \\lor \\text{Fault}$\n**Doc comment**: Verifies a record synchronously on the caller's thread (for testing/tools) and inserts it if valid.\n\n## `FinalityTracker::insert_verified`\n\n**Reasoning**: Handles the insertion of a record whose evidence has already been verified externally. It ensures uniqueness and triggers eviction to maintain the bounded record set.\n**Preconditions**: `record` is guaranteed to have passed external verification (i.e., `precheck` and `verify_evidence`).\n**Postconditions**: If the record is new, it is inserted into `self.records`, `evict()` is called, and `true` is returned. Otherwise, `false` is returned.\n**Z Notation (informal)**: $\\text{insert\\_verified}(\\text{record}) \\rightarrow (\\text{RecordAdded} \\land \\text{EvictionOccurs}) \\lor \\text{False}$\n**Doc comment**: Inserts a record whose evidence has been externally verified, triggering eviction if the limit is exceeded.\n\n## `FinalityTracker::evict`\n\n**Reasoning**: Implements the pruning policy: dropping records beyond `MAX_RECORDS`. Priority for eviction is given to records furthest beyond the current tip, followed by the lowest height, while protecting finalized and retained checkpoints.\n**Preconditions**: `self.records.len() > MAX_RECORDS`.\n**Postconditions**: The number of records in `self.records` is reduced to at most `MAX_RECORDS`, respecting the retention policy.\n**Z Notation (informal)**: $\\text{evict}(\\text{Tracker}) \\rightarrow |\\text{records}| \\le \\text{MAX\\_RECORDS} \\land (\\text{Finalized} \\subseteq \\text{records})$\n**Doc comment**: Prunes records exceeding `MAX_RECORDS`, prioritizing eviction of records furthest beyond the tip, while protecting finalized and retained checkpoints.\n\n## `FinalityTracker::standing`\n\n**Reasoning**: Determines the precise relationship (`Standing`) between a checkpoint and the current chain state by checking header hashes, state roots, cumulative work, and confirmation depth against local storage.\n**Preconditions**: `record` is valid. `storage` contains necessary chain history. `state` provides the current tip height.\n**Postconditions**: Returns `Ok(Standing)` indicating if the checkpoint is Final, Pending, Conflict, or Ahead.\n**Z Notation (informal)**: $\\text{standing}(\\text{record}, \\text{storage}, \\text{state}) \\rightarrow \\text{Standing}$\n**Doc comment**: Determines how a checkpoint relates to this node's chain, checking for conflicts, pending status, and finality depth.\n\n## `FinalityTracker::refresh`\n\n**Reasoning**: The primary state update function. It recalculates the current floor based on all known records, checks for conflicting anchors, prunes stale records below the floor, updates the finalized list, and returns a new `FinalityInfo` if the floor has risen.\n**Preconditions**: `storage` contains sufficient chain history. `state` provides the current tip height.\n**Postconditions**: `self.tip` is updated to `state.height`. Stale records are evicted. If a new finality height is found, `self.floor` is updated, and `Ok(Some(FinalityInfo))` is returned; otherwise, `Ok(None)`.\n**Z Notation (informal)**: $\\text{refresh}(\\text{storage}, \\text{state}) \\rightarrow (\\text{FloorUpdated} \\land \\text{RecordsPruned}) \\lor \\text{None}$\n**Doc comment**: Recalculates the finality floor based on all known records, prunes stale checkpoints, and updates the node's `FinalityInfo` if finality has advanced."}, {"path": "lib.rs", "module": "(root)", "doc": "## Crate Level Documentation (`midwimble`)\n\n**Reasoning**: This crate implements the core logic for MimbleWimble transactions within the context of a larger system (`midstate`), specifically focusing on networking and consensus mechanisms while enforcing receiver-only spend authority. It separates pure cryptographic/consensus logic (`core`) from I/O-heavy node functionality (feature `node`).\n\n**Preconditions**: The user must have a Rust environment configured. If using node features, the `node` feature flag must be enabled during compilation.\n\n**Postconditions**: A compiled library capable of performing MimbleWimble transaction validation and consensus logic, optionally integrated with full node networking and state management.\n\n**Z Notation (informal)**:\n$$\\text{midwimble} \\triangleq \\text{CoreLogic} \\land (\\text{NodeFeatures} \\implies \\text{NetworkIntegration})$$\n\n**Doc comment**:\n```rust\n//! midwimble: midstate's networking and consensus carrying Pluribit-style\n//! MimbleWimble transactions, with receiver-only spend authority.\n//!\n//! * [`core`]: consensus rules and cryptography (no I/O; always built).\n//! * `node` feature (default): libp2p networking, storage, mempool, sync,\n//!   miner, wallet, RPC.\n```\n\n***\n\n## Module Documentation (`core`)\n\n**Reasoning**: This module contains the foundational, pure logic of the system—cryptography, consensus rules, and transaction validation. It is designed to be dependency-free regarding I/O, ensuring deterministic behavior and testability.\n\n**Preconditions**: None (Always available).\n\n**Postconditions**: Valid MimbleWimble transactions can be constructed, validated, and consensus rules applied without external state or I/O interaction.\n\n**Z Notation (informal)**:\n$$\\forall t \\in \\text{Transaction}: \\text{Validate}(t) \\implies \\text{CoreRulesSatisfied}(t)$$\n\n**Doc comment**:\n```rust\n/// Core consensus rules and cryptography for MimbleWimble transactions.\n/// This module is pure, containing no I/O operations.\npub mod core;\n```\n\n***\n\n## Module Documentation (Conditional `node` Modules)\n\n*(Note: Since these are modules and not functions, the documentation describes their role within the full node implementation.)*\n\n**Reasoning**: These modules implement the necessary infrastructure for a decentralized network node (I/O, networking, state persistence, user interaction). They rely on the pure logic provided by `core`.\n\n**Preconditions**: The `node` feature must be enabled. The `core` module must be available.\n\n**Postconditions**: A fully functional, networked node capable of synchronization, transaction processing, mining, and RPC interaction is available.\n\n**Z Notation (informal)**:\n$$\\text{NodeSystem} \\triangleq \\text{CoreLogic} \\land \\text{Network}(\\text{libp2p}) \\land \\text{Storage} \\land \\text{Consensus}$$\n\n**Doc comment**:\n```rust\n/// Modules providing full node functionality, including networking, storage,\n/// mempool management, mining, and RPC interfaces. Requires the `node` feature.\n#[cfg(feature = \"node\")]\npub mod anchor; // (Placeholder for specific module role)\n// ... [and so on for all other conditional modules]\n#[cfg(feature = \"node\")]\npub mod wallet;\n```\n\n*(Self-Correction Note: Due to the sheer number of conditional modules, a single representative doc comment covering the conditional nature is provided, as detailed individual documentation for each module would require knowledge of its internal API.)*"}, {"path": "link.rs", "module": "(root)", "doc": "## `rehost`\n\n**Reasoning**: This function standardizes the host component of a multiaddr URI. Since nodes typically bind to `0.0.0.0`, the advertised address is not directly dialable. It replaces the generic host placeholder with a specific, reachable host provided by the client (e.g., from an HTTP `Host` header), while preserving the rest of the complex multiaddr structure (UDP port, WebRTC, P2P identifiers).\n\n**Preconditions**:\n1. `addr` must be a valid multiaddr string starting with `/ip4/`, `/ip6/`, or `/dns4/` (or similar prefixes that allow stripping the initial `/`).\n2. `host` must be a syntactically valid IP address (IPv4, IPv6) or a resolvable hostname.\n\n**Postconditions**:\n1. If successful, a new multiaddr string is returned where the host component is replaced by `host`, and the protocol (`ip4`/`ip6`/`dns4`) is correctly inferred from `host`.\n2. If `addr` does not start with `/`, or if parsing fails, `None` is returned.\n\n**Z Notation (informal)**:\n$$\\exists \\text{ new\\_addr} : \\text{new\\_addr} = \\text{rehost}(\\text{addr}, \\text{host}) \\land \\text{Protocol}(\\text{new\\_addr}) = \\text{InferredProtocol}(\\text{host}) \\land \\text{Suffix}(\\text{new\\_addr}) = \\text{Suffix}(\\text{addr})$$\n\n**Doc comment**:\n```rust\n/// Rewrites a multiaddr's host to a specific, reachable host, inferring the protocol (ip4/ip6/dns4) from the provided host string.\npub fn rehost(addr: &str, host: &str) -> Option<String> { /* ... */ }\n```\n\n## `node_link_uri`\n\n**Reasoning**: This function constructs the standardized `midwimble:node?...` URI required by the web wallet for linking a node. It ensures that all provided addresses are included as query parameters (`a=...`) and optionally appends `follow=1` if the user intends to set this node as their primary connection.\n\n**Preconditions**:\n1. `addrs` must be a slice of valid, rehosted multiaddr strings.\n2. `follow` must be a boolean indicating whether the node should be marked as primary.\n\n**Postconditions**:\n1. A complete and correctly formatted `midwimble:node?` URI string is returned.\n2. All elements in `addrs` are present as `a=` query parameters.\n3. If `follow` is true, `&follow=1` is appended to the query string.\n\n**Z Notation (informal)**:\n$$\\text{uri} = \\text{\"midwimble:node?\"} \\oplus (\\forall a \\in \\text{addrs}: \\text{\"a=\"} \\oplus a) \\oplus (\\text{follow} \\implies \\text{\"\\&follow=1\"})$$\n\n**Doc comment**:\n```rust\n/// Constructs the standardized `midwimble:node?a=...&follow=1` URI for linking one or more nodes.\npub fn node_link_uri(addrs: &[String], follow: bool) -> String { /* ... */ }\n```\n\n## `host_from_header`\n\n**Reasoning**: When a client connects via HTTP, the hostname is provided in the `Host` header. This header may contain port numbers (e.g., `example.com:9434`) or IPv6 literals enclosed in brackets (e.g., `[::1]:9434`). This function parses the header to extract *only* the clean hostname/IP, stripping ports and brackets, which is necessary for constructing a valid multiaddr URI host component.\n\n**Preconditions**:\n1. `host_header` must be a string slice representing the value of an HTTP `Host` header.\n\n**Postconditions**:\n1. If `host_header` is empty or only whitespace, `None` is returned.\n2. Otherwise, an `Option<String>` containing the clean hostname/IP (without port or brackets) is returned.\n\n**Z Notation (informal)**:\n$$\\text{host} = \\text{trim}(\\text{host\\_header}) \\land (\\text{host} \\ne \\epsilon) \\implies \\text{result} = \\text{StripPortAndBrackets}(\\text{host})$$\n\n**Doc comment**:\n```rust\n/// Extracts the clean hostname or IP from an HTTP Host header, stripping port numbers and IPv6 brackets.\npub fn host_from_header(host_header: &str) -> Option<String> { /* ... */ }\n```"}, {"path": "mempool.rs", "module": "(root)", "doc": "## `Entry`\n\n### Reasoning\nThis struct encapsulates a single transaction within the mempool, storing not just the transaction itself but also metadata crucial for pool management, such as fee, weight, and arrival time. This allows for efficient fee-rate based eviction policies.\n\n### Preconditions\n* The `Transaction` must be validly constructed.\n\n### Postconditions\n* An `Entry` object is created containing all necessary data for rate calculation and pool tracking.\n\n### Z Notation (informal)\n$$ \\text{Entry} \\triangleq \\{ \\text{tx}: \\text{Transaction}, \\text{fee}: \\mathbb{N}, \\text{weight}: \\mathbb{N}, \\text{received}: \\text{Time} \\} $$\n\n### Doc comment\n```rust\n/// Internal representation of a transaction within the mempool, including fee and weight metadata.\nstruct Entry { ... }\n```\n\n## `Entry::rate`\n\n### Reasoning\nCalculates the effective fee rate (fee per unit of weight). This metric is essential for implementing the bounded mempool size constraint by prioritizing transactions with higher fee rates during eviction.\n\n### Preconditions\n* `self.weight` must be non-negative.\n\n### Postconditions\n* Returns a `u128` representing the scaled fee rate, ensuring division by zero is prevented (by using `max(1)`).\n\n### Z Notation (informal)\n$$ \\text{rate}(\\text{e}) = \\lfloor (\\text{e}.\\text{fee} \\cdot 2^{16}) / \\max(1, \\text{e}.\\text{weight}) \\rfloor $$\n\n### Doc comment\n```rust\n/// Fee per weight unit scaled by 2^16, for ordering without floats.\nfn rate(&self) -> u128 { ... }\n```\n\n## `Mempool`\n\n### Reasoning\nThe `Mempool` is the core data structure managing unconfirmed MimbleWimble transactions. It enforces consensus rules (e.g., fee floor, input/output commitment uniqueness, lock height), maintains a bounded size based on total weight, and tracks transaction state relative to the current blockchain state.\n\n### Preconditions\n* All internal maps (`entries`, `spends`, `creates`, `kernels`) are initialized correctly.\n\n### Postconditions\n* The mempool accurately reflects the set of valid, unconfirmed transactions adhering to MimbleWimble consensus rules and weight limits.\n\n### Z Notation (informal)\n$$ \\text{Mempool} \\triangleq \\{ \\text{entries}: \\text{Map}(\\text{Hash}, \\text{Entry}), \\text{total\\_weight}: \\mathbb{N}, \\dots \\} $$\n\n### Doc comment\n```rust\n/// Transaction pool managing unconfirmed MimbleWimble transactions, enforcing fee floors and bounded size.\n#[derive(Default)]\npub struct Mempool { ... }\n```\n\n## `Mempool::new`\n\n### Reasoning\nProvides a standard way to initialize an empty mempool instance.\n\n### Preconditions\n* None.\n\n### Postconditions\n* A new, empty `Mempool` is returned.\n\n### Z Notation (informal)\n$$ \\text{new}() \\rightarrow \\text{Mempool} \\mid \\text{Mempool}.\\text{entries} = \\emptyset $$\n\n### Doc comment\n```rust\n/// Creates a new, empty Mempool.\npub fn new() -> Self { ... }\n```\n\n## `Mempool::len`, `Mempool::is_empty`, `Mempool::total_weight`, `Mempool::contains`, `Mempool::transactions`, `Mempool::hashes`, `Mempool::get`\n\n### Reasoning\nThese are standard accessor methods providing read-only views into the state of the mempool (size, weight, existence checks, and retrieval of transactions/hashes).\n\n### Preconditions\n* None.\n\n### Postconditions\n* Returns the requested metric or reference without modifying the mempool state.\n\n### Z Notation (informal)\n$$ \\text{len}() \\rightarrow |\\text{Mempool}.\\text{entries}| $$\n\n### Doc comment\n*(Standard accessor documentation)*\n\n## `Mempool::check`\n\n### Reasoning\nPerforms comprehensive validation on a candidate transaction against the current mempool state and the provided blockchain state. This ensures the transaction adheres to consensus rules (fee floor, lock height) and does not conflict with existing pool contents (double spending, commitment collisions).\n\n### Preconditions\n* `tx` is a valid `Transaction`.\n* `state` reflects the latest confirmed block state.\n* If `already_validated` is true, the caller guarantees structural and sum validity; otherwise, full validation is performed.\n\n### Postconditions\n* If successful, the transaction is deemed valid for inclusion in the pool.\n* If validation fails (e.g., conflict, insufficient fee, time lock), a descriptive error (`anyhow::Error`) is returned.\n* The mempool state remains unchanged.\n\n### Z Notation (informal)\n$$ \\text{check}(\\text{tx}, \\text{state}, \\text{validated}) \\rightarrow \\begin{cases} \\text{Ok}() & \\text{if } \\text{tx} \\text{ is valid and non-conflicting} \\\\ \\text{Error} & \\text{otherwise} \\end{cases} $$\n\n### Doc comment\n```rust\n/// Validates a transaction against pool contents and current state, checking fee floors, time locks, and commitment conflicts.\npub fn check(&self, tx: &Transaction, state: &State, already_validated: bool) -> Result<()> { ... }\n```\n\n## `Mempool::add`\n\n### Reasoning\nAttempts to insert a new transaction into the mempool. Crucially, it implements the bounded size policy: if adding the transaction exceeds `MAX_POOL_WEIGHT`, it iteratively evicts the lowest fee-rate transactions until space is available, provided the new transaction has a strictly higher rate than the evicted candidates.\n\n### Preconditions\n* The transaction must pass `Mempool::check`.\n* The mempool state must be consistent.\n\n### Postconditions\n* If successful, the transaction is inserted, and `total_weight` is updated.\n* If the pool is full and the new transaction does not have a higher fee rate than the lowest-rate existing transaction, an error (\"mempool full\") is returned.\n* The mempool size remains $\\le \\text{MAX\\_POOL\\_WEIGHT}$.\n\n### Z Notation (informal)\n$$ \\text{add}(\\text{tx}, \\text{state}, \\text{validated}) \\rightarrow \\begin{cases} \\text{Ok}() & \\text{if } \\text{Mempool}' = \\text{Mempool} \\cup \\{\\text{tx}\\} \\land \\text{Weight}(\\text{Mempool}') \\le \\text{MAX\\_POOL\\_WEIGHT} \\\\ \\text{Error} & \\text{otherwise} \\end{cases} $$\n\n### Doc comment\n```rust\n/// Validates and inserts a transaction. Evicts lower-fee-rate transactions if the pool is full to make space.\npub fn add(&mut self, tx: Transaction, state: &State, already_validated: bool) -> Result<()> { ... }\n```\n\n## `Mempool::insert` / `Mempool::remove`\n\n### Reasoning\nThese are internal helper methods responsible for atomically updating all tracking structures (`entries`, `spends`, `creates`, `kernels`) and maintaining the `total_weight` counter when a transaction is added or removed.\n\n### Preconditions\n* `Entry` must be valid (for `insert`).\n* `hash` must exist in `self.entries` (for `remove`).\n\n### Postconditions\n* **`insert`**: The transaction and its commitments are correctly registered, and `total_weight` increases by the transaction's weight.\n* **`remove`**: The transaction is removed, all associated commitments are cleared from tracking maps, and `total_weight` decreases.\n\n### Z Notation (informal)\n$$ \\text{insert}(\\text{e}) \\rightarrow \\text{Mempool}' \\mid \\text{Mempool}'.\\text{total\\_weight} = \\text{Mempool}.\\text{total\\_weight} + \\text{Weight}(\\text{e}) $$\n\n### Doc comment\n*(Internal helper methods, minimal public documentation needed)*\n\n## `Mempool::on_block`\n\n### Reasoning\nHandles the transition of the mempool state after a new block (`batch`) is confirmed. It identifies transactions that were successfully mined (kernels present in the block) and those that are now invalid (inputs spent by the block, kernel collision). Mined transactions are removed from the pool and returned for caching; doomed transactions are simply dropped.\n\n### Preconditions\n* `batch` represents a valid, applied block body.\n* `state` is the resulting state after applying `batch`.\n\n### Postconditions\n* All mined transactions are removed from `self.entries` and returned in the result vector.\n* All doomed transactions are removed from `self.entries`.\n* `Mempool::revalidate(state)` is called to clean up any remaining transactions that became invalid due to state changes (e.g., time lock expiration).\n\n### Z Notation (informal)\n$$ \\text{on\\_block}(\\text{batch}, \\text{state}) \\rightarrow (\\text{Mempool}', \\text{MinedTx}) \\mid \\text{MinedTx} = \\{\\text{tx} \\in \\text{Mempool} \\mid \\text{tx} \\text{ mined}\\} $$\n\n### Doc comment\n```rust\n/// Updates the pool after a block is applied. Returns transactions that were successfully mined, which are then cached for potential reorg restoration.\npub fn on_block(&mut self, batch: &Batch, state: &State) -> Vec<Transaction> { ... }\n```\n\n## `Mempool::revalidate`\n\n### Reasoning\nA cleanup function called after state changes (like `on_block`). It iterates through all remaining pool transactions and checks if they are still valid against the new `state` (e.g., checking lock height or re-running `apply_body` to detect input/output conflicts). Invalid transactions are removed.\n\n### Preconditions\n* `state` is the current, authoritative blockchain state.\n\n### Postconditions\n* All transactions in `self.entries` that violate consensus rules relative to `state` are removed.\n* The mempool state is consistent with the provided `state`.\n\n### Z Notation (informal)\n$$ \\text{revalidate}(\\text{state}) \\rightarrow \\text{Mempool}' \\mid \\forall \\text{tx} \\in \\text{Mempool}'.\\text{entries}, \\text{tx} \\text{ is valid w.r.t. } \\text{state} $$\n\n### Doc comment\n```rust\n/// Drops every transaction that no longer applies (e.g., time lock expired, input spent) on the current state.\npub fn revalidate(&mut self, state: &State) { ... }\n```\n\n## `Mempool::candidates`\n\n### Reasoning\nProvides a prioritized list of transactions from the pool, sorted by fee rate (highest first). This list is used by block template builders to select optimal transactions for inclusion in the next block.\n\n### Preconditions\n* The mempool must be non-empty.\n\n### Postconditions\n* Returns a `Vec<Transaction>` sorted descending by `Entry::rate()`.\n* The mempool state remains unchanged.\n\n### Z Notation (informal)\n$$ \\text{candidates}() \\rightarrow \\text{SortedList}(\\text{Mempool}.\\text{entries}, \\text{by\\_rate\\_desc}) $$\n\n### Doc comment\n```rust\n/// Returns all transactions in the pool, sorted by fee rate (highest first), suitable for block template construction.\npub fn candidates(&self) -> Vec<Transaction> { ... }\n```\n\n## `ReorgCache`\n\n### Reasoning\nThe `ReorgCache` stores transactions that were successfully mined in recent blocks. This is critical for handling chain reorganizations (reorgs); if a block is orphaned, the cached transactions can be restored to the mempool for inclusion in the new, shorter chain. It maintains a bounded size (`REORG_CACHE_BLOCKS`).\n\n### Preconditions\n* None.\n\n### Postconditions\n* The cache holds a chronological record of mined transactions up to `REORG_CACHE_BLOCKS` blocks deep.\n\n### Z Notation (informal)\n$$ \\text{ReorgCache} \\triangleq \\{ \\text{blocks}: \\text{Deque}(\\langle \\mathbb{N}, \\text{List}(\\text{Transaction}) \\rangle) \\} $$\n\n### Doc comment\n```rust\n/// Stores recently mined transactions, allowing them to be restored to the mempool if a block reorganization occurs.\n#[derive(Default)]\npub struct ReorgCache { ... }\n```\n\n## `ReorgCache::record`\n\n### Reasoning\nAdds a batch of mined transactions associated with a specific block height to the cache, enforcing the maximum size limit by dropping the oldest entries.\n\n### Preconditions\n* `height` is a valid block height.\n* `txs` are the transactions mined in that block.\n\n### Postconditions\n* The new entry is added to the back of the queue.\n* If the queue exceeds `REORG_CACHE_BLOCKS`, the oldest entry is removed from the front.\n\n### Z Notation (informal)\n$$ \\text{record}(\\text{h}, \\text{txs}) \\rightarrow \\text{Cache}' \\mid |\\text{Cache}'.\\text{blocks}| \\le \\text{REORG\\_CACHE\\_BLOCKS} $$\n\n### Doc comment\n```rust\n/// Records a set of mined transactions associated with a specific block height, maintaining the cache size limit.\npub fn record(&mut self, height: u64, txs: Vec<Transaction>) { ... }\n```\n\n## `ReorgCache::since`\n\n### Reasoning\nRetrieves all cached transactions that were mined at or after a specified height. This is used to determine which transactions should be considered for re-inclusion during a reorg event.\n\n### Preconditions\n* `height` is a valid block height.\n\n### Postconditions\n* Returns a list of all transactions from blocks $\\ge \\text{height}$.\n* The cache state remains unchanged.\n\n### Z Notation (informal)\n$$ \\text{since}(\\text{h}) \\rightarrow \\{\\text{tx} \\mid \\exists (\\text{h}', \\text{txs}) \\in \\text{Cache}.\\text{blocks}, \\text{h}' \\ge \\text{h}, \\text{tx} \\in \\text{txs}\\} $$\n\n### Doc comment\n```rust\n/// Retrieves all cached transactions mined at or after the specified height, suitable for reorg restoration.\npub fn since(&self, height: u64) -> Vec<Transaction> { ... }\n```\n\n## `ReorgCache::take_from`\n\n### Reasoning\nRemoves and returns all cached transactions mined at or after a specified height. This is used when the chain has stabilized past that height, allowing the cache to be pruned efficiently from the back (most recent blocks).\n\n### Preconditions\n* `height` is a valid block height.\n\n### Postconditions\n* Returns a list of transactions from blocks $\\ge \\text{height}$.\n* All corresponding entries are removed from the back of the internal queue (`blocks`).\n\n### Z Notation (informal)\n$$ \\text{take\\_from}(\\text{h}) \\rightarrow (\\text{Cache}', \\text{MinedTx}) \\mid \\text{MinedTx} = \\{\\text{tx} \\mid \\exists (\\text{h}', \\text{txs}) \\in \\text{Cache}.\\text{blocks}, \\text{h}' \\ge \\text{h}\\} $$\n\n### Doc comment\n```rust\n/// Removes and returns all cached transactions mined at or after the specified height, pruning the cache.\npub fn take_from(&mut self, height: u64) -> Vec<Transaction> { ... }\n```"}, {"path": "merge_mine.rs", "module": "(root)", "doc": "## Documentation for `merge_mine.rs`\n\n### `MergeMineConfig` (Struct)\n**Reasoning**: Defines all necessary configuration parameters for the merged mining process, including RPC endpoints, addresses, thread count, and logging paths.\n**Preconditions**: All fields must be correctly initialized (e.g., valid RPC URLs, correct address sizes).\n**Postconditions**: Provides a complete, immutable configuration set for the `run` function.\n**Z Notation (informal)**: $\\text{Config} \\triangleq \\{\\text{midstate\\_rpc}, \\text{midwimble\\_rpc}, \\dots\\}$\n**Doc comment**:\n```rust\n/// Configuration parameters for the merged mining process.\n#[derive(Clone, Debug)]\npub struct MergeMineConfig {\n    // ... fields\n}\n```\n\n### `MergeStats` (Struct)\n**Reasoning**: Tracks operational metrics (rounds, accepted blocks, hashes) across the mining process using atomic counters for thread safety.\n**Preconditions**: Must be initialized (e.g., via `Default::default()`).\n**Postconditions**: Holds an accurate, thread-safe count of mining activity up to the point of reading.\n**Z Notation (informal)**: $\\text{Stats} \\triangleq \\{\\text{rounds}: \\mathbb{N}, \\text{midstate\\_blocks}: \\mathbb{N}, \\dots\\}$\n**Doc comment**:\n```rust\n/// Thread-safe statistics tracking for the merged mining operation.\n#[derive(Debug, Default)]\npub struct MergeStats {\n    // ... fields\n}\n```\n\n### `decompose_value` (Function)\n**Reasoning**: Implements Midstate's specific requirement to decompose a total reward value into a sorted list of powers of two, corresponding to the required coinbase outputs.\n**Preconditions**: `value` must be a non-negative `u64`.\n**Postconditions**: Returns a `Vec<u64>` containing the set bits of `value`, sorted in ascending order (powers of two).\n**Z Notation (informal)**: $\\text{Decompose}(V) = \\{2^k \\mid V \\& 2^k \\neq 0\\} \\land \\text{Sorted}$\n**Doc comment**:\n```rust\n/// Decomposes a Midstate total value into a sorted list of powers of two,\n/// representing the required coinbase outputs.\npub fn decompose_value(mut value: u64) -> Vec<u64> { /* ... */ }\n```\n\n### `midstate_expected_total` (Function)\n**Reasoning**: Queries the Midstate RPC to determine the exact total reward amount expected for the current coinbase transaction, which is necessary for calculating the required outputs.\n**Preconditions**: `midstate` RPC client must be connected and operational. The `/block_template` endpoint must return a non-error status code (2xx) containing an `expected_total`.\n**Postconditions**: Returns `Ok(u64)` representing the expected total reward, or an error if the response is malformed or indicates an unexpected state (e.g., empty coinbase accepted).\n**Z Notation (informal)**: $\\text{ExpectedTotal}(MS) = \\text{RPC\\_Query}(MS, \\text{\"/block\\_template\"}) \\rightarrow u64$\n**Doc comment**:\n```rust\n/// Fetches the expected total coinbase reward from the Midstate node.\nfn midstate_expected_total(midstate: &RpcClient) -> Result<u64> { /* ... */ }\n```\n\n### `midwimble_pow` (Function)\n**Reasoning**: Parses the `pow` field from a Midwimble template to determine which Proof-of-Work algorithm the block requires, defaulting to `Blake3Chain` if unspecified.\n**Preconditions**: `tpl` must be a valid JSON representation of a Midwimble template.\n**Postconditions**: Returns `Ok(PowAlgo)` indicating the required PoW, or an error if an unknown PoW name is provided.\n**Z Notation (informal)**: $\\text{MW\\_PoW}(T) = \\begin{cases} \\text{Blake3Chain} & \\text{if } T.\\text{\"pow\"} \\text{ is absent} \\\\ \\text{Parse}(T.\\text{\"pow\"}) & \\text{otherwise} \\end{cases}$\n**Doc comment**:\n```rust\n/// Determines the required Proof-of-Work algorithm from a Midwimble template.\nfn midwimble_pow(tpl: &Value) -> Result<PowAlgo> { /* ... */ }\n```\n\n### `prepare` (Function)\n**Reasoning**: Orchestrates the initial setup for a mining round: fetching templates from both nodes, calculating the required coinbase outputs (including the merge commitment in the last output's salt), and verifying that the Midstate template is consistent with the expected merged state.\n**Preconditions**: `cfg`, `ms`, `mw` must be valid RPC clients. `nonce_seed` must be a 32-byte seed. Both nodes must respond successfully to `/state` and `/mining/template`/`/block_template`.\n**Postconditions**: Returns `Ok(Round)` containing all necessary data (targets, templates, coinbase outputs, PoW algorithm, and merge status) for the search phase, or an error if any RPC call fails or consistency checks fail.\n**Z Notation (informal)**: $\\text{Prepare}(C, MS, MW, S) \\rightarrow \\text{Round} \\lor \\text{Error}$\n**Doc comment**:\n```rust\n/// Fetches templates and prepares all necessary data for a single mining round,\n/// including calculating the coinbase outputs and verifying merge consistency.\nfn prepare(\n    cfg: &MergeMineConfig,\n    ms: &RpcClient,\n    mw: &RpcClient,\n    nonce_seed: &[u8; 32],\n) -> Result<Round> { /* ... */ }\n```\n\n### `search` (Function)\n**Reasoning**: Abstracts the actual Proof-of-Work computation, dispatching to either GPU or CPU mining implementations based on feature flags.\n**Preconditions**: `algo`, `mining_hash`, and `target` must be valid PoW parameters. `cancel` must be an active cancellation signal.\n**Postconditions**: Returns `Some(MiningResult)` if a valid proof is found within the constraints, or `None` if cancelled or time runs out.\n**Z Notation (informal)**: $\\text{Search}(A, H, T, \\dots) \\rightarrow \\text{MiningResult} \\lor \\text{None}$\n**Doc comment**:\n```rust\n/// Executes the Proof-of-Work search using configured hardware (GPU or CPU).\nfn search(\n    algo: PowAlgo,\n    mining_hash: [u8; 32],\n    target: [u8; 32],\n    threads: usize,\n    cancel: Arc<AtomicBool>,\n    counter: Arc<AtomicU64>,\n) -> Option<MiningResult> { /* ... */ }\n```\n\n### `log_coinbase` (Function)\n**Reasoning**: Persists a record of every Midstate coinbase output to a JSONL log file, crucial for tracking rewards and ensuring spendability via the salt.\n**Preconditions**: `cfg` must point to a writable `coinbase_log` path. `round` must contain valid coinbase data.\n**Postconditions**: Appends a single JSON line record to the specified log file, detailing the output, height, acceptance status, and derived coin ID.\n**Z Notation (informal)**: $\\text{Log}(C, R, A, E) \\rightarrow \\text{FileAppend}(C.\\text{log}, \\text{JSON\\_Record})$\n**Doc comment**:\n```rust\n/// Logs the details of every Midstate coinbase output to the configured JSONL file.\nfn log_coinbase(cfg: &MergeMineConfig, round: &Round, accepted: bool, error: Option<String>) { /* ... */ }\n```\n\n### `run` (Function)\n**Reasoning**: The main execution loop for the merged miner. It continuously prepares rounds, monitors chain tips, performs PoW search, submits results to both Midstate and Midwimble, and manages anchor recording.\n**Preconditions**: `cfg` must be complete. `stop` must be an active cancellation signal. `stats` must be a valid statistics tracker.\n**Postconditions**: Returns `Ok(())` upon external stop signal or error; otherwise, returns an `Err` detailing the failure. The process terminates when `stop` is set.\n**Z Notation (informal)**: $\\text{Run}(C, S) \\rightarrow \\text{Termination} \\land (\\forall t: \\text{State}_t \\subseteq \\text{State}_{t+1})$\n**Doc comment**:\n```rust\n/// Main entry point for the merged mining process. Runs until the `stop` signal is set.\n/// This function is blocking and should be called from a dedicated thread.\npub fn run(cfg: MergeMineConfig, stop: Arc<AtomicBool>, stats: Arc<MergeStats>) -> Result<()> { /* ... */ }\n```"}, {"path": "miner.rs", "module": "(root)", "doc": "## `search` function\n\n**Reasoning**: This function acts as a backend dispatcher, selecting between the GPU mining implementation (if the `gpu` feature is enabled and configured) or the SIMD CPU extension (`mine_extension`). It abstracts the underlying mining mechanism from the coordination logic.\n**Preconditions**:\n1. `algo`, `mining_hash`, and `target` must be valid inputs derived from the block template.\n2. `threads` must be a positive integer (or 0, handled internally).\n3. `cancel` and `counter` must be valid `Arc` references to atomic synchronization primitives.\n**Postconditions**:\n1. If GPU mining is available and used, it returns `Option<MiningResult>` from `crate::core::gpu_mining::mine`.\n2. If CPU mining is used, it returns `Option<MiningResult>` from `crate::core::extension::mine_extension`.\n3. The `counter` is updated by the underlying miner during execution.\n**Z Notation (informal)**:\n$$ \\text{search}(\\text{algo}, \\text{hash}, \\text{target}, \\text{threads}, \\text{cancel}, \\text{counter}) \\rightarrow \\text{MiningResult} $$\n**Doc comment**:\n```rust\n/// Dispatches the mining operation to the appropriate backend (GPU or SIMD CPU).\nfn search(...) -> Option<MiningResult> { /* ... */ }\n```\n\n## `MinedBlock` struct\n\n**Reasoning**: This structure encapsulates the successful result of a mining job, linking the resulting block data (`batch`) back to the specific job ID that produced it.\n**Preconditions**: None (simple data container).\n**Postconditions**: None.\n**Z Notation (informal)**:\n$$ \\text{MinedBlock} = \\{ \\text{job}: \\mathbb{N}, \\text{batch}: \\text{Batch} \\} $$\n**Doc comment**:\n```rust\n/// Represents a successfully mined block, including the job ID and the resulting batch data.\npub struct MinedBlock { /* ... */ }\n```\n\n## `Miner` struct\n\n**Reasoning**: The `Miner` struct is the primary coordinator for mining tasks. It manages state (job count, thread count), controls the lifecycle of the mining thread (start/stop), and provides a channel (`result_tx`) for external consumers to receive successful block results.\n**Preconditions**: None (simple data container).\n**Postconditions**: None.\n**Z Notation (informal)**:\n$$ \\text{Miner} = \\{ \\text{threads}: \\mathbb{N}, \\text{cancel}: \\text{Option}(\\text{Arc}<\\text{AtomicBool}>), \\text{job}: \\mathbb{N}, \\text{result\\_tx}: \\text{mpsc::UnboundedSender}(\\text{MinedBlock}), \\text{hashes}: \\text{Arc}<\\text{AtomicU64}> \\} $$\n**Doc comment**:\n```rust\n/// Coordinates the mining process, managing threads, job state, and result delivery.\npub struct Miner { /* ... */ }\n```\n\n## `Miner::new` method\n\n**Reasoning**: Initializes the `Miner` state and sets up the asynchronous communication channel (`mpsc`) required for the miner thread to report results back to the caller.\n**Preconditions**: `threads` must be a non-negative integer.\n**Postconditions**:\n1. A new `Miner` instance is created with the specified thread count.\n2. An unbounded receiver (`mpsc::UnboundedReceiver<MinedBlock>`) is returned, allowing external consumption of results.\n3. The internal hash counter is initialized to 0.\n**Z Notation (informal)**:\n$$ \\text{new}(\\text{threads}) \\rightarrow (\\text{Miner}, \\text{Receiver}) \\land \\text{Miner}.\\text{threads} = \\text{threads} $$\n**Doc comment**:\n```rust\n/// Creates a new Miner instance, returning the miner and a receiver for mined block results.\n/// `threads == 0` uses every available core.\npub fn new(threads: usize) -> (Self, mpsc::UnboundedReceiver<MinedBlock>) { /* ... */ }\n```\n\n## `Miner::start` method\n\n**Reasoning**: Initiates a new mining job. It increments the job counter, sets up cancellation mechanisms, and spawns a dedicated OS thread to execute the `search` function using the provided block template.\n**Preconditions**:\n1. The miner must not already be running (or `stop()` m
